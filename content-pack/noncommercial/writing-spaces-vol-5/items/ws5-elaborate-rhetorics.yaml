  <p>Teacher Resources for “Elaborate Rhetorics”</p>

  <h3>Overview and Teaching Strategies</h3>

  <p>This essay introduces students to rhetoric as both an applied and productive art, then encourages
  them to reflect on a definition of rhetoric that accounts for both of these functions. The premise is
  that having a working definition of rhetoric helps students understand that it involves more than just
  persuasion or, worse, lying, and instead provides the generative principles for elaborating a subject
  (invention) and contextualizing it in situations that matter. A rich definition is generative; that
  is, it aids in the invention and discovery of new knowledge. In this case, that knowledge is about rhetoric,
  how and why it works (or not), and what writers should know if they hope to make it work for them.</p>

  <p>At least since Plato in Phaedrus and Gorgias, we’ve known that writers need more than just the recipe
  rhetorics provided by handbooks, the prescriptive rules and procedures for producing good writing. Knowledge
  about rhetoric is often equated with such rules and procedures. This essay suggests, however, that knowledge
  about rhetoric should include how and why it achieves its effects, how to put it to use to answer questions
  about what to write and how to write it, as well as what these choices reveal, hide, or ignore. What
  can our writing do? What difference can it make? Why does answering these questions even matter? In
  the end, rhetoric is a much more interesting and complex concept than we’re led to believe. Because
  we think with concepts, not just about them, a healthy appreciation for rhetoric as an art for elaborating
  or exploiting ambiguity to foster identification helps writers discover what to say and how to say it
  to achieve their goals.</p>

  <p>I encourage students at all levels to develop their own definition of rhetoric, one that includes
  terms that help them see and explain how writing works across a broad range of media, contexts, and
  purposes. The rhetorical knowledge they generate can serve them well when faced with unfamiliar situations
  or genres. They learn to ask smart questions about these situations that can in turn lead to strategies
  for addressing them without having to rely on what they remember reading in a handbook. A rich definition
  of rhetoric can act as transferable knowledge and thus transcends the particulars of any given situation.</p>

  <p>This sort of rhetorical inquiry can be the cornerstone in courses that value writing about writing
  (WAW); that teach writers to reflect on and represent identities of privilege, race, gender, class,
  disability, ethnicity, sexual orientation (the nature and presence/absence of identity, identification,
  and division); and that encourage students to research and write about applied rhetorics of social justice,
  activism, and social change.</p>

  <h3>Sample Assignment</h3>

  <p>Prompt: You have read about the importance of identification and identity in the productive art of
  rhetoric. People have long recognized that identity is an important aspect of communication and social
  life. We have sought new ways to define, reshape, re-imagine, and refashion identity, often focusing
  on images of the self and the body. As media and medical technologies make it easier to define and reshape
  images of the self and the body, people have experimented with a variety of techniques that from a rhetorical
  perspective convey both curiosity and anxiety about what our bodies and our public image convey about
  identity.</p>

  <p>Write an essay that examines a particularly interesting case of what we might call “self-fashioning.”
  You could focus on someone you know or even yourself. Or you could focus on a popular figure. Describe
  in detail the nature of the image/self that has been fashioned, then consider these questions:</p>

  <p>1. What specific techniques do people use to refashion bodies and selves? (Think of changes related
  to appearance, including what people wear, how they look physically, what they do with their hair, how
  they decorate the body and the face, whether they literally reshape, re-color, or pierce the body, and
  so on.)</p>

  <p>2. What seems to be the purpose of this self-fashioning?</p>

  <p>3. What effects has the self-fashioning had on the individual and their public image?</p>

  <p>4. How might social media perpetuate this ethic of performing the self in a public venue? What negative
  consequences do you see?</p>

  <p>5. How might the images of identity people construct reflect or subvert cultural values?</p>

  <p>6. What is rhetorical about this self-fashioning?</p>

  <h3>Discussion Questions and Prompts</h3>

  <p>1. Exploring Rhetoric. Find three uses of the term rhetoric in the news, then explain what these
  uses reveal about the nature and function of rhetoric. What do these uses of rhetoric have in common?
  How do they differ?</p>

  <p>2. Elaborating Ambiguity. Find an important ambiguous term in public life, one people refer to often
  but that may have multiple or uncertain meanings, then elaborate that ambiguity.</p>

  <p>3. The word ambiguous derives from the Latin prefix ambi (“both, around”) and the root aġere (“drive,
  lead”). Ambiguous, according to the Dictionary of Word Origins by John Ayto, carries the etymological
  notion of “wandering around uncertainly” (22; Arcade, 1990). Its relatives include ambivalent, ambidexterous,
  agent, and act (the latter two from the root aġere). Ambiguity makes multiple interpretations possible,
  each of which may be legitimate and thus contestable.</p>

  <p>4. Exploiting Ambiguity. In some situations, you want to persuade someone to take a specific course
  of action or to change an attitude. Using the term you chose in #2, choose one of the term’s meanings,
  then write a paragraph that uses that meaning to change someone’s attitude about it.</p>

  <p>5. Rhetorician Kenneth Burke once wrote in a concrete poem called a “Flowerish” (a pun on “flourish”),
  “From the very start, our terms jump to conclusions.” What do you think he had in mind? In what ways
  do our terms, our vocabulary, determine what can be known? Spoken? Seen? What might our terms filter
  from view? Provide one or more examples.</p>'
