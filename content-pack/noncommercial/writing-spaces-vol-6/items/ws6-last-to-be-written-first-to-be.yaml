  <h3>Teacher Resources</h3>

  <p>Overview and Teaching Strategies These writing tasks are often drafted at one or more of three points
  during a larger project, report, or team task:</p>

  <ul><li>When the large or whole project/report is complete, • When a phase or stage of a project is
  completed, or • When an expected need, development occurs.</li></ul>

  <p>This chapter can be taught when discussing any of these situations. By focusing on the purpose, audience,
  and main point(s), this chapter provides students with a mechanism for examining their projects/reports,
  and writing concise and useful memos, abstracts, and executive summaries.</p>

  <p>When teaching these tasks, instructors need to make students aware that:</p>

  <ul><li>Each of these writing tasks have conventions in format, tone, and organization that need to
  be met to allow them to be read quickly.</li><li>Each of these writing tasks should be completed after
  the larger task/project/report is complete.</li></ul>

  <p>To this end, students need to learn the core idea that for them to write these writing assignments
  well they must know their projects/reports well. The framework in this chapter for each writing task
  provides students with questions that help them examine their projects/reports, and a mechanism for
  pulling that understanding into concise and organized piece of writing.</p>

  <h3>Discussion Questions</h3>

  <p>To help students explore and develop the ideas discussed in this chapter, consider having them address—as
  individuals, in small teams, or as a class—the following questions:</p>

  <p>1. By knowing who you are writing to, your reader/audience, how does that help you shape the information
  in each section of a memo? In each section of the executive summary? How does the reader’s/audience’s
  position in the organization, background information on the project inform what you include?</p>

  <p>2. This chapter provides strategies for organizing each of the three writing assignments. What role
  does the organization of your main points—in all three types of writing—play in terms of the ability
  of reader to transition to reading the main report/project and not be confused? What are some examples
  of poorly organizing your main points?</p>

  <p>3. What are your assumptions about concise versus short pieces of writing? Is concise writing always
  short? What are aspects of a piece of writing that make it concise? What is challenging about writing
  concisely?</p>

  <p>4. It is often tempting, when you are done with a large project/report, to quickly draft the smaller
  writing tasks that are discussed in the chapter. What are some reasons to remember/recall about why
  devoting the time and effort to these writing tasks well is important?</p>

  <p>Examining these items can help students better reflect upon their projects/ reports and consider
  how to apply the ideas presented in each section to crafting well-organized and concise memos, abstracts,
  and executive summaries.</p>'
