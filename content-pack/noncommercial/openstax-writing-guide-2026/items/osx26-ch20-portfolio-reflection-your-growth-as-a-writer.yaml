body: '<p><em>Access for free at openstax.org.</em></p>

  <p>Portfolio Reflection: Your Growth as a Writer</p>

  <p>20</p>

  <h3>CHAPTER OUTLINE</h3>

  <p>20.1 Thinking Critically about Your Semester 20.2 Reflection Trailblazer: Sandra Cisneros 20.3 Glance
  at Genre: Purpose and Structure 20.4 Annotated Sample Reading: “Don’t Expect Congrats” by Dale Trumbore
  20.5 Writing Process: Looking Back, Looking Forward 20.6 Editing Focus: Pronouns 20.7 Evaluation: Evaluating
  Self-Reflection 20.8 Spotlight on … Pronouns in Context</p>

  <p>INTRODUCTION Reflecting on your work is an important step in your growth as a writer. Reflection
  allows you to recognize the ways in which you have mastered some skills and have addressed instances
  when your intention and execution fail to match. By recognizing previous challenges and applying learned
  strategies for addressing them, you demonstrate improvement and progress as a writer. This kind of reflection
  is an example of recursive (https://openstax.org/r/recursivity). At this point in the semester, you
  know that writing is a recursive process: you prewrite, you write, you revise, you edit, you reflect,
  you revise, and so on. In working through a writing assignment, you learn and understand more about
  particular sections of your draft, and you can go back and revise them. The ability to return to your
  writing and exercise objectivity and honesty about it is one of skills you have practiced during this
  journey. You are now able to evaluate your own work, accept another’s critique of your writing, and
  make meaningful revisions.</p>

  <p>In this chapter, you will review your work from earlier chapters and write a reflection that captures
  your growth, feelings, and challenges as a writer. In your reflection, you will apply many of the writing,
  reasoning, and evidentiary strategies you have already used in other papers—for example, analysis, evaluation,
  comparison and contrast, problem and solution, cause and effect, examples, and anecdotes. When looking
  at your earlier work, you may find that you cringe at those papers and wonder what you were thinking
  when you wrote them. If given that same assignment, you now would know how to produce a more polished
  paper. This response is common and is evidence that you have learned quite a bit about writing.</p>

  <p>20.1 Thinking Critically about Your Semester</p>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Reflect on and write about the development of composing processes and how those processes affect
  your work.</li><li>Demonstrate honesty and objectivity in reflecting on written work. You have written
  your way through a long semester, and the journey is nearly complete. Now is the time to step back and
  reflect on what you have written, what you have mastered, what skill gaps remain, and what you will
  do to continue growing and improving as a communicator. This reflection will be based on the work you
  have done and what you have learned during the semester. Because the subject of this reflection is you
  and your work, no further research is required. The information you need is in the work you have done
  in this course and in your head. Now, you will work to organize and transfer this information to an
  organized written text. Every assignment you have completed provides you with insight into your writing
  process as you think about the assignment’s purpose, its execution, and your learning along the way.
  The skill of reflection requires you to be critical and honest about your habits, feelings, skills,
  and writing. In the end, you will discover that you have made progress as a writer, perhaps in ways
  not yet obvious.</li></ul>

  <h2>Reflection Trailblazer: Sandra Cisneros</h2>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Identify and analyze an author’s reflections. • Demonstrate the ability to think critically
  about a writer’s reflections.</li></ul>

  <p>“She experiments, creating a text that is as succinct and flexible as poetry, snapping sentences
  into fragments.”</p>

  <h3>Finding a Home in Writing</h3>

  <p>Poet and novelist Sandra Cisneros (b. 1954) is best known for her novel The House on Mango Street
  (1983). Born in Chicago, Illinois, Cisneros was the only girl in a family of seven children. When she
  was a child, her father moved the family several times between Chicago and Mexico City, the capital
  of Mexico. With these moves back and forth between the two countries, Cisneros felt detached from both
  cultures, forcing her to create her own path to understand herself better.</p>

  <p>In school, Cisneros was encouraged to write poems and quickly became known for her writing. However,
  her interest in writing did not fully take hold until college, when she took a creative writing course.
  She graduated with a BA from Loyola University in Chicago in 1976 and earned an MFA from the Writers’
  Workshop at the University of Iowa in 1978. While there, she had an epiphany: “I was in this class,
  we were talking about memory and the imagination,… and I realized: ‘My god, I’m… different from everybody
  in this classroom’” (Rodríguez Aranda 65). This important reflection encouraged Cisneros to write about
  what others could not: her own experience. The unique part poetry, part prose writing style that she
  crafted to relay her experiences eventually found its place among traditional literary genres, giving
  voice to the once voiceless.</p>

  <p>In her memoir, A House of My Own: Stories from My Life (https://openstax.org/r/A_House) (2015), Cisneros
  reflects on her journey as a writer through subjects such as autonomy, home, culture, and environment.
  She does so by introducing her memories, which develop into a kind of dialogue between the young writer
  she once was and the successful writer she is today. In the title essay, “A House of My Own”—originally
  the introduction to the 25th anniversary edition of The House on Mango Street—Cisneros writes, “The
  young woman in this photograph is me.… She thinks stories are about beauty.” By describing herself in
  the third person from the vantage point of herself as a successful writer, Cisneros creates space for
  reflection—the act of thinking about the arc of her life. She wonders how this young woman with so many
  fears had the courage to chart her own path in life. Upon reflection, previously unexamined gifts from
  her parents provide some answers. In A House of My Own, Cisneros says that she became a writer because
  of her mother, “who was unhappy being a mother” and was “banging on the bars of her cell all her life,”
  and because of her father, who wanted Cisneros to marry and have babies and so didn’t mind if she “majored
  in something silly like English”: “In a sense, everything I have ever written has been for him, to win
  his approval.” Cisneros’s reflection suggests that in some ways, her life has been about rebirthing
  herself into a form that her mother would be proud of and a form her father would come to understand—a
  form beyond the circumstances of her original birth.</p>

  <p>This reflective dialogue across time mirrors the way in which Cisneros sees herself: as someone who
  writes from multiple perspectives. Being an American and a Mexican, she writes in two languages and
  uses elements of both cultures to create characters that she picks up from memory, chance meetings,
  visits to various places, and dreams. She cobbles these parts together to form a title or maybe just
  a first line, giving her mind time to percolate, waiting for the rest of the story to emerge. This is
  the work of reflection—giving oneself time to think, to make connections, to feel, and to put words
  to ideas.</p>

  <h3>Discussion Questions</h3>

  <p>1. In what ways did the realization that she was different from other students spur Sandra Cisneros’s
  journey as a writer?</p>

  <p>2. What is the purpose of reflection in Cisneros’s writing?</p>

  <p>3. What strategies does Cisneros use to generate reflective writing?</p>

  <p>4. What themes emerge when you think about your journey as a writer this semester? Do similarities
  exist between your themes and Cisneros’s? Explain</p>

  <p>5. What dialogue might emerge between the writer you were at the beginning of the semester and the
  writer you are now? If applicable, describe an epiphany, or sudden realization, you might have had about
  your writing.</p>

  <p>20.3 Glance at Genre: Purpose and Structure</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Identify conventions of reflection regarding structure,
  paragraphing, and tone. • Articulate how genre conventions are shaped by purpose, culture, and expectation.
  • Adapt composing processes for a variety of technologies and modalities.</p>

  <p>Reflective writing is the practice of thinking about an event, an experience, a memory, or something
  imagined and expressing its larger meaning in written form. Reflective writing comes from the author’s
  specific perspective and often contemplates the way an event (or something else) has affected or even
  changed the author’s life.</p>

  <h3>Areas of Exploration</h3>

  <p>When you write a reflective piece, consider three main areas of exploration as shown in Figure 20.3.
  The first is the happening. This area consists of the events included in the reflection. For example,
  you will be examining writing assignments from this course. As you describe the assignments, you also
  establish context for the reflection so that readers can understand the circumstances involved. For
  each assignment, ask yourself these questions: What was the assignment? How did I approach the assignment?
  What did I do to start this assignment? What did I think about the assignment? If you think of other
  questions, use them. Record your answers because they will prove useful in the second area.</p>

  <p>The second area is reflection. When you reflect on the happening, you go beyond simply writing about
  the specific details of the assignment; you move into the writing process and an explanation of what
  you learned from doing the work. In addition, you might recognize—and note—a change in your skills or
  way of thinking. Ask yourself these questions: What works effectively in this text? What did I learn
  from this assignment? How is this assignment useful? How did I feel when I was working on this assignment?
  Again, you can create other questions, and note your responses because you will use them to write a
  reflection.</p>

  <p>The third area is action. Here, you decide what to do next and plan the steps needed to reach that
  goal. Ask yourself: What does (and does not) work effectively in this text? How can I continue to improve
  in this area? What should I do now? What has changed in my thinking? How would I change my approach
  to this assignment if I had to do another one like it? Base your responses to these questions on what
  you have learned, and implement these elements in your writing.</p>

  <p>20.3 • Glance at Genre: Purpose and Structure 667</p>

  <h3>Format of Reflective Writing</h3>

  <p>Unlike thesis statements, which often come at the beginning of an essay, the main point of a piece
  of reflective writing may be conveyed only indirectly and nearly always emerges at the end, almost like
  an epiphany, or sudden realization. With this structure, readers are drawn into the act of reflecting
  and become more curious about what the writer is thinking and feeling. ln other words, reflective writers
  are musing, exploring, or wondering rather than arguing. In fact, reflective essays are most enlightening
  when they are not obviously instructive or assertive. However, even though reflective writing does not
  present an explicit argument, it still includes evidence and cohesion and provides lessons to be learned.
  As such, elements of persuasion or argument often appear in reflective essays.</p>

  <h3>Discovery through Writing</h3>

  <p>Keep in mind, too, that when you start to reflect on your growth as a writer, you may not realize
  what caused you to explore a particular memory. In other words, writers may choose to explore an idea,
  such as why something got their attention, and only by recalling the details of that event do they discover
  the reason it first drew their attention.</p>

  <p>When you tell the story of your writing journey this semester, you may find that more was on your
  mind than you realized. The writing itself is one thing, but the meaning of what you learned becomes
  something else, and you may deliberately share how that second level, or deeper meaning or feeling,
  emerged through the act of storytelling. For example, in narrating a writing experience, you may step
  back, pause, and let readers know, “Wait a minute, something else is going on here.” An explanation
  of the new understanding, for both you and your readers, can follow this statement. Such pauses are
  a sign that connections are being made—between the present and the past, the concrete and the abstract,
  the literal and the symbolic. They signal to readers that the essay or story is about to move in a new
  and less predictable direction. Yet each idea remains connected through the structure of happenings,
  reflections, and actions.</p>

  <p>Sometimes, slight shifts in voice or tone accompany reflective pauses as a writer moves closer to
  what is really on their mind. The exact nature of these shifts will, of course, be determined by the
  writer’s viewpoint. Perhaps one idea that you, as the writer, come up with is the realization that writing
  a position argument was useful in your history class. You were able to focus more on the material than
  on how to write the paper because you already knew how to craft a position argument. As you work through
  this process, continue to note these important little discoveries.</p>

  <h3>Your Writing Portfolio</h3>

  <p>As you recall, each chapter in this book has included one or more assignments for a writing portfolio.
  In simplest terms, a writing portfolio is a collection of your writing contained within a single binder
  or folder. A portfolio may contain printed copy, or it may be completely digital. Its contents may have
  been created over a number of weeks, months, or even years, and it may be organized chronologically,
  thematically, or qualitatively. A portfolio assigned for a class will contain written work to be shared
  with an audience to demonstrate your writing, learning, and skill progression. This kind of writing
  portfolio, accumulated during a college course, presents a record of your work over a semester and may
  be used to assign a grade. Many instructors now offer the option of, or even require, digital multimodal
  portfolios, which include visuals, audio, and/or video in addition to written texts. Your instructor
  will provide guidelines on how to create a multimodal portfolio, if applicable. You can also learn more
  about creating a multimodal portfolio (https://openstax.org/r/ creating) and view one by a first-year
  student (https://openstax.org/r/first-year).</p>

  <h3>Key Terms</h3>

  <p>As you begin crafting your reflection, consider these elements of reflective writing.</p>

  <ul><li>Analysis: When you analyze your own writing, you explain your reasoning or writing choices,
  thus showing that you understand your progress as a writer.</li><li>Context: The context is the circumstances
  or situation in which the happening occurred. A description of the assignment, an explanation of why
  it was given, and any other relevant conditions surrounding it would be its context.</li><li>Description:
  Providing specific details, using figurative language and imagery, and even quoting from your papers
  helps readers visualize and thus share your reflection. When describing, writers may include visuals
  if applicable.</li><li>Evaluation: An effective evaluation points out where you faltered and where you
  did well. With that understanding, you have a basis to return to your thoughts and speculate about progress
  you will continue to make in the future.</li><li>Observation: Observation is a close look at the writing
  choices you made and the way you managed the rhetorical situations you encountered. When observing,
  be objective, and pay attention to the more and less effective parts of your writing.</li><li>Purpose:
  By considering the goals of these previous assignments, you will be better equipped to look at them
  critically and objectively to understand their larger use in academia.</li><li>Speculation: Speculation
  encourages you to think about your next steps: where you need to improve and where you need to stay
  sharp to avoid recurring mistakes.</li><li>Thoughts: Your thoughts (and feelings) before, during, and
  after an assignment can provide you with descriptive material. In a reflective essay, writers may choose
  to indicate their thoughts in a different tense from the one in which they write the essay itself.</li></ul>

  <p>When you put these elements together, you will be able to reflect objectively on your own writing.
  This reflection might include identifying areas of significant improvement and areas that still need
  more work. In either case, focus on describing, analyzing, and evaluating how and why you did or did
  not improve. This is not an easy task for any writer, but it proves valuable for those who aim to improve
  their skills as communicators.</p>

  <p>20.4 Annotated Sample Reading: “Don’t Expect Congrats” by Dale Trumbore</p>

  <p>LEARNING OUTCOMES</p>

  <p>By the end of this section, you will be able to: • Identify and analyze the elements and organizational
  pattern of a reflective essay. • Demonstrate the ability to think critically about a writer’s reflections.</p>

  <h3>Introduction</h3>

  <p>20.4 • Annotated Sample Reading: “Don’t Expect Congrats” by Dale Trumbore 669</p>

  <p>Dale Trumbore (https://openstax.org/r/Dale_Trumbore) (b. 1987) is a Southern California composer
  and writer. In addition to composing for chorus and orchestra, Trumbore often writes reflectively about
  artistic conflict and its resolution. In her book Staying Composed (2019), she writes about the anxiety
  and self-doubt that often accompany a career in the arts: “You have to be willing to be a little vulnerable.
  Real people are flawed.” In the following blog post, she reflects on gender in her career field.</p>

  <p>LIVING BY THEIR OWN WORDS</p>

  <h3>Womanhood and Composition</h3>

  <p>I am a female composer. As such, my compositions have been programmed on a concert about motherhood,
  though I do not have children; neither did most of the other women programmed on that concert. I’ve
  been asked midcomposition to change the theme of a piece, so the commission would relate to womanhood.
  (I did, but I didn’t rewrite the minute-and-a-half of music I’d composed back when the commission’s
  theme was “outer space.”) I’ve been asked to sum up what it means to be a woman in a one-minute piece;
  I tried, but that piece ended up being about exactly how impossible the task is.</p>

  <p>Establishing Context. Trumbore sets up the conditions for this reflective essay by mentioning some
  of the challenges she has encountered and what she has done about them. She also mentions the difficulty
  of trying to “sum up” the entirety of her experience as a woman.</p>

  <p>The hundredth anniversary of the ratification of the 19th Amendment… in 2020… and the aftermath of
  the #MeToo movement have created a perfect storm of what I think of as Lady Composer Commissions: pieces
  that ask the composer to reflect the experience of being a woman in her work. Equally popular these
  days is the Lady Composer Concert, which 1) features works by composers who identify as women, and 2)
  connects the music of these composers for no reason other than that they all share a gender identity.</p>

  <p>Context. By providing additional context, Trumbore gives readers some background information and
  insight into the focus of the essay.</p>

  <p>Promotion of these concerts on social media often goes like this: “We’re so excited to feature the
  work of Lady Composer 1, Lady Composer 2, Lady Composer 3, Lady Composer 4 [etc.]!” The general tone
  of these posts seems to be: “Look at all of the women we rounded up! We found so many of them!” When
  I am tagged in these posts, I never know whether to share them, like them, or un-tag myself as quickly
  as possible and hope the conductor doesn’t notice.</p>

  <p>Observation. Trumbore points to part of the social and culture disparity between genders and questions
  how to respond. This reflection shows awareness of her discomfort and uncertainty about larger meanings.</p>

  <p>Now, I know these concerts mean well, and I would certainly never tell anyone to stop programming
  the works of underrepresented composers. As someone who relies on commissions and royalties to pay the
  rent, I’m also grateful to have my music programmed on any concert at all. But every time I’m tagged
  in a post for a concert like this—with no theme other than “Here’s A Bunch of Lady Composers”—I feel
  as though someone has drawn a sharpedged square around my identity. I am positive that these concerts
  are programmed with earnest and kind intentions; nevertheless, they make me wonder whether any conductor
  thinks I want to be programmed like this, like I am some exotic and fragile butterfly to be pinned down,
  labeled appropriately, and locked away in a glass box.</p>

  <p>Purpose. Trumbore uses reflection to see the larger purpose of the concerts. She also questions that
  purpose and uses the metaphor of a butterfly to emphasize the situation as she leads into the main purpose
  of the essay.</p>

  <p>One of my two cats, Cotton, is obsessed with catching and eating flies. He’ll stalk one around our
  small house for hours before he finally catches and eats the thing, and he’s nearly always more preoccupied
  with the stalking than the meal itself. But immediately after he’s finally caught one, he comes over
  to my husband or me and meows, wanting recognition for his work: a gentle pat on the head, maybe, or
  a “Good job!” In our house, we call this routine “congrats,” as in: “Cotton just swallowed his second
  fly of the day, then came over for more congrats.”</p>

  <p>Vignette and Description. Trumbore breaks the flow of the essay with a vignette—a brief scene—offering
  a look into her life. The vignette connects this part of the essay with the next and establishes a concrete
  example of her feelings.</p>

  <p>This is exactly how the Lady Composer Concerts and their inevitable social media promotion have started
  to feel to me: like they are an elaborate exercise in seeking congrats. They are not programmed with
  the audience in mind; if anything, they come off as self-congratulatory. (“Look how woke we are!”) If
  these concerts were serving the audience, they would have a theme beyond “a bunch of women wrote this
  music.”</p>

  <p>Metaphor. Trumbore compares the cat’s “congrats” routine with the promotion of the concerts.</p>

  <p>Purpose. In addition, she reiterates the larger purpose of the essay by highlighting the topic of
  gender disparity.</p>

  <p>All you need to do to find this concept ridiculous, of course, is to flip the gender: Imagine a conductor
  saying that any random collection of pieces clearly belong together on the same program, because they
  all were written by men.</p>

  <p>Analysis and Evaluation. Trumbore defines what is not a valid concert theme and suggests that readers
  consider a new position—to judge the gender inequality situation among composers as she does.</p>

  <p>I am certainly not the first person to talk about this; I give the above example of gender-flipping
  whenever I talk about Lady Composer Concerts, and I’ve heard other friends do the same. Still, every
  time I bring this up, I hope it will be for the last time: “Music by Women” is not a theme. Collecting
  a bunch of pieces written by female composers does not in and of itself constitute an inspired concert
  program. It certainly doesn’t deserve congrats.</p>

  <p>Analysis. Defining what she considers a theme, Trumbore continues to explain her position and elaborate
  on the reality she experiences.</p>

  <p>If you’re called to promote the work of composers who identify as women, consider—the same as you
  would with any other program—what the music and/or texts have in common. What’s the through-line of
  this music or collection of texts, regardless of the gender of who wrote it? Is the experience of hearing
  these particular compositions enhanced by virtue of their sharing a program? Does the order of the program
  present a narrative? Are there any other pieces, including pieces by composers who identify as men,
  that would better round out this particular program?</p>

  <p>Analysis. These questions engage the reader and beg for answers while again pointing to her reflection
  on the concerts.</p>

  <p>Speculation. Further, she is hinting at a way of changing the status quo in the questions she asks.</p>

  <p>Whenever I discuss “Women in Music”—something else I’m often asked to do—I’m struck once again by
  the fact that we’re somehow still having the conversation about the lack of Lady Composers. I feel conflicted
  whenever I’m asked to talk about the role of women in music; I wish we didn’t need to have that discussion,
  and I resent being asked to talk about it over and over again. At the same time, if I’d like to hear
  more conversations in the classical music world about systemic inequality—and I would—I have to be willing
  to talk about this myself.</p>

  <p>Thoughts and Speculation. Trumbore notes her frustrations with discussions focused on gender and
  music and then suggests that she would rather focus on the inequalities if she would be willing to discuss
  this issue.</p>

  <p>But a single Lady Composer Concert is unlikely to single-handedly resolve the fact that for centuries,
  classical music has revered the music of white, mostly dead, usually European men as the highest quality
  music of all time. In Music History classes, most of us are taught that this is the worthiest music
  to study. In Music Theory classes, we analyze these scores. Whenever we sing in a chorus, we are at
  the mercy of what our conductor presents as the worthiest music, and if that is exclusively the work
  of white and dead and European and male composers, who can blame us for subconsciously thinking that
  this is the music most worthy of programming?</p>

  <p>Thoughts and Context. Trumbore reflects on her education and notes some of the problematic, and perhaps
  sexist, elements of music education. Note again her use of questions to involve readers.</p>

  <p>We don’t (just) have a lack of Lady Composers or a dearth of Lady Composer Concerts. We have an entire
  educational system designed to teach us to esteem the music of dead white men above the music of all
  other composers.</p>

  <p>Analysis and Evaluation. Trumbore responds to her own question and expands her rationale of reconsidering
  music education. In addition, the brevity of this paragraph encourages readers to focus on the larger
  message in the last sentence.</p>

  <p>So I’m more than happy to congratulate anyone championing the work of historically underrepresented
  composers. Yes, please! Let’s talk about systemic oppression and racism and the discrimination that
  composers who are not white and/or male have faced for centuries. Let’s talk about implicit bias and
  financial privilege and how all of it affects which voices we perceive as most worthy of our attention.</p>

  <p>Speculation. Trumbore drives home the point of the previous paragraph and makes it more explicit
  for readers, indicating what she would like to see happen.</p>

  <p>And yet it’s equally important to acknowledge that no single concert will fix that systematic imbalance.
  If it was going to, the Lady Composer Concert would have already done this, because the Lady Composer
  Concert has been around for decades. The Lady Composer Concert is a stale concept; we’ve tried it already,
  and we’re still having this conversation.</p>

  <p>Speculation. In this paragraph, Trumbore suggests a potentially new direction and opportunity, on
  which she elaborates in the next paragraph. In other words, through this reflection, she has arrived
  at a new way of seeing the world.</p>

  <p>I want to propose an idea that is new, though. If you truly want to champion the works of historically
  underrepresented composers, what would it look like if you did the loudest work behind the scenes?</p>

  <p>What if you had bold conversations about why you feel compelled to program more historically underrepresented
  groups of composers, but for the concert itself, you presented your program the same way you would any
  other program—highlighting the specific compositions, thematic material, and the reasons that your audience
  should come hear this music?</p>

  <p>What if you championed compositions written by these composers without needing to mention their race
  or gender as part of the promotion of your concert? What if you identified instead what you find most
  meaningful, exceptional, and unique about their compositions?</p>

  <p>And what if you told your peers about these works that you love? Over time, maybe that specificity—naming
  the pieces you love, not just a string of composers’ names—would eliminate another common problem I’ve
  heard conductors discuss: trouble finding quality repertoire written by underrepresented composers.</p>

  <p>Analysis and Speculation. After a series of thoughtful questions about underrepresented groups of
  composers, Trumbore provides a way to move forward, not by giving directions, but by asking questions
  that lead readers to obvious answers.</p>

  <p>If you’re having trouble finding such repertoire, let your peers and friend-colleagues know that
  you’re searching for this work. Ask for recommendations. You can always reach out to composers directly
  with requests for perusal scores, too. I’m always more than happy to send along perusals when conductors
  are looking for new works, and I’m even happier if I’m asked for works that fit a specific theme. Getting
  to know a new composer’s work can be as simple as sending them a quick email through their website’s
  contact form. Ask if they have any pieces that might be a good fit for your upcoming concert season’s
  themes. You might even name some of the other works you already have in mind for that program and see
  if that composer can recommend compatible works from their catalogue.</p>

  <p>Thoughts and Speculation. This paragraph continues setting up a way to move forward and helps connect
  it to the previous paragraphs. It reveals more of Trumbore’s thoughts on what she wants to do and her
  ability to do it.</p>

  <p>Truth be told, I don’t want to write another piece about “being a woman.” I want to write pieces
  about emotions that are hard to capture in words but easy to express in music, because music has room
  to hold a staggering amount of complexity and nuance. I want to be given commissions with specific concert
  themes, even oddly specific ones. Especially oddly-specific ones; please, give me your commissions for
  works with texts about weddings that must also include percussion, or pieces to pair with Taiwanese
  music about the sea.</p>

  <p>Evaluation. Trumbore begins to use pathos and urges readers to understand her position. She also
  explains how she works and what works best for her.</p>

  <p>I will rise to each challenge; this is what I do for a living, and I’m good at my job. I’ll find
  a text that adheres to each theme and write the best music I can write at this moment in time. I do
  this best when I don’t also have to wonder whether I am single-handedly summing up the entirety of what
  it means to “be a woman.” If the texts I choose or the music I write happens to capture some aspect
  of the female experience—of a female experience—great. Still, that will have been my decision to make.</p>

  <p>Thoughts. In reflecting, Trumbore acknowledges what she needs to do next and begins to gain momentum
  by describing specific activities to meet her goals.</p>

  <p>When you program the works of underrepresented composers, don’t act like my cat does with a freshly-caught
  fly. Don’t proudly rattle off the names of women in a Facebook post like you’ve hunted down their music
  and are laying it at the feet of your audience. Your audience deserves better; they deserve a concert
  with an actual theme.</p>

  <p>Coherence. By bringing back the cat, Trumbore reminds readers of the “congrats” metaphor she established
  earlier as she continues to advocate for needed change.</p>

  <p>When it comes time to promote the work of historically underrepresented composers, present their
  compositions—these works you’ve come to love—as you would any other excellent repertoire. Shout from
  the rooftops why you love each composition. Tell your colleagues and friends. Tell your board members.
  Tell your audience. And once you have, don’t expect congratulations for doing so. You don’t need or
  deserve praise simply for doing your job as a conductor. After all, programming music that you admire
  and respect—sharing that music, teaching that music, advocating for that music—is reward enough. Isn’t
  it?</p>

  <p>Speculation. In this concluding paragraph, Trumbore encourages action toward implementing her points,
  or at the very least toward a different way of thinking. The reflection encourages readers, too, to
  reflect on their feelings, their experiences, and potential ways to change or improve.</p>

  <h3>Discussion Questions</h3>

  <p>1. What is the "happening," and which parts of Dale Trumbore’s essay describe it?</p>

  <p>2. What parts of Trumbore’s essay show reflection?</p>

  <p>3. What parts of Trumbore’s essay describe an action that results from the reflection?</p>

  <p>4. How does Trumbore use her cat to make a reflective point? What effect might it have for readers?</p>

  <p>5. What might you do differently if you were Trumbore and wanted to focus on a similar topic?</p>

  <p>20.5 Writing Process: Looking Back, Looking Forward</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Apply composing processes and tools as a means
  to discover and reconsider ideas. • Reflect on the development and insights of composing processes and
  how they affect your work. • Adapt and apply composing processes for a variety of technologies and modalities.</p>

  <p>One of the best ways to reveal who you are as a writer is to show yourself becoming aware of your
  strengths and weakness. This awareness can help you discover not only new ways of seeing the world but
  also new insights into yourself. Although such awareness can occur for unexplainable reasons, it usually
  happens when you encounter new ideas or have experiences that change you in some way. Reflection allows
  you to begin this journey. To grow as a writer, look back at your previous writing. If you look back
  at a drawing you did in first grade, you might find it funny or cute. Additionally, and more likely
  than not, you could do that same drawing now with a lot more detail and skill than you did back then.
  Think about writing in the same way: as you add to your writing skills and abilities, you become more
  proficient and can take on more challenging writing tasks. In this section, as you reflect on your writing
  development during the course, you will find areas of strength and weakness. The weaker areas are the
  ones you will want to improve.</p>

  <h3>Prewriting</h3>

  <p>Before beginning your reflective essay, take some time to review your work from the course. Write
  a few sentences or paragraphs about specific aspects of each assignment, such as its purpose, your feelings,
  what you learned, what you did well (and not so well), and where you think you can do significantly
  better. This prewriting work will be useful later.</p>

  <h3>Summary of Assignment: Portfolio Reflection and Self-Evaluation</h3>

  <p>In the form of a letter (e.g., “Dear Reader”), respond to several questions and discuss various topics
  related to your writing development in this course. For example, you might be asked to identify and
  discuss your strongest piece of writing. For each claim you make about your strongest assignment, provide
  reasoning and evidence from your portfolio to support the statement. When you quote directly from your
  own writing, be sure to state which assignment or draft you are quoting. Within the context of your
  responses, include commentary on most of the following course topics as well as others that have been
  significant:</p>

  <ul><li>Writing processes (organizing graphically, outlining, drafting, conferencing, revising, editing,
  publishing, recursivity)</li><li>Rhetorical situation, rhetoric, and persuasion • Reasoning strategies,
  textual and rhetorical analysis • Evidentiary strategies: evaluation, research • Word choice, leads,
  transitions • Thesis statement, structure and organization, introductions, conclusions • Showing, not
  telling; descriptive writing • Voice; feelings, as hindsight or in process</li></ul>

  <p>Depending on the nature of your portfolio, you may be able to create a digital or multimodal reflective
  letter, as mentioned in Glance at Genre: Purpose and Structure.</p>

  <p>Another Lens. Using reflective organization and strategies, create a fictionalized story for readers.
  Some fiction writers base their stories on real events, adding material or characters to help readers
  connect the plot points and make the story more memorable and engaging. For example, consider a school-like
  setting and a host of characters. Incorporate dialogue, details of setting, and other story elements
  to develop characters and create tension.</p>

  <h3>Once Upon a Time</h3>

  <p>James sat silently across the room as Rafael read the paper James had worked so hard to write. He
  could not have been more nervous watching Rafael, the best writer in the class, review his work. No
  one had ever read James’s work other than a teacher. His heart was racing, and beads of sweat formed
  on his forehead.</p>

  <p>“What do you think?” James asked. Rafael rolled his eyes before locking eyes with James.</p>

  <p>“I’m not finished yet,” Rafael answered and returned to the paper, ignoring James.</p>

  <p>James stared at him, contemplating the meaning of every facial wrinkle and twitch of a finger: what
  did they mean? After several aching minutes, Rafael picked up a pen and wrote for several minutes with
  a slight smile on his face. He took a long breath, walked over to James, and handed the paper back with
  a sheet full of notes.</p>

  <p>He smiled and said, “It’s a strong paper. I made some notes I hope you find useful. I was confused
  only a few times, so you could look at where I made suggestions for when you revise.” James smiled back,
  and the look on his face showed surprise and relief.</p>

  <p>After quickly reviewing the comments, James turned to his close friend Jess and said, “He didn’t
  destroy my paper and actually gave me some good suggestions.”</p>

  <p>In this example, James, Rafael, and Jess are not real people, but the characters show how students
  may react during a peer-review workshop. Of course, you might decide to write about a less-than-ideal
  experience in which Rafael laughs at James’s work and Jess steps in to help him revise. Or you might
  set the story in a different time or place and create an entirely different situation. Whatever you
  decide, use your course experience and some creativity to create scenarios in which a character reflects
  on their writing in ways that are meaningful and useful not only for you but also for your readers.
  Then weave these characters into a larger narrative. It might end in a published class book or website
  of student writing and require James to give a speech about one of his papers, or it might end in another
  scenario that follows logically from the narrative you have created. Regardless of where you take the
  story, include realistic elements of reflection as well as how your main character develops across the
  story, faces a challenge, and finds a way to overcome it.</p>

  <p>You can show character development in several different ways. One way is to be inside a character’s
  mind. To portray a character thinking rather than talking, employ internal monologue by using sentence
  fragments and other nonacademic writing conventions to show that a person’s thought process doesn’t
  follow conventional rules of language. For example, a character named Bethany describes her thoughts
  when revising her first paper. She writes an internal monologue—readers hear her talking to herself
  while she tries to focus on revision. Note how she provides clues for readers to understand what is
  going on around her.</p>

  <p>OMG, I cannot believe I wrote that! How could I write about a calligraphy pen when I don’t even own
  a calligraphy pen? I’m not even sure what one looks like! Bonkers! I wonder if the other people in my
  class are staring at me right now. I’m afraid to look up. I casually tilt my head up and see no one
  paying any attention to me whatsoever. Wonderful! I’m just another writer in a writing class.</p>

  <p>In this example, the character works through a process of reflection based on her experience. She
  cannot believe she wrote about a calligraphy pen, but perhaps because of her nervousness with writing,
  this quirk has become a unique aspect of her character. You might create other such quirks in one of
  your characters, such as a character who always reads aloud, even in the middle of class, or one who
  taps a pen on their forehead loudly as they read. Then you can use that as a tool to point to another
  aspect of what you learned in your actual course. When writing this fictionalized piece, be mindful
  of your focus, which is to reflect on your development as a writer during this course.</p>

