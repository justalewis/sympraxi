  algorithms.</p>

  <h3>Conclusion</h3>

  <p>Today, indeed, a cross-cultural challenge presents itself when we sit down to write technical instructions.
  Even in the ‘melting pot’ state of diversity in the current United States of America and the ‘flat world’
  afforded by evolving global access to technological innovation, we cannot assume that we possess all
  of the cultural knowledge necessary to communicate instructions effectively to diverse readers. Thus,
  this chapter proposed a culturally inclusive approach to designing multimodal technical instructions
  that can better resonate across cultures through the aesthetic treatment of the modes.</p>

