  to Teaching Writing.” Relations, Locations, Positions: Composition Theory for Writing Teachers. Ed.
  Peter Vandenberg, Sue Hum, and Jennifer Clary-Lemon. Urbana, IL: National Council of Teachers of English,
  2006. 157–64. Print.</p>'
