  <p>Scripting for the Public Forum: Writing to Speak</p>

  <p>19</p>

  <h3>CHAPTER OUTLINE</h3>

  <p>19.1 Writing, Speaking, and Activism 19.2 Podcast Trailblazer: Alice Wong 19.3 Glance at Genre: Language
  Performance and Visuals 19.4 Annotated Student Sample: “Are New DOT Regulations Discriminatory?” by
  Zain A. Kumar 19.5 Writing Process: Writing to Speak 19.6 Evaluation: Bridging Writing and Speaking
  19.7 Spotlight on … Delivery/Public Speaking 19.8 Portfolio: Everyday Rhetoric, Rhetoric Every Day</p>

  <p>INTRODUCTION While writing academic text may take up the bulk of your time as a student, other aspects
  of life involve writing as well, especially as you move toward an engaged social life and a career.
  One personal or professional task in particular is writing to speak. Whether speaking as part of a classroom
  assignment, a planned address, a professional presentation, or recording a video to post to a video-sharing
  social media platform, script writing shares much more with traditional academic writing than you might
  first believe. A successful speaking event is not achieved by a perfectly planned outline or even extensive
  research and knowledge on a topic—although these are important aspects. No, the key to memorable speech
  is the speaker’s connection with an audience, or group of listeners.</p>

  <p>Greek philosophers and educators wrote the first texts for public speaking over 2,000 years ago.
  In fact, Greek philosopher Aristotle (384–322 BCE) wrote the treatise On Rhetoric, which covers many
  of the same concepts and topics you will encounter in this chapter, including rhetorical appeals, awareness
  of audience, and organization. As it turns out, effectively engaging an audience through speech is a
  time-honored endeavor. But new technologies, channels, and avenues of communication have expanded the
  opportunities for more and more voices to be heard. In this chapter, you will read about podcast trailblazer
  Alice Wong, read a student script, and write your own script or outline advocating for a cause of your
  choice. Speaking of activism, you will discover how script writing and activism go hand in hand, opening
  new possibilities for communicating with your audience.</p>

  <p>19.1 Writing, Speaking, and Activism</p>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Articulate how genre conventions shape and are shaped by readers’ and writers’ practices and
  purposes. • Identify and apply rhetorical concepts such as shifts in voice, diction, tone, formality,
  design, medium, and structure appropriate to a speech. • Match the capacities of different environments
  to varying rhetorical situations. The genre of this chapter is script writing. A genre is a type of
  composition that uses specific features, follows a particular style or format, and is shaped by the
  author’s purpose, or what the author wants to accomplish. In a script, the purpose is what the author
  wants to communicate to the audience and wants the audience to think about or do after the speech. Speech
  is often used as a vehicle to persuade audiences or move them to action.</li></ul>

  <h3>Writing for and beyond the Academy</h3>

  <p>By now, you are likely familiar with the concept of rhetoric, which, in academic terms, describes
  how writers and speakers use language to persuade. Rhetoric has its roots in ancient Greece, dating
  back to Homer’s epic poems (mid-8th century BCE), and was developed by the philosophers Socrates (c.
  470–399 BCE) and Aristotle into a system for understanding and teaching persuasion. If you have ever
  analyzed a speech or story to determine how the author develops or supports claims, chances are you
  have studied rhetoric. Refer to Rhetorical Analysis: Interpreting the Art of Rhetoric and Position Argument:
  Practicing the Art of Rhetoric for more about rhetoric.</p>

  <ul><li>Ethos is an appeal to ethics, which, in rhetorical terms, helps establish the writer’s or speaker’s
  credibility. You must establish credibility with your audience so that they feel they can trust what
  you say. Ethos often invokes the speaker’s character and qualifications on the subject. Speakers may
  strengthen their ethical appeal by using or referring to patriotic or religious documents in their speeches.
  • Logos is an appeal to logic and intelligence. Logos appeals rely on strong and sound reasoning, often
  supported by facts and statistics. Support your position with critical thinking and clear, credible
  evidence. To give yourself credibility, use respected, reliable sources that are properly attributed.
  • Pathos is an appeal to emotion. Supporting your position by using pathos involves evoking in your
  audience emotions, such as fear, anger, sympathy, guilt, or sorrow. This appeal often involves dramatic
  or vivid language, anecdotes or illustrations, and a more personal tone. For more information on ethos,
  logos, and pathos, see Rhetorical Analysis: Interpreting the Art of Rhetoric and Position Argument:
  Practicing the Art of Rhetoric.</li></ul>

  <h3>Identifying General Purpose</h3>

  <p>The purpose of speech, like any type of writing, is directly related to the rhetorical situation,
  which defines how a speaker will use communication to influence an audience’s perspective. Speech is
  created for a specific time, place, and audience, by a speaker who makes choices on the basis of the
  rhetorical and cultural context.</p>

  <p>Speech typically falls into one of three categories. Some speak to teach the audience something or
  to explain something. The purpose of this speech is to inform. Some speak to influence an audience’s
  beliefs, behaviors, or attitudes. The purpose of this speech is to persuade. Some speak to amuse the
  audience. The purpose of this speech is to entertain. In some instances, the purposes will overlap;
  a speaker may want both to persuade and to evoke emotion, for example. Consider President Franklin D.
  Roosevelt’s (1882–1945) Pearl Harbor speech (https://openstax.org/r/Pearl_Harbor). It was delivered
  as an informational speech on December 8, 1941, at a joint session of Congress to address Japan’s bombing
  of Pearl Harbor, which occurred a day earlier. However, Roosevelt crafted the speech to stir emotions
  and convince Congress to formally declare war against Japan, officially bringing the United States into
  World War II (1939–1945).</p>

  <p>When writing to speak, consider whether you want to inform, entertain, or persuade your audience.
  These purposes are often combined, as in the Pearl Harbor speech, and the medium through which you present
  speech may use different formats and channels (podcast, YouTube, Facebook Live, Periscope, Vimeo, presentation
  to a live audience, and so on). However, your ultimate goal will always be to connect meaningfully with
  your audience to achieve your general purpose.</p>

  <p>The formula for establishing your purpose is fairly straightforward. Identify your audience, determine
  what you want to tell them, then analyze the best way to reach them. By following these steps, you will
  have defined your purpose, and you can create effective and meaningful speech.</p>

  <h3>Informative Speech</h3>

  <p>Informative speech explains, describes, or demonstrates. The speaker’s aim is to provide information
  that will be comprehensible to audience members. Informative speech may cover topics such as describing
  a location, an object, or a person; explaining an idea or how to operate something, a thermostat, for
  example; or demonstrating how to change a tire. The speech will be organized according to the specific
  purpose and audience. Informative speech usually incorporates media—for example, visuals, three-dimensional
  objects, or video—to illustrate the content of the speech.</p>

  <h3>Entertaining Speech</h3>

  <p>Entertaining speech features the use of humor to connect with an audience. This speech may comment
  on the humor present in everyday situations or use humor for social commentary. When you speak to entertain,
  you will call upon elements of humor such as self-deprecation, physical comedy, absurdity, wordplay,
  topical observation, or dark comedy.</p>

  <h3>Persuasive Speech</h3>

  <p>Persuasive speech seeks to convince audience members of something or influence their beliefs, values,
  or behavior. This type of speech either reinforces an audience’s existing beliefs on a topic, changes
  their beliefs, or inspires them to act on something. When you speak persuasively, you will use many
  of the same principles you used when you wrote the position argument in Position Argument: Practicing
  the Art of Rhetoric. You likely will present your thesis, or statement of your position, at the beginning
  of your script and then devote most of the script to supporting that position. On the other hand, you
  might consider presenting the thesis later in the script, after you have provided compelling evidence
  to support it. In this case, the delayed thesis creates a dramatic effect. You might also save it for
  the end if you know your audience is likely to disagree with it. You can structure a script written
  to persuade as a five-part argument with the following features:</p>

  <ul><li>An introduction that hooks, or engages, the audience sets the tone, or writer’s attitude toward
  the audience or subject, and states the thesis if is presented early.</li><li>Background information
  provides context and details for the situation being discussed. These are closely linked to purpose
  and explain why the audience should care about the topic.</li><li>The body of the script explains the
  argument (if persuasive) and provides compelling reasons and evidence.</li><li>Refutation of counterclaims
  disproves or rules out objections. • A conclusion presents a closing argument, stating or restating
  the thesis and summarizing the main points of the script. • Transitions within the script guide the
  listener smoothly from one idea to the next.</li></ul>

  <h3>Audience Awareness</h3>

  <p>When you are writing to speak, audience awareness is particularly important. After all, the audience
  is often right there in front of you! Your goal is to speak directly to them, to evoke emotion or make
  them react, even if silently. Consider your audience when choosing your tone, language, and approach
  to a topic. Knowing your audience and crafting your writing for them will help you connect and thus
  fulfill your purpose. Among the most famous speeches of all time, Martin Luther King Jr.’s “I Have a
  Dream” speech (https://openstax.org/r/ I_Have_a) is known for inspiring civil rights progress in the
  United States.</p>

  <p>All speech is designed for a particular audience at a particular time. Because effective speakers
  seek to know their audience, they consider demography, the statistical study of human populations, focusing
  on categories such as age, gender, education, religion, race, and so forth. Demographics are the statistical
  data gathered from studies in these and other areas relating to populations. Although your audience
  may be quite specific and you may know some of its demographics, it is important to design your script
  outline to include examples, ideas, and appeals that are broadly understood. The circumstances that
  lead your audience to you will also influence their interest and reaction to your presentation. A presentation
  to a captive audience—those who attend because of some outside force rather than their own choice—will
  require you to spend more time building common ground than you would with an audience you know to be
  more receptive. Contrast this situation with a speech at a political rally, where voluntary attendees
  are likely to share political beliefs. As is evident, understanding your audience is imperative to knowing
  how to speak to them. Considering their attitudes, beliefs, cultures, and values, including those they
  share with one another and with you as the speaker, will allow you to understand how much attention
  you need to devote to convincing the audience of your viewpoint. When analyzing your audience in this
  way, you also will want to consider their prior knowledge and relationship with the topic. Do they already
  have a solid understanding of the topic? If they do, there is no need to spend much time on background
  information. Are they largely opposed to the premise of your thesis? If so, you will need to provide
  effective reasoning and strong evidence to convince them. The amount of background knowledge required
  will influence how you shape your script or outline and thus your speech. Audience awareness also can
  help you decide which rhetorical appeals and devices to use within your script. You need to consider
  how you relate to the audience. Are you an expert on a topic? Are you a peer in their community? Do
  you (or they) have cultural intricacies that influence your understanding of the topic? These questions,
  combined with cultural awareness, can guide your composition.</p>

  <h3>Cultural Context</h3>

  <p>Culture—the shared values, customs, arts, and other traits of a group of people—is an important consideration
  when developing a relationship with your audience. Speech—particularly formal, persuasive speech—is
  a part of the American social and political systems. Candidates for political office commonly use speech
  during campaigns. Consider former president Barack Obama’s (b. 1961) introductory speech at the 2004
  Democratic National Convention (https://openstax.org/r/introductory_speech), which political scholars
  credit with his rise to the presidency. Lawyers regularly use speech to argue their cases before judges
  and juries. Religious leaders have long used speech from the pulpit to challenge and influence congregants.
  Moreover, as American culture morphs and grows, speech has become an important part of everyday life
  in ways not witnessed in earlier times. Radio and television have existed as vehicles for delivering
  speech for many years. But in the past two decades, speech has found new outlets, including podcasts
  (streamed spoken-word audio), YouTube videos, and social media videos. This influx of new formats has
  created a cultural shift, making speech, and by extension its influences on a large audience, more accessible
  and representative. This shift has also increased the level of social, political, and economic activism.
  Understanding the cultural context of your audience and the subject of your speech is as important as
  any other part of it, for this context will dictate whether your words are effectively received.</p>

  <h2>Podcast Trailblazer: Alice Wong</h2>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Articulate how genre conventions shape and are shaped by readers’ and writers’ practices and
  purposes. • Match the capacities of different environments (e.g., print, electronic) to varying rhetorical
  situations.</li></ul>

  <p>“Stories are the closest we can come to shared experience.”</p>

  <h3>The Disability Visibility Project</h3>

  <p>Alice Wong (b. 1974) is an activist, writer, and media creator from San Francisco, California. After
  graduating from Indiana University in 1997 with majors in English and sociology, Wong went on to earn
  a master’s degree in sociology from the University of California, San Francisco, where she later worked.
  Wong has been widely published, including feature pieces appearing in publications ranging from the
  New York Times to Teen Vogue, and her activism work has been featured in CNN’s series United Shades
  of America (https://openstax.org/r/ Unitedshades). In addition to writing, Wong regularly creates multimedia
  content, including podcasts. From 2013 to 2015, she was a member of the National Council on Disability,
  appointed by then president Barack Obama.</p>

  <p>Wong founded and serves as the director of the Disability Visibility Project (DVP), an online community
  that aims to create a space where disability media and culture are recognized, created, and shared.
  The project is personal for Wong, who has been unable to walk since childhood. The DVP also provides
  an online place for people to share and connect about disability culture. The organization encourages
  those living with disabilities to share their stories through the website or the app StoryCorps (https://openstax.org/r/storycorps),
  which collects and shares oral history. The DVP curates “disabled media” from these collected oral histories
  in the form of tweets, audio clips, podcasts, blog posts, images, and so on. The project also publishes
  original written and multimedia content created from the perspectives of people who are disabled. Topics
  include issues related to ableism (discrimination against people with disabilities), culture, and politics.
  Wong is also the host and a coproducer of the Disability Visibility Project podcast (https://openstax.org/r/
  Disability_Visibility), launched in 2017. She uses the podcast to give a voice and platform to issues
  concerning politics and culture as they relate to disability rights and social justice. Through conversations
  with diverse guests, Wong amplifies disability media and culture on topics ranging from health care
  to climate change to the arts, and everything in between. Wong has also partnered with #CripTheVote
  (https://openstax.org/r/CriptheVote), a nonpartisan campaign to bring awareness of disability issues
  into the public and political arenas, and Access Is Love (https://openstax.org/r/accessislove), an initiative
  to build accessibility into everyday life. She is the editor of Disability Visibility: First-Person
  Stories from the Twenty-First Century, an anthology of personal stories from members of the disability
  community. The book contains curated text such as blog posts, manifestos, eulogies, and testimonies
  to Congress in order to bring to light the diverse experiences of people in this community. The aim
  of the anthology is intersectional, meaning it emphasizes the crossroads of living with disabilities
  and other issues, including race, class, gender, culture, and religion.</p>

  <h3>Discussion Questions</h3>

  <p>1. Why might Alice Wong look to speech and other media to communicate activist ideas surrounding
  the disability community?</p>

  <p>2. How is the impact of writing for speech different from writing for print? What comes across when
  an activist speaks rather than represents their ideas in print?</p>

  <p>3. How does social media both enhance and limit accessibility within the disabled community? How
  is this true for other cultural communities?</p>

  <p>4. Wong says that storytelling can be more than written words. How can other forms of media—she lists
  emojis, memes, selfies, and tweets—communicate rhetorical ideas as effectively as, or more effectively
  than, traditional written storytelling?</p>

  <p>19.3 Glance at Genre: Language Performance and Visuals</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Apply appropriate genre conventions for structure,
  tone, mechanics, format, and design in writing speech. • Demonstrate relationships between ideas, patterns
  of organization, and interplay of verbal and nonverbal elements. • Articulate how genre conventions
  are shaped and vary by purpose, culture, and expectation.</p>

  <p>Oral communication skills are integral to personal and professional success. While many aspects of
  script writing are similar to those used in writing for print or electronic formats, speech incorporates
  another domain with its own considerations.</p>

  <h3>Writing for Listeners and Readers</h3>

  <p>The script for a speech may begin as a traditional text, but it must be written and delivered in
  a way that makes it available and accessible to readers and listeners alike. Think of your favorite
  radio show or podcast. If the author wrote as if composing a written text with no consideration for
  listeners, the effect for listeners would likely be compromised.</p>

  <p>When writing for listeners, think about not only what you want to express but also how you can best
  support your ideas and claims. Because speech relies heavily on audience members’ auditory skills, listeners
  with little practice in these skills or who learn better through visual or experiential text may be
  at a disadvantage. Therefore, the speaker-writer must make a concerted effort to support listeners in
  other ways.</p>

  <h3>Writing for Delivery</h3>

  <p>Text for speech will be only as good as its delivery. If you write for speech in the exact way you
  write an academic paper, the result is likely to be lackluster, for speech is immediate—that is, it
  makes an impact as soon as it is heard. A powerful written argument, if orally delivered without voice
  modulation or emphasis, is unlikely to move listeners and likely to have fluency glitches, as written
  sentences tend to be longer and more complex. Although topical outlines for a paper and a script might
  look similar, the way you translate ideas into writing for speech will vary to increase effectiveness.
  One strategy for making this “conversion” is to read your script aloud during or after writing. Hearing
  the script will allow you to make revisons and edits to ensure oral fluency, or smooth delivery, including
  pronunciation, phrasing, stress, and tone.</p>

  <p>You can write effectively for delivery by doing the following:</p>

  <ul><li>Support information by including visual and audio aids to help the audience remember and understand
  information.</li><li>Demonstrate information through action, such as dynamic movement or demonstrations.
  • Engage your audience with vocal techniques such as gestures, inflection, changes in speed and pitch,
  and strategically placed pauses.</li></ul>

  <h3>Writing with Media</h3>

  <p>Script writing and presentations often take a multimedia approach. Multimedia can include a variety
  of channels, media types, and visual aids, including videos, images, infographics, and animations that
  enhance understanding and bring a new level of engagement among media consumers. The use of media can
  reinforce the content of a script or presentation, provide a vehicle for delivery, and generally enhance
  the speaker’s purpose and message.</p>

  <p>While formal speeches are still featured at contemporary political, religious, and academic events,
  other forms of media have become alternatives to traditional public addresses. Free and readily available
  video platforms such as YouTube mean that more people than ever before are able to share their experiences.
  Also free and readily accessible for the most part, podcasts are increasingly used as a vehicle to share
  ideas through an oral medium. Plus, podcasts such as Serial (https://openstax.org/r/Serial) have led
  to changes within the criminal justice system. Social media platforms now are filled with multimedia,
  including video, audio, and images, that play a more prominent role than at the time these platforms
  first were launched. As you develop your presentation in the next section of this chapter, consider
  which methods of presentation you might explore in order to harness the power of media to your benefit.</p>

  <h3>Key Terms</h3>

  <p>Below are key terms and characteristics of scripts and other oral media.</p>

  <ul><li>audience: the people for and to whom a script is written. • Body: the middle and main portion
  of a script, in which key ideas, evidence, and reasons are presented and elaborated. • Citation: credit
  given to a source used in a writer’s research. • Conclusion: the final portion of a script, in which
  the thesis and key ideas are reiterated and/or expanded to include action or additional consideration.
  • ethos: appeal to readers’/listeners’ ethics, establishing authority and credibility. • Evidence: information,
  such as facts, statistics, and examples, that proves or disproves the validity of a key idea. • Introduction:
  the first portion of a script, in which the author engages the audience and usually states the thesis.
  • Logos: appeal to readers’/listeners’ logic, or reasoning. • Parallelism: a rhetorical technique of
  using similar words, phrases, or other grammatical constructions to connect related ideas, emphasize
  a point, or add rhythm. • Pathos: appeal to readers’/listeners’ emotions. • purpose: a writer’s reason
  for creating a script, often to persuade readers/listeners to agree with a viewpoint or take action.
  • reasoning: logical and sensible explanation of a concept. • Repetition: a rhetorical technique of
  repeating a key word or phrase for emphasis. • Rhetorical appeals: methods of persuasion, including
  ethos, logos, and pathos. • Rhetorical devices: ways that writers use language to convey meaning, create
  emphasis, and draw attention to their words and ideas. Repetition and parallelism are rhetorical devices.
  • Signpost language: statements that help the audience know where your presentation is going. Transitions
  are examples of signpost language. • Topic: the subject of a script. • Thesis: a statement indicating
  a writer’s/speaker’s position on the topic.</li></ul>

  <p>19.4 Annotated Student Sample: “Are New DOT Regulations Discriminatory?” by Zain A. Kumar</p>

  <p>LEARNING OUTCOMES</p>

  <p>By the end of this section, you will be able to: • Explain how conventions of writing, including
  rhetorical devices, reflect purpose, culture, or audience expectations. • Analyze the relationships
  between ideas and patterns of organization in a speech.</p>

  <h3>Introduction</h3>

  <p>A script may take many forms, but effective speakers connect with their audience, clearly state a
  main idea or thesis, and support that thesis by backing up key ideas with evidence and reasoning. In
  this feature, you will read a speech that examines whether U.S. Department of Transportation regulations
  discriminate against people who depend on service animals. The full transcript of the speech, rather
  than the outline, is provided here to allow you to study aspects of delivery as well as preparation.
  Notice not only the disapproving tone and conversational style but also the way in which the author
  builds and supports the thesis.</p>

  <p>LIVING BY THEIR OWN WORDS</p>

  <h3>It''s a Dog Fight</h3>

  <p>Several years ago, I sat in the waiting area of a major airport, trying to ignore the constant yapping
  of a small, clearly agitated dog being restrained with difficulty on the lap of a fellow passenger.
  An airline rep approached the passenger and asked the only two questions allowed by law: “Is that a
  service animal? What service does it provide for you?”</p>

  <p>“Yes. It keeps me from having panic attacks,” the woman said defiantly, and the airline employee
  retreated.</p>

  <p>Shortly after that, another passenger arrived at the gate. She gripped the high, stiff handle on
  the harness of a Labrador retriever that wore a vest emblazoned with the words “The Seeing Eye.” Without
  warning, the smaller dog launched itself from its owner’s lap, snarling and snapping at the guide dog.
  The owner of the small dog jumped up and retrieved her animal from the Labrador’s vest and stomped back
  to her seat. That neither she nor the still-yapping dog had an obvious panic attack amazed me, as I
  questioned, to myself of course, what service was being provided—other than a moment of exercise for
  the woman and her dog.</p>

  <p>Introduction. The opening anecdote grabs the listener’s attention with a relatable story about an
  interaction at an airport. It provides an illustration of the point that Zain A. Kumar will make next
  in the introduction.</p>

  <p>Pathos. Using strong words such as snarling and snapping, Kumar connects his argument to emotions.</p>

  <p>Tone. Kumar clearly expresses disapproval of the small dog and its owner, implying that the woman
  is lying and the dog is untrained.</p>

  <p>The U.S. Department of Transportation (DOT) has recently established new regulations regarding service
  animals on domestic and international flights. This regulation has provoked a flurry of protests by
  people who are accustomed to taking their pets for free in airplane cabins by claiming they are emotional
  support animals. Are these new regulations discriminating against persons with disabilities? Let’s look
  at some details.</p>

  <p>Signpost Language. Kumar uses a rhetorical question, or a question used for effect and not meant
  to be answered, to establish the central discussion in the script: whether restrictions put in place
  for service animals infringe on the rights of people with disabilities. This signpost language tells
  listeners that this is important information.</p>

  <p>Introduction. Following the anecdote, this introductory paragraph establishes the problem and provides
  background information.</p>

  <p>Tone. Kumar’s use of rhetorical questions and phrases such as Let’s look at creates an informal,
  conversational tone that is well suited to script.</p>

  <p>The new rule has 12 provisions. The first is the definition: a service animal is a dog that is individually
  trained to do work or perform tasks for the benefit of a person with a disability. Definition. The definition
  of a service animal provides context for the focus of the script. Okay, how was the service dog trained?
  Well, as a puppy it lived with a foster family that taught it basic behavior and socialization. When
  it was between 13 and 19 months old, it came to the Seeing Eye campus to work with an individual instructor
  for four months of intensive training. At the end of the four months, the dog took a final exam: leading
  the instructor successfully on a field trip to New York City. About 75 percent of the dogs pass this
  training and are matched with a person who is blind or visually impaired. The new owner works with the
  dog and its instructor for an additional 25 days on campus before the owner and the dog go home. But
  the training doesn’t end there. The new owner continually reinforces the dog with praise and correction,
  and The Seeing Eye staff members are always available for telephone consultations and even home visits
  if needed. Tone. The question opening the paragraph contributes to the conversational tone of the script.
  Evidence. This paragraph firmly establishes the “credibility” of the guide dog, detailing its training.
  This rigorous process will be contrasted with the background of the emotional support dog from the opening
  anecdote to draw a comparison. Now, what about that emotional support dog in the airport? The law requires
  no specific training for emotional support animals. The rationale is that their presence is enough to
  support people who have anxiety, depression, or stress. The only requirement is that the animal be manageable
  in public and not create a nuisance. In light of this requirement, the little dog did not do well. Evidence.
  This paragraph contrasts the guide dog with the emotional support dog and shows that the latter cannot
  meet even the minimum standard set by the airlines. The second provision of the new DOT regulation is
  that emotional support animals are no longer considered service animals. However, the third provision
  grants psychiatric service animals the same status as other service animals. In other words, a person
  with an emotional or psychiatric disability can still obtain and travel with a service companion that
  has appropriate documentation. Transition. This signpost language allows the listener to know that the
  author is moving from one key idea to another. Three other regulations deal with this documentation.
  The DOT has developed forms attesting to the animal’s health, behavior, and training. Airlines may require
  these to be submitted 48 hours before travel or may require them at the departure gate. Providing these
  forms is no problem for a passenger with a Seeing Eye–certified or other officially trained dog.</p>

  <p>But what about the certification for an emotional support animal? Until the new regulations were
  passed, this wasn’t a problem. A person wishing to claim a pet as an emotional support animal could
  simply go online and purchase certification from a for-profit agency. On one such site, for $54, a basic
  kit offers lifetime registration in a national database maintained by the company, plus a framed certificate,
  ID card with leash clip, and two official-looking vest patches. “Deluxe” and “premium” packages added
  more goodies for $114 and $154, respectively. The applicant could also obtain a certification letter
  from a licensed mental health professional for an additional fee. Just out of curiosity, I took the
  free online assessment—10 multiple-choice questions like these: “In the past two weeks, how often have
  you had little interest or pleasure in doing things that you usually like to do?” “How often have you
  felt sad or depressed?” “How often have you felt worried, anxious, or on edge?” The multiple choice
  options were never, sometimes, or often; I replied with 5 often, 4 sometimes, and 1 never response.
  My results were immediate: “Congratulations! Based on your responses, you are a good candidate to qualify
  for an ESA.” All that was left for me to do was fill in my credit card info and upload a photo of my
  pet to have a certified emotional support animal. This certification, by the way, must be renewed annually—for
  a fee. Big surprise! Supporting Evidence. Though it has not yet been expressly stated, audience members
  should have a sense of the thesis. This anecdote serves as evidence that Kumar will use to support the
  claim that regulations are not discriminatory. Tone. The sarcastic words “Big surprise!” reflect Kumar’s
  disapproval of the for-profit agency issuing certification for service animals. Additional DOT regulations
  allow airlines to require that service animals be harnessed, leashed, or tethered at all times in the
  airport and on the aircraft and to limit a single passenger to two service animals. The regulations
  also allow airlines to require a service animal to fit within its handler’s foot space on the aircraft.
  This is not a hardship; I have personally seen a full-grown Labrador tuck herself comfortably into the
  space for carry-ons and go to sleep. Personal Anecdote. Kumar frequently uses personal anecdotes to
  support his points and establish credibility on the subject. The bottom line? I don’t believe the DOT’s
  new regulations are discriminatory. Thesis. Although the structure is unusual, Kumar finally states
  the thesis: the new regulations do not discriminate against persons with disabilities.</p>

  <p>Developed after receiving over 15,000 comments from individuals with disabilities; airline and airport
  personnel, including flight attendants; and other members of the public, these restrictions close loopholes
  that have been exploited by pet owners who want to take their pets along in airplane cabins without
  using a pet carrier or paying the pet fee. Individuals with a genuine need can still be accompanied
  by their documented and trained service animals—including psychiatric service animals—when they travel.
  In fact, travel just became less challenging in one major respect: people no longer have to abide fake
  emotional support animals having fuzzy four-footed panic attacks during the trip.</p>

  <p>Logos. Kumar uses logical appeals to support the thesis, talking through points in an organized and
  rational manner.</p>

  <p>Reasoning. Drawing on previous anecdotes, evidence, and explanations, Kumar explains why the new
  regulations do not discriminate against people with real disabilities.</p>

  <p>Parallel Conclusion. Kumar concludes the speech in the same casual manner and tone as the rest of
  the script. In addition, the ending is meaningful, once again drawing in the reader’s/listener’s attention
  by circling back to the opening anecdote.</p>

  <h3>Discussion Questions</h3>

  <p>1. What is the impact of opening the introduction with an anecdote?</p>

  <p>2. Which parts of the script show that the author has a good understanding of the audience and is
  trying to connect with them? Explain your response.</p>

  <p>3. Why has the author used rhetorical questions within the script?</p>

  <p>4. Why might the author have chosen to save the thesis for near the end of the script? What effect
  does this placement have on the overall text?</p>

  <p>5. How does the author support the thesis with reasoning? In your opinion, is it sufficiently supported?
  Why or why not?</p>

  <p>19.5 Writing Process: Writing to Speak</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Develop a writing project through multiple drafts.
  • Compose texts that use rhetorical concepts appropriately in a speech. • Apply effective shifts in
  voice, diction, tone, formality, design, medium, and structure. • Demonstrate orality as an aspect of
  culture. • Provide and act on productive feedback to works in progress through the collaborative and
  social aspects of the writing process. • Adapt composing processes for a variety of technologies and
  modalities.</p>

  <p>Now it’s time to try your hand at writing a script or speaking outline for a public audience. Decide
  on a topic, and take that topic through the planning, drafting, and revision processes. Remember that
  even the informal writing you do when planning a script or speaking outline is recursive, meaning it
  is not linear. You will probably go back and forth between sections and processes.</p>

  <p>You may question of the wisdom of preparation before speaking to the public. After all, you may post
  regularly to social media, for example, without following the processes of drafting and revising. However,
  “winging it” when it comes to speech is not a wise strategy. As a genre, social media in particular
  lends itself to short and simple messaging. Viewers allow producers very little time and attention before
  clicking to view the next item. Some sources say that you have 10 seconds to get the attention of a
  viewer; by the one-minute mark, you may have lost up to 45 percent of your viewers. Live adult audiences
  will pay attention for about 20 minute increments before their minds begin to wander; for young audiences,
  the time is even less. Given that knowledge, you must craft your message accordingly.</p>

  <h3>Summary of Assignment: Writing to Speak, Speaking to Act</h3>

  <p>You may have heard that merely believing in a cause is not enough; you must take action to create
  change. As you keep the idea of social, political, or economic change in mind, your task is to develop
  an outline as the basis for a speech to a live audience or on a social media platform of your choice.
  The topic is an issue you care about. Speaking from an outline rather than from a written script helps
  ensure that your speech is natural and smooth. Your audience should not feel as though you are reading
  aloud to them. If you are free to choose your own topic, consider a cause meaningful to you, or consider
  using one of the following suggestions as your topic or as inspiration for it:</p>

  <ul><li>Police and mental health services reform • Standards-based reform in education • Global human
  rights • Liberty and justice for all • Reduction of carbon emissions</li></ul>

  <p>Your speech may incorporate multimedia components as you see fit. You’ll also need to plan how to
  access the audience or platform you have in mind.</p>

  <p>As you craft your outline, keep in mind your audience, your purpose for addressing them, and your
  support for that purpose by using key ideas, reasons, and evidence. When planning your script, use an
  organizer to collect information so that you can support your ideas credibly with a well-developed argument.</p>

  <h3>Using Your Authentic Voice</h3>

  <p>Unlike most formal academic papers, oral presentations give you an opportunity to consider how you
  might challenge formal writing conventions by delivering your script in your authentic voice. Oral compositions
  offer an opportunity to bring through conventions of your own culture, perhaps including discursive
  patterns of language and grammar and challenges to standard language ideologies. As always, keep your
  audience and purpose in mind as you make choices about your use of language.</p>

  <h3>Researching and Narrowing the Topic</h3>

  <p>After choosing the overall subject of your script, research the general topic to learn about context,
  background information, and related issues. Then narrow the topic and focus your research, as guided
  by your working thesis and purpose. You can return to Argumentative Research: Enhancing the Art of Rhetoric
  with Evidence, Research Process: Accessing and Recording Information, and Annotated Bibliography: Gathering,
  Evaluating, and Documenting Sources to review research processes, including how to allow research to
  shape your thesis and organization.</p>

  <p>After choosing a topic, you will probably need to narrow it further. One way to achieve this task
  is by brainstorming, which involves generating possible ideas and thoughts quickly and informally. A
  basic, fastpaced brainstorming technique is simply to list all your possible ideas on paper and combine
  those that are related. Then you can eliminate some ideas to narrow the range. For example, for this
  assignment, you might list all of the causes toward which you feel sympathetic. Beginning with an idea
  that already interests you will help you remain enthusiastic about the idea and generate a positive
  tone that will come across to the audience and maximize the effectiveness of the presentation.</p>

  <p>For example, if you’re interested in the environment, your brainstorm might include the following:</p>

  <ul><li>Animal endangerment ◦ Deforestation</li><li>Ocean pollution ◦ Plastic waste</li><li>Rising carbon
  levels • Global warming</li></ul>

  <p>If you think you still need new ideas at this point, spend some time researching advocacy organizations.
  Next, expand each idea by creating subtopics. This activity will help you eliminate topics that are
  difficult to elaborate on—or at least you will know that you need to conduct more research. In summary,
  follow this process as you choose and narrow your topic:</p>

  <p>1. Brainstorm ideas that already interest you or with which you have experience. 2. Circle topics
  appropriate for the assignment. 3. Cross out topics that you think you cannot make relevant to the audience.
  Remember, you are developing a presentation for a public forum. 4. For remaining topics, flesh out subtopics
  with ideas you might cover in your script. You should have between two and five key ideas; three is
  fairly typical. 5. Eliminate topics for which you lack sufficient material, or do the necessary research
  to obtain more. 6. Finally, decide on a topic that you have the resources to research.</p>

  <p>Another Lens. Because this chapter focuses on activism and you have read the Trailblazer feature
  about Alice Wong’s work in the disability activism space, think about content consumers (readers, listeners)
  who experience the world through the lens of disability. Challenge yourself to create content that meets
  the needs of diverse consumers. Because the assignment is an activist script outline for a presentation,
  it naturally lends itself to those who are abled in the areas of sight and hearing. Consider people
  who are visually impaired or hard of hearing. How might you adapt your script and its delivery to make
  it accessible to all?</p>

  <p>One option to consider is visual representation of your presentation through an infographic that
  depicts the thesis, main reasoning, and evidence to reach those who cannot hear a speech. Or consider
  how you might adapt the delivery of a script to reach those who experience visual limitations. By making
  considerations for accessibility, you will strengthen your message for all who interact with it.</p>

  <h3>Quick Launch: Outlining</h3>

  <p>Before your presentation, create an outline of the main ideas you plan to discuss. An outline is
  a framework that helps you organize your major claims, reasoning, supporting details, and evidence.
  Creating an outline is also a way to create a natural flow for your ideas and provide a foundation for
  engaging your audience. Doing this basic organizational work at the beginning will help you present
  your ideas so that they will have the greatest impact on your audience.</p>

  <p>The first step in creating your outline is to develop a purpose statement. This one-sentence statement
  reveals what you hope to accomplish in the presentation—that is, your objective. The purpose statement
  isn’t something that you will include in your actual presentation; the purpose statement is for you.
  It will help you keep your audience at the center of your script, create a central idea, and, most of
  all, give you a realistic goal. One example of a purpose statement for an informational speech might
  read, “By the end of this presentation, my audience will better understand the impact of plastic waste
  on the ocean and the world.” Or, for a persuasive speech, a purpose statement on a similar topic might
  read, “By the end of this presentation, my audience will feel compelled to reduce their use of disposable
  plastic.”</p>

  <p>Although a speaking outline resembles an outline for an academic paper, with special considerations
  for the genre, it does not need to be as detailed as an outline for a research paper. Rather, a speaking
  outline will form the framework for speech. Feel free to write your outline as complete thoughts, sentence
  fragments, or even bullet points.</p>

  <p>A presentation’s basic format is relatively similar to most other writing: an introduction, three
  to five major supporting points, and a conclusion. The major differences will be the genre-specific
  choices you make about presenting this information.</p>

  <h3>Introduction</h3>

  <p>Like most persuasive writing, your presentation needs an introduction that establishes its purpose.
  The introduction should engage the audience, present the topic and main ideas, and validate the speaker’s
  credibility. Engaging your audience is important. You can capture an audience’s attention by relating
  an anecdote or a quotation, posing a question, using humor, relating surprising facts or statistics,
  or any other method you think will do the job.</p>

  <p>The introduction will usually lead seamlessly into a definitive statement of the main theme or claim.
  As you would include a thesis in the introduction of a piece of persuasive writing, your introduction
  here also should include a statement that previews the main idea and briefly touches on key points.
  Though you are outlining your presentation rather than writing a full script, it is a good idea to write
  your thesis so that you clearly identify your aim. When presenting, you won’t have to read your script
  word for word, but recording the thesis clearly will enable you to summarize the central idea of your
  presentation easily.</p>

  <p>Finally, the introduction is your opportunity to establish credibility with your audience and to
  tell them why they should listen to what you have to say. Include a brief statement of your credentials,
  experience, and knowledge that demonstrates your credibility or authority on the topic.</p>

  <h3>Body</h3>

  <p>The main section of the outline, the body is the longest part of the script and the one in which
  you present key points to support the main idea. Each key point should stem organically from the script’s
  goal and your thesis. Although standard practice is to present three key ideas, you may choose to have
  between two and five. Any fewer, and you won’t support your thesis sufficiently; any more, and your
  audience will lose track of them. Back each key idea with several points, including reasoning, evidence,
  and audiovisual support.</p>

  <p>You can organize your key ideas in several ways. Determining an organizational pattern helps you
  narrow the central ideas generated from research and allows you to plan material for your script. Topical
  patterns break main ideas into smaller ideas or subcategories. After dividing the topics into subtopics,
  consider the most logical order of points. There is often no right answer to this order, so feel free
  to move your ideas around to create the greatest impact. For example, a topic discussing World War II
  battles might best be presented in chronological order (listed or arranged according to time sequence),
  but a topic broken down to address the causes of World War II (diplomatic factors, nationalism, World
  War I peace treaty) may not fit into an obvious pattern. In a persuasive script, problem-and-solution
  or cause-and-effect patterns of reasoning may be the best way to organize ideas. These and other organizational
  patterns are discussed in Reasoning Strategies: Improving Critical Thinking.</p>

  <h3>Conclusion</h3>

  <p>This portion of the script provides a summary and is your final opportunity to make an impression
  on your audience. Typically, in this section, you restate the thesis convincingly and, if applicable
  in a persuasive script, tell your audience what you believe they should do. Also, you briefly revisit
  each key idea in the context of how it supports your thesis. Strong conclusions are especially important
  in scripts.</p>

  <p>One strategy for writing conclusions is the “mirrored” conclusion that ties back to the introduction.
  For example, if you use a statistic to engage your audience’s attention, you return to that statistic
  in the conclusion. Consider the following example.</p>

  <p>Introduction: It takes 450 years for one plastic bottle to decompose in a landfill. Now consider
  the fact that, according to the U.S. government, at least 50 million plastic bottles are thrown away
  each day in the United States.</p>

  <p>Mirrored Conclusion: Each time you’re tempted to reach for a plastic bottle, contemplate the 50 million
  that end up in landfills each year. Consider other options that spare our environment from the centuries
  of decomposition that each one contributes to.</p>

  <p>For writers who have difficulty beginning, one idea is to reverse-engineer the structure of the script.
  Beginning with the conclusion will help you know where you need to end up, thus making it easier to
  create a roadmap for getting there. This strategy can provide consistency and add emphasis to the key
  ideas in the script.</p>

  <h3>Outline</h3>

  <p>Keeping in mind the basic parts of a script outline, you can now begin to craft a skeletal version
  your own. Use a graphic organizer like Table 19.1 to gather and organize your initial thoughts.</p>

  <p>Topic:</p>

  <p>General Purpose:</p>

  <p>Purpose Statement:</p>

  <p>Hook:</p>

  <p>Introduction Thesis:</p>

  <p>Body</p>

  <p>Key Idea 1: • Reason(s): • Evidence:</p>

  <p>Key Idea 2: • Reason(s): • Evidence:</p>

  <p>Key Idea 3: • Reason(s): • Evidence:</p>

  <p>Restatement of Thesis:</p>

  <p>Conclusion Closing Statement:</p>

  <p>A sample skeletal outline might include the following information.</p>

  <p>Topic:</p>

  <p>General Purpose:</p>

  <p>Plastic waste To convince people not to use plastic water bottles.</p>

  <p>Purpose Statement:</p>

  <p>By the end of this speech, my audience will feel compelled to reduce their use of disposable plastic.</p>

  <p>Hook:</p>

  <h3>Introduction</h3>

  <p>It takes 450 years for one plastic bottle to decompose in a landfill. Now consider the fact that,
  according to the U.S. government, at least 50 million plastic bottles are thrown away each day in the
  United States.</p>

  <p>Thesis: We should reduce our use of disposable plastic.</p>

  <p>Key Idea 1: Plastic production increases carbon emissions and contributes to global warming.</p>

  <ul><li>Reason(s): Plastic production requires a lot of energy and resources. • Evidence: 1.5 million
  barrels of oil are used each year to make plastic bottles.</li></ul>

  <p>Body</p>

  <p>Key Idea 2: Most plastic is never recycled.</p>

  <ul><li>Reason(s): Recycling plastic is not efficient. • Evidence: Only 9% of plastic ever produced
  has been recycled.</li></ul>

  <p>Key Idea 3: Plastic waste is filling our landfills.</p>

  <ul><li>Reason(s): Plastic manufacturing is increasing, and there is nowhere to put all the used plastic.</li><li>Evidence:
  40% of plastic is single-use then thrown away.</li></ul>

  <p>Restatement of Thesis: All people should reduce their use of disposable plastic.</p>

  <p>Conclusion</p>

  <p>Closing Statement:</p>

  <p>Each time you’re tempted to reach for a plastic bottle, contemplate the 50 million that end up in
  landfills each year. Consider other options that spare our environment from the centuries of decomposition
  that each one contributes to.</p>

  <p>Drafting: Signpost Language; Tone, Repetition and Parallelism; Media and Other Visuals; and Cultural
  Cues</p>

  <p>After you have analyzed your audience, selected and narrowed the topic, researched supporting ideas,
  and created a skeletal outline, you can begin adding flesh to the outline. Gather all supporting material
  for your topic, and consider the various ways to include notes about effective language and delivery.</p>

  <h3>Signpost Language</h3>

  <p>The function of signs is to direct people to the places they are going. Think of a road sign that
  points to an exit off the highway. Signs also can warn people of places they should not go. Similarly,
  in presentations, signposts are statements that help the audience know where your presentation is going.
  These may include</p>

  <ul><li>a preview statement that offers an overview of the path and topics your script will take on;
  • transition statements between the introduction and body, between key points and ideas, and between
  the body and the conclusion; and • a conclusion statement that ends the script.</li></ul>

  <p>Table 19.3 shows examples of signpost language. Notice the boldfaced words, called transitions, which
  help readers and listeners navigate between ideas and concepts. Signposts should clearly connect ideas,
  are often parallel (repeated words or grammatical forms), and mark the most important parts of an argument
  or explanation.</p>

  <p>Signpost</p>

  <p>Example</p>

  <h3>Preview</h3>

  <p>“Today, I’d like to introduce you to the organization ReStart, a community outreach that makes a
  difference for those experiencing homelessness in our community.”</p>

  <p>Transition (introduction to “First, let’s look at how ReStart was formed.”</p>

  <p>body)</p>

  <p>Transition (key idea to key “Let’s begin by examining the reasons some people experience homelessness,
  idea) which can help you understand the need for an organization like ReStart.”</p>

  <p>Transition (key idea to key “Now that you understand something about homelessness, let’s look at
  how idea)</p>

  <p>ReStart addresses the problem.”</p>

  <p>Transition (key idea to key “It’s not just the staff at ReStart that can help. You can play a role
  in helping those idea) experiencing homelessness too.”</p>

  <p>Conclusion (restatement of thesis)</p>

  <p>“Thus, as you can see, ReStart is an organization with a long history in the Kansas City area, one
  that not only provides services to those experiencing homelessness but also offers an opportunity for
  volunteers to play a role.”</p>

  <h3>Tone</h3>

  <p>Tone is a writer or speaker’s attitude as it is conveyed in a composition or script. A writers or
  speaker’s language choices as well as other elements specific to speech, such as gestures and body language,
  help create tone. The tone of a presentation depends largely on its purpose, audience, and message.</p>

  <p>Consider this text from Annotated Student Sample.</p>

  <p>Without warning, the smaller dog launched itself from its owner’s lap, snarling and snapping at the
  guide dog. The owner of the small dog jumped up and retrieved her animal from the Labrador’s vest and
  stomped back to her seat. That neither she nor the still-yapping dog had an obvious panic attack amazed
  me, as I questioned, to myself of course, what possible service was being provided—other than a moment
  of exercise.</p>

  <p>The author’s tone of disapproval is evident when he relates the actions of the untrained, unrestrained
  dog causing trouble for others. The attitude is emphasized by words with negative connotations such
  as snarling and stomped.</p>

  <p>The tone you choose for your script will help you relate to your audience. It can help your audience
  feel connected to you and promote your credibility as well as that of the message you wish to impart.</p>

  <p>Notice, too, the use of the first person in script writing. While you may have been taught not to
  use first-person pronouns in most formal or academic writing, speech is completely different. Even in
  formal scripts, the use of I helps connect listeners to the speaker. In general, effective speakers
  also use simple, declarative statements in the active voice (subject + verb + object) to emphasize their
  key ideas and to keep audiences focused on them. Longer, complex sentences may cause audience members
  to lose focus. Thoughts and sentences should flow conversationally. See Clear and Effective Sentences
  for more about effective sentences, including use of the active voice.</p>

  <h3>Repetition and Parallelism</h3>

  <p>Repetition and parallelism are literary devices that authors and speakers use for emphasis, persuasion,
  contrast, and rhythm. In repetition, a word, phrase, or sound is repeated for effect. Repetition is
  also employed in a variety of figurative language. The following example is an excerpt from the surrender
  speech of Chief Joseph (1840–1904), the Nez Percé leader who surrendered to the U.S. Army in 1877 after
  the U.S. government had appropriated Nez Percé land. Rather than be forced to live on reservations,
  Chief Joseph and his followers unsuccessfully attempted to flee to Canada, a journey of about 1,500
  miles, during which they were pursued and vastly outnumbered by the U.S. Army. Notice the use of repetition
  to emphasize the cold and the death toll.</p>

  <p>I am tired of fighting. Our chiefs are killed; Looking Glass is dead, Too-hul-hul-sote is dead. The
  old men are all dead. . . . He who led on the young men is dead. It is cold, and we have no blankets;
  the little children are freezing to death. My people, some of them, have run away to the hills and have
  no blankets, no food. No one knows where they are—perhaps freezing to death. I want to have time to
  look for my children. . . . Maybe I shall find them among the dead.</p>

  <p>Parallelism is the use of similar or equivalent constructions of phrases or clauses to emphasize
  an idea. Parallelism is especially helpful for organizational and structural concerns in a script or
  composition. Consider this excerpt from President John F. Kennedy’s (1917–1963) inaugural address:</p>

  <p>Let every nation know, whether it wishes us well or ill, that we shall pay any price, bear any burden,
  meet any hardship, support any friend, oppose any foe in order to assure the survival and the success
  of liberty.</p>

  <p>Kennedy uses parallelism for impact as well as to organize his support for the idea that the United
  States works collaboratively for “the success of liberty.” Parallelism and repetition can work hand
  in hand as organizational strategies and to emphasize ideas in your script.</p>

  <p>Anaphora and epistrophe are two related forms of parallelism.</p>

  <p>Anaphora: repetition of the first word or phrase across phrases or sentences</p>

  <p>“We shall fight on the beaches, we shall fight on the landing grounds, we shall fight in the fields
  and in the streets, we shall fight in the hills.”</p>

  <p>—Winston Churchill’s “We Shall Fight on the Beaches”</p>

  <p>“And that the government of the people, by the people, for the people, shall not perish from the
  Earth.”</p>

  <p>Epistrophe: repetition of the last word or phrase across phrases or sentences</p>

  <p>—Abraham Lincoln’s Gettysburg Address</p>

  <p>“For man holds in his mortal hands the power to abolish all forms of human poverty and all forms
  of human life.”</p>

  <p>—John F. Kennedy’s inaugural address</p>

  <p>You can hear examples of parallelism and repetition in audio excerpts on the website American Rhetoric
  (https://openstax.org/r/American_Rhetoric).</p>

  <p>In Chapter 19, you have learned about rhetorical techniques used in speech, including parallelism,
  repetition, and signpost language.</p>

  <p>Access multimedia content (http://openstax.org/books/writing-guide/pages/19-5-writing-process-writing-tospeak)</p>

  <h3>Media and Other Visuals</h3>

  <p>Because speeches are auditory by nature, you can enhance their effectiveness by using media and other
  visual aids. These elements can add emphasis, help the audience understand a complex idea, or otherwise
  support your message. But be careful not to detract from your speech with the media you choose. A common
  error speakers make is to include too much or irrelevant media.</p>

  <p>CC BY 2.0) When considering media and visual aids, remember to keep in mind your audience, purpose,
  and message. Note these considerations about media and visual aids:</p>

  <ul><li>Use media in a way that doesn’t clutter or overwhelm your presentation. The media you choose
  should enhance, not detract from, your message.</li><li>Ensure that visuals are large enough for the
  audience to see. Create or obtain media that is clear, concise, and of high quality. Tiny, hard-to-read
  graphs or muffled audio clips will only frustrate your audience.</li><li>Keep a consistent visual style,
  including font, colors, backgrounds, and so on. • Provide space and time for your audience to listen
  to, read, and/or view media and other visuals in your presentation. • Consider accessibility; think
  about an audience member who relies on an interpreter or who is visually impaired. How can you make
  your presentation accessible to that person? • Ensure that your media engages the audience, thus making
  your speech delivery more dynamic. • If using technology, make every effort to test it before your presentation.
  Read Aloud As you finish drafting your script, consider all the potential aspects of language and organization
  you might use to create meaning for your audience. Remember that you will give your presentation orally.
  Therefore, during drafting, take a few minutes at key points—after completing a section, for example—to
  practice your presentation by reading it aloud. Listen to how it sounds and make adjustments as you
  go along, considering the oral elements of speech that lend themselves to fluency.</li></ul>

  <h3>Peer Review: Using Symbols</h3>

  <p>After you have completed the first draft of your outline, peer review can help you refine your ideas,
  improve your organization, and strengthen your language. One aspect of effective peer review is marking
  the text for revision. You and your peers can do this kind of marking by using symbols, which allow
  reviewers to give feedback quickly and thoughtfully without overwhelming the writer with notes. Figure
  19.10 below provides some of the editing marks to use for proofreading and review. Peer reviewers may
  also write in the margin to indicate issues with organization, tone, or flow of ideas.</p>

  <h3>Revising: Interpreting and Responding to Symbols and Context Cues</h3>

  <p>After a peer has reviewed and provided feedback on your first draft, you will begin the revision
  process. Remember that writing is recursive, meaning it is not linear. Although revision won’t go on
  forever, it’s important to revise your work at each point in the writing process. In fact, even though
  you are officially working with the first draft, it is likely your writing has already undergone some
  process of revision. You will want to continue this process to strengthen your writing, respond to peer
  review, and ensure that your script fulfills your intent. Consider the items in the following checklist.</p>

  <h3>Checklist for Revision</h3>

  <p>□ Read the draft aloud. ◦ Is it organized logically? ◦ Is the topic immediately clear?</p>

  <p>□ Ensure that the script has a clear purpose. □ Think about your audience.</p>

  <p>◦ Does the script respond to what the audience already knows about the subject? ◦ Does it support
  new knowledge? ◦ Have you taken culture into consideration?</p>

  <p>□ Review the introduction to determine whether it hooks the audience and establishes a thesis. □
  Review the sentences in each paragraph and the order of the paragraphs to ensure that the organization
  supports the thesis. □ Review the conclusion to ensure that it supports the thesis and provides a strong
  ending. □ Read the script again after making revisions to find ways to improve transitions and connections.
  Consider tone, signpost language, parallelism, and repetition. □ Review the draft for conventions, including
  grammar, spelling, and punctuation.</p>

  <p>19.6 Evaluation: Bridging Writing and Speaking</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Produce effective written and oral content based
  on genre conventions, including common formats and design features. • Demonstrate understanding and
  use of genre conventions for structure, coherence, tone, and mechanics.</p>

  <p>Ask a peer to use the following rubric to evaluate your final presentation draft. The rubric covers
  oral fluency, rhetorical choices, and organizational principles necessary for creating a strong presentation.
  After going through the rubric, your peer reviewer may leave comments or other feedback to help you
  understand their reasoning. Although you may not agree with all of their ideas, peer reviewers offer
  an opportunity for you to get an outsider’s perspective on your writing. Be sure to ask questions about
  parts you do not understand, and listen closely to your peer reviewer’s reasoning. Then review your
  script again according to the feedback you think you can address.</p>

