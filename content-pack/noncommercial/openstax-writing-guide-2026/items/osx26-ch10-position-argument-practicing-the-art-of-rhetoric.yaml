  <p>10.8 Spotlight on … Citation</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Apply citation conventions systematically in your
  work. • Demonstrate an understanding of the concepts of intellectual property that motivate documentation
  conventions.</p>

  <p>Academic writing relies on evidence and support. When this evidence or support comes from others,
  you must cite it properly to give credit where credit is due. Citing information to its source will
  build your credibility. See Research Process: Accessing and Recording Information and MLA Documentation
  and Format and APA Documentation and Format for more information on citations.</p>

  <h3>Types of Citation</h3>

  <p>In a position argument, you are expected to provide evidence that supports your stance and addresses
  counterclaims to it. You may use one of three types of citation: quoting, paraphrasing, or summarizing.
  If you are quoting the exact words of a person or a written work, you must</p>

  <ul><li>use quotation marks around the words; • credit the source of your quotation; and</li><li>use
  the formatting style mandated in the style guide your instructor assigns.</li></ul>

  <p>If you are paraphrasing, you are shaping someone else’s words into your own words, but you are conveying
  the same meaning as the original speaker or writer. When you are paraphrasing in academic writing, provide
  formatted information about the original source so that readers know from whom the idea originates.</p>

  <p>If you are summarizing, you are condensing the words of someone else into a shorter form but still
  retaining the main point and major details. As with quoting and paraphrasing, provide formatted information
  about the original source when you are summarizing.</p>

  <p>For more information about quoting, paraphrasing, and summarizing, see Research Process: Accessing
  and Recording Information.</p>

  <h3>Examples of Types of Citation</h3>

  <p>American author Jack London (1876–1916) began his novel The Call of the Wild (1903) with this paragraph:
  Buck did not read the newspapers, or he would have known that trouble was brewing, not alone for himself,
  but for every tide-water dog, strong of muscle and with warm, long hair, from Puget Sound to San Diego.
  Because men, groping in the Arctic darkness, had found a yellow metal, and because steamship and transportation
  companies were booming the find, thousands of men were rushing into the Northland.</p>

  <h3>Quoting in MLA style</h3>

  <p>If you are quoting from that paragraph using MLA style, you might have something like this: The Call
  of the Wild sets the contrasting tone for the story with its second sentence, highlighting the differences
  between nature and industrialization: “Because men, groping in the Arctic darkness, had found a yellow
  metal, and because steamship and transportation companies were booming the find, thousands of men were
  rushing into the Northland” (London 1).</p>

  <h3>Quoting in APA style</h3>

  <p>If you are quoting from that paragraph using APA style, you might have something like this: The Call
  of the Wild sets the contrasting tone for the story with its second sentence, highlighting the differences
  between nature and industrialization: “Because men, groping in the Arctic darkness, had found a yellow
  metal, and because steamship and transportation companies were booming the find, thousands of men were
  rushing into the Northland” (London, 1903, p. 1).</p>

  <h3>Paraphrasing</h3>

  <p>If you are paraphrasing that paragraph, you might have something like this: In the opening paragraph
  of The Call of the Wild, Jack London establishes the conflict between man and nature by letting readers
  know that because Buck doesn’t read, he doesn’t know that trouble is at hand for himself and every other
  dog on the west coast of the United States. The trouble occurs because gold has been discovered in the
  Arctic and thousands of men are rushing to the Northland by land and sea so that they can also take
  part in the discovery.</p>

  <h3>Summarizing</h3>

  <p>If you are summarizing that paragraph, you might have something like this:</p>

  <p>In the opening paragraph of The Call of the Wild, Jack London establishes the conflict between man
  and nature by telling readers that neither Buck nor any other dog knows that trouble at hand because
  of the gold discovered and men rushing to find it.</p>

  <h3>Intellectual property</h3>

  <p>When you create a written work, you do not want someone else to take credit for it. It is your intellectual
  property, an original idea resulting from your creativity and work and that, consequently, you own.
  If you look at a book, for instance, you will see a copyright symbol (©) somewhere in the opening pages,
  usually along with other publication information. This symbol gives the copyright owner legal protection
  against those who try to plagiarize (steal material and publish it as their own). Plagiarism can refer
  to entire works or parts of works that are not cited as being created by someone else, whether the work
  is copyrighted or not. If writers or speakers use someone else’s words, ideas, or information, they
  must cite the source. For detailed information about what plagiarism is and is not, see Spotlight on
  … Ethical Research.</p>

  <p>10.9 Portfolio: Growth in the Development of Argument</p>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Reflect on and articulate how you used the steps of the writing process and how they affected
  your work. • Reflect on and write about your use of reasoning and critical-thinking skills in developing
  your paper. As you complete each writing assignment, you complete another part of your portfolio. After
  each paper, think critically about your writing process, reflecting on what you created from the first
  steps of discovering ideas to the last steps of composing and editing the final paper.</li></ul>

  <h3>Lessons Learned</h3>

  <p>As you reflect on writing your position argument, answer these questions about your writing process.</p>

  <ul><li>What factors helped you determine the topic for your paper? • Which brainstorming method worked
  best for you to develop ideas for your topic? • How did you arrive at a workable thesis? • How did you
  use ethos, pathos, and logos in your paper? • How did you use kairos in your paper? • What outside sources
  did you consult to get information to support your topic or to understand counterclaims? • How did you
  determine which counterclaims to address? • What type of citation did you use for giving credit to material
  you did not write? • How did collaboration with others help you as you wrote and revised your paper?
  • In collaboration, what specific constructive criticism did you receive that helped you? • In what
  ways was this paper easier or harder to write than others you have written? • What could you have done
  differently to make writing your paper easier or more effective? • What insights about your topic did
  you gain from writing your paper?</li></ul>

