  <p>Teaching Resources</p>

  <p>Overview and Teaching Strategies</p>

  <p>The main point of this chapter is that social media platforms can be used as utilities in technical
  communication, not just for personal entertainment or marketing. As communication mediums they are uniquely
  powerful for technical writers because they reach such a wide audience of readers or potential readers.</p>

  <p>This chapter would be especially useful to teach when students are discussing audience, the types
  of media used for technical communication, and the purposes for a technical communication project. And
  while this essay focused on only a few of these platforms when providing examples, students should be
  encouraged to think about other platforms not mentioned, and perhaps those they use much more frequently.</p>

  <p>Above all, the important items to highlight while presenting this chapter are:</p>

  <ul><li>The platform size, • Its audience characteristics, and • The type of media it allows users to
  share.</li></ul>

  <p>All this should really challenge students to think about audience and purpose. The three items listed
  earlier will depend on what the communication is and who it is for. Once students understand that, they
  will be able to view social media platforms as simply another way to communicate to their readers.</p>

  <h3>Discussion Questions</h3>

  <p>To help students explore the ideas discussed in these entries, consider having them address—as individuals,
  in small groups, or as an overall class— the following questions:</p>

  <p>1. As best you can, identify the audience of the social media platform you use most? What type of
  media is best shared on that platform? Based on these answers, what technical communication purpose
  would that platform best be suited for and why?</p>

  <p>2. Are you able to look at the followers of a certain brand on a social media platform – for example,
  a car company like Tesla, or a technology company like Apple – and find similarities amongst those people?</p>

  <p>3. Is there a form of technical communication, or perhaps a purpose, that social media platforms
  in general would not be suited for? If so, what type of medium would instead be best and why?</p>

  <p>4. Think about what an audience is. Now, discuss how you think social media use in the technical
  communication industry might change how we define audience. Does it change the relationship between
  writer and reader? If so, how?</p>

  <p>5. Can you identify any new skills or knowledge you might need as a technical writer working with
  social media platforms that technical writers of twenty years ago might not have needed?</p>

  <p>Examining these items can help students better reflect upon and consider how to apply the ideas presented
  in the essay within the context of their own writing processes.</p>'
