  <p>Teacher Resources for “‘Is This for a Grade?’”: Understanding Assessment, Evaluation, and Low-stakes
  Writing Assignments</p>

  <p>Overview and Teaching Strategies</p>

  <p>The inspiration for this article came from the many times students asked questions along the lines
  of, “Is this for a grade?” and “Do we have to turn this in?” These are reasonable questions. Students
  want to know the relative weight of individual assignments in the broader scope of coursework. This
  is often because they are making decisions about how best to manage their time with so many school,
  work, and home obligations. I was also inspired by questions like, “Is my writing good enough?” and
  “Is this what you want?” These are also reasonable questions. Students want to ease their fears about
  success in courses they see as particularly difficult or with which they’ve struggled in the past. However,
  evaluation questions like these tend to reinforce a grade mindset that can be counterproductive for
  low-stakes writing.</p>

  <p>My goal with this essay is to kickstart conversations about grades— what they do and don’t represent—and
  why there are often fewer evaluation moments in college compared to high school. I recommend that students
  read this chapter when low-stakes writing is first introduced in a class. You can engage students’ prior
  knowledge about grades before they read the chapter by having them discuss the first question below.
  Note that students may have a difficult time understanding the difference between low-stakes and high-stakes
  writing. Ask them to identify and discuss examples of each that they previously encountered in school.
  This will give them a personal point of reference while reading this essay.</p>

  <h3>Questions and Prompts</h3>

  <p>1. Think back to the last time you completed a high-stakes writing assignment under pressure. Maybe
  it was a timed writing exam or a project that you waited until the last minute to complete. What was
  that experience like? How did you feel about what you wrote? How might those feelings and experiences
  have changed how you think about and approach writing now?</p>

  <p>2. This essay is about high-stakes and low-stakes writing. How can reading be high-stakes and low-stakes?
  What are some examples? How might your experiences with high-stakes and low-stakes reading prepare you
  for reading in school and your everyday life?</p>

  <p>3. Teachers, school administrators, and employers have argued for decades about “grade inflation.”
  Discuss what you think “grade inflation” is and why some might see it as a problem while others don’t.</p>

  <p>4. Pick a low-stakes writing activity from the class in which you are reading this essay and try
  it out in your other classes. Share what you learned after a week or two. As a class, discuss how the
  skills you learned from the activity might transfer to other contexts, including outside of school.</p>'
