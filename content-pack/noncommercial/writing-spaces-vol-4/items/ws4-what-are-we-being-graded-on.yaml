  <p>Teacher Resources for What Are We Being Graded On?</p>

  <h3>Overview</h3>

  <p>Writing teachers know that grading is fraught with questions about what writing is in the first place.
  This essay takes the position that students should be aware of this complexity so that they can redefine
  the grading of writing as not the application of static standards but instead something that changes
  from one situation to the next. In the big picture, this understanding of grading helps students understand
  more about writing itself. The essay also gives students practical tips on how to interpret grading
  standards, and offers some new ways to think about how their writing is graded.</p>

  <p>To do so, this essay relies on an illustrative anecdote from my own teaching where a failure to define
  clear standards led to an unfair grading situation. It then moves to contextualize that example within
  the notion of situational writing, and uses James Paul Gee’s theory of Discourse to explain how students
  may be marked as outsiders when writing in college.</p>

  <h3>Teaching Strategies</h3>

  <p>Because of its multiple purposes (its practical advice and its broader theoretical basis), this essay
  can be helpful at various points in the semester. The essay may help in the beginning, when students
  are just acclimating to college and are unsure of what will be expected of them — this essay might give
  them a useful framework for interpreting the many assignments that will come their way.</p>

  <p>It also might be a helpful essay to give out in conjunction with the first writing assignment of
  the semester. It can help students read the assignment sheet or rubric closely, and you can invite the
  class to construct definitions of certain words (“clear,” “original,” “well-organized”) in an attempt
  to build consensus around the standards for an assignment. One method may be to assign students to investigate
  particular components of your rubric in small groups, and allowing groups to present to each other about
  what they think constitutes success in each of these categories, which invites you to enter a productive
  conversation with your students about your own expectations.</p>

  <p>If assigning this essay early in the semester, it might be worth bringing the feedback log to class
  as an in-class assignment. Students could keep the feedback log privately in a writing notebook, documenting
  the responses that you or their peers had to the choices that they made. You could also assign the feedback
  log as small-group work, where students can discuss what they learned from the feedback, or come up
  with some new strategies for achieving their goals.</p>

  <p>This essay also may fit near the end of the semester, when students are working on high-stakes final
  projects in your class (or in other classes) and may want to know how to navigate expectations. You
  might ask students to compare different evaluative terms across different assignments in your class
  or in other classes that they have taken so that they can practice identifying these slippery terms
  in the future.</p>

  <p>This piece may be helpful for a teacher revising their own syllabi or rubrics. Some teachers may
  rely on the abstract terms that are mentioned in this piece (like organization, or purpose) and doing
  a deep dive on how those words can get picked up by students could help a teacher clarify how they are
  using those words in their materials. It also presents an opportunity to consider the role of surface-level
  features in grading — there isn’t a problem with showing students discourse-specific language, but this
  piece offers a framework for reflecting on the relationship between those features and course grades.</p>

  <h3>Discussion Questions</h3>

  <p>1. When reading this essay, could you think of any specific writing assignments from your past where
  you felt like there was a miscommunication of expectations? What happened? What was the teacher expecting,
  and what did you offer instead?</p>

  <p>2. What should the writer of this essay have done with the problem he posed in the beginning? What
  would have been a fair way to grade all of these essays while still offering guidance on how to meet
  expectations?</p>

  <p>3. Near the end of the essay, the writer suggests that you can set your own assessment standards
  for yourself. Think about a paper that you have coming up: what do you want to get out of it? How do
  you think you can use it to improve your writing?</p>

  <p>4. How does hearing about the imprecision of grading methods make you feel?</p>

  <p>5. How else can students get to know the expectations of a given writing assignment? What strategies
  have you used in the past?</p>

  <p>6. Can you think of a time that your writing or speaking marked you as an outsider to a group, or
  where you noticed someone did not belong to a group you are part of because of the way they spoke or
  wrote? What was the marker of difference, and what happened?</p>'
