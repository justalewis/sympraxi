  <p>Teacher Resources for “What is Rhetoric?: A ‘Choose Your Own Adventure Primer”</p>

  <h3>Overview and Teaching Strategies</h3>

  <p>In graduate school, I started to collect definitions of rhetoric. I wasn’t systematic about it, nor
  did I have a particular reason for doing so outside of the fact that I had observed ​a lot of definitions
  for this term. I found around twenty at first, then I had fifty, then a hundred. My list kept growing
  until one day I realized these definitions had pedagogical value. Firstyear writing students and others
  new to the study of rhetoric are often given watered-down definitions that sometimes manage to not only
  make rhetoric sound vague and uninteresting but also tedious—something for pedants. Indeed, my skin
  crawls every time I see rhetoric “quizzes” that ask students to identify equally watered-down ideas
  like logos, ethos, and pathos. So, I decided to introduce students to rhetoric not by simplifying it
  but by presenting it in all its complexity from the jump.</p>

  <p>I didn’t want to give students a definition of rhetoric, I wanted to give them all the definitions.
  I wanted them to mix up these definitions, get confused, try them out, make their own. Simply dumping
  pages of definitions into the laps of students isn’t helpful, however, which is how the idea for this
  “choose your own adventure” essay developed. What better way to introduce students to rhetoric than
  by giving them the opportunity to be persuaded by multiple definitions while also being guided by their
  own interests? After all, as I say in the chapter, what rhetoric is depends on the person doing the
  looking.</p>

  <p>What makes this essay different from more conventional introductory essays is that it provides information
  while also inviting readers to participate in the text’s own performance as a text. That is, instructors
  can use this essay to illustrate how rhetoric is an abstract art with material effects. Or is it a material
  science with abstract effects? As one can see, the definitions we choose to explain what rhetoric is
  and does naturally constrain how we imagine its scope and utility. But that’s how rhetoric works.</p>

  <h3>Discussion Questions</h3>

  <p>1. How did you end up reading this essay? Go back and retrace your steps: What sections did you read
  and in what order? Spend a few minutes reflecting on what this experience says about you. Why did you
  skip certain sections? What sections were most interesting and why?</p>

  <p>2. What is at stake in defining rhetoric as either a science, an art, or both? That is, why does
  it matter (or not matter) whether we identify rhetoric using these categories?</p>

  <p>3. The definitions in each section of this essay are meant to highlight a specific aspect or quality
  of rhetoric, so the definitions in Section 4 relate to how rhetoric can mean effective communication,
  the definitions in Section 5 relate to how rhetoric can mean persuasion, etc. But many of these definitions
  could be classified under more than one section. Pick one definition from this essay that you think
  could be moved to at least two other sections and explain why.</p>

  <p>4. Pick three of the most recent emails you have either received or sent. Thinking about the different
  approaches to understanding rhetoric outlined in this essay, how would you characterize each of these
  messages as examples of rhetoric?</p>

  <p>5. Invent your own definition of rhetoric. You can make one up from scratch, or you can select ideas
  or phrases to patch together (this is call “patchwriting”) from any of the definitions included in this
  essay. Once you have a working definition, spend a few minutes freewriting about the choices you considered
  as you created this definition.</p>

  <p>Activities</p>

  <p>Persuade the Class</p>

  <p>Have students assemble into small groups and instruct each group to select one definition of rhetoric
  that they believe is the most useful. Then have each group plan an informal presentation in which they
  must convince the other groups that the definition is the best. After each group presents, the other
  groups must note what elements of their presentation were persuasive and why. From there, you could
  conduct a public or private poll, perhaps ranking each presentation, to determine which group came out
  on top. The discussion could then turn to why students focused on the particular elements of each presentation.
  Such an activity could easily be stretched over 2-3 class meetings.</p>

  <h3>Collaborative Writing</h3>

  <p>Ask each student to develop their own definition of rhetoric (see Discussion Question 5 above) and
  then instruct students to paste their definition into a shared document, such as a Google Doc, that
  can be accessed remotely. You could then have small groups of students (perhaps in twos or threes) to
  start a new shared document where they take each of their classmates’ definitions and arrange them into
  a brief essay like this one. Or you could ask each group to decide on a medium and delivery style of
  their choosing. Not only would such an activity engage students in critical thinking about rhetoric,
  but it also encourages them to experiment with collaborative composition. Such an activity could be
  broken into smaller tasks and extended across multiple class meetings.</p>'
