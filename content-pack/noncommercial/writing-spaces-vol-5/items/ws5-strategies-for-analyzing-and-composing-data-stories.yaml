  <p>Teacher Resources for “Strategies for Analyzing and Composing Data Stories”</p>

  <h3>Overview and Teaching Strategies</h3>

  <p>This essay introduces data storytelling in the context of multimodal composing. I assign it to students
  when I introduce multimodality because data storytelling plays a central role in multimodal genres ranging
  from infographics and white papers to social media posts. That said, the chapter could also be beneficial
  to help students learning to write about data they have collected through their own surveys or interviews.
  Without explicit instruction in the use of data, students often struggle to both analyze the use of
  data in multimodal texts as well as to use data effectively and ethically in their own multimodal texts.
  Multimodal composition pedagogy prepares students to discuss multimodal texts in terms of different
  types of media and modes of communication. While this vocabulary helps students to analyze the data
  stories they encounter and to plan their own data stories, it is not fully sufficient. Students need
  additional vocabulary to understand the strategies available for working with data. In this essay, I
  share a checklist of critical questions students can use to analyze the use of data in multimodal texts
  and apply the checklist to the analysis of a sample data story. I also introduce students to the data
  storytelling composing process and model this process by demonstrating how I worked through it to produce
  a data story.</p>

  <p>This chapter focuses on introducing strategies for reading and composing data stories, and it does
  not go into detail about design principles or modes of communication. Consequently, it is best to combine
  this chapter with additional readings that discuss multimodal composing more generally and the vocabulary
  of page design. In my own courses, I also provide more information to students about specific graph
  types to help them make informed choices, and I spend time in class showing them how to use free online
  programs for composing multimodal texts such as Canva, Piktochart, and Adobe Illustrator. Some of the
  questions and activities that I use with my students are included below:</p>

  <h3>Discussion Questions</h3>

  <p>1. Keep track of the data stories you see on social media over the course of a day or a week. What
  patterns do you notice in the kinds of stories or arguments made in these texts?</p>

  <p>2. Use the critical analysis questions in Table 1 to analyze one of the data stories you saw on social
  media. Discuss why you think the data story does or does not use data effectively.</p>

  <p>3. I suggested that the title of Figure 4 should probably be revised for accuracy. Discuss what a
  more accurate title for this data story might be.</p>

  <p>4. Choose a topic you are working on or have recently worked on. Generate a list of questions about
  that topic you might be able to answer about it using data. Can you identify good sources of data that
  might help you answer any of those questions?</p>

  <p>5. Use the flowchart in Figure 10 to determine the best options you have for showing data in the
  following scenarios:</p>

  <p>a. You want to show how house prices in your community have changed over time.</p>

  <p>b. You want to present data for 7 online stores, their monthly e-commerce sales, and online advertising
  costs for the last year.</p>

  <p>c. You want to show which student services on campus bring in the biggest share of total visitors.</p>

  <p>6. Try using a different graph type to represent the data in the horizontal bar chart in Figure 13.
  Which graph is easiest to read and understand? Why?</p>

  <p>7. This chapter includes several examples of data stories. Choose one of them and discuss how you
  could revise its genre (as one example, you might consider how you would turn the infographic in Figure
  2 into a social media post). What changes would you make to the story to suit the changed rhetorical
  situation?</p>

  <h3>Activities</h3>

  <p>The following three activities help to scaffold the data storytelling composing process for students
  by helping them become familiar with data stories, giving them practice creating different types of
  graphs, and using free, online programs for composing multimodal texts.</p>

  <p>Data Storytelling Scorecard When I introduce data stories to my students, I like to give them several
  examples of data stories, from effective data stories to examples that have serious problems in the
  design or use of data. I put them in groups with a scorecard, below, and ask them to rank the stories
  on a scale from Great to Horrible. Directions:</p>

  <p>1. Examine the data story. What is it trying to communicate?</p>

  <p>2. Discuss with your team: Is the story clear? Is it misleading? How could it be improved?</p>

  <p>3. Rate the data story and make a short note about why you gave the rating you did.</p>

  <p>Number</p>

  <p>Your Rating</p>

  <p>Comments/Notes</p>

  <p>Great Good Bad Horrible</p>

  <p>Great Good Bad Horrible</p>

  <p>Great Good Bad Horrible</p>

  <p>Great Good Bad Horrible</p>

  <p>Great Good Bad Horrible</p>

  <p>Great Good Bad Horrible</p>

  <p>After the groups have a chance to rank the data stories, we have a whole class discussion about how
  we ranked each data story. This is a good way to talk about what makes a story effective and how content
  and design work together in these texts.</p>

  <h3>Graph Creation Practice</h3>

  <p>To help students become more comfortable creating graphs, I use a class day to give them the opportunity
  to practice making different kinds of graphs. They do need access to computers on this day. I project
  a simple spreadsheet with population data on it at the front of the class and ask them to enter the
  data into their own Excel or Google Sheets spreadsheet. Then I show them how to create a variety of
  graphs including pie charts, horizontal bar charts, vertical bar charts, line charts, and scatterplots.
  After we work together for a few minutes, I ask them to continue trying out different graph types and
  to choose the one they think makes the population data easiest to see and understand. Once they choose
  the graph they think is most effective, I show them how to add and change labels on their graph, how
  to change the color palette, and how to save and download their graph. In the last section of the class,
  we share the different graphs students made and talk through their strengths and weaknesses for depicting
  the data.</p>

  <h3>Reverse Engineer a Data Story</h3>

  <p>Having students reverse engineer a data story in class or as homework is useful in several ways.
  To reverse engineer the story, students have to recreate it using a software program designed for multimodal
  composing, such as Canva, Piktochart, or Adobe Illustrator (depending on what the students have access
  to and will use for their own projects). Students gain experience manipulating text and images using
  the program without having to worry about the content. They see how text and visuals work together in
  the story, and they also quickly see what the software program is capable of and what its limitations
  are. This helps them to plan their own projects more realistically and to appreciate the time involved
  in composing multimodal texts. The entire class can be asked to reverse engineer the same data story
  that is provided by the instructor, or students can choose to work with a data story they think is particularly
  effective.</p>'
