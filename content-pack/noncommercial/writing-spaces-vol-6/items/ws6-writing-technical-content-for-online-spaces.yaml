  <p>Teacher Resources</p>

  <p>Overview of Teaching Strategies</p>

  <p>Topic-based writing for online delivery is a paradigm shift. Most students, most teachers, too, are
  familiar with writing long documents, and with solo writing projects. Technical content is already perceived
  as difficult. Add to that the many new terms and concepts in topic-based writing. For all these reasons,
  this subject might seem intimidating to students. It’s a subject that we as instructors may struggle
  with too.</p>

  <p>I teach this content through various activities that I outline in more detail in this chapter: Cleary,
  Yvonne. “Teaching Topic-Based Writing.” Teaching Content Management in Technical and Professional Communication,
  edited by Tracey Bridgeford, Routledge, 2020.</p>

  <p>I find it helpful to introduce students to the idea of topics by asking them to explore professional
  topics that are available online (see Activity 1). This activity helps them to recognize that they are
  already familiar with this genre. They have probably used topics multiple times. When they are familiar
  with the features of the genre, I ask them to work on Activity 2.</p>

  <h3>Activity 1: Explore the Features of Professional, Published Topics</h3>

  <p>Find examples of online topics (e.g., in the Amazon Knowledge Center, the YouTube Help center, or
  the Broadcom Knowledge Base).</p>

  <p>1. Ask students to discuss the ways in which a topic matches Baker’s topic characteristics. In which
  ways does it differ from those characteristics?</p>

  <p>2. Compare and contrast topics from different organizations. Look at headings, subheadings, summaries,
  short descriptions, body text, and links, for example.</p>

  <p>3. Look at the source code for a topic (e.g., in Google Chrome, you can view the source code by clicking
  on View/Developer/View Source). In the source code, find examples of metadata.</p>

  <h3>Activity 2: Develop a Topic</h3>

  <p>1. Provide a list of example topics (e.g., for common tasks or concepts that students will understand
  or be familiar with).</p>

  <ul><li>Assign each student an individual topic to work on. Ask them to write a topic. They should include
  metadata and label parts of the content in ways outlined in this chapter. It is not necessary to use
  DITA or to use specialist software. They can use Microsoft Word or a similar word processing tool. An
  alternative is to use a wiki, where each student develops content for one page of the wiki. This approach
  enables students to collaborate on a large body of content.</li><li>Discuss in class how the topics
  could be combined in different ways to create longer documents.</li><li>Discuss in class how this type
  of writing differs from writing essays or longer documents.</li></ul>

  <h3>Discussion Questions</h3>

  <p>1. Based on your understanding of this chapter, explain how topics differ from other technical writing
  formats, such as manuals. In what ways are topics more useful and usable than printed manuals?</p>

  <p>2. Find an example of an online topic. Identify the topic type (task, concept, or reference). What
  are the features of this topic? Consider, for example, headings, short descriptions, formatting, visuals,
  and links.</p>

  <p>3. In a small group, discuss each of Baker’s seven Every Page is Page One characteristics. Which
  of these characteristics would you find easiest to apply in your writing? Which ones have the most impact
  for readers?</p>

  <p>4. Consider the skills needed for topic-based writing that are discussed in this chapter. Which of
  these skills have you developed? Which ones would you like to develop further? What strategies or activities
  would help you to develop these skills?</p>'
