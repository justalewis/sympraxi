  <p>I began with the idea about the way the technology relates to humanity, but by the end of the Facebook
  thread, I realized what I was really interested in was the social dynamics among the characters. Exchanges
  like this can happen through message boards, Instant Messenger, text messages, email, Twitter, or other
  social networking tools.</p>

  <p>When I was a graduate student, I used to use instant messaging to talk with one of my friends from
  my undergraduate years after she had moved away to Tennessee. I would message her about my work, and
  we would chat about it online. In addition to the feedback, it really helped me to put my plans into
  words. Usually, by the time I had finished explaining to her what I was writing, I had a much clearer
  idea about it. I find I can get a lot more done than I think I can by taking a little time to explain
  to myself or someone else, in writing, where I am at with my work. Usually, in the process of explaining
  it, the next idea or next step will occur to me, and then I can move forward with the writing.</p>

  <p>Another strategy I use is to send my notes to myself on email. I will write just a short paragraph
  or so of the ideas I have so far, and hit send. Then, later when I’ve had more time to think about my
  project, I’ll reply to my message with additional notes and ideas, and I’ll do that several times over
  the course of a few days. The paper begins to emerge from my collection of notes and reflections. It’s
  kind of like a journal, only it’s on email.</p>

  <h3>Using PowerPoint as an Invention Space</h3>

  <p>Presentation software such as PowerPoint can also be used as a space for invention. If you find you
  have a vague idea of what to write about, or if you have many ideas but aren’t sure how to bring them
  together into enough focus for a rough draft, creating a slide show presentation of your ideas may help.</p>

  <h3>Susan E. Antlitz</h3>

  <ul><li>Put each main idea as a heading on a slide • List your thoughts about each point, using more
  than one slide per point when needed. • Add images, audio, or video when these capture an idea you haven’t
  yet put into words but want to eventually address in your rough draft. • Add Web links to your slides
  if there is online content you think you may want to eventually cite within your document. Since school
  libraries often provide students with free access to full-text databases for professional journals and
  other periodicals, you are likely to find that a good many of your sources can be linked to. This way,
  you will be able to find them quickly when you need to. • If you aren’t sure what order to put the points
  in, or which points should be main or sub-points, that’s okay for now. PowerPoint makes it easy to reorder
  slides and move the content around later. • While not directly related to the content of your writing,
  choosing a slide design template or color scheme can make your presentation-draft look more visually
  appealing and help to reinforce a certain tone or mood while you are generating your ideas and sense
  of direction. • Making your ideas literally look good on the screen may help to boost confidence for
  anxious writers or provide a welcome change from the typical black text on a white screen. • While the
  traditional background and text color will be required in the final draft that you turn in to your instructor
  (unless your assignment guidelines specify otherwise), your behind-scenes invention work can be much
  more flexible.</li></ul>

  <p>PowerPoint or other software designed for presentation has potential as an invention tool because
  it helps us to work with the overall points or ideas in a text rather than becoming focused on the minute
  details. If you haven’t used PowerPoint before, or if you are unfamiliar with some of its features,
  there are several free tutorial videos available on YouTube.</p>

  <p>Connecting Inner and Outer Realities during Invention</p>

  <p>Growth and Change</p>

  <p>While I enjoy concept maps and am very good at creating them, they aren’t one of my primary invention
  strategies anymore. I used to love them. When I was in high school, I once made a concept map that was
  an arm span wide and an arm span tall, filled with intricate detail. I filled the entire page with miniscule
  writing, ovals, squares, and webbed lines. I even wrote all of the connections on the lines between
  the bubbles. It was an exquisite masterpiece, and it helped me to write a very detailed paper. However,
  over the years, the techniques I use have changed, and now my invention work typically includes listing,
  journaling, prayer and reflection, and instant messaging. I don’t think the methods I used to use have
  lost any of their value, but rather, the ways of thinking and connecting ideas they represent have become
  second nature, making it easier to make intuitive leaps. When one uses a particular strategy frequently,
  it can become intuitively ingrained and become instinctual.</p>

  <p>When I am inventing, I don’t try to make my notes fit into any particular form, and I allow them
  to switch form as I feel moved to do so. I often do still use a form of freewriting. I also use other
  ways of keeping the ideas flowing, like taking a short break, getting up and moving around, taking a
  sip of water, rereading what I have written and then adding more, or switching from writing on the computer
  or writing on paper or vice-versa. If you use a variety of strategies and write regularly, over time,
  your fluency and ability to keep generating text will grow. And as it does, you are likely to find that
  the strategies you use also change over time, and you’ll probably even develop some of your own.</p>

