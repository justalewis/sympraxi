  <p>Teacher Resources for “Thinking across Modes and Media (and Baking Cake): Two Techniques for Writing
  with Video, Audio, and Images”</p>

  <h3>Overview and Teaching Strategies</h3>

  <p>This essay introduces students to the concepts of integration and juxtaposition within digital media
  composition, framed using theory from Bump Halbritter, Robert E. Horn, and Corrine A. Kratz. In the
  chapter, I use the metaphor of cake baking to get students to start thinking of texts such as videos,
  podcasts, or webtexts as composed of various pieces of media that authors can change, combine, and control
  for rhetorical effect. This essay would be most useful within a unit in a writing course where students
  have to both analyze and compose digital media texts, as integration and juxtaposition can be used for
  analysis and for invention or revision. Students might do a rhetorical analysis activity first, for
  example, using integration and juxtaposition as a framework. Then, students could compose their own
  texts that use integration and juxtaposition and reflect on how and why they used the techniques and
  for what ends.</p>

  <p>The chapter offers two examples of effective uses of integration and juxtaposition that come from
  a student-authored video, “A College Collage” by undergraduate student Evan Kennedy. The examples emphasize
  using the techniques across various modes that include visuals, sounds, and words. I highly recommend
  that students view and listen to the example video “A College Collage” in its entirety in order to fully
  engage with the analysis of the examples in the chapter. “A College Collage” by Evan Kennedy can be
  found online here: https://youtu.be/RgX4U7Z25c0.</p>

  <h3>Questions and Activities for Discussion or Reflection</h3>

  <p>1. Describe a time when you baked something: a cake, a different dessert, or any bread or baked good.
  What elements and ingredients were included in your baking process, and how were they combined? How
  does your experience with baking help you to think differently about the digital media texts that you
  might compose for this class, such as a video or a podcast?</p>

  <p>2. After watching and listening to Evan’s video “A College Collage,” pick a 10-20 second sequence
  from the video, and write up a rhetorical analysis of the sequence. Focus your analysis on the integration
  and juxtaposition you see and hear in the sequence.</p>

  <p>3. Look up the different kinds of integration that Robert Horn writes about on pp. 101-104 of his
  book Visual Language: substitution, disambiguation, labeling, example, reinforcement, completion, chunking,
  clustering, and framing. (Horn’s book is open access and can be found online here: https://openlibrary.org/books/
  OL400850M/Visual_language). Using Horn’s book as a reference, write up your own definition of one of
  the types of integration. Where and when might you see, hear, or use this kind of integration?</p>

  <p>4. Find a digital media text online that uses integration or juxtaposition effectively. The text
  you find might be an image, a webpage, an advertisement, a post on social media, or a short video. Write
  up an analysis of how your chosen text uses integration or juxtaposition to achieve its purposes.</p>

  <p>5. Pick a topic, and compose a short audio or video clip that combines at least two media elements
  strategically for a certain effect. You might combine a song and several images, for example, in a way
  that aims for surprise, joy, discomfort, or sadness. After composing your clip, write a paragraph that
  reflects over your authorial choices and their effects on a potential audience.</p>'
