  <p>Evaluation or Review: Would You Recommend It?</p>

  <p>7</p>

  <h3>CHAPTER OUTLINE</h3>

  <p>7.1 Thumbs Up or Down? 7.2 Review Trailblazer: Michiko Kakutani 7.3 Glance at Genre: Criteria, Evidence,
  Evaluation 7.4 Annotated Student Sample: "Black Representation in Film" by Caelia Marshall 7.5 Writing
  Process: Thinking Critically About Entertainment 7.6 Editing Focus: Quotations 7.7 Evaluation: Effect
  on Audience 7.8 Spotlight on … Language and Culture 7.9 Portfolio: What the Arts Say About You</p>

  <p>INTRODUCTION You have likely visited an unfamiliar city or neighborhood. When you aren’t in familiar
  surroundings, what do you do if you want to find something to eat or do for fun? You probably open your
  phone and search on Yelp, TripAdvisor, Google, or another app or website dedicated to providing film
  reviews, or critical appraisals. Even when closer to home, many people, whether looking for a unique
  local restaurant, a new hiking trail, or an auto mechanic, may base their decisions on online reviews.</p>

  <p>You may even have written a review of a product or service and posted it online yourself. In your
  review, you shared your evaluation—your overall thoughts on the strengths and weaknesses—of the customer
  service, atmosphere, prices, quality, and so on. You decided on a set of criteria, or characteristics
  that determine a positive experience, and made your evaluation of the business according to those criteria
  and your experiences with similar products or services. Ultimately, you used the evidence you gathered
  from your interaction with the product or service to make an evaluation, or judgment. Maybe you used
  a rating system to give five stars or used the phrase “would not recommend” to make your negative judgment
  clear.</p>

  <p>In performing these tasks, you engaged in the review genre, or form of writing, used to evaluate
  businesses, products, and art forms—including restaurants, health care, cell phones, cars, video games,
  books, films, and more. Throughout this chapter, you will learn about the characteristics of reviews
  and how to write them.</p>

  <p>7.1 Thumbs Up or Down?</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Explain the role of the review genre in personal,
  professional, and academic contexts. • Articulate what differentiates the review genre from other genres.</p>

  <p>Developing evaluation skills can help you in everyday life. Just about anything you buy or use will
  require you to evaluate a range of choices based on criteria that are important to you. For example,
  writing a good paper or making a good presentation necessitates locating and evaluating sources. See
  Annotated Bibliography: Gathering, Evaluating, and Documenting Sources for more information. You also
  may be asked to evaluate the effectiveness of your courses at the end of the semester. Or you may be
  asked to evaluate the work of your peers to help them revise their compositions. In the professional
  world, you may be asked to evaluate solutions to problems, employees you supervise, and in some cases,
  even yourself. Evaluating effectively makes you not only a better consumer but also a better student,
  employee, and possible supervisor.</p>

  <h3>Using Evidence to Make a Judgment</h3>

  <p>When you review or evaluate something, the end result is your judgment about it. Should your readers
  see the film? Are the food and service good at the restaurant? Should you use this source in your essay?
  Does your employee deserve a raise? Making a clear judgment about the subject of your evaluation provides
  guidance for the actions that audience members may take on the basis of the information you provide.</p>

  <p>Ultimately, your judgment is your opinion. For example, it is expected that some people will love
  Avengers: Endgame (2019) and others will not. In fact, because some people may disagree with you, reviews
  provide a perfect opportunity to use evidence to defend your judgment. You are probably familiar with
  some ways in which reviewers present their judgments about their subjects. Reviews on Facebook, Google,
  and Yelp have a star rating system (the more stars the better). The film review site Rotten Tomatoes
  shows the percentage of reviewers that recommend the film. The review site The AV Club rates films and
  TV episodes by using an A-toF grading scale.</p>

  <p>While it is important to present your overall judgment in a review, a simple “I liked it” or “I didn’t
  like it” is not enough to help your audience make their own judgments. It is also important to explain
  why you arrived at the judgment you did. Think about some of the titles of reviews you have seen online.
  One might simply read “DIRTY!” about an experience staying in a hotel. Other reviews might present a
  thesis, or debatable main idea, as a title, such as Slate culture critic Willa Paskin’s “In Its Immensely
  Satisfying Season Finale, Game of Thrones Became the Show It Had Always Tried Not to Be.” In both examples,
  the title provides an overall reason for the author’s judgment.</p>

  <p>Although a simple rating might be effective when reviewing a business, reviews of creative works
  such as films, TV shows, visual arts, and books are more complex. Critics —professional writers who
  review creative works—like Willa Paskin try to review their subjects and at the same time analyze their
  subjects’ cultural significance. In addition to providing an overall judgment, critics guide audiences
  on how to view and understand a work within a larger cultural context. Critics provide this guidance
  by answering questions such as these:</p>

  <ul><li>In what genre would I place this work? Why? • What has this work contributed to its genre that
  other works have not? • How does the creator (or creators) of this work show they understand the culture
  (audience) that will view the work? • How does this work reflect the time in which it was created? People
  look to critics not only to judge the overall quality of a work but also to gain insights about it.
  Other writing genres feature characteristics similar to the review genre, using criteria and evidence
  to analyze and sometimes evaluate the effectiveness of written or visual text: Rhetorical Analysis:
  Interpreting the Art of Rhetoric, Print or Textual Analysis: What You Read, and Image Analysis: Writing
  About What You See.</li></ul>

  <h2>Review Trailblazer: Michiko Kakutani</h2>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Read for inquiry, learning, and critical thinking. • Make judgments about the role of credibility
  and bias in the review genre. • Identify characteristics of review writing, including evaluation criteria
  and attention to historical context.</li></ul>

  <p>“Think about [reviewing] as a form of reporting . . . with the addition of your . . . carefully considered
  opinion.”</p>

  <h3>Consistently Objective</h3>

  <p>Born in New Haven, Connecticut, Michiko Kakutani (b. 1955) is an American author and a literary critic.
  She graduated from Yale University in 1976 and began her career with The Washington Post as a reporter.
  She moved to Time magazine in 1977, then in 1979 began working for The New York Times, first as a reporter
  and then as a literary critic. She is probably best known for the position she held as chief book critic
  at The New</p>

  <p>York Times until her retirement in 2017. Highly respected—and often feared—as a critic, Kakutani
  won a Pulitzer Prize for criticism in 1998. Her book reviews for The New York Times were highly influential,
  with some reviews creating as much discussion and debate as the book being reviewed. American authors
  Jonathan Franzen (https://openstax.org/r/JonathanFranzen) (b. 1959) and Norman Mailer (https://openstax.org/r/
  NormanMailer) (1923–2007), for instance, feuded publicly with Kakutani after she published negative
  reviews of their works.</p>

  <p>Kakutani is also known as an author, having published two books since her retirement: The Death of
  Truth: Notes on Falsehood in the Age of Trump (2018) and Ex Libris: 100+ Books to Read and Reread (2020)—a
  collection of essays about books that have been influential and illuminating.</p>

  <p>One reason for Kakutani’s effectiveness as a reviewer might be the air of mystery she maintained
  in the eyes of authors and publishers. Unafraid to say exactly what she thought about a literary work—and
  seemingly undaunted by the reactions of angry writers—she would praise an author for one book and pan
  the author’s next one. Shunning industry events, she curried neither access nor favor with authors and
  publishers and rarely gave interviews. Her refusal to get too close to authors and publishers added
  to her credibility and objectivity, possibly allowing her more freedom to review books honestly.</p>

  <p>Instead of a simple thumbs-up or thumbs-down, Kakutani would make her evaluations clear in more subtle
  and comprehensive ways. For example, she referred to former director of the Federal Bureau of Investigation
  (FBI) James Comey (https://openstax.org/r/JamesComey)’s (b. 1960) book A Higher Loyalty: Truth, Lies,
  and Leadership (2018) as “absorbing” and the characters in Jamaican author Marlon James (https://openstax.org/r/
  MarlonJames)’s (b. 1970) book Black Leopard, Red Wolf (2019) as “compelling.” Instead of a formula or
  template, Kakutani sought to read books as a reader, rather than a critic, would read and understand
  them. She tended to pick examples of what she liked and disliked and what she found notable about the
  book, without preconceived notions of what it “should” be. It might be fair to say that Kakutani’s evaluation
  criteria were never clear-cut; more often they were implied rather than explicit. However, decades of
  experience imbued Kakutani with historical knowledge and genre expertise that have provided the backbone
  of her reviews.</p>

  <h3>Discussion Questions</h3>

  <p>1. How does Michiko Kakutani establish her credibility as a reviewer? In what ways does she demonstrate
  her knowledge of the subject she is reviewing?</p>

  <p>2. What evaluation criteria does Michiko Kakutani use to review a work?</p>

  <p>3. How does Michiko Kakutani avoid appearing biased? Do you think she is successful in her attempts?</p>

  <p>4. How would you respond to a writer who thought you reviewed their work unfairly?</p>

  <p>7.3 Glance at Genre: Criteria, Evidence, Evaluation</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Identify and define common characteristics, mediums,
  key terms, and features of the review genre. • Identify criteria and evidence to support reviews of
  different primary sources.</p>

  <p>Reviews vary in style and content according to the subject, the writer, and the medium. The following
  are characteristics most frequently found in reviews:</p>

  <ul><li>Focused subject: The subject of the review is specific and focuses on one item or idea. For
  example, a review of all Marvel Cinematic Universe movies could not be contained in the scope of a single
  essay or published review not only because of length but also because of the differences among them.
  Choosing one specific item to review—a single film or single topic across films, for instance—will allow
  you to provide a thorough evaluation of the subject.</li><li>Judgment or evaluation: Reviewers need
  to deliver a clear judgment or evaluation to share with readers their thoughts on the subject and why
  they would or would not recommend it. An evaluation can be direct and explicit, or it can be indirect
  and subtle.</li><li>Specific evidence: All reviews need specific evidence to support the evaluation.
  Typically, this evidence comes in the form of quotations and vivid descriptions from the primary source,
  or subject of the review. Reviewers often use secondary sources—works about the primary source— to support
  their claims or provide context.</li><li>Context: Reviewers provide context, such as relevant historical
  or cultural background, current events, or short biographical sketches, that help readers understand
  both the primary source and the review.</li><li>Tone: Writers of effective reviews tend to maintain
  a professional, unbiased tone—attitude toward the subject. Although many reviewers try to avoid sarcasm
  and dismissiveness, you will find these elements present in professional reviews, especially those in
  which critics pan the primary source.</li></ul>

  <h3>Key Terms</h3>

  <p>These are some key terms to know and use when writing a review:</p>

  <ul><li>Analysis: detailed examination of the parts of a whole or of the whole itself. • Connotation:
  implied feelings or thoughts associated with a word. Connotations can be positive or negative. Reviewers
  often use words with strong positive or negative connotations that support their praise or criticism.
  For example, a writer may refer to a small space positively as “cozy” instead of negatively as “cramped.”
  • Criteria: standards by which something is judged. Reviewers generally make their evaluation criteria
  clear by listing and explaining what they are basing their review on. Each type of primary source has
  its set of standards, some or all of which reviewers address. • Critics: professional reviewer who typically
  publishes reviews in well-known publications. • Denotation: the literal or dictionary definition of
  a word. • Evaluation: judgment based on analysis. • Fandom: community of admirers who follow their favorite
  works and discuss them online as a group. • Genre: broad category of artistic compositions that share
  similar characteristics such as form, subject matter, or style. For example, horror, suspense, and drama
  are common film and literary genres. Hip hop and reggae are common music genres. • Medium: way in which
  a work is created or delivered (DVD, streaming, book, vinyl, etc.). Works can appear in more than one
  medium. • Mode: sensory method through which a person interacts with a work. Modes include linguistic,
  visual, audio, spatial, and gestural. • Primary Sources: in the context of reviewing, the original work
  or item being reviewed, whether a film, book, performance, business, or product. In the context of research,
  primary sources are items of firsthand, or original, evidence, such as interviews, court records, diaries,
  letters, surveys, or photographs. • Recap: summary of an individual episode of a television series.
  • Review: genre that evaluates performances, exhibitions, works of art (books, movies, visual arts),
  services, and products • Secondary source: source that contains the analysis or synthesis of someone
  else, such as opinion pieces, newspaper and magazine articles, and academic journal articles. • Subgenre:
  category within a genre. For example, subgenres of drama include various types of drama: courtroom drama,
  historical/costume drama, and family drama.</li></ul>

  <h3>Establishing Criteria</h3>

  <p>All reviewers and readers alike rely on evidence to support an evaluation. When you review a primary
  source, the evidence you use depends on the subject of your evaluation, your audience, and how your
  audience will use your evaluation. You will need to determine the criteria on which to base your evaluation.
  In some cases, you will also need to consider the genre and subgenre of your subject to determine evaluation
  criteria. In your review, you will need to clarify your evaluation criteria and the way in which specific
  evidence related to those criteria have led you to your judgment. Table 7.1 illustrates evaluation criteria
  in four different primary source types.</p>

  <p>Smartphone</p>

  <p>Academic Source</p>

  <p>Film</p>

  <p>Employment</p>

  <p>Camera quality Author’s credentials</p>

  <p>Writing/script Punctuality</p>

  <p>Battery life</p>

  <p>Publication’s reputation</p>

  <p>Acting</p>

  <p>Ability to meet goals</p>

  <p>Screen resolution Sources cited</p>

  <p>Special effects Ability to work on a team</p>

  <h3>Screen size</h3>

  <p>Timeliness of research (up to date) Sound/music Communication skills</p>

  <p>Durability</p>

  <p>Relevance to subject</p>

  <p>Directing</p>

  <p>Professional development</p>

  <p>Phone reception Quality of writing</p>

  <p>Subject</p>

  <h3>Competence in subject area</h3>

  <p>Even within the same subject, however, evaluation criteria may differ according to the genre and
  subgenre of the film. Audiences have different expectations for a horror movie than they do for a romantic
  comedy, for example. For your subject, select the evaluation criteria on the basis of your knowledge
  of audience expectations. Table 7.2 shows how the evaluation criteria might be different in film reviews
  of different genres.</p>

  <p>Horror</p>

  <p>Action</p>

  <p>Romantic Comedy</p>

  <p>Makeup</p>

  <p>Special effects Jokes</p>

  <p>Cinematography</p>

  <p>Stunt work</p>

  <h3>Conflict/resolution</h3>

  <p>Type of horror depicted (jump scares, Pace of story gore, etc.)</p>

  <p>Chemistry between main characters</p>

  <p>Music</p>

  <p>Relatability of “hero”</p>

  <p>Satisfaction/happy ending</p>

  <p>Drama</p>

  <p>Script/writing</p>

  <p>Acting</p>

  <p>Accuracy/believability of plot</p>

  <p>Scenery/setting/ costumes</p>

  <h3>Providing Objective Evidence</h3>

  <p>You will use your established evaluation criteria to gather specific evidence to support your judgment.
  Remember, too, that criteria are fluid; no reviewer will always use the same criteria for all works,
  even those in the same genre or subgenre.</p>

  <p>Whether or not the criteria are unique to the particular task, a reviewer must look closely at the
  subject and note specific details from the primary source or sources. If you are evaluating a product,
  look at the product specifications and evaluate product performance according to them, noting details
  as evidence. When evaluating a film, select either quotations from the dialogue or detailed, vivid descriptions
  of scenes. If you are evaluating an employee’s performance, observe the employee performing their job
  and take notes. These are examples of primary source evidence: raw information you have gathered and
  will analyze to make a judgment.</p>

  <p>Gathering evidence is a process that requires you to look closely at your subject. If you are reviewing
  a film, you certainly will have to view the film several times, focusing on only one or two elements
  of the evaluation criteria at a time. If you are evaluating an employee, you might have to observe that
  employee on several occasions and in a variety of situations to gather enough evidence to complete your
  evaluation. If you are evaluating a written argument, you might have to reread the text several times
  and annotate or highlight key evidence. It is better to gather more evidence than you think you need
  and choose the best examples rather than try to base your evaluation on insufficient or irrelevant evidence.</p>

  <h3>Modes of Reviews</h3>

  <p>Not all reviews have to be written; sometimes a video or an audio review can be more engaging than
  a written review. YouTube has become a popular destination for project reviews, creating minor celebrities
  out of popular reviewers. However, a written review of a movie might work well because the reviewer
  can provide just enough information to avoid spoiling the movie, whereas some reviews require more visual
  interaction to understand.</p>

  <p>Take reviewer Doug DeMuro (https://openstax.org/r/DougDeMuro)’s popular YouTube channel. DeMuro reviews
  cars—everything from sports cars to sedans to vintage cars. Car buyers need to interact with a car to
  want to buy it, and YouTube provides the next best thing by giving viewers an up-close look.</p>

  <p>Technology is another popular type of review on YouTube. YouTube creators like Marques Brownlee (https://openstax.org/r/MarquesBrownlee)
  discuss rumors about the next Apple iPhone or Samsung Galaxy and provide unboxing videos to record their
  reactions to the latest phones and laptops. Like DeMuro’s viewers, Brownlee’s audience can get up close
  to the product. Seeing a phone in Brownlee’s hands helps audience members imagine it in their hands.</p>

  <p>On the other hand, reviews don’t always need to be about products you can touch, as Paul Lucas (https://openstax.org/r/PaulLucas)
  demonstrates on his YouTube channel “Wingin’ It!” Lucas reviews travel experiences (mainly airlines
  and sometimes trains), evaluating the service of airlines around the world and in various ticket classes.</p>

  <p>What do these reviews have in common? First, they are all in the video medium. YouTube’s medium is
  video; a podcast’s medium is audio. They also share a mode. YouTube’s mode is viewing or watching; a
  podcast’s mode is listening.</p>

  <p>These examples all use the genre conventions of reviews discussed in this chapter. The reviewers
  present a clear evaluation: should you buy this car, phone, or airline ticket? They base their evaluation
  on evidence that fits a set of evaluation criteria. Doug DeMuro might evaluate a family sedan on the
  basis of seating, trunk storage, and ride comfort. Marques Brownlee might judge a phone on the basis
  of battery life, design, and camera quality. Paul Lucas might grade an airline on service, schedules,
  and seat comfort. While the product or service being reviewed might be different, all three reviewers
  use similar frameworks.</p>

  <p>7.4 Annotated Student Sample: "Black Representation in Film" by Caelia Marshall</p>

  <p>LEARNING OUTCOMES</p>

  <p>By the end of this section, you will be able to: • Recognize key terms and features of review writing.
  • Explain how conventions of the review genre are shaped by purpose, language, culture, and expectation.
  • Analyze relationships between ideas and patterns of organization in written texts.</p>

  <h3>Introduction</h3>

  <p>In her essay “The Black Experience: What We See and Hear in Film,” Caelia Marshall reviews Rear Window
  (1954), Number 37 (2018), and Black Panther (2018), looking at them through the context of representation
  of</p>

  <p>Black people in film. She uses some traditional film-review criteria but focuses primarily on the
  films’ social and historical contexts. Marshall presents her judgment and provides specific evidence
  from primary and secondary sources.</p>

  <h3>LIVING BY THEIR OWN WORDS What We See and What We Hear</h3>

  <p>The global film industry, worth nearly $50 billion dollars (Watson), is a powerhouse of social influence,
  affecting people’s perceptions, ideologies, values, and language on both conscious and subconscious
  levels. Phrases such as “Winter is coming” infiltrate the modern lexicon in areas of public life ranging
  from advertising to politics. Problematically, however, highly popular and influential shows like the
  HBO series Game of Thrones lack diversity, unapologetically perpetuating the dominant White cultural
  narrative. For the most part, audiences catapult shows that portray such skewed narratives to popularity,
  failing to notice or care about the lack of diversity. Through both production and consumption, the
  lack of diversity that exists in the entertainment industry works as an arm of oppression, complicit
  in keeping Black characters and Black stories hidden from view. This lack of representation of Black
  people and culture in film and television is more dangerous than the stereotypical racist representations
  of mammies, servants, and criminals in the past because it allows audiences to dismiss Black experiences
  entirely, making these audience members less empathetic to diverse points of view. Purpose. Marshall
  achieves two important objectives for the opening paragraph of her essay: getting her audience’s attention
  and presenting her thesis. Marshall begins with an important statistic (the film industry is worth nearly
  $50 billion globally) and uses a specific example of a popular expression from a television show with
  which the audience is likely familiar (“Winter is coming” from the HBO series Game of Thrones) to illustrate
  the power and widespread influence of film and TV on American culture. Thesis. Marshall then points
  out the lack of diversity in Game of Thrones and in film and TV more generally that leads to her thesis:
  This lack of diversity is harmful to society (“This lack of representation of Black people and culture
  . . . diverse points of view.”).</p>

  <p>Like many movies of the early and mid-20th century, director Alfred Hitchcock’s film Rear Window
  (1954) lacks authentic Black characters. Criteria. Marshall elaborates on her evaluation criteria: the
  lack of authentic Black characters. In Rear Window, the Black experience is evident only when the presumably
  White female babysitter character talks for a few brief seconds to the police chief, whose children
  she watches, from an off-screen position using slurred, stereotypical southern Black dialect, with incorrect
  grammar. Dr. James Ivy calls this interjection the “audio version of blackface.” Blackface is an American
  theatrical minstrel practice that dates to the mid to late 1800s, in which White traveling musicians
  painted their faces black and for comic effect mimicked the singing and dancing of slaves. Definition
  of Terms. Marshall clarifies the terms she uses; “audio version of blackface” is taken from a secondary
  source, whereas “mammy” reflects Marshall’s own interpretation.</p>

  <p>In this scene, the babysitter responds to her White male employer in the voice of the stereotypical
  mammy—a Black nursemaid who took care of White children, particularly in the south. Hitchcock appears
  to offer the scene as comic relief, expecting audiences to laugh during a tense confrontation between
  protagonist L. B. Jefferies and the police chief. The fact that Hitchcock calls upon this stereotypical
  minstrel tradition to create a moment of comedy illustrates the inherent racism of a script that uses
  the Black experience as a punch line rather than attempts to reflect the Black experience as it is.
  Somehow, Hitchcock manages both to exclude Black people from his film and to make use of Black stereotypes.
  However, as insidious as Hitchcock’s choice to call upon this stereotype for comic effect may be, it
  is not as dangerous as his exclusion of Black characters. This exclusion has the effect of erasing the
  authentic Black experience altogether, making it meaningless within the discourse of popular culture.
  Yet Hitchcock himself was rewarded for his efforts, earning critical praise and Academy Award nominations
  for his masterful ability to create suspense in this film, regardless of his shoddy characterization
  of racial issues in 1950s America.</p>

  <p>Evidence. In this paragraph, Marshall highlights another specific example of the lack of diversity
  in film. With this example, she goes into more detail to illustrate the harmful stereotyping and exclusion
  of Black characters.</p>

  <p>While some may argue that as a White filmmaker Hitchcock does not have a responsibility to reflect
  the Black experience accurately in his films, their argument falls apart with Hitchcock’s use of “audio
  blackface.” Hitchcock accepts the responsibility of including the Black perspective, but he fails in
  his presentation, and the film suffers for it when Hitchcock goes for a laugh at the expense of the
  Black community. Instead of elevating Black culture and experiences through his use of Black characters,
  he portrays their point of view as invalid and perpetuates their oppression. Hitchcock doesn’t just
  ignore the existence of Black people, he uses them to promote a racist agenda.</p>

  <p>Addressing a Counterclaim. Marshall admits some people might argue that Hitchcock is not writing
  a social drama and thus accept his exclusion of Black characters. But she then counters this opinion.</p>

  <p>This moral failure becomes clear when Rear Window is contrasted with its counterpart Number 37, a
  remake of the original as envisioned by South African writer and director Nosipho Dumisa. In Number
  37, the disabled spectator, Randal, is confined to his apartment in a notoriously dangerous area of
  post-apartheid South Africa when he notices a criminal murder a cop. He descends into a voyeuristic
  frenzy as he uses the crime to figure out how to resolve his debt to a former gang mate. By adding layers
  of violence, an African setting, and the inclusion of a paralyzed Black protagonist, Dumisa creates
  a film that transcends the plot to comment on the social narrative of poor Black people following the
  end of apartheid in South Africa.</p>

  <p>Thesis. This paragraph introduces the film Number 37 to illustrate the thesis that underrepresentation
  of Black people in film is harmful to society.</p>

  <p>Evidence. Marshall briefly summarizes plot events so that readers unfamiliar with the film know something
  about the plot and how it differs from Hitchcock’s Rear Window. She also provides information about
  the main character and setting but indicates that these are not her focus, as she mentions that the
  film “transcends” plot. The implication is that it transcends certain other film criteria as well.</p>

  <p>While both Hitchcock’s Jefferies and Dumisa’s Randal make light of a murder, Randal’s response is
  mired in his social situation as a Black man in South Africa, whereas Jefferies’s response is mired
  in his social situation as a privileged White man in America. Dumisa’s film reflects a cultural depth
  that Hitchcock compromises for a joke. She understands that “you can entertain while still teaching
  the audience something” (Obenson).</p>

  <p>Structure. Marshall uses this paragraph to contrast the original Rear Window with a remake of the
  film. Comparing and contrasting similar works is an effective technique for illustrating a point when
  the purpose is to evaluate a work.</p>

  <p>Criteria. As criteria for comparison, she chooses characters, plot elements, and most important here,
  social context. In her comparison, she uses a relevant secondary source, as she does in the paragraph
  that follows and introduces</p>

  <p>Black Panther. Malian writer, filmmaker, and cultural theorist Manthia Diawara describes the “manner
  in which black spectators may . . . resist the persuasive elements of Hollywood narrative” as a “challenge
  to . . . spectatorship and the aesthetics of Afro-American independent cinema” (845). The 2018 movie
  Black Panther may be understood as an answer to Diawara’s challenge. Skillfully directed by African
  American screenwriter Ryan Coogler, Black Panther is an example of the aesthetic beauty and financial
  success that art can achieve when not only are Black characters cast but also when Black storylines
  are expressed by the people who have had firsthand experiences.</p>

  <p>Criteria. Using a genre criterion of directing, Marshall notes director Coogler’s “skill.” Criteria.
  Marshall praises the performance of American actor Chadwick Boseman (1976–2020). Social Context. She
  also quotes from a secondary source as an opportunity to respond to and engage with the scholar quoted.</p>

  <p>Black Panther chronicles the origin of the Marvel superhero Black Panther—played compellingly by
  Chadwick Boseman—who is descended from a line of black panthers living in the fictional African region
  of Wakanda. Wakanda is technologically advanced because of its rich store of a fictional metal called
  Vibranium. While the Wakandans have benefited from Vibranium, they have kept it from the outside world
  by cloaking their society in the stereotypical poverty expected of Africans by Western nations. In Black
  Panther, this reversal of the roles of the advanced and the underprivileged serves as a critique of
  the historical actions of Western nations. Social Context. In the paragraph above and the one that follows,
  the author focuses on social context. She wants readers to see the possibilities in Black Panther when
  Black people’s authentic stories are shown to a wider audience. Although mythological and thus fictional,
  the movie features many references to African American history and the African American experience:
  slavery and the slave trade, colonization, the exploitation of Africa, civil rights, Black militancy,
  systemic poverty, and the loss of Black men—especially fathers—to violence and incarceration. These
  topics are usually whitewashed or ignored in popular cinema because of their graphic and racially charged
  nature. Comparison to Other Films. Marshall broadens the scope of her statement by bringing in the problem
  as it relates to other films. However, because diverse audiences viewed and welcomed this film, the
  movie registered as valuable not only for the people it reflected but for non-Black people as well.
  This effect supports Dumisa’s argument that Black art has the power both to entertain and to instruct
  when representation is not only present but authentic. The film reinvents the representation of Black
  people in American cinema through its characterization of Black superheroes. Although the villain of
  Black Panther, Erik Killmonger, is Black, the character is not the stereotypical Black criminal of movies
  past. Despite his last name and the negative connotation of monger, this intense and angry antihero,
  played by Michael B. Jordan, captures the sympathy of viewers. Connotation. Marshall explains Killmonger’s
  name. Monger, meaning “vendor,” has a negative connotation, implying dealing aggressively in an undesirable
  product.</p>

  <p>While young, Killmonger loses his Black militant father who was living in the United States as a
  Wakandan emissary. Killmonger’s anger and his fight against Wakanda represent an effort to take back
  what he views as his father’s loss—the ability to arm poor Black people throughout the world in a fight
  for civil rights. Although his anger may be misguided, viewers are able to understand its source and
  empathize. If the Killmonger villain were purely evil or unintelligent, he would have embodied the criminal
  stereotype who has appeared in a lot of movies. In this film, however, he becomes someone who cannot
  find a positive outlet for his Black rage, something that is relatable to many Black people today.</p>

  <p>Evidence Based on Criteria. Using specific details from the film, Marshall illustrates how Black
  Panther “reinvents the representation of Black people in American cinema.” She describes Killmonger
  in detail and connects those traits to her point that the character represents a villain whose motivations
  are relatable to the audience.</p>

  <p>When the Black Panther, T’Challa, reclaims Wakanda from Killmonger at the end of the movie, he shows
  his cousin Killmonger grace by inviting him back into the Wakandan community, an ideal that is characteristic
  of the Black communal experience. T’Challa offers Killmonger a place in their society, which Killmonger
  rejects, lamenting, “Just bury me in the ocean with my ancestors who jumped ships, ’cause they knew
  death was better than bondage.” Killmonger’s frustration mirrors the modern-day frustration with the
  exploitation and degradation of Black people in all aspects of life. The incarceration of Black citizens,
  primarily men, is the simple answer to the complex problem that crime is often the manifestation of
  poverty, social oppression, and systemic racism, and even Wakanda is not immune from this problem. In
  this sense, Wakanda is not a utopia, but a working model of purposeful Black agency within the international
  community.</p>

  <p>Evidence. Marshall continues her analysis with more specific examples, this time quoting from her
  primary sources to illustrate her point.</p>

  <p>A systematic form of racism is perpetuated by producers and filmmakers intentionally distorting or
  excluding the Black experience from art. These racist intentions have the effect of teaching, or brainwashing,
  audiences to dismiss Black perspectives, thus contributing further to the racist structure of the film
  industry. When films leave out Black characters, they create a narrative reality in which Black people
  are not essential. This situation translates into a physical reality where Black experiences and stories
  are not seen as profitable or valid by the public.</p>

  <p>Connotation and denotation. Marshall uses words with strong connotations: short-sighted and narrow,
  when used in certain contexts (relating to a vision problem and to width). These words take on negative
  connotations when placed in a cultural context. So do words like brainwashing, which has negative connotations
  as opposed to a more positive or neutral word like teaching or instilling. Diverse, however, has positive
  connotations in this same context, despite its neutral denotation of “varied.”</p>

  <p>However, when the short-sighted and narrowly representative Rear Window is contrasted with the diverse
  and highly successful Black Panther, the act of dismissing Black characters appears outdated and not
  economically necessary. Yet the practice of exclusion continues in many high-budget films because Hollywood
  is still controlled largely by the White male point of view. These male executives have a stake in producing
  films that support and facilitate the status quo of the perpetuation of a narrative that they can relate
  to. They have no reason to emphasize story lines that compete with or threaten their authority unless
  audiences become critically aware of the power of media to legitimize and delegitimize social groups.
  Audiences must “resist the persuasive elements of Hollywood narrative” (Diawara 845) with their pocketbooks.</p>

  <p>Conclusion. Marshall ends with a rewording of her thesis, as well as a summary of her evidence. She
  issues a call to action through a quotation from one of her secondary sources.</p>

  <h3>Works Cited</h3>

  <p>Diawara, M. “Black Spectatorship: Problems of Identification and Resistance.” Screen, vol. 29, no.
