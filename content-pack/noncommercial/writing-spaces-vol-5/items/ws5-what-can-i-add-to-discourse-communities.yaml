  <p>5. How are Englishes different across the communities where you am a member and when does it really
  matter what language choices you make in the discourse community?</p>

  <h3>What Can I Add to the Discourse Community? 101</h3>

  <p>6. Choose a discourse community that you are a member of—or that you want to join. Analyze the language
  expectations of this discourse community by considering the following questions:</p>

  <p>{ What would it look like for you or others to utilize linguistic resources, such as the dialects
  or language styles a person feels most comfortable with, in this community? What are the risks and benefits
  of doing so?</p>

  <p>{ What do you notice about language expectations and which languages or dialects are and are not
  valued in this discourse communities?</p>

  <p>{ What are the benefits or challenges of using translanguaging and/or code-meshing in this community?
  When are the stakes high and where are they low?</p>

  <p>7. How can we better understand the choices people make as writers and speakers and learn to value
