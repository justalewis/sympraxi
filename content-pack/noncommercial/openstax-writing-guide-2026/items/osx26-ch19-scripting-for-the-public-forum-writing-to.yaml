  <p>19.7 Spotlight on … Delivery/Public Speaking</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Implement various technologies effectively to
  address an audience, matching the capacities of each to the rhetorical situation. • Apply conventions
  of speech delivery, such as voice control, gestures, and posture. • Identify and show awareness of cultural
  considerations.</p>

  <p>Think of a speech you have seen or heard, either in person, on television, or online. Was the speech
  delivered well, or was it poorly executed? What aspects of the performance make you say that? Both good
  and poor delivery of a speech can affect the audience’s opinion of the speaker and the topic. Poor delivery
  may be so distracting that even the message of a well-organized script with strong information is lost
  to the audience.</p>

  <h3>Speaking Genres: Spoken Word, Pulpit, YouTube, Podcast, Social Media</h3>

  <p>The world today offers many new (and old) delivery methods for script writing. While the traditional
  presidential address or commencement speech on a stage in front of a crowd of people is unlikely to
  disappear, newer script delivery methods are now available, including many that involve technology.
  From YouTube, which allows anyone to upload videos, to podcasts, which provide a platform for anyone,
  celebrities and noncelebrities alike, to produce a radio-like program, it seems that people are finding
  new ways to use technology to enhance communication. Free resources such as YouTube Studio (https://openstax.org/r/
  YouTube_Studio) and the extension TubeBuddy (https://openstax.org/r/TubeBuddy) can be a good starting
  place to learn to create these types of media.</p>

  <h3>Voice Control</h3>

  <p>Whether the method is old or new, delivering communication in the speaking genre relies not only
  on words but also on the way those words are delivered. Remember that voice and tone are important in
  establishing a bond with your audience, helping them feel connected to your message, creating engagement,
  and facilitating comprehension. Vocal delivery includes these aspects of speech:</p>

  <ul><li>Rate of speech refers to how fast or slow you speak. You must speak slowly enough to be understood
  but not so slowly that you sound unnatural and bore your audience. In addition, you can vary your rate,
  speeding up or slowing down to increase tension, emphasize a point, or create a dramatic effect.</li><li>Volume
  refers to how loudly or softly you speak. As with rate, you do not want to be too loud or too soft.
  Too soft, and your speech will be difficult or impossible to hear, even with amplification; too loud,
  and it will be distracting or even painful for the audience. Ideally, you should project your voice,
  speaking from the diaphragm, according to the size and location of the audience and the acoustics of
  the room. You can also use volume for effect; you might use a softer voice to describe a tender moment
  between mother and child or a louder voice to emphatically discuss an injustice.</li><li>Pitch refers
  to how high or low a speaker’s voice is to listeners. A person’s vocal pitch is unique to that person,
  and unlike the control a speaker has over rate and volume, some physical limitations exist on the extent
  to which individuals can vary pitch. Although men generally have lower-pitched voices than women, speakers
  can vary their pitch for emphasis. For example, you probably raise your pitch naturally at the end of
  a question. Changing pitch can also communicate enthusiasm or indicate transition or closure.</li><li>Articulation
  refers to how clearly a person produces sounds. Clarity of voice is important in speech; it determines
  how well your audience understands what you are saying. Poor articulation can hamper the effect of your
  script and even cause your audience to feel disconnected from both you and your message. In general,
  articulation during a presentation before an audience tends to be more pronounced and dramatic than
  everyday communication with individuals or small groups. When presenting a script, avoid slurring and
  mumbling. While these may be acceptable in informal communication, in presented speech they can obscure
  your message.</li><li>Fluency refers to the flow of speech. Speaking with fluency is similar to reading
  with fluency. It’s not about how fast you can speak, but how fluid and meaningful your speech is. While
  inserting pauses for dramatic effect is perfectly acceptable, these are noticeably different from awkward
  pauses that result from forgetting a point, losing your place, or becoming distracted. Practicing your
  speech can greatly reduce fluency issues. A word on verbal fillers, those pesky words or sounds used
  to fill a gap or fluency glitch: utterances such as um, ah, and like detract from the fluency of your
  speech, distract the audience from your point, and can even reduce your credibility. Again, practice
  can help reduce their occurrence, and self-awareness can help you speak with more fluency.</li></ul>

  <h3>Gestures and Expressions</h3>

  <p>Beyond vocal delivery, consider also physical delivery variables such as gestures and facial expressions.
  While not all speech affords audiences the ability to see the speaker, in-person, online, and other
  forms of speech do. Gestures and facial expressions can both add to and detract from effective script
  delivery, as they can help demonstrate emotion and enthusiasm for the topic. Both have the ability to
  emphasize points, enhance tone, and engage audiences.</p>

  <p>Eye contact is another form of nonverbal, physical communication that builds community, communicates
  comfort, and establishes credibility. Eye contact also can help hold an audience’s attention during
  a speech. It is advisable to begin your speech by establishing eye contact with the audience. One idea
  is to memorize your opening and closing statements to allow you to maintain consistent eye contact during
  these important sections of the script and strengthen your connection with the audience. Although natural
  engagement through gestures, facial expressions, and eye contact can help an audience relate to a presenter
  and even help establish community and trust, these actions also can distract audiences from the content
  of the script if not used purposefully. In general, as with most delivery elements, variation and a
  happy medium between “too much” and “too little” are key to an effective presentation. Some presenters
  naturally have more expressive faces, but all people can learn to control and use facial expressions
  and gestures consciously to become more effective speakers. Practicing your speech in front of a mirror
  will allow you to monitor, plan, and practice these aspects of physical delivery.</p>

  <p>purposeful, with the intention of connecting with or influencing your audience. Time your movements
  to occur at key points or transitions in the script.</p>

  <h3>Cultural Considerations</h3>

  <p>Don’t forget to reflect on cultural considerations that relate to your topic and/or audience. Cultural
  awareness is important in any aspect of writing, but it can have an immediate impact on a speech, as
  the audience will react to your words, gestures, vocal techniques, and topic in real time. Elements
  that speakers don’t always think about—including gestures, glances, and changes in tone and inflection—can
  vary in effectiveness and even politeness in many cultures. Consideration for cultural cues may include
  the following:</p>

  <ul><li>Paralanguage: voiced cultural considerations, including tone, language, and even accent. • Kinesics:
  body movements and gestures that may include facial expressions. Often part of a person’s subconscious,
  kinesics can be interpreted in various ways by members of different cultures. Body language can include
  posture, facial expressions (smiling or frowning), and even displays of affection. • Proxemics: interpersonal
  space that regulates intimacy. Proxemics might indicate how close to an audience a speaker is located,
  whether the speaker moves around, and even how the speaker greets the audience. • Chronemics: use of
  time. Chronemics refers to the duration of a script. • Appearance: clothing and physical appearance.
  The presentation of appearance is a subtle form of communication that can indicate the speaker’s identity
  and can be specific to cultures.</li></ul>

  <h3>Stage Directions</h3>

  <p>You can think proactively about ways to enhance the delivery of your script, including vocal techniques,
  body awareness, and cultural considerations. Within the draft of your script, create stage directions.
  An integral part of performances such as plays and films, stage directions can be as simple as writing
  in a pause for dramatic effect or as complicated as describing where and how to walk, what facial expressions
  to make, or how to react to audience feedback.</p>

  <p>Look at this example from the beginning of the student sample. Stage directions are enclosed in parentheses
  and bolded.</p>

  <p>Several years ago, I sat in the waiting area of a major airport, trying to ignore the constant yapping
  of a small dog cuddled on the lap of a fellow passenger. An airline rep approached the woman and asked
  the only two questions allowed by law. (high-pitched voice with a formal tone) “Is that a service animal?
  (pause) What service does it provide for you?”</p>

  <p>(bold, defiant, self-righteous tone) “Yes. It keeps me from having panic attacks,” the woman said
  defiantly, and the airline employee retreated. (move two steps to the left for emphasis)</p>

  <p>Shortly after that, another passenger arrived at the gate. (spoken with authority) She gripped the
  high, stiff handle on the harness of a Labrador retriever that wore a vest emblazoned with the words
  “The Seeing Eye.” (speed up speech and dynamic of voice for dramatic effect) Without warning, the smaller
  dog launched itself from its owner’s lap, snarling and snapping at the guide dog. (move two steps back
  to indicate transition)</p>

  <h3>Your Turn</h3>

  <p>Now it’s your turn. Using the principle illustrated above, create stage directions for your script.
  Then, practice using them by presenting your script to a peer reviewer, such as a friend, family member,
  or classmate. Also consider recording yourself practicing your script. Listen to the recording to evaluate
  it for delivery, fluency, and vocal fillers. Remember that writing is recursive: you can make changes
  based on what works and what doesn’t after you implement your stage directions. You can even ask your
  audience for feedback to improve your delivery.</p>

  <h3>Podcast Publication</h3>

  <p>If possible, work with your instructor and classmates to put together a single podcast (https://openstax.org/r/
  podcast) or a series of podcasts (https://openstax.org/r/podcasts) according to the subject areas of
  the presentations. The purpose of these podcasts should be to invite and encourage other students to
  get involved in important causes. Work with relevant student organizations on campus to produce and
  publicize the podcasts for maximum impact. There are many free resources for creating podcasts, including
  Apple’s GarageBand (https://openstax.org/r/GarageBand) and Audacity (https://openstax.org/r/Audacity).</p>

  <p>19.8 Portfolio: Everyday Rhetoric, Rhetoric Every Day</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Write reflectively about the process of creating
  a script for a presentation. • Demonstrate how the composing process affects the final product.</p>

  <p>Reflecting on your writing enhances the writing process by allowing you to deepen your understanding
  of the process of drafting, revising, and evaluating. Now that you have finished another writing project,
  it’s time to add another section to your portfolio. Think critically about the process you followed
  for this assignment, reflecting on how your writing developed over time, specifically as it relates
  to writing for an audience.</p>

  <h3>Reflective Task</h3>

  <p>As you reflect on writing for your presentation, ask yourself the following questions:</p>

  <ul><li>How did you decide on the topic and subject of your script? • How did the research process inform
  the development of your thesis? • How did you organize your outline? Why did you choose this method
  of organization? • What sources did you use to develop key points? • How did you engage the audience
  in the introduction of your script? What methods of engagement did you use? • How did you build credibility
  and engagement with your audience? • How did collaboration with peers help you as you wrote and revised
  your script? • What specific feedback was helpful in the revision process? • How did you incorporate
  structural elements such as tone, parallelism, and repetition into your writing?</li></ul>

  <p>How did they affect the text? • What considerations for delivery did you make within your writing?
  • Did you find writing for speech more or less difficult than writing a traditional paper? In what ways?
  • What might you do differently if you were to begin again or write a different script? • What insights
  about your topic did you gain from writing your paper?</p>

