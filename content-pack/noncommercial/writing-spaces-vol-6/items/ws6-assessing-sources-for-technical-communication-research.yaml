  <p>Teaching Resources</p>

  <p>Overview and Teaching Strategies</p>

  <p>Freshman students are often first introduced to both research and to technical communication as a
  field of study in their freshman courses. This chapter offers some tips to help them understand an important
  aspect of research: assessing sources they will encounter. Even students who have research background
  and technical communication experience will probably be new to the vast data resources available at
  higher education institutions. Without knowledge of how to use these resources, students may fall back
  on what they know which will not meet the requirements of research assignments for college courses or
  technical communication research assignments. Understanding how to find and assess sources, therefore,
  is pertinent for research.</p>

  <p>Additionally, technical communication courses often provide the most relevant and practical ways
  that students get to practice the application of research concepts. For the most part, technical communication
  courses offer real world scenarios that students often find engaging and rewarding. The assignments
  offered in technical communication courses, therefore, easily lend to identifying concepts from the
  chapter and using these ideas allows for research practice that freshman students can build on for the
  rest of their academic careers.</p>

  <h3>Discussion Questions</h3>

  <p>To help students apply the concepts from the reading, consider having them discuss the following
  questions:</p>

  <p>1. Which of the listed types of sources are you most and least familiar with? Share why you feel
  you may not be familiar with the source or else how you became acquainted with it.</p>

  <p>2. Which of the five standards (accurate, timely, relevant, focused, rigorously documented) do you
  feel would be the hardest to determine from a source? Why?</p>

  <p>3. List at least three ways that rhetorical reading will help you with assessing sources for technical
  communication research.</p>

  <p>4. Consider a research paper you have pending. Explain the research process you plan on using to
  make sure you have reliable and credible sources.</p>'
