  <p>Teacher Resources</p>

  <p>Overview and Teacher Strategies</p>

  <p>I approached this chapter with three goals in mind. First, this chapter wants to provide a context
  for understanding the importance of source text quality as a prerequisite for successful translation
  and localization in today’s growing global environment. Second, given that students will likely write
  for audiences around the globe, they should understand why it is important to draft content that is
  global-ready and know which methods they can use to facilitate translatability and with it, consistency,
  comprehensibility and usability of technical content. Third, this chapter offers students a selection
  of writing rules, which they can easily implement in their own writing.</p>

  <p>Faculty may use this chapter in teaching hands-on technical writing courses. In these courses, students
  need to learn and practice the core fundaments of good source content creation. In my technical communication
  classes at KU Leuven, I usually ask my students to first analyze and then rewrite an existing manual.
  For first year composition students, an instruction manual for household appliances, consumer electronics
  or daily medical devices is accessible and not too technical. Students discover the many inconsistencies
  that the manual contains and report their findings in an oral or written assignment.</p>

  <p>This chapter is particularly suitable for teaching with the flipped classroom approach. In this blended
  learning approach, students read the chapter and review additional course material at home. They practice
  working in class. This approach has the advantage of leaving more room for collaboration, discussion,
  and direct feedback. Alternatively, faculty may use the chapter to introduce students to the subject
  and assign them tasks (analyzing, rewriting, and composing) that they should complete at home. Finally,
  instructors of writing may also participate in academic bilateral or multilateral writing/editing-translation
  projects with faculty from neighboring disciplines such as translation and usability studies to give
  their students experience in preparing texts for translation and localization and in working with translators.
  The partners in the well-established Trans-Atlantic &amp; Pacific Project (TAPP) have been cooperating
  in bilateral writing-translation projects since 2001 (https://tinyurl.com/mr2ebxb9).</p>

  <h3>Discussion Questions and Sample Activities</h3>

  <p>Discussion questions that can help students further explore these ideas on language and translation
  could include the following:</p>

  <p>1. Have you ever used a style guide? Which one(s)? For which purpose?</p>

  <p>2. Consult English style guides and guidebooks for information on how to create effective source
  texts (for example, Kohl’s Global English style guide or tekom’s writing rules if you are a non-native
  writer of English) for more writing rules. Different students may use different style guides. Review
  the rules and make your own selection (one that fits your specific purpose and situation) and compilation
  of rules. Look for additional real-world examples to illustrate your compilation or use examples from
  your own writing.</p>

  <p>3. Now it’s time to attack and rewrite an existing text! Bring a manual from home. Analyze and evaluate
  the content. Look for unnecessary information, inconsistencies, and other shortcomings. Also describe
  what is good. Rewrite and optimize the content by implementing the writing rules in this chapter.</p>

  <p>4. Consult the list of the top 50 websites from the latest version of the Web Globalization Report
  Card: e.g., https://www.bytelevel. com/reportcard2023/. Visit and compare the global website and one
  localized version of the website of a company of your choice. Present your findings to the class.</p>

  <p>5. Build a tandem with a student in translation studies. Discuss the problems you are experiencing
  when writing technical texts. Listen to the issues that your partner is having when he or she is translating
  a text. In the next stage, you can provide your partner with a source text that you have prepared for
  translation and localization.</p>'
