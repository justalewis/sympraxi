body: '<p>Can Teach You about College Writing—and One Thing It Can’t</p>

  <p>Ann N. Amicucci</p>

  <p>Overview</p>

  <p>Many students are frequent users of social media, and it’s important to recognize the rich rhetorical
  activity that happens on apps like Twitter, Instagram, Snapchat, and TikTok.* This chapter teaches students
  how to take rhetorical moves they make on social media and mimic these moves in academic writing, such
  as riffing off successful example texts, gearing content to specific audiences, choosing how to shape
  one’s ethos, and making stylistic choices that enhance the message of a piece of writing. By reading
  this essay, students will better understand the choices they make in composing text and images for social
  media and how those same choices can be applied to make their academic writing strong.</p>

  <p>Have you ever had a writing assignment to work on but you find yourself scrolling through social
  media instead? You might think of social media as completely separate from the writing you do for college,
  but the truth is, the two aren’t that different. Sure, social media posts aren’t multiple pages long,
  double-spaced, or in MLA or APA Style. But the choices you make as a composer of text and images online
  are the same choices you need to make as a college writer. In this essay, I’ll show you how to take
  what you already know from writing on social media and use it to level up as a writer. I want to make
  college writing less of a mystery</p>

  <p>* This work is licensed under the Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International
  License (CC BY-NC-ND 4.0) and is subject to the Writing Spaces Terms of Use. To view a copy of this
  license, visit http://creativecommons. org/licenses/by-nc-nd/4.0/, email info@creativecommons.org, or
  send a letter to Creative Commons, PO Box 1866, Mountain View, CA 94042, USA. To view the Writing Spaces
  Terms of Use, visit http://writingspaces.org/terms-of-use.</p>

  <p>and help you learn techniques to stand out as a writer by building on what you already know.</p>

  <p>Inter-What?</p>

  <p>Before we dive into social media, there are two important concepts you need to understand: intertextuality
  and interdiscursivity. Both of these concepts refer to how writers borrow stuff from other writers:</p>

  <ul><li>intertextuality happens when you explicitly borrow ideas or material from another text, which
  automatically links what you’re writing to something else. Examples of intertextuality include: { quoting
  words or paraphrasing ideas from someone else’s writing. { using photos or graphic images like charts
  or memes that someone else created. { calling back or alluding to specific texts like songs, movies,
  books, or tv shows.</li><li>interdiscursivity happens when you implicitly borrow or riff off the rhetorical
  choices of another text or writer. Examples of interdiscursivity include: { formatting your paper and
  citations in a certain way because other texts do it. { starting your writing with a quote or statistic
  because you’ve seen articles do this successfully. { using features in your writing like funny side
  jokes or rhetorical questions that play off how other authors use these same features.</li></ul>

  <p>So why do intertextuality and interdiscursivity matter? Both these concepts are the ways your writing
  is networked with other texts and writers. Nothing you write exists in a vacuum. Instead, everything
  you write builds on ideas and texts that have come before and makes use of rhetorical choices or moves—strategies
  used to strengthen writing—other writers have had success with.</p>

  <p>Here’s what I mean: Let’s say I’m writing a tweet about a restaurant I just tried (see figure 1).
  The intertextual parts of the tweet are the places where I specifically reference something else, like
  the chef, the tv show Guy’s Grocery Games, the name of the restaurant, and the city I live in. If I
  were to throw in a quote from a judge on the tv show or from the restaurant menu, that would also be
  intertextual content. Think of how each reference puts what I’m writing into a relationship with other
  texts in the world. Each makes my piece of writing one point in a big web of information that references
  these same things.</p>

  <p>Figure 1. Example drafted tweet with intertextual and interdiscursive content. The text reads: “No
  wonder Chef Brenner won #guysgrocerygames. Food at @ redgravyco rocks! Meatballs and fig pizza ftw.
  #coloradospringseats Image credit: Ann N. Amicucci.</p>

  <p>The interdiscursive parts of the tweet are the places where I use rhetorical moves I’m borrowing
  from other writers, like using hashtags, tagging the restaurant with its Twitter handle, and using the
  abbreviation “ftw” in place of “for the win.” These moves also put what I’m writing into a relationship
  with other texts and writers. Using hashtags shows I’m familiar with Twitter discourse, and using the
  abbreviation “ftw” might signal that I’m a gamer. Each interdiscursive move is a chance to get “in”
  with certain groups or to show that I’m not cool enough to be part of them. More on this in a minute.</p>

  <p>You have lots of practice in writing with intertextual content for school. Every research paper you’ve
  written has likely used quotes, paraphrases, and even images or graphs from other sources. And you likely
  make intertextual references all the time by referring to popular culture or other texts to explain
  your ideas to your readers.</p>

  <p>But you may not realize that you also have practice in using interdiscursive content on social media
  by imitating the rhetorical choices other texts make. In the following sections, I’ll explain how you
  can flex your interdiscursive writing muscles by bringing what you know from social media, regardless
  of what platforms you use, into your college writing projects.</p>

  <h3>Riff Off a Challenge</h3>

  <p>When I was writing this essay in 2020, TikTok was a popular app for sharing 60-second videos. When
  a new challenge emerges on a video platform like TikTok, you have to study its parts before you can
  copy it. As users replicate a challenge again and again, they riff off the challenge’s core moves, often
  mixing things up to make the challenge their own. A challenge video contains intertextual content: you’re
  using the name of the challenge that other people have used and often using the same soundtrack. But
  the process of imitating the challenge is interdiscursive work: you’re mimicking the format and components
  of a challenge but improvising changes to give your video a personal stamp.</p>

  <p>Here’s an example. In the 2020 Stand Up Challenge popularized by Demi Bagby, two people work together
  to do a series of jumps to the song “Woah” by Krypto9095 featuring D3Mstreet. The challenge starts with
  one person lying on the ground and the other standing on the first person’s back, then with each move,
  the top person jumps up while the bottom person changes position until the top person stands on the
  bottom person’s shoulders, then jumps off and lands on the ground. As people recreated and riffed off
  this challenge, some users replicated the moves exactly while others did the series of jumps with pets
  or babies, some shared fail videos of when the moves didn’t work, and others created more complex versions
  of the challenge, like doing the moves in an indoor skydiving chamber (@ twosdayswithtk).</p>

  <p>When you start working on a college essay, pick an essay you admire to be your “challenge” essay
  that—like a TikTok challenge—you can replicate and make your own. You might pick a published essay you’ve
  read for class or an example student essay shared by your teacher. Your job isn’t to copy the essay,
  but to figure out its moves and meet the challenge by replicating those moves in your own way (see figure
  2). As Craig A. Meyer explains, “In studying several authors or samples, we learn from each one’s strengths
  and weaknesses. Imitation is more than just copying down a selection of writing—it’s digging into the
  prose, pulling it apart, and understanding why it works the way that it does” (124). When you riff off
  a challenge essay, you’re still writing your own text—you’re simply using a successful formula to do
  so. Of course, you don’t want to simply copy a successful formula without considering the context for
  your writing. As you become more comfortable imitating successful rhetorical choices, you should reflect
  on how to adapt the rhetorical moves you riff off from other essays to best fit each writing project
  you take on.</p>

  <p>Figure 2. Questions to ask to replicate an essay’s rhetorical moves. The text reads: “Intro”: “What
  move does the essay start with?” “For example: an epigraph, a question, an obscure fact.” “Moves”: “What
  is the main thing the essay does again and again?” “For example: tells stories, analyzes examples, makes
  an argument.” “Sections”: “How does the essay break its task into chunks?” “For example: How many ideas
  does it analyze? How many paragraphs does it spend analyzing each?” “Your Take”: “In what ways is the
  author’s personal style evidence in the essay?” “For example: humor, talking directly to the reader,
  or using personal anecdotes.” “Outro”: “What move does the essay end with?” “For example: a call to
  action, an unexpected twist, a call back to the intro.” Image credit: Ann N. Amicucci.</p>

  <p>Know Your Hashtag Audiences Remember earlier when I used “ftw” in a tweet? Maybe you’d never heard
  that acronym before. Maybe it’s an abbreviation you like and use often. Maybe you think it’s ridiculous
  and rolled your eyes. Each language choice a writer makes marks that writer as an insider in some groups
  and an outsider in others—like if you’re a gamer who uses the acronym ftw, you might assume I’m a gamer,
  too.</p>

  <p>Groups of people that share a common purpose and use language in specific ways to communicate with
  members of their group are called discourse communities. Dan Melzer describes them this way:</p>

  <p>“Guitar players” or “people who like music” or even “guitarists in Sacramento, California” are not
  discourse communities. They don’t share the same goals, and they don’t all interact with each other
  to meet the same goals. . . . But a Meetup.com group like the Sacramento acoustic guitar jam focused
  on a specific topic with shared goals and a community of members who frequently interact can be considered
  a discourse community. (102-03)</p>

  <p>Melzer explains that in his acoustic guitar jam Meetup, members used specialized words and explanations
  like “root note of scale” and “putting a capo on different frets” so they could achieve their group
  goals. He writes, “We didn’t use this language to show off or to try to discourage outsiders from joining
  our group. We needed these specialized terms—this musician’s lexis—to make sure we were all playing
  together effectively” (105). All those specialized ways of using language are interdiscursive action:
  rhetorical moves to show you’re a member of a certain group because you use language in the same way
  as other members.</p>

  <p>Discourse communities work the same way on social media. We use language in specific ways to connect
  with people who share our interests and to achieve goals in interest-related groups. On Instagram and
  other platforms, using hashtags to link your posts to related posts is an interdiscursive move. You
  make a rhetorical move every time you choose to use hashtags in general, decide when and how to use
  them, and decide which to use. Further, you make interdiscursive rhetorical choices in composing a photo
  and a photo caption to participate as a member of certain hashtag communities.</p>

  <p>For example, in a post about her latest mural, artist Jeresneyka Rose, whose handle is @ArtByRizzo,
  selects a series of photos showing herself</p>

  <p>������ ������ painting the mural and the completed project (see figure 3). She captions the photo,
  “Growing &amp; Glowing First Mural of 2020 .</p>

  <p>Figure 3. Instagram post showing use of multiple hashtags. Post by @artbyrizzo (Jeresneyka Rose).</p>

  <p>Timelapse uploaded to IGTV!” and includes nineteen hashtags at the end of the caption. Her hashtags
  include general tags like #indoormural, tags specific to who she is as an artist like #blackwomanart,
  and tags specific to her community like #coloradospringsartist.</p>

  <p>Rose’s post as a whole has a purpose: to celebrate and circulate her art. What’s more, each part
  of the post involves specific interdiscursive rhetorical choices that have multiple, finer-grained purposes
  of linking the post with discourse communities. Think about how each hashtag represents a different
  community and the ways those communities overlap. For example, #blackart represents a huge worldwide
  community of Black artists, #coloradospringsartist represents a much smaller, local community, and some
  artists belong to both (see figure 4). When Rose uses multiple hashtags, she is composing content that
  works in each tag separately as well as in the space where tags intersect.</p>

  <p>Figure 4. A Venn diagram showing how four hashtag communities overlap. Image credit: Ann N. Amicucci.</p>

  <p>The content of Rose’s photo and what she writes in her caption not only need to make sense for the
  groups she’s connecting to; this content also needs to get those groups’ attention and work within those
  groups’ shared goals. The positive message of Rose’s mural—which shows a Black woman nourishing herself
  from a watering can of self love—combined with Rose’s smile, the peace sign she makes with her fingers,
  and the flower and heart emoji in her caption all show her desire to work toward a goal of empowerment
  of and positivity among Black women and artists.</p>

  <p>So what does this mean for you as a college writer? When you write an essay, think about what hashtags
  you’d use to label it if it were a post. What topics does your essay connect with, and what groups of
  people are interested in those topics? Decide how you’ll shape the ideas in your essay and your language
  choices to fit the groups of people you’re trying to reach. If it seems like your assignment is only
  asking you to write to your teacher, consider the multiple audience groups your teacher belongs to,
  such as education professionals, residents of your area, or members of a group that engage in a certain
  hobby or interest. Even when you’re directing your writing to one person, that one person belongs to
  multiple audience groups.</p>

  <p>You can also invent a more specific audience for yourself. For example, if you’re given an assignment
  to analyze a political cartoon, think about the multiple groups you could gear this analysis toward.
  If you’re writing to middle school students to teach them how to read political cartoons critically,
  you’ll use different ideas and language than if you’re writing to your campus newspaper to propose that
  cartoons should become a regular feature. Present every idea and make every language choice in your
  essay with your specific hashtag audience or audiences in mind.</p>

  <h3>Pick Your Filters</h3>

  <p>If you’ve read up to this point, you know that two ways you can take what you know from social media
  into your college writing are to 1) pick a challenge essay to riff off and 2) identify hashtag audiences
  to connect with. Here’s a third way: Decide what version of yourself you want to be in your essay, and
  choose filters to make yourself appear a certain way.</p>

  <p>Imagine you’re composing a selfie on Snapchat or another app with a range of filters to choose from.
  You have so many choices to make just in the photo alone: whether to smile, whether to show only yourself
  or include your background, how to angle your camera, and so on. Once you decide how to pose, you might
  scroll through the lens options to filter your face or give yourself animal ears, then you’ll choose
  whether to add stickers, a caption, or a frame for your photo.</p>

  <p>Let’s say I’ve just gotten home from a long hike on a hot day and I create a snap. I could choose
  a flattering lens, inspirational stickers, and a congratulatory caption to portray myself as a determined
  go-getter who has just achieved a big goal (see figure 5), or I could use a funny lens and a more honest
  caption and stickers to reveal how exhausted I am and portray myself as light-hearted and self-deprecating
  (see figure 6). Each choice I make shapes my ethos: the way I’m constructing my own character through
  my snap.</p>

  <p>Figures 5. Snapchat rhetorical choices made to portray a determined self.</p>

  <p>Figure 6. Snapchat rhetorical choices made to portray self-deprecation. Image credits: Ann N. Amicucci.</p>

  <p>The same is true when you’re writing a college essay. You have to decide how to present yourself
  and whether you want to present a simple (no filters) or gussied-up (sparkles and animal ears galore)
  version of your character in a particular piece of writing. The genre you’re writing in and how much
  freedom you have within that genre will guide what choices you have in constructing your ethos. If you’re
  able to include multimedia in your essay, consider how you can send different messages about yourself
  in your writing by choosing to include a soundtrack, photos that you take of your subject, or a diagram
  or graph that you draw by hand or create in PowerPoint. If multimedia composing isn’t an option, shape
  your ethos through your language: Choose words, phrases, and sentence types that enable you to be formal
  or funny or anywhere in between.</p>

  <p>Let’s say you’re writing an essay that analyzes the rhetorical strengths of Sojourner Truth’s speech
  “Ain’t I a Woman?” Truth was a slave who escaped and became a travelling preacher and activist for antislavery
  and women’s rights (“Sojourner”). You already know what argument you want to make in your essay—that
  Truth uses appeals to religious and family values to soften men in her audience to the idea of women’s
  rights. But who do you want to be in making this argument? Perhaps you could use a filter I’ll call
  “The Activist.” To portray yourself as a strident advocate for women’s rights (regardless of whether
  you identify as a woman), you could discuss how Truth’s work set the stage for today’s advocacy for
  women by sharing an anecdote of your experiences with the struggle for women’s rights and including
  a photo of you or someone you know participating in a women’s rights rally. Or you could go in a completely
  different direction and use a filter I’ll call “The Wanderer.” To portray yourself as a person journeying
  through life in search of meaning, you could use an epigraph from environmental writer Rebecca Solnit
  and subheadings like “Setting a Path,” “A Fork in the Road,” and “The End of the Journey” to highlight
  the role of Truth’s travel in strengthening her message.</p>

  <p>Your filter will also shape what evidence from the speech you include in your essay. Arguing from
  an activist position may lead you to quote passages that draw readers’ attention to the injustices Truth
  faced. Arguing from a position of your own journey, however, may lead you to put those same passages
  in your own words or select different sections of the text to discuss altogether. Adding a photo, using
  certain subheadings, or selecting different quotes are only a few of the choices you’ll make based on
  how you’re presenting your own ethos. Think of the countless choices you make in taking and posting
  a photo; you make a similar list of choices in deciding how to present yourself in an essay.</p>

  <p>You can use either of these filters for your ethos, and the central argument in your essay stays
  the same. What changes is the character of the writer making that argument. Keep in mind that there’s
  never a piece of writing where you aren’t present. Even if you aren’t using the first person pronoun
  “I,” you’re always a part of your own writing—so decide what filters you want to use on yourself in
  your essay.</p>

  <h3>Say More Through Symbols</h3>

  <p>On social media, we use emoji and stickers to add meaning to the words and images we share. If I
  post about traffic making me late to a family event and include a sad face emoji, you’d know I’m disappointed
  (see figure 7). But if I include a winking face and a celebration emoji, you’d understand that I’m happy
  to be late to the picnic—and you might even wonder if I’m making up the traffic as an excuse (see figure
  7). Emoji and other symbols tell readers how the content of your writing on social media should be read.</p>

  <p>Figure 7. The same drafted tweet shown with different emoji that change the tweet’s message. Image
  credit: Ann N. Amicucci.</p>

  <p>Look at the tweet in Figure 8 from my campus, which shows an image of students in the 1960s waiting
  in line to register for classes. The surprised face emoji that appears in the tweet tells us to be shocked
  by what we see: by both the length of the line and the fact that people had to show up to a particular
  building to register for classes in person.</p>

  <p>Now, notice the other composing choices that went into this post. The picture is a black and white
  photo from the 1960s, and no words or stickers have been added to it. The middle third of the photo
  shows students in line, but the photo hasn’t been cropped to focus only on the line of students. Instead,
  the parts of the photo that show us features of campus at the time—trees, grass, a building—have been
  left in to show that my university’s alumni association is interested not only in saying something about
  how registration worked at the time but in giving us a view of campus in the 1960s as well. Take a moment
  to imagine how you could shift the message of this post if you used different emoji, chose punctuation
  other than a period at the end of the tweet, or cropped the photo.</p>

  <p>Figure 8. A tweet from a college alumni association. Tweet by @UCCSAlumni (University of Colorado
  Colorado Springs Alumni Association). Image credit: University of Colorado Colorado Springs.</p>

  <p>So how can you apply similar choices to your college writing? Let’s say you need to write an essay
  about something you’ve observed at your college. It’s unlikely that you’ll use emoji in your essay,
  but you will use punctuation to signal to your readers how to interpret your message. Kevin Cassell
  explains that when you notice punctuation while you read, you’ll discover how punctuation marks work
  rhetorically. Referring to a paragraph in his Writing Spaces essay, Cassell writes:</p>

  <p>Some of [the punctuation marks] I had to use to meet standard usage expectations: periods to end
  sentences, apostrophes to make contractions or show possession, question marks to indicate questions,
  and commas to set apart clauses. Other punctuation marks I used—like the em dash, exclamation points,
  italics, ellipses, quotation marks to create emphasis, and even the parentheses—were optional, rhetorical
  choices I made to emphasize certain things and give my writing a colloquial style. (9)</p>

  <p>In making rhetorical choices among all the punctuation marks Cassell names, you’ll communicate meaning
  to your readers.</p>

  <p>Let’s say you’re a student in your thirties and you decide to use your essay to make recommendations
  for how your college’s website could better fit the needs of older students. If you want readers to
  interpret your essay as that of an indignant student who is demanding change immediately, you might
  use question marks to frame your statements as rhetorical questions or use italics to call attention
  to words that highlight the urgency of your request. However, if you want to frame your essay as a thoughtful
  description of your experiences—not necessarily an accusation or an indication that anyone is in the
  wrong—you might use em dashes, such as those in this sentence, to include thoughtful asides, or ellipses
  to show pauses in your own thought process as you navigated the website.</p>

  <p>You can write multiple versions of an essay that make the same argument that the website should be
  revised to better suit the needs of older college students. Yet the choices you make in punctuation
  add layers of meaning to your words and help your readers understand how to interpret your message,
  just as emoji clue readers into the real message in tweets.</p>

  <h3>Don’t Cut Your Ideas Short</h3>

  <p>So far in this essay, I’ve taught you four techniques for bringing your social media composing skills
  into college writing. Before I go, I want to mention one thing you shouldn’t take from social media
  into your academic essays. On social media, it’s common for writers to share an idea without saying
  much about the idea itself. I can post a pic of a doughnut with the caption “I love doughnuts” without
  needing to say why I love them, and no one will think it’s strange. But in college writing, the opposite
  is true: You need to include the why.</p>

  <p>No matter what subject your essay is on, you’ll be making claims throughout it. A claim might be
  an opinion (“I think our campus is great”), an argument (“Rose empowers Black female artists through
  her Instagram posts”), or even a proposal (“No one should take the TikTok Stand Up Challenge”). Each
  time you make a claim, you have to include reasons to support your claim and evidence to support your
  reasons. An easy way to make sure you do this is to draft your essay, then go back and reread what you’ve
  written. After every single sentence, ask yourself the questions “How?” and “Why?” If the sentence that
  follows explains the how or why, you’re good to go. But if the how and why aren’t present, you need
  to add more content to explain and justify your claims.</p>

  <p>The next time you’re scrolling through social media instead of working on an essay, pay attention
  to the choices made in each post. Then dive into your academic writing: Study the essays you’re reading
  for class and notice their rhetorical moves so you can riff off them. Think about your hashtag audiences,
  choose filters to shape your ethos in your writing, and use punctuation to shape your message. Just
  don’t forget to include the why! Playing off of social media’s strongest features while also explaining
  and justifying your ideas fully will give you the best chance of being a strong writer in college.</p>

