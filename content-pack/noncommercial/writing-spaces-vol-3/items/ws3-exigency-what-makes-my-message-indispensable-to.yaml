  <p>Teacher Resources for Exigency: What Makes My Message Indispensable to My Reader by Quentin Vieregge</p>

  <p>Overview</p>

  <p>Discussing exigency can help students to not simply think about the “so what” of their writing, but
  also to consider and analyze the prompt more carefully. I’ve found that students go through a layered
  understanding of a prompt, at first understanding the basic concept and then looking more carefully
  at the prompt’s specific requirements. But what makes their papers far more effective is if they can
  take ownership of the prompt—in other words, if they can consider a way of making it more than simply
  an assignment, but an opportunity for them to address an issue they are passionate about to a specific
  audience. To help them develop this sense of audience and purpose, a discussion of exigency can be beneficial.
  This is one reason to talk about exigency at the beginning of the writing project. The discussion about
  it will differ depending on how narrowly their purpose and audience is being defined by the writing
  prompt, but either way, the beginning of the project is the first and probably best place to discuss
  exigency.</p>

  <p>It can also be helpful to discuss exigency when students are writing their introductory paragraphs,
  concluding paragraphs, or as they are revising their drafts to craft a more compelling argument. These
  three points in the composition process are what I think of as global points, where students have an
  opportunity to look at the writing assignment holistically. As a reader—in and out of the classroom—the
  introduction and conclusion are often where I find exigent moments, and I tell students this, perhaps
  bringing in examples for them to review and discuss. As a writer, it’s often in the middle or at the
  end of the writing process that I can better grasp the exigency of an argument for both myself and my
  readers, and this can be a point of discussion in class as well.</p>

  <p>As my chapter asserts, asking students to think in terms of author and reader personas may also help
  lead to discussions on exigency. Asking students to think of personas invites them to consider what
  agenda or values correspond with that persona and how those considerations can help writers establish
  connections with their readers. Finally, exigency isn’t just connected to global issues like persona,
  audience, and purpose; it can also be thought of in terms of templates and well-worn rhetorical moves.
  Showing students rhetorical patterns connected to exigency, such as how writers explain a “gap in the
  research,” can help make it clear to students how they can articulate exigency at the sentence or passage
  level.</p>

  <h3>Discussion Questions</h3>

  <p>1. Can you think of any other strategies for invoking exigency other than those listed above?</p>

  <p>2. Have you ever struggled to think of a purpose behind your writing for a particular paper? What
  did you do to resolve this problem?</p>

  <p>3. What nonfiction texts have you read that made you feel the text’s subject matter was absolutely
  essential to you?</p>

  <p>4. Find and read an academic article, political speech, or magazine article that employs one of these
  strategies. Which strategy does it employ, and how effective is the text at invoking exigency?</p>

  <p>5. What genres can you think of that are not mentioned in this article? In what ways do authors typically
  use exigency in those genres?</p>'
