body: '<p><em>Access for free at openstax.org.</em></p>

  <h3>Sentence Errors</h3>

  <p>These four common sentence errors can make your writing hard to read: fragments, comma splices, run-on
  sentences, and mixed constructions.</p>

  <h3>Sentence Fragments</h3>

  <p>A sentence fragment is a group of words that lacks a subject, a verb, or both, or it is a subordinate
  clause (a clause that begins with a subordinating word such as although, because, since, and so on)
  punctuated as though it were a sentence by itself. Although most are grammatical errors, sentence fragments
  can be used judiciously in conventional writing so long as the purpose is clear to readers and the fragment
  is clearly intended.</p>

  <h3>Unintentional Sentence Fragments</h3>

  <p>Often a sentence fragment follows a complete sentence and expands on it, as illustrated in the examples
  below (fragments are underlined). You can correct most fragment errors by attaching the fragment to
  the sentence to which it belongs or by rewriting the fragment as a complete sentence.</p>

  <p>Sentence Fragment People think that they will be happy if they are well off. That money will make
  everything better.</p>

  <p>Revised by Attaching the Fragment to a Complete Sentence People think that they will be happy if
  they are well off and that money will make everything better.</p>

  <p>Sentence Fragment Psychologist David Myers explains how students have increasingly chosen to attend
  college to make more money. Thus further explaining his point of people’s desire to use money to gain
  happiness.</p>

  <p>Revised by Attaching the Fragment to a Complete Sentence Psychologist David Myers explains how students
  have increasingly chosen to attend college to make more money, thus further explaining his point of
  people’s desire to use money to gain happiness.</p>

  <p>Sentence Fragment Although income grew, people’s happiness did not. With rich people reporting that
  even though they had plenty of money, their happiness had not changed much.</p>

  <p>Revised by Adding a Verb Although income grew, people’s happiness did not. Rich people reported that
  even though they had plenty of money, their happiness had not changed much.</p>

  <p>Sentence Fragment For many people, increased income is being spent on the things that people are
  unable to pay less for. Things like taxes, childcare, transportation, and housing.</p>

  <p>Revised by Adding a Subject and a Verb For many people, increased income is being spent on things
  that people are unable to pay less for. These include taxes, childcare, transportation, and housing.</p>

  <h3>Intentional Sentence Fragments</h3>

  <p>Intentional sentence fragments force quick reading, inviting readers to stitch meaning to together.
  Intentional fragments are most common in creative writing and advertising.</p>

  <p>The rabbit darted out of the shadows. A flash of movement. The dog lunged and strained at the leash.</p>

  <h3>Comma Splices</h3>

  <p>A comma splice is a common error that occurs when two complete sentences are joined by a comma. You
  can correct a comma splice by adding a coordinating conjunction (for, and, nor, but, or, yet, or so),
  adding a period and creating two sentences, adding a coordinating conjunction and creating a compound
  sentence, or subordinating one clause and creating a complex sentence.</p>

  <p>Comma Splice The author sheds light on the financial sacrifice many mothers make, they take care
  of their children without compensation and often lose professional status.</p>

  <p>Revised with a Coordinating Conjunction The author sheds light on the financial sacrifice many mothers
  make, for they take care of their children without compensation and often lose professional status.</p>

  <p>Comma Splice Many college students see their education as the way to become wealthy, some are sacrificing
  happiness to pursue high-paying careers.</p>

  <p>Revised with a Period Many college students see their education as the way to become wealthy. Some
  are sacrificing happiness to pursue high-paying careers.</p>

  <p>Comma Splice Psychologist David Myers conducted multiple surveys asking people about their attitudes
  about money, the results revealed that people felt they needed more regardless of how much they had.</p>

  <p>Revised with a Semicolon Psychologist David Myers conducted multiple surveys asking people about
  their attitudes about money; the results revealed that people felt they needed more regardless of how
  much they had.</p>

  <p>Comma Splice Love cannot be paid for, it is a gift that parents give because they love their children.</p>

  <p>Revised with a Semicolon and Transitional Word or Phrase Love cannot be paid for; indeed, it is a
  gift that parents give because they love their children.</p>

  <p>Comma Splice Students are choosing majors to enable them to earn more money, they are under the misconception
  that earning money guarantees happiness.</p>

  <p>Revised with a Subordinate Clause Students are choosing majors to enable them to earn more money
  because they are under the misconception that earning money guarantees happiness.</p>

  <h3>Run-on Sentences</h3>

  <p>In a run-on sentence, two or more complete sentences are not separated by any punctuation. Like comma
  splices, most run-on sentences can be revised in one or more of the following ways: adding a coordinating
  conjunction (for, and, nor, but, or, yet, or so), adding a period and creating two sentences, separating
  the sentences with a semicolon, separating the sentences with a semicolon and transitional word or phrase
  (such as on the other hand, however, consequently, and so on), or turning the less important sentence
  into a subordinate clause starting with a subordinating word such as although, because, if, when, since,
  and so on.</p>

  <p>Run-on Sentence The DNR eventually designated the area as crucial habitat the protection came too
  late to save the nesting birds.</p>

  <p>Revised with a Comma and a Coordinating Conjunction The DNR eventually designated the area as crucial
  habitat, but the protection came too late to save the nesting birds.</p>

  <p>Run-on Sentence Most people realize that being wealthy won’t just happen many college students choose
  a major that will ensure they make money.</p>

  <p>Revised with a Period Most people realize that being wealthy won’t just happen. Many college students
  choose a major that will ensure they make money.</p>

  <p>Run-on Sentence Parents do not expect any financial reward they care for their children out of love
  and responsibility.</p>

  <p>Revised with a Semicolon Parents do not expect any financial reward; they care for their children
  out of love and responsibility.</p>

  <p>Run-on Sentence The average American family’s expenses have risen faster than incomes they have saved
  less than prior generations.</p>

  <p>Revised with a Semicolon and Transitional Word or Phrase The average American family’s expenses have
  risen faster than incomes; as a result, they have saved less than prior generations.</p>

  <p>Run-on Sentence College students have the opportunity to choose any major they tend to choose those
  that offer immediate opportunities to earn money when they graduate.</p>

  <p>Revised with a Subordinate Clause Although college students have the opportunity to choose any major,
  they tend to choose those that offer immediate opportunities to earn money when they graduate.</p>

  <h3>Mixed Sentence Constructions</h3>

  <p>A mixed sentence contains parts that do not fit together because of grammar or meaning. In the following
  example, the writer needs to revise either the second part to fit with the first part or the first part
  to fit with the second. (See Editing Focus: Mixed Sentence Constructions for more on mixed sentence
  constructions.)</p>

  <p>Mixed Sentence By starting my general studies classes last semester gave me the opportunity to take
  classes in my major this fall.</p>

  <p>Second Part Revised By starting my general studies classes last spring, I had the opportunity to
  take classes in my major this fall.</p>

  <p>First Part Revised Starting my general studies classes last spring gave me the opportunity to take
  classes in my major this fall.</p>

  <p>Just because . . . doesn’t mean Constructions. Just because . . . doesn’t mean constructions are
  common in speech but should be avoided in writing.</p>

  <p>Just because Just because I want to be a doctor doesn’t mean I will get into medical school.</p>

  <p>Revised Simply wanting to be a doctor doesn’t guarantee admission to medical school.</p>

  <p>Revised Although I want to be a doctor, I will need to work hard to get into medical school.</p>'
