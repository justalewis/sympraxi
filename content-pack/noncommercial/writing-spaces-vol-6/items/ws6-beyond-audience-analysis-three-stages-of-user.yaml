  <p>Teacher Resources</p>

  <p>Overview and Teaching Strategies</p>

  <p>Audience is infused in technical writing practice and pedagogy. UX research is a formal and systemic
  approach to audience analysis that can be incorporated into your courses where you would normally focus
  on audience.</p>

  <p>The three stages of UX research are designed to be flexible in practice but are also flexible for
  classroom pedagogy. For example, as a teacher you may choose to make Phase One a collaborative project
  where the class completes a literature review matrix together. This project can be set up with classroom
  activities like reading and analyzing at least one research article together and comparing audience
  assumptions with actual data.</p>

  <p>UX research and the concepts from this article may be incorporated into the following topics:</p>

  <ul><li>Introducing rhetorical concepts of audience and audience analysis • Writing complex information
  for audiences • Biases and assumptions about audiences • Case studies about design failures • Introducing
  concepts of usability, readability, and accessibility • Introducing ethics and social justice approaches
  to technical writing • User documentation like use cases and journey maps as project management tools</li></ul>

  <p>Discussion Questions</p>

  <p>These discussions and activities can be scaled for class discussion, group activities and projects,
  or individual assignments.</p>

  <ul><li>Choose a generation (e.g., Baby Boomers, Gen X, Millennials, or Gen Z) and write down what you
  know or think you know about them. Conduct background research to check your assumptions.</li><li>Create
  a literature review matrix with at least 6 sources (See Stage One). Write an analytic memo or create
  a persona based on your findings. For information about creating personas, visit https:// digital.gov/2015/04/06/using-personas-to-better-understand-customers-usa-gov-case-study/.</li><li>Read
  a usability study as a class. Identify and describe the research question(s), method, and sampling approach.
  What remains relevant about the study and what can be updated? Consider different user groups, technologies,
  and contexts of use.</li><li>Choose a campus process to evaluate. Consider processes associated with
  transportation, registration, financial aid, the library, or advising. Identify design decisions and
  how they connect to various stakeholders and audiences. What is assumed about the context of use? Design
  a card sorting exercise or think aloud protocol to test one of these processes.</li></ul>'
