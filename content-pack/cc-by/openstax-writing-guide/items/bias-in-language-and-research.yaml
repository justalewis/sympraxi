body: '<p>When you begin any research project, it is important to have set checks and balances to ensure
  you are not unknowingly imposing your own biases into your research. A <em>bias</em> is a personal and
  usually unreasoned judgment, or a prejudice. Although it may be impossible to function without any bias
  (good or bad), you <em>can</em> consider possible components of bias in your research. No document can
  be completely objective, for all documents are created by people who have been socialized in some way;
  therefore, it is helpful to think about the biases of authors of research documents. Many researchers
  are clear about their biases and state them in introductions to their writings, whereas others may use—or
  omit—evidence in a way that implies bias for or against the topic.</p>

  <p>As a student researcher, seek to be as transparent and critically self-reflective as possible about
  your preconceptions and language use. Although you will revisit the concept of bias in source selection
  in The Research Process: Where to Look for Existing Sources, in this section you will look at bias in
  topic choice and language use.</p>

  <h2>Language Bias</h2>

  <p><a href="https://openstax.org/r/languagebias">Language bias</a> refers to words and expressions that
  are offensive, demeaning, or prejudicial toward individuals or groups on the basis of gender, race,
  ethnicity, social class, appearance, physical or mental abilities, or sexual orientation. One form of
  <a href="https://openstax.org/r/languagebias1">language bias</a> is <em>sexist language</em> that includes
  only one gender. The most common occurrence is use of the word <em>man</em> or <em>men</em> to stand
  for all people—including those who are not male. Language has changed to be more inclusive, with terms
  such as <em>firefighter</em> replacing <em>fireman</em> and <em>mail carrier</em> replacing <em>mailman</em>.</p>

  <p>Another kind of language bias focuses on people’s health or abilities, indicating a person as a “victim”
  of a certain disease or “suffering from it.” Use unbiased language to identify the person as someone
  “with X disease.” Similarly, refer to a “person who is blind” rather than a “blind person.” This kind
  of language focuses on the person, not the disease or ability.</p>

  <p>To avoid language bias, follow these guidelines:</p>

  <ul><li>Use currently accepted terminology when referring to groups of people. If you are writing about
  a group of people and are unsure of the proper terminology, research the most recent usage patterns
  before you write. The same is true for pronoun references, about which you can find more information
  in Editing Focus: Pronouns and Pronouns.</li><li>Be sensitive when referring to people with disabilities
  by using a “people first” approach. For example, say “a person who uses a wheelchair” instead of “a
  wheelchair-bound person.”</li><li>Avoid stereotyping—that is, attributing positive or negative characteristics
  to people on the basis of groups to which they belong. Although not strictly linguistic, stereotyping
  comes through in making assumptions about people. A stereotypical attitude would be to assume that all
  or most rich people act in certain ways and, conversely, that all or most poor people act in certain
  ways. Another stereotypical attitude would be to assume that a person who comes from a particular area
  of the country adheres to a certain political agenda.</li></ul>

  <h2>Assignment: Reviewing Your Research Essay for Language Bias</h2>

  <p>First, review your essay, and speculate as to biases or blocks you may have incorporated while researching
  and writing. Freewrite, reflecting on these possibilities. Next, go through your essay one section at
  a time, and highlight any people references, pronouns, biased language, and instances of possible stereotyping.
  Using the information above and your reflective freewrite, complete a bias chart like the one shown
  in . Next, exchange your essay with two other classmates to see whether they detect bias of which you
  were unaware. After receiving feedback from two or three people, form a group and discuss what each
  of you found and how to use alternative language or references. Finally, revisit your freewriting after
  collaborating with your classmates to reconsider what you wrote before. Add a section to the freewrite
  in which you relate what your group discussed and what you may have learned from that discussion.</p>

  <table><tr><th>Essay Section</th><th>Essay Language</th><th>Possible Bias</th><th>Possible Revision</th></tr><tr><td></td><td></td><td></td><td></td></tr></table>

  <h2>Publish Your Work</h2>

  <p>After completing your argumentative research paper, you should have a product to be proud of. Your
  instructor may have a plan to publish papers written by class members, or you may be interested in publishing
  on your own and joining a wider scholarly conversation. Consider submitting your work to one of these
  journals that publish undergraduate research:</p>

  <ul><li><em><a href="https://openstax.org/r/butlerjournalUG">Butler Journal of Undergraduate Research</a></em></li><li><em><a
  href="https://openstax.org/r/crossingborders">Crossing Borders: A Multidisciplinary Journal of Undergraduate
  Scholarship</a></em></li><li><em><a href="https://openstax.org/r/liberatedarts">Liberated Arts: A Journal
  for Undergraduate Research</a></em></li><li><em><a href="https://openstax.org/r/reinvention">Reinvention:
  An International Journal of Undergraduate Research</a></em></li></ul>

  <p>In addition, if you have designed your research project as a solution to a local problem, consider
  finding venues to disseminate the information to those for whom it would be the most useful. This decision
  may mean adjusting the format, tone, language, and/or conventions of your work to address the needs
  of a specific audience.</p>'
