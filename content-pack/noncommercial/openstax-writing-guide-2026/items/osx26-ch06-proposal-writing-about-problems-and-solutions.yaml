  paragraphs often lack a central point and are poorly developed; the recommendation is weak. Evidence
  is poorly integrated into sentences, with few connections among ideas and evidence. The language is
  often confusing or inappropriate.</p>

  <p>The proposal topic demonstrates a weak understanding of purpose. The proposal itself shows minimal
  awareness of audience, context, and community expectations. The presentation is somewhat appropriate
  to the content. The writer’s voice is only occasionally objective and trustworthy.</p>

  <p>1 Beginning</p>

  <p>The text does not adhere to the “Editing Focus” of this chapter: subject-verb agreement as discussed
  in Section 6.6. The text also shows little to no evidence of the writer’s intent to consciously meet
  or challenge conventional expectations in rhetorically effective ways.</p>

  <p>The introduction may be mildly interesting; no discernible thesis is stated. Problem-and-solution
  paragraphs lack a central point and are undeveloped; the recommendation is either inappropriate or absent.
  Evidence is not integrated into sentences; there are no clear connections among ideas and the minimal
  amount of evidence that is present. The language is confusing or inappropriate.</p>

  <p>The proposal topic demonstrates little or no understanding of purpose. The proposal itself shows
  little or no awareness of audience, context, and community expectations. The presentation is inappropriate
  to the content. The writer’s voice is neither objective nor trustworthy.</p>

  <p>6.8 Spotlight on … Technical Writing as a Career</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Describe technical writing as a career path. •
  Explore the field of technical writing in greater depth.</p>

  <p>If you like science and technical fields and you like to write, you may want to explore technical
  writing as a career path. Technical writers usually have a degree in English, journalism, or communication.
  Often, they also have knowledge, college coursework, or a degree in a specialized field such as computer
  science, engineering, medicine, biology, agriculture, and other technical fields, such as manufacturing,
  construction, welding, and plumbing; however, companies will usually train technical writers on the
  subject needed and the style in which the writers they employ need to write.</p>

  <ul><li>Create content. Technical writers create an array of documents, such as product information,
  operating and assembly instructions, “how-to” and “owner’s” manuals, technical documentation, business
  proposals (solicited and unsolicited), lists of frequently asked questions (FAQs), grant proposals,
  and journal articles. (For more on how to write a business proposal, which contains specific sections
  that often are not included in an academic proposal paper, see the OpenStax Business Communications
  text.)</li><li>Research. Technical writers conduct research to gather the information they need to write
  accurate, professional, and helpful content.</li><li>Edit. Technical writers edit and standardize content
  prepared by other writers in their organization. • Adapt content for multiple platforms. Technical writers
  create paper-based and digital content, using text, graphics, images, sound, and video to be distributed
  across different platforms, including an organization’s website and social media. In addition, technical
  writers develop and use the following skills: • Writing. Technical writers spend extended periods of
  time in front of a computer writing complicated information in clear and concise language. • Audience
  awareness. Technical writers are highly aware of the audience for their writing. They plan, organize,
  and distribute the content they create with their readers, viewers, and users in mind. • Communication
  and collaboration. Technical writers typically work on teams and collaborate with technical experts,
  coworkers, and clients. • Problem-solving. Technical writers often need to figure out how something
  works in order to write documents their audience can understand. • Time management. Technical writers
  often work on multiple projects with tight deadlines. Setting priorities to keep projects on track is
  a key skill. To learn more about technical writing as a career, including average pay, employment outlook,
  and more, see the U.S. Bureau of Labor Statistics Occupational Outlook Handbook (https://openstax.org/r/
  occupationaloutlookhandbook). You can also read job descriptions and search for internship opportunities
  at job sites such as Indeed, Monster, or Snagajob.</li></ul>

  <p>6.9 Portfolio: Reflecting on Problems and Solutions</p>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Reflect in writing on the development of your writing process. • Reflect in writing on how the
  writing process affected your work. • Reflect in writing on your objectivity as a writer. As you complete
  your proposal, think critically about your writing process. Reflect on what you created from the first
  steps of discovering ideas to the last steps of writing and editing the final draft.</li></ul>

  <h3>Reflecting on Your Proposal</h3>

  <p>Respond to the following questions to reflect on your writing process for your proposal: • How did
  you choose the problem you wrote about? Did you have to narrow or expand it? • What methods did you
  use to gather ideas about the problem and possible solutions? What outside sources did you consult for
  information? • How did you settle on your thesis? Did you rewrite it multiple times? • What strategies
  did you use to organize the information for your proposal? • What strategies did you use to develop
  paragraphs? What difficulties, if any, did you encounter? • Were you satisfied with the recommendation(s)
  you made and how you ended the proposal? • How challenging was it for you to adopt an objective stance?
  How did you adapt your language as you drafted and revised your proposal? • How did input from peers
  and other readers affect your drafting and revising processes? What specific constructive criticism
  did you receive that helped you? • In what ways was this proposal easier or harder to write than other
  papers you have written? • What could you have done differently to make writing your proposal easier
  or more effective?</p>

