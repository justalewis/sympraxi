  <p>Teacher Resources for Creating, Using and Sharing Information in Research Communities</p>

  <p>This essay is intended to help students understand that research is a skill that encompasses practices
  from both composition and information literacy. Research is often taught as something extra that you
  do for some papers on top of writing. In many situations, students’ in-class experiences with researching
  is encompassed in a “library day,” where a librarian walks students through using the college library
  website to search databases and locate books. However, that type of learning does not reflect the broad
  array of information seeking, sharing, and creating practices that accompany the activities of many
  researchers. In this chapter, we seek to help students see research as an integral and ongoing part
  of the writing process, and as a social action, in and through which they are engaging with a community
  of researchers. We want students to understand that the heuristics for research shift depending on the
  communities with which they are engaging, and we want to equip them with skills for identifying and
  employing the best information use and practices agreed upon by their communities.</p>

  <p>Teaching students about research communities will work best when they already have been introduced
  to the concept of discourse communities, and this approach can be used in any college level course,
  with appropriate context and assignments. We recommend that the chapter is taught with Writing Spaces
  chapters including Kerry Dirk’s “Navigating Genres,” Dan Melzer’s “Understanding Discourse Communities,”
  Randall McClure’s “Googlepedia: Turning Information Behaviors into Research Skills” and James Purdy’s
  “Wikipedia is Good For You!?”</p>

  <h3>Discussion Questions</h3>

  <p>1. The authors begin the chapter with an example of a research community. What is a research community
  that you participate in? How does it meet the following criteria:</p>

  <ul><li>Where is information in the community created and shared? • What questions and conversations
  are people in this community sharing? • What genres do researchers use when they create information?</li></ul>

  <p>Are there multiple genres? Multiple formats or media?</p>

  <ul><li>What are the particular terms that this community uses to refer to objects, events, or ideas?</li><li>Who
  are the experts in the community? Why are they considered experts?</li><li>What are the values and norms
  about research and information in the community?</li></ul>

  <p>2. Discourse Community or Research Community? In a small group, share examples of communities you
  participate in—one example could be your writing course! Review the criteria for discourse communities
  and the criteria for research communities in the chapter. Decide as a group which of the examples shared
  by group members are discourse communities and which are research communities.</p>

  <p>3. Explore how a text might demonstrate the characteristics of a research community. With a small
  group, pick a peer-reviewed journal and skim the archives. What can you learn about the research community
  who shares, discusses, and responds to the research published in the journal?</p>

  <p>4. Consider a profession that you are interested in pursuing. What sorts of research do people who
  work in this profession need to do on a daily basis? Weekly? Periodically? When do they use information?
  And where do they find and share information?</p>

  <h3>Activities</h3>

  <p>Students can conduct research community analyses on a variety of different scales. For an in-class
  assignment, ask students to fill out the following analysis table.</p>

  <p>Table 3. Research Community Analysis Table</p>

  <p>Research Community Analysis Table</p>

  <p>Research Community Questions</p>

  <p>Does the community create and share information in cycles and specific locations? Where?</p>

  <p>Does the community create and share information in a conversational way? How?</p>

  <h3>Research Community Analysis Table</h3>

  <p>What particular genres, formats, and media do the community members use?</p>

  <p>Does the community use specialized terminology? Like what?</p>

  <p>Are there experts in researching in the community? What qualifies as expertise?</p>

  <p>Does the community have ethical norms for the creation and sharing of information? Like what?</p>

  <p>Students might also have questions about how discourse communities and research communities differ.
  After asking students to explore the questions above individually or with a small group, pose this as
  a discussion question. You can open that question up to the class, asking them to use examples from
  the reading and also from their own experiences in order to see how discourse and research communities
  intersect and where they diverge.</p>

  <p>Students can also explore research communities as a longer stand-alone assignment wherein a final
  project might be a paper, video, or infographic demonstrating how a particular community meets the criteria
  for a research community. Alternatively, a research community analysis can be used as process-work for
  a larger assignment such as a literature review or for a more nuanced take on an annotated bibliography
  assignment.</p>'
