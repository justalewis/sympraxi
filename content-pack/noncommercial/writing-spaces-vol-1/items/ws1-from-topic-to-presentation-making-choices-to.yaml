body: '<p>From Topic to Presentation: Making Choices to Develop Your Writing</p>

  <p>Beth L. Hewett</p>

  <p>Introduction</p>

  <p>Every semester, I ask my students for topic ideas, and then I write an essay for them.* When we’re
  in a traditional classroom, they watch me write the initial draft using a computer and projector; they
  comment on the writing, and I present revisions to them later. When we work online, they receive copies
  of all my drafts with changes tracked for their review and comments. My students like this exercise—partially
  because they don’t have to do the writing, but mostly because they like to see what I can make of an
  assignment they give me. They tell me that they struggle with beginning the writing and that the model
  I offer teaches new ways of understanding writing and revision. I like this exercise for the same reasons.</p>

  <p>This chapter addresses how to make decisions about essay development and revision. It pays particular
  attention to using feedback from peers, instructors, or other readers. While you’ve probably had a lot
  of instructor feedback and many opportunities to review other students’ writing and to have them review
  yours, you may not have learned much about how to make revision choices related to such feedback. To</p>

  <p>*  This work is licensed under the Creative Commons AttributionNoncommercial-No Derivative Works
  3.0 United States License and is subject to the Writing Spaces Terms of Use. To view a copy of this
  license, visit http://creativecommons.org/licenses/by-nc-nd/3.0/us/ or send a letter to Creative Commons,
  171 Second Street, Suite 300, San Francisco, California, 94105, USA. To view the Writing Spaces Terms
  of Use, visit http://writingspaces.org/terms-of-use.</p>

  <p>Beth L. Hewett help you learn about making choices, I present my own argumentative essay that I developed
  from my students’ feedback, and I analyze my decision-making processes as a model for you.</p>

  <p>In this chapter, you’ll see various stages of an in-progress essay:</p>

  <p>1. Choosing among topics</p>

  <p>2. Brainstorming</p>

  <p>3. Writing an initial, or “zero,” draft</p>

  <p>4. Writing a preliminary draft that is intended to be revised</p>

  <p>5. Using student feedback to revise</p>

  <p>6. Completing a presentation draft</p>

  <p>7. Considering how to make these processes work for you</p>

  <p>The drafts, feedback, and commentary demonstrate how you can develop an essay from early thinking
  to preliminary writing to presentation-quality writing. Although there are many other ways to write
  an essay, this model may give you some ideas for your own writing. In addition, don’t be surprised if
  you need more drafts for your essays than you see presented here. This essay was a short one (for me),
  and so I was able to revise fairly thoroughly in one step. However, a longer project usually takes me
  many drafts and many feedback rounds to develop fully.</p>

  <p>My essay was developed much like your essays are even though I’m a more experienced writer. My assignment
  was to write an argument, so I was constrained by the genre’s requirements. The argument needed to state
  a position (my assertion or thesis) and had to support that position with good reasons and sufficient
  evidence to substantiate those reasons. I had a choice of topics, but I didn’t have complete freedom
  to write about just anything I wanted. The topic I ultimately chose was one that I was interested in
  but knew little about, so I needed to do a lot of research. Because my class was taught in a completely
  online setting and because I was working from home, I didn’t have a physical library to go to, so I
  used my university’s library search engines and the Internet for my research. Finally, I had only four
  work days to begin and complete a preliminary draft for student review; the process took twelve solid
  work hours.</p>

  <p>From Topic to Presentation</p>

  <p>My Students’ Suggested Writing Topics</p>

  <p>To figure out what I would write about, I asked my students to suggest an assignment for me. As the
  example topics show, some them were pretty mundane—easy to do, but insubstantial and, frankly, boring.
  Other topics were substantial, but difficult to research and write about thoughtfully in just four days
  for the class. Finally, one student suggested a topic that captured my interest and that of other students;
  peers added their questions, and I knew this was the topic I wanted to address even though I knew little
  about it.</p>

  <h3>Students’ Suggested Topics</h3>

  <ul><li>Write about a cell phone charger. I had a teacher in high school that would pick random things
  every class and make us write about it for 10 minutes to “warm up” our brains. I hated those assignments.</li><li>Why
  are liquid laundry detergents superior to powdered detergents?</li><li>Does modern technology make life
  better and more convenient?</li><li>How will the recent election of President Barack Obama affect race
  relations in the U.S.?</li><li>What are your thoughts and opinions on adoptions by homosexual couples?</li><li>Nadya
  Suleman gave birth to octuplets. Should the doctors have advised her against in vitro fertilization
  since she’s not financially stable to take care of all of those children? If she does end up on welfare
  should taxpayers be outraged? At what point or if at any should the government step-in in situations
  such as this? • One angle to look at this sort of story is whether humans should impregnate themselves
  with “litters” of babies. • Personally, I would also like to know what doctor would inseminate this
  woman without [who didn’t have] the funds to do so. It makes me wonder if he/she just wanted part of
  the publicity.</li></ul>

  <p>When you find a topic that is interesting and challenging, you’ve probably got a good subject that
  will sustain your attention during the</p>

  <p>Beth L. Hewett harder parts of the writing. In this case, I was fascinated by the idea of a woman
  giving birth to eight children and the moral questions that the students asked about this case. I wondered
  what the woman’s motivation was for having more children when she already had six of them, was unmarried
  and without a supportive partner, and unemployed.</p>

  <p>Notice that the interest level of the topic doesn’t guarantee an easy one to research. I chose to
  do quite a bit of digging into the issue because I had an “itch to know”; my curiosity was sufficient
  reason for me to do this work. Although school assignments may not seem this way, the motive behind
  research is—or should be—the genuine need or desire to answer a question for which you don’t have the
  answer but about which you really want to know more.</p>

  <p>My topic choice also took into consideration that my students would be writing an essay that supports
  a position during the semester. I wanted to write a similar type of essay that would provide a model
  for them at that time in their writing development. Thus, choosing my topic was connected to the rhetorical
  situation of my teaching these students to write arguments that are designed to convince audiences.</p>

  <h3>Brainstorming</h3>

  <p>One way that writers can find ideas is commonly called “brainstorming.” While there are many ways
  to find ideas, brainstorming is popular because writers often learn how to do it by such strategies
  as journaling, listing thoughts, and circling and connecting ideas.</p>

  <p>To brainstorm my essay topic, I developed a series of questions that interested me. I also did some
  preliminary research. Although I didn’t list where that research came from in my notes here, I did list
  them on my original notes so I could be sure to credit my sources with their ideas and words.</p>

  <h3>Brainstorming</h3>

  <ul><li>Octuplets = irresponsibility? • Selfishness? • Freak of non-nature? • Potential for abuse of
  children • How the children will/may grow up • Include stats</li></ul>

  <p>From Topic to Presentation</p>

  <ul><li>The increase in multiple births in the past 29 years clearly is due to supplemental fertilization
  methods like invitro fertilization (IVF). Increase of rates XYZ.</li><li>Newborn octuplets have taken
  the world by surprise and gotten our attention: how were they conceived (IVF), who is the mother and
  why would she have asked to have so many embryos implanted (six other children, divorced and single,
  no job, on disability, lives with mother)—what about them? • Multiple birth children are exploited;
  humans not made to have litters; how do we care for all these children? Sensationalism: TV, movies,
  books, Quintland. Can we predict the ramifications for the children? Yes. Dionne quintuplets; Jon/Kate
  + 8</li><li>Assertion? As the rate of multiple births increases due to various fertility treatments,
  we must be thoughtful about the possibility that children of such births will be exploited by their
  parents and a curious society. (curiosity, money, nurturing) (to insist on protecting these kids would
  be a persuasive paper)</li><li>Assertion? As fertility treatments increase the rate of multiple births,
  the potential for both parents and society to exploit these children also increases.</li></ul>

  <p>Notice that while I just listed some ideas, my notes show that I also began my research. First, I
  needed to learn about the topic, which is to earn an “informed opinion,” and then I could express that
  informed opinion through a thesis, or assertion. I wrote two possible assertions at this early stage.
  They helped me to narrow down what I believed I wanted to argue.</p>

  <h3>Initial, or Zero, Draft</h3>

  <p>After brainstorming, many people write an initial draft, which I am calling a zero draft. The zero
  draft gets the writing started and generally isn’t going to be ready for others to see. This draft is
  a great way to begin because you don’t have to be neat and tidy or super correct sentence-wise. Since
  this draft just begins to organize ideas, a zero draft should never be turned in as a completed draft
  for grading; trust me—these drafts just aren’t ready for prime time. Zero drafts also</p>

  <p>Beth L. Hewett tend to be fairly useless in a peer response session, so write a complete preliminary
  draft for that purpose. Unless your instructor asks you to provide it, this draft is yours alone. Return
  to it as you write your preliminary draft to keep track of how your earliest ideas are developing. You’ll
  be interested in seeing whether your preliminary draft follows these early ideas or veers from them.</p>

  <p>Zero Draft</p>

  <p>Zero Draft</p>

  <p>The Exploitation of Multiple Birth Children</p>

  <p>Two weeks ago, Nadya Suleman gave birth to octuplets in a California hospital. Although all eight
  babies lived, they were very small and some may die. Suleman now is the mother of fourteen children—six
  between the ages of 2 and 7. She is unemployed, without a husband or partner, and lives in her mother’s
  home (she fights with her mother enough that her mom has said so publically). Suleman’s babies and her
  own poverty are the talk of the tabloids and everyone seems to have an opinion. But people have always
  been excited when multiple children are born to women. But there will likely be more of these births
  because of in vitro fertilization. Both parents and society tend to exploit these children, but it is
  not acceptable because it is harmful to the children.</p>

  <p>For demonstration purposes, I’m showing you only one paragraph of my zero draft. It provides the
  barest details of what the first paragraph of my preliminary draft would become. Don’t worry if my zero
  draft looks stronger than one of yours might. I write professionally and I teach writing—it’s natural
  that I would get a good start. When you look at the preliminary draft, however, you’ll see that I can
  do much better! The assertion, which is the last sentence in both examples, is much more focused in
  the preliminary draft than it is in the zero draft</p>

  <p>For people who really become stuck or “blocked” when beginning to write an essay, the combination
  of some brainstorming and a zero draft can get you started writing fairly painlessly. If you’re really
  stuck, just take some of your brainstorming ideas and begin writing without</p>

  <p>From Topic to Presentation looking at the paper or screen. Take time to begin developing your thinking
  before worrying about whether it makes much sense. As long as you take time for writing additional drafts,
  this zero draft process will be helpful.</p>

  <h3>Preliminary Draft</h3>

  <p>How does this first paragraph change in the preliminary draft? As we can see from the example preliminary
  draft that follows, the argument becomes more fully fleshed out. It contains more detail in general
  and it uses various source citations for authority. One of the reasons that I included these citations
  was to give my readers a sense that I had earned an informed opinion. My process before writing this
  next draft was to deepen my knowledge of the topic through more research and to try to express my informed
  opinion through a coherent assertion. Throughout the entire argumentative essay, I needed to support
  that opinion so that readers could be convinced that it is reasonable. Readers didn’t have to agree
  with me or with each other for my argument to be successful. Because people argue only about those things
  for which there is no definite or single position, it isn’t possible to get everyone in my audience
  to agree with me—which is why my readers only needed to find the argument reasonable.</p>

  <p>Let’s look now at the complete preliminary draft. After I finished this draft, I posted it for my
  students to review. Their feedback is shown in the right hand column. At various places in this draft,
  I make a break and respond to the comments to show my thinking and decision making process. Since I’m
  writing this chapter for you months after teaching this particular class, I provide you with some hindsight
  thinking as well.</p>

  <p>Bold text shows what I added to the preliminary draft in response to student feedback and my own
  developing thinking. A strikethrough shows what I deleted in revision. If you can imagine that these
  changes were all accepted, then you have a good sense of what the presentation draft looked like. Notice
  that the revision was fairly substantial in that I addressed what I considered to be most important:
  content, organization, and sentence-level issues in that order.</p>

  <p>Beth L. Hewett</p>

  <p>Preliminary Draft and Tracked Changes</p>

  <p>Fig 2</p>

  <p>The Exploitation of Multiple Birth Children</p>

  <p>Two weeks ago, On January 26, 2009, Nadya Suleman gave birth to octuplets in a California hospital.
  To date, all eight babies are alive, but they weighed only between 1 pound, 8 ounces and 3 pounds, 4
  ounces at birth, which means that they will be in the neonatal unit of the hospital for weeks to come.
  Suleman now has fourteen children—six between the ages of 2 and 7—all of them conceived by in vitro
  fertilization (IVF), but she also has no job, no husband or significant other, and no home of her own.
  She lives with her mother, who publicly has expressed disgust with her daughter’s obsessive desire for
  multiple children (“Grandma,” 2009). ). Although in the past she has subsisted with disability payments
  for a job‐ related injury, Suleman said she refuses Welfare money to support herself and her children
  (Celizic 2009). However, she has retained a publicist, who mentioned that she’s looking at seven‐figure
  offers for her “story” (Celizic 2009; Rochman 2009). Suleman’s babies and her own life circumstances
  are being discussed ad nauseam by the media, medical and mental health professionals, and everyday citizens
  alike. The flurry of interest in Suleman’s situation is just a recent example of the excitement people
  tend to experience when multiple births occur. However, as fertility treatments increase the rate of
  multiple births, the potential for both parents and society to exploit these children also increases.
  Even though it might be understandable given the financial challenges of raising multiple children,
  such exploitation is unacceptable because it skews the children’s experiences of family at best and
  it is emotionally harmful to the children at worst.</p>

  <p>Comment [BLH1]: Studen t 1: …future readers need a specific date to reference.</p>

  <p>Comment [BLH2]: Studen t 2: I did find it difficult to establish the thesis statement. Increase IVF
  &amp; multiple births, health risks, publicity, family structure, single mother and time dedication
  were all mentioned as part of what I found to be the thesis.</p>

  <p>The first revision change I made was in response to Student 1’s comment, which was a good catch on
  his part. It’s surprising that such a small change as adding a date to an event can contextualize an
  entire argument. In this case, I substituted the actual date of the octuplets’ birth, which makes the
  piece understandable in the future.</p>

  <p>Student 2’s feedback clearly indicated that there was a potential misunderstanding of the thesis,
  or argumentative assertion. This argument opens with an anecdote about a mother of octuplets, which
  doesn’t mean that this mother is necessarily its subject. The assertion appears in the last sentence
  of the opening paragraph, a common place</p>

  <p>From Topic to Presentation for a thesis in a short essay. This essay’s goal is to support the position
  that exploiting multiple children harms them by skewing their experience of family and emotionally harming
  them. Notice that the goal is broader than just Suleman’s case, as indicated by the word “example” in
  the third from the last sentence. In order to further help readers to understand that Suleman isn’t
  the topic, I deleted detailed information about her that might have caused some readers to think the
  argument is all about her. I moved that information to later in the essay when I talk about Suleman
  as an example of an exploitative parent.</p>

  <h3>Fig 3</h3>

  <p>How frequent are In order to understand the problems surrounding multiple births, it is useful to
  consider the general frequency of multiple births.? Because of fertility treatments that were not available
  more than twenty‐five years ago, the rates have increased considerably. In 1980, the number of human
  spontaneous twin births, for example, was only 68,339 out of all the births in the United States that
  year (Fierro, 2008 &amp; n.d.). In 2005, however, the twin birth rate was 133,325, nearly twice the
  number from 25 years previous (NOMOTC, 2009). The increase in multiple births in the past 29 years is
  due in part to fertilization treatments like IVF. 1980 marks a period when fertility methods and procedures
  became more readily available, if still costly. According to Fierro (2008 &amp; n.d.) of About.com,
  the odds for having twins when pregnancy results from fertility treatments have increased nearly 60%
  since 1980. Triplets, which once occurred spontaneously in every 1 of 8,100 births, have increased in
  frequency by 400% since 1980, while quadruplets, which once occurred spontaneously in every 1 of 729,000
  births, also have increased by orders of magnitude. Indeed, she estimates: “that 60% of the triplets
  are the result of fertility enhancing treatments; while 90% of quadruplets … are due to reproductive
  technology” (2008). Although the author noted that these statistics are estimates gathered from several
  sources, the numbers seem reasonable given the increasing popularity of fertilization treatments among
  women in the later period of child‐bearing years.</p>

  <p>Comment [BLH3]: Studen t 3: At times the language seems too colloquial, beginning paragraphs with
  “Ah” or a question, and using phrases such as “the norm.”</p>

  <p>Comment [BLH4]: Studen t 4: I think that the part about the biology of the human towards having multiples
  is informative but too extensive.</p>

  <p>Student 3 found my uses of language to be somewhat informal on various occasions. I didn’t always
  agree with this reader’s advice; for example, there’s nothing wrong with beginning a paragraph with
  a question, but she was right that I was being informal in a way that she wasn’t being taught to be
  informal in most of her college writing.</p>

  <h3>Beth L. Hewett</h3>

  <p>To that end, I eliminated the initial paragraph question and created a sentence that was somewhat
  more precise.</p>

  <p>I had to agree with Student 1’s remark that about.com wasn’t a strong source. I knew that fact when
  I first used the source, and I searched the Internet and the library search engines for something more
  authoritative. I wasn’t able to find a better source, but I think that if I had talked to a librarian
  about these statistics, I probably would have done better. My way of trying to mitigate possible problems
  from using this source was to make sure that I used the available statistics well from the preliminary
  draft onward; the rest of the paragraph demonstrates how I used this source.</p>

  <p>On the whole, this paragraph seems out of place in the sense that it doesn’t directly deal with the
  assertion. To some degree, I think that is what Student 4 was indicating. Yet, the information also
  seems necessary as context. In a longer essay, this paragraph (and even more contextual material) might
  come in a section called “Background.” I thought a lot about the student’s advice; I tried moving this
  material to Fig 4 another place in the argument, and I also tried deleting it altogether. Finally, I
  decided it was needed information and I left it where it was.</p>

  <p>Despite advances in reproductive medicine, however, women’s bodies have not evolved to give birth
  to spontaneous multiples, as evidenced by the rarity of natural multiple births. Thus, both the mothers’
  health and that of the babies are at risk in these pregnancies (Carroll, 2009). Infant early births,
  which are common in multiple births, give rise to dangerously low birth weights along with insufficiently
  developed lungs and other organs. It is not uncommon for such infants to have developmental problems
  and chronic illnesses like cerebral palsy and others that reveal themselves later in life. Pregnant
  mothers of multiples also experience challenges as they may be required to spend months in bed to reduce
  their physical risks and to avoid preterm births. The mother may experience increased risks of gestational
  diabetes, preeclampsia, and the need for a Cesarean section, which carries its own dangers. Implanting
  only two or three fertilized eggs are one medically accepted way to avoid higher levels of multiple
  births particularly among women in their thirties and forties (“Octuplet’s Mom,” 2009). Where more than
  three fetuses are involved, many doctors advocate “selective reduction” of the fetuses so that the living
  ones have more uterine space and nutrition to be carried to full term and to have healthy birth weights.
  Such selection can be a difficult choice dependent on the parents’ moral values. Given the frequency
  of multiple births from IVF and other fertility treatments, beyond these obvious health issues involved,
  we have the responsibility to consider how multiple births potentially affect the children and their
  relationships to their parents and society as a whole.</p>

  <p>Comment [BLH5]: Studen t 1: Provide more specific details.</p>

  <p>Comment [BLH6]: Studen t 4: Connect your ideas.</p>

  <p>Comment [BLH7]: Studen t 5: I do wish that you would have given a statistic to represent the odds
  of that many babies surviving in the womb.</p>

  <p>2009). Where more than three fetuses are involved, many doctors advocate “selective reduction” of
  the fetuses so that the living ones have more uterine space and nutrition to beFrcoamrrieTdoptoicfutoll
  tPerremsenantadtitoonhave healthy birth weights. Such selection can be a difficult choice dependent
  on the parents’ moral values. Given the frequency of multiple births from IVF and other fertility treatments,
  beyond these obvious health issues involved, we have the responsibility to consider how multiple births
  potentially affect the children and their relationships to their parents and society as a whole.</p>

  <p>It certainly is not the norm for a woman to give birth to more than one child at a time. While many
  mammals give birth to litters, humans typically give birth to only one child. Spontaneous multiple human
  births do occasionally occur in nature, just as rarely a cow will birth twin calves or a horse twin
  foals. That is why people delight in seeing twins, whether fraternal or identical. The relative rarity
  of twins may cause typically respectful, yet curious people to become intrusive, asking questions about
  the twins’ sizes, hair and eye coloring, emotional dispositions, personality traits, and even bathroom
  habits. Not only is this intrusion off‐putting, but it also can make the children feel abnormal when
  children usually want nothing more than to be considered normal. Indeed, both the parents and the twins
  themselves experience their lives as more public than parents of singles and their children typically
  do. Naturally, our interest levels increase when triplets and quadruplets are born, and they go sky
  high when higher numbers of multiple birth children arrive. But our interests can be dangerous to the
  emotional well being of the children.</p>

  <p>Comment [BLH7]: Studen t 5: I do wish that you would have given a statistic to represent the odds
  of t6h9at many babies surviving in the womb.</p>

  <p>Comment [BLH8]: Studen t 5: The essay goes on to speculate as to why people pay close attention to
  multiple births, but does not provide evidence that the public actually does pay attention or why this
  is the case.</p>

  <p>These two paragraphs are fairly intimately connected in terms of content, so let’s look at them together.
  I added the information about the challenges of multiple births here and in paragraphs found below to
  satisfy readers like Students 1 and 4, who needed more information and wanted better transitions. Throughout
  the revised essay, I used their advice and added more detailed material wherever it seemed useful. Pointing
  me to the need for strong transitions was especially good advice. When I write early drafts, I don’t
  worry much about transitions because I know that my organization of certain material will change and
  that I’ll insert appropriate transitional later. I like it when students notice that the “glue” that
  holds an essay together is missing.</p>

  <p>Student 5 really wanted some statistics and other evidence of my argument’s main points. I agreed
  that I needed to find more statistical proof to support a point about the unnatural nature of multiple
  births. Doing so would have helped to show why people are so interested in them. This paragraph also
  has background material that I used to get to the heart of my thesis: that there’s disruptiveness about
  multiple birth children’s and parents’ lives. It provides a reason for why</p>

  <p>Beth L. Hewett people respond so intrusively to multiple births. But the feedback is well-taken.
  This material needed authoritative support—not statistics necessarily—but pertinent thoughts about human
  behavior around multiple birth children.</p>

  <p>The final sentence of the second paragraph takes the background information and links it to the assertion.
  Unfortunately, this technique didn’t work for some of my student readers who were already confused about
  the thesis—wrongly believing it was about Suleman alone. I left this sentence intact because I believed
  that the other changes to the essay would make this thesis link more obvious in the presentation draft.</p>

  <p>For those who are curious about methods for arguing an assertion like this one, at the end of this
  second paragraph, I reasoned from the lesser to the greater: if something is true at a smaller number
  (twins, triplets), it also will be true at a higher number (sextuplets, octuplets). I’ll say more about
  such reasoning later in this chapter.</p>

  <p>Although Student 6 believed that opening the next paragraph with the words “an historical example”
  was unnecessary, I thought the idea of history was quite important because I also used two contemporary
  examples. Instead of deleting the sentence as advised, I added material to help make that connection:
  “because it demonstrates that multiple births can be problematic even when they arise from natural causes.”</p>

  <p>It’s helpful to remember that “positive” criticism like that from Student 5 can be useful to writers
  by reinforcing what they are doing well. In this case, the example of the Dionne children is reasoning
  from past fact to future fact: what happened in the past will happen in the future. Some student readers,
  like Student 7, were unconvinced because the situation was a little different in the 1930s. Yet, the
  quintuplets from natural birth were just as much a curiosity in the 1930s as octuplets or sextuplets
  from IVF birth are in the twenty-first century. Additionally, the financial issues that the Dionne parents
  experienced are similar to the two main cases I cited. Finally, the “zoo” atmosphere of the Dionne quintuplets
  certainly can be compared to the television screen that gives the world a peek into the Gosselin sextuplets
  (discussed later in the essay) and the Suleman octuplets. For these reasons, I left the historical example
  intact and developed it even more.</p>

  <p>In the second paragraph of this set, I restated the assertion. This paragraph and the following one
  directly support the thesis, which, as you recall, isn’t about Suleman, but about the potential exploitation</p>

  <p>From Topic to Presentation of all multiple birth children. These causes of death for the Dionne adults
  are suggestive evidence of the health problems I noted earlier in the essay about multiple birth children,
  for example.</p>

  <p>This third paragraph particularly makes a transition from the past to the present. I made changes
  to address level of formality appropriate to what my students also were writing. But I also added material</p>

  <p>Fig 5</p>

  <p>An historical example will be useful here because it demonstrates that multiple births can be problematic
  even when they arise from natural causes. In 1934, in a small farming town in Ontario, Canada, quintuplet
  daughters were born to Olivia and Elzire Dionne, who already had six children and were economically
  quite poor. The world was fascinated and, even as the astounded parents began to absorb the shock of
  having five babies who each weighed less than 2 pounds at birth, their family doctor moved in, created
  a nursery out of the first floor of the family’s farmhouse, and barred the parents from even holding
  their children (Kehoe, 1998). In short order, the parents were deprived of custody of the little girls,
  in part because the unlucky father had contracted to move the children to Chicago as an exhibit for
  the Chicago Century of Progress Exposition, which was a small world’s fair. The Ontario government intervened
  and suspended the parents’ parental rights, stating: “’The lives of children are a bigger concern in
  Canada than profits of an exploitation or promotional undertaking.’” Ironically, they the government
  proceeded to build a small theme park, Quintland, around the children across from the family farmhouse.
  Between 1935 and 1943, they were exhibited “two to three shows a day, seven days a week” and were viewed
  as they played by “more than three million people”; as many as “6000 people a day” walked through their
