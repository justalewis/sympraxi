  <p>Print or Textual Analysis: What You Read</p>

  <p>16</p>

  <h3>CHAPTER OUTLINE</h3>

  <p>16.1 An Author’s Choices: What Text Says and How It Says It 16.2 Textual Analysis Trailblazer: bell
  hooks 16.3 Glance at Genre: Print or Textual Analysis 16.4 Annotated Student Sample: "Artists at Work"
  by Gwyn Garrison 16.5 Writing Process: Thinking Critically About Text 16.6 Editing Focus: Literary Works
  Live in the Present 16.7 Evaluation: Self-Directed Assessment 16.8 Spotlight on … Humanities 16.9 Portfolio:
  The Academic and the Personal</p>

  <p>INTRODUCTION In the real world, you are surrounded by text—both visual and print. It appears in media,
  advertising, and even text messages. Often, text is not one-dimensional, in the sense that words and
  the ways in which they are used or arranged can have different meanings depending on the relationship
  between the text and the reader. In such cases, a text is open to analysis and interpretation. Usually,
  there is no one right way to analyze and interpret a text; readers, like viewers, may understand elements
  in different ways and draw different conclusions. Whatever they are, however, will be the result of
  reading critically: examining parts of the text as they relate to the whole, supporting ideas with evidence,
  and drawing conclusions on the basis of analysis.</p>

  <p>The practice of analysis will benefit you in several ways. It can help you enter an ongoing conversation
  with a new and fresh perspective. It also can help you understand meaning beyond the surface of a text—including
  historical contexts and cultures, new approaches to thinking, and new knowledge.</p>

  <p>Although the word text tends to imply words, writing, or books, virtually all works created by human
  beings can be considered texts that are open to analysis—films, plays, music and dance performances,
  exhibits, paintings, photographs, sculptures, advertisements, artifacts, buildings, and even whole cultures.
  In this chapter, you will focus on the analysis of print texts. In Image Analysis: What You See, you
  will move to the analysis of visual and digital texts.</p>

  <p>16.1 An Author’s Choices: What Text Says and How It Says It</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Define textual analysis and explain its place
  in academic and real-world contexts. • Identify the components of textual analysis and compare it to
  rhetorical analysis. • Demonstrate critical thinking and communicating in various rhetorical contexts.</p>

  <p>You may already be familiar with what is called textual analysis in academia. In fact, you do it
  frequently when you read or interact in other ways with language. It is important, though, to distinguish
  between what textual analysis is and what it is not. For example, imagine you and a friend have just
  finished watching a TV show or movie. You’ll probably say whether you liked it and what in particular
  prompted your opinion. This brief and casual opinion-based conversation is just that, a casual conversation.
  It is not analysis, which goes far beyond liking or disliking a text. Perhaps you continue your conversation.
  Do you and your friend agree that everything in the show is obvious and clear or is inconsistent and
  muddy—characters’ motivations, their development over the course of the story, how the setting affects
  the story, the point the story is making, the extent to which the characters seem realistic or relatable,
  whether the dialogue seems natural, or any other elements? Or do you and your friend view some of these
  elements differently? Do you have different views about what you think is the main idea or what a character
  represents? For instance, do you think the main character represents a force of good, while your friend
  thinks the main character is a boring wimp? If you agreed on everything—and everything seems straightforward—then
  that’s that: the film offers little to interpret and most likely is not a strong text for analysis because
  it doesn’t invite interpretation. However, if you do have questions about some of the elements or disagree
  about them, then you are on your way to analyzing and interpreting a text.</p>

  <h3>Analyzing and Interpreting</h3>

  <p>What exactly, then, is textual analysis? To analyze a text is to examine its various parts to explain
  its meaning. Analyzing a text implies that the text can be read in more than one way. Your analysis
  is your reading of it: your explanation of various text elements, your understanding of the text, and
  how you understand it in a larger context. Others may read and understand it differently. To find out
  what a text—fiction or nonfiction—means, you look at its language, examine how it is put together, perhaps
  compare or contrast it with similar texts or other works, and notice how it affects you or how it fits
  into events outside it, and you keep asking why. Always keep in mind, however, that a textual analysis
  is not about whether you like a text; it is about the meaning of the text—how the author created it
  and intended it to be understood.</p>

  <p>Any written work can be analyzed as a text. But an editorial or opinion piece or something written,
  for example, as part of an ongoing argument of viewpoints is more likely to be looked at for the rhetorical
  or persuasive strategies it employs to create or change an opinion. (This kind of rhetorical analysis
  is the focus of</p>

  <p>Rhetorical Analysis: Interpreting the Art of Rhetoric.) Literary works, whether fiction or nonfiction,
  film or text, print or digital, are those analyzed as texts. Their impact on real events in real life
  is likely less direct than that of rhetorical, or persuasive, writing, but many characters and themes
  that “live” in these works tend to exist for a very long time and are open to analysis as part of a
  person’s growth and education—and even more, a part of and a reflection of the human condition.</p>

  <p>Writers have many options when considering what to say and how to say it. The best texts for analysis
  are those that are most problematic—texts whose meanings seem elusive or complex—because these texts
  give you the most room to argue for one meaning over another. Like your goal in rhetorical analysis,
  your goal in textual analysis is to make the best possible case to demonstrate to readers that your
  analysis is reasonable and deserves serious attention. Remember, too, that argument in academic terms
  means taking a position and supporting it. Therefore, when you analyze a text, you take a position on
  an aspect (or several aspects) of that text and support it with evidence from the text itself and, if
  applicable, from borrowed sources, which you acknowledge.</p>

  <p>Textual analysis is a complex task that draws on your critical reading, reasoning, and writing skills.
  Depending on your topic and thesis, you may have to describe real or fictional people and situations,
  retell events, define key terms, analyze passages and explain how they work in relation to the whole,
  and examine and interpret contexts and themes—perhaps by comparing or contrasting the text with other
  texts. Finally, you will “argue” for the meaning as you understand it, rather than another possible
  meaning. In other words, as you do for most academic writing, you develop a thesis and defend it with
  sound reasoning and convincing textual evidence.</p>

  <h2>Textual Analysis Trailblazer: bell hooks</h2>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Demonstrate critical thinking and communicating
  in varying rhetorical and cultural contexts. • Integrate the writer’s ideas with ideas of others.</p>

  <p>“Writing and performing should deepen the meaning of words, should illuminate, transfix, and transform.”</p>

  <h3>Talking Back</h3>

  <p>Born Gloria Jean Watkins, bell hooks adopted the name of her great-grandmother, a woman known for
  speaking her mind. In choosing this pen name, hooks decided not to capitalize the first letters so that
  audiences would focus on her work rather than her name. However, this stylistic choice has become as
  memorable as her work.</p>

  <p>She is well known for her approach to social critique through textual analysis. The writing interests
  and research methods hooks uses are wide ranging. They began in poetry and fiction writing and eventually
  developed into critical analysis. She started writing at an early age, as her teachers (in the church)
  impressed on hooks the power in language. With this exposure to language, hooks began to understand
  the “sacredness of words” and began to write poetry and fiction. Over time, hooks’s writing became more
  focused on advancing and reviving the texts of Black women and women of color, for even though “black
  women and women of color are publishing more… there is still not enough” writing by and about them.
  Texts live on through others’ analyses, hooks argues. Therefore, she believes the critical essay “is
  the most useful form for the expression” between her thoughts and the books she is reading. The critical
  essay allows hooks to create a dialogue, or “talk back” to the text. The critical essay also extends
  “the conversations I have with other critical thinkers.” It is this “talking back” that has advanced
  hooks’s approach to literary criticism. This action, for which hooks eventually named a volume of essays,
  refers to the development of a strong sense of self that allows Black women to speak out against racism
  and sexism.</p>

  <p>Although young hooks continued to write poetry—some of which was published—she gained a reputation
  as a writer of critical essays about systems of domination. She began writing her first book, Ain’t
  I a Woman: Black Women and Feminism, when she was 19 and an undergraduate student at Stanford University.
  The book is titled after Sojourner Truth’s (1797–1883) “Ain’t I a Woman” speech (https://openstax.org/r/Aint-I-a-Woman)
  given at the Woman’s Rights Convention in Akron, Ohio, in 1851. In this work, hooks examines the effects
  of racism and sexism on Black women, the civil rights movement, and feminist movements from suffrage
  to the 1970s. By “talking back” to formerly enslaved abolitionist Sojourner Truth throughout, hooks
  identifies ways in which feminist movements have failed to focus on Black women and women of color.
  This work is one of many in which thorough analysis “uncovered” the lived experiences of Black women
  and women of color.</p>

  <h3>Discussion Questions</h3>

  <p>1. What are your thoughts about hooks’s approach to analysis through “talking back” to a text? What
  might this approach look like in an essay or text: how might you “talk back”?</p>

  <p>2. What purpose does hooks’s approach to entering into conversation with other critical thinkers
  through critical analysis serve?</p>

  <p>3. Much of hooks’s work is based on her goal of “reviving” and “uncovering” historically marginalized
  women’s voices. In what ways does critical analysis highlight the work of others?</p>

  <p>16.3 Glance at Genre: Print or Textual Analysis</p>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Define key terms and organizational patterns of textual analysis. • Explain how genre conventions
  are shaped by purpose, culture, and expectation. As a genre—or literary category in which works feature
  similar forms, styles, or subject matter—textual analysis is less of a genre in itself and more of an
  exploration and interpretation of other genres. That is, textual analysis is explanatory and interpretive.
  When you receive an assignment to analyze a text, you focus on the elements that give it meaning. Usually
  your instructor will assign a specific writing task: to analyze and explain certain aspects of a text,
  to compare or contrast certain elements within a single text or in two or more texts, or to relate certain
  text elements to historical context or current events (as student writer Gwyn Garrison has done in the
  Annotated Student Sample). These writing tasks thus explore genre characteristics of fiction, drama,
  poetry, literary nonfiction, film, and other forms of literary language.</li></ul>

  <p>When you write a textual analysis, ask yourself questions such as these: • In what ways can this
  text be read? • What are some different ways of reading it? • Which reading makes the most sense to
  me? • Which passages in the text support this reading? • Whom does my analysis need to convince? (Who
  is my audience?)</p>

  <h3>Textual Analysis and Interpretive Communities</h3>

  <p>How you read and analyze a text depends on who you are. Who you are depends on the influences that
  have shaped you, or the communities to which you belong. Everyone belongs to various communities: families,
  social and economic groups (e.g., students or teachers, middle or working class), organizations (e.g.,
  Democratic or Republican Party, Masons, Habitat for Humanity), geographic locales (e.g., rural or urban,
  north or south), and institutions (e.g., school, church, fraternity). Your membership in one or more
  communities may determine how you view and respond to the world. The communities that influence you
  most are called interpretive communities; they influence the meaning you make of the world. People who
  belong to the same community may well have similar assumptions and therefore are likely to analyze texts
  in similar ways. Before writing an interpretive or textual analysis essay, it is helpful to ask, Who
  am I when writing this piece? Be aware of your age, gender, race, ethnic identity, economic class, geographic
  location, educational level, or political or religious persuasion. Ask to what extent and for what purpose
  any of these identities emerges in your writing. Readers will examine the biases you may bring to your
  work, understanding that everyone views the world—and, consequently, texts—from their own vantage point.
  College is, of course, a large interpretive community. The various smaller communities that exist within
  it are called disciplines: English, history, biology, business, art, and so on. Established ways of
  interpreting texts exist within disciplines. Often when you write a textual analysis, you will do so
  from the perspective of a traditional academic interpretive community or from the perspective of one
  who challenges that community. Whether you deliberately identify yourself and any biases you might bring
  with you in your essay depends on the assignment you are given. Some assignments ask you to remove your
  personal perspective as much as possible from your writing, others ask that you acknowledge and explain
  it, and others fall somewhere in between.</p>

  <p>at Mason Neck State Park” by Virginia State Parks/Wikimedia Commons, CC BY 2.0)</p>

  <h3>Conventions of Textual Analysis</h3>

  <p>When asked to analyze or interpret a literary work, whether fiction or nonfiction, you will likely
  focus on some of these literary elements to explain how an author uses them to make meaning.</p>

  <ul><li>Alliteration: literary device consisting of repetition of initial consonant sounds. (“Away from
  the steamy sidewalk, the children sat in a circle.”)</li><li>Analysis: close examination and explanation
  of a text, supported by reasoning and evidence. • Antagonist: character or force opposing the main character
  (protagonist) in a story. • Climax: moment of emotional or intellectual intensity or a point in the
  plot when one opposing force overcomes another and the conflict is resolved. • Epiphany: flash of intuitive
  understanding by the narrator or a character in a story. • Figurative language: language that suggests
  special meanings or effects. Similes and metaphors are examples of figurative, rather than literal,
  language. (“She stands like a tree, solid and rooted.”) • Imagery: language that appeals to one (or
  more) of the five senses. (“The cicadas hummed nonstop all day, but never loud enough to dull the roar
  of the leaf blowers.) • Metaphor: direct comparison between two unlike things. (“She is a sly fox in
  her undercover work for the government.”) • Narrator: someone who tells a story. A character narrator
  is a part of the story, whereas an omniscient narrator tells a story about others. • Persona: mask to
  disguise or cover the author’s real self when presenting a story or other literary work. • Plot: sequence
  of events in a story or play. • Point of view: vantage point from which a story or event is perceived
  and told. The most frequently used points of view are first person and third person. In first person,
  the narrator is a character or observer in the story (fiction) or the author of it (nonfiction). In
  third person, the narrator has no part in the story other than telling it. • Protagonist: main character
  or hero in a story. • Rhyme: repetition of sounds, usually at the ends of lines in poems, but also occurring
  at other intervals in a line. • Rhythm: rise and fall of stressed sounds within sentences, paragraphs,
  and stanzas. • Simile: indirect comparison of unlike things using the word as or like. (“When he does
  undercover work, he is as sly as a fox.”) • Symbol: object that represents itself and something else
  at the same time. A red rose is both a rose of a certain color and the suggestion of something romantic.
  • Theme: meaning or thesis of a literary text.</li></ul>

  <p>16.4 Annotated Student Sample: "Artists at Work" by Gwyn Garrison</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Demonstrate understanding of how conventions are
  shaped by purpose, language, culture, and expectation. • Demonstrate critical thinking and communicating
  in varying rhetorical and cultural contexts. • Make connections between ideas and patterns of organization.
  • Evaluate literary elements and strategies used in textual analysis.</p>

  <h3>Introduction</h3>

  <p>Student Gwyn Garrison wrote this textual analysis for a first-year composition class. In the essay,
  Garrison extends her analysis beyond the texts to discuss outside events and real individuals, making
  connections among them.</p>

  <p>LIVING BY THEIR OWN WORDS</p>

  <h3>The Power of Language</h3>

  <p>Language is the medium through which the communication of ideas takes place. One of language’s many
  attributes is its ability both to reflect and to shape social attitudes. Language has the power to perpetuate
  oppression when dominant social groups choose the ways in which rebellious behavior is described. Thus,
  people in power historically have used language as propaganda to perpetuate the ideas that they want
  to reiterate. For example, if a woman in modern society is described as ladylike, the message is that
  she conforms to traditional gender expectations of politeness, modesty, and deference. However, if a
  woman is called a whore, the message is that the woman does not conform to these traditional gender
  standards. In recent years, oppressed social groups have learned that they can reclaim the language
  of the oppressor by redefining such words and their connotations.</p>

  <p>Gwyn Garrison uses reaction—reflection or thinking—to introduce the “big idea” of the thesis: language
  has the power to shape cultural and social attitudes.</p>

  <p>American authors such as Kate Chopin and Shirley Jackson, sociopolitical activists such as Hillary
  Clinton and Chrissy Teigen, and California rape survivor Chanel Miller— artists/writers in their own
  ways—take on this essential work of reclaiming language on behalf of all women. This confiscation of
  the tools of the oppressor is an essential step toward building a society in which women may be free
  to be who they are. Negative stereotypical labeling no longer has the effect of disempowering women
  because language can be reclaimed from the oppressor as a form of empowerment.</p>

  <p>Garrison’s thesis statement highlights her analytical approach. She makes a connection between women’s
  rights and a series of texts by significant women.</p>

  <p>Writers can use the short story form to shift perception away from the lens of the status quo and
  focus perception in a new way. In Kate Chopin’s 1898 short story “The Storm” (text follows this discussion),
  protagonist Calixta engages in a passionate extramarital affair with an old friend, Alcée. Readers may
  argue that Calixta’s actions should be labeled as immoral by both societal and religious standards because
  she breaks the social and religious contract defined by her marriage vows. Yet every other action of
  Calixta’s complies with traditional gender roles: she is a wife, mother, and caretaker. In some ways,
  committing this one social transgression seems completely out of character when she meets traditional
  gender expectations in all other areas of her life.</p>

  <p>Garrison provides publication information as well as a brief plot summary and context for the story.
  You can read “The Storm” in its entirety at the end of this feature.</p>

  <p>When Calixta acts outside of societal norms, however, she discovers the freedom of self-expression
  and passion.</p>

  <p>This transitional topic sentence supports the overall thesis while also identifying what the paragraph
  will be about.</p>

  <p>All parts of her womanhood that have no place in the society in which she lives have been repressed
  until this one moment. In this scene, Chopin takes possession of the term whore and redefines Calixta’s
  behavior as a transformative awakening.</p>

  <p>This explanation makes a reference to the language of the text and explains the significance of the
  scene as it relates to the entire story and to Garrison’s thesis.</p>

  <p>Chopin’s diction evokes a spiritual transcendence that allows Calixta to live momentarily outside
  social norms present only in the physical plane of existence: “when he possessed her, they seemed to
  swoon together at the very borderland of life’s mystery.”</p>

  <p>Here, Garrison correctly cites textual evidence—an example of the protagonist’s diction— to support
  her reasoning.</p>

  <p>The affair becomes a vehicle that allows Calixta to get to a place of true self-expression. The storm,
  an aspect of nature or the natural world, acts as the catalyst in Calixta’s natural self-realization
  of womanhood. As the storm breaks externally, it also breaks internally for Calixta. Chopin’s depiction
  of Calixta’s sexual liberation and fulfillment outside of her marriage is an early step in the fight
  to bridge the gap between women’s bodies and their sociopolitical lives. By presenting female sexuality
  in a way that is enlightening rather than degrading, Chopin helps destigmatize labels such as whore,
  which have been used to shame women for acting outside of traditional gender expectations.</p>

  <p>Garrison further elaborates on the significance of the textual evidence and connects it to the topic
  sentence and thesis. In this case, it is the storm—an element of both plot and setting as well as a
  symbol.</p>

  <p>In Shirley Jackson’s novel We Have Always Lived in the Castle, Merricat and her sister Constance
  are rumored to be witches who, according to village gossip, eat children. The label of witch has long
  been a device to oppress women who do not conform to traditional gender roles. In Salem, Massachusetts,
  during the 17thcentury witch trials, women who could read or write, who refused marriage, or who practiced
  alternative religions often were labeled as witches and burned to death.</p>

  <p>Introducing a second text for comparison, Garrison revisits the idea of language reclamation introduced
  earlier.</p>

  <p>In Jackson’s novel, Merricat embraces the notion of being labeled a witch. In fact, she facilitates
  the rumors by burying talismans, identifying magical words, and talking to her cat, Jonas. In contrast
  to the witch trials, Merricat burns her own house to rid it of her male cousin. And she survives the
  fire, purging herself and her sister of the family’s patriarchal tendencies. By claiming the role of
  witch, Merricat insulates herself and her sister from their patriarchal family and society. In the end,
  Merricat creates a space where she and Constance can live together in a woman-centered territory outside
  the reach of the villagers.</p>

  <p>Focusing on language and its implications, Garrison discusses the use of witch, a label the character
  is happy to embrace as a means of asserting her womanhood.</p>

  <p>With this story, Jackson does the important work of reclaiming the word witch, stripping it of its
  oppressive power and redefining it for womankind.</p>

  <p>In the section that follows, Garrison moves outside literary texts and extends her analysis to language
  use in contemporary political situations, thus connecting literature with reality. Notice that Garrison
  has used the literary present tense in discussing both Chopin’s and Jackson’s fiction. She switches
  and uses mostly past tense now in discussing nonliterary events.</p>

  <p>Similarly, in a more recent political climate, former U.S. president Donald Trump employed stereotypical
  derogatory language against women whom he considered dissenters. He used phrases like “such a nasty
  woman” (Ali) to describe former Secretary of State Hillary Clinton and “filthy mouthed wife” (@realDonaldTrump)
  to describe model Chrissy Teigen to try to shame women with social influence into submission. It is
  noteworthy, too, that he describes Teigen by her role in relation to a man rather than by her name,
  which would indicate her individuality. Both Clinton and Teigen, along with millions of women around
  the world, have worked to empower women by redefining such language. Almost immediately following the
  accusation of “such a nasty woman,” women and girls around the country donned t-shirts and ball caps
  with the phrase, showing their pride in being “nasty” (Ali). In this context, the term came to describe
  women who speak truth to power. Although Teigen acknowledges that she had previously been blocked by
  Trump for trolling him, she shot back defiantly at him with a tweet that read in part: “lol what p—
  a— b—” (@chrissyteigen). Shortly thereafter, the phrase was trending as a Twitter hashtag (Butler).
  In this instance, people, particularly women, appreciated Teigen’s ability to respond to female shaming
  with language that Trump himself was recorded using and that is also traditionally used to shame and
  degrade women. This time, however, it was directed toward a powerful man. This reclamation of power
  through language is one step women have taken to revise the social gender narrative for a modern context.</p>

  <p>Again, Garrison introduces texts for comparison, bringing her argument regarding the reclamation
  of language into the modern day.</p>

  <p>After four years of being known as “the girl raped by Stanford swimmer Brock Turner,” sexual assault
  survivor Chanel Miller has reclaimed the narrative of her story with the publication of her memoir Know
  My Name. After a Stanford University fraternity party in January 2015, Turner assaulted (with intent
  to rape) an intoxicated and unconscious Miller behind a dumpster at approximately 1:00 a.m. Some passing
  students interrupted the act, and Turner was taken by the police after the students restrained him.
  He was later brought to trial and found guilty. The sympathetic male judge sentenced Turner to only
  six months in county jail, from which he was released after three months for good behavior. When speaking
  on television to 60 Minutes on September 22, 2019, Miller expressed outrage that media coverage during
  the trial had focused not on what Miller had already lost but on what Turner had to lose if found guilty—his
  education, his swimming career, his Olympic prospects (Miller). Because Miller remained anonymous during
  the trial, the media and Turner’s lawyers controlled how she was perceived to the world—as a girl who
  got drunk and put herself into a compromising situation.</p>

  <p>Garrison emphasizes the role of language in Miller’s telling her story and ceasing to feel ashamed.</p>

  <p>This male-centric characterization of events left Miller feeling ashamed and disempowered. By writing
  her book and reclaiming her story, Miller took a vital step in healing and trauma management, emphasizing
  that she now controls the language of her narrative. She is not a girl who deserves what she got, as
  some would argue. Miller readily acknowledges she deserved a hangover for her actions, but never a rape.</p>

  <p>Notice the switching of tenses to indicate events in the past and present. Notice, too, that Garrison
  returns to the literary present tense in the paragraph that follows.</p>

  <p>Miller’s story is all too common in the college partying scene, and the regularity of such attacks
  contributes to the perpetuation of an environment in which women are made to feel responsible for being
  attacked and men are free to act as they choose. The awareness of Miller’s story and, more importantly,
  her published story, reframe the narrative around rape culture so that the victims are not further victimized,
  as women work to educate men so that these attacks stop.</p>

  <p>Garrison introduces a final contemporary text for comparison. By citing multiple texts across time,
  Garrison strengthens her argument.</p>

  <p>Artists and writers such as Chopin, Jackson, Clinton, Teigen, and Miller engage in the gritty work
  of social reform that cannot be achieved through any other medium because culture cannot change unless
  the language in which people talk about the culture changes. This socially reformed reality is conceived
  only from the creativity of intelligent minds that are able both to envision and then to describe the
  world as it is yet to exist. In this way, artists who work with the medium of language become the prophets.</p>

  <p>This conclusion looks to the future, which is a productive rhetorical or persuasive technique to
  give the audience an idea about what they can take away from this project.</p>

