  <h3>Process Descriptions</h3>

  <p>Begin your description by introducing the process, your purpose, and scope. Describe the overall
  process and provide necessary definitions. State your purpose and the scope of your description. Does
  your description provide a basic outline of a process for readers who have an interest? Is your description
  here to help readers carry out a process with all the details needed? Does your description cover only
  major steps of a process, or does it also cover less important and miscellaneous details?</p>

  <p>Provide an overview of the steps of the process. The overview lays out the steps in chronological
  order. It can serve as a map of the upcoming content.</p>

  <p>Walk your readers through the process step-by-step. For each step, define its purpose, explain its
  context, and provide appropriate details. Often a step consists of sub-steps. Provide a clear hierarchy
  of steps to guide readers through the process.</p>

  <p>Conclude your description by signaling the completion of the process and summarizing the steps of
  the process.</p>

