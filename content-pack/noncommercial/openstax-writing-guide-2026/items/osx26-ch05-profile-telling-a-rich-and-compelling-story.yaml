  is another example in which Byrd broke a longer sentence apart and polished the wording. Only when Original:
  It was not until I took a breath and began looking around was I able to see Toad Frog Valley for what
  the store Original: it was. Every blank wall space featured posters, equally sporting Oscar winners
  and underground art-house films. This sentence provides a solid example of revising a “there were” or
  “there are” sentence construction; the original read: There were posters on every blank wall space,
  not just of each year’s Oscar winner, but underground art-house films as well.</p>

  <p>The endcaps of each standalone shelf were filled with top picks, recent releases, or staff choices.</p>

