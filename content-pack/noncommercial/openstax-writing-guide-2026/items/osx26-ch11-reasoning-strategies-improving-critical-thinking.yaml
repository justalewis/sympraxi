  <p>Reasoning Strategies: Improving Critical Thinking</p>

  <p>11</p>

  <h3>CHAPTER OUTLINE</h3>

  <p>11.1 Developing Your Sense of Logic 11.2 Reasoning Trailblazer: Paul D. N. Hebert 11.3 Glance at
  Genre: Reasoning Strategies and Signal Words 11.4 Annotated Sample Reading: from Book VII of The Republic
  by Plato 11.5 Writing Process: Reasoning Supported by Evidence</p>

  <p>INTRODUCTION The ways in which you approach and discuss debatable topics incorporate critical thinking,
  critical reading, and critical writing. The reasoning strategies discussed in this chapter reflect the
  patterns people use to think critically and the structures with which writers and speakers commonly
  build their arguments. These strategies are also the ones you will use in most of your college writing
  projects, including your assignments for Position Argument: Practicing the Art of Rhetoric and Argumentative
  Research: Enhancing the Art of Rhetoric with Evidence. Each strategy is a building block of logic; that
  is, each is built on a pattern of thought, which you use out of the classroom as well. For instance,
  you might approach a text or reallife situation in some of the following ways:</p>

  <ul><li>Explain it in terms of something unrelated but more familiar. • Compare or contrast it with
  other texts or situations. • Group it in a category with similar texts or situations. • Consider it
  as a problem that needs to be solved.</li><li>Examine the reasons something happens or what happens
  as a result. • Explain what the text or situation means to you.</li></ul>

  <p>These thought patterns exemplify active critical thinking, which translates into critical writing.
  In other words, writing patterns reflect thinking patterns. By applying these reasoning patterns appropriately
  and effectively, you will be able to incorporate the evidence you need to support a thesis and persuade
  readers of the validity of your argument. Remember, too, that these are skills, and like other skills,
  the more you practice, the better you will get at using them effectively. (You can read more about argument
  and logic in Rhetorical Analysis: Interpreting the Art of Rhetoric.)</p>

  <h2>LEARNING OUTCOMES</h2>

  <p>By the end of this section, you will be able to: • Identify key rhetorical concepts and thought patterns
  in a variety of texts. • Explain how patterns of thought function for different audiences, purposes,
  and situations.</p>

  <p>For the purposes of this course, logic means “reasoning based on thought and evidence.” In practical
  terms, logic is the ability to analyze and evaluate persuasive or argument writing for effectiveness.
  By extension, it also means that you can learn to use logic in your own argumentative writing. Like
  any other new skill, you are likely to learn best when you have a starting point. Here are some suggestions
  for how to begin thinking and writing logically:</p>

  <ul><li>Approach a topic with an open mind. • Consider what you already know about the topic. • Consider
  what you want to know about the topic. • Find credible information about the topic. • Base your judgments
  of the topic on sound reasoning and evidence.</li></ul>

  <p>Once you have formed your opinions on a particular debatable subject, you must decide on the best
  way to organize them to share with others. Developing your skills in six widely used reasoning strategies,
  or patterns for thinking and writing, can help you determine the most logical and effective means of
  organizing information to make your points.</p>

  <p>In this chapter, you will examine these six reasoning strategies—analogy, cause and effect, classification
  and division, comparison and contrast, problem and solution, and definition—that are often used in college
  classes. In addition, you will consider how writers’ personal views, cultural backgrounds, and purposes
  for writing help determine</p>

  <ul><li>which reasoning strategy suits their needs; and • what they decide to include in their writing.</li></ul>

  <p>As you progress in your college classes and beyond, you will find these reasoning strategies used
  in all genres of writing, both nonfiction (e.g., textbooks, how-to books) and fiction (e.g., novels,
  short stories). Understanding how these strategies work can help you recognize their common formats
  and analyze what you read; likewise, as a writer, understanding how these strategies work to reflect
  your thinking can help you determine the strategy you need to use.</p>

  <h3>Analogy</h3>

  <p>Writers frequently use analogy as a strategy to compare two unlike subjects—one subject is familiar
  to readers, whereas the other is not. To explain or clarify the unfamiliar subject, the writer emphasizes
  the way or ways in which the two subjects are similar, even though they are dissimilar and unrelated
  in all other ways. Analogies are basically long forms of similes (short comparisons of unlike elements,
  based on the word like or as) or metaphors (short comparisons without signal words). In the example
  paragraph, the writer explains unfamiliar aspects of the COVID-19 pandemic by comparing it with the
  more familiar concept of a robbery spree. Model Paragraph</p>

  <p>Examining COVID-19 is like examining a robbery case in this way: both require a great deal of investigation.
  Those investigating the causes behind the pandemic look for the history of how the virus spread, and
  those investigating a crime look for the backstory that might connect the victims and criminals. In
  addition, the two groups of investigators look at the reasons behind the focus of their study. Medical
  investigators look at why the virus spread throughout the world; police investigators look at why the
  crime spree took place in a particular area. Also, both types of investigators are trying to stop whatever
  or whoever is the focus of their investigation. Medical investigators want to stop the virus; police
  investigators want to stop the crimes.</p>

  <h3>Cause and Effect</h3>

  <p>Cause-and-effect writing identifies and examines the reasons (causes) for and consequences (effects)
  of an action, event, or idea. Cause-and-effect writing often answers the question “Why?” and helps readers
  understand the connections between what happens because of—or as a result of—something else. Model Paragraph</p>

  <p>Ray’s grocery, Artie’s Hardware store, and Cradle and Teen department store all went out of business
  because a well-known superstore opened in Springdale. Customers who frequented Ray’s, an establishment
  that had been run by the same family for four generations, used to drive many miles to take advantage
  of the high quality of items in the meat and deli departments. After the opening of the superstore,
  however, those same customers found they could get similar items at a savings, even if the quality was
  not as high as the products at Ray’s. Customers at Artie’s Hardware often talked with owner Artie Shoeman
  about their hardware needs, but the store did not offer the same variety of items they could find in
  the superstore. The same was true for those who shopped at Cradle and Teen. The superstore featured
  lower prices and more variety, even if the items did not match the quality of the items at Cradle and
  Teen.</p>

  <h3>Classification and Division</h3>

  <p>Classification and division are actually two closely related strategies, generally discussed together
  because of their similarity. When using the strategy of division, the writer identifies a single subject
  or group and explains categories within that subject or group. In other words, the writer divides the
  larger unit into component parts. When using the strategy of classification, writers do the opposite.
  They group various elements and place them into larger, more comprehensive categories rather than divide
  the whole into parts. In general, the reasoning strategy of classification and division looks at smaller
  elements as parts of a larger element and thus helps readers understand a general concept and the elements
  that it comprises.</p>

  <h3>Model Paragraphs</h3>

  <p>Extra material in the textbook can be divided into photographs, quotations, and tables. The photographs
  were all taken by the author and focus on various parts of the life cycle of the plants highlighted
  in the chapter. In addition, to add color and more information about the subject matter of each chapter,
  the author has inserted sidebar quotations from both famous and non-famous people. The tables the author
  has included help readers see more details about the progression of the plants’ spread across the country.</p>

  <p>After three months of training, the young dogs were placed into three categories: those who would
  go directly to permanent homes, those who would repeat the course, and those who would advance to the
  next level. The dogs that would be homed immediately were those who were far too social or far too active
  to be service dogs. The dogs that would repeat the course had possibilities as service dogs but needed
  more discipline and instruction. Their futures were yet to be decided. Those that advanced to the next
  level were obedient and focused and learned quickly. They displayed great promise as service dogs.</p>

  <h3>Comparison and Contrast</h3>

  <p>Compare and contrast, one of the most frequently used reasoning strategies, analyzes two (sometimes
  more) subjects, examining the similarities (comparisons) and differences (contrasts) between them. Nearly
  everything you can think of can be a subject for comparison and contrast: objects, people, concepts,
  places, movies, literature, and styles, to name a few. To elaborate on the separate points, writers
  provide details about each element being compared or contrasted. Comparison and contrast helps readers
  analyze and evaluate subjects.</p>

  <p>This strategy is helpful when the similarities or differences are not obvious and when a significant
  common thread exists between the subjects. For example, a contrast between an expensive, elegant restaurant
  and a fast-food restaurant would be useless because the differences are clearly obvious, despite the
  common thread—both are restaurants. However, not so obvious might be some similarities.</p>

  <p>When subjects have no common thread or have obvious shared characteristics, any comparison or contrast
  makes little sense—like contrasting a fish and a shoe (no common thread) or comparing two fast-food
  restaurants (obvious similarities). However, a writer actually might find a common thread between a
  fish and a shoe (perhaps shine or texture or color), and a valid topic of contrast might be differences
  between the two fast-food restaurants.</p>

  <h3>Model Paragraph</h3>

  <p>Although they seem different on the surface, one way in which Romantic-period poetry and 1980s rap
  music are alike is the desire the writers had to create a new approach to their art. They wanted to
  represent simpler values that were more connected to the natural world, values to which a general audience
  could relate. For example, in William Wordsworth’s “Daffodils,” the speaker can escape the depressing,
  industrialized urban world to find peace in nature by contemplating a field of flowers. Similarly, in
  the Sugarhill Gang’s 1979 “Rapper’s Delight,” the band sings of how their beats can lift spirits and
  cause listeners to dance and forget their woes. However, Romantic-period poetry and 1980s rap music
  are different in the delivery style and form of the art; “Rapper’s Delight” is set to music, which is
  an integral part of the piece, but “Daffodils” is not.</p>

  <h3>Problem and Solution</h3>

  <p>When using this reasoning strategy, writers introduce a predicament or challenging issue (the problem)
  and offer information about what was done or what should be done to remedy the predicament or issue
  (the solution). Problem-and-solution writing helps readers understand the complexities of some predicaments
  and the actions that can improve or eliminate them. Model Paragraph</p>

  <p>The issue of combating the spread of hate speech and misinformation on social media can be addressed
  if more social media providers improve their monitoring services. Aside from creating more algorithms
  that search for linked key words and phrases, social media providers should increase the number of professional
  monitors conducting active searches. Additionally, while many platforms such as Twitter and Facebook
  respond within a few days to reports of posts that violate their policies, more monitors could lessen
  the amount of time these posts are available. According to Facebook, inappropriate posts are investigated
  and removed within 24 to 48 hours (Facebook “Community Standards”). Some offenders have been reported
  multiple times for their platform violations, and social media sponsors should increase their monitoring
  of those offenders. Although such surveillance would increase the burden on the social media providers,
  it would help solve the growing challenge of online hate speech and misinformation.</p>

  <h3>Definition</h3>

  <p>When using the reasoning strategy of definition, writers elaborate on the meaning of an idea, a word,
  or an expression, usually one that is controversial or that can be viewed in multiple ways. Beginning
  writers tend to think that definition writing looks only at the denotation, or dictionary definition.
  However, definition writing entails much more than relaying a dictionary definition. It also explains
  and elaborates on the connotations, the emotions and implications the topic evokes. Definition writing
  is especially useful for explaining and interpreting terms, ideas, or concepts that are easily or often
  confused or that have meanings beyond their denotations. Sometimes these meanings are personal interpretations
  and thus reflect a writer’s particular viewpoint. Additionally, this strategy is beneficial when writers
  want to explain or reinforce a term before making an argument about a larger concept. Model Paragraph</p>

  <p>In everyday speech, the word critical is often used to highlight negative aspects of a topic. If
  someone says a friend was critical of a new haircut, the implication is that the friend did not like
  the cut. However, when used in college classes, critical has an expanded meaning: noting both the negative
  and positive aspects of a topic, examining those aspects in depth, and then making decisions about the
  discoveries. Students directed to use critical thinking, critical reading, or critical writing should
  know they are expected to examine all sides of a topic fully, evaluate the validity of those sides,
  and then make sound judgments on the basis of their evaluation. In this chapter, you have learned about
  various reasoning strategies that you may use in academic and professional writing. Utilizing these
  strategies when you write can help you both evaluate and analyze text that you read and create more
  logical and persuasive arguments. Access multimedia content (http://openstax.org/books/writing-guide/pages/11-1-developing-your-sense-oflogic)</p>

  <p>11.2 Trailblazer Reasoning Trailblazer: Paul D. N. Hebert</p>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Read for inquiry, learning, and critical thinking. • Identify reasoning strategies and explain
  their functions.</li></ul>

  <p>“[R]esearchers will find a barcode linked to just about anything… encountered anywhere on the planet.”</p>

  <h3>Reasoning Strategies in Science</h3>

  <p>Born in Kingston, Ontario, Canada, Paul Hebert (b. 1947) earned his bachelor of science degree from
  Queen’s University, a public research university in his hometown. He then pursued graduate studies at
  the University of Cambridge (United Kingdom), where he received his PhD in genetics (a branch of biology
  dealing with heredity and the variation of inherited characteristics). He spent three years at Sydney
  University in Australia and then another year in London at the Natural History Museum. Returning to
  Canada, he began research at the University of Windsor, followed by a directorship at the Great Lakes
  Institute at Windsor. In 1990, he joined the faculty of Ontario’s University of Guelph, where he became
  director of the Centre for Biodiversity Genomics (a branch of biotechnology that strives to apply concepts
  of genetics and molecular biology to genetic mapping and DNA sequencing), and he holds a Canada Research
  Chair in molecular biodiversity (the study of the variety of life found on Earth or in a particular
  place on Earth).</p>

  <p>Interestingly, Dr. Hebert, a well-known genetic scientist, uses reasoning strategies to organize
  his research. In 2019, a team he led launched a multimillion-dollar effort to identify more than two
  million new species of creatures. Because the world is losing species faster than species are being
  discovered, his initiative comes at an opportune time and adds to the value of his work. Experts in
  the field of biodiversity estimate that Earth is home to 8.7 million to 20 million different kinds of
  plants, animals, and fungi. To date, however, only 1.8 million of them have been formally described.</p>

  <p>In 2003, Dr. Hebert first proposed the concept of using DNA (abbreviation for deoxyribonucleic acid,
  which codes genetic information for the transmission of inherited traits from a specimen) to create
  what is called DNA barcoding (https://openstax.org/r/barcode). This strategy is a method of identifying
  and classifying species by using a specific section of genetic code. In his groundbreaking paper, he
  proposed DNA barcoding as a solution to differentiate species by using the same small piece of DNA for
  every organism. A similarity today is the way in which scanners at groceries and other stores use UPC
  barcodes on items to determine prices.</p>

  <p>The idea behind the barcode thinking is that it creates a unique sequence that can be used in myriad
  ways. Two of these ways include identifying an organism as part of a larger species and identifying
  a previously unknown species. Hebert proposed that animal species could be distinguished by sequencing
  fewer than 1,000 bases of mitochondrial (dealing with a subcellular structure found in many organisms)
  DNA from a given specimen.</p>

  <p>Dr. Hebert was the founding director of the Biodiversity Institute of Ontario. Its goals are to</p>

  <ul><li>advance the knowledge of what makes up biodiversity; • protect biodiversity; and • help boost
  the global collaboration of biodiversity researchers.</li></ul>

  <p>In addition to his work with the Biodiversity Institute of Ontario, Dr. Hebert heads the International
  Barcode of Life, which began in 2008 as a reference library of known species with their identifying
  sequences. The barcodes have helped identify organisms and document how they interact with other species.</p>

  <p>One research program of the International Barcode of Life is BIOSCAN (https://openstax.org/r/bioscan).
  BIOSCAN’s areas of research are threefold. The first is to speed the discovery of species. BIOSCAN will
  use new means to increase the identification of the millions of species yet to be discovered by analyzing
  hundreds of millions of specimens from freshwater, saltwater, and land sources. The second area is interaction
  of species, which will investigate the complex ecosystem of species, a topic that, for the most part,
  remains shrouded in mystery. The third area is species dynamics, which will study many of the world’s
  areas as they are defined by their environmental conditions. Researchers will use that data to compile
  comprehensive starting points for comparisons about biodiversity.</p>

  <p>In its ongoing efforts, BIOSCAN hopes to more than double the reference library, using specimens
  and species interactions at 2,500 sites around the world, a nod to the international impact of DNA technology.
  Almost all the new barcode records will come from undescribed species. A primary goal will be discovery
  of species. A sample barcode sequence will be taken. If it does not match an existing species, researchers
  will examine the specimen more closely, hoping to find a new species. In the past, this process would
  have taken years before a specimen was, indeed, confirmed as a new species.</p>

  <p>Dr. Hebert hopes that by 2030, students can take handheld barcoders into the wild and use them to
  identify plants and animals instantly.</p>

  <h3>Discussion Questions</h3>

  <p>1. Does the comparison between DNA barcoding and UPC barcodes used in grocery stores help you understand
  the concept of DNA barcoding? Why or why not?</p>

  <p>2. How might BIOSCAN’s use of interactions from more than 2,500 sites around the world help the program
  realize its goals?</p>

  <p>3. How does Dr. Hebert use the cause-and-effect reasoning strategy in the initiative launched by
  the team he led? What is the cause of the initiative, and what is its effect?</p>

  <p>4. How does Dr. Hebert use the reasoning strategy of problem and solution in his proposal about DNA
  barcoding? What problem does Dr. Hebert address, and what is its solution?</p>

  <p>5. How would the reasoning strategy of classification and division be useful to a researcher like
  Dr. Hebert? Support your response with examples from the text.</p>

  <p>6. In what ways might researchers use a comparison-and contrast reasoning strategy to discover a
  new species?</p>

  <p>11.3 Glance at Genre: Reasoning Strategies and Signal Words</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Identify and define reasoning strategies and signal
  words. • Determine how the rhetorical situation influences the content and reasoning strategies of written
  works.</p>

  <p>As you read in The Digital World: Building on What You Already Know to Respond Critically, rhetorical
  situation are shaped by the conditions of the communication and the agents involved in that communication.
  To help you determine the conditions and the agents, you can examine purpose, culture, and audience
  expectation.</p>

  <p>The purpose, or intention, for your writing determines the reasoning strategies you use. For example,
  if your purpose is to explain why one restaurant is better than another, you likely would use comparison
  and contrast.</p>

  <p>Writers of essays and other formal papers usually support their ideas by using more than one reasoning
  strategy. For example, within comparison and contrast, they may include description, such as sensory
  details about the food at the two restaurants; narration, such as an anecdote about why they and their
  companions went to the restaurants or about something that happened at one of the restaurants; and sequencing,
  such as the order in which they received their food or the directions to get to the restaurants.</p>

  <p>Alternatively, writers may combine some of the six strategies already mentioned. For instance, within
  the larger structure of comparison and contrast, they may use classification and division when discussing
  the restaurants’ menus, sorting by main dishes, side dishes, appetizers, soups, salads, and desserts.
  Therefore, while the essay’s primary purpose may be to compare and contrast, individual strategies within
  an essay or even within a paragraph may differ.</p>

  <h3>Recognizing Purpose</h3>

  <p>Throughout your paper, your purpose for writing should be clear and focused. Your introduction, thesis,
  topic sentences, body paragraphs (which include reasoning and evidence), and conclusion should all reflect
  your argumentative or persuasive purpose.</p>

  <p>To support and clarify your purpose, you are likely to use the following:</p>

  <ul><li>Analogy: to explain to readers a subject with which they are unfamiliar by comparing a specific
  trait or traits with those of a more familiar subject.</li><li>Cause-and-effect: to provide a clear
  understanding of the relationship between an event or situation and/ or what happened because of it,
  why it occurred, and what might continue to happen.</li><li>Classification and division: to explain
  a subject by breaking it into smaller parts and explaining the distinctions of the smaller parts or
  by grouping individual, disparate elements on the basis of certain characteristics to form larger units.</li><li>Compare
  and contrast: to examine the similarities and/or differences of subjects in order to explain a specific
  point about their similarity or difference (often an unexpected similarity or difference).</li><li>Problem-and-solution:
  to indicate a predicament or difficulty and suggest ways to deal with or eliminate it.</li><li>Definition:
  to illustrate to readers an idea, word, or expression, allowing you to explain a unique meaning of a
  topic through details and analysis.</li></ul>

  <h3>Recognizing Audience</h3>

  <p>Critically thinking about the culture, or common beliefs and lived experiences, of your audience,
  the people who will read your work, can help you choose an appropriate vocabulary and level of detail.
  The culture and audience expectation determine the language you use, the amount and type of information
  you include, and the way you deliver that information. Determine first what your readers want to know
  (their expectations), what they already know, and what they do not know. Determining—or at least making
  an educated guess about—the culture of your audience will aid you in deciding how to use the reasoning
  strategy you choose and the way in which you present your paper. Suppose, for instance, your purpose
  is to persuade your audience to vote for a proposed local ordinance. First, consider the culture of
  your audience to ensure the language you use clearly explains the terms of ordinance for those who know
  nothing about it. Also, be sure that you fully understand the issues surrounding the ordinance and how
  it might have different effects on different groups of people so that what you assert is accurate. Next,
  again consider the culture of your audience members and what they may or may not know about your topic.
  For example, they may not know the reason for the proposed ordinance, what might happen if it is passed
  or not passed, or how it might affect them personally or culturally. If they are not as informed as
  you are, then include the background information they need to know about it in order for your reasoning
  strategy and overall argument to be effective.</p>

  <p>Hall Meeting” by The U.S. Food and Drug Administration/Wikimedia Commons, Public Domain)</p>

  <p>Depending on your audience, you may want to include an analogy to help readers understand connections
  and particular points in certain ways. An analogy is also useful if the subject is complex. You can
  make a complex subject more accessible for your audience by comparing it to something familiar.</p>

  <h3>Recognizing Points</h3>

  <p>Every point you make in a paper should be meaningful and should relate to the paper’s thesis, its
  overarching claim or angle. How you make each point is determined by your reason for making that point.
  In most academic writing, you will use structures that present a thesis at the beginning of the essay.
  Readers should recognize your thesis because of</p>

  <ul><li>its prominent placement in the essay; • the language you use leading up to it; and • the language
  you use following it.</li></ul>

  <p>For example, if your thesis is that the first two years of college should be tuition free for students
  (that is, tuition should be subsidized by the state), then you might begin your essay with an attention-getting
  fact stating that the current national student debt is over $1.7 trillion. After that, you might share
  evidence about the number of students who do not finish a bachelor’s degree but have accrued student
  loan debt. Finally, you might preview your reasons for the position advocating for free tuition for
  the first two years of college.</p>

  <p>Readers will recognize your supporting points as stated in your paragraph-level topic sentences because
  of how you discuss them in relation to your thesis. In all of your academic writing, choose language
  and reasoning strategies that guide readers back to your thesis.</p>

  <p>When you present facts, whether in your thesis or in your evidence, remember to cite them properly
  according to the format your instructor requires. For more about proper citations, see MLA Documentation
  and Format and APA Documentation and Format.</p>

  <h3>Structuring Your Reasoning Strategies</h3>

  <p>To present your reasoning, which is the main part of your essay, try these suggestions for using
  the six strategies:</p>

  <p>Analogy paragraphs often begin with a statement of comparison between two unlike subjects, followed
  by reasons, explanations, or analyses of their similarities.</p>

  <ul><li>Example topic 1: compare enrolling as a first-year student to visiting an amusement park for
  the first time</li></ul>

  <p>Example sentence: Enrolling as a first-year student is like visiting an amusement park for the first
  time in this way: the inexperienced students and park goers must pay a high fee, abide by strict rules,
  and choose how they spend their adventure.</p>

  <ul><li>Example topic 2: compare increasing the federal deficit to eating salted peanuts</li></ul>

  <p>Example sentence: Increasing the federal deficit is like eating salted peanuts: the higher the increase,
  the more will be demanded. When you eat salted peanuts, the more you eat, the more you want.</p>

  <p>Paragraphs explaining cause-and-effect often begin in one of these two ways: (1) an explanation of
  the cause(s), followed by an explanation of the effect(s) that happened as a result of the cause(s);
  or (2) an explanation of the effect(s), followed by an explanation of the cause(s) that led to the effect(s).</p>

  <ul><li>Example topic 1: how an oil spill affected animals, waterways, and environmental costs</li></ul>

  <p>Example sentence: Because an oil spill occurred off the coast of California, the fur and feathers
  of animals became dangerously matted, waterways were damaged, and the cost of maintaining a clean environment
  skyrocketed.</p>

  <ul><li>Example topic 2: how the pandemic affected the population</li></ul>

  <p>Example sentence: Because of the pandemic, gas consumption dropped, indoor dining at restaurants
  declined, and online shopping rose.</p>

  <ul><li>Example topic 3: how animals, waterways, and environmental costs were affected by an oil spill</li></ul>

  <p>Example sentence: The fur and feathers of animals became dangerously matted, waterways were damaged,
  and the cost of maintaining a clean environment skyrocketed as the result of an oil spill off the coast
  of California.</p>

  <ul><li>Example topic 4: how the pandemic affected the population</li></ul>

  <p>Example sentence: Gas consumption dropped, indoor dining at restaurants declined, and online shopping
  rose because of the pandemic.</p>

  <p>Classification-and-division paragraphs often begin in either of two ways: (1) Classification paragraphs
  identify individual items and place them in a larger group; and (2) Division paragraphs break a large
  group or a single unit into smaller parts.</p>

  <ul><li>Example classification topic: essential workers during the pandemic included employees in several
  fields</li></ul>

  <p>Example sentence: During the pandemic, essential workers not under quarantine included employees
  in the fields of health care, childcare, transportation, water and wastewater, and agriculture and food
  production.</p>

  <ul><li>Example division topic: how the new superstore will be divided</li></ul>

  <p>Example sentence: The layout for the new superstore will be divided into furniture (third floor),
  household goods and kitchenware (second floor), and men’s, women’s, and children’s clothing (first floor).</p>

  <p>When using compare and contrast reasoning, you have choices about the structure to use. Comparison-andcontrast
  paragraphs identify two subjects and address their similarities and then their differences; or comparison-and-contrast
  paragraphs identify two subjects and address their similarities and then their differences.</p>

  <ul><li>Example topic 1: reality television and scripted television</li></ul>

  <p>Example sentence: Reality television and scripted television are alike in that both should make money
  for the network that airs them; however, they differ in the predictability of what the characters do
  in their roles.</p>

  <ul><li>Example topic 2: printed book and audio book</li></ul>

  <p>Example sentence: A printed book and an audio book are alike in that both present the material the
  author wrote; one way they differ is that listeners—as opposed to readers—cannot make notes on text
  in a printed book.</p>

  <ul><li>Example topic 3: reality television and scripted television</li></ul>

  <p>Example sentence: Reality television and scripted television differ in the predictability of what
  the characters do in their roles, but they are alike in that they both should make money for the network
  that airs them.</p>

  <ul><li>Example topic 4: printed book and audio book</li></ul>

  <p>Example sentence: One way a printed book and an audio book differ is that listeners—as opposed to
  readers—cannot make notes on material in the printed book; however, both present the material the author
  wrote.</p>

  <p>You can develop a problem-and-solution paragraph in one of two ways: (1) identify the problem, and
  then explain a way to solve it; or (2) explain the solution to a problem, and then identify the problem(s)
  that necessitated it.</p>

  <ul><li>Example topic 1: student loans Example sentence: The issue of defaulting on repayment of student
  loans would be solved by increasing the time the students are given to repay the loans.</li><li>Example
  topic 2: campus parking Example sentence: The issue of the increased need for parking on campus would
  be solved by paving the area on the corner of Twelfth and Locust Streets to allow parking on that lot.</li><li>Example
  topic 3: student loans Example sentence: By increasing the time in which student loans must be repaid,
  the issue of defaulting on repayment of student loans would be solved, and students could have more
  ease of mind to pursue their careers.</li><li>Example topic 4: campus parking Example sentence By paving
  the area on the corner of Twelfth and Locust Streets to allow parking on that lot, the issue of the
  increased need for parking on campus would be solved, an eyesore would be beautified, and more students
  and faculty would get to class on time.</li></ul>

  <p>Definition paragraphs often begin by noting the dictionary definition (denotation) of the topic and
  then illustrating and explaining its unique or extended meaning.</p>

  <ul><li>Example topic 1: patriotism Example sentence: Most people think patriotism is showing devotion
  to their country; to me, however, it is conducting myself in ways that are respectful to everyone.</li><li>Example
  topic 2: independence Example sentence: Independence means freedom from outside control, but college
  students often find it brings personal responsibility they had not considered.</li></ul>

  <h3>Integrating Evidence from Appropriate Sources</h3>

  <p>Most academic writing is built on the writer’s own ideas as supported by the ideas of others. Regardless
  of the reasoning strategies you use in an essay, you will usually need to integrate others’ ideas to</p>

  <ul><li>help you explore a topic; • define, illustrate, explain, or prove an idea; • help readers think
  critically about an idea; and • give strength or credibility to your ideas. These ideas from others
  could come from a variety of sources such as print or electronic media or in-person conversations. Similarly,
  these sources could be either personal (e.g., a conversation you had with someone or an email you received)
  or public (e.g., available online or in a printed publication). You can read more about finding and
  using credible sources in Research Process: Accessing and Recording Information and Annotated Bibliography:
  Gathering, Evaluating, and Documenting Sources. These models show how writers integrate ideas from appropriate
  sources into their reasoning strategies.</li></ul>

  <h3>Analogy</h3>

  <p>Enrolling as a first-year student is like going to an amusement park for the first time: the inexperienced
  students or park goers must pay a high fee, abide by many rules, and choose their adventures. Like the
  cost for riding roller coasters, the cost for taking college classes is great and must be paid before
  the students start their journey. However, even after paying tuition, students do not have immediate
  access to whatever class they want to take, just as the park visitor cannot jump on any ride at any
  time. In the park, certain rides have warnings, such as “You must be at least 60 inches tall to go on
  this ride.” In college, many classes have prerequisites or require students to have earned a minimum
  placement score. Also, even though park goers have paid their entrance fees and received armbands that
  allow them to go anywhere in the park, they are not guaranteed a place on that one awesome ride they
  have heard so much about. They may have to choose between waiting in a line for hours or doing something
  else and trying to catch that ride another time. Similarly, college classes have a limited number of
  seats. Like the roller coaster that everyone wants to ride, college classes close, and students must
  make another choice. So, while students may not be able to pick up that class that semester, they can
  try again the next term. Like those starting an adventure at an amusement park, those starting the college
  journey should have a plan of how they want to fill their time and have a backup plan should they be
  unable to get every class they want, according to Max Vega, a first-year adviser. Similarly, park goers
  should use a map to plan their adventure.</p>

  <h3>Cause and Effect</h3>

  <p>Because an oil spill occurred off the coast of California, the fur and feathers of many animals became
  dangerously matted, waterways were damaged, and the cost of maintaining a clean environment skyrocketed.
  In May 2015, a ruptured pipeline in Santa Barbara County spilled oil along 20 miles of coastline. According
  to information published by the University of California-Davis, wildlife rescuers were able to save
  49 coastal birds, 25 sea lions, and 6 elephant seals (Kerlin, “Wildlife Experience High Price of Oil”).
  Helping ecosystems recover from oil spills is difficult and can take decades and billions of dollars
  to recover even partially.</p>

  <h3>Classification and Division</h3>

  <p>The layout for the new superstore can be divided into furniture (third floor), household goods and
  kitchenware (second floor), and men’s, women’s, and children’s clothing (first floor). This arrangement
  allows customers to feel they have control over their shopping experience. Customers shopping for clothes
  are not distracted by household goods or furniture displays. “By categorizing our merchandise in this
  manner, we can further subdivide the merchandise on each floor, developing a logical system of separation
  that repeat customers will learn easily,” said Carla Dawkins, general manager for Hometown Corner Store,
  in a Curtisville News report (Thurston 2). These subdivisions, Thurston stated, would allow individual
  floor managers to design the footprint of their floors to create an originality distinct and separate
  from the other floors (8).</p>

  <h3>Comparison and Contrast</h3>

  <p>One way Romeo and Juliet and Macbeth are alike is that both are tragedies written by William Shakespeare;
  one way they differ is that they explore different themes. In Romeo and Juliet, almost all action centers
  on the theme of love, whether it is the innocent love between two young people or the protective love
  of parents for their children. In Macbeth, however, the action centers on ambition. The characters act
  on their ambitions for themselves and for their country, but excessive ambition is condemned and severely
  punished (Royal Shakespeare Company, “Macbeth Analysis”).</p>

  <h3>Problem and Solution</h3>

  <p>The issue of the increased need for parking on campus would be solved by paving the area on the corner
  of Twelfth and Locust Streets to allow parking on that lot. According to an email sent to all students
  from the provost, Dr. Sandra Kuryakin, the college purchased the corner lot two years ago with the intent
  of creating more parking spaces. In the email, Dr. Kuryakin adds, “We will break ground in June and
  plan to have the lot finished before students are back on campus in August, thus solving our parking
  problem on the west end of campus.”</p>

