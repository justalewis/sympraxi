  Skill.” In Self-Efficacy Beliefs of Adolescents, Information Age Publishing, 2006, pp. 45-69.</p>

  <p>Teacher Resources for “We Write Because We Care: Developing Your Writerly Identity”</p>

  <h3>Overview and Teaching Strategies</h3>

  <p>“We Write Because We Care: Developing Your Writerly Identity” is best used in an introductory lesson
  to first year college writing students, or in conjunction with a reflective writing task, such as a
  portfolio introduction.</p>

  <p>The chapter explores what it means to be a writer, both in and out of the classroom, and looks at
  the benefits of writing, ultimately inviting students to think of themselves as writers by constructing
  what we call a “writerly identity.” We proposed this chapter when we realized that most writing textbooks
  and resources—Writing Spaces among them—lack much consideration of the writing that we do outside of
  the classroom, and often fail to invite students to take that first, radical step of calling themselves
  “real” writers.</p>

  <p>With that in mind, this chapter could be paired with a class activity in which students reflect on
  their prior experience with and knowledge of writing. We find that students, especially first year students,
  often benefit from a great deal of encouragement to find the confidence to challenge themselves to even
  think of themselves as writers. In fact, as Taylor reminded us during our collaboration, one thing that
  Glenn said in a class has stuck with her: anyone can be a writer. To achieve that goal of helping students
  consider who they are as writers, we suggest pairing this chapter with other Writing Spaces chapters
  that encourage students to think about purpose, identity, and community, especially Sarah Allen’s “The
  Inspired Writer Vs. The Real Writer,” E. Shelley Reid’s “Ten Ways To Think About Writing: Metaphoric
  Musings For College Students,” Quentin Vieregge’s “Exigency: What Makes My Message Indispensable to
  My Reader,” or Sarah P. Alvarez, Amy J. Wan, and Eunjeong Lee’s “Workin’ Languages: Who We Are Matters
  in Our Writing.”</p>

  <p>Our chapter begins with an introduction that addresses a widely shared concern: what does it mean
  to truly write? The answer we propose is both simple (just write!) and complex (writing is connected
  to personal identity and community). But we argue that students can count all of the composing they
  do as “real” writing. Diaristic journaling, creative writing, therapeutic writing, researched academic
  essays—all of it counts as “real writing” in our book. So, a natural place for students to enter into
  this conversation is with the question: are we correct? Does any and all composing count as “real” writing?
  Even texting? What about TikTok? If so, what does this mean for the work students do in their first-year
  composition courses?</p>

  <p>Our next section discusses the personal benefits of writing. Taylor grapples with the question “So
  what?” and concludes that every student gains knowledge, skills, and a better understanding of the self
  when writing. This leads into one of the most important traits that we believe writing can teach: resilience.
  Students face challenges in the classroom and in their personal lives that require perseverance, and
  the acts of writing and revision are tangible activities that help instill this practice. Sydney takes
  up this theme in the second section of our chapter. This section could be paired with instructional
  activities related to growth mindset and resilience. Or, students might be invited to speak back to
  us by identifying times in which writing did not teach resilience.</p>

  <p>We conclude with Alison’s discussion of socially engaged, community-situated writing. This section
  of the chapter might assist with introducing a community-oriented or service-learning writing unit,
  or it might open a conversation in which students discuss how they could apply class concepts to the
  writing and communication they already do in the communities they belong to. Glenn has seen great success
  in student engagement when asking his own students to identify and describe complex, ongoing problems
  or issues that their communities face and using those problems and issues to generate writing and research
  projects. Responding to these concepts could motivate students to use their writerly identity to engage
  with their own communities, too.</p>

  <p>Finally, all three sections of our chapter tie back to the notion of writerly identity. The most
  productive use of this chapter that we can imagine is one in which students think hard about who they
  currently are as writers while identifying possibilities for the writers they want to become.</p>

  <h3>Discussion Questions</h3>

  <p>1. Which of the three sections of this chapter resonated with you the most, and why? Which section
  was most confusing or surprising? What does your response tell you about who you are as a writer?</p>

  <p>2. What role has writing played in your personal development so far as a student? How about outside
  of the classroom? What ideas in this chapter do you anticipate using in this course or semester?</p>

  <p>3. One way to develop your writerly identity is to compare various writers’ reasons for writing and
  ideas about writing. To that end, read Sarah Allen’s “The Inspired Writer Vs. The Real Writer,” also
  found in Writing Spaces. Identify the common themes between that chapter and this chapter, as well as
  any differences in perspective.</p>

  <p>4. Create a two-column chart. Label one column “writing for school” and the other “personal writing.”
  Then, use the chart to describe how your experience differs when you’re writing for school versus engaging
  in personal writing. (Remember that personal writing isn’t always poetry, diaries, or short stories!)</p>

  <h3>Recommended Activities</h3>

  <p>1. To test our assertions about writing as a tool for building your agency and resilience, try this
  journaling exercise: use a convenient device, like a notebook or a mobile notes app, to document one
  notable event each day for one week. Write about what happened, why it was notable, and how you felt
  about it. At the end of the week, read through what you wrote about the week you’ve had and how you’ve
  felt. Then, discuss with your classmates how your attitudes about writing may have shifted as a result
  of using writing to document your observations and experiences. How does having a tangible record of
  your experiences affect your mindset and sense of your own personal agency, defined as your “capability
  to originate and direct actions for given purposes”?</p>

  <p>2. Think back to the social engagement section of this chapter. Identify one community that you are
  a part of that is or could be impacted by writing. (Recall Linda Flower’s definition of a rhetorical
  community, which considers how people unite for a variety of purposes around “affinities rather than
  visible borders.”) Identify an issue, question, challenge, problem, or shared goal that the community
  faces. How could writing be used to approach this issue, solve this problem, or achieve the community’s
  goal? What types of writing would most impact the community, and why? What stands in the way of addressing
  the issue or solving the problem—both from inside and outside the community?</p>'
