  <h3>Rhetorical Choices</h3>

  <p>The text occasionally adheres to the “Editing Focus” of this chapter: using the literary present
  tense as discussed in Section 16.6. The text also shows emerging evidence of the writer’s intent to
  meet or challenge conventional expectations in rhetorically effective ways.</p>

  <p>Some paragraphs in the paper reflect its purpose, which may or may not be stated in the thesis. The
  thesis provides minimal focus for analysis of a literary work. Other paragraphs are rambling, unfocused,
  and out of logical order. There is little overall organization and little use of effective transitions.
  Most paragraphs lack topic sentences or have more than one.</p>

  <p>Lapses in tone and language choices make the writing unsuited to the audience and purpose. The work
  reflects little thought, some unfairness, questionable comprehension, and minimal awareness of the rhetorical
  situation.</p>

  <p>The text does not adhere to the “Editing Focus” of this chapter: using the literary present tense
  as discussed in Section 16.6. The text also shows little to no evidence of the writer’s intent to meet
  or challenge conventional expectations in rhetorically effective ways.</p>

  <p>Few, if any, paragraphs in the paper reflect its purpose, which may or may not be stated in the thesis.
  The thesis provides little or no focus for analysis of a literary work. Other paragraphs are rambling,
  unfocused, and out of logical order. There is little or no obvious organization and little or no use
  of effective transitions. Most or all paragraphs lack topic sentences, have more than one, or are insufficiently
  developed.</p>

  <p>Frequent lapses in tone and language choices make the writing unsuited to the audience and purpose.
  The work reflects little or no thought, fairness, accurate comprehension, or awareness of the rhetorical
  situation.</p>

  <p>16.8 Spotlight on … Humanities</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Describe various disciplines in the humanities.
  • Evaluate employment opportunities for graduates with humanities degrees.</p>

  <p>Although all college instructors value good writing, each area of study has its own set of criteria
  by which writing is judged. For instance, the loose informal style and speculative content of a reflective
  essay might be appropriate for an English class but inappropriate for an anthropology class in which
  the instructor would expect the more formal structures established in that subject area.</p>

  <p>As a discipline, the humanities include subjects that focus on human culture and values. Some subjects
  are literature, languages, classics, art history, film, musicology, philosophy, religion, and often
  history, which sometimes is placed in the social sciences. The humanities are the foundation of liberal
  arts and, as such, include a wide variety of writing genres. Research reports, biographies, literary
  analyses, ethnographies, quantitative reports, proposals, books, journal articles, poetry, film scripts,
  novels, stories, technical writing, and professional documents are forms of writing particular to the
  humanities.</p>

  <p>As a rule, knowledge in the humanities focuses on texts and on individual ideas, speculations, insights,
  and imaginative connections. Interpretation in the humanities is thus relatively subjective. Accordingly,
  much of the writing and research in the humanities is characterized by personal involvement, lively
  language, and speculative or open-ended conclusions.</p>

  <p>The field of English includes the study of not only literature but of literary theory and history,
  and not only composition but creative and technical writing. In addition, English departments often
  include linguistics, journalism, folklore, women’s studies, cultural or ethnic studies, and film. In
  other words, within even one discipline, you might be asked to write several distinct types of papers:
  personal experience essays for a composition course, analyses for a literature course, abstracts or
  case studies for a linguistics course, procedural texts for a technical writing course, and short stories
  for a creative writing course. Consequently, any observations about the different kinds of knowledge
  and the differing conventions for writing about them are only generalizations. The more carefully you
  study any one discipline, the more complex it becomes, and the harder it is to make a generalization
  that does not have numerous explanations.</p>

  <h3>Careers in the Humanities</h3>

  <p>Because humanities subjects emphasize critical thinking and clear writing, the skills humanities
  students obtain are valued in many fields other than the most obvious ones. Humanities majors have gone
  on to careers in law, medicine (humanities plus pre-med), advertising, journalism, TV and film writing
  and production, public relations, graphic design, teaching, technical and medical/scientific writing,
  human resources, and many others. For more information about career opportunities for humanities students,
  see these sites:</p>

  <ul><li>Humanities and Social Sciences Careers (https://openstax.org/r/Humanities) • Top 10 Highest
  Paying Jobs for Liberal Arts Majors (https://openstax.org/r/Top-10-Highest) • 25 Great Jobs for Humanities
  Majors (https://openstax.org/r/Great-Jobs)</li></ul>

  <h3>Students’ Stories</h3>

  <p>Despite strong interest in the humanities—especially in reading, writing, and language—some students
  avoid humanities subjects as majors because they think they won’t find jobs after graduation. Such fear,
  however, is unwarranted, as many organizations actively seek students who major in languages or in other
  humanities disciplines. These graduates are valued for their ability to interpret and analyze text and
  to write clear, concise, and compelling prose. Moreover, employers realize that students who concentrate
  on studying people—whether real or fictional—develop insights into human behavior and understanding
  of how to deal with it. For example, these students who graduated with degrees in humanities subjects
  have found rewarding work in humanities-related and business fields.</p>

  <p>Gabriela Torres majored in film studies, with a minor in theater. Although more interested in the
  technical aspects of both, she took creative writing classes and enjoyed performing in several college
  productions. Soon after graduation, Gabriela joined the human resources (HR) department of midsized
  corporation. Her job is to train new hires and conduct in-service workshops for current employees. Recently
  her role has expanded to writing, producing, and acting in training videos in which she uses the skills
  she learned in college—and more.</p>

  <p>Derrek Wilson became an international studies major after he received a summer stipend to study in
  Europe. After only a few weeks there and trips to historic sites, Derrek says he got “hooked on history.”
  The broad focus of his interdisciplinary major allowed him to take courses in humanities subjects: history,
  geography, religion, archaeology, and world literature. He had studied Spanish in high school and continued
  in college. Derrek graduated last year and now works as an international program coordinator for his
  university. Responsible for logistics of foreign students coming to the United States and for American
  students going abroad, he oversees housing accommodations, student visas, and travel arrangements. He
  loves his job and the time he gets to spend in different countries, but he plans to go to law school
  in a few years—with, you guessed it, a specialty in international and immigration law.</p>

  <p>Despite his parents’ warnings that he’d never find a good job, Nick Marelli majored in English. He
  put his literary interests to work in college as managing editor of the literary magazine and arts editor
  of the newspaper. When he graduated, he applied, on a whim (and to please his parents), for a management
  trainee position at a large insurance company. Thinking he would get nowhere without business courses,
  he was surprised when a recruiter called him for an interview. The interviewer then told him that the
  company actively seeks English majors because they know how to read carefully, digest and summarize
  information, think critically, and write clearly, concisely, and correctly. Nick says, “I was surprised
  when I heard someone other than an English teacher say that. I really like my work, where I’m learning
  a lot on the spot rather than in a classroom.”</p>

  <h3>Thinking, Writing, and Publishing</h3>

  <p>Critical writing requires critical thinking. When an individual or collaborative team articulates
  their perspective, they provide new knowledge for audiences. In essence, all texts have potential to
  create new knowledge. A writer of any type of text has the potential to enter a conversation and show
  audiences new ways to look at a subject.</p>

  <p>Learning how to write analytically and critically offers a skill set for crafting various genres,
  such as information reports, proposals, cost/benefit analyses, instructions, and so on. After you have
  completed your analysis for this chapter, consider submitting it to an open-access academic journal
  that highlights the work of undergraduate students in the humanities, such as these:</p>

  <p>Undergraduate Journal of Humanistic Studies (https://openstax.org/r/Undergraduate)</p>

  <p>16.9 Portfolio: The Academic and the Personal</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Reflect on the development of composing processes
  and how those processes affect your work. • Identify your strengths in writing and consider how to continue
  to develop your writing process.</p>

  <h3>Reflective Writing: Genres of Reflective Writing</h3>

  <p>Reflective writing is not limited to a single genre. Because it is highly personal, it is most frequent
  in, but certainly not limited to, diaries, journals, autobiographies, and memoirs. One common way that
  it appears is in letters or essays that writers craft to reflect on, or think about, their writing process
  for a particular text they have written. Consider the following suggestions when you write reflectively
  about this assignment for your ongoing portfolio compilation:</p>

  <ul><li>Write this letter, essay, or response as you would to a friend—be kind to yourself and your
  process, but be realistic as well.</li><li>Highlight what you think are your present capabilities and
  what you would like to strengthen. • Specifically discuss and illustrate—by giving specific examples—how
  well you have met the assignment objectives listed under Evaluation: Self-Directed Assessment.</li></ul>

  <p>To guide your portfolio reflection, answer these questions:</p>

  <ul><li>What did you learn about yourself and/or the writing process in the course of writing your textual
  analysis? • What did you learn about the topic and/or about writing in general? • Which part of the
  writing process was most beneficial to you: drafting, peer review, conferences, or something else? •
  How successfully did you address the assignment guidelines? • How might you change your writing process
  to better support your growth as a writer—for example, time management, change in drafting methods,
  more focus on rubric, extended research, more focus on the final draft before submission?</li></ul>

