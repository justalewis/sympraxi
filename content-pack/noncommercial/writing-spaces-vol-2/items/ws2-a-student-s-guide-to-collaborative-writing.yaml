  <h3>Typeface and Spacing</h3>

  <p>Appropriate typeface usage involves all design elements. The repetition of a single font throughout
  a document shows the reader that each section of the paper is part of a single whole. The strong visual
  color contrast of black text on a white background increases readability. Black text, for example, is
  easier to read than gray text, a difference you may notice when your printer is low on ink. Alignment
  indicates a separation of ideas or the introduction of a new concept. The title of the paper centered
  over the left-aligned text shows the beginning of the paper’s content. The placement of section titles
  illustrates proxim-</p>

  <p>Document Design and Formatting in the Writing Classroom ity. Each one is adjacent to its respective
  text directly above the first paragraph of a section.</p>

  <p>MLA requires a serif font (like Times New Roman) in 12-point type. A serif font is one that has edges
  or “feet” on the ends of letters. A sans-serif font (like Arial) is straighter, without edges or flares
  as part of its shape. Serif fonts are traditionally easier to read, though this distinction has decreased
  as desktop publishing programs and font qualities have improved.</p>

  <p>All text, from the initial header through the reference page, must be double-spaced (see Fig. 5).
  There is no additional spacing before or after headings. Each new paragraph is indented by ½ inch. The
  consistent spacing within the document makes reading easier as well as providing a reviewer with room
  for notes. The indention of each paragraph clearly indicates the beginning of a new idea.</p>

  <p>See section 4.2 of the MLA Handbook for information on typeface and spacing.</p>

  <h3>Title and Headings</h3>

  <p>A title and internal headings help to separate the body of the paper into smaller, more specific,
  sections. They break text into shorter, more readable sections, or chunk information in the paper into
  reasonable portions. In addition, headings allow the reader to quickly skim through a document in search
  of specific ideas. Headings are described in levels, meaning their hierarchal structure in the paper.
  A second level heading must follow a first level heading. For example, after reading this entire chapter,
  you can easily find information on a specific element by looking for the appropriate heading.</p>

  <p>Within MLA style, the title refers to the entire paper, while headings refer to individual sections
  within the paper. The contrast in MLA titles and headings comes mainly from alignment. Both students
  writing in the classroom and professionals writing for publication use MLA style. Limiting the amount
  of formatting—like adding italics or bold for emphasis—and focusing on alignment helps ensure that headings
  remain consistent when different fonts are used. The title is centered over the main text; headings
  are left justified over body text that is indented (see Fig. 5).</p>

  <p>See section 4.3 of the MLA Handbook for information on titles and headings.</p>

