  <h3>Practice</h3>

  <p>You’ll need practice in “summarizing” technical sources. Consider adapting the table from the previous
  sections to highlight information that is more relevant to technical sources (e.g., swapped out DOI
  and reliability for functionality and user base). I’ve input the NOAA source as an example (Table 5.3).</p>

  <p>As most technical writers find out, what constitutes useful sources will constantly change according
  to purpose and will extend far beyond musty books and full-text periodicals. (We’re two functions in
  and you haven’t even started writing yet!)</p>

  <p>Table 5.4. Source Spreadsheet Adapted for Technical Sources</p>

