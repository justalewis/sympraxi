body: '<p>for Today’s Technical</p>

  <p>Communication Work</p>

  <p>Clinton R. Lanier</p>

  <p>The way we communicate has dramatically changed over the past two decades.1 Not long ago a college
  student might have taken a break between classes by reading a magazine or talking to friends. Today,
  when 99% of college students own smartphones (Seilhamer et al.), they might instead view the latest
  posts on Instagram or TikTok, and they would not be alone in their browsing. In fact, according to a
  study by Pew Research, 72% of adults in the U.S. are active social media users. With so many people
  using Facebook, Snapchat, and other social media networks, it is no wonder that they are also being
  used for less “social” communication as well (see, for example, Bowden and Charles-Smith et al.). Even
  the field of technical communication has found a way to use social media, and that is what this chapter
  is going to focus on.</p>

  <p>Understanding how technical communication and social media relate is an important topic according
  to past research. In one study, technical writers were asked what the most important trends or technologies
  were for the field of technical communication. One of the common answers was “social media,” and specifically
  Facebook, Twitter (the platform now knows as X), Instagram, and YouTube (Lanier). In another study,
  researchers looked at job postings for technical communicators to understand the types of jobs they
  were getting and what skills they needed for them. One of the biggest job sectors was in “social media
  writing,” and one of the skills required for many of the technical writing jobs included an understanding
  of social media (Brumberger and Lauer).</p>

  <p>This chapter highlights the relationship between social media and technical communication. First,
  we will define social media so that we have a</p>

  <p>1 This work is licensed under the Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International
  License (CC BY-NC-ND 4.0) and is subject to the Writing Spaces Terms of Use. To view a copy of this
