body: '<p>to Determining When Bias Matters</p>

  <p>Danielle DeRise</p>

  <p>Overview</p>

  <p>The polarization of American society means almost every topic is ripe for controversy.1 Students
  in first year writing classes reflect this noisy information ecosystem, commonly, by focusing on the
  degree of bias an author displays. In some cases, these observations result in savvy choices about source
  credibility, but in other instances, a focus on bias can lead students astray, even steering them away
  from reputable information. This chapter provides four classroom strategies—context awareness, genre
  awareness, classifying opinions, and evaluating counterarguments—to encourage students toward a more
  nuanced understanding of bias, which also can be applied to real-world situations.</p>

  <p>In Biased, a 2019 book about racial bias, author and psychology professor Jennifer Eberhardt likens
  bias to a categorization effort by the human brain. Eberhardt also acknowledges that this trait is universal:
  it’s our version of a short cut for processing vast amounts of information, “bringing coherence to a
  chaotic world” (24). However, these very same shortcuts have significant limitations, as they “impede
  our efforts to embrace and understand people who are deemed not like us” (24). This idea is at the heart
  of Eberhardt’s research about implicit racial bias and its lifeor-death consequences.</p>

  <p>Tragically, in the years since Eberhardt’s book was published, acts of violence have continued against
  Black individuals by law enforcement. Also,</p>

