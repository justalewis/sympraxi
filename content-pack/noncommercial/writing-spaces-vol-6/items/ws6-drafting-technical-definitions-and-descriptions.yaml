  <h3>Conclusion</h3>

  <p>In this chapter, I have introduced technical definitions and descriptions and discussed how to draft
  them. Technical definitions provide clear and accurate explanations of important terms and concepts.
  Technical descriptions inform readers of a mechanism or process and enable readers to take appropriate
  actions. They are not only common elements of technical documents, but also the backbone of effective
  technical communication.</p>

