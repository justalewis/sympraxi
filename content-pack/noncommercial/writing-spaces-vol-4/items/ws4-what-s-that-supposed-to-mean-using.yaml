  <p>Teacher Resources for What’s That Supposed to Mean? Using Feedback on Your Writing</p>

  <p>Overview and Teaching Strategies</p>

  <p>This essay can frame your class conversation around revision practices, peer review, and teacher
  feedback. I recommend reading this essay early in a composition class, ideally before the first peer
  review and before students receive substantive teacher feedback. Familiarizing students with strategies
  on how to use their feedback before they receive any will help prepare them for taking their feedback
  seriously and using it to improve as writers. This essay would also work well at the beginning of a
  unit or major assignment with a heavy revision component.</p>

  <p>Many of the discussion questions offered below would work well either before or after reading the
  essay. You may want to ask students to consider their current feedback practices before reading the
  essay so they can more effectively compare strategies and reflect on how the strategies would work for
  them.</p>

  <p>If you have students read this essay before receiving any feedback, I recommend doing Activity 1
  on the day you discuss the essay. Once students receive feedback (either from peers or you), I recommend
  doing Activity 2 or 3 to help students better incorporate the strategies into their own writing practices.
  If you have students read this essay after receiving feedback, I recommend doing either Activity 2 or
  3 on the day you discuss the essay.</p>

  <h3>Discussion Questions</h3>

  <p>1. Do you believe you have a fixed or growth mindset about your writing abilities? Why or why not?
  What could help you grow as a writer?</p>

  <p>2. What sorts of emotions do you experience or have you experienced while receiving feedback from
  others on your writing? How does that impact your revision process?</p>

  <p>3. What do you typically do when you receive feedback on your writing from a teacher? From a peer?
  From a writing center tutor?</p>

  <p>4. What do you think you should do with your feedback? Is that different from what you typically
  do?</p>

  <p>5. In a perfect world, what would your writing feedback help you do?</p>

  <h3>Activity Ideas</h3>

  <p>Activity 1: Have students look at feedback they received on a piece of their writing from a previous
  class or writing situation. For students who can find an example, have them consider what they did with
  this feedback. What more could they have done—or what else could they have done with it? For students
  who can’t find an example, have them consider why they can’t find this kind of material. Why don’t we
  tend to hold on to the feedback we receive on our writing?</p>

  <p>Activity 2: Have students locate and review recent feedback you have provided them on their writing.
  Ask students to:</p>

  <ul><li>Identify which comment they found most useful and why • Identify which comment they found least
  useful and why • Identify which comment they found most confusing</li></ul>

  <p>Activity 3: Ask students to follow the recommended steps in this chapter for using feedback after
  a peer review or receiving feedback from the instructor and write about or discuss that experience in
  class. Students would discuss/write about:</p>

  <ul><li>Goals they had for the feedback • Emotional responses to the feedback • Follow-up questions
  • Actions they took with the feedback • Similarities and differences between this process and their
  previous strategies for using feedback</li></ul>'
