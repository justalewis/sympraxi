body: '<p>What Now?”: Adapting Strategies from First-Year Writing to Writing in the Disciplines</p>

  <p>Amy Cicchino</p>

  <p>Overview</p>

  <p>This chapter foreshadows challenges you can experience as you adapt your writing beyond your first-year
  writing course to become a writer in your discipline.1 The essay contains a student scenario, defines
  key rhetorical concepts within discipline-specific writing situations, and gives you strategies for
  adapting these rhetorical concepts to new writing situations. After reading this chapter, you will better
  understand how the concepts introduced in first-year writing connect to the writing you will encounter
  in your upper-level, disciplinary courses and identify strategies that will help you intentionally adapt
  writing knowledge to new discipline-specific contexts.</p>

  <h3>Introduction</h3>

  <p>“C minus?!” Angel was stunned. Angel was not a Cstudent; they had always done well in writing courses
  in the past and had just earned an “A” in Composition II last semester. Yet, while looking at their
  grade for their first writing assignment in BIO 2030, they began to doubt their ability.</p>

  <p>Professor Smith introduced the assignment six weeks ago, and it seemed simple enough: each student
  would create a scientific poster on a series of lab experiments they had completed on the culturable
  microbes they had found in dirt samples. The assignment sheet told students to create a poster for a
  scientific audience with complete sections and a polished design.</p>

  <p>1. This work is licensed under the Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International
  License (CC BY-NC-ND 4.0) and is subject to the Writing Spaces Terms of Use. To view a copy of this
  license, visit http://creativecommons. org/licenses/by-nc-nd/4.0/, email info@creativecommons.org, or
  send a letter to Creative Commons, PO Box 1866, Mountain View, CA 94042, USA. To view the Writing Spaces
  Terms of Use, visit http://writingspaces.org/terms-of-use.</p>

  <p>Sure, Angel hadn’t started the assignment until a few days before it was due, but the professor hadn’t
  asked to see drafts before the final due date.</p>

  <p>Angel brought up the poster when they went to lunch with their friend, Akeelah, who was also in the
  class. “How did you do on the poster project?” Angel asked.</p>

  <p>“Okay,” Akeelah said absentmindedly. “What is okay?” Angel pried. “B minus,” Akeelah said, putting
  down her phone and turning her attention more towards Angel, who was obviously concerned about the assignment,
  “Why?” “I got a C minus,” Angel admitted, “I’m a good writer. I don’t understand what Prof. Smith wants
  from me.” “Have you thought about asking?” Akeelah posed, “You can go and talk to her during office
  hours. That’s what I did. It was weird at first, but I felt a lot better afterwards.” Angel shrugged,
  they hated having awkward conversations with professors, “Can’t I just see your poster?” Akeelah paused,
  “I’ll show you my poster, but only after you talk with Prof. Smith.” Angel sighed and opened their email;
  they began an email asking Prof. Smith to come and discuss the grade during office hours. Angel needed
  to know what they could do better for the next assignment. A few days later, Angel sat with Prof. Smith
  in office hours. Prof. Smith explained why Angel had earned the C-. She said Angel wasn’t writing in
  a way that was effective for scientists or for the purpose of the assignment. The sentences were too
  wordy, the writing style was not appropriate for scientific readers, some expected poster sections were
  missing, and the conclusion only summarized without making specific recommendations for the scientific
  community. Prof. Smith did not see the conventions she expected to see in scientific posters: a presentation
  of findings and data using relevant graphs or images, an evaluation of methods and processes, and specific
  recommendations based on data. Instead, she argued, Angel had written the poster as if it were an essay.
  Angel was confused, “Was the writing they had done in their composition class less good than the writing
  they were doing now?” “Not less good,” Prof. Smith said, “but different in its purpose, audience, style,
  and form.” Prof. Smith then asked Angel what they had done to prepare for the assignment: Had they looked
  at example scientific posters? Had they researched scientific writing styles? Had they arranged to meet
  with another classmate to look over drafts? Had they taken their writing to the writing center for feedback?
  Prof. Smith had talked about these steps when the poster assignment was introduced. Angel struggled
  to remember that class day—it was a long day, and they had felt overloaded with all the information
  they had received. Together Prof. Smith and Angel logged into Canvas, their course learning management
  system, and located the course syllabus. They downloaded and opened the file—Angel was guilty that they
  hadn’t thought to do that while completing the poster. Sure enough, there was a section of the syllabus
  devoted to resources on scientific writing (Kinsley’s 2009 A Student Handbook for Writing in Biology,
  3rd edition and Weaver et al.’s Scientific Posters: A Learner’s Guide) and even links to example scientific
  posters by former students.</p>

  <p>Angel had used writing strategies that had worked well for them in the past: they had participated
  in class activities and done every bit of the homework. When they were ready to start the poster, they
  had outlined their ideas into sections, written in complete and engaging sentences, and cited their
  sources in MLA. They had moved their written sections onto a poster and added a visual. However, they
  hadn’t done enough to consider this new writing context, its new expectations, and the more independent
  responsibility they would have to take on as a writer. Being asked to write in new forms for new audiences
  demanded Angel adapt their writing strategies.</p>

  <p>Before we move on, let’s look at the posters created by Angel and Akleelah. What differences do you
  notice? Table 1 summarizes several differences as well.</p>

  <p>Figure 1: Angel’s scientific poster, mock examples created by the author. This poster has a lengthy
  introduction with an attention grabber to start. The research</p>

  <p>“I Passed First-Year Writing—What Now?” 171 and lab work section discusses the student’s experience
  in the lab, not the scientific methods or lab processes. The conclusion offers a quick summary of the
  points already explored. Research is cited in MLA format, and the only visual is a microbe cartoon.</p>

  <p>Figure 2: Akeelah’s scientific poster, mock examples created by the author. This poster starts with
  an abstract. Its introduction is short, offering brief context for the project. The methods are a simple
  list that focuses on scientific lab processes and includes a figure showing the three stages of development.
  The results also include a single takeaway with an image showing the antimicrobial activity in its microscopic
  form. There is a section on limitations. The conclusion offers a brief summary and calls for the Tiny
  Earth project to be continued to promote pharmaceutical research among young scientists. References
  are in APA format.</p>

  <p>Angel’s challenge isn’t uncommon for students as they move into their discipline-specific courses
  (also called courses in the major). Angel’s composition professor had taught them the importance of
  audience, purpose, and genre, and they had been successful applying those concepts in their composition
  course. However, it was more difficult for Angel to apply those concepts and manage their writing process
  in this new discipline-specific course. Prof. Smith expected Angel to do the work of learning about
  writing within the scientific community and the genre of a scientific poster more independently. Prof.
  Smith also didn’t provide checkpoints in draft development like Angel’s composition professor had, making
  it easy for Angel to wait to begin the project until just before it was due.</p>

  <p>Table 1</p>

  <p>A comparison between Angel’s and Akeelah’s posters</p>

  <p>Angel’s Poster</p>

  <p>Akeelah’s Poster</p>

  <p>Style/ Word Choice</p>

  <p>Uses “I” language, narrative style, and lengthy transitions to elaborate on the topic. MLA format</p>

  <p>Uses more concise scientific language with tightly focused paragraphs. APA format</p>

  <p>Organization</p>

  <p>Emphasizes the introduction and conclusion sections as being the most important while methods focus
  on what they gained from engaging in research</p>

  <p>Mirrors the IMRAD structure with methods detailing lab procedures</p>

  <p>Design</p>

  <p>Mostly written text with a single cartoonish graphic</p>

  <p>Balanced between concise writing and visuals, including labeled figures</p>

  <p>This chapter will help you understand how you can use the rhetorical concepts you learned in your
  composition course to decode new writing situations and genres that you’ll likely encounter in your
  upper-level, discipline-specific courses in your major. You might assume that writing is just writing,
  but Angel’s scientific poster shows that is not the case. While you might receive more support in your
  discipline-specific courses than Prof. Smith provided in the example, you will be expected to be more
  independent as you develop and revise your writing projects. You also could be expected to learn about
  disciplinary writing styles and genre conventions by seeking out resources on your own.</p>

  <h3>Discipline-Specific Courses and Discourse Communities</h3>

  <p>In Volume 3 of Writing Spaces, Dan Melzer helps readers learn about discourse communities, which
  are named so because they have specific communal expectations related to speaking and writing. Your
  majors represent discourse communities created by individuals within your discipline and future profession:
  biologists, nutritionists, professional writers, athletic trainers, hospitality professionals, nurses,
  and engineers are all different discourse communities.</p>

  <p>When you begin taking courses in your major, your professors (who are members of those discourse
  communities), will develop assignments that help you to practice speaking and writing like members of
  those discourse communities. To do this, you will need to learn writing styles and genres that are popular
  in those discourse communities, although this purpose may not be formally explained in class. Professors
  may not unpack discourse community expectations clearly, or they might expect you to do more independent
  work learning about writing style and format.</p>

  <p>Mary Soliday notes that attempting new genres can be difficult and “disorienting,” even for professionals,
  because you are juggling a lot of newness all at once—“exploring new subject matter, trying on new roles,
  and meeting unknown audiences” (14). However, you can use the rhetorical concepts you have learned in
  your composition course to investigate writing in these new situations. And you are more likely to do
  this successfully when you have opportunity to engage in “bridging practices” to reflect on how your
  learning in composition can be framed to transfer to a new context (Rounsaville).</p>

  <p>Take our issue at hand—the presence of microbiomes in soil. Different discourse communities would
  approach writing on this topic in different ways, using different formats. A biologist interested in
  the systematic study of these microbiomes will engage in research projects to collect and analyze soil
  samples, and share those analytical findings in scientific forms of communication, like a research poster,
  presentation, or article. A nurse, however, would focus more on educating individuals so that they avoid
  coming into contact with infection-causing bacteria. Because the nurse has a different purpose and audience,
  they would produce a genre focused on the general reader, like an informational health pamphlet or newspaper
  editorial. The writing styles of the biologist and nurse also differ because of their different audiences
  and purposes, even though they both study within the sciences.</p>

  <p>The rest of this chapter will help you develop strategies for using rhetorical concepts (key terms
  like audience, purpose, rhetoric, genre, and conventions) to decode or investigate discipline-specific
  writing situations. The section below defines these common rhetorical concepts and explains why these
  concepts are relevant in your discipline-specific courses. The chapter ends with another scenario: one
  that shows Angel using the knowledge in the chapter to do better on their poster assignment.</p>

  <h3>Important Concepts and Definitions</h3>

  <p>Each rhetorical concept below has a general definition alongside how the concept might be applied
  in your discipline-specific courses. These terms give us a language to talk about our writing choices
  and transfer existing writing knowledge to new contexts (Rounsaville 12).</p>

  <h3>Purpose</h3>

  <p>Every communicative act has a purpose, or an impact you would like your writing to have on your audience.
  In Angel’s case, their scientific poster was intended to communicate a research experience and its findings
  to other scientists. Your purpose can be affected by other situational details, like the topic, audience,
  and genre. Similarly, your purpose can impact your writing style and word choice (i.e., are you writing
  to inform, persuade, call to action?).</p>

  <h3>Applying Purpose to New Writing Situations</h3>

  <p>The purpose of writing in your discipline-specific courses might not always be clear through assignment
  sheets. For example, scientific posters communicate a research project—its goal, methods, data, key
  findings, and implications—in a highly visual and easy-to-read fashion. When creating a poster, you
  need to consider visual design and how your photos, graphs, and tables from the research can support
  concise writing. Too much writing, and you lose the visual appeal of the scientific poster genre. Too
  many visuals and the audience does not have enough information to know how to interpret and connect
  the visual elements.</p>

  <p>Consider how Angel and Akeelah each used visuals in their poster examples: Angel included a single,
  cartoonish visual while Akeelah included several labeled figures from her lab research. It’s appropriate
  for you to ask your professor to explain the single or multiple purposes of an assignment, either during
  class, in an email, or during office hours. You might say something like, “I know that there should
  be a specific purpose this writing assignment aims to achieve. Can you help me understand it?”</p>

  <h3>Audience</h3>

  <p>The people you are writing to engage, which in turns affects your writing style, format, and choices.
  When writing for an audience, you will want to consider their shared experiences and needs and write
  with those details in mind.</p>

  <h3>Applying Audience to New Writing Situations</h3>

  <p>Your audience can vary widely depending on the assignment. A good first question to ask is if your
  audience will be other experts in your discipline. To revisit our example, scientific posters can differ
  by their audience. Expert audiences will expect to see methods and terminology that show you are also
  an expert in their field and that your research project meets rigorous research expectations. If you
  are writing to other experts in your profession, you can use more technical language and assume a certain
  level of background knowledge. General audiences care more about the larger implications your research
  has on the general public, but they may need your help understanding the scientific concepts and terms.
  If your audience is not in your professional community, you will need to write using language and a
  style that is approachable to someone who does not have background knowledge in your discipline.</p>

  <h3>Rhetoric</h3>

  <p>The words, images, media, sounds, and body language you use to communicate your purpose to your audience.
  Choose rhetoric that will be effective and meaningful for your audience.</p>

  <h3>Applying Rhetoric to New Writing Situations</h3>

  <p>Rhetoric in your disciplinary communities includes more than written words: graphics, figures, and
  design (e.g., section headings, font size, color choice, layout) also hold value. You’ll want to remember
  this as you are investigating new genres. For example, when viewing a scientific poster, you’ll want
  to pay attention to how visuals like graphics and figures are used to communicate data as well as how
  design helps make the complex scientific topic being discussed more approachable to the audience. Further,
  when presenting your poster, your body language and oral delivery can be as influential as your word
  choice and poster design in helping your audience understand your research.</p>

  <h3>Genre</h3>

  <p>Most people think about genres that appear on their Netflix account: action, drama, documentary.
  But in writing, genres are different forms of writing. These formats have come to exist over time as
  individuals responded to the same rhetorical situation and needed to solve recurring communication problems.
  For instance, a resume is a particular genre that quickly tells an employer about your qualifications
  and background before the interview stage of hiring. You write a resume for a specific audience to achieve
  a particular purpose, persuading them to offer you an interview or job. Resumes help employers solve
  a problem: how can they review every applicant without expending too much time or labor?</p>

  <p>While genres do not have concrete rules, they do contain conventions related to their structure,
  organization, language, and style (Miller 163). My use of in-text citations throughout this chapter
  is a genre convention that has come to be associated with forms of academic writing: I am expected to
  link my thought and ideas to existing scholars on a topic. So, as I discuss genre, I cite Carolyn Miller’s
  foundational text on how genres perform social actions, but I paraphrase Miller’s point so that her
  ideas are more accessible to my chapter’s audience.</p>

  <h3>Applying Genre to New Writing Situations</h3>

  <p>Inevitably, you will encounter new genres in your discipline-specific courses: lab reports, presentations,
  memos, posters, case studies. It is important to ask questions and learn about new genres as they represent
  ways that professionals in your discourse community communicate with one another. The first time you
  complete a writing assignment in a new genre, it is common to struggle and want additional support.
  As you develop drafts of these assignments, seek out models of successful examples, feedback from peers
  and experts in your discipline (like your professor), and writing about the genre, which may exist within
  your professional community (for an example, see Andrea Gilpin and Patricia Patchet-Golubev’s A Guide
  to Writing in the Sciences or Suzan Last’s Technical Writing Essentials: Introduction to Professional
  Communications in the Technical Fields). Prof. Smith included some of these resources in her syllabus,
  but Angel had forgotten about them. You may want to refer to course documents, like the syllabus, or
  other institutional resources, like subject-librarians.</p>

  <h3>Conventions</h3>

  <p>The characteristics that an audience associates with a particular genre and thus expects to see.
  These conventions can relate to the writing’s purpose, content, structure, organization, style, tone,
  language, and formatting.</p>

  <h3>Applying Conventions to New Writing Situations</h3>

  <p>As you encounter new genres, you should ask what conventions are associated with each genre. When
  attempting to write in a new genre, you want to be aware of conventions because your audience will expect
  to see them. These might be (but are not always) described in the assignment sheet. They should be observable
  in successful examples of the genre, so look for models of the genre in which you are writing. Ask questions
  about what writing in these genres typically looks like and does and seek out examples when you can.</p>

  <p>Conventions can vary because of your audience, discipline, or culture. For instance, the conventions
  associated with a research poster can vary across disciplines: a research poster you create in a biology
  course may have different conventions than a research poster you create in a history course. While both
  will still purposefully communicate research, biologists expect concise informative writing, a straightforward
  design, and want to see scientific methods, while historians allow for more creative design with persuasive
  moments in writing and research methods drawn from the humanities. Conventions can vary across cultures
  and national contexts, too. Poster conventions that are typical for American professionals might differ
  from posters that those in the same profession in Japan or Ghana create because different cultures appreciate
  different aesthetic designs and have different ways to logically make meaning.</p>

  <p>Writers do sometimes purposefully reject conventions because they want to challenge the expected
  to impact the audience. You should always deviate from conventions intentionally. Because conventions
  come to be expected by your audience, deviating from them might leave your audience confused or questioning
  your expertise. For instance, a biologist presenting their scientific poster to an audience of high
  schoolers might reduce their technical terms and play with a more colorful, creative design. Departing
  from conventions in this case makes the information more accessible and appealing to the biologist’s
  audience and helps the biologist achieve their purpose: to engage high schoolers in learning about biology
  research.</p>

