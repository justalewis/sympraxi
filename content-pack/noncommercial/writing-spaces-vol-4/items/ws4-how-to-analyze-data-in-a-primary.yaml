  <p>Teacher Resources for How to Analyze Data in a Primary Research Study</p>

  <p>Overview and Teaching Strategies</p>

  <p>This chapter is intended as an overview of analyzing qualitative research data and was written as
  a follow-up piece to Dana Lynn Driscoll’s “Introduction to Primary Research: Observations, Surveys,
  and Interviews” in Volume 2 of this collection. This chapter could work well for leading students through
  their own data analysis of a primary research project or for introducing students to the idea of primary
  research by using outside data sources, those in the chapter and provided in the activities below, or
  data you have access to.</p>

  <p>From our experiences, students usually have limited experience with primary research methods outside
  of conducting a small survey for other courses, like sociology. We have found that few of our students
  have been formally introduced to primary research and analysis. Therefore, this chapter strives to briefly
  introduce students to primary research while focusing on analysis. We’ve presented analysis by categorizing
  data as open-ended and closed-ended without getting into too many details about qualitative versus quantitative.
  Our students tend to produce data collection tools with a mix of these types of questions, so we feel
  it’s important to cover the analysis of both.</p>

  <p>In this chapter, we bring students real examples of primary data and lead them through analysis by
  showing examples. Any of these exercises and the activities below may be easily supplemented with additional
  outside data. One way that teachers can bring in outside data is through the use of public datasets.</p>

  <h3>Public Data Sets</h3>

  <p>There are many public data sets that teachers can use to acquaint their students with analyzing data.
  Be aware that some of these datasets are for experienced researchers and provide the data in CSV files
  or include metadata, all of which is probably too advanced for most of our students. But if you are
  comfortable converting this data, it could be valuable for a data analysis activity.</p>

  <ul><li>In the chapter, we pulled from Pew Research, and their website contains many free and downloadable
  data sets (Pew Research Center).</li><li>The site Data.gov provides searchable datasets, but you can
  also explore their data by clicking on “data” and seeing what kinds of reports they offer.</li><li>The
  U.S. Census Bureau offers some datasets as well (Explore Census Data): Much of this data is presented
  in reports, but teachers could pull information from reports and have students analyze the data and
  compare their results to those in the report, much like we did with the Pew Research data in the chapter.</li><li>Similarly,
  HealthData.gov offers research-based reports packed with data for students to analyze.</li><li>In one
  of the activities below, we used Google Trends to look at searches over a period of time. There are
  some interesting data and visuals provided on the homepage to help students get started.</li><li>If
  you’re looking for something a bit more academic, the Michigan Corpus of Academic Spoken English is
  a great database of transcripts from academic interactions and situations.</li><li>Similarly, the Corpus
  of Contemporary American English allows users to search for words or word strings to see their frequency
  and in which genre and when these occur.</li></ul>

  <p>Before moving on to student activities, we’d like to offer one additional suggestion for teachers
  to consider.</p>

  <h3>Class Google Form</h3>

  <p>One thing that Melody does at the beginning of almost all of her research-based writing courses is
  ask students to complete a Google Form at the beginning of the semester. Sometimes, these forms are
  about their experiences with research. Other times, they revolve around a class topic (recently, she’s
  been interested in Generation Z or iGeneration and has asked students questions related to that). Then,
  when it’s time to start thinking about primary research, she uses that Google Form to help students
  understand more about the primary research process. Here are some ways that teachers can employ the
  data gathered from Google Form given to students.</p>

  <ul><li>Ask students to look at the questions asked on the survey and deduce the overall research question.</li><li>Ask
  students to look at the types of questions asked (openand closed-ended) and consider why they were constructed
  that way.</li><li>Ask students to evaluate the wording of the questions asked. • Ask students to examine
  the results of a few (or more) or the questions on the survey. This can be done in groups with each
  group looking at 1-3 questions, depending on the size of your Google Form. • Ask students to think about
  how they might present that data in visual form. Yes, Google provides some visuals, but you can give
  them the raw data and see what they come up with. • Ask students to come up with 1-3 major takeaways
  based on all the data.</li></ul>

  <p>This exercise allows students to work with real data and data that’s directly related to them and
  their classmates. It’s also completely within ethical boundaries because it’s data collected in the
  classroom, for educational purposes, and it stays within the classroom.</p>

  <p>Below we offer some guiding questions to help move students through the chapter and the activities
  as well as some additional activities.</p>

  <h3>Discussion Questions</h3>

  <p>1. In the opening of this chapter, we introduced you to primary research, or “any type of research
  you collect yourself” (“What is Primary Research”). Have you completed primary research before? How
  did you decide on your research method, based on your research question? If you have not worked on primary
  research before, brainstorm a potential research question for a topic you want to know more about. Discuss
  what research method you might use, including closedor open-ended methods and why.</p>

  <p>2. Looking at the chart from the Pew Research dataset, “Teens, Social Media, and Technology 2018,”
  would you agree that the distributions among online platforms remain similar, or have trends changed?</p>

  <p>3. What do you make of the “none of the above” category on the Pew table? Do you think teens are
  using online platforms that aren’t listed, or do you think those respondents don’t use any online platforms?</p>

  <p>4. Google Trends (figure 2 below) also allows researchers to look at web search data over time, by
  continent and related inquiries. On this site, we searched “teens and social media” and found another
  piece of data that shows interest over time. What does this graphic tell you? What other questions arise
  while looking at this data?</p>

  <p>Figure 2. Google Trends for “Teens and Social Media.” A line graph from Google Trends, showing how
  teen social media use has increased over time. Screenshot by authors.</p>

  <p>5. When analyzing data from open-ended questions, which step seems most challenging to you? Explain.</p>

  <h3>Activities</h3>

  <p>Activity #1: TurnItIn and Infographics Infographics can be a great way to help you see and understand
  data, while also giving you a way to think about presenting your own data. Multiple infographics are
  available on TurnItIn, downloadable for free, that provide information about plagiarism.</p>

  <p>Figure 3, titled “The Plagiarism Spectrum,” provides you with the “severity” and “frequency” based
  on survey findings of nearly 900 high school and college instructors from around the world. TurnItIn
  encourages educators to print this infographic and hang in their classroom:</p>

  <p>Figure 3. Plagiarism Spectrum. Infographic from TurnItIn illustrates the rates of student plagiarism,
  categorized by type of offense. Used with permission.</p>

  <p>This infographic provides some great data analysis examples: specific categories with definitions
  (and visual representation of their categories), frequency counts with bar graphs, and color gradient
  bars to show higher vs. lower numbers.</p>

  <p>1. Write a summary of how this infographic presents data. 2. How do you think they analyzed the data
  based on this visual? Activity #2: How Text Messages Change from Dating to Marriage In Alice Zhao’s
  Huffington Post piece, she analyzes text messages that she collected during her relationship with her
  boyfriend, turned fiancé, turned husband to answer the question of how text messages (or communication)
  change over the course of a relationship. While Zhao offers some insight into her data, she also provides
  readers with some really cool graphics that you can use to practice your analysis skills.</p>

  <p>These first graphics are word clouds. In figure 4, Zhao put her textual data into a program that
  creates these images based on the most frequently occurring words. Word clouds are another option for
  analyzing your data. If you have a lot of textual data and want to know what participants said the most,
  placing your data into a word cloud program is an easy way to “see” the data in a new way. This is usually
  one of the first steps of analysis, and additional analysis is almost always needed.</p>

  <p>Figure 4. Zhao’s Word Cloud Sampling of Zhao’s word clouds from analyzing text messages with her
  boyfriend; the larger the word, the more frequently that word appeared in the text. “Hey,” “home,” and
  “Ok” appear as frequently used words. Used with permission.</p>

  <p>1. What do you notice about the texts from 2008 to 2014? 2. What do you notice between her texts
  (me) and his texts (him)? Zhao also provided this graphic (figure 5), a comparative look at what she
  saw as the most frequently occurring words from the word clouds. This could be another step in your
  data analysis procedure: zooming in on a few key aspects and digging a bit deeper.</p>

  <p>Figure 5. Zhao’s Bar Graph of Frequently Occurring Words. Zhao’s bar graph from her word clouds to
  show the most frequently occurring words they used when dating versus when married. Used with permission.</p>

  <p>1. What do you make of this data? Why might the word “hey” occur more frequently in the dating time
  frame and the word “ok” occur more frequently in the married time frame?</p>

  <p>As part of her research, Zhao also looked at the time of day text messages were sent, shown below
  in figure 6:</p>

  <p>Figure 6. Zhao’s Plot Graph of Time of Day. Zhao created a plot graph to show what time of day they
  texted most frequently, over the time period from dating to marriage. Used with permission.</p>

  <p>Here, Zhao looked at messages sent a month after their first date, a month after their engagement,
  and a month after their wedding.</p>

  <p>1. She offers her own interpretation in her piece in figure 6, but what do you think of this?</p>

  <p>2. Also make note of this graphic. It’s a great way to look at the data another way. If your data
  may be time sensitive, this type of graphic may help you better analyze and understand your data.</p>'
