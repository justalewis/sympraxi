  <p>Teacher Resources for Writing toward Racial Literacy</p>

  <p>Overview and Teaching Strategies</p>

  <p>This essay offers an overview of why students may be encouraged to read and write about race and
  racism in the writing classroom as well as strategies for engaging critically and productively with
  such activities and assignments. This essay would be a good text to share with students early in the
  semester to provide some framing and help students to prepare themselves for the work to come.</p>

  <p>In this chapter, I suggest approaches to critical self-reflection around identity and positionality
  and offer suggestions to help students through the affective challenges of reading and writing about
  racism. I cover possible assignments such as the racial autobiography and the counter-narrative, though
  I do so broadly to ensure the assignments be adapted to fit the course, curriculum, and institutional
  context. I also address some of the ways that race and racism are already embedded in literacy practices.
  It is important to note, however, that I do not offer a comprehensive explanation of the history, societal
  functions or structures of contemporary racism and White supremacy, nor do I provide extensive unpacking
  of the racial literacy framework. As such, I suggest that teachers use this essay to supplement other
  texts (linguistic, visual, and multimodal) that offer such information.</p>

  <p>Most importantly, I advise that any teacher considering sharing materials about racism in the classroom
  first work to develop their own racial literacy in order to guide students through the processes of
  critically reading and writing about race in productive, equitable ways. This process takes time for
  teachers, just as it does for students, so it might be a good idea for teachers to practice the assignments
  and activities alongside students.</p>

  <p>I include below a series of questions that invite students to reflect upon their socially and culturally
  situated experiences and attitudes toward race and racism and to self-direct their racial literacy learning
  in and beyond the classroom. I also include a sample assignment for the racial literacy autobiography.</p>

  <h3>Discussion Questions</h3>

  <p>1. This essay opens with a story about a conversation that stalled when the writer tried to talk
  about race. Have you experienced a situation like this? What happened? How would you approach a similar
  situation if it happened today?</p>

  <p>2. In the section on critical self-reflection, the writer talks briefly about their personal experiences
  with both discrimination and White privilege. Did this story impact your attitude toward the writer
  or your engagement with the essay? If so, why do you think that happened?</p>

  <p>3. The writer explains that “racism is already embedded in our reading and writing practices.” How,
  if at all, do you think this has impacted your experiences writing in academic settings? How do you
  think this might impact the writing you do in school from now on?</p>

  <p>4. In the section on productive discomfort, the writer explains that emotions and learning are closely
  connected. Based upon your experience, which emotions have helped you as a learner? Which have interfered
  with your learning? What might “productive discomfort” look like for you?</p>

  <p>5. The writer lists six characteristics of racial literacy. How many of these were familiar to you?
  Which were new? Since racial literacy is an ongoing practice, consider developing a plan for continuing
  the practice once you’re finished with this class. Make a list of the people you can have these discussions
  with, the activities you practiced in class that you’d like to continue, and the resources (texts, social
  media accounts, in-school programs, people) you’ll turn to if you need guidance or information.</p>

  <h3>Activity: The Racial Literacy Autobiography</h3>

  <p>The racial literacy autobiography is similar to a literacy narrative. Instead of asking students
  to consider their earliest and most significant memories with reading and writing, this activity invites
  students to consider how they first learned about race and racism. The assignment is meant to invite
  critical self-reflection, so, rather than simply report upon their experiences, students should consider
  the ways in which their identities and social positionalities have contributed to the ways in which
  they decode and discuss race and racism. Here are some sample questions for students to consider, some
  of which are shared in the chapter:</p>

  <ul><li>When did you first come to learn about the concept of race? • When did you first come to learn
  about racism? How? • Was race talked about in your home? • Did you grow up near people who looked like
  you, spoke your language, or shared similar customs? • What does the word “culture” mean to you? • Have
  you ever felt out of place because of your race, ethnicity, religion, socioeconomic class (or some part
  of your “culture,” however you define that term)? What happened? • Have you ever been discriminated
  against? How so? • Have you ever discriminated against someone else? How so? Why?</li></ul>

  <p>The questions, of course, are highly customizable but should be at least somewhat open-ended to encourage
  reflection.</p>

  <p>This is best used as an informal assignment early in the semester. Depending upon the level of trust
  built with students, teachers may collect the assignment, or they may use it as an in-class free-write
  prior to a more critical discussion of positionality. Once students get to know one another, instructors
  may invite students to share their personal narratives in small groups. If this is the case, however,
  it is important that students are told beforehand that their peers may be part of the audience to ensure
  that they include only what they are willing to share. It is imperative that students are not pushed
  to share personal details pertaining to their identities or traumatic experiences with racism if they
  are not ready. Teachers can also build upon this assignment by inviting students to revise it at the
  end of the semester to incorporate some of the theory and critical framing students engage with throughout
  the semester.</p>'
