  <p>Teachers Resources</p>

  <p>Overview and Teaching Strategies</p>

  <p>Student collaboration does not have to be limited to full-fledged group projects. It can also be
  implemented at different stages of an individual project in a writing course:</p>

  <ul><li>During the invention process of an individual project: students can work in groups to brainstorm
  and pitch their individual ideas to each other. Exchanging and testing their ideas among each other
  will make the benefits of collaboration more tangible.</li><li>During the drafting and editing phase:
  creating peer review groups for students to assess each other’s drafts is another way of taking advantage
  of collaboration for improving a written piece.</li></ul>

  <p>This essay can be taught to discuss and illustrate the benefits of collaboration for any stage of
  the writing process. By giving students ways to connect the WHY of collaboration to outside contexts
  and outlining specific strategies, the chapter can be used as a means to introduce a group project and/or
  to discuss at a more general level the value of peer learning in the writing classroom.</p>

  <h3>Discussion Questions</h3>

  <p>Though collaboration is used in many classes, it often is only introduced as a method that students
  are supposed to master without really being taught HOW to collaborate. Therefore, it is essential that
  teachers address the HOW and the WHY of collaboration before asking students to develop any project
  in a group.</p>

  <p>Here are some preliminary questions to introduce and contextualize collaboration as a learning topic
  and outcome:</p>

  <p>1. What experiences do you have with collaboration? 2. What are the biggest obstacles to and disadvantages
  of collaboration? 3. What are the main benefits of collaboration? Why do you think group projects are
  assigned? What makes group projects particularly relevant in the technical writing classroom? 4. How
  would you define effective collaboration?</p>

  <p>Such an introductory discussion encourages students to share their experiences (bad or good) and
  makes collaboration not just a method but a topic and tangible learning outcome.</p>

  <p>This discussion can be supplemented with a short article on collaboration in the workplace and what
  makes teams effective (ex. The Google Aristotle Project). Doing so will help emphasize that sound collaboration
  does not just happen but needs to be taught and developed over time. Another activity that can be combined
  with this introductory discussion is asking students to do an online search on “collaborative skills”
  and describe what employers and recruiters say about it in their respective fields.</p>

  <p>Questions pertaining to specific collaborative strategies could include:</p>

  <p>1. This chapter describes specific strategies for implementing a successful collaboration. What are
  some examples?</p>

  <p>2. What is the goal of a group contract? What should it contain? 3. How can a group distribute the
  workload so that it is efficient and remains collaborative? 4. What are some communication strategies
  a team can use to resolve conflicts?</p>

  <p>By inviting students to reflect on collaborative practices (including the importance of communication),
  the chapter gives students ways to plan a project and shows them that there are specific strategies
  for making collaboration effective.</p>

  <h3>Technology Activity/Discussion</h3>

  <p>This activity can work as a complement to an introductory discussion on collaborative writing projects.
  It can also be assigned as an exercise requiring students to analyze specific writing technologies and
  identify their effectiveness in collaborative settings.</p>

  <p>1. What software programs have you used for collaborative projects? List their pros and cons.</p>

  <p>2. What are the differences between synchronous and asynchronous collaborative mode? Which technology
  can you use for each mode?</p>

  <p>3. What kind of software programs does the project require? List a few options. Test and rank them
  based on their collaborative options.</p>

  <h3>Responding to Collaboration Planning Exercise</h3>

  <p>Scenario-based exercises can also be used as application of this essay. Here is an example: a group
  of students was assigned a project requiring them to develop instructions for an online application
  of their choice. After reading the project guidelines individually, they were given time to plan their
  collaboration. Consider the following exchange:</p>

  <p>Student A. “It looks like we have a lot of leeway to choose the application we want to use. I have
  an idea that I can make work easily. I will start writing something and we can look at it during our
  next class. What do you think?”</p>

  <p>Student B: “This sounds good. I will look up images that we can use. I like doing that kind of stuff
  anyway.”</p>

  <p>Student C: “Cool! Let me know when you have something for me to look at. I’m happy to edit. Just
  let me know how I can help.”</p>

  <p>How does this initial exchange work or does not work for planning the project? What are the pros
  and cons of such an approach? Discuss these questions with two or three peers and share the feedback
  you would give to this group with the rest of the class.</p>'
