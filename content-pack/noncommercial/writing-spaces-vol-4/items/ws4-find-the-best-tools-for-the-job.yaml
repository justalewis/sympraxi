  Michigan Press, 2020.</p>

  <p>Norman, Don. Emotional Design: Why We Love (or Hate) Everyday Things. Basic Books, 2004.</p>

  <p>Wertsch, James V. Mind as Action. Oxford University Press, 1998.</p>

  <p>Teacher Resources for Find the Best Tools for the Job: Experimenting with Writing Workflows</p>

  <p>Overview and Teaching Strategies</p>

  <p>This chapter is best taught at a time when students can reflect on their writing process and personal
  approach to mediated activity. The activities ask students to reflect on a recent writing task, and
  you might assign this chapter early in the semester, after an initial informal writing assignment, or
  closer to midterm, after students have completed a more substantial assignment. We recommend that it
  follow an assignment completed outside the classroom, rather than in-class writing, so students can
  reflect on their tools, preferences, and environments.</p>

  <p>If you want to weave questions of mediation more deeply into your course, you can introduce the chapter
  early in the semester and have students revisit their workflows as they complete additional projects.
  This might lead to meaningful conversations about how certain tools work well for some tasks and not
  others, or how students have to change their workflows to match their available resources or energy
  levels at different points in the semester. Affect and motivation are important concepts for us, and
  we have tried to highlight them in the chapter. Conversations about tools and tinkering can be fun and
  useful, but we would encourage students to focus more deeply on affect and motivation—asking questions
  about how they’re working in particular ways, why they choose to do so, and how that relates to their
  feelings about writing.</p>

  <p>We have found success in asking writers to draw visualizations of their workflows (what we call “workflow
  maps”), and these maps can be a helpful introduction to mediated activity and suitable for an in-class
  assignment. We put students into groups, distribute sheets of plain printer paper and markers or colored
  pencils, and then ask students to make a list of every tool or technology they used in a recent project.
  The students should consider the breadth of their process for a project, first thinking about the tools
  used to write the first draft, then for revisions, and so on. These might include PDFs, library books,
  websites, pencils, notetaking apps, word processors, printed pages, post-it notes, napkins, personal
  computers, lab computers, smartphones—the options are endless. After the students have a list of tools,
  we ask them to draw visual representations of those tools (messy drawings are the best) and use lines
  with arrows to show how tools are connected. So if a student downloaded PDFs from the library website
  and then copied quotations from those PDFs into a Google Document, they’d draw a representation of the
  PDFs, draw a representation of the Google Document, and then draw an arrow connecting the two. They
  should try to visualize all of the tools in the list they brainstormed. Students can then share their
  drawings, which will likely remind them of similar things they did and forgot—or introduce them to new
  things they might like to try. If you’re interested in this process, we discuss it in greater depth
  in our open-access scholarly book, Writing Workflows</p>

  <p>We have also found it helpful to have students annotate these maps. You might ask them to annotate
  for “affect” by placing a smiling face next to tools they enjoy using or a frowning face by tools that
  aren’t enjoyable to use. Students can then talk in small groups about what’s enjoyable, what’s not,
  and how they might adjust their workflows accordingly. If you assign this mapping project earlier in
  the semester, you can ask students to return to it as they complete additional writing assignments.
  Students can then consider how their workflow changes based on an awareness of mediated activity and
  affect, or the demands of different writing assignments, or the challenges they face across the semester.
  This process of reading for mediated activity and preferences, mapping it, and analyzing it can help
  students better see how their tools and environments shape their writing.</p>

  <h3>Discussion Questions</h3>

  <p>1. Many writers have to work in contexts where their schools or employers require them to use certain
  tools. How might these writers avoid the feeling of friction, even when they are required to work with
  specific tools?</p>

  <p>2. This chapter asks you to experiment with an annotation workflow. Are there other readingor writing-related
  activities that might benefit from similar experimentation?</p>

  <p>3. When was the last time you read the instructions for a new device, tool, or process? Was it a
  last resort after you had already tried to do it on your own? Or did you read them beforehand? When
  does it feel “worth it” to read the instructions for a tool?</p>

  <p>4. In a writing application you use, pick a feature that you’ve not used or one that confuses you.
  Read the instructions or find a tutorial on the web that explains it or shows how it can be useful.
  Try the feature out and imagine a future scenario where you would use it.</p>'
