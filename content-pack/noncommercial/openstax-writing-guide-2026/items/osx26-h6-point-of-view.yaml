body: '<p><em>Access for free at openstax.org.</em></p>

  <h3>Point of View</h3>

  <p>Point of view refers to the vantage point from which a story, event, report, or other written work
  is told. The point of view in which you write depends on the genre in which you are writing. For example,
  you will likely use first person in personal narrative writing. For most academic writing, you’ll use
  third person. (See Editing Focus: Characterization and Point of View for a related discussion of point
  of view in narrative writing.)</p>

  <h3>First Person</h3>

  <p>In the first-person point of view, the writer or narrator (I, we) is present in the writing. First
  person is commonly used in personal writing genres, such as literacy narratives, memoirs, and profiles,
  as well as in fiction.</p>

  <p>After midnight—my paper started, my exam studied for—I leave the library and head back to my apartment.
  In the dark, I listen closely when I hear footsteps behind me, and I step to the edge of the sidewalk
  to let a man pass. At my door, I fumble for my key, open the door, turn on the light, and step inside.
  I am safe, ready to eat, read a bit, and return to my paper.</p>

  <h3>Second Person</h3>

  <p>Second-person point of view is used occasionally when an outsider (you) becomes part of a story.
  It should not be confused with a writer or speaker using “you” when directly addressing an audience
  (you). Nor should it be confused with giving instructions (drive forward, add one cup of brown sugar,
  close the door) or with its similar use in textbooks such as this one. However, second person is not
  considered appropriate in most academic writing.</p>

  <p>Writers often slip into second person when they intend to write in third person. In the example below,
  the writer starts in third person and shifts by accident to second person. To check your sentences for
  second person, search your documents for you, and revise as needed.</p>

  <p>Shift from Third Person to Second Person The federal government should raise the minimum wage because
  it has the responsibility to ensure people earn a wage you can live on. The current minimum wage, $7.25
  per hour, is not enough to pay rent, let alone support a family. Many people cannot lift themselves
  out of poverty. A higher minimum wage can help you.</p>

  <p>Revised The federal government should raise the minimum wage because it has the responsibility to
  ensure workers earn a wage they can live on. The current minimum wage, $7.25 per hour, is not enough
  to pay a single person’s rent, let alone support a family. Many people cannot lift themselves out of
  poverty. A higher minimum wage can help them.</p>

  <h3>Third Person</h3>

  <p>The third-person point of view (he, she, it, they) is customary for fiction and for academic writing,
  such as research papers, reports, visual and textual analysis papers, argumentative essays, and the
  like. Third-person point of view emphasizes the information instead of the writer.</p>

  <p>The hikers and other passive trail users argue that mountain bikes should not be allowed on narrow
  trails traditionally traveled by foot and horse. They point out that the bikes’ wide, treaded tires
  cause erosion, that the bikers’ high speeds startle hikers and horses, and that their presence on trails
  disrupts the tranquility that hikers and bird watchers seek.</p>'
