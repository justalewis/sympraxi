  <h3>Quick Launch: Consider the Angle</h3>

  <p>After completing and synthesizing your research, consider your information carefully to decide on
  the most compelling angle and supporting information for your audience. While your general angle is
  the idea of the admirable trait in relation to your subject, aim to develop a personal insight within
  that focus. Brainstorm different points you can make about the trait that may surprise and engage your
  audience. Review the table you completed for synthesizing information, and then complete a web diagram
  such as Figure 5.7 with possible ideas.</p>

  <p>After considering your notes and the completed web, decide which angle will work best. To help you
  make that decision, think about the information you have gathered so far as well as potential audience
  appeal. Review the model texts in this chapter to determine how each presents a unique angle on its
  subject.</p>

  <h3>Drafting: Finalizing and Supporting Your Angle</h3>

  <p>Remember that the writing process is recursive, meaning you will move back and forth among the steps
  in the process multiple times rather than progress through each step only once. For example, you may
  decide to conduct a bit more research while you are drafting or after you have received feedback from
  peer review. To include this new research, you may need to rearrange the structure of your draft. As
  you draft, keep focused on your angle at all times. Losing focus and including irrelevant material may
  weaken your profile and cause readers to lose interest in the subject.</p>

  <h3>Organization</h3>

  <p>As discussed in Glance at Genre: Subject, Angle, Background, and Description, profiles can be organized
  in several ways: chronologically, spatially, or topically. Review the information you inserted in reponse
  to Table 5.1, along with your admirable trait definition, to decide which organizational strategy would
  work best for your piece. Then use the following sections to organize the introduction, body, and conclusion
  of your work. When organizing your draft, think about where to place each piece of information to convey
  your points most effectively. Rather than using a strict chronological structure throughout your draft,
  you may find your piece is more effective if you begin with a topical structure and then provide some
  information chronologically.</p>

  <h3>Introduction and Thesis</h3>

  <p>Like introductions in most of the writing you do, the profile introduction establishes some background
  and context for readers to understand your main point. Think about what readers need to know in order
  to appreciate your angle, and include that information in the introduction. Some writers prefer to compose
  their introductions first, whereas others wait until after they have developed a draft of the body.
  Whichever strategy you use, be sure that the introduction engages readers so that they want to continue
  reading. Refer to the sample texts in this chapter for models of introductory texts.</p>

  <p>Remember, too, that your thesis should appear as the last sentence, or close to the end, of the introduction.
  For the profile, your thesis would be a sentence or two explaining your angle. For example:</p>

  <ul><li>[Name of subject] showed [the admirable trait] not only in [doing something that shows the trait]
  but even more so by refusing to [accept or participate in something].</li><li>[Name of subject] plays
  a unique part in the [history, life, culture] of [place, group] because [reason for angle].</li></ul>

  <p>Try one of these models, or a variation of it, as the first draft of your thesis.</p>

  <h3>Body Paragraphs</h3>

  <p>Each body paragraph should support the angle you have taken, advancing your thesis, or main point.
  For suggestions on developing body paragraphs in narrative writing, see Literacy Narrative: Building
  Bridges, Bridging Gaps and Memoir or Personal Narrative: Learning Lessons from the Personal. For each
  paragraph, synthesize details—examples, anecdotes, quotations, location, background information, or
  descriptions of events—from more than one source to support your angle. By including all of these elements,
  necessary explanations, and a combination of narrative and reporting, you will create the strongest
  possible profile piece. See the section See the section Spotlight on . . . Profiling a Cultural Artifact
  to explore examples of how these elements can work in the paragraphs of a blog post profiling a cultural
  artifact. In each paragraph, consider drawing on the following:</p>

  <ul><li>Show and Tell. In balancing between interviews and biographies, profile writers use both narrative
  and reporting techniques—that is, they both show and tell readers information about the subject. As
  you read your notes, decide which elements you will use to show readers something about your subject
  and which elements you will simply report.</li><li>Quoted Material. If your subject has said something
  in a memorable way, present their words directly to readers. Doing so increases your readers’ sense
  of the subject’s voice. • Anecdotes. Very brief scenarios or stories about something your subject has
  done, or about the subject itself, contribute to readers’ understanding. Often, anecdotes reflect field
  research, showing the subject “in action” or reflecting what others think about the subject. For example,
  Carla D. Hayden relates anecdotes about John Lewis’s actions leading 600 protesters in Selma, Alabama.
  • Background Information. You may have one or more paragraphs in which you present background information—but
  only information that is relevant to the profile. If you highlight an individual’s success or their
  contributions to society or a cause, then that person’s humble beginnings may be relevant as a contrast.
  Hayden mentions Lewis’s impoverished youth for this reason. Including background information helps readers
  place the subject in time and within their culture. • Location. Placing your subject in a setting, in
  either the past or the present, helps readers understand and visualize the subject in a particular context.
  Be sure to include location in at least one body paragraph.</li></ul>

  <p>The sample texts in this chapter provide models for you to use when developing your draft. Use a
  graphic organizer like Table 5.6 to identify the following profile genre elements in one or more of
  the model texts featured in this chapter: Annotated Sample Reading, the student sample in this section,
  or Spotlight on … Profiling a Cultural Artifact. Remember that single paragraphs often synthesize more
  than one type of information and use more than one strategy.</p>

  <h3>Strategies Used in This Chapter’s Sample Texts</h3>

  <p>Draw the reader in with a brief, compelling description of the subject. Offer quoted material. Connect
  to both current and historical contexts. Offer background information. Use narrative, or storytelling,
  techniques. Use reporting techniques, providing supporting facts and answering questions of who, what,
  when, where, why, and how. Provide a brief anecdote. Offer “thick description” from field notes. Synthesize
  information from multiple sources within a paragraph. TABLE 5.6 Strategy table</p>

  <p>Example of the Strategy That You Found in One or More Sample Texts</p>

  <p>Additionally, tone, a writer’s attitude toward their subject, is particularly important in profiles
  because it conveys authenticity to readers. If you praise a subject but your tone or attitude reflects
  detachment or lack of interest, readers will notice the discrepancy. Hayden’s attitude toward her subject,
  John Lewis, is one of respect and admiration. If you are writing about someone courageous, then your
  tone will probably be similar to hers. Remember, though, that you are the narrator, and thus you set
  the tone. If you insert quotations by people who don’t think as you do, make sure that doing so suits
  your purpose. By including information in the areas covered above and maintaining a consistent and appropriate
  tone, you will have the basis of a strong and engaging profile.</p>

  <p>Conclusion The conclusion is your opportunity to pull all the points of the essay together. Many
  writers like to restate the main point they have sustained throughout the essay in the conclusion. Another
  strong move for the conclusion is to tell readers the exigency of the piece—in other words, why the
  information is important and why they should care about it. After your introduction and body are complete,
  read through your draft; this process will often give you a sense of what still needs to be said in
  the conclusion. Refer to the sample texts in this chapter for models of conclusion paragraphs. Review
  Your Draft After you have written a rough first draft, including the introduction and conclusion, read
  the entire piece three times:</p>

  <ul><li>Revise. Read once for the big picture to judge whether you have enough content and whether the
  content is arranged in a way that makes sense. Revise your work as needed.</li><li>Edit. Read a second
  time for mid-level concerns such as sentence variety, word choice, and consistent use of tenses: Editing
  Focus: Verb Tense Consistency. Think about whether you need to break some sentences apart or combine
  some sentences for smoother flow. Follow the chronology of your profile to ensure that the narration
  stays in the present or past tense and that events are clearly set in time. Read your composition aloud
  to see whether you overuse some words. Edit your work as needed.</li><li>Proofread. After editing, read
  through a third time with an eye on small details to proofread your work. Change spelling or punctuation
  as needed to meet the expectations of the rhetorical situation. Check that you have formatted according
  to the required style guide, or standards of writing, such as Modern Language Association (MLA) or American
  Psychological Association (APA) style.</li></ul>

  <p>Revisit these three steps after you have received feedback from the peer review exercise that follows.
  If you have access to a campus writing center, you may consult with tutors there for support at any
  stage of your writing process.</p>

  <h3>Peer Review: Written Responses</h3>

  <p>After you have developed a solid draft, you are ready to receive feedback from your peers. To prepare
  for peer review, reread the assignment prompt in Writing Process: Focusing on the Angle of Your Subject
  and the assessment rubric in Evaluation: Text as Personal Introduction. Then, read your peer’s entire
  profile before giving feedback. In your feedback, strive to be both clear and kind—clearly state the
  strengths and weaknesses of the text in the most supportive way possible. If you need guidance, use
  the model sentences in Table 5.7 to structure your feedback.</p>

  <p>Peer Review Feedback Model Sentences • These three aspects of your draft work well: ________, ________,
  and ________. • You might consider strengthening your draft ________ by doing these things: ________,
  ________, and</p>

  <p>________. • As you revise your work, I suggest addressing these three areas: ________, ________,
  and ________.</p>

  <p>After reading your peer’s profile all the way through, use Table 5.8 to provide thoughtful and detailed
  feedback.</p>

  <p>Date</p>

  <h3>Review of [peer] by [insert your name]</h3>

  <p>Profile Genre Element Subject Angle Structure Paragraph Focus (anecdote, quotes, facts, background,
  and context)</p>

  <p>Tone, Tense, and Description</p>

  <h3>Feedback for Your Peer</h3>

  <p>What interests you about your peer’s subject? What information could your peer provide to deepen
  that interest?</p>

  <p>What angle has your peer taken in this draft? What suggestions do you have for refining the angle?</p>

  <p>How has your peer organized the profile? If you would recommend a different structure, what would
  you recommend, and why?</p>

  <p>Has your peer included an array of genre elements in the paragraphs? How could your peer strengthen
  this aspect of the work?</p>

  <p>Is your peer’s tone, or written attitude, appropriate for the profile? Why or why not? What suggestions
  do you have for strengthening or changing the tone? Are verb tenses consistent? If not, how might your
  peer adjust them? How might your peer show readers aspects of the subject as well as tell about them?</p>

  <p>Research</p>

  <h3>How does your peer’s draft show evidence of</h3>

  <ul><li>interview research? • field research and thick description? • credible secondary research? How
  can you tell that the secondary research is credible?</li></ul>

  <h3>Audience Additional Comments TABLE 5.8 Peer review guide</h3>

  <p>What suggestions do you have for your peer to connect better with the intended audience?</p>

