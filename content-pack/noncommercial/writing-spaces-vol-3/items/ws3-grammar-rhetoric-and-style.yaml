  search.proquest.com.ezproxy.gvsu.edu/docview/62073590?accountid=39473. Morenberg, Max. Doing Grammar.
  Oxford UP, 1997. Stewart, L. L., Beob G. Kim, B. R. Gramm, R. D. Nimmo, and H. H. Stein. “Effects of
  Dietary Carbadox on Apparent Ileal Digestibility of Amino Acids in Weanling Pigs.” American Journal
  of Animal and Veterinary Sciences, vol. 5 no. 3, 2010, pp. 168-174. https://nutrition.ansci.illinois.edu/sites/default/files/
  AmJAnimVetSci5.168-174.pdf Vault Dweller’s Survival Guide. Bethesda Softworks. 2008.</p>

  <p>Teacher Resources for Grammar, Rhetoric, and Style by Craig Hulst</p>

  <p>Overview and Teaching Strategies</p>

  <p>When I ask my students about the weaknesses of their own writing, the vast majority state that grammar
  is an issue for them. Usually what they mean is that they do not remember the rules that they were taught
  and believe that without the rules, their writing must be weak. This essay is designed to be used to
  help students understand that grammar is more than just rules. Grammar can be used as a tool to influence
  the style of the piece, and students already implicitly have some understanding of how to use it that
  way.</p>

  <p>This essay would best be used when a teacher is talking about either grammar or style. When talking
  about grammar, it could be linked with a discussion of why first year writing courses do not typically
  spend much time on the rules of grammar. When discussing style, it can be used in conjunction with understanding
  how the rhetorical situation influences style, and how grammar is one element of choosing an appropriate
  voice and style for that particular situation. It might be particularly useful when discussing revising,
  rather than drafting.</p>

  <h3>Questions</h3>

  <p>1. Before reading this piece, what was your reaction to hearing the word grammar? Did you like studying
  grammar? Did you hate it? After reading this piece, has your impression of the word changed at all?</p>

  <p>2. Has grammar only been presented to you as a set of rules before? Why do you think it was taught
  that way?</p>

  <p>3. In the personal example in the essay, the author wrote about his daughters learning to say “hold
  me” instead of “hold you” at two years old, but grammar is constantly developing as we are constantly
  developing our language. Do you remember any of the moments when you realized that the way that you
  used the language needed to be adjusted, or when you discovered that your grammar usage was not correct?
  What was it?</p>

  <p>4. For the most part, it is less important that you understand all of the rules or grammatical terms
  than it is that you can recognize when something doesn’t sound right. However, this “sounds right” part
  of grammar can trip you up if you are trying to complete grammar exercises, as that usually means that
  you are responding to usage (the way most people seem to be using the grammar) instead of correctness
  (following the rules). Usage and correctness are often the same, but many times they are not. Are there
  any times that you can remember where you were corrected for using grammar according to usage instead
  of correctness? Why do you think that the usage is different from the rule? (Note to teacher: this question
  might best be used in conjunction with a grammar exercise to illustrate the difference of usage and
  correctness, possibly followed with a discussion of the style benefits of either). 5. Choose a passage
  from an essay that you have written. What grammatical choices did you make? What choices (word choice,
  the choice to fill in a slot or not, parallel structure, etc.) did you make? Which choices did you choose
  not to make? Should/can you continue to make choices that will give your audience what they expect to
  see?</p>

  <p>Activities</p>

  <p>Rhetorical Grammar Analysis</p>

  <p>There are essays in Writing Spaces that talk about reading rhetorically (See Mike Bunn’s and/or Karen
  Rosenberg’s essays, for example). Combining this essay with one of those, ask students to look specifically
  at the grammar of a chosen piece of writing. Starting simply, ask them to look at the use of pronouns
  or contractions. What does the way that those parts of speech are used (or not used) say about the author’s
  choices, about the intended audience? Move on to modifiers and look at the use of adjectives and adverbs.
  Are they widely used or are they sparse? Are there two or three modifiers for a noun or one? What do
  those decisions say about the rhetorical situation? Choose any other element of grammar and continue
  the analysis.</p>

  <h3>Revising Grammar for Style</h3>

  <p>Have students take a paper that they are revising and have them specifically look at their grammar.
  Ask them to identify their audience and the expectations of their writing. If they have already tried
  their hands at the Rhetorical Grammar Analysis activity, they might be able to apply what they have
  learned about how the author used grammar to create an appropriate style to their own writing. Otherwise,
  ask them about the level of formality that is expected in their writing and whether or not their use
  of grammar (pronoun usage, including gender-specific pronouns; contractions; complexity of sentence
  construction; etc.) supports that. Students might choose specific sentences and rewrite them (making
  active voice passive, adding modifiers, changing the verb tense, etc.) to see how the style of the sentence
  can be altered by grammatical choices.</p>'
