  <p>Teacher Resources for “How Writing Happens”</p>

  <h3>Overview and Teaching Strategies</h3>

  <p>This essay addresses the messy realities of writing that students (and all writers) face. Contrary
  to the experiences that students may have had when preparing to write for standardized tests, writing—inside
  and outside the academy—takes on different forms, purposes, and audiences. It is also nonlinear: as
  writers, our ideas take shape and transform over time. Furthermore, writers must negotiate various social
  interactions and emotional states, all while juggling their work across a range of technological tools.
  By understanding a wider range of approaches, students will have more awareness, agency, and ownership
  of their writing processes.</p>

  <p>In first-year writing courses, this essay could be paired with reflective assignments that focus
  on the writing process, revision, and metacognition. In writing about writing-focused courses, specifically,
  the various ideas surveyed in this essay (e.g. free-writing, stance, revision) could provide a springboard
  for a literature review about composition scholarship. Instructors might consider pairing this essay
  with other Writing Spaces pieces such as “The Inspired Writer vs. the Real Writer” by Sarah Allen, “Looking
  for Trouble: Finding Your Way into a Writing Assignment” by Catherine Savini, and “Find the Best Tools
  for the Job: Experimenting with Writing Workflows” by Derek Van Ittersum and Tim Lockridge.</p>

  <h3>Discussion Questions</h3>

  <p>1. How does writing “happen” for you? Set the scene. What talk (conversations with friends, classmates,
  tutors), tools (word processing programs, writing devices), and texts (books, articles, and websites)
  are around as you write?</p>

  <p>2. Writing can be an emotional rollercoaster. What have been some of your highest highs? What have
  been some of your lowest lows? Which emotions tend to play the most significant role in your writing
  process, and why?</p>

  <p>3. We’ve suggested a handful of practical strategies, from freewriting, to reverse outlining, to
  playing “Syntax Tetris.” Which ones have you found useful, and why? Which ones are you unfamiliar with,
  and how could you use those for an upcoming writing assignment?</p>

  <p>4. Consider how you might use this article as a springboard for an extended research project (e.g.
  a literature review). Out of the many ideas that we’ve introduced in this piece—for example, managing
  emotions, and talking with Writing Center tutors—which ones strike you as the most interesting, and
  why? Formulate a research question(s) that could help you dive deeper into the Writing Studies field.</p>

  <p>5. Find someone whose writing process you’d like to learn more about. Collect some writing-related
  artifacts connected to their personal life (e.g. journal entries, “to do” lists, social media posts),
  professional life (e.g., community outreach advertisements for a public relations representative, a
  housing description for a real estate agent, or lesson plans for a teacher), or if they’re a student,
  their academic life (e.g. an in-process draft or final submission, feedback to a classmate’s draft,
  an email to members of a club/organization). Use that data to ask questions that pique your curiosity
  as it relates to how writing happens for them. That data could become the basis for what Writing Studies
  researchers call a text-based interview, and you could ask them to walk you through the various decisions
  they made while writing each of those various documents.</p>'
