  <p>GUIDING QUESTIONS</p>

  <p>What do I want readers to do while and after engaging with this writing? Where do professionals use
  this type of writing in the real world? When will I use this type of writing after graduation? How do
  my choices in writing style and design align with this writing’s purpose? What does my audience know
  about my topic? What background information should I assume they already know, and what information
  will need to be introduced or explained to them? What does my audience expect to see because of the
  genre I’m writing in? How can I meet those expectations or intentionally stray from them to achieve
  a greater rhetorical impact? What specific needs, interests, and goals do members of my audience share?
  How can my writing be designed to achieve a visual impact? Can I bold, italicize, or otherwise format
  my words for rhetorical effect? Can I break my ideas down into sections, subsections, and lists for
  brevity? What visual elements, like figures and graphs, can I include to support my audience’s understanding?
  What visual genres might be most appealing to my audience? Would they be more likely to engage with
  infographics, short videos, or one-page overviews rather than the traditional essay? What problem does
  this genre solve? What is its purpose? What similarities are shared by successful examples of this genre?
  What writing resources exist that discuss how one can approach writing in this genre? What does my audience
  expect to see because of the genre I’m writing in? How can I meet those expectations or intentionally
  stray from them to achieve a greater rhetorical impact?</p>

  <p>What expectations are identified in the assignment sheet and rubric? What conventions can I observe
  by looking at successful examples of this genre in my discipline? What does my audience expect to see
  because of the genre I’m writing in? How can I meet those expectations or intentionally stray from them
  to achieve a greater rhetorical impact? Do I want to follow the genre conventions, or should I intentionally
  subvert or deviate from them to impact my audience in a particular way?</p>

  <h3>Strategies for Approaching New Writing Situations in Your Discipline</h3>

  <p>This section will lead you through strategies that can help you intentionally apply these rhetorical
  concepts in new writing situations. Before you begin writing,</p>

  <ul><li>Carefully examine materials, like assignment sheets and rubrics. Pay attention to the purpose
  in the prompt (it can usually be identified through the verbs that are used, like “justify,” “reflect,”
  “analyze,” “research”). Nelms and Dively remind us that these verbs can take on different meanings across
  the disciplines: “research” might imply reviewing library sources in a writing course but might refer
  to data collected in a lab setting in science courses (227). When unclear, you should ask professors
  for examples and further explanation.</li><li>Identify each rhetorical concept for the assignment and
  check that what you’ve identified matches what the professor is requiring.</li><li>Genre matters! Ask
  experts to talk to you about genre conventions. If possible, locate examples of this genre from within
  your discipline and analyze the rhetorical moves that the writer is making. Then, reflect on the rhetorical
  choices you made in your draft and why you made them. Consider how you would justify why you wrote the
  project in this way if asked.</li><li>Locate resources related to writing in your discipline, like examples
  and guidebooks. Seek out feedback from your peers in the course, professor, subject-librarians, TAs,
  writing center tutors, among others.</li><li>Make a plan: when will you begin the project, how will
  you get feedback, and what resources will you draw from when you have questions? Give yourself time
  to engage in a writing process. This means you’ll need to start a project when it’s introduced to have
  ample time to revise higher-order elements like organization and structure as well as lower-order elements
  like sentence-level clarity, consistency in language, and proofreading.</li></ul>

  <p>After doing this work, I would still recommend visiting your professor during office hours to confirm
  that what you’ve found aligns with their expectations for the assignment. Coming to office hours with
  questions that have emerged from this investigatory process will show your initiative as a student while
  also ensuring you meet expectations. Remember, joining a discipline takes time. Don’t be discouraged
  if you struggle at first. Being able to use feedback to grow and learn will help you gain the disciplinary
  expertise that you need to feel more confident as a writer in this new space.</p>

  <h3>Applying These Strategies to a Scenario</h3>

  <p>Let’s revisit Angel’s story again. This time, consider what you would do if you were in their position:</p>

  <p>In BIO 2030, Prof. Smith, introduced a new assignment, a scientific poster. The assignment prompt
  asks students to communicate the research they’ve been doing in their labs to a scientific audience.
  The assignment will be due in one month but will not be worked on during the class although some of
  the readings and lectures might be relevant to the assignment. What should Angel do next? Help them
  consider the important questions they should ask as well as what resources they can locate to help them
  begin their project.</p>

  <p>What Might Angel Do Next?</p>

  <p>I hope you had some sensible advice for Angel this time around. For one, they should begin by seeing
  if there is an extended assignment sheet or rubric that they can reference to get more information on
  the purpose, audience, genre, and conventions. They should also look back to the course syllabus to
  see if additional writing resources are listed there.</p>

  <p>Next, they can locate resources and examples on scientific posters in biology. Once they feel they
  have a sense of what Prof. Smith might be expecting in this assignment, Angel could email her or visit
  office hours to make sure they are meeting her expectations. In this meeting, they should bring their
  resources and talk through them, showing Prof. Smith that they have done some initial research and found
  good examples to build from. This is a good point in the process for Prof. Smith to let Angel know if
  they are missing key assignment expectations.</p>

  <p>After Angel is confident, they can create a first draft and get feedback. Ideally, they should find
  someone familiar with scientific writing, like a peer in Biology or a writing center consultant with
  a background in STEM writing. Angel shouldn’t rely on friends without experience with scientific writing
  as their English major friend will likely be using different writing conventions than their professor
  expects. This feedback will help Angel know if what they are intending to communicate is coming across
  clearly to a real reader. As they revise, Angel could continue to use the resources they found, the
  assignment materials, and additional opportunities for feedback.</p>

  <p>Aside from potentially doing better on the assignment, Angel will feel more confident as a writer
  in biology. Also, Angel will engage in important strategies that are necessary to developing writing:
  considering genre and context, embracing the writing process, and integrating feedback. These steps
  are taken by all writers—even writers who are experienced with their professional community and its
  expectations.</p>

  <h3>Conclusion</h3>

  <p>While you have established a solid foundation through your composition course, all students, new
  professionals, even experts continue to learn about writing well beyond composition. I hold multiple
  graduate degrees in English and participate in a discipline with others who study and teach writing.
  Despite our expertise in writing studies, even we frequently commiserate that writing is a taxing and
  troublesome act.</p>

  <p>When you are adapting to discipline-specific writing, those challenges are heightened, and sometimes
  you might even experience failure in your initial attempts to write something new. Those feelings of
  confusion that might be overwhelming at first are very normal experiences! If you take the time to evaluate
  each new writing situation and apply the rhetorical concepts you have learned, you can transfer your
  writing habits and take advantage of available resources. I hope these tips prepare you to anticipate
  new writing challenges and give you some strategies for tackling them.</p>

  <h3>Note</h3>

  <p>Thank you to Noah Flood, a talented peer consultant in Auburn University’s Miller Writing Center,
  for his feedback on this chapter.</p>

