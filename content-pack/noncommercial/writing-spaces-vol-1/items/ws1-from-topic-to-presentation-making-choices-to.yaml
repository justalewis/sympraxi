  <h3>Beth L. Hewett</h3>

  <p>This exploitation took its toll on the Dionne sisters. Even after they were returned to their parents,
  there was emotional and physical discord. They left home as soon as they turned eighteen. In their adult
  lives, they entered (and exited) a convent school, refused all contact with their parents who they deemed
  as having abandoned them, married, divorced, and—began to now live together again on a single small
  monthly income under $800.00 total. In recent years, three of the surviving quintuplets (one died from
  epilepsy and another of chronic ill health and alcoholism) accused their deceased father of sexual abuse.
  In 1995, they sued the government of Ontario for the mismanagement of their trust fund and their public
  life of emotional pain (Kehoe, 1998; Webb, 2008). In 1998, they won a settlement between two and four
  million dollars—the amount was determined after the government established that the children had earned
  more than $500 million dollars in current dollars for Ontario (Fennell, 1998).</p>

  <p>Ah, but this would not happen today, some will assert. That was then—d It may be difficult to relate
  an historically distant example like the Dionne children to what can occur in the twenty‐first century.
  Yet, as multiple births become more common because of assisted pregnancies, the exploitation of the
  Dionne quintuplets can be seen as foreshadowing what can happen as mass media removes the need to drive
  hundreds of miles to see such “oddities.” Human nature has not changed much in less than one hundred
  years. During the Great Depression years and prior to World War II, people needed the excitement of
  a miraculous birth to distract them from their problems. People still are excited by the advent of multiple
  births—as evidenced by the exuberant coverage of the first born set of octuplets in 1998 and the expressed
  sorrow at the death of one of the eight. The Chukwu octuplets are now ten years old and, by all accounts,
  seem to be living relatively normal lives with their parents and grandparents (Inbar, 2009). Their stability
  might make us think that nNow, in 2009, such an exploitative situation as the Dionne quintuplets experienced
  could not happen.</p>

