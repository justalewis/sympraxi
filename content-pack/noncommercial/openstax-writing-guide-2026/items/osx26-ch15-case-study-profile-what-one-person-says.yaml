  <p>Provide detailed descriptions of what you observed and the results of your research. Include qualitative
  data based on your observations as well as quantitative data based on measurable results. Be sure to
  acknowledge what you do not know or were unable to observe. The following example illustrates a typical
  body paragraph describing a student’s use of capitalization and punctuation in text messages.</p>

  <p>Mateo’s use of capitalization and punctuation appeared to change depending on the mood he wanted
  to convey. For example, “what time do u think prof chang will let us go today”—a casual message about
  class on Tuesday—lacked capitalization and punctuation (“What time do you think Prof. Chang will let
  us go today?”). On Thursday, Mateo sent a more formal message regarding the need for the group to study
  for an upcoming exam: “Guys, we need to settle on a time and place—Oscar’s or Dawson Library—to study.”
  It’s not clear whether Mateo’s use of capitalization and punctuation is connected to his social group
  or other factors, as I had limited ability to observe the use of capitalization and punctuation by the
  study participants. However, this question is worth exploring in more detail. Using Visuals One way
  in which an oral presentation of a case study will differ from a written case study is the number of
  visuals provided. Presenters are expected to use visuals when sharing data and illustrating points.
  However, writers also use visuals to help communicate abstract ideas. In addition to images, four main
  types of graphics are used to present data: • Bar Charts. These charts typically use vertical bars to
  compare different data points. They are used primarily to compare similar groups to one another.</p>

  <p>changed over time. Line graphs are often used to show trends over a given period.</p>

  <p>express a percentage of the whole. They are used to show relationships and proportions of these parts.</p>

  <p>charts. They present data in a linear way to help people locate a specific data point easily.</p>

  <p>generalizations you can make about how students use language? What did you observe that provides
  opportunity for further study? The example conclusion from a case study on emoji below presents a theory
  on how students use them.</p>

  <p>Overall, I observed that students tend to be more informal when communicating to other students in
  the same age group. These students used emoji to communicate thoughts and feelings that differed from
  the more literal and more widely understood meaning of the emoji. I believe that students of this generation
  want to use language in a way that separates them from their older siblings, parents, and teachers.
  Thus, their use of emoji reflects that desire as they seek to change the meanings of some emoji. Whether
  this trend continues as students age is up for debate and presents an opportunity to further understanding
  of language use within this group.</p>

  <h3>Peer Review: Conferencing Electronically</h3>

  <p>After you finish your draft, receiving feedback from a peer will help you identify the strengths
  and weaknesses in your case study. Writers sometimes find it hard to view their work from the perspective
  of their audience. Therefore, peer feedback will help you focus on your writing in ways that are not
  obvious to you. Similarly, when you review your peer’s work, react to their draft as a serious and conscientious
  reader. What suggestions can you offer to make this case study more informative or something you would
  want to read?</p>

  <p>Technology has facilitated giving and receiving feedback. You are probably familiar with getting
  feedback during in-class peer reviews and conferences, but if you haven’t done so already, consider
  electronic peer reviews. Conferencing electronically offers several advantages:</p>

  <ul><li>Convenience. You don’t have to be in the same room with your conferencing partner to give each
  other feedback. Within a reasonable time frame, you can review your partner’s writing at a time that
  is convenient for you.</li><li>Time. You have more time to think about your reactions to, and your feedback
  on, your conferencing partner’s writing than you would in person.</li><li>Permanence. The feedback you
  give and receive is stored digitally and easy to access. • Shareability. Electronic feedback is easier
  to reproduce and share with others, such as an instructor or a tutor.</li></ul>

  <p>Multiple technologies exist to help you conference electronically.</p>

  <ul><li>Cloud Storage. Cloud storage providers such as Microsoft’s OneDrive and Google Drive store files
  on the Internet. You can access these sites from any device. Sharing, too, is easier because changes
  to the document are saved automatically. Therefore, every time you or someone else accesses the document,
  they are viewing the latest version.</li><li>Word Processors. Microsoft Word and Google Docs have review
  features such as comment boxes and Track Changes as well as the capacity to suggest, accept, and reject
  changes.</li><li>Collaboration Platforms. Slack, Google Hangouts, Zoom, and Microsoft Teams allow you
  to create a space where you can communicate with people in a shared online workspace. Features of collaboration
  platforms include file sharing and storage, chat, video conferencing, and task organizing.</li></ul>

  <p>When you are assigned a partner, open their draft and begin reviewing it. The following tutorial
  will explain how to use the review features of Microsoft Word. Other Microsoft Office and non-Office
  products (Google Docs and Apple’s Pages) offer similar commenting and markup features.</p>

  <p>1. Open the document you want to review, and click the Review tab above the tools ribbon. 2. Read
  the draft as you normally would, looking for areas to comment on. Note the places where you can provide
  positive comments as well as possible places for revision. 3. To add a comment, highlight the word,
  sentence, or phrase to which you want to add a comment. 4. Click New Comment in the tools ribbon to
  create a comment box in the margin.</p>

  <p>5. Type your comment in the box. 6. Click anywhere outside the box to save the comment. 7. To delete
  a comment, click inside the comment box, and then click Delete next to or beneath New</p>

  <p>Comment in the tools ribbon. Specific Comments Provide specific comments when reviewing your peer’s
  draft. Vague, general comments such as “revise this” don’t explain the reason for revision or how to
  revise. When conferencing electronically, specificity is even more important because what you write
  might be the only feedback your peer receives, unless you conference over video chat. Comments can generally
  be categorized as vague, somewhat helpful, and specific and clear.</p>

  <ul><li>Vague comments might offer praise that doesn’t point to anything specific about the writing,
  or they might offer criticism without providing a suggested revision or explaining why something should
  be revised. For example, a comment such as “Revise this sentence” is not helpful. Although it specifically
  identifies the sentence as needing revision, it doesn’t indicate why or suggest how to revise.</li><li>Somewhat
  helpful comments are still general, but they comment on something specific about the writing. They may
  also suggest some direction for a revision. For example, a comment such as “Revise this question so
  that it’s more debatable” identifies the aspect that needs revision and briefly explains why. However,
  it does not provide further details about why the question is not debatable or how to revise it.</li><li>Specific
  and clear comments identify precisely why the writing is good or needs revision. They also suggest a
  specific revision or revision strategy the writer can use. For example, “I think this question could
  be more debatable. ‘Do college students struggle with time management skills?’ is a yes-or-no question
  and would not lead to a strong argument either way. A better question could be ‘How does lack of time
  management skills affect college students as a whole?’ or ‘What should be done about students’ lack
  of time management skills?’”</li></ul>

  <h3>Revising: Accepting and Rejecting Suggestions</h3>

  <p>After your partner finishes reviewing your draft, you will need to accept or reject their suggested
  changes. Use the image below to locate the tools in Word you will need to use. You can accept or reject
  edits to the wording, edits to the formatting, and comments in the margins.</p>

  <p>tools ribbon. 2. To ensure that changes you make to the document will not be saved as edits, go to
  the tools ribbon, and toggle Track Changes to off. 3. To open a panel that displays all changes, click
  Reviewing or Reviewing Pane in the tools ribbon. 4. To navigate to a specific revision, click the revision
  in this panel. 5. To navigate consecutively through changes, click the Previous and Next buttons beside
  the Accept and</p>

  <p>Reject options in the tools ribbon. 6. To accept a revision, click Accept in the tools ribbon. 7.
  To reject a revision, click Reject in the tools ribbon. 8. The arrows below or beside the Accept and
  Reject buttons open drop-down menus that give you the option either to accept or reject a change and
  then move to the next revision or to accept or reject all changes at once. Be careful not to accept
  or reject all changes without addressing each one individually. 9. When you finish, be sure you have
  accepted or rejected all of the edits and deleted all comments so that they don’t appear in the final
  draft. 10. Check that no red text remains in the paper and that no comments remain in the right margin.
  11. When you are finished, be sure to save your changes.</p>

  <h3>Sharing Your Work</h3>

  <p>Seek out a student conference or publication to present your case study. Many colleges host events
  and conferences to showcase student work. Your teacher or advisor can probably direct you toward opportunities
  to present your work at your college or in the community. For example, the University of Central Oklahoma
  hosts the annual Language and Linguistics Student Conference (https://openstax.org/r/languageandlinguistic),
  which is open to all undergraduate and graduate students. Presenting at a student conference is a great
  opportunity not only to share your work but also to network and gain experience that will make you stand
  out when applying to other schools, for scholarships, and for jobs.</p>

  <p>In addition, a number of academic journals publish student research. For instance, Spectrum (https://openstax.org/r/spectrum),
  sponsored by the University of Alberta, is a student-run interdisciplinary journal that showcases students’
  work. See more undergraduate publishing opportunities provided by the Council on Undergraduate Research
  (https://openstax.org/r/ugjournalslisting).</p>

  <p>If you publish or present your case study, remember to adhere to ethical standards. As explained
  in Tracing a Broad Issue in the Individual, many universities and professional organizations will provide
  guidance on what standards to follow when conducting a case study. Be sure to review these guidelines
  with the organization sponsoring the conference or publication.</p>

  <p>Another option for sharing is to gather the case studies done by all class members and, with the
  approval of your instructor, go through them to ascertain what, if any, trends emerge. If you and your
  classmates think these studies might be useful to college administrators, consider sending them, along
  with a detailed cover letter, to the Office of Admissions, the Dean of Students, or another appropriate
  administrative office.</p>

  <p>15.6 Editing Focus: Words Often Confused</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Define and give examples of homonyms, homographs,
  and homophones. • Demonstrate correct use of commonly confused words.</p>

  <p>When writing about language, you don’t want to make the mistake of misusing language. Homonyms are
  words that sound the same and are spelled the same but have different meanings. Homographs are words
  that are spelled the same but may sound different and have different meanings. Homophones are words
  that sound the same but might have a different spelling, a different meaning, or both. Because they
  sound the same, they are often confused. Other words frequently confused sound slightly different and
  have slightly different spellings. It’s important to recognize and correct commonly confused words because
  spell checkers don’t always catch these errors.</p>

  <h3>Homonyms</h3>

  <p>Because homonyms’ spelling and pronunciation are the same but their meanings are different, you probably
  don’t have to worry about misusing them, although they often belong to different parts of speech. However,
  some awareness of homonyms and their multiple meanings will help ensure that your language is precise.
  For more information about homonyms, see “Words and Language.”</p>

  <p>Here are some common homonyms and their meanings:</p>

  <p>band</p>

  <p>Verb: to come together Noun: group of musicians</p>

  <p>Verb: to move back and forth rock</p>

  <p>Noun: hard material found in the earth</p>

  <h3>Verb: to become sleepy or lose energy tire</h3>

  <p>Noun: ring-shaped rubber component that fits over the wheel of a vehicle</p>

  <p>Noun: flow of water or electricity current</p>

  <h3>Adjective: up to date train</h3>

  <p>Verb: to teach or learn through practice Noun: group of connected railroad cars</p>

  <p>Homographs</p>

  <p>Homographs have the same spelling but different meanings. They are considered different from homonyms
  because they may be pronounced differently. Some disagreement exists among scholars as to whether pronunciation
  must be different for a word to be considered a homograph. Some experts insist that origins must differ
  as well. However, all agree that meanings differ. For more information about homographs, see Words and
  Language.</p>

  <p>Here are some common homographs and their meanings:</p>

  <p>Noun: a metal (pronounced led) lead</p>

  <p>Verb: to be at the front, to guide (pronounced leed)</p>

  <p>Verb: to bend forward</p>

  <h3>Noun: a position in which one bends forward bow</h3>

  <p>Noun: the front of a ship Noun: a type of knot (pronounced boh)</p>

  <p>Noun: a material item; a grammatical term (accent on first syllable) object</p>

  <p>Verb: to express disapproval (accent on second syllable) close</p>

  <p>Adjective: near (s pronounced like ss) Verb: to bar passage; to shut down (s pronounced like z)</p>

  <p>Noun: 60 seconds (pronounced minit) minute</p>

  <p>Adjective: tiny (pronounced my-noot or my-nyoot)</p>

  <h3>Homophones</h3>

  <p>Homophones are words that are spelled differently and have different meanings but sound the same.
  Homophones are often the words that cause the most confusion and the most frequent errors. For more
  information about homophones, see Words and Language.</p>

  <p>Here are some common homophones and their meanings:</p>

  <p>weather/ whether meat/meet hear/here two/too/to</p>

  <p>Weather means the conditions outside, such as temperature and sunshine. Whether is a conjunction
  that joins words or other parts of a sentence.</p>

  <p>Meat is animal-based food. When you meet someone, you encounter or get together with that person.</p>

  <p>Hear is what you do when you listen to music. Here is a place nearby.</p>

  <p>Two is a number, more than one and less than three. Too may mean “also,” or it may mean “very” or
  “more (adjective) than desired.” To is a preposition indicating direction or motion, as in “I wrote
  to the manager after I’d gone to the office.”</p>

  <p>The following homophones are often confused. Note that one of each group is a contraction: two words
  shortened and joined by an apostrophe.</p>

  <p>their</p>

  <p>Possessive pronoun, belonging to them: “The family packed their suitcases for their vacation.” Both
  the suitcases and the vacation belong to the family.</p>

  <p>Contraction joining they and are: “They’re leaving for the airport at 10:30.” In other words, they
  are they’re leaving.</p>

  <p>Referring to a location: “‘Baggage claim is over there,’ the airport worker said while pointing to
  the there baggage carousels.” This form indicates a physical place.</p>

  <p>Possessive pronoun, belonging to you: “Your new phone will be mailed on November 4.” The phone your
  belongs to you.</p>

  <p>Contraction joining you and are: “You’re registered for the conference.” In other words, you are
  you’re registered.</p>

  <p>Possessive pronoun, belonging to it: “Its positive qualities outweigh its negative ones.” Both the
  positive its and the negative qualities belong to it. It could be a book, house, car, movie, phone,
  or any other object or idea.</p>

  <p>it’s</p>

  <p>Contraction joining it and is: “It’s raining today.” In other words, it is raining.</p>

  <p>What Is the Effect? Or Is It Affect?</p>

  <p>One final category of commonly confused words are words that sound and look similar but have different
  meanings.</p>

  <h3>Affect</h3>

  <p>Verb: to influence an outcome: “Increasing the minimum wage will affect the incomes of millions of
  Americans.”</p>

  <p>Noun: body language that accompanies an expression of emotion: “The crime victim showed normal reactions
  and affects.”</p>

  <h3>Effect</h3>

  <p>Noun: the outcome or result of an influence: “The effect of the increased minimum wage will be a
  10 percent decrease in the federal poverty rate.”</p>

  <p>Verb: to cause to come into existence: “Congress will effect the new law.”</p>

  <p>Verb: to protect against damage or loss: “Homeowners must insure their property for the cost of full
  Insure replacement.” Verb: to make certain of: “This policy will ensure that the bank doesn’t incur
  a loss as a result of Ensure irreparable damage to the home.” TABLE 15.7</p>

  <p>Practice</p>

  <p>Choose the correct word to complete each sentence.</p>

  <p>1. Can you (hear/here) the phone ring from (hear/here)? 2. Are you going (to/too/two) the movie theater
  at (to/too/two) p.m., or is that (to/too/two) early for you? 3. This show always has a depressing (affect/effect)
  on me. 4. (Its/It’s) hard to find small apartments for rent in this neighborhood. 5. Let’s (meet/meat)
  at the pizza place so that I can eat something without (meet/meat). 6. Although it will need work, (its/it’s)
  basic structure is sound. 7. Check about (ensuring/insuring) personal items in your apartment. 8. You
  can set the groceries on the table over (their/there/they’re). 9. I’m going to watch the game at (their/there/they’re)
  house. 10. How do you think the elections will (affect/effect) the neighborhood? 11. (Their/There/They’re)
  listening to music on (their/there/they’re) headphones. 12. (You’re/Your) going to trip if you don’t
  tie (you’re/your) shoelaces. 13. Bring (you’re/your) phone to the store to exchange it for a new one.
  14. (Weather/whether) we travel depends on the (weather/whether).</p>

  <p>15.7 Evaluation: Presentation and Analysis of Case Study</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Revise writing to follow the genre conventions
  of case studies. • Evaluate the effectiveness and quality of a case study report.</p>

  <p>Case studies follow a structure of background and context, methods, findings, and analysis. Body
  paragraphs should have main points and concrete details. In addition, case studies are written in formal
  language with precise wording and with a specific purpose and audience (generally other professionals
  in the field) in mind. Case studies also adhere to the conventions of the discipline’s formatting guide
  (APA Documentation and Format in this study). Compare your case study with the following rubric as a
  final check.</p>

