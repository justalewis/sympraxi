  <p>Teacher Resources</p>

  <p>Overview and Teaching Strategies</p>

  <p>While presentation skills are typically taught in later technical writing classes, once students
  have learned the foundation of technical writing and have developed their confidence as higher education
  students, they can be taught in an introductory class.</p>

  <p>Ideally, students will have studied introductory topics such as writing style, tone, and layout and
  prepared other types of written documents before. It is also helpful if students have learned a bit
  about the profession, in terms of the kinds of duties and tasks that technical writers typically perform
  and how they might have to produce any kind of content for a technical or scientific organization.</p>

  <p>One of the key messages from this chapter is that a presentation is often an extension of another
  technical writing product and that students need to think carefully about the audience and the goal(s)
  of the presentation, to ensure the content is tailored to that audience and meets the intended goals.
  This chapter highlights all the essential steps that students need to follow when planning, designing,
  and delivering a presentation, with reference to practices that are also important in other types of
  content development projects.</p>

  <p>If presentation skills are to be taught in an introductory course, instructors may wish to reference
  this essay in the latter half of the course and ask students to develop a presentation that showcases
  how they approached an earlier assignment (e.g., how they approached a brochure or user manual assignment).
  In doing so, students will not only develop their presentation skills, they will also have a tangible
  goal for the presentation. The appendix provides a checklist that students can use when designing, developing,
  and delivering their own presentations.</p>

  <h3>Discussion Questions</h3>

  <p>To engage your students with the ideas discussed in this chapter, consider having them address—individually,
  in small groups, or as an overall class—the following questions:</p>

  <p>1. Thinking back to presentations (including classes) you’ve attended in the past, which presentations
  stood out as being effective (or ineffective)? Why do you think they were effective (ineffective)?</p>

  <p>2. How do you think a presentation to a live, in-person audience would need to differ from a technical
  report about the same topic? Elaborate on your answer.</p>

  <p>3. Which writing and formatting considerations apply to both written documents and oral presentations?</p>

  <p>4. What kind of accessibility issues might you encounter when giving a presentation, assuming a mixed
  audience? Can you think of any practical ways to minimize those issues?</p>

  <p>5. Given the various presentation and interaction styles presented in this chapter, which style(s)
  would you choose to adopt, and why?</p>

  <p>6. What kinds of technology and room issues might you need to consider when planning your presentation?
  How might you prepare for, and deal with, unexpected glitches?</p>

