  <p>8.8 Spotlight on … Discipline-Specific and Technical Language</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Explain the role of discipline-specific and technical
  language in various situations and contexts. • Implement purposeful shifts in voice, tone, level of
  formality, and word choice. • Pursue options for publishing your report.</p>

  <p>Proficient report writers in all academic disciplines and professions use language that is clear,
  direct, economical, and conventional. Moreover, they often use a specialized vocabulary to convey information
  to others in their field. These technical words allow specialists to communicate precisely and efficiently
  with other experts, but such terms can be confusing to nonspecialists. The following guidelines can
  help you shape the language of a report in a social science, natural science, or technical field:</p>

  <ul><li>Define disciplinary and technical terms. For example, in a report about computer storage, you
  might need to define terms such as kilobyte, terabyte, gigabyte, and megabyte. In the following example,
  the writer defines these terms.</li></ul>

  <p>Computer storage space is measured in units called kilobytes (KB). Each KB equals 1,024 “bytes,”
  or approximately 1000 single typewriter characters. Therefore, one KB equals about 180 English words,
  or a little less than half of a single-spaced typed page, or maybe three minutes of fast typing. One
  terabyte (TB) is 1024 gigabytes (GB), one GB is 1024 megabytes (MB), and one MB is 1024 KB.</p>

  <ul><li>Write out full names the first time you use them, followed by abbreviations or acronyms in parentheses.
  Then you can use the abbreviation or acronym throughout the rest of the report. For example, write out
  U.S. Department of Agriculture (USDA) or Occupational Safety and Health Administration (OSHA) the first
  time you refer to it, and use USDA or OSHA subsequently. In the previous example about computer storage,
  the writer used the abbreviations for KB, TB, GB, and MB after writing out the full words. The sentence
  below, from Trevor Garcia’s report, gives another example: After the first U.S. coronavirus case was
  confirmed in 2020, the secretary of the Department of Health and Human Services (HHS) was named to lead
  a task force on a response, but after several months he was replaced when then vice president Mike Pence
  was officially charged with leading the White House Coronavirus Task Force (Ballhaus &amp; Armour, 2020).</li><li>Write
  in third-person point of view. Third-person point of view will help you use objective language that
  is free of value judgments and emotional responses, as demonstrated in the following examples: The causes
  of obesity are complex and involve multiple factors, including genetics, underlying health conditions,
  cultural attitudes toward food and exercise, access to healthy food and health care, safe outdoor spaces,
  income, and leisure time.</li></ul>

  <p>The survey respondents self-identified as cisgender female (153), cisgender male (131), gender nonbinary
  (12), and transgender (4).</p>

  <ul><li>Consider occasional use of the passive voice. Traditionally, writers in the sciences and technical
  fields have used the passive voice for objectivity and neutrality. In the passive voice, the subject
  of the sentence is acted upon; in the active voice, the subject acts. Increasingly, scientific and technical
  writers use the active voice in the introduction and conclusion sections of reports, which are more
  interpretative. They use the passive voice in the method and results sections, which are more straight-up
  reporting.</li></ul>

  <p>Notice that by using the passive voice, the writer is able to avoid naming the person or group who
  conducted the survey. The passive voice is a technique that writers often use when they don’t want to
  make the name of an individual or group public. See Clear and Effective Sentences for more on passive
  and active voice.</p>

  <p>Passive voice: A survey of 300 students was conducted at a large state university in the southern
  United States.</p>

  <p>Active voice: We conducted a survey of 300 students at a large state university in the southern United
  States.</p>

  <ul><li>Pay attention to the details of meaning, grammar, punctuation, and mechanics. Each discipline
  values precision and correctness, and each has its own specialized vocabulary for talking about knowledge.
  Writers are expected to use terms precisely and to spell them correctly. Your writing will gain greater
  respect when it reflects standard grammar, punctuation, and mechanics.</li></ul>

  <h3>Publish Your Report</h3>

  <p>Now that you have completed all stages of your report, you may want to think about sharing it with
  students at your school or other colleges. Your college may have a journal that publishes undergraduate
  research work. If so, find out about submitting your work. Also, listed here are some of the many publications
  that feature undergraduate student research. Check them out.</p>

  <ul><li>Papers &amp; Publications: Interdisciplinary Journal of Undergraduate Research (https://openstax.org/r/
  papersandpublications) (accepts work from students in the southeastern United States)</li><li>Journal
  of Undergraduate Research (https://openstax.org/r/journalofugresearch) (peer-reviewed undergraduate
  journal; accepts research work in all subjects)</li><li>Journal of Student Research (https://openstax.org/r/journalofstudentresearch)
  (accepts student work from high school through graduate school)</li><li>Crossing Borders: A Multidisciplinary
  Journal of Undergraduate Scholarship (https://openstax.org/r/ crossingborders) (published at Kansas
  State University; accepts student research in all disciplines from undergraduates throughout the country)</li><li>1890:
  A Journal of Undergraduate Research (https://openstax.org/r/1890UGresearch) (accepts undergraduate works
  of research, creative writing, poetry, reviews, and art)</li></ul>

  <p>8.9 Portfolio: Evidence and Objectivity</p>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Write about the development of your composing processes. • Write about how composing processes
  affect your work. • Write about your objectivity as a writer. As you complete your report, think critically
  about your writing process. Watch An Introduction to Reflective Writing (https://openstax.org/r/anintroductionreflectivewriting),
  and reflect on what you created from the first step of discovering ideas to the last steps of composing
  and editing the final draft.</li></ul>

  <h3>Reflective Task: Lessons Learned</h3>

  <p>As you add your analytical report to your portfolio, write either a cover letter or a journal entry
  in which you respond to the following questions:</p>

  <ul><li>How did you choose the topic for your report? Did you have to narrow or expand it? • What methods
  did you use to gather ideas about your topic? What outside sources did you consult to gather information
  about your topic? • How did you settle on your thesis? Did you rewrite it multiple times? • What strategies
  did you use to organize your report? • What strategies did you use to develop paragraphs? What difficulties,
  if any, did you encounter? • How challenging was it for you to adopt an objective stance? Did you recognize
  your own biases? Was it difficult to write in third-person point of view? • How did input from peers
  and other readers affect your drafting and revision processes? What specific constructive criticism
  did you receive that helped you? • In what ways was this report easier or harder to write than other
  papers you have written? • What could you have done differently to make writing your report easier or
  more effective?</li></ul>

