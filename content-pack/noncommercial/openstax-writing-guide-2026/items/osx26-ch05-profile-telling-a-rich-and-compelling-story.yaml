  <p>Ironically, Kandy bought a tanning salon in hopes of opening a video store. At the time, there was
  a much higher demand for rentals in almost every community, and Toad Frog Alley was no exception. Though
  she admits tanning has increased over the years (with rentals, of course, declining), to Kandy, tanning
