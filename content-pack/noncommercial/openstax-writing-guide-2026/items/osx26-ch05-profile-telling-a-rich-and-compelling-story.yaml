  <h3>Revising: Incorporating Written Responses</h3>

  <p>After you have received feedback from your peer(s), read it carefully. If you have received feedback
  from more than one peer, strongly consider addressing comments on which they agree. If you have received
  comments encouraging you to make revision, editing, and proofreading changes, prioritize revision—making
  major changes in content, structure, and organization. You may need to add, delete, or rearrange information
  or the way in which you present the material. You may rearrange information within paragraphs or add
  topic sentences if needed. Much of the feedback your peers give you based on the form above will probably
  fit into the category of revision.</p>

  <h3>Evaluate Yourself</h3>

  <p>Another way to approach revision is to compare and contrast your work against the rubric for the
  assignment in Evaluation: Text as Personal Introduction, which guides you through the process of evaluating
  your work using the standards given in the assignment rubric.</p>

  <p>Use the Rubric to Improve Your Draft • Review the benchmarks for “Skillful” Critical Language Awareness,
  and then make notes on your draft in response to the following questions: ◦ Have you carefully proofread
  your work to check especially for issues of subject-verb consistency? ◦ Look at your sentence structures.
  Do you have sentences of different lengths and complexities in your text? Where might you improve the
  sentence variety throughout your draft? ◦ Do you meet or challenge conventional expectations in rhetorically
  challenging ways?</p>

  <ul><li>Review the benchmarks for “Skillful” Clarity and Coherence, and then answer the following questions:
  ◦ How might you revise the structure of your draft even more effectively? Should you consider reordering
  any elements or information? ◦ Review your body paragraphs. Do you have a good balance of anecdotes,
  quotations, location, thick description, and background? If you have overused or omitted any of these
  elements, revise accordingly, making sure that ideas flow smoothly. ◦ Where could you strengthen the
  use of interview research and field notes? Do you need to gather additional material? ◦ Where could
  your secondary research better support the points you make throughout the draft? Do you need to gather
  additional secondary research? ◦ Do you include elements of narrative, or storytelling, that help readers
  imagine the spaces or actions you cover? Where could you strengthen the narrative? ◦ Do you include
  elements of reporting, or relaying information to readers? Where does this strategy need strengthening?
  ◦ Have you used appropriate transitions to ensure coherence and connect ideas? ◦ Do all your points
  support your thesis?</li><li>Review the benchmarks for “Skillful” Rhetorical Choices, and then answer
  the following questions: ◦ Think again about your subject choice. You should probably not consider changing
  your subject at this stage of your project, but do think about this question: Are you presenting the
  subject in the best light to appeal to your audience? ◦ Think again about your angle. Do you need to
  refine or amend your angle to better connect with your audience? ◦ Read your piece out loud to check
  the tone. Do you need to shift the tone to better reach your audience? ◦ Read your piece all the way
  through, noting places that do not hold your interest as strongly as others. What can you do to make
  those places more compelling for your reader?</li></ul>

  <p>Use your notes from this worksheet to revise, edit, and proofread your work.</p>

  <h3>Revised Draft Profile Sample</h3>

  <p>This section provides one example of a revised profile draft written by a first-year college student.
  As you will read, the admirable quality that Houston Byrd focuses on in this essay is that his subject,
  a bricks-and-mortar video store, offers “a crucial and important service to its community.” You will
  also see the ways in which Byrd both “shows and tells” readers about his subject, offering information
  drawn from each type of required research: interview, field observation, and secondary sources. Byrd
  has chosen to insert himself and his experiences of his subject fully into this profile. Review Glance
  at Genre: Subject, Angle, Background, and Description, and then read Byrd’s essay to see how well he
  incorporates the narrative and reporting profile genre elements in his draft.</p>

  <p>After Byrd received peer feedback, he decided that his previous draft did not need much revision;
  he was happy with his structure, and the organization made sense to his readers. One peer suggested
  that Byrd insert topic sentences in each paragraph, but he ultimately decided not to do so because he
  thought his paragraphs held together well as written. As you revise your work in response to peer feedback,
  you may also choose to accept some suggestions while rejecting others.</p>

  <p>Byrd paid close attention to peer feedback indicating that his draft had many long, complicated sentences;
  in the draft below, the originals are noted after the edited sentences. He also acted on feedback about
  verb tense consistency. Furthermore, Byrd made proofreading changes, such as adding the MLA-required
  right header and changing the placement of some punctuation marks. As with all writing, this draft could
  be improved even more with further revision. After reading the essay, discuss with a peer the revision,
  editing, and proofreading changes you would recommend if you were reading this draft for peer review.</p>

  <h3>Heaven Is in Toad Frog Alley</h3>

  <p>The realm of physical film, if not already dead, is dying. More so than decaying cellulose, the entire
  medium as an art form is declining. According to The Guardian, DVD and Blu-Ray sales were down this
  past holiday over 30% each (Sweney). Some say that streaming services and on-demand viewing are the
  culprits. Whatever the case, the answer is not so simple, and the notion is very alarming. The decrease
  in relevance of physical media is no secret. Mass closures of video rental powerhouses such as Blockbuster
  Video and Movie Gallery began at the turn of the decade.</p>

  <p>The original sentence read: It is no secret that physical media has been on the decline, especially
  with the mass closures of video rental powerhouses such as Blockbuster Video and Movie Gallery near
  the beginning of the decade. This example demonstrates a pattern throughout the revised draft in which
  Byrd broke apart some of his longer sentences and improved their wording. Notice that he changes tense
  in the last sentence for a reason: the trend is happening now, but video rental stores began closing
  in the past.</p>

  <p>Though the memory lives on in millennial nostalgia, the world of physical movie sales is not completely
  irrelevant. Many of the large rental chains have since closed down, but beyond the major highways is
  an all-butforgotten world of local video stores. In my home state, one store in particular, called Toad
  Frog Alley Videos, lives in that world, located in the small town of Cleveland, Alabama. I had the privilege
  of visiting the store and speaking with its owner, Kandy Little, about her experiences operating in
  a time when physical media is scarce. Through my visit and conversation, I have come to appreciate the
  importance of Toad Frog Alley Videos. I truly believe that the store provides a crucial and important
  service to its community, as well as highlights the nature of physical film and the need for preservation.</p>

  <p>In this introductory paragraph, Byrd establishes the stakes for his profile subject, offering both
  background and context for understanding the video store’s importance to its community. He also makes
  some editing and proofreading changes to strengthen the draft and presents his main point, or thesis,
  here at the end of the introduction.</p>

  <p>Miles off of I-65, a major Alabama interstate, Toad Frog Alley stands, an almost well-kept secret.
  The idea of such a welcoming business being hidden saddened me—and still does—but in turn gave the illusion
  of adventure. Driving through winding county roads to get there, I could feel the world almost disappearing
  into unexplored territory.</p>

  <p>Original: There is a moment, winding through country roads, where the world seems to disappear into
  unexplored territory. Byrd corrected the sentence to get rid of a “there is” construction, a dangling
  modifier, and inconsistent verb tenses.</p>

  <p>Suddenly, there were no street names, no lines on the pavement, and sometimes no pavement at all.
  At the end of one of these “not much of a road” roads stood Toad Frog Alley Videos. Byrd changed the
  underlined verb from is to stands for a more vivid verb. He then changed it to the past tense to maintain
  consistency with the verbs he uses in relating his visit to the store. My first impression stepping
  inside was awe. Shelves lining the walls reached from floor to ceiling, each packed full of titles,
  perfectly alphabetized and separated by genre. Original: Lining the walls were shelves that reached
  from floor to ceiling. Each shelf was completely full of titles, which were perfectly alphabetized and
  separated by genre. In this case, Byrd combined, rather than separated, sentences to avoid repetition,
  substitute more active verbs, and vary sentence structure. Between the walls were standalone shelves,
  organized in the same fashion. I expected a kind of personal collection, but I felt as if I had actually
  traveled back in time to the major rental stores of old (or rather of ten years ago). To community members,
  the setup meant another option for Saturday night, but for a film lover like me, Original: for me, a
  film lover, this place was heaven. In the body of his draft, Byrd advances his thesis, drawing on information
  from each of the required types of sources. After my initial feelings, I was hit with a second wave,
  one that can only be described as abysmal. At the front of the store was a counter, being worked by
  one employee. The register was clunky and archaic, which made Original: something that makes a public
  library look like the headquarters of Google. In the center of the store was a foldable table that read
  “FOR SALE.” On the table lay DVDs, either damaged or unwanted, strewn about with no rhyme or reason.
  Original: The table was filled with DVDs, some damaged and some unwanted, strewn about with no rhyme
  or reason like the rest of the store. Aside from me, there was only one patron, a middle-aged woman,
  shopping as if she had been there before but did not know what she wanted. I started to become depressed.
  I was not sure exactly what I had imagined, but I knew this place was nowhere close. I had convinced
  myself I was on a journey to find the “last great video store,” an oasis of film, flowing with patrons
  renting Milk and American Honey. Original: I did not know what exactly I had imagined, but with my passion
