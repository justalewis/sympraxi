  <p>Discussion Questions</p>\n<p>1. What is your current understanding of “good writing” and “a good\
  \ writer?” What does “good writing” sound, look, and feel to you? And what do you think has shaped your\
  \ current understanding? How do you think your understanding influences the way you approach your writing\
  \ assignments in our/other classes?</p>\n<p>2. Reflect on your experiences across different languages\
  \ (e.g., Englishes, Spanishes, Black Languages, etc.) How are your relationships, experiences, and practices\
  \ of these languages similar or different? What do you think shapes these different relationships, experiences,\
  \ and practices?</p>\n<p>3. Think about your last writing assignment. What was your process like? Who\
  \ did you think about? What did you pay attention to? What did you particularly consider throughout\
  \ the process?</p>\n<p>4. Think back to a time when writing felt good, when communicating with someone\
  \ felt comforting. Who were you writing to or communicating with? You can go back as early as primary\
  \ school.</p>\n<p>5. Imagine if none of the writing assignments in college were ever graded or read\
  \ by your instructor, what would you like to communicate to the world? As you think about the people\
  \ in your life and the moments your communities might be facing now, what feels important for you to\
  \ write?</p>\n<p>6. Consider your experiences with writing. What feelings come up? Examine these writing\
  \ feelings. What emotions and experiences do these feelings prompt for you about writing?</p>\n<p>7.\
  \ What stalls your writing? Is it internal or external? What if you could speak to that “stalling” force?\
  \ What would you say?</p>\n<p>8. Can you describe any moments when you experienced or recognized linguistic\
  \ injustice? How would you explain what happened? How might it have affected your future attempts to\
  \ write or communicate with others?</p>"
