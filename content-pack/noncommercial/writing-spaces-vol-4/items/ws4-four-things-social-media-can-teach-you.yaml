  <p>Teacher Resources for “Four Things Social Media Can Teach You About College Writing—and One Thing
  It Can’t”</p>

  <h3>Overview and Teaching Strategies</h3>

  <p>This essay invites students to consider how the rhetorical moves they make on social media can be
  transferred to academic writing. The essay aims to demystify academic writing by helping students see
  that similar rhetorical processes happen across all writing genres and that academic writing tasks aren’t
  divorced from everyday writing practices. The essay can be taught as part of a unit on literacy narratives
  or other investigations of students’ existing literacy practices, alongside lessons on style and rhetorical
  experimentation, or in conjunction with other course content that focuses on social media or multimodal
  composing.</p>

  <p>I find that when students are asked to reflect critically on their social media writing practices,
  they are perceptive of a range of rhetorical choices they make in adapting digital content to fit audience
  expectations or to provoke audience reactions. Yet students are less practiced in carrying these rhetorical
  choices into academic writing or in seeing connections between everyday digital writing and more formal
  academic prose. I recommend beginning an assignment sequence or class discussion by asking students
  to reflect on and analyze their own digital composing choices prior to assigning this essay, then following
  students’ reading of the essay with discussion or writing about specific rhetorical moves students can
  bring from their social media practices into a college assignment.</p>

  <p>One area where teachers may encounter resistance is from students who avoid or opt out of social
  media. When I encounter students who aren’t inclined toward social media participation, I ask them to
  reflect more broadly on their everyday writing practices such as texting, making to do lists, writing
  emails, writing notes to family members, and on everyday rhetorical choices such as selecting clothing
  and accessories. While some students may not participate in the literacy practices the essay describes
  in networked spaces, all make rhetorical choices in self-sponsored writing and in composing their own
  persona each day that they can apply to college writing projects.</p>

  <h3>Discussion Questions</h3>

  <p>1. Choose a social media platform you participate in, and make a list of all the groups of people
  who read your writing on this platform. In addition to the forms of social media listed in the article,
  consider whether you participate in LinkedIn, Pinterest, Yelp, dating sites, or gaming sites. Draw a
  Venn diagram to show how your audience groups are related and whether and how they overlap.</p>

  <p>2. The essay suggests choosing a “challenge essay” to imitate in your own writing. What nonfiction
  text have you read that you’d like to imitate as a writer? Return to this text, skim it, and make a
  list of the rhetorical moves the author uses that you’d like to imitate. Which rhetorical moves will
  be the most difficult to accomplish, and why?</p>

  <p>3. Find a tweet that uses at least one emoji or at least one punctuation mark. Rewrite the tweet
  five times, using different symbols or punctuation each time. Explain how your choices change the meaning
  of the tweet in each version.</p>

  <p>For more discussion of how changing punctuation changes a sentence’s meaning, read Kevin Cassell’s
  Writing Spaces essay “Punctuation’s Rhetorical Effects.”</p>

  <p>4. The essay discusses the difference between intertextual references and interdiscursive rhetorical
  practices in writing. Consider the outfit you’re wearing today. Which elements of your outfit are intertextual?
  That is, which parts of your clothing or accessories specifically reference other existing texts? Which
  elements of your outfit are interdiscursive? In other words, what rhetorical choices did you make in
  assembling your outfit that mimic or riff off others’ rhetorical choices?</p>

  <p>5. Each Snapchat lens that filters your image has a name, like Starry Sunlight, which casts an amber
  color on a photo and makes small gold sparkles appear on the screen. Think of how you presented yourself
  in the last academic essay you wrote. What name would you give to the “filter” you used for your own
  presentation in that piece of writing, and how would you describe that filter? What name would you give
  to the filter you’d like to use to present yourself in your current writing course, and how would you
  describe it?</p>'
