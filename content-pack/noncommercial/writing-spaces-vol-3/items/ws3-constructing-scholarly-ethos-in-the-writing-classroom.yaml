  <p>Teacher Resources for Constructing Scholarly Ethos in the Writing Classroom by Kathleen J. Ryan</p>

  <p>Overview and Teaching Strategies</p>

  <p>This essay grew out of my experience working with new teachers who largely defined ethos as credibility
  and didn’t have access to more interesting scholarship on ethos with students. I want to offer teachers
  an article they can read with students that draws on ethos scholarship from the 1970s and 1980s by scholars
  like Arthur Miller, Michael Halloran, and Nan Johnson and then from the 2000s by Michael Hyde, Nedra
  Reynolds, and Coretta Pittman. I’ve found scholarship on ethos as social, strategic and relational is
  so much more pedagogically compelling than the static ways ethos as credibility gets defined. My hope
  is to make ideas from ethos scholarship available to students in a usable way, so that they have a heuristic
  for constructing their ethos in a range of writing assignments or projects as they move through their
  composing processes in your classrooms.</p>

  <h3>Discussion Questions:</h3>

  <p>1. Write for 10 minutes about your personal connection to and/or personal interest in a current writing
  project. What difference does it make to think about your personal connection to writing that is more
  formal and academic?</p>

  <p>2. Find an assignment you wrote for another class, past or present, and write about how you constructed
  your ethos in that assignment (consciously or not). What might you do differently now that you know
  more about ethos? What changes would you make if you were going to rewrite that assignment?</p>

  <p>3. The author indicates that constructing your ethos is a powerful and strategic move in writing.
  How is constructing ethos empowering? What kinds of power issues are involved in crafting your ethos
  for a writing assignment?</p>

  <p>4. How does the author of “Constructing Ethos in the Writing Classroom” construct her ethos? Discuss
  particular places in the text where she names her identity, demonstrates she’s being a responsible scholar,
  and builds bridges with you as a reader. To what degree are these moves successful in engaging you as
  a reader? Explain your response.</p>

  <p>5. Read an academic article in your major and write an analysis of how ethos functions in that article.
  What do you observe about the place of ethos in that field and genre? What kind of relationship is the
  author or authors creating with you as a reader?</p>

  <p>6. Define scholarly ethos in your own words. How are you working to demonstrate your scholarly ethos
  in a current writing project?</p>

  <h3>Activities:</h3>

  <p>The following are invention and drafting activities students might do as homework or in class. The
  activities are drawn from different textbooks I’ve taught as well as scholarship I’ve encountered in
  my ethos research.</p>

  <p>Invention Activity 1. Naming your identity and locating yourself in the world.</p>

  <p>1. List your racial, gender, ethnic, political, class, age, religious, geographical, and historical
  identifications.</p>

  <p>2. List your primary commitments, desires, and interests as a student and in your personal life (including
  work and leisure).</p>

  <p>3. List organizations or communities you belong to. 4. List special knowledge or abilities you have.
  5. Write a few sentences elaborating on your experiences with some of the items in your lists.</p>

  <p>Once you’ve gotten started with a current writing assignment, return to this list and note which
  aspects of your identity most relate to your current project. Do a focused freewrite on those aspects
  of your identity that tie into the topic, question, or ideas you’re exploring.</p>

  <p>Invention Activity 2. Bridging gaps through audience analysis. This activity is adapted from the
  audience guide in Janice Lauer, Gene Montague, Andrea Lunsford, and Janet Emig’s Four Worlds of Writing,
  a textbook I used as a doctoral student. I like reframing this audience analysis as an exercise in thinking
  relationally about writers and their readers.</p>

  <p>1. Who are your potential audiences? What do they know and value?</p>

  <ul><li>What kind of background and experience do members of my audience or community have? How does
  this relate to the issue I am exploring?</li><li>What does my audience value most? How do these values
  relate to my issue? To the way I’m naming my identity in this assignment? How strongly does my audience
  hold them?</li></ul>

  <p>2. What reader role will I call forth, or invoke, for my audience?</p>

  <ul><li>What knowledge and experience characterize that role? • What are the values connected with that
  role? • What does my readers’ role help me learn about my research question or the issue I’m studying?
  About what I need to discuss in my paper?</li></ul>

  <p>3. What does my role imply for my writing of the paper?</p>

  <ul><li>What is my relationship to the audience I will invoke? Am I a peer? An expert? A critic? A student?
  A concerned member of some shared community?</li><li>What gaps between my identity and location and
  my readers’ will I need to bridge?</li></ul>

  <p>Invention Activity 3. Genre Analysis. I love Anis Bawarshi’s Genre and the Invention of the Writer:
  Reconsidering the Place of Invention in Composition, and this activity is drawn from an activity he
  modified from a collaborative book he was writing at the time. This adaptation brings in ethos as an
  aspect of genre study and invites students to consider what aspects of ethos some genres call upon.</p>

  <p>1. Collect and study the situation of a particular genre.</p>

  <ul><li>Where does the genre appear? What contexts? What issues, ideas, or questions does this genre
  address? Who uses this genre? What identities or commitments matter to people using this genre? Why
  is the genre used? What purposes does the genre fulfill for them?</li></ul>

  <p>2. Identify and describe patterns in the genre’s features.</p>

  <ul><li>What content is included or excluded? What counts as evidence? How are the texts in the genre
  organized? What are their parts? What layout or appearance is common? How/do writers name their identities?
  In what ways are writers demonstrating that they are being responsible? What kinds of things do writers
  reveal about themselves and why? What do you observe about the language? 3. Analyze what these patterns
  reveal about the situation.</li><li>What do the patterns show you? Why are the patterns significant?
  What do participants have to know, value, or believe to understand or appreciate the genre? Who is included/excluded?
  What values, beliefs, goals, and assumptions are revealed by the patterns? What content is considered
  most important? What actions do the genre help make possible? What attitude towards readers is implied
  in the genre? What attitude towards the world?</li></ul>

  <p>4. Explain how the genre patterns shape ethos.</p>

  <ul><li>What expectations does the genre set up in regard to the relationship the writer has with readers?
  What kind and degree of content related to ethos is most/least appropriate to the genre?</li></ul>

  <h3>Drafting Activity 1. Practice Naming Your Identity</h3>

  <p>1. Add one to three sentences to a draft of a persuasive paper to see how you can more strongly position
  yourself in your text. Share an aspect of yourself that is relevant to the topic at hand and reference
  a value you share with readers related to your topic as a way to both open your paper and set up your
  ethos.</p>

  <p>2. Try to compose a parenthetical reference like “as a __________” and fill in the blank with a relevant
  phrase drawn from your listing invention activity (see above) to concisely share with readers some aspect
  of your experience or background that can help them identify you and consider how who you are helps
  them engage your text. You might also point to the role you see readers playing using a phrase that
  cue readers into the kind of role you are asking them to play: “Like readers who care about _______,
  I _____”. These are two concise ways of placing yourself in text.</p>

  <h3>Drafting Activity 2: Getting Ethos Feedback from Readers</h3>

  <p>1. How do you describe the relationship I’m trying to create with readers? What in the text makes
  you think this?</p>

  <p>2. Are there places in the text where you’re confused or offended as a reader? Please explain.</p>

  <p>3. How well do I use specific details to explain my perspective? 4. In trying to name my identity,
  have I shared information about myself that seems irrelevant? If so, where? 5. On a scale of 1 to 5
  (one being the worst and five the best), how well have I done in constructing a good scholarly ethos
  for this assignment? Please explain.</p>'
