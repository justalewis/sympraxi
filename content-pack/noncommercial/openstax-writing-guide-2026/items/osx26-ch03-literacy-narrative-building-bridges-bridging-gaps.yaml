  <p>3.8 Spotlight on … The Digital Archive of Literacy Narratives (DALN)</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Use a variety of technologies to address a range
  of audiences. • Match the capacities of different environments to varying rhetorical situations.</p>

  <p>flickr, CC BY 2.0)</p>

  <p>An archive is a collection of artifacts, often historical, that serve to document a time period,
  location, or group of people. Archives may be located far from cities, accessible only in person, and
  they typically house rare documents that visitors view or handle with particular care. When an archive
  is digitized, however, visitors are allowed to view the document in virtual spaces, thus creating an
  open and accessible environment. The Digital Archive of Literacy Narratives (DALN) “is an open public
  resource made up of stories from people just like you about their experiences learning to read, write,
  and generally communicate with the world around them.” People who have diverse identities, lived experiences,
  and engagement with literacies have uploaded their literacy narratives and given permission for their
  stories to be read and shared with public audiences.</p>

  <p>Using the Digital Archive of Literacy Narratives (DALN)</p>

  <p>The DALN is completely keyword searchable, so if you are looking to read literacy narratives on particular
  subjects—such as music or dance as literacy, or any other concentrated subject about which one can demonstrate
  knowledge—you can search for shared narratives with these literacies. As the website states, “The DALN
  invites people of all ages, races, communities, backgrounds, and interests to contribute stories about
  how—and in what circumstances—they read, write, and compose meaning, and how they learned to do so (or
  helped others learn).” Sharing your literacy narrative in the DALN can be a rewarding way to celebrate
  the completion of this writing milestone. The DALN welcomes literacy narratives of all kinds and in
  all formats, including diaries, blogs, poetry, music, videos, letters, stories, chat rooms, and so on.</p>

  <h3>Publish Your Literacy Narrative</h3>

  <p>After you have completed and revised your literacy narrative, consider sharing it with the DALN (https://openstax.org/r/daln)
  You may also want to consider reimagining your literacy narrative in the form of a podcast or a TED
  Talk–type video. The TED in TED Talks is an acronym that stands for the phrase “Technology, Entertainment,
  and Design.” TED (https://openstax.org/r/ted) is a nonprofit organization devoted to the distribution
  of ideas; the website is keyword searchable and provides an archive where you can find short talks about
  just about any topic. The criteria (https://openstax.org/r/criteria) for a TED Talk can be found on
  the organization’s website. To prepare for this publication alternative, take an opportunity to watch
  the following sample TED Talks that fit the genre of literacy narrative:</p>

  <ul><li>Luvvie Ajayi (https://openstax.org/r/luvvieajayi) discusses how blogging and creating a post
  that went viral led to her identifying as a writer.</li><li>John Trischitti (https://openstax.org/r/johntrischitti)
  talks about how reading literally saves lives and advocates for providing young people with books to
  secure their futures.</li></ul>

  <p>3.9 Portfolio: A Literacy Artifact</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Reflect on the development of composing processes.
  • Consider how those processes affect your work.</p>

  <p>Your instructor may require a portfolio as a part of the composition course curriculum. A portfolio
  is a collection of your work, gathered in a single place for the purpose of assessing your growth and
  achievement as a writer. A portfolio allows you not only to include writing artifacts but also to reflect
  on the process of composing those artifacts. In this section, you will have an opportunity to compose
  a reflection on the process of writing your literacy narrative.</p>

  <h3>Reflection Prompt</h3>

  <p>One of the most valuable writing exercises is to reflect on work you have completed or experiences
  you have had. Reflection supports learning by allowing writers to articulate the impact that experiences
  have had on various aspects of their lives. In responding to the ideas in this section, take some time
  to reflect on your experiences, as well as the experiences of others, with literacy and learning. Using
  the guidelines your instructor provides, compose a reflection that responds to the following questions:</p>

  <ul><li>How has your understanding of literacies been affected by the opportunity to reflect on your
  engagement with literacy practices, the practices of those in your composition course community, or
  the practices of people beyond your immediate community?</li><li>How will this experience and reflection
  affect your future engagement with various literacies?</li></ul>

  <h3>Literacy Narrative Revision</h3>

  <p>Submitting the best version of your work is an important part of preparing a portfolio. After you
  have received a graded essay with comments from your instructor, use those comments as a resource to
  revise the essay for a final time. You will want to use this revised essay for your portfolio submission.</p>

