  <p>Teacher Resources for “Dispositions Towards Learning”</p>

  <h3>Overview and Teaching Strategies</h3>

  <p>This is a chapter that introduces students to dispositions, or the beliefs about learning and themselves
  as learners, and discusses the ways in which dispositions can impact learning behaviors. Specific dispositions
  taken up in this chapter include expectancy-value, self-efficacy, self-regulation, and attribution,
  problem-exploring and answer-getting. This chapter would be well-paired with Kara Taczak’s chapter on
  knowledge transfer from Writing Spaces, Volume 4, as writing studies researchers have argued that dispositions
  play a crucial role in students’ transfer of knowledge.</p>

  <h3>Discussion Questions</h3>

  <p>1. Before reading this chapter: think of a time that you learned something that was really challenging.
  What was the thing you learned and what made it so difficult? How did you eventually overcome those
  challenges and learn what you wanted?</p>

  <p>2. After reading this chapter: go back to the pre-reading question #1, and ask yourself if dispositions
  played any role in your eventual learning success. Which ones? In what ways?</p>

  <p>3. Thinking about the dispositions you have towards learning in general, can you think of how you
  developed those dispositions? What events or experiences from the past helped you form those dispositions?</p>

  <p>4. What is something you are learning to do in school right now that is challenging? What dispositions
  are at play in that context? Are those dispositions serving you well? Which, if any, do you want to
  change?</p>

  <p>5. If you are going to reflect on a disposition you might want to change, what steps might you take
  to do so?</p>'
