  <p>Of course, by understanding the communities they shape and interact with, business practitioners
  will understand just how a new technology functions, or how it does not.</p>

  <p>Just because a new technology is available, this does not mean that people should use it.</p>

  <p>Teaching students about the norms and values of a discourse community can help them assess how, when,
  and even if a community should employ a new technology.</p>

