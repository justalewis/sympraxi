  <p>18.7 Spotlight on . . . Technology</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Implement a variety of technologies while matching
  them to environments used to address rhetorical situations. • Match the capacities of different modes
  and media to various rhetorical situations.</p>

  <p>Technology is a crucial element in multimodal composition. In fact, the emergence of digital technology
  has vastly changed the landscape of multimodal composition in recent years. The rise of technology has
  resulted in new communication and composition practices in people’s social, academic, and professional
  lives. Technology also plays a role in the rhetorical approach to writing and composition, increasing
  the complexity of expression, communication, and persuasion. Indeed, technology has both challenged
  and transformed long-held ideas about what it means to write.</p>

  <p>Within the genre of multimodal composition, there is a growing call for design advocacy, part of
  which means redefining and recontextualizing the rhetoric of design to make multimodal compositions
  more inclusive not only for those with differing abilities but also for those marginalized according
  to social, technological, and cultural equity.</p>

  <h3>Digital Deserts</h3>

  <p>One challenge posed by the incorporation of technology in multimodal composition is the presence
  of digital deserts, or places affected by a digital divide, where residents have no access to the high-speed
  internet connections required to consume and create digital media. The Federal Communications Commission
  produced data indicating that in 2017, 21.3 million Americans lacked access to high-speed internet service,
  and of those people, 2.2 million households had no internet access at all. Studies show that this data
  may be understated, with even more people living in digital deserts. Rural parts of the country are
  disproportionately affected, but people living in low-income urban areas make up a significant portion
  of these numbers.</p>

  <p>To participate in the consumption or creation of most multimodal composition, students need access
  to highspeed internet, defined by the FCC as a download speed of 25 Mbps and an upload speed of 3 Mbps.
  When no such access exists, cultural, social, and educational disparities arise within the genre of
  multimodal literature. Students who have less access to the technology required to read, view, or create
  multimodal works are excluded from this relatively new form of literature, leading to cultural underrepresentation
  and placing them at academic and social disadvantages.</p>

  <h3>Enhancing Usability and Accessibility</h3>

  <p>Other considerations affecting multimodal compositions are usability and accessibility for readers
  of differing abilities. These may be associated with speech, hearing, vision, and/or motor impairments,
  among others. Universal accessibility aims to produce content that all people, regardless of abilities,
  can use, often with assistive technologies, solutions, and tools. Although new fields within the education
  landscape, such as universal design, have made great strides in usability and accessibility, multimodal
  content can enhance these strides in unique ways for students and for all consumers of multimodal compositions.</p>

  <p>Multimodal compositions often include interaction constraints. These can be thought of as filters
  that limit a user’s ability to access consumer content effectively. For example, a person who has vision
  impairment may experience interaction constraints when attempting to consume a photo essay. This constraint
  can be eased through technologies that help make the media more meaningful, such as text and audio alternatives
  that help the user experience the composition in a way similar to its original form.</p>

  <p>Web Content Accessibility Guidelines (WCAG) are intended to make web content more accessible to people
  with disabilities. However, creators of multimodal compositions can adapt and apply WCAG rules and principles,
  such as those discussed below, even to compositions that are not web based.</p>

  <h3>Provide Informative Titles and Headings</h3>

  <p>Content titles and headlines that accurately describe and distinguish the composition from others
  are helpful for contextualizing the composition. A headline usually refers to a composition within something
  larger, such as an article in a magazine, whereas a title encompasses an entire entity in itself, such
  as a novel or story that stands on its own. Consider the headline of the blog post you read earlier,
  “Celebrating a Win-Win: 30 Years of Progress under the Pollution Prevention Act.” This headline is informative,
  telling the audience that the post is about the progress of the Pollution Prevention Act. It also informs
  readers of the author’s perspective on this topic, clearly indicating her belief in the success of the
  act. For the photo essay about the war in Syria, the student writer revised the original headline to
  the more specific and meaningful Remnants of War—Syria.</p>

  <h3>Use Headings and Subheads to Convey Meaning and Structure</h3>

  <p>Headings and short subheads group related information, clearly describe sections of text or media,
  and provide an outline of the content. Although they are a standard feature of informational texts,
  headings and subheads can be explored within multimodal compositions as organizational and accessibility
  features, as they are used in the poster shown in Figure 18.24, United Nations poster. The subheads
  clarify the structure of the composition, indicating features such as the introduction and author’s
  objectives, and provide transitions between sections.</p>

  <h3>Make Link Text Meaningful</h3>

  <p>When using hyperlinks within a multimodal composition, write text that describes the content of the
  link target. Instead of using vague text such as “click here” or simply using the URL as the hyperlink,
  use the opportunity to include relevant information about the content of the link. This added content
  serves as a transition and emphasizes the relationship between the media. Alexandra Dapolito Dunn does
  this in the blog post in Annotated Sample Reading, specifying in her text the content of the link used:</p>

  <p>President Trump acknowledged the effectiveness of these and other EPA programs in a 2018 Executive
  Order that directed federal agencies to use EPA’s P2 resources to meet their statutory sustainable purchasing
  requirements. Write Meaningful Text Alternatives for Graphics All images and other graphic representations
  should have meaningful alternative text that helps readers understand the information portrayed in the
  image and its significance to the function of the composition. Consider Figure 18.26:</p>

  <p>play the national anthem in the background”). Again, these small additions make your multimodal media
  accessible to consumers of all abilities.</p>

  <h3>Publishing Your Work</h3>

  <p>One of the most exciting parts of composing is publishing your work. Technology affords multimodal
  composers numerous options for publishing. Whether or not you create your composition through digital
  means, you can use technology in the publishing process. First, know that you want your published product
  to be a finished work that incorporates the revisions and edits you made during the peer review process.
  This step is occasionally skipped in the multimodal composition process, mostly because digital publishing
  can be more accessible than other traditional publishing methods. Nevertheless, as a composer, you want
  your published product to be your best work. Depending on which modes and media you include, consider
  the following options for publishing your multimodal advocacy project.</p>

  <ul><li>Blogs, which usually include text, images, and videos, can be self-published on free or inexpensive
  webbased platforms such as WordPress, Adobe Experience Manager, and others. Any author or group can
  start a blog and create posts that incorporate multimodal content.</li><li>As an alternative to blogs,
  consider the digital flipbook format, the equivalent of a digital magazine. Platforms such as Issuu
  allow content creators to organize content in a format in which the viewer scrolls left and right by
  “flipping” pages. Flipbooks offer more options for layout, organization, and transitions.</li><li>You
  may instead choose to publish your completed composition on a video hosting site such as YouTube or
  Vimeo.</li><li>You can also use technology to publish non-digital multimodal compositions, such as performances,
  presentations, or hard-copy posters and the like. This kind of publication typically involves another
  layer of mode mixing, such as recording a live performance or uploading a picture of an artwork to a
  digital platform.</li></ul>

  <p>18.8 Portfolio: Multimodalism</p>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Write about the development of multimodal composition. • Compose a reflection on how the processes
  affect your work. After creating your multimodal advocacy project, think critically about the development
  process, including how you chose genres, modes, and specific media to include; your process for creating
  transitions; and ways in which you incorporated usability and accessibility into your finished project.</li></ul>

  <h3>Reflective Writing: Letter to Your Instructor</h3>

  <p>As you reflect on your multimodal composition and the process you used to create it, answer these
  questions, supporting your answers with evidence from your project. Then compose a letter to your instructor
  that incorporates your answers and addresses any other parts of the composition process that come to
  mind.</p>

  <ul><li>How would you articulate your role as a composer? (Hint: Who are you as the author—what is your
  identity in this role? To whom are you speaking, and for what purpose?)</li><li>Why did you choose the
  advocacy topic that you did? Do you have a personal connection? • On which parts of the composition
  process (planning, research, drafting, revising) did you spend the most time? Why did these parts occupy
  you the longest? What, if anything, would you change if you could do it again? • How did considering
  your audience change your development process? What opportunities did you have to think critically about
  social and cultural issues? • Why did you choose the rhetorical devices that you did? What factors helped
  you decide on them? How did the situation influence your rhetorical appeals? • What factors helped you
  determine the primary genre, mode(s), and media you chose? Did you change those elements at any point
  in the composition process? If so, why? • How did peer review and revision help clarify your ideas,
  organization, or composition? • How did you show relationships between the ideas and media? What changes
  did you make to improve your transitions? • What did you learn about your topic and the composition
  process through the revision process? • How did you address considerations for usability and accessibility,
  using technology or otherwise? • Which parts of the composition came more easily than others? • How
  did thinking about publishing affect your final product?</li></ul>

