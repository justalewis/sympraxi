  Job Postings.” Technical Communication, vol. 62, no. 4, 2015, pp. 224-243.</p>

  <p>Carr, Caleb T. and Rebecca A. Hayes. “Social Media: Defining, Developing, and Divining.” Atlantic
  Journal of Communication, vol. 23, no. 1, 2015, pp. 46-65.</p>

