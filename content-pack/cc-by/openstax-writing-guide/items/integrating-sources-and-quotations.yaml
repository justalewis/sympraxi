changes: Converted from the book's source format to plain HTML. Images, figures, and exercises whose text
  lives elsewhere in the book are left out. Wording is unchanged.
body: "<p>Direct quotations are most effective when you integrate them smoothly into the flow of your\
  \ paper. You can do this by introducing the source and reason for the quotation in a phrase or sentence.\
  \ Readers should be able to follow your meaning easily and to understand the relevance of the quotation\
  \ immediately.</p>\n<h2>Introduce Quotations</h2>\n<p>Because readers need to know who is speaking,\
  \ introduce quoted material with a <em>signal phrase</em> (sometimes called an attributory phrase).\
  \ A signal phrase is a word or group of words that introduces borrowed or quoted material and informs\
  \ readers of the source and purpose of the quotation. If the source is well-known, the name alone will\
  \ be enough of a signal phrase. For example, a first-year student wrote, “Henry David Thoreau asserts\
  \ in <em>Walden</em>, ‘The mass of men lead lives of quiet desperation’” (5).</p>\n<p>If your paper\
  \ focuses on the published work itself, introduce a quotation with the work’s title rather than the\
  \ author’s name, as long as the reference is clear—for example, “<em>Walden</em> sets forth one individual’s\
  \ antidote against the ‘lives of quiet desperation’ led by the working class in mid-nineteenth-century\
  \ America” (Thoreau 5). If either the author or the source is not well-known, introduce the quotation\
  \ with a brief explanation to give readers enough context to understand the quotation—for example, “Mary\
  \ Catherine Bateson, daughter of renown anthropologist Margaret Mead, has become, in her own right,\
  \ a student of modem civilization.”</p>\n<h3>Select the Right Signal Phrase</h3>\n<p><a href=\"https://openstax.org/r/signalphrases\"\
  >Signal phrases</a> tell readers that the words or ideas that follow come from another source. Signal\
  \ phrases often contain a verb that indicates the tone or intention of the author. To avoid monotony,\
  \ vary the placement and words of the signal phrases you use. Note the differences, both slight and\
  \ significant, in the following signal words and phrases as you integrate some of them into your draft:</p>\n\
  <table><tr><td>acknowledges</td><td>denies</td><td>points out</td></tr><tr><td>admits</td><td>emphasizes</td><td>refutes</td></tr><tr><td>agrees</td><td>endorses</td><td>reports</td></tr><tr><td>argues</td><td>follows\
  \ up</td><td>reveals</td></tr><tr><td>asserts</td><td>grants</td><td>says</td></tr><tr><td>believes</td><td>illustrates</td><td>shows</td></tr><tr><td>claims</td><td>implies</td><td>states</td></tr><tr><td>comments</td><td>insists</td><td>suggests</td></tr><tr><td>concedes</td><td>maintains</td><td>thinks</td></tr><tr><td>concludes</td><td>notes</td><td>writes</td></tr><tr><td>declares</td><td>observes</td><td></td></tr></table>\n\
  <h2>Quote Smoothly and Correctly</h2>\n<p>A direct quotation repeats an author’s or speaker’s exact\
  \ words. Slight changes in wording are permitted, but these changes must be clearly marked. Although\
  \ you cannot change what a source says, you do have control over how much of it you use. Because using\
  \ quotations that are too long can imply that you have little to say for yourself, use only the part\
  \ of the quotation needed to make your point. Quotations should support your points, not say them for\
  \ you.</p>\n<p>To shorten a quotation to include only the most important information, integrate it smoothly\
  \ and correctly into the body of your paragraph to provide minimal disruption for readers. Unless the\
  \ source quoted is itself the topic of the paper (as in a literary interpretation), limit brief quotations\
  \ to no more than two per page and long quotations to no more than one every three pages. The following\
  \ examples illustrate both correct and incorrect use of quoted material.</p>\n<h3>Original Passage</h3>\n\
  <p>According to one film critic, the plot is exciting, but most of the dialogue “has the energy and\
  \ impact of day-old gruel, without sugar, spice, or raisins.” In fact, if I had to judge the film on\
  \ dialogue alone, I’d say, “Save your money.” Most of the characters alternate between a low and intermittent\
  \ mumble, like a distant helicopter with engine trouble, and garbled whoops, as though speaking in tongues.\
  \ Perhaps this is the director’s way of trying to mask a cornucopia of cliché-ridden, monosyllabic utterances,\
  \ which, I agree, are not worth audience attention. Much of the acting is no better. However, some notable\
  \ exceptions eclipse all the negatives of the script and the bit-part actors.</p>\n<h3>Omit or Substitute\
  \ Words Judiciously</h3>\n<p>Cutting words for the sake of brevity is often useful, but do not distort\
  \ meaning. Indicate omitted words by using ellipsis points (three dots within a sentence, four to indicate\
  \ a complete sentence is being omitted). Use brackets ([ ]) to indicate any changes or additions.</p>\n\
  <p><em>Distorted Quotation</em></p>\n<p>“The plot is exciting . . . the dialogue has . . . energy and\
  \ impact.”</p>\n<p>The critic’s words are taken out of context. Negatives are removed, as are the critic’s\
  \ dismissive comments about the film and the exceptions to the opinion.</p>\n<p><em>Accurate Quotation</em></p>\n\
  <p>“The plot is exciting, but most of the dialogue ‘has the energy and impact of day-old gruel. . .\
  \ .’ However, some notable exceptions eclipse all the negatives of the script.”</p>\n<h3>Quotation Marks\
  \ for Short Quotations</h3>\n<p>Embed brief quotations in the main body of your paper, and enclose them\
  \ in quotation marks. The previous examples in this section are brief and would be embedded within paragraphs\
  \ as normal sentences. According to MLA style guidelines, a brief prose quotation consists of four or\
  \ fewer typed lines; a brief poetry quotation consists of three or fewer typed lines.</p>\n<h3>Block\
  \ Format for Long Quotations</h3>\n<p>Set quotations of more than four lines in block format. Block\
  \ quotations are indented but spaced the same as the normal text. Format block quotations as follows:</p>\n\
  <ul><li>Introduce the quotation in the last line of normal text with a sentence that ends with a colon.</li><li>Indent\
  \ one half inch, and then begin the quotation.</li><li>Do not use quotation marks, as the indentation\
  \ signals direct quotation.</li><li>Include the page number, in parentheses, after the end punctuation.</li></ul>\n\
  <p>For example, this student writing on Thoreau used a block quotation from <em>Walden</em> to describe\
  \ the scenery in the author’s own words:</p>\n<blockquote><p>The scenery of Walden is on a humble scale,\
  \ and, though very beautiful, does not approach to grandeur, nor can it much concern one who has not\
  \ long frequented it or lived by its shore; yet this pond is so remarkable for its depth and purity\
  \ as to merit a particular description. It is a clear and deep green well, half a mile long and a mile\
  \ and three quarters in circumference, and contains about sixty-one and a half acres; a perennial spring\
  \ in the midst of pine and oak woods, without any visible inlet or outlet except by the clouds and evaporation\
  \ (195).</p></blockquote>\n<h3>Explain and Clarify Quotations</h3>\n<p>Sometimes you will need to explain\
  \ a quotation’s relevance or meaning in the context of your discussion. For example, one student wrote,\
  \ “In <em>A Sand County Almanac,</em> author Aldo Leopold invites modern urban readers to confront what\
  \ they lose by living in the city and mentions the resulting ‘spiritual dangers’: ‘supposing that breakfast\
  \ comes from the grocery and . . . heat comes from the furnace’ (6). Leopold sees city-dwellers as self-centered\
  \ children, blissfully but dangerously unaware of how their basic needs are met.”</p>\n<p>If you need\
  \ to clarify what a word or reference means, write your definition or explanation and enclose it within\
  \ square brackets.</p>\n<h3>Adjust for Clarity and Accuracy</h3>\n<p>A passage containing a quotation\
  \ must follow all the rules of grammatical sentence structure: tenses should be consistent, verbs and\
  \ subjects should agree, and so on. If the form of the quotation doesn’t quite fit the grammar of your\
  \ own sentences, you can either quote less of the original source, change your sentences, or make a\
  \ slight alteration in the quotation. For example, you might write, “Leopold writes that city dwellers\
  \ assume ‘breakfast comes from the grocery’” or “Leopold writes that city dwellers ‘[suppose] that breakfast\
  \ comes from the grocery.’” For more information on using quotations, see Editing Focus: Quotations\
  \ and Quotations.</p>\n<h2>When to Quote</h2>\n<p>Reserve direct quotations for cases in which you cannot\
  \ express ideas better yourself or when the exact words offer the strongest support for your ideas.\
  \ Use quotations when the original words are especially precise, clear, powerful, or vivid, but ensure\
  \ they do not substitute for your own thoughts.</p>\n<ul><li><strong>Precise.</strong> Use quotations\
  \ when the words are important in themselves or when the author makes fine but important distinctions.\n\
  \      “Government, even in its best state, is but a necessary evil: in its worst state, an intolerable\
  \ one.”—Thomas Paine</li><li><strong>Clear.</strong> Use quotations when the author’s ideas are complex\
  \ and difficult to paraphrase. “Paragraphs tell readers how writers want to be read.”—William Blake</li><li><strong>Powerful.</strong>\
  \ Use quotations when the words are especially authoritative and memorable.\n      “You shall know the\
  \ truth, and the truth shall make you free.”—John 8:32, King James Version</li><li><strong>Vivid.</strong>\
  \ Use quotations when the language is lively and colorful, when it reveals something of the author’s\
  \ or speaker’s character.\n      “A person who won’t read has no advantage over one who can’t read.”—Mark\
  \ Twain</li></ul>"
