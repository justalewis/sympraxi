body: '<p>Definitions and Descriptions</p>

  <p>Quan Zhou</p>

  <p>Technical definitions and descriptions exist all around us.1 Many documents for work and for leisure
  come with terms, mechanisms, and processes that are unfamiliar to readers. Consumer products provide
  user documentation that defines technological terms; scientific articles describe mechanisms that form
  the natural world; government documents explain processes of voting procedures. Defining these terms
  and describing these mechanisms and processes are necessary for readers to understand information and
  solve problems.</p>

  <p>For many of you, the university is an exciting place with a life of its own. But it is also a complex
  structure with terms that are often new to the first-time college student. For example, you are typically
  required to take many kinds of courses that range from general education courses, core courses in your
  major, electives, and so forth. You must understand these terms and types of courses in order to plan
  your study accordingly. You will also meet an array of people — professors, deans, advisors, etc. —
  and you need to know what roles they each play in your college life. Technical definitions help you
  understand the environment around you and navigate your college experience.</p>

  <p>Furthermore, you will need to know crucial processes and procedures you must follow to finish your
  degree. For instance, many degrees require the completion of an internship. An internship is typically
  a short-term work experience that extends your study and prepares you for professional life. To complete
  an internship, you usually need to secure an opportunity, work with a supervisor, and fulfill a set
  of requirements by your employer and your college. If you are new to internships, it is good to consult
  with a technical description provided by your school to help you make informed plans.</p>

  <p>1 This work is licensed under the Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International
  License (CC BY-NC-ND 4.0) and is subject to the Writing Spaces Terms of Use. To view a copy of this
  license, visit http://creativecommons. org/licenses/by-nc-nd/4.0/, email info@creativecommons.org, or
  send a letter to Creative Commons, PO Box 1866, Mountain View, CA 94042, USA. To view the Writing Spaces
  Terms of Use, visit http://writingspaces.org/terms-of-use.</p>

  <p>In technical communication, technical definitions and descriptions are indispensable. They help readers
  understand concepts effectively, perform tasks safely, and make decisions wisely. Without technical
  definitions and descriptions, most technical documents would fail.</p>

  <h3>Technical Definitions</h3>

  <p>Technical documents often come with scientific, technical, business, and other terms of which their
  readers have little to no prior knowledge. Technical definitions describe and explain technical terms
  and concepts in text and visuals. A technical definition can not only explain what a term means, but
  also where it comes from, what it is made of, and what distinguishes it from similar terms. It helps
  readers understand and differentiate unfamiliar or specialized terms in order to read a technical document
  and perform tasks. To draft a technical definition, you must analyze your audience and context, gather
  subject-matter information, determine the appropriate type of definition, and manage content coherence
  of a document.</p>

  <h3>Analyzing Your Audience and Context</h3>

  <p>Technical documents are written for specific audiences who have specific characteristics. As you
  plan for a technical definition, consider who your readers are, what they know, and what they need the
  definition for. What needs to be defined depends on your audience. You may have noticed that, when I
  introduced internship earlier, I provided a brief definition. I did so because those of you in your
  first two years of college might not be familiar with this term. However, if I were writing for seniors
  only, I might not need to define it.</p>

  <p>Consider, too, your readers’ purposes. Do they need to gain a quick understanding of a term? Do they
  need a thorough understanding in order to make complex decisions? Answers to these questions help you
  decide if you want to provide a short definition or an extended one.</p>

  <p>While some concepts can be explained in one sentence, many warrant extended definitions to fully
  make sense. As I discuss later in this chapter, writers use examples, analogy, visuals, and other ways
  to enrich technical definitions. Does an example provide an adequate explanation? Is an analogy appropriate
  and effective? What kind of visual is appropriate for your readers’ background and level of knowledge?
  Getting your audience and context right enables you to draft a technical definition appropriately.</p>

  <h3>Gather Subject-Matter Information</h3>

  <p>Whether you are an expert on the subject matter or possess some knowledge, it is wise to gather information
  about the terms you are defining. Definitions make a lasting impact in the perception of concepts and
  terms, thus must be authoritatively and effectively written. The following are some common ways you
  can go about gathering subject-matter information.</p>

  <ul><li>Looking up a term in reference books: Many terms are defined in dictionaries, encyclopedias,
  and even popular sources. General reference books like the Webster’s Dictionary, the Oxford English
  Dictionary, and the Encyclopedia Britannica are good places to start. If you work in a specialized field,
  consider specialized references as they cover domain-specific terms more comprehensively. Oxford’s A
  Dictionary of Computer Science provides all-encompassing coverage of computing terms. WebMD.com covers
  thousands of health conditions and diseases. In addition, popular sources such as Wikipedia, wikiHow.com,
  and howstuffworks.com provide a large set of definitions, from everyday terms to uncommon ones.</li><li>Synthesizing
  information from documents: Some definitions require you to gather and synthesize information from references,
  journals, Web articles, and other documents. Documents offer deeper knowledge and more comprehensive
  explanations than simple dictionary definitions. And because documents can treat a term differently
  for different audiences, they demonstrate many aspects and varying details of a term.</li><li>Consulting
  with subject-matter experts: Many terms at work are best defined by subject-matter experts. These experts
  understand the context of a technical term and can offer a definition that best fits your goals. And
  if experts are not good at communicating their ideas, observe how they perform tasks and operate procedures.
  These first-hand experiences help you achieve greater accuracy and clarity.</li></ul>

  <p>Whether it’s the help of reference books, pertinent documents, or subject-matter experts, the key
  to remember is that your technical definition must enable readers to use information effectively and
  safely. When in doubt, gather information on your terms and concepts.</p>

  <h3>Selecting the Appropriate Type of Definition</h3>

  <p>There are generally two categories of technical definitions: sentence definitions and extended definitions.
  Sentence definitions are short, often one-sentence, descriptions of a technical term. They are often
  the most typical definition for the everyday reader. Extended definitions are longer, more in-depth
  explanations.</p>

  <h3>Sentence Definition</h3>

  <p>A sentence definition is a brief and straightforward explanation of a term. It usually consists of
  the term being defined, the category it belongs to, and the characteristics that distinguish the term
  from other terms.</p>

  <h3>Consider the following definition of mortgage:</h3>

  <p>A mortgage is a loan from a bank or other financial institution that helps a borrower purchase a
  home. (Taylor, “What Is A Mortgage?”)</p>

  <p>In this definition, “mortgage” is the term and “loan” is the category. The distinguishing characteristic
  is that mortgage loan helps a borrower purchase a home. This characteristic sets mortgage aside from
  other types of loans.</p>

  <p>Selecting an appropriate category can be tricky. Category must provide concrete meaning and, at the
  same time, avoid merely repeating the term being defined. Take, for instance, the following example
  of a definition.</p>

  <p>A fixed-rate mortgage is a mortgage with an interest rate that stays the same. (adapted from Lewis,
  “Fixed-Rate Mortgages: What You Need to Know”)</p>

  <p>Here, the category mortgage merely repeats the term. It does not provide essential meaning that would
  improve readers’ understanding of the term. This type of definition is considered circular definition,
  an explanation that uses the term being defined as the definition. Circular definitions appear as though
  the writer assumes that readers have prior knowledge in the term being defined.</p>

  <h3>How about the following alternative:</h3>

  <p>A fixed-rate mortgage is a financial product with an interest rate that stays the same. (adapted
  from Lewis, “Fixed-Rate Mortgages: What You Need to Know”)</p>

  <p>This definition avoids being circular but isn’t quite right yet. The category financial product is
  too broad to convey essential meaning.</p>

  <p>Let’s narrow down the category further.</p>

  <p>A fixed-rate mortgage is a home loan with an interest rate that stays the same. (adapted from Lewis,
  “Fixed-Rate Mortgages: What You Need to Know”)</p>

  <p>This version clearly categorizes a mortgage as a loan and then distinguishes mortgage loan from other
  loans.</p>

  <h3>Extended Definition</h3>

  <p>Unlike sentence definitions, extended definitions provide longer and more comprehensive explanations
  of a term. Here we discuss common strategies to extend a definition in various situations.</p>

  <p>Extend by Example Examples are an effective and powerful way to explain terms that are vague, abstract,
  complex, easily confused, or too specialized for the regular reader.</p>

  <p>The following definition of text-to-speech technology is accurate, but to readers new to this technology,
  it is still abstract.</p>

  <p>Text-to-speech (TTS) is a type of assistive technology that reads digital text aloud. (“Text-To-Speech
  Technology: What It Is and How It Works”)</p>

  <p>For instance, where is text-to-speech technology used? Does it read text on your computer? Mobile
  phone? A few examples would do the trick.</p>

  <p>Text-to-speech technology can turn words and paragraphs on your computer, smart phone, tablets, and
  other digital devices into audio. (adapted from “Text-To-Speech Technology: What It Is and How It Works”)</p>

  <p>Choosing examples takes careful and thoughtful effort. Examples must represent the most typical ways
  a term can be fleshed out. Choose common, not rare examples. Examples must also be familiar to your
  readers. Here your knowledge and analysis of your readers come in handy.</p>

  <p>Extend by Visual You may have heard of the expression: A picture is worth a thousand words. Visuals
  can explain complex terms, spatial relationships, geographical distributions, or other concepts that
  are otherwise painstaking to explain in text. These days, readers are accustomed to infographics, animated
  visuals, and even interactive visuals. They expect a visual when it is needed. Consider the following
  definition of the exploded view drawing, a type of visuals that is commonly used in technical instructions.
  An exploded view drawing is a picture or diagram that shows how an object is assembled.</p>

  <p>Good luck with that definition. It’s not that the writer did a poor job; however, defining this type
  of concept is best done with visuals. Figure 4.1 allows most readers to understand exploded view drawings
  immediately.</p>

  <p>Figure 4.1: An exploded view drawing (Source: United States Patent and Trademark Office)</p>

  <p>When using visuals, remember that you must consider copyright issues. You should not simply use images
  from the Web, social media, or other authors without getting permission.</p>

  <p>Extend by Partition Many complex terms can be defined by partitioning their components. Partition
  elaborates on the categories, variations, and applications of a term. Remember that a term can often
  be partitioned in more than one way. Choose components that are major to the term and context. Figure
  4.2 shows an extended definition of renewable energy by the U.S. Energy Information Administration.</p>

  <p>This definition begins with a sentence definition of renewable energy and extends to the five forms
  (partitions) of renewable energy: Biomass, hydropower, geothermal, wind, and solar.</p>

  <p>Figure 4.2: Renewable energy definition using partitions (Source: U.S. Energy Information Administration)</p>

  <p>Extend by Comparison and Contrast When the term being defined is similar to, commonly associated
  with, or easily confused with other terms, consider extending the definition through comparison and
  contrast. What makes the term distinctive? How does the term resemble other terms? How does it differ
  from other terms? Comparison and contrast help readers distinguish the term being defined from other
  terms. They help readers gain a deeper understanding of the term.</p>

  <p>Take a look at an excerpt of a definition of laminate floors in Figure 4.3. When homeowners consider
  flooring options, they often must decide among several common flooring materials, including laminate,
  vinyl, solid hardwood, engineered wood, and natural stone. Homeowners might need to know how laminate
  floors resemble and differ from other flooring types with regard to their characteristics, quality,
  installation requirements, and price. Figure 4.3 shows an effective use of comparison and contrast in
  an extended definition of laminate floors.</p>

  <p>Extend by Analogy A distinctive way of defining a term is making analogies. Analogy links abstract
  or unfamiliar terms with concrete and familiar ones.</p>

  <p>Consider the following definition of “keyboard”: A computer keyboard is one of the primary input
  devices used with a computer. Similar to an electric typewriter, a keyboard is composed of buttons that
  create letters, numbers, and symbols, as well as perform other functions (“Keyboard”)</p>

  <p>Figure 4.3: A definition of laminate floor based on comparison (What Are Laminate Floors?)</p>

  <p>Here the writer thoughtfully uses the analogy of an electric typewriter for readers who are not computer
  savvy. Analogy is challenging. In this definition, for instance, the writer clearly assumes that more
  readers are familiar with electric typewriters than keyboards. This assumption might ring true these
  days. A few decades from now, it perhaps will not. Readers might not need a definition of a keyboard,
  nor might they be familiar with electric typewriters, except having seen one in museums. Appropriate
  analogy requires savvy understandings of the audience and context.</p>

  <h3>Extend by Etymology</h3>

  <p>Terms can be defined by etymology, or their origin. The origin of a term helps readers understand
  who invented the term and how the term evolved. The etymology strategy is particularly suitable for
  terms translated from another language or those that have gone through significant changes.</p>

  <h3>Consider this definition of emoji:</h3>

  <p>An emoji (絵文字) which translates to “picture character” is an electronic pictograph (picture conveying
  a message) initially used in Japan, and now all over the world. Emojis were first invented by Shigetaka
  Kurita and became more mainstream when they were introduced on the iPhone in 2011. (“Emoji”)</p>

  <p>Emoji isn’t native to the English language. This definition explains the origin of emoji and how
  it became popular in the English-speaking world. Consider etymology for terms whose origin holds the
  key to their meaning.</p>

  <h3>Extend by Negation</h3>

  <p>Sometimes, a term is defined not by what it is but what it is not. This strategy is considered negation.
  Much less common, negation can be used to define terms that are commonly misunderstood or confused with
  other terms.</p>

  <p>Take, for example, the coronavirus pandemic that unfolded in late 2019. In the early days of the
  pandemic, there was widespread confusion between the novel coronavirus and the flu. The Center for Disease
  Control and Prevention provides the following definition of novel coronavirus, while stressing that
  COVID-19 isn’t the same as the common cold.</p>

  <p>A novel coronavirus is a new coronavirus that has not been previously identified. The virus causing
  coronavirus disease 2019 (COVID-19) is not the same as the coronaviruses that commonly circulate among
  humans and cause mild illness, like the common cold. (“About COVID-19”)</p>

  <p>Negation helps clarify concepts that the readers are easily confused with or hold widely misunderstood
  notions of. Use negation scarcely and only when it is necessary.</p>

  <h3>Managing Content Coherence</h3>

  <p>Definitions don’t exist in isolation from the rest of a document. They must serve a document’s coherence
  and enable readers to move through the document effectively.</p>

  <p>Where does the reader need a definition of a term? Is the definition stand-alone, part of a text
  or a longer publication? What has been said before a definition is introduced? What needs to be said
  after? Does a definition bring in new terms that need to be defined? Is a definition essential to the
  understanding of the text that follows? Is a definition helpful to know but not essential?</p>

  <p>A stand-alone article about solar energy might begin with a definition of solar energy. But an article
  on solar energy in a broader publication about government energy policy might not. Often, the writer
  chooses to contextualize a term, introduce its background, explain its relevance, and then lead the
  reader to the definition. Without context, a definition of a new term could seem out of nowhere. Contextualizing
  a term helps readers understand why the term is being defined and how it relates to other topics in
  a document.</p>

  <p>If you are writing a longer document, consider what has been said before a term is introduced. Consider
  the following definition of autism by the CDC.</p>

  <p>Autism spectrum disorder (ASD) is a developmental disability that can cause significant social, communication
  and behavioral challenges. (“What is Autism Spectrum Disorder?”)</p>

  <p>Has developmental disability been defined or explained prior to this definition in the document?
  If it has, readers might not need further definition. On the CDC website, however, this definition is
  in a stand-alone article about autism, so the CDC further provides the following definition of developmental
  disability.</p>

  <p>Developmental disabilities are a group of conditions due to an impairment in physical, learning,
  language, or behavior areas. (“Facts about Developmental Disabilities”)</p>

  <p>When a technical definition of one term brings up other terms that need to be defined, consider using
  a parenthetical definition to any term in need of further definition. That is, readers can quickly understand
  a term that would otherwise get in the way of understanding the primary term being defined.</p>

  <p>The following is the result of a parenthetical definition applied to “developmental disability”:</p>

  <p>Autism spectrum disorder (ASD) is a developmental disability (conditions due to an impairment in
  physical, learning, language, or behavior areas) that can cause significant social, communication and
  behavioral challenges. (adapted from “What is Autism Spectrum Disorder?”)</p>

  <p>Consider, too, what needs to be said after defining a term. When the definition of autism introduces
  social, communication, and behavioral challenges, readers expect to know more about each of these challenges.</p>

  <p>Where a definition appears in a document also matters. Important definitions, those that readers
  must have, are usually part of a document’s main body of text. These important definitions often serve
  as opening sentences or thesis statements and are often given a distinctive formatting to visually distinguish
  them from the rest of the text. Some definitions appear on the page margin. They are supplemental to
  understanding the text. Still others appear in a footnote or glossary at the end of the document. These
  less important definitions serve as references.</p>

  <p>To put it altogether, you should determine where a definition is needed, how important it is, and
  how they appear in your document.</p>

  <h3>Technical Descriptions</h3>

  <p>Technical description explains a technical object, mechanism, or process using text and visuals.
  Generally, technical descriptions explain how an object functions, how a mechanism works, or how a process
  takes place. An e-commerce website explains a new microwave oven for customers; a trade magazine describes
  the mechanism of carbon emissions for professionals; a government brochure describes the process to
  apply for a passport for the public. Technical descriptions not only inform readers about technical
  concepts but also educate the public about important issues. To draft a technical description, you must
  analyze your audience and context, gather subject-matter information, select the appropriate type of
  description, and develop effective details.</p>

  <h3>Analyzing Your Audience and Context</h3>

  <p>The first step in drafting a technical description is analyzing your audience and context. Unlike
  definitions, technical descriptions are longer, more thorough explanations. They give the writer greater
  flexibility with regard to what and how to draft, but they also require excellent understanding of your
  audience, purpose, and context. The audience and context of technical descriptions vary greatly.</p>

  <p>Consider what your readers already know. Are they new to the technical mechanism or process you are
  describing? Do they have limited knowledge? Do they hold common misunderstandings? Suppose you are writing
  a description of COVID-19 vaccines for a trade magazine aimed at a general audience. To help this audience
  understand how these vaccines work, you might need to explain how the human immune system works. But
  if you are writing this description for medical professionals, many of whom are familiar with the human
  immune system, you might not need as much foundational scientific knowledge. Instead, you might consider
  topics such as administering vaccines and screening for precautions.</p>

  <p>In addition, readers with different goals have their own expectations for technical descriptions.
  If readers are doing a casual read to get to know a concept, they might expect a description that is
  to the point and short enough that they can finish in a few minutes. If customers are doing thorough
  research on several products, they might expect detailed descriptions that guide their decision making.
  Yet other readers might expect to know all the details of a process well enough so that they can carry
  it out.</p>

  <p>Furthermore, the context in which a technical description is needed determines how it is written.
  A description of the fire evacuation process is usually needed in an emergency situation where readers
  must take quick action. Such a process description must be easy to read and visually salient. On the
  other hand, a description of how to take care of a plant is often kept by gardeners as a reference to
  consult with from time to time.</p>

  <h3>Gather Subject-Matter Information</h3>

  <p>Technical descriptions often require substantial support of pertinent information. Gathering such
  information can be crucial as it gives you a thorough understanding of a mechanism or process. You can
  do so by synthesizing documents and gathering information with subject-matter experts.</p>

  <ul><li>Synthesizing information from documents: Many documents and sources provide existing descriptions
  of the mechanism or process you are describing. If you are describing a common concept, such as how
  mortgages work, you can find plenty of publications and online resources. Publications such as the “for
  dummies” book series cover a wide range of topics. Websites like howstuffworks.com and wikiHow.com cover
  an even greater range of topics. If you are describing a specialized concept, such as how Mask Aligners
  work, consider technical and scientific magazines and specialized journals.</li><li>Consulting with
  subject-matter experts: No one is an expert on every mechanism or process. When writing technical descriptions,
  subject-matter experts are some of your best information sources.</li></ul>

  <p>To know how something works, shadow subject-matter experts, observe how they work, and take detailed
  notes. Technical descriptions aren’t done in one shot. After you draft your description, you will need
  to check with subject-matter experts to revise it for technical accuracy.</p>

  <p>You might think you already know everything about a technical mechanism or process. But describing
  it to others is a different feat. As you dive further into a topic, you might uncover blind spots, clear
  misunderstandings, or learn whole new knowledge. Be prepared and allow yourself enough time to gather
  helpful information.</p>

  <h3>Selecting the Appropriate Type of Description</h3>

  <p>In general, there are two types of technical descriptions: Mechanism descriptions and process descriptions.
  Some also consider instructions as a form of technical description. For the purpose of this book, we
  do not cover instructions in this chapter.</p>

  <h3>Mechanism Descriptions</h3>

  <p>A mechanism or object description explains how a mechanism or an object functions. Mechanism descriptions
  can explain how a machine works, how a biological mechanism takes place, or how an engineering system
  operates. They are suitable for but not limited to the following topics:</p>

  <ul><li>Scientific mechanisms: such as how human metabolism works. • Technical objects: such as how
  the sawmill works. • Technical and engineering mechanisms: such as how the microwave oven works. • Professional
  and business mechanisms: such as how compound interest works.</li></ul>

  <p>Excellent mechanism descriptions enable readers to understand how an overall mechanism works and
  reduce unnecessary confusion.</p>

  <h3>Process Descriptions</h3>

  <p>A process description explains how a process works or how to carry it out. Process descriptions can
  explain how a phenomenon occurs, how a product is manufactured, or how a task is accomplished step-by-step.
  They are suitable for but not limited to the following topics:</p>

  <ul><li>Technical processes: such as software development processes. • Business processes: such as how
  to apply for paid leave.</li><li>Legal and political processes: such as how to register to vote.</li></ul>

  <p>Excellent process descriptions help readers understand the scale, length, and complexity in a process
  and prepare for it informatively.</p>

  <h3>Developing Effective Details</h3>

  <p>An excellent technical description requires an effective structure and appropriate details. While
  mechanism and process descriptions share a lot in common, they have clear distinctions.</p>

  <h3>Mechanism Descriptions</h3>

  <p>Begin your mechanism description with your purpose, context, and scope. What does this description
  accomplish? What will readers take away from it? How in-depth is it? If readers hope to gain a basic
  understanding of a mechanism in a few minutes, provide a short description with basic facts and practical
  information. If readers are conducting research on a mechanism, perhaps provide a thorough description
  with comprehensive facts, background, and applications of that mechanism.</p>

  <p>Introduce the mechanism and describe its most relevant aspects. What is it? What does it do? What
  does it look like? How does it work? How does it compare to similar mechanisms? Depending on what you
  are describing, many common strategies can be employed. For instance, you can describe a mechanism by
  its components and how they work together. You can describe a mechanism with regard to its causes and
  effects, problems and solutions. Another strategy is to compare and contrast a mechanism with other
  mechanisms for their similarities, differences, or commonly held misunderstandings.</p>

  <p>Conclude your description by summarizing the major aspects of the mechanism. Depending on the length
  of your description, your conclusion could be as short as a sentence or two. It can also provide a relatively
  finer level of detail that highlights the gist of the mechanism.</p>

  <p>Table 4.1 is an example that describes how text-to-speech technology works. This mechanism description
  first provides a summary of the most important points. Then, the description begins by introducing and
  defining text-to-speech technology. It clearly reveals its focus on children and identifies parents
  as the intended audience. It then describes how text-tospeech technology works and how parents can adopt
  this technology for children. It concludes with a list of key takeaways. This description is entirely
  appropriate for the intended audience, with the right length, level of detail, and selection of topics.</p>

  <p>Table 4.1. A Mechanism Description (“Text-To-Speech Technology: What It Is and How It Works”)</p>

  <p>At a Glance • Text-to-speech (TTS) technology reads aloud digital text—the words on computers, smartphones
  and tablets.</p>

  <ul><li>TTS can help kids who struggle with reading.</li><li>There are TTS tools available for nearly
  every digital device.</li></ul>

  <p>This mechanism description begins with a summary of important points. Notice that the summary clearly
  identifies the intended audience</p>

  <p>Text-to-speech (TTS) is a type of assistive technology that reads digital text aloud. It’s sometimes
  called “read aloud” technology.</p>

  <p>With a click of a button or the touch of a finger, TTS can take words on a computer or other digital
  device and convert them into audio. TTS is very helpful for kids who struggle with reading. But it can
  also help kids with writing and editing, and even focusing.</p>

  <p>The author defines text-to-speech technology. The author then elaborates on TTS and explains their
  intended audience and purpose.</p>

  <h3>How Text-to-Speech Works</h3>

  <p>TTS works with nearly every personal digital device, including computers, smartphones and tablets.
  All kinds of text files can be read aloud, including Word and Pages documents. Even online web pages
  can be read aloud.</p>

  <p>The voice in TTS is computer-generated, and reading speed can usually be sped up or slowed down.
  Voice quality varies, but some voices sound human. There are even computer-generated voices that sound
  like children speaking.</p>

  <p>Many TTS tools highlight words as they are read aloud. This allows kids to see text and hear it at
  the same time.</p>

  <p>Some TTS tools also have a technology called optical character recognition (OCR). OCR allows TTS
  tools to read text aloud from images. For example, your child could take a photo of a street sign and
  have the words on the sign turned into audio.</p>

  <p>The author describes the nuts and bolts of how TTS works. Notice how the author connects the children
  with this description. The author also defines another term, OCR.</p>

  <h3>How Text-to-Speech Can Help Your Child</h3>

  <p>Print materials in the classroom—like books and handouts—can create obstacles for kids with reading
  issues. That’s because some kids struggle with decoding and understanding printed words on the page.
  Using digital text with TTS helps remove these barriers.</p>

  <p>Here the author begins to explain how TTS can help children. Notice that the heading confirms that
  parents are the intended audience.</p>

  <p>Table 4.1. A Mechanism Description (continued)</p>

  <p>How Text-to-Speech Can Help Your Child (continued) And since TTS lets kids both see and hear text
  when reading, it creates a multisensory reading experience. Researchers have found that the combination
  of seeing and hearing text when reading: • Improves word recognition</p>

  <ul><li>Increases the ability to pay attention and remember information while reading</li><li>Allows
  kids to focus on comprehension instead of sounding out words</li><li>Increases kids’ staying power for
  reading assignments</li><li>Helps kids recognize and fix errors in their own writing</li></ul>

  <p>Like audiobooks, TTS won’t slow down the development of your child’s reading skills.</p>

