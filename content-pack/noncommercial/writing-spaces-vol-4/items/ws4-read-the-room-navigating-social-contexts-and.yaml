  <p>It’s important to make a distinction between “mobbing” a powerful celebrity to make them accountable
  and doxing or firing an “average” (albeit racist, sexist, homophobic, etc.) citizen. But if there is
  a line to be drawn, where is it currently drawn? In whose minds? Should it be re-drawn?</p>

  <p>How can cancel culture be labeled as “bad” in two ways that are so very different? Is “canceling”
  to be avoided because it’s impolite or some kind of copout as Obama seems to suggest? Is it to be criticized
  because the “liberals” are weaponizing it, as Trump suggests?</p>

  <p>Is it even possible to analyze this phenomenon apolitically?</p>

  <p>Chi Luu discusses how internet language draws attention to how people are less socially passive (if
  they ever really were). She writes, “these terms [#MeToo, woke] seek to open up to debate the things
  that were once blindly accepted and taken for granted.” She further notes that some people are very
  much afraid of how the internet has given voice to “random bunch[es] of people who have banded together
  in some common cause. When this common cause is being aggrieved against someone’s problematic behavior,
  and results in ‘calling out,’ silencing or boycotting the problematic behavior, we now call this ‘cancelling’
  someone.”</p>

  <p>Luu mentions how Barack Obama called upon young people to avoid being overly judgmental online. And,
  as Luu notes, Obama’s comments are a, perhaps unsurprising, instance of someone in power reacting negatively
  to “power being wielded by [those who] are relatively powerless.”</p>

  <p>Luu suggests that, “though we tend to focus on the negative of cancelling, we forget that there may
  be a good side—not just praise or approval, but the fact that injustices that were once allowed to thrive
  can now be revealed and acted upon by a group.”</p>

  <p>As she points out, there is power in these call outs, which “can spontaneously self-assemble a community
  based on #shared beliefs where there may not have been one before, tapping into a power that members
  of a group individually may never have had.”</p>

