  <p>7.8 Spotlight on … Language and Culture</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Explain the role of sociohistorical context, including
  cultural and linguistic variations, in the review genre. • Identify and act on opportunities to publish
  a review.</p>

  <p>Reviewing, and evaluation and analysis more generally, often involves showing understanding of sociohistorical
  context. In other words, the work you are reviewing was created at a particular time for a specific
  audience. The film Black Panther, for example, was released in 2018 for a primarily American audience,
  but viewers and reviewers can delve further into this film’s cultural context.</p>

  <p>For one thing, this film can be placed in the context of other films from the Marvel Cinematic Universe
  (MCU). The MCU features characters from Marvel comic books and began with the release of Iron Man in
  2008. In addition to the Avengers films, the MCU includes character-specific “origin story” films of
  which Black Panther is a part. Characters from one film may appear as characters in other MCU films.</p>

  <p>In addition, Black Panther is part of a touchstone cultural moment. Since the beginning of the Black
  Lives Matter (2013–present) movement, more attention has been called to the lack of Black representation
  in films and TV. The film’s Black Panther, played by Chadwick Boseman, is a Black superhero who gives
  Black moviegoers a chance to see a superhero who looks like them. The film also comments on Black poverty
  and questions whether power and wealth should be shared or hoarded. The film also provides audiences
  of other backgrounds and ethnicities with the opportunity to witness characters who are developed beyond
  their stereotypes, as Caelia Marshall points out regarding the character of Killmonger in the Annotated
  Student Sample. These elements work to create empathy within a multicultural society.</p>

  <p>Offensive Language: When Is It Offensive and When Is It Artful?</p>

  <p>The question of language as a reflection of culture often surfaces in writing and reviewing dialogue,
  whether in film or books. When is offensive language gratuitous, and when does it serve an artistic
  purpose? The answer is never clear-cut in such areas, but as a reviewer you can ask yourself certain
  questions to determine whether you think it enhances the work. The basic, if simplified, question is
  this: Does the work lose its strength, honesty, sense of reality, or characterization if offensive language
  is removed? If the answer is yes, then the language serves an artistic purpose. Imagine, for example,
  dramas dealing with criminals involved in organized crime. The offensive language seems natural and
  contributes to the drama’s realism. Take away the language, and that realism is lost. Other films, however,
  would lose nothing in character depiction or realism if offensive language were omitted—not substituted
  for something less offensive.</p>

  <h3>Diversity in Hollywood</h3>

  <p>Recently, more attention is being paid to diversity in television and movies. The #OscarsSoWhite
  controversy began after the 2015 Oscars, following two consecutive years of all White nominees in the
  leading and supporting actor categories. The uproar brought awareness to the lack of diversity in Hollywood,
  and not just in terms of actors. Conversations about diversity behind the scenes began as well.</p>

  <p>One criticism the #OscarsSoWhite controversy brought to light was about the stories Hollywood tells.
  Whose stories get told, and who gets to tell those stories? While a limited number of people of color
  have been nominated for and even won Oscars, traditionally they have been for movies about racism and
  slavery (written by White writers or directed by White directors) and stereotypical roles such as the
  “magic negro” (a Black character who helps a White character). Who gets to decide what stories are made
  into movies became a major subject of conversation, as the people who fund movies are also typically
  White.</p>

  <p>The movie Green Book (2018) illustrates the backlash that can happen when movies fail to include
  enough diverse voices. The film is about a Black pianist (played by Mahershala Ali, b. 1974) and his
  White driver (played by Viggo Mortensen, b. 1958) traveling the country in 1962. The movie won the Oscar
  for Best Picture that year, and Ali won an Oscar for Best Supporting Actor. However, criticism of the
  movie was aired both before and after the Oscars ceremony. The family of the real-life pianist, Don
  Shirley (1927–2013), said the filmmakers worked with them very little. Some criticized the movie for
  seeming to be more about the driver, Frank Vallelonga (1930–2013), than about Shirley. The movie’s director,
  Peter Farrelly (b. 1956), is a White man better known for directing raunchy comedies than movies about
  the Civil Rights era.</p>

