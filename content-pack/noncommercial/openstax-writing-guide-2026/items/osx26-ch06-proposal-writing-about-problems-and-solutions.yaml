  <h3>Drafting a Proposal</h3>

  <p>With a tentative thesis, an organization plan, and evidence, you are ready to begin drafting your
  proposal. For this assignment, you will discuss a problem, present possible solutions, address objections
  to the solutions, and conclude with a recommendation.</p>

  <h3>Introduction</h3>

  <p>You may choose to write the introduction first, last, or midway through the drafting process. Whenever
  you choose to write it, use it to draw readers in. Make the proposal topic clear, and be concise. End
  the introduction with your thesis statement.</p>

  <p>Opening a proposal with an overview of your topic is a reliable strategy, as shown in the following
  studentwritten example on women working in IT. The thesis statement, which appeared earlier in this
  section, is underlined:</p>

  <p>People who work in the information technology (IT) field often start their careers fixing computers
  and other electronic devices for others. Through experience and education, an IT worker’s career path
  can branch out to specialize in everything from programming new software to setting up and maintaining
  networks. The IT field is growing because of the constant development of technology, and the demand
  for employees also is growing. Yet the number of women employed in the IT field is decreasing every
  year, a trend that can be changed with a multifaceted approach that includes initiatives in middle schools,
  high schools, and colleges; active recruitment; mentoring programs; and flexible work arrangements.</p>

  <h3>Body Paragraphs: Problem, Solutions, Objections</h3>

  <p>The body paragraphs of your proposal should present the problem, the solution or solutions, and potential
  objections to the proposed solution(s). As you write these paragraphs, consider using the point, evidence,
  and analysis pattern:</p>

  <ul><li>The point is the central idea of the paragraph, usually given in a topic sentence stated in
  your own words at or toward beginning of the paragraph.</li><li>With the evidence you provide, you develop
  the paragraph and support the point given in the topic sentence. Include details, examples, quotations,
  paraphrases, and summaries from sources. In your sentences and paragraphs, synthesize the evidence you
  give by showing the connections between sources. See Position Argument: Practicing the Art of Rhetoric
  and Argumentative Research: Enhancing the Art of Rhetoric with Evidence for more information on quoting,
  summarizing, paraphrasing, and synthesizing.</li><li>The analysis comes at the end of the paragraph.
  In your own words, draw a conclusion about the evidence you have provided and relate it to the topic
  sentence.</li></ul>

  <p>The paragraphs that follow show the point-evidence-analysis pattern in practice.</p>

  <h3>Body Paragraphs: Problem</h3>

  <p>Follow the introduction with a discussion of the problem. Using paragraph structure, define the problem
  and discuss it, drawing on evidence from your sources. This paragraph (or paragraphs) should answer
  these questions: What is the problem? Why is this a problem? The following example, from the proposal
  on women working in IT, answers the first question:</p>

  <p>The information technology (IT) field is continuously expanding, with many more positions available
  than workers to fill them. In fact, the pool of IT professionals was so small that in 2001, Congress
  raised the visa limit in an effort to fill the gap with employees from overseas (Varma, 2002). And yet
  the number of women represented in the occupation is decreasing. From 1990 to 2020, the percentage of
  women in IT declined from 31 percent to 25 percent, even though women make up 47 percent of all employed
  adults in the United States. According to White (2021), only 19 percent of women pursue a computer science
  major in college, compared to 27 percent in 1997. Of those women who graduated with a computer science
  degree, 38 percent are working in the field compared to 56 percent of men, a statistic that indicates
  women are not staying in the field. Although gender diversity supposedly is valued in the workplace,
  the underrepresentation of women in IT is clearly a problem.</p>

  <p>The writer then goes on to answer the second question: Why is this a problem? The writer discusses
  stereotypes, lack of encouragement and role models, workplace culture, pay, and prospects for advancement
  (not shown here).</p>

  <h3>Body Paragraphs: Solutions</h3>

  <p>After presenting and explaining the problem, use specific information from the sources you consulted
  to present the solution or solutions you have discovered through your research. If you are proposing
  more than one solution, present them one at a time, using headings as appropriate.</p>

  <p>The solutions section will likely be the longest part of your proposal. Below are two paragraphs
  from the proposal about women working in IT. Note how the first paragraph introduces the solutions and
  how the second paragraph uses evidence to develop the first proposed solution. Also note the informative
  boldface headings.</p>

  <p>The following suggestions are ways to encourage women to enter IT and build their careers, with the
  eventual goal of achieving gender balance in the field. The solutions discussed include encouraging
  interest in computer technology among girls in middle school and high school, actively recruiting college-age
  women to study IT, and within the field, mentoring women and expanding workplace flexibility to improve
  retention.</p>

  <p>The National Center for Women &amp; Information Technology (NCWIT) is an organization that encourages
  girls in middle school and high school to explore their interest in IT. One program, the NCWIT’s Aspirations
  in Computing, supports women in high school by showing them that they can succeed in technology and
  introducing them to other students with similar interests. The same program matches middle-school girls
  with female high-school and college students and awards scholarships for computing and programming competitions.
  In addition, internships and IT courses in middle school and high school provide opportunities to learn
  what a career in IT entails, with or without a degree in IT. Opportunities like these give girls and
  women support and a sense of belonging.</p>

  <p>The paragraphs that follow (not shown here) continue the discussion of the possible solutions.</p>

  <h3>Body Paragraphs: Objections</h3>

  <p>Depending on the problem and solution, consider the objections readers may raise, and explain why
  your proposal is necessary and worthwhile. For example, the proposal on women in IT does not discuss
  objections because few people would object to the writer’s proposal. Shawn Krukowski, however, in his
  proposal on climate change, includes a section on objections to taking action. He focuses the discussion
  on people who deny that climate change is a problem. Would you do the same? Consider whether this section
  of Shawn’s proposal might have been stronger had he addressed objections to the solutions he proposed—mitigation
  and adaptation—instead of objections to the problem.</p>

  <p>Despite scientific evidence, some people and groups deny that climate change is real or, if they
  admit it exists, insist it is not a valid concern. Those who think climate change is not a problem point
  to Earth’s millennia-long history of changing climate as evidence that life has always persisted. Most
  of the change, however, predates human civilization, which has benefited from thousands of years of
  stable climate. The rapid change since the Industrial Revolution is unprecedented in human history.</p>

  <p>Those who deny climate change or its dangers seek primarily to relax or remove pollution standards
  and regulations in order to protect, or maximize profit from, their industries. To date, their lobbying
  has been successful. For example, the world’s fossil-fuel industry received $5.3 trillion in 2015 alone,
  while the U.S. wind-energy industry received $12.3 billion in subsidies between 2000 and 2020 (Green
  America, 2020).</p>

  <h3>Conclusion and Recommendation</h3>

  <p>The conclusion and recommendation section of your proposal is the part in which you interpret your
  findings and make a recommendation or give a call to action. At this point, focus on the solution that
  will best solve the problem, suggesting or summarizing specific actions.</p>

  <p>Below is the recommendation section from the proposal about women in IT. In the full conclusion (not
  shown here), the writer summarizes the main points of the proposal. In the recommendation paragraph
  that follows, the writer calls for specific actions:</p>

  <p>Many researchers have studied why few women choose IT as a career and why some decide to leave the
  field. Although the numbers cannot be improved immediately, the following changes in school and the
  workplace could recruit and retain more women in IT:</p>

  <ul><li>Include technology education courses and formal IT programs in middle- and high-school curricula
  to give girls and young women opportunities to develop an interest at an early age.</li><li>Develop
  internship and mentor programs in high schools and colleges to combat stereotyping and encourage women
  to enter the field.</li><li>Develop and encourage workplace mentor programs, flexible work options,
  and open communication for professional growth and retention.</li></ul>

  <p>With time and effort, these actions may result in more women seeing themselves in long-term IT careers.</p>

  <h3>References or Works Cited Page</h3>

  <p>Including any data you gathered through primary research, such as a survey you created and administered,
  interviews you conducted, or observational notes you took, you must cite the sources you consulted.
  These sources appear in the text of your proposal and in a bibliography at the end. The paragraphs in
  the previous section, including Shawn Krukowski’s proposal, use APA documentation style. For more on
  documenting sources, see Index and Guide to Documentation, MLA Documentation and Format, and APA Documentation
  and Format.</p>

  <h3>Abstract or Executive Summary</h3>

  <p>An abstract (or executive summary) summarizes your proposal. The purpose is to present information
  briefly and economically so that readers can decide whether they want to read further. Include your
  main points, but not the evidence.</p>

  <p>Although an abstract or executive summary comes first in a proposal, it is advisable to write it
  after you have completed your proposal and are certain of your main points. The example below is the
  abstract from the proposal about women in IT.</p>

  <p>The purpose of this proposal is to raise awareness of the small number of women working in the information
  technology (IT) field, to examine the factors that contribute to discouraging women from entering IT,
  and to propose ways to draw women into the field and retain them. Although the IT field is growing,
  the number of women employed within it remains low. Women may be reluctant to pursue a career in IT
  because of stereotypes, few role models, and lack of encouragement. Women who have already established
  a career in IT report leaving the field for these reasons, as well as family responsibilities and lack
  of advancement. There are several potential ways to raise the number of women in IT. Encouraging interest
  in computer technology among girls in middle school and high school, recruiting college-age women to
  study IT, mentoring young professional women, and improving workplace flexibility will, over time, break
  down stereotypes and increase the number of women in the IT field.</p>

  <h3>Peer Review: Getting Feedback from Readers</h3>

  <p>With a complete draft in hand, you may engage in peer review with your classmates, giving feedback
  to each other about the strengths and weaknesses of your drafts. For peer review within a class, your
  instructor may provide a list of questions or a form for you to complete as you work together.</p>

  <h3>Conferencing in Writing Groups</h3>

  <p>Other people can provide feedback on your writing beside your classmates. If you have an on-campus
  writing center, it is well worth your time to make an online or in-person appointment with a tutor at
  any point in your writing process. You will get valuable comments and improve your ability to review
  your own writing.</p>

  <p>Another way to get fresh eyes on your writing is to ask a friend or family member to read your draft.
  To get useful feedback, provide a list of questions or a form such as the one shown in Table 6.6 for
  them to complete as they read.</p>

  <h3>Question for Reviewer</h3>

  <p>Does the introduction interest you in the problem? Can you find the thesis statement? Underline it
  for the writer. TABLE 6.6 Peer Review Questions</p>

  <p>Comment or</p>

  <p>Suggestion</p>

  <p>Question for Reviewer</p>

  <p>Comment or</p>

  <h3>Suggestion</h3>

  <p>Does the thesis state the problem and suggest that a solution will be proposed?</p>

  <p>Can you identify a paragraph or paragraphs that define and explain a problem?</p>

  <p>Can you identify a paragraph or paragraphs that propose one or more solutions to the problem?</p>

  <p>Does the writer address possible objections to the solution or solutions? If not, are there objections
  the writer should consider?</p>

  <p>Does each paragraph start with a point stated in the writer’s own words, and does that point relate
  to the thesis? Mark paragraphs that don’t have a clear point.</p>

  <p>Does each paragraph support the main point of the paragraph with details and evidence, such as facts,
  statistics, or examples? Mark paragraphs that need more support and/or explanation.</p>

  <p>Does each paragraph end with analysis, in the writer’s own words, that draws a conclusion? Mark paragraphs
  that need analysis.</p>

  <p>Is there a clear conclusion that makes a recommendation and connects to the thesis statement?</p>

  <p>Where do you get lost or confused? Mark anything that is unclear.</p>

  <p>Does the proposal flow from one point to the next?</p>

  <p>Does the essay have a clear, descriptive title?</p>

  <h3>Revising Your Proposal</h3>

  <p>A strong college paper is rarely written in a single draft, so build in time to revise your work.
  Take time with the comments you receive from your readers, and read your own work with a critical eye.</p>

  <h3>Responding to Reviewers’ Feedback</h3>

  <p>When you receive feedback from readers—whether from your instructor, your classmates, a writing tutor,
  or someone else—read each comment carefully to understand what the reader is communicating. Do your
  best not to become defensive, and be open to suggestions for improvement. Remind yourself that your
  readers are trying to help. As someone who hasn’t thought about your proposal as much as you have, a
  new reader can often see strengths and weaknesses that you cannot. Analyze each response, and decide
  whether acting on a suggestion will make your writing better. Remember that you remain the author, and
  you make the final call on your writing.</p>

  <p>As you read, keep track of the comments your readers make. Pay special attention to strengths and
  weaknesses that more than one reader identifies. Use that information to improve later assignments as
  well as your proposal.</p>

  <h3>Revising on Your Own</h3>

  <p>The following revising strategies can help you read your draft critically and carefully:</p>

  <ul><li>Read your draft aloud. Read the entire text from the beginning slowly and carefully, marking
  spots that need revision. Reading in this way allows you to see areas that need clarification, explanation,
  or development that you may have missed when you wrote the first draft. You can also have someone read
  your draft aloud to you.</li><li>Make a paragraph outline. The most common unit of thought in writing
  is the paragraph, a group of sentences set off from other groups because they focus on a single idea.
  Writing a paragraph outline creates a map of your whole paper that can help you determine whether the
  organization is effective or needs changing. Number each paragraph and write a phrase describing its
  topic or focus. Check that each paragraph has a topic sentence that states the main idea of the paragraph.</li><li>Test
  your evidence. Check whether each piece of evidence is factual and supports the main idea of the paragraph.
  Check that each piece of evidence is introduced, woven into your sentences, and cited.</li><li>Listen
  for your voice. In most college papers, your language should sound like a real person. If your instructor
  requires a formal style for the assignment, the language should be objective and in thirdperson point
  of view.</li><li>Let go if you need to. View change as good. Learn to let go of words, sentences, paragraphs,
  and maybe even your entire first draft. Sometimes the best way to revise is to start fresh. The knowledge
  you have built in writing a first draft will serve you well if you need to start over.</li><li>Create
  a new file for each revision. Each time you revise a draft, save the new version with a new file name
  so that you don’t lose your previous work. That way, you can return to an earlier version of your draft
  if you are not happy with the revision.</li><li>Edit and proofread. When you are satisfied with the
  overall shape of your paper, reread it once again to check for sentence-level errors in grammar, punctuation,
  spelling, and source citations.</li></ul>

  <h3>Taking It Public: Publishing or Presenting Your Proposal</h3>

  <p>Publishing is a final step in the writing process. You may want to consider publishing your full
  proposal in your campus newspaper (or rewriting it as a letter to the editor) if your topic is related
  to your school. Or you may want to present it to an organization or committee on campus that can help
  you make your solution a reality. If your topic is related to the community in which you live, consider
  submitting your proposal to the local newspaper or presenting it at a city council meeting. (Note that
  if you decide to present your proposal orally, you’ll need to figure out in advance the procedure for
  speaking or getting on a meeting agenda.) If your topic is more general and involves substantial research,
  consider submitting your proposal to one of these journals that publish undergraduate research work
  in all fields:</p>

  <ul><li>American Journal of Undergraduate Research (https://openstax.org/r/americanjournalofugreasearch)
  • Midwest Journal of Undergraduate Research (https://openstax.org/r/midwestjournalugreasearch)</li><li>PURSUE
  Undergraduate Research Journal (https://openstax.org/r/pursuejournalugreasearch)</li></ul>

  <p>6.6 Editing Focus: Subject-Verb Agreement</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Identify subjects and verbs in sentences. • Distinguish
  between subjects and verbs that agree and those that do not.</p>

  <p>Readers of formal documents such as proposals expect writers to be aware of the conventions of grammar
  and punctuation. One such convention is subject-verb agreement. The subject of a sentence names something.
  The predicate contains the verb, which expresses an action, an occurrence, or a state of being. The
  subject and verb in a sentence must agree. In standard English, “agreement“ means that a singular subject
  must have a singular verb (The bus leaves in five minutes) and a plural subject must have a plural verb
  (The buses leave in five minutes). However, some English dialects omit the -s ending for singular verbs
  or use a singular verb with a plural subject: The man ask for help. Property taxes was raised last year.
  Subject-verb agreement gets tricky in several sentence constructions, which are described below. To
  check for subject-verb agreement in your writing, proofread your final draft by finding each subject
  and verb. Then use the following questions to test whether the subject and verb agree. For more on subject-verb
  agreement, see Verbs. Is the subject compound? Two or more subjects joined by and take a plural verb
  in most sentences:</p>

  <p>Basketball and wrestling are my favorite sports. However, when the parts of the subject form a single
  idea or unit, the verb is singular:</p>

  <p>Red beans and rice is my favorite meal. Ten dollars is enough money for lunch. When compound subjects
  are joined by or or nor, the verb should agree with the word closest to it: Either your uncles or your
  mother remembers your grandmother’s gumbo recipe. Either your mother or your uncles remember your grandmother’s
  gumbo recipe. Do other words come between the subject and verb? The verb must agree with the subject
  even when words and phrases come between them: The price of these shoes at all stores is unbelievable.
  A suitcase containing sweaters, coats, and jackets was found in the street. Does the verb come before
  the subject? The subject and verb must agree even when the verb comes before the subject: Are Daniela
  and Juliana waiting at the restaurant? There were three dogs in the yard, all barking at the same time.
  In my pocket are a wallet and two pens. Is the subject an indefinite pronoun, such as everyone? Indefinite
  pronouns do not refer to specific people or things. Most indefinite pronouns take a singular verb, but
  not all. The indefinite pronouns that take a singular verb include anybody, anyone, anything, each,
  either, everybody, everyone, everything, neither, nobody, no one, nothing, one, somebody, someone, and
  something.</p>

  <p>Everyone on the team practices all season. Neither of the wide receivers feels ready for the season
  to end. These indefinite pronouns take a plural verb: both, few, many, others, and several. Several
  of the athletes on the team come from the same high school. Both wide receivers have excellent stats.
  A few indefinite pronouns take a singular or plural verb depending on whether the word they refer to
  is singular or plural. These include all, any, enough, more, most, none, and some. With these pronouns,
  use a singular or plural verb that fits the context of your sentence. All of these students take at
  least one class in science or math. (plural) Most of his work is original. (singular) Is the subject
  a collective noun? Collective nouns, such as audience, band, class, crowd, family, group, or team, can
  take a singular or a plural verb depending on the context. When group members act individually, use
  a plural verb. Writers often add the word members for clarity. When the group acts as a single unit,
  which is the most common construction, use a singular verb: The band rehearses every Thursday. The union
  (members) still disagree on the contract terms.</p>

  <h3>Practice Subject-Verb Agreement</h3>

  <p>Select the correct verb to complete each sentence. 1. Under the table ________ his slippers and socks.
  (is, are) 2. The choir usually ________ in the auditorium. (meets, meet) 3. Some of the actors ________
  two roles. (performs, perform) 4. Some of this song ________ familiar. (sounds, sound) 5. Either my
  brother or my sisters ________ the keys to the truck. (has, have) 6. ________ Whitney and her friend
  need a ride to the station? (does, do) 7. The situation concerning the reports and their authors ________
  under investigation. (is, are) 8. Fifteen dollars and 40 cents ________ the amount of change she received.
  (is, are)</p>

