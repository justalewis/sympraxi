body: '<p><em>Access for free at openstax.org.</em></p>

  <p>Proposal: Writing About Problems and Solutions</p>

  <p>6</p>

  <h3>CHAPTER OUTLINE</h3>

  <p>6.1 Proposing Change: Thinking Critically About Problems and Solutions 6.2 Proposal Trailblazer:
  Atul Gawande 6.3 Glance at Genre: Features of Proposals 6.4 Annotated Student Sample: “Slowing Climate
  Change” by Shawn Krukowski 6.5 Writing Process: Creating a Proposal 6.6 Editing Focus: Subject-Verb
  Agreement 6.7 Evaluation: Conventions, Clarity, and Coherence 6.8 Spotlight on … Technical Writing as
  a Career 6.9 Portfolio: Reflecting on Problems and Solutions</p>

  <p>INTRODUCTION You are likely familiar with the term proposal—people propose toasts to celebrate occasions
  and make marriage proposals. Businesses create proposals to describe the services they will provide
  and at what cost—from electricians, plumbers, and decorators to advertising firms, website designers,
  and caterers.</p>

  <p>Sometimes the proposals are for a specific project; sometimes they are general. In these types of
  real-world proposals, the problem being solved is straightforward, but often it is not stated directly:
  for example, someone needs an extra bathroom built in their house, a revision to their website, or food
  for a gathering, and the person needing a service will contact a provider.</p>

  <p>The purpose of the kind of proposal you will write in this chapter is to propose, or suggest, a solution
  to a problem, usually one whose solution is not straightforward. Proposals of this type call on writers
  to explain the problem so that readers understand it is real and needs a solution. Because these problems
  are often complex, they usually have more than one solution, and sometimes the writer will recommend
  several possible solutions. For example, imagine you are studying food science. You likely pay more
  attention to food than most people do, and perhaps you’ve noticed a lot of food being thrown away in
  a cafeteria on your campus. You believe it is important to reduce food waste. Solving this problem of
  wasted food will require investigation and research into what food is being thrown away; why students,
  faculty members, and employees are throwing it away; possible ways to reduce the amount of wasted food;
  and a recommendation to the people who can put your proposal—that is, your proposed solution— into action.
  This is one example of the kind of problem you might write about in this chapter.</p>

  <p>6.1 Proposing Change: Thinking Critically About Problems and Solutions</p>

  <p>LEARNING OUTCOMES</p>

  <p>By the end of this section, you will be able to: • Ask critical-thinking questions about problems
  to explore an idea for a proposal. • Distinguish between fact and opinion. • Recognize and locate bias
  in reading and in yourself.</p>

  <p>As a proposal writer, you will offer factual evidence to show a problem exists and needs to be addressed.
  Then you will present and recommend one or more solutions, again providing evidence to show that your
  solution or solutions are viable. To accomplish this task, you’ll need to think critically about problems
  and potential solutions, know the difference between fact and opinion, and identify bias.</p>

  <h3>Adopting a Problem-Solving Mindset</h3>

  <p>As you start thinking about a problem you would like to explore, gather information by reading, viewing,
  or talking with others. Is there a local problem you have noticed—perhaps you think your campus needs
  better transportation, more diverse food options, more mental health services, or a new student organization
  related to a cause you care about? Or is there a larger issue that is important to you, such as funding
  for public schools, better access to health care, or helping the environment?</p>

  <p>As you gather ideas, think critically about what you are learning. Asking questions like the ones
  below can help you get into a problem-solving mindset:</p>

  <h3>Questions about Problems</h3>

  <ul><li>What is/was the cause of the problem? • What is/was the effect of the problem? • What makes
  this problem a problem?</li></ul>

  <h3>Questions about Solutions</h3>

  <ul><li>Have solutions to this problem been proposed in the past? What are they? • Why have the solutions
  proposed in the past succeeded or not succeeded in solving the problem? • Who can put the solutions
  into action?</li></ul>

  <p>The proposal that appears in Annotated Student Sample of this chapter, written by student Shawn Krukowski,
  takes on a large, complex problem: climate change. At the start of the project, Shawn thought about
  his topic in terms of the questions above:</p>

  <ul><li>What is the cause of climate change? • What is the effect of climate change? • What makes climate
  change a problem? • What are some possible solutions to climate change? • What solutions to climate
  change have been tried in the past? • Why have the solutions tried in the past been unsuccessful in
  solving climate change? • Who can put the solutions into action?</li></ul>

  <p>In writing answers to these questions, Shawn identified what he needed to learn about climate change
  before he began his reading and research.</p>

  <h3>Distinguishing Fact from Opinion</h3>

  <p>A proposal contains both fact and opinion. Proposal writers use facts as evidence to show that the
  problem they are writing about is real. They use facts to show that the proposed solution can work.
  They give opinions (based on evidence) when they recommend a solution to their audience and call them
  to action. See Argumentative Research: Enhancing the Art of Rhetoric with Evidence for more about facts
  and opinions.</p>

  <p>It can sometimes be difficult to distinguish fact from opinion, allegations, and fake news. Social
  media platforms, in particular, make it hard for many people to distinguish between sources that are
  credible and those that are not. As a writer, you need to use a critical eye to examine what you read
  and see.</p>

  <p>Facts are statements that can be proven or whose truth can be inferred. They are built on evidence
  and data. The following are examples of factual statements:</p>

  <ul><li>The first mass-produced hybrid vehicle was the Toyota Prius, which was launched in Japan in
  1997. • Americans born after 1996 are considered Generation Z.</li></ul>

  <p>Facts that use numbers are called statistics:</p>

  <ul><li>According to the Pew Research Center, 50 percent of Gen Z-ers aged 18–23 reported that they
  or someone in their household had lost a job or taken a pay cut in March 2020, the first month of the
  COVID-19 pandemic.</li><li>The six-year graduation rate for full-time undergraduate students was 62
  percent in 2018.</li></ul>

  <p>Opinions are statements of belief or value. Opinions form the basis of recommended solutions in proposals.
  Below is an opinion that precedes a list of recommendations to raise the graduation rate:</p>

  <ul><li>The six-year graduation rate for full-time undergraduate students, which was 62% in 2018, can
  and should be improved by taking the following steps…</li></ul>

  <p>Recognizing Bias</p>

  <p>Critical thinking and reading of information involve recognizing bias. Bias is commonly defined as
  a preconceived opinion, or a prejudice, about something—a subject, an idea, a person, or a group of
  people, for example. As a proposal writer, you will need to recognize bias in the information you read
  as you learn about the problem and to recognize possible bias in your own thinking as well.</p>

  <h3>Bias in Sources</h3>

  <p>Some writing is intentionally biased and intended to persuade, such as editorials and opinion essays,
  also called op-eds (because of their placement opposite the editorial page in print newspapers). Writing
  meant to persuade is generally not used as source material in a proposal. Instead, seek out informative,
  neutral sources that consider more than one aspect of a problem. Be aware, however, that even sources
  that seem impartial may contain some bias. Bias becomes a problem when a source that seems objective
  and trustworthy contains language and images intended to sway your opinion, or when a source downplays
  or ignores one or more aspects of a topic.</p>

  <p>The evidence you use to support the discussion of a problem or the worth of a solution should not
  be heavily biased. As you consider sources for your proposal, the following tips can help you spot bias
  and read critically:</p>

  <ul><li>Determine the purpose of the source. Is the writing intended to inform you or to persuade you?
  • Distinguish between fact and opinion. Mark facts and opinions when gathering information from the
  source. • Pay attention to the language and what the writer emphasizes. Does the language include inflammatory
  words or descriptions intended to sway readers? What do the title, introduction, and any headings tell
  you about the author’s approach to the subject? • Research the author. Is the writer an impartial expert?
  Or is the writer known for being biased? • Read multiple sources on the topic. Learn whether the source
  is omitting or glossing over important information and credible views. • Look critically at the images
  and any media that support the writing. How do they reinforce positive or negative treatment of the
  subject? Bias in Yourself Most individuals bring what psychologists call cognitive bias to the interactions
  in their lives, whether with information or with other people. Cognitive bias refers to how humans’
  thinking patterns affect how they take in and process new information. As you research information for
  a proposal, also be aware of confirmation bias, which is the tendency to seek out and accept information
  that supports (or confirms) a belief you already have and to ignore or dismiss information that challenges
  that belief. For example, perhaps you believe strongly that the graduation rate at the college you attend
  is too low and that more students would graduate if the college provided more financial aid in the form
  of grants. With that belief, you would likely be more receptive to facts and statistics showing that
  students who receive financial aid in the form of grants, not loans, are more likely to graduate. However,
  if you believe that more students would graduate if they took advantage of the academic support services
  the college offers, then you would likely be more receptive to facts and statistics showing that students
  who work hard and use academic support services graduate in higher numbers. As you read about problems
  and solutions, the best way to guard against bias is to be aware that bias exists, to question what
  you read, and to challenge your own beliefs. You can learn more about bias, especially in language,
  in Spotlight on … Bias in Language and Research.</li></ul>

  <h2>Proposal Trailblazer: Atul Gawande</h2>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Describe a particular problem and a proposed solution. • Discuss the process of identifying
  a problem and proposing a solution. • Articulate how proposals to solve problems reach their intended
  audience.</li></ul>

  <p>“What do you do when expertise is not enough?”</p>

  <h3>Medical Problem Solver</h3>

  <p>Born in New York City, surgeon and author Atul Gawande (b. 1965) graduated from Stanford University
  in 1987 with a degree in biology and political science. A Rhodes Scholarship enabled him to study at
  the University of Oxford, where he earned a master’s degree in philosophy, politics, and economics.
  Returning to the United States from England, Gawande entered politics and worked for Al Gore’s (b. 1948)
  presidential campaign and later served as a health care adviser during the Clinton administration (1993–2001).
  Gawande graduated from Harvard Medical School with an MD in 1995 and an MPH (master of public health)
  in 1999. Among his main concerns and frequent topics of his written work have been patient care and
  medical ethics.</p>

  <p>In the mid-2000s, Dr. Gawande came across a simple idea for improving medical care. Another physician,
  Peter Pronovost (b. 1965), a critical care specialist, had identified a solution to the problem of patients
  in intensive care units (ICUs) developing infections after having central intravenous lines inserted.
  The cause of the problem was human error. Doctors knew the steps they needed to follow to prevent infection
  when they inserted a central line, but some of them skipped at least one of the steps. When they did,
  the risk of a dangerous infection increased, which in turn increased the likelihood of a poor outcome
  for the patient—longer illness, additional surgery, or death.</p>

  <p>Borrowing a method from airplane pilots, who must go through a checklist before being cleared for
  takeoff, Dr. Pronovost proposed a similar solution for ICU doctors: a checklist of five things they
  needed to do when inserting a central intravenous line. Dr. Pronovost ran an experiment in the ICU at
  the hospital where he worked. Doctors were instructed to follow the steps on the checklist, and nurses
  who assisted during the procedure were told to observe and speak up if a doctor skipped a step.</p>

  <p>The checklist worked. The infection rate dropped dramatically, reducing ICU stays, saving lives,
  and saving money. Dr. Pronovost began writing checklists for other ICU situations. These checklists
  were successful as well in addressing particular problems.</p>

  <p>Approached by the World Health Organization, Dr. Gawande worked with a team around the world to develop
  a checklist to improve the safety of surgery. As a surgeon, he was well aware of complications that
  could occur as a result of mistakes before, during, and after surgery. The team created a 19-point “safe
  surgery” checklist that was tested at eight hospitals around the world, including one in the United
  States. The checklist worked again—all eight hospitals saw the rate of significant postsurgical complications
  and deaths drop by an average of more than 35 percent, with no additional costs. The problem the two
  doctors identified is both simple and complex. The problem is not that doctors lack knowledge; the problem
  is that because the situations they encounter are often complicated and urgent, doctors do not always
  correctly apply what they know. The solution proposed by Dr. Gawande and Dr. Pronovost is similarly
  both simple and complex: to improve accuracy, use a checklist. However, other doctors needed to be convinced
  that a simple change like this would improve medical care. To persuade others, Gawande and Pronovost
  wrote articles for medical journals in which they presented the problem they studied, the methods they
  used, the results of their experiments, and the solution they recommended. Dr. Gawande then went on
  to apply the checklist solution to preventable problems in fields outside of medicine in his book The
  Checklist Manifesto: How to Get Things Right (2009), which became a best seller.</p>

  <h3>Discussion Questions</h3>

  <p>1. How did Drs. Pronovost and Gawande define the problems they were trying to solve? 2. What evidence
  did Drs. Pronovost and Gawande use to support their proposed solutions? 3. Who was the audience for
  the doctors’ proposals? Why might some audience members be hesitant about accepting the checklist solution?
  4. Think about the relationship between doctors and nurses. Who has more authority in a medical setting?</p>

  <p>How might the doctors’ and nurses’ reactions to using the checklist differ? 5. In what ways is the
  problem the doctors tackled both simple and complex? 6. In what ways is the solution the doctors proposed
  both simple and complex?</p>

  <p>6.3 Glance at Genre: Features of Proposals</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Discuss the roles of purpose and audience in writing
  a proposal. • Define key features and characteristics of proposals.</p>

  <p>As you think about the problem for your proposal, it is important to understand the rhetorical situation,
  or the circumstance in which a writer communicates with an audience of readers, including your purpose,
  audience expectations, and the key elements of the proposal genre. The rhetorical situation and its
  relationship to writing your proposal is discussed more fully in Writing Process: Creating a Proposal.</p>

  <h3>Defining Your Purpose</h3>

  <p>Your purpose is your reason for writing. The broad purpose for most academic and real-world proposals
  is to offer a solution to a problem. You, the writer, are tasked with identifying a problem and recommending
  a solution. You may need to write a proposal for a research project in a sociology class, or you may
  need to write a business proposal for a marketing class or a business you’ve started. Many topics are
  suitable for a proposal in a college writing class. For example, some problems are local and can be
  acted on directly, such as improving access to mental health services on your campus, offering a new
  food delivery option to campus buildings, designating quiet study spaces in your library, or bringing
  a farmer’s market to your campus. Others are large-scale, research-oriented proposals such as reducing
  automobile emissions, providing broadband Internet access nationwide, or reforming immigration policies
  in the United States. Read your assignment carefully, and be sure you know the requirements and the
  amount of flexibility you have.</p>

  <h3>Tuning in to Audience Expectations</h3>

  <p>The audience for your writing consists of the people who will read it or who could read it. Are you
  writing for your instructor? For your classmates? For students or administrators on your campus or people
  in your community? Think about the action they can take to solve the problem. For example, if the problem
  you’re presenting is a lack of diverse food options on your campus, a proposal to other students would
  perhaps ask students to join you in calling for change in dining options, whereas a proposal to administrators
  would request specific changes.</p>

  <p>Whoever your readers are, they expect you to do the following:</p>

  <ul><li>Address a specific, well-defined problem. As the writer, ensure that your readers know what
  the problem is and why it needs to be solved. Some problems are well-known, whereas others need to be
  explained.</li><li>Have an idea of what they already know. It is up to you as the writer to learn as
  much as possible about your audience. You need to know how receptive your audience may be to your suggestions
  and what they know about the problem you’re proposing to solve. Their knowledge—or lack thereof—will
  require you to adjust your writing as needed. If readers are new to the problem, they expect you to
  provide the necessary background information. If they are knowledgeable about the problem, they expect
  you to cover background information quickly.</li><li>Provide reliable information. in the form of specific
  facts, statistics, and examples. Whether you present your own research or information from sources,
  readers expect you to have done your homework and present trustworthy information about the problem
  and the solution.</li><li>Structure your proposal in a logical way. Open with an introduction that tells
  readers the subject of the proposal, and follow with a logical structure.</li><li>Adopt an objective
  stance. Writing objectively means adopting a position and tone that are neutral and free from bias,
  personal feelings, and emotional language. In doing so, you show respect for your readers’ knowledge
  and intelligence, and you build credibility and trust, or ethos, with your readers.</li><li>Tell them
  what you want them to do in response to your proposal. Do you want them to engage other members of the
  community? Build something? Contact their legislators? Although they may not do what you want, they
  are unlikely to act at all if you don’t tell them what you would like them to do.</li></ul>

  <h3>Exploring the Genre</h3>

  <p>A formal proposal may include the components addressed in Analytical Report: Writing from Facts.
  If you’re writing a business proposal (a document that proposes a transaction between a business and
  a client and also spells out deliverables, a schedule, costs, and payment), you can find a full discussion
  in OpenStax’s forthcoming Business Communications text.</p>

  <p>The following are key terms and characteristics of problem-solution proposals:</p>

  <ul><li>Abstract or executive summary: paragraph that summarizes the problem and recommended solution.
  The purpose is to present information in the most concise and economical way possible for your readers.</li><li>Audience:
  readers of a proposal or any piece of writing. • Bias: a preconceived opinion about something, such
  as a subject, an idea, a person, or a group of people.</li></ul>

  <p>As a reader, be attentive to potential bias in sources; as a writer, be attentive to bias in yourself.
  • Body: main part of a proposal; appears between the introduction and the conclusion and recommendation.
  The body of a proposal consists of paragraphs that discuss the problem and present a solution or solutions.
  • Citation of sources: references in the text of a proposal to sources the writer has used as evidence.
  The sources are also listed, with full bibliographic information, at the end of the proposal. Citing
  sources is essential to avoid plagiarism. • Conclusion and recommendation: last part of a proposal.
  The conclusion restates the problem and recommends a solution. This paragraph often issues a call to
  action.</p>

  <ul><li>Critical thinking: ability to look beneath the surface of words and images to analyze, interpret,
  and evaluate.</li><li>Ethos: also known as ethical appeal; the sense that the writer or other authority
  is trustworthy and credible.</li><li>Evidence: statements of fact, statistics, examples, and expert
  opinion or knowledge that support the writer’s points.</li><li>Facts: statements whose truth can be
  proven or verified. • Introduction: first part of a proposal, in which the writer introduces the problem
  to be addressed. Often, the thesis appears at the end of the introduction. • Objections: questions or
  opposition readers may have about a proposed solution. These also are known as counterclaims. • Objective
  stance: writing that is free from bias, personal feelings, and emotional language. An objective stance
  is especially important in a proposal. • Problem: central topic to be discussed in a proposal. • Purpose:
  reason for writing the proposal, usually to examine a problem and propose a solution. • Solution or
  solutions: proposed resolution or resolutions to the problem, the central topic of a proposal. • Statistics:
  factual statements that include numbers and often serve as evidence in a proposal. • Synthesis: making
  connections between ideas and combining them to arrive at an original conclusion.</li></ul>

  <p>Synthesizing draws from others’ opinions and ideas, facts, statistics, and the writer’s information
  based on research or original thought. • Thesis: the main idea you will convey in your proposal and
  to which all paragraphs in the paper should relate. • Topic sentence: a sentence that states the main
  idea of each paragraph.</p>

  <p>6.4 Annotated Student Sample: “Slowing Climate Change” by Shawn Krukowski</p>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Identify the features common to proposals. • Analyze the organizational structure of a proposal
  and how writers develop ideas. • Articulate how writers use and cite evidence to build credibility.
  • Identify sources of evidence within a text and in source citations.</li></ul>

  <h3>Introduction</h3>

  <p>2003” by Tulane Public Relations/Wikimedia Commons, CC BY 2.0) The proposal that follows was written
  by student Shawn Krukowski for a first-year composition course. Shawn’s assignment was to research a
  contemporary problem and propose one or more solutions. Deeply concerned about climate change, Shawn
  chose to research ways to slow the process. In his proposal, he recommends two solutions he thinks are
  most promising.</p>

  <h3>LIVING BY THEIR OWN WORDS A Call to Action</h3>

  <p>The earth’s climate is changing. Although the climate has been changing slowly for the past 22,000
  years, the rate of change has increased dramatically. Previously, natural climate changes occurred gradually,
  sometimes extending over thousands of years. Since the mid-20th century, however, climate change has
  accelerated exponentially, a result primarily of human activities, and is reaching a crisis level. Critical
  as it is, however, climate change can be controlled. Thanks to current knowledge of science and existing
  technologies, it is possible to respond effectively. Although many concerned citizens, companies, and
  organizations in the private sector are taking action in their own spheres, other individuals, corporations,
  and organizations are ignoring, or even denying, the problem. What is needed to slow climate change
  is unified action in two key areas—mitigation and adaptation—spurred by government leadership in the
  United States and a global commitment to addressing the problem immediately. Introduction. The proposal
  opens with an overview of the problem and pivots to the solution in the second paragraph. Thesis Statement.
  The thesis statement in last sentence of the introduction previews the organization of the proposal
  and the recommended solutions.</p>

  <h3>Problem: Negative Effects of Climate Change</h3>

  <p>Heading. Centered, boldface headings mark major sections of the proposal. Body. The three paragraphs
  under this heading discuss the problem.</p>

  <p>Topic Sentence. The paragraph opens with a sentence stating the topics developed in the following
  paragraphs. For the 4,000 years leading up to the Industrial Revolution, global temperatures remained
  relatively constant, with a few dips of less than 1°C. Previous climate change occurred so gradually
  that life forms were able to adapt to it. Some species became extinct, but others survived and thrived.
  In just the past 100 years, however, temperatures have risen by approximately the same amount that they
  rose over the previous 4,000 years.</p>

  <p>Audience. Without knowing for sure the extent of readers’ knowledge of climate change, the writer
  provides background for them to understand the problem.</p>

  <p>The rapid increase in temperature has a negative global impact. First, as temperatures rise, glaciers
  and polar ice are melting at a faster rate; in fact, by the middle of this century, the Arctic Ocean
  is projected to be ice-free in summer. As a result, global sea levels are projected to rise from two
  to four feet by 2100 (U.S. Global Change Research Program [USGCRP], 2014a). If this rise actually does
  happen, many coastal ecosystems and human communities will disappear. Discussion of the Problem. The
  first main point of the problem is discussed in this paragraph. Statistics as Evidence. The writer provides
  specific numbers and cites the source in APA style. Transitions. The writer uses transitions here (first,
  as a result, and second in the next paragraph) and elsewhere to make connections between ideas and to
  enable readers to follow them more easily. At the same time, the transitions give the proposal coherence.
  Second, weather of all types is becoming more extreme: heat waves are hotter, cold snaps are colder,
  and precipitation patterns are changing, causing longer droughts and increased flooding. Oceans are
  becoming more acidic as they increase their absorption of carbon dioxide. This change affects coral
  reefs and other marine life. Since the 1980s, hurricanes have increased in frequency, intensity, and
  duration. As shown in Figure 6.5, the 2020 hurricane season was the most active on record, with 30 named
  storms, a recordingbreaking 11 storms hitting the U.S. coastline (compared to 9 in 1916), and 10 named
  storms in September—the highest monthly number on record. Together, these storms caused more than $40
  billion in damage. Not only was this the fifth consecutive above-normal hurricane season, it was preceded
  by four consecutive abovenormal years in 1998 to 2001 (National Oceanic and Atmospheric Administration,
  2020). Discussion of the Problem. The second main point of the problem is discussed in this paragraph.
  Visual as Evidence. The writer refers to “Figure 6.4” in the text and places the figure below the paragraph.</p>

  <h3>Solutions: Mitigation and Adaptation</h3>

  <p>Heading. The centered, boldface heading marks the start of the solutions section of the proposal.
  Body. The eight paragraphs under this heading discuss the solutions given in the thesis statement. Topic
  Sentence. The paragraph opens with a sentence stating the topics developed in the following paragraphs.</p>

  <p>To control the effects of climate change, immediate action in two key ways is needed: mitigation
  and adaptation. Mitigating climate change by reducing and stabilizing the carbon emissions that produce
  greenhouse gases is the only long-term way to avoid a disastrous future. In addition, adaptation is
  imperative to allow ecosystems, food systems, and development to become more sustainable. Mitigation
  and adaptation will not happen on their own; action on such a vast scale will require governments around
  the globe to take initiatives. The United States needs to cooperate with other nations and assume a
  leadership role in fighting climate change. Objective Stance. The writer presents evidence (facts, statistics,
  and examples) in neutral, unemotional language, which builds credibility, or ethos, with readers. Mitigation
  Heading. The flush-left, boldface heading marks the first subsection of the solutions. Topic Sentence.
  The paragraph opens with a sentence stating the solution developed in the following paragraphs.</p>

  <p>The first challenge is to reduce the flow of greenhouse gases into the atmosphere. The Union of Concerned
  Scientists (2020) warns that “net zero” carbon emissions—meaning that no more carbon enters the atmosphere
  than is removed—needs to be reached by 2050 or sooner. As shown in Figure 6.6, reducing carbon emissions
  will require a massive effort, given the skyrocketing rate of increase of greenhouse gases since 1900
  (USGCRP, 2014b). Synthesis. In this paragraph, the writer synthesizes factual evidence from two sources
  and cites them in APA style. Visual as Evidence. The writer refers to “Figure 6.5” in the text and places
  the figure below the paragraph.</p>

  <p>Significant national policy changes must be made and must include multiple approaches; here are two
  areas of concern: Presentation of Solutions. For clarity, the writer numbers the two items to be discussed.
  1. Transportation systems. In the United States in 2018, more than one-quarter—28.2 percent—of emissions
  resulted from the consumption of fossil fuels for transportation. More than half of these emissions
  came from passenger cars, light-duty trucks, sport utility vehicles, and minivans (U.S. Environmental
  Protection Agency [EPA], 2020). Priorities for mitigation should include using fuels that emit less
  carbon; improving fuel efficiency; and reducing the need for travel through urban planning, telecommuting
  and videoconferencing, and biking and pedestrian initiatives. Statistics as Evidence. The writer provides
  specific numbers and cites the source in APA style. Source Citation in APA Style: Group Author. The
  parenthetical citation gives the group’s name, an abbreviation to be used in subsequent citations, and
  the year of publication.</p>

  <p>Curtailing travel has a demonstrable effect. Scientists have recorded a dramatic drop in emissions
  during government-imposed travel and business restrictions in 2020. Intended to slow the spread of COVID-19,
  these restrictions also decreased air pollution significantly. For example, during the first six weeks
  of restrictions in the San Francisco Bay area, traffic was reduced by about 45 percent, and emissions
  were roughly a quarter lower than the previous six weeks. Similar findings were observed around the
  globe, with reductions of up to 80 percent (Bourzac, 2020).</p>

  <p>Statistics as Evidence. The writer provides specific numbers and cites the source in APA style.</p>

  <p>Source Citation in APA Style: One Author. The parenthetical citation gives the author’s name and
  the year of publication.</p>

  <p>2. Energy production. The second-largest source of emissions is the use of fossil fuels to produce
  energy, primarily electricity, which accounted for 26.9 percent of U.S. emissions (EPA, 2020). Fossil
  fuels can be replaced by solar, wind, hydro, and geothermal sources. Solar voltaic systems have the
  potential to become the least expensive energy in the world (Green America, 2020). Solar sources should
  be complemented by wind power, which tends to increase at night when the sun is absent. According to
  the Copenhagen Consensus, the most effective way to combat climate change is to increase investment
  in green research and development (Lomborg, 2020). Notable are successes in the countries of Morocco
  and The Gambia, both of which have committed to investing in national programs to limit emissions primarily
  by generating electricity from renewable sources (Mulvaney, 2019).</p>

  <p>Synthesis. The writer develops the paragraph by synthesizing evidence from four sources and cites
  them in APA style.</p>

  <p>A second way to move toward net zero is to actively remove carbon dioxide from the atmosphere. Forests
  and oceans are so-called “sinks” that collect and store carbon (EPA, 2020). Tropical forests that once
  made up 12 percent of global land masses now cover only 5 percent, and the loss of these tropical forest
  sinks has caused 16 to 19 percent of greenhouse gas emissions (Green America, 2020). Worldwide reforestation
  is vital and demands both commitment and funding on a global scale. New technologies also allow “direct
  air capture,” which filers carbon from the air, and “carbon capture,” which prevents it from leaving
  smokestacks.</p>

  <p>All of these technologies should be governmentally supported and even mandated, where appropriate.</p>

  <p>Synthesis. The writer develops the paragraph by synthesizing evidence from two sources and cites
  them in APA style.</p>

  <h3>Adaptation</h3>

  <p>Heading. The flush-left, boldface heading marks the second subsection of the solutions.</p>

  <p>Topic Sentence. The paragraph opens with a sentence stating the solution developed in the following
  paragraphs.</p>

  <p>Historically, civilizations have adapted to climate changes, sometimes successfully, sometimes not.
  Our modern civilization is largely the result of climate stability over the past 12,000 years. However,
  as the climate changes, humans must learn to adapt on a national, community, and individual level in
  many areas. While each country sets its own laws and regulations, certain principles apply worldwide.</p>

  <p>1. Infrastructure. Buildings—residential, commercial, and industrial—produce about 33 percent of
  greenhouse gas emissions worldwide (Biello, 2007). Stricter standards for new construction, plus incentives
  for investing in insulation and other improvements to existing structures, are needed. Development in
  high-risk areas needs to be discouraged. Improved roads and transportation systems would help reduce
  fuel use. Incentives for decreasing energy consumption are needed to reduce rising demands for power.</p>

  <p>Statistics as Evidence. The writer provides specific numbers and cites the source in APA style.</p>

  <p>Source Citation in APA Style: One Author. The parenthetical citation gives the author’s name and
  the year of publication.</p>

  <p>2. Food waste. More than 30 percent of the food produced in the United States is never consumed,
  and food waste causes 44 gigatons of carbon emissions a year (Green America, 2020). In a landfill, the
  nutrients in wasted food never return to the soil; instead, methane, a greenhouse gas, is produced.
  High-income countries such as the United States need to address wasteful processing and distribution
  systems. Low-income countries, on the other hand, need an infrastructure that supports proper food storage
  and handling. Educating consumers also must be a priority.</p>

  <p>Statistics as Evidence. The writer provides specific numbers and cites the source in APA style.</p>

  <p>Source Citation in APA Style: Group Author. The parenthetical citation gives the group’s name and
  the year of publication.</p>

  <p>3. Consumerism. People living in consumer nations have become accustomed to abundance. Many purchases
  are nonessential yet consume fossil fuels to manufacture, package, market, and ship products. During
  World War II, the U.S. government promoted the slogan “Use It Up, Wear It Out, Make It Do, or Do Without.”
  This attitude was widely accepted because people recognized a common purpose in the war effort. A similar
  shift in mindset is needed today.</p>

  <p>Adaptation is not only possible but also economically advantageous. One case study is Walmart, which
  is the world’s largest company by revenue. According to Dearn (2020), the company announced a plan to
  reduce its global emissions to zero by 2040. Among the goals is powering its facilities with 100 percent
  renewable energy and using electric vehicles with zero emissions. As of 2020, about 29 percent of its
  energy is from renewable sources. Although the 2040 goal applies to Walmart facilities only, plans are
  underway to reduce indirect emissions, such as those from its supply chain. According to CEO Doug McMillon,
  the company’s commitment is to “becoming a regenerative company—one that works to restore, renew and
  replenish in addition to preserving our planet, and encourages others to do the same” (Dearn, 2020).
  In addition to encouraging other corporations, these goals present a challenge to the government to
  take action on climate change.</p>

  <p>Extended Example as Evidence. The writer indicates where borrowed information from the source begins
  and ends, and cites the source in APA style.</p>

  <p>Source Citation in APA Style: One Author. The parenthetical citation gives only the year of publication
  because the author’s name is cited in the sentence.</p>

  <h3>Objections to Taking Action</h3>

  <p>Heading. The centered, boldface heading marks the start of the writer’s discussion of potential objections
  to the proposed solutions.</p>

  <p>Body. The writer devotes two paragraphs to objections.</p>

  <p>Topic Sentence. The paragraph opens with a sentence stating the topics developed in the following
  paragraphs.</p>

  <p>Despite scientific evidence, some people and groups deny that climate change is real or, if they
  admit it exists, insist it is not a valid concern. Those who think climate change is not a problem point
  to Earth’s millennia-long history of changing climate as evidence that life has always persisted. However,
  their claims do not consider the difference between “then” and “now.” Most of the change predates human
  civilization, which has benefited from thousands of years of stable climate. The rapid change since
  the Industrial Revolution is unprecedented in human history.</p>

  <p>Those who deny climate change or its dangers seek primarily to relax or remove pollution standards
  and regulations in order to protect, or maximize profit from, their industries. To date, their lobbying
  has been successful. For example, the world’s fossil-fuel industry received $5.3 trillion in 2015 alone,
  while the U.S. wind-energy industry received $12.3 billion in subsidies between 2000 and 2020 (Green
  America, 2020).</p>

  <p>Statistics as Evidence. The writer provides specific numbers and cites the source in APA style.</p>

  <p>Source Citation in APA Style: Group Author. The parenthetical citation gives the group’s name and
  the year of publication.</p>

  <h3>Conclusion and Recommendation</h3>

  <p>Heading. The centered, boldface heading marks the start of the conclusion and recommendation.</p>

  <p>Conclusion and Recommendation. The proposal concludes with a restatement of the proposed solutions
  and a call to action.</p>

  <p>Greenhouse gases can be reduced to acceptable levels; the technology already exists. But that technology
  cannot function without strong governmental policies prioritizing the environment, coupled with serious
  investment in research and development of climate-friendly technologies.</p>

  <p>The United States government must place its full support behind efforts to reduce greenhouse gasses
  and mitigate climate change. Rejoining the Paris Agreement is a good first step, but it is not enough.
  Citizens must demand that their elected officials at the local, state, and national levels accept responsibility
  to take action on both mitigation and adaptation. Without full governmental support, good intentions
  fall short of reaching netzero emissions and cannot achieve the adaptation in attitude and lifestyle
  necessary for public compliance. There is no alternative to accepting this reality. Addressing climate
  change is too important to remain optional.</p>

