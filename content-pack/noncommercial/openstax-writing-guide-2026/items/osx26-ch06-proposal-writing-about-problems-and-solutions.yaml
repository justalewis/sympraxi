  <p>6.5 Writing Process: Creating a Proposal</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Describe the elements of the rhetorical situation
  for your proposal. • Apply prewriting strategies to discover a problem to write about. • Gather and
  synthesize information from appropriate sources. • Draft a thesis statement and create an organizational
  plan. • Compose a proposal that develops your ideas and integrates evidence from sources. • Implement
  strategies for drafting, peer reviewing, and revising.</p>

  <p>Sometimes writing a paper comes easily, but more often writers work hard to generate ideas and evidence,
  organize their thoughts, draft, and revise. Experienced writers do their work in multiple steps, and
  most engage in a recursive process that involves thinking and rethinking, writing and rewriting, and
  repeating steps multiple times as their ideas develop and sharpen. In broad strokes, most writers go
  through the following steps to achieve a polished piece of writing:</p>

  <ul><li>Planning and Organization. Your proposal will come together more easily if you spend time at
  the start considering the rhetorical situation, understanding your assignment, gathering ideas and evidence,
  drafting a thesis statement, and creating an organizational plan.</li><li>Drafting. When you have a
  good grasp of the problem and solution you are going to write about and how you will organize your proposal,
  you are ready to draft.</li><li>Review. With a first draft in hand, make time to get feedback from others.
  Depending on the structure of your class, you may receive feedback from your instructor or your classmates.
  You can also work with a tutor in the writing center on your campus, or you can ask someone else you
  trust, such as a friend, roommate, or family member, to read your writing critically and give honest
  feedback.</li><li>Revising. After reviewing feedback from your readers, plan to revise. Focus on their
  comments: Is your thesis clear? Do you need to make organizational changes to the proposal? Do you need
  to explain or connect your ideas more clearly?</li></ul>

  <h3>Considering the Rhetorical Situation</h3>

  <p>Like other kinds of writing projects, a proposal starts with assessing the rhetorical situation—the
  circumstance in which a writer communicates with an audience of readers about a subject. As a proposal
  writer, you make choices based on the purpose for your writing, the audience who will read it, the genre,
  and the expectations of the community and culture in which you are working. The brainstorming questions
  in Table 6.1 can help you begin:</p>

  <p>Rhetorical Situation Element</p>

  <p>Brainstorming Questions</p>

  <p>Your Responses</p>

  <h3>Topic</h3>

  <p>Are you free to choose your own problem and solution to write about, or is your topic specified?</p>

  <p>What do you want to know more about? What requirements do you have? Do you need to do research?</p>

  <p>Purpose</p>

  <p>What is the purpose of the proposal?</p>

  <p>Is the purpose to examine a problem and explain possible solutions? Or is it to recommend a specific
  solution?</p>

  <p>Audience</p>

  <p>Who will read your writing?</p>

  <p>Who is your primary audience—your instructor? Your classmates? Other students or administrators on
  your campus? People in your community? How will you shape your writing to connect most effectively with
  this audience? Do you need to consider secondary audiences, such as people outside of class? If so,
  who are those readers?</p>

  <p>Presentation</p>

  <p>In what format should you prepare your proposal?</p>

  <p>Should you prepare a written proposal or use another medium? Should you include visuals and other
  media along with text, such as figures, charts, graphs, photographs, audio, or video? What other presentation
  requirements do you need to be aware of?</p>

  <p>Rhetorical Situation Element</p>

  <p>Brainstorming Questions</p>

  <h3>Context</h3>

  <p>How do the time period and location affect decisions you make about your proposal?</p>

  <p>What problems in your city, county, state, area, nation, or the world need a solution? What current
  events or new information might relate to the problem? Is your college or university relevant to the
  problem?</p>

  <p>Your Responses</p>

  <h3>Culture and Community</h3>

  <p>What social or cultural assumptions do you or your audience have?</p>

  <p>How will you show awareness of your community’s social and cultural expectations in your writing?</p>

  <h3>Summary of Assignment</h3>

  <p>Write a proposal that discusses a problem you want to learn more about and that recommends a solution.
  The problem you choose must be a current problem, even though it may have been a problem for many years.
  The problem must also affect many people, and it must have an actual solution or solutions that you
  can learn about through research. In other words, the problem cannot be unique to you, and the solution
  you recommend cannot be one you only imagine; both the problem and the solution must be grounded in
  reality.</p>

  <p>One way to get ideas about a problem to write about is to read a high-quality newspaper, website,
  or social media account for a week. Read widely on whatever platform you choose so that you learn what
  people are saying, what a newspaper’s editorial board is taking a stand on, what opinion writers are
  making cases for in op-eds, and what community members are commenting on. You’ll begin to get a handle
  on problems in your community or state that people care about. If you read a paper or website with a
  national or international audience, you’ll learn about problems that affect people in other places.</p>

  <p>You will need to consult and cite at least five reliable sources. They can be scholarly, but they
  do not have to be. They must be credible, trustworthy, and unbiased. Possible sources include articles
  from reputable newspapers, magazines, and academic and professional journals; reputable websites; government
  sources; and visual sources. Depending on your topic, you may want to conduct a survey, an interview,
  or an experiment. See Research Process: Accessing and Recording Information and Annotated Bibliography:
  Gathering, Evaluating, and Documenting Sources for information about creating and finding sources. Your
  proposal can include a visual or media source if it provides appropriate, relevant evidence.</p>

  <p>Another Lens. Another way to approach a proposal assignment is to consider problems that affect you
  directly and affect others. Perhaps you are concerned about running up student loan debt. Or perhaps
  you worry about how to pay your rent while earning minimum wage. These concerns are valid and affect
  many college students around the United States. Another way is to think about problems that affect others.
  Perhaps students in your class or on your campus have backgrounds and experiences that differ from yours—what
  problems or challenges might they have encountered during their time in college that you don’t know
  about?</p>

  <p>As you think about the purpose and audience for your proposal, think again about the rhetorical situation,
  specifically about the audience you want to reach and the mode of presentation best suited to them and
  your purpose. For example, say you’re dissatisfied with the process for electing student leaders on
  your campus. If your purpose is to identify the problems in the process and propose a change, then your
  audience would include other students, the group or committee that oversees student elections, and perhaps
  others. To reach other students who might also be dissatisfied, you might write an article, editorial,
  or letter for the campus newspaper, social media page, or website, depending on how students on your
  campus get news. In addition, you might organize a meeting of other students to get their input on the
  problem. To reach the decision makers, which may include elected students, faculty, and administrators,
  you might need to prepare an oral presentation and a slide deck. Below in Figure 6.7 are three slides
  from Shawn Krukowski’s proposal that he adapted for a presentation: the title slide, a slide on one
  aspect of the problem, and a slide introducing one of the proposed solutions.</p>

  <h3>Quick Launch: Finding a Problem to Write About</h3>

  <p>A proposal must address a real-life problem and present one or more workable solutions. Usually,
  problems worth writing about are not easily solved; if they were, they would no longer be considered
  problems. Indeed, problems in proposals are often complex, and solutions are often complicated and involve
  trade-offs.</p>

  <p>Sometimes people disagree about whether the problem is a problem at all and whether any proposed
  solutions are viable solutions.</p>

  <h3>Exploring a Problem</h3>

  <p>One way to generate ideas about a problem is to brainstorm. To explore a topic for your proposal,
  use a graphic organizer like Table 6.2 to write responses to the following statements and questions:</p>

  <p>Exploring Questions</p>

  <p>Your Responses</p>

  <p>What problem am I interested in learning about?</p>

  <p>How do I know this is a problem?</p>

  <p>What are a few examples of the problem?</p>

  <p>What causes the problem?</p>

  <p>Who is affected by the problem?</p>

  <p>What are some negative effects of the problem?</p>

  <p>Why should the problem be solved?</p>

  <p>What are the potential consequences of the problem if nothing is done?</p>

  <p>What are some realistic solutions to the problem?</p>

  <p>For example, perhaps you’re considering a career in information technology, and you’re taking an
  IT class. You might be interested in exploring the problem of data breaches. A data breach is a real-world
  problem with possible solutions, so it passes the first test of being an actual problem with possible
  solutions. Your responses to the questions above might look something like those in Table 6.3:</p>

  <p>Exploring Questions</p>

  <p>A problem I’m interested in learning more about is…</p>

  <p>How I know data breaches are a problem…</p>

  <p>What are a few examples of data breaches?</p>

  <p>Sample Responses</p>

  <h3>Data breaches</h3>

  <p>In my class, we’re spending a lot of time on data security and breaches. Also, data breaches are
  in the news almost constantly, and a Google search turns up many that don’t make the news. I’ve heard
  about people getting their information stolen. I’ve heard about foreign governments, like Russia, stealing
  national security information and trying to interfere in recent elections. In my class, I’m learning
  about businesses that have customer and employee information stolen.</p>

  <p>Exploring Questions</p>

  <p>Sample Responses</p>

  <p>What causes data breaches?</p>

  <p>Hackers have a variety of methods to break into websites, to get people to click on links, and to
  lure people to give out information.</p>

  <p>Who is affected by Individual people, businesses, utility companies, schools and universities, governments
  data breaches?</p>

  <p>(local, state, and national)—pretty much anyone can be affected.</p>

  <p>What are some negative effects of data breaches?</p>

  <p>Identity theft, financial theft, national security, power shutdowns, and election interference. Data
  breaches cause chaos and cost a lot of money.</p>

  <p>Why should the problem of data breaches be solved?</p>

  <p>People need the personal, financial, and medical information they share with businesses and other
  organizations to remain private. Businesses and organizations need to keep their operations secure.
  Governments need to keep national security secrets from getting into the hands of people who want to
  harm them.</p>

  <p>What are the potential consequences of data breaches if nothing is done?</p>

  <p>People will continue to be victims of identity theft and all that goes with it, including losing
  money, and they will lose trust in institutions they used to trust, like banks, hospitals, and the government.</p>

  <p>What are some realistic solutions to data breaches?</p>

  <p>Increased security for individuals, like two-factor authentication, stronger passwords, and education
  to avoid getting scammed. For companies and governments, stronger protections on websites. I need to
  learn more.</p>

  <h3>Narrowing and Focusing</h3>

  <p>Many problems for a proposal can be too broad to tackle in a single paper. For example, the sample
  above reveals that data breaches are indeed a problem but that several aspects can be explored. If you
  tried to cover all the aspects, you would be left writing general paragraphs with little specific information.
  The topic needs to be narrowed and focused.</p>

  <p>The data breaches example above could be narrowed to the following problems—and possibly even more.
  Note that the questions start to zero in on possible solutions, too. In your own writing, as you brainstorm,
  try placing subtopics you discover into their own categories and asking more questions, as shown in
  Table 6.4.</p>

  <p>Narrowing a Problem</p>

  <h3>Focusing Questions</h3>

  <p>Problem: Hackers get into computer systems and steal information.</p>

  <p>What tactics do hackers use? What do they steal? What do they do with what they steal? How successful
  are they? How can hacking be stopped or reduced?</p>

  <p>Problem: Data breaches harm individuals.</p>

  <p>What happens to people when their information is stolen? In what ways is their information used?
  What should people do when they discover their information has been stolen? Are there steps they can
  take to protect their information?</p>

  <p>Problem: Data breaches harm businesses, organizations, and medical systems.</p>

  <p>What happens to businesses, organizations, and medical systems when hackers break in? What kind of
  information is stolen? How is the information used? What do businesses, organizations, and medical systems
  do, or what should they do, when they know about a breach? How can data breaches be prevented?</p>

  <p>Problem: Data breaches harm governments.</p>

  <p>What happens to governments when hackers break into their systems? What kind of information is stolen?
  How is the information used? What should governments do when they know about a breach? How can data
  breaches be prevented?</p>

  <h3>Sample Proposal Topics</h3>

  <p>The following broad topics are potentially suitable as a start for a proposal. Choose one of these
  or one of your own, and ask the exploring questions. Then look at your responses, and ask focusing questions.
  Continue to focus until you have a specific problem that you can discuss in sufficient depth and offer
  a concrete solution or solutions.</p>

  <ul><li>Health fields: cost of medical and dental care for uninsured people, management of chronic conditions
  and diseases, infection control, vaccinations, access to mental health care, drug use and addiction,
  sports injuries, workplace safety</li><li>Education: gaps in academic achievement, curriculum, recruitment
  and retention of staff and/or students, buildings and grounds, graduation rates, cocurricular activities</li><li>Environment:
  forest management and fires, hurricanes and other extreme storms, water and air pollution, sustainable
  development, invasive species, waste management, recycling and composting, community gardening</li><li>Engineering
  and computer science: robotics, vehicles and transportation, digital divide, online privacy, misinformation
  and misbehavior on social media, video games</li><li>Business and manufacturing: quality improvement,
  process improvement, cost control, communication, social media, pay equity, fundraising, sourcing of
  materials, net-zero energy processes, workplace safety</li><li>Policy and politics: public institutions,
  such as public schools, libraries, transportation systems, and parks; taxes, fees, and services; donations
  to political campaigns; healthcare, such as Medicare and Medicaid; social security; unemployment insurance;
  services for active military and veterans; immigration policy</li><li>Society and culture: social media
  and free speech; inequality in housing, employment, education, and more; cancel culture; bullying; wealth
  and poverty; support for the arts; athletes and sports; disparities related to race, sex, gender identity
  and expression, age, and/or ability</li></ul>

  <p>Gathering Information</p>

  <p>Proposals are rooted in information and evidence; therefore, most proposal assignments require you
  to conduct research. Depending on your assignment, you may need to do formal research, an activity that
  involves finding sources and evaluating them for reliability, reading them carefully and taking notes,
  and citing all words you quote and ideas you borrow. See Research Process: Accessing and Recording Information
  and Annotated Bibliography: Gathering, Evaluating, and Documenting Sources for detailed instruction
  on conducting research. If you are proposing a solution to a problem in your local community or on your
  campus, you may need to conduct primary research as well, such as a survey or interviews with people
  who live or work there.</p>

  <p>Whether you conduct in-depth research or do background reading, keep track of the ideas that come
  to you and the information you learn. You can write or dictate notes using an app on your phone or computer,
  or you can jot notes in a journal if you prefer pen and paper. Then, when you are ready to begin to
  organize what you have learned, you will have a record of your thoughts and information. Always track
  the source of the information you gather, whether from your reading or a person you interviewed, so
  that you can return to that source if you need more information and can credit the source in your paper.</p>

  <h3>Kinds of Evidence</h3>

  <p>You will use evidence to demonstrate that the problem is real and worthy of being solved and that
  your recommended solution is workable. Choose evidence for your proposal that is rooted in facts. In
  addition, choose evidence that best supports the angle you take on your topic and meets your instructor’s
  requirements. Cite all evidence you use from a source. Consider the following kinds of evidence and
  examples of each:</p>

  <ul><li>Definition: an explanation of a key word, idea, or concept.</li></ul>

  <p>The Personal Data Notification &amp; Protection Act of 2017 defines a security breach as “a compromise
  of the security, confidentiality, or integrity of, or the loss of, computerized data that results in…
  (i) the unauthorized acquisition of sensitive personally identifiable information; or (ii) access to
  sensitive personally identifiable information that is for an unauthorized purpose, or in excess of authorization.”</p>

  <ul><li>Example: an illustration of an idea or concept.</li></ul>

  <p>Every month, university staff members receive a fake phishing email from the IT department. The goal
  is to train employees of the university to be critical readers of every email they receive.</p>

  <ul><li>Expert opinion: a statement by a professional whose opinion is respected in the field.</li></ul>

  <p>In The Sixth Extinction, science writer Elizabeth Kolbert observes that humans are making the choice
  about “which evolutionary pathways will remain and open and which will be forever closed” (268).</p>

  <ul><li>Fact: information that is true and can be proven correct or accurate. Statements of fact are
  built on evidence and data.</li></ul>

  <p>In March and April of 2020, 43 states in the United States issued orders directing residents to stay
  home except for essential activities.</p>

  <ul><li>Interview: a person-to-person, phone, or remote conversation that involves an interviewer posing
  questions to another person or group of people.</li></ul>

  <p>During an interview, I asked about parents’ decisions to vaccinate their children. One pediatrician
  said, “The majority of parents see the benefits of immunizations for their children and for public health.
  For those who don’t, I talk to them and try to understand why they feel the way they do.”</p>

  <ul><li>Quotation: the exact words of an author or speaker.</li></ul>

  <p>According to the Federal Aviation Administration, SpaceX was required to conduct a “comprehensive
  review of the company’s safety culture, operational decision-making, and process discipline,” in addition
  to investigating the crash of its prototype spacecraft (Chang). • Statistics: numerical fact or item
  of data. According to the Environmental Protection Agency, more than 40 million tons of food waste were
  generated in 2017, comprising 15.2% of all trash sent to landfills (DeSilver). • Survey: a structured
  interview in which respondents are all asked the same questions and their answers are tabulated and
  interpreted. Surveys reveal attitudes, beliefs, or habits of the general public or segments of the population.
  In a survey of adults conducted in July 2020, 64 percent of respondents said that social media have
  a mostly negative effect on American society (Auxier). • Visuals and other media: graphs, figures, tables,
  photographs, diagrams, charts, maps, videos, audio recordings, etc.</p>

  <h3>Thesis and Organization</h3>

  <p>Drafting a Thesis When you have a solid grasp of the problem and solution, try drafting a thesis.
  A thesis is the main idea that you will convey in your proposal and to which all the paragraphs in the
  paper should relate. In a proposal, you will likely express this main idea in a thesis statement of
  one or two sentences toward the end of the introduction. For example, in the thesis statement Shawn
  Krukowski wrote for his proposal on climate change, he identifies the problem and previews the solutions
  he presents:</p>

  <p>What is needed to slow climate change is unified action in two key areas—mitigation and adaptation—spurred
  by government leadership in the United States and a global commitment to addressing the problem immediately.
  Here is another example that identifies a problem and multiple solutions: The number of women employed
  in the IT field is decreasing every year, a trend that can be changed with a multifaceted approach that
  includes initiatives in middle schools, high schools, and colleges; active recruitment; mentoring programs;
  and flexible work arrangements. After you draft a thesis statement, ask these questions and revise it
  as needed: • Is it engaging? A thesis for a proposal should pique readers’ interest in the problem and
  possible solutions. • Is it precise and specific? If you are interested in curbing the spread of invasive
  plant species, for example, your thesis should indicate which environment the plant or plants are invading
  and that you are proposing ways to stop the spread. Organizing Your Ideas A proposal has a recognizable
  shape, starting with an introduction, followed by discussions of the problem, possible solutions, potential
  objections to the solutions, and a conclusion with a recommendation. A graphic organizer like Table
  6.5 can help you organize your ideas and evidence.</p>

  <p>Proposal Section</p>

  <p>Introduction (usually one paragraph, but can be two)</p>

  <p>Content</p>

  <h3>Your Notes</h3>

  <p>Draw readers in with an overview. Provide necessary background here or in the description of the
  problem, defining terms as needed.</p>

