  in Model 47), give only the title of the website. • Publication date. Give the day, month, and year
  the work was posted, if available. Use the following abbreviations for months: Jan., Feb., Mar., Apr.,
  Aug., Sept., Oct., Nov., and Dec. Do not abbreviate May, June, and July. • URL. Give the URL, without
  “http://.”</p>

