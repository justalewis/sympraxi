  <p>2.7 Spotlight on … Variations of English</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Identify situations and contexts calling for purposeful
  shifts in voice, diction, tone, level of formality, and structure. • Identify linguistic structures,
  including American English dialects. • Write a description in an authentic voice.</p>

  <h3>English and Its Dialects</h3>

  <p>Although English is the primary language of the United States, distinctive dialects, or forms of
  language specific to a particular region or social group, vary according to location, culture, ethnicity,
  socioeconomic status, and other factors. American dialects may have their own grammar, vocabulary, syntax,
  pronunciation, and common expressions. Many, mainly regional, differences in pronunciation are often
  marked by rhotic and non-rhotic accents. Speakers with rhotic accents pronounce the /r/ before consonants
  and at the end of a word. Those with non-rhotic accents do not pronounce the /r/; for example, think
  of the Boston accent pronunciation of park as pahk or the Coastal Southern (areas along the Gulf of
  Mexico) pronunciation of better as bettuh.</p>

  <p>While the American Midwest has what might be considered the closest variation to General American
  English, the language spoken by most Americans, it has its own regional and cultural dialect variations.
  In characteristic Midwest American English words such as cot and caught are pronounced as homophones.
  As in rhotic dialects, /r/ sounds are pronounced, even in words that don’t contain the letter r: wash,
  for example, becomes warsh. And /s/ may be added to words as a grammatical construction: Alls we need
  is more ice cream.</p>

  <p>Variations in pronunciation and dialect result from a host of factors. Dialects are formed when people
  are divided socially, geographically, or both. Despite the difficulties in categorizing such complex
  variations in language, most scholars agree that dialects can be classified on the basis of location
  and social groupings, despite the overlap between them. A regional dialect is a variation in language
  that occurs within a geographical region. A social dialect includes differences in speech associated
  with a social group or socioeconomic level.</p>

  <p>Among the most common—and most debated—language variations is African American Vernacular English
  (AAVE). AAVE, also referred to as Black English Vernacular or Ebonics, is a generalized term for a variety
  of dialects spoken by Black Americans. These dialects are influenced by American Southern dialects.
  With roots in the language patterns of people descended from enslaved Africans in the United States,
  AAVE has its own syntax, grammar, and tense system. Some common features include the absence of third-person
  singular and possessive pronouns and the use of double negatives.</p>

  <p>AAVE has distinct grammar conventions. The speaker or writer will often omit forms of the verb to
  be from a sentence, as in these examples:</p>

  <p>“What [omitted is] he talking about?”</p>

  <p>“She [omitted was] the one who took it.”</p>

  <p>While General American English requires verb and tense agreement, AAVE features more variations.
  For example, in AAVE, the word been is often placed before a verb in order to convey a past event: for
  example, “He been married” rather than the General American English “He was married.” This change in
  grammar can actually convey different meanings. In General American English, the sentence implies that
  the man is no longer married, whereas the sentence in AAVE indicates that the man is still married.</p>

  <p>This is by no means an inclusive list of AAVE conventions, as languages are constantly evolving.
  Understanding that language differences result from culture, identity, and geography and that you, as
  a writer, have the opportunity to express yourself using your social norms is an important first step
  in recognizing the role of culture in language.</p>

  <p>Although differences in pronunciation abound, English dialects are widely classified as “standard”
  or “nonstandard.” Standard dialect follows specific rules for syntax, vocabulary, and grammar. This
  dialect is often perceived as more academic than nonstandard dialects and is used in formal situations.
  Other dialects, usually lacking such standardization and generally perceived as having less stature,
  are considered nonstandard dialects. For years, academic scholars and teachers have subscribed to the
  idea that so-called standard English should be the default dialect used in schools and academic writing.
  This dialect is spoken by newscasters, television news anchors, and a large percentage of middle-class
  Americans, especially those with formal educations.</p>

  <p>And yet you, like others, have your own patterns of speech based largely on your culture, family,
  and region. Code-switching, or alternating between two or more languages or language forms, was taught
  explicitly in schools with the intent that students learn to speak and write standard English for certain
  academic and professional situations. However, newer research in best practices is revealing that allowing
  students to learn in and use their authentic voices, including nonstandard dialects, is a more equitable
  practice that is both culturally responsible and beneficial to learning.</p>

  <p>“Students’ Right to Their Own Language”</p>

  <p>The Conference on College Composition and Communication (CCCC) is the world’s largest professional
  organization committed to writing research, theory, and teaching. It publishes the quarterly journal
  College Composition and Communication and holds an annual convention. The CCCC also publishes position
  statements on writing and the teaching of writing based on research, best practices of writing pedagogy,
  and language practices. Recent research completed by the CCCC addresses the use of a wide variety of
  linguistic expressions and choices, including various regional and cultural dialects.</p>

  <p>In 1974, the Conference on College Composition and Communication adopted “Students’ Right to Their
  Own Language,” a statement that affirmed students’ rights to use “their own patterns and varieties of
  language—the dialects of their nurture” or those that help them create their own identity. The statement
  recognizes that socalled General American English is aligned with a dominant White majority and includes
  implicit bias against students from other backgrounds. Finally, the statement reinforces the idea that
  a nation that praises and encourages diversity, particularly in academic circles, should not only accept
  diversity in language and dialect but also celebrate it. Doing so allows students to use the totality
  of their lived experiences, cultural language, and ideas to create fuller meaning in their writing.
  Over the years, the statement has undergone revisions and has been expanded to address students learning
  and writing in a second language.</p>

  <p>This statement takes a step toward confronting the assumptions and hidden bias present in the educational
  system and works toward creating more equitable, anti-racist teaching for students, particularly from
  Black and other BIPOC (Black, Indigenous, and people of color) backgrounds. The most recent updated
  and reaffirmed statement (https://openstax.org/r/statementnewsrtol) stems from 2014.</p>

  <h3>Demand for Linguistic Justice</h3>

  <p>One position statement released by the CCCC in July 2020 was “This Ain’t Another Statement! This
  Is a DEMAND for Black Linguistic Justice!” Responding to the historical and sociopolitical context of
  today’s world, this statement coincided with #BlackLivesMatter, a movement to fight racism directed
  at the Black community, often at the hands of police and vigilantes. The statement shifts the narrative
  to composition and communication, asking how Black lives matter in language education, research, and
  scholarship.</p>

  <p>The CCCC strongly promotes students’ language rights based on their own cultural backgrounds, yet
  it acknowledges that language rights have suffered from a similarly “inadequate response” as other social
  justice movements. Specifically for Black students and writers, cultural traditions such as AAVE/Ebonics
  continue to be devalued and diminished in line with the devaluation of Black lives. The demand upholds
  the organization’s earlier statement that Ebonics communicates Black traditions and social truths. The
  statement includes these demands:</p>

  <ul><li>That teachers stop teaching only standard English as the communicative norm • That teachers
  stop teaching Black students to code-switch and instead teach about linguistic racism • That teachers
  teach “Black Linguistic Consciousness” and work to unravel anti-Black linguistic racism • That Black
  perspectives be included in the research and teaching of Black language</li></ul>

  <p>You can learn more about the impact of linguistic bias in education in this TEDx Talk (https://openstax.org/r/
  thistedxtalk_QrTFJ5NlM1g).</p>

  <h3>Publication: Writing as Your Artifact</h3>

  <p>Try this short exercise to identify and practice writing in a dialect that directly reflects the
  culture your artifact comes from. Write a short three- to five-paragraph story from the perspective
  of the artifact you chose for this chapter’s writing assignment. What might your artifact see, hear,
  feel, or experience in its everyday life? Concentrate on using an authentic dialect, including vocabulary,
  grammatical conventions, and sentence structure, when constructing your story. As you reread your writing,
  ensure that you can hear your authentic voice in the text.</p>

  <p>When all stories have been written, consider collaborating with your instructor to collect them in
  a class book that includes illustrations of the artifacts and a short quotation from the point of view
  of each artifact, similar to the format of the Trailblazer sections of this book.</p>

  <p>2.8 Portfolio: Decolonizing Self</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Write a reflection of your composition process
  and how it affects your work. • Apply the composing processes as a means to discover and reconsider
  ideas.</p>

  <p>After each writing assignment in this course, you will reflect on and write about the composition
  process. Doing so makes you a more thoughtful writer as you think about the ideas, audience, purpose,
  and cultural considerations of your work.</p>

  <h3>The Colonized Self</h3>

  <p>The colonized lived experience is an important topic of academic discourse. When one refers to a
  situation as colonized, they mean that the ideas, customs, and culture of one group of people have been
  imposed onto the Indigenous people of a land. For example, colonization occurred when European explorers
  arrived in the Americas between the 16th and 18th centuries to inhabit land already populated by various
  Native American peoples with their own culture and customs. Many scholars and students are interested
  in exploring what it means to remove this foreign experience from the curriculum and to discontinue
  operating under the assumption that groups in power determine customs and culture.</p>

  <p>Such a process begins with an examination of individual identities and cultures. You have likely
  attended school in systems that privilege a mainstream culture over all others. The challenge is to
  figure out the identity of your authentic self, stripped of colonizing forces, the way Sequoyah, Cathy
  Park Hong, W. E. B. Du Bois, and others have tried to do. Essentially, two versions exist of the self:
  the colonized self that conforms to academic standards even when they do not align with personal cultural
  experiences and the decolonized self that challenges mainstream standards, especially when they do not
  include or make space for lived experiences. So what does the process of decolonizing look like?</p>

  <h3>The Decolonized Self</h3>

  <p>Throughout much of American history, education has focused on advancing the colonial purposes of
  assimilation. This practice can be harmful to everyone, especially to students identifying as BIPOC
  (Black, Indigenous, and people of color). While outright racism and exclusion are now frowned upon in
  academia, colonial racism and exclusion persist through more subtle means: systems of oppression, curricula,
  and institutional structures.</p>

  <p>As a student and writer, you likely have experienced the effects of colonization either to your benefit
  or your detriment. While it can be difficult to break through entrenched racism and exclusion, through
  the process of decolonization you can form your identity and better understand the identities of people
  from other cultures.</p>

  <p>The word decolonization refers to the process of a nation or territory breaking free from an oppressive
  colonial power that controls it. In essence, decolonization is a statement of independence. When used
  in cultural terms, decolonization refers to challenging and changing the individual and collective consciousness
  rooted in racism and oppression. Essentially, then, it means undoing colonial practices that have influenced
  education in the past and continue to do so today. You can learn more about decolonizing education in
  this TEDx Talk (https://openstax.org/r/thistedxtalk_zeKHOTDwZxU).</p>

  <p>As you work to develop your decolonized self, you will likely spend time on introspection, examining
  unconscious biases and how they affect your perspective on your culture and other cultures. Learning
  to be anti-racist and inclusive is a lifelong process, one that can be developed in part through the
  writing process. Continual questioning and reflection is the most important part of decolonization.</p>

  <h3>Reflection Prompt</h3>

  <p>In your portfolio for this chapter, imagine that other students in colleges and universities across
  the country are talking about some of these same cultural issues. Think of it as one big conversation.
  American philosopher and rhetorician Kenneth Burke (1897–1993) created the metaphor of a parlor where
  academics across time and space have gathered to help you imagine what academic conversations must be
  like. Burke describes an academic conversation as “unending”: “Others . . . are engaged in a heated
  discussion. . . . You listen for a while . . . then you put in your oar” (Burke 110). In other words,
  as you write, you are adding to a timeless conversation among thinkers and authors. Your words help
  define cultural understanding of the future. (More about this “conversation” appears in Glance at Genre:
  Introducing Research as Evidence.)</p>

  <p>Consider Burke’s concept of joining an unending conversation along with the intersections of your
  cultural identities. Write a reflection in which you imagine what happens in the Burkean parlor of your
  own making when you enter. How does the conversation change as a result of your presence? What parts
  of yourself contribute to, or maybe even derail, the ongoing conversations? How does the parlor change
  after you leave? Do you leave the parlor bubbling like warm, nourishing soup or in (figurative) flames?</p>

