  <p>Teacher Resources for “Understanding Environmental Justice: Writing Urban Spaces”</p>

  <h3>Overview and Teaching Strategies</h3>

  <p>Maintaining a healthy democracy requires a literate citizenry capable of articulating the significance
  of their sociopolitical environment based upon a rhetorically compelling explanation of the issues confronting
  their local context. Therefore, it is vital that students learn to write about spaces that civically
  engage them on a personal level; over the past three semesters of gathering feedback on my teaching
  social justice and urban studies in first-year writing courses, students have voiced this civic interest
  towards writing about environmentalist themes related to their local spaces that can be tied to social
  justice discourses more broadly. Their lived spaces are overwhelmingly urban, necessitating a rhetorical
  framework that addresses common environmental themes observed in built environments (i.e., cities) to
  fit student interests while also developing a method for scaffolding their ability to research and write
  on their selected issue using critical awareness of the sociopolitical context that gives rise to that
  issue.</p>

  <p>This chapter can be taught as part of a social justice, environmentalist, or urban studies theme,
  within units that accord with most first year writing curricula, such as personal reflection narratives
  and rhetorical analyses. Part I highlights why it is important to study rhetorical themes in urban environmental
  justice, while Part II describes the SHOWED method you can use in class to prompt students to collect
  spatial data for analysis through the lens of the given topics as a starting point. The essay concludes
  with a description of the five most common environmental themes under which we can suggest topics for
  student writing. They are also free to generate new themes grounded in the data, using a deductive approach
  to answer the questions and formulate a topic.</p>

  <p>Students may have to develop different sets of skills to collect and analyze data; however, these
  can be major-specific and benefit students in their discipline-specific literacy. For analysis of photography
  and video, graphical representations, and particularly dense or jargon-laden sources on a topic, getting
  instructor feedback on their questions and the scope of their research is important. Teaching students
  how to narrate their experience and use it as data for representing environmental injustice is another
  necessary skill set. Therefore, I have included several activities and reading questions to help teachers
  map their unit and for students to effectively comprehend and apply the chapter.</p>

  <h3>Discussion Questions</h3>

  <p>1. What are some examples of environmental issues in your own neighborhood that might fit under one
  of the five themes in the chapter?</p>

  <p>2. Typical environmental issues in the city involve a certain region being compared to others in
  order to establish an exploitative or neglectful relationship between them. Can you think of any other
  themes besides the five listed that might fit this criteria?</p>

  <p>3. Select a picture of your community from the internet that you feel most positively represents
  it. Now select one that you feel most negatively represents it. Explain the difference between the two
  and why you selected them, and then answer the SHOWED questions to express a problem that relates the
  two.</p>

  <p>4. Do you think it is more useful to write about an urban environmental issue through the narrative
  or analytic mode, based on the examples you read about in the chapter? Why?</p>

  <h3>Activities for Analytical or Narrative Writing Assignments</h3>

  <p>1. In a first year writing unit on urban ecology or environmental justice that requires an analytical
  piece of writing, the first session before engaging in the photovoice methods of the chapter would focus
  on creating and sharing urban maps around communities of interest. Then, groups or individuals could
  generate some word clouds about those spaces regarding concepts they connote with it. After that, students
  can think about how others have represented these places, by doing a quick media or image search for
  a point of reference. This experience will allow them to triangulate their experience among others who
  co-construct the meaning of that space. Hopefully, as they begin to gather data (perhaps through the
  third discussion question attached with the chapter), this initial discovery will shape their final
  essay towards synthesizing their own feelings about place with the formal research of others. These
  opinions might include those of cultural geographers, sociologists, folklorists, autobiographers, urban
  planners, real estate specialists, politicians, or others who speak on a particular issue affecting
  the area.</p>

  <p>2. For a narrative product, it is more important that students learn the elements of craft, such
  as plot, rich description, sensory detail, and figurative language, than it for them to spend time developing
  the kinds of critical data literacy needed for rhetorical analysis. However, it must still relate an
  urban injustice in such a rhetorically compelling way as to advocate for change. An assignment that
  could address these two needs would use urban narratives, even canonical literature if the instructor
  is so inclined, to connect their experiences of environmental injustice with an understanding of various
  techniques for expressing them. For instance, in the urban novel Bleak House, Dickens satirized Mrs.
  Jellyby for her “telescopic philanthropy” (see Chapter 4, which is titled with this term). She dedicates
  her life to charity in Africa while her children, neighbors, and local Londoners went unclothed and
  ill-fed. She could not see that the East Londoners lived in dark and airless tenements that “Africans,”
  whom she so monolithically patronized, would decline flat out. Have the students read the sections on
  Mrs. Jellyby and then really challenge them by asking how they may see any local analogies in their
  own experience. At the same time, have students highlight the basics of craft within the passage: instances
  of dialogue, creative use of punctuation, rich description, sensory details, figurative language, etc.</p>'
