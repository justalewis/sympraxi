  with Bill Whitaker.” 60 Minutes. 22 Sept. 2019. @realDonaldTrump. “...musician @johnlegend, and his
  filthy mouthed wife, are talking now about how great it is - but I didn’t see them around when we needed
  help getting it passed. “Anchor”@LesterHoltNBC doesn’t even bring up the subject of President Trump
  or the Republicans when talking about...” Twitter, 8 Sept. 2019, 10:11 p.m. Garrison follows MLA guidelines
  to cite her sources.</p>

  <h3>Discussion Questions</h3>

  <p>1. How might Gwyn Garrison have used action to introduce her thesis? Dialogue? Is reaction the best
  choice? Why or why not?</p>

  <p>2. What reasoning does Garrison offer to support her thesis? 3. What textual evidence does Garrison
  offer to support her thesis? 4. How does Garrison connect literary elements—particularly language and
  character—with real-world events? Explain why you think these connections are valid or not. 5. Are you
  convinced or unconvinced of the validity of the thesis? Why or why not?</p>

  <p>For Reference: “The Storm” by Kate Chopin (1850–1904)</p>

  <p>The leaves were so still that even Bibi thought it was going to rain. Bobinôt, who was accustomed
  to converse on terms of perfect equality with his little son, called the child’s attention to certain
  sombre clouds that were rolling with sinister intention from the west, accompanied by a sullen, threatening
  roar. They were at Friedheimer’s store and decided to remain there till the storm had passed. They sat
  within the door on two empty kegs. Bibi was four years old and looked very wise.</p>

  <p>“Mama’ll be ’fraid, yes,” he suggested with blinking eyes.</p>

  <p>“She’ll shut the house. Maybe she got Sylvie helpin’ her this evenin’,” Bobinôt responded reassuringly.</p>

  <p>“No; she ent got Sylvie. Sylvie was helpin’ her yistiday,” piped Bibi.</p>

  <p>Bobinôt arose and going across to the counter purchased a can of shrimps, of which Calixta was very
  fond. Then he returned to his perch on the keg and sat stolidly holding the can of shrimps while the
  storm burst. It shook the wooden store and seemed to be ripping great furrows in the distant field.
  Bibi laid his little hand on his father’s knee and was not afraid.</p>

  <h3>II</h3>

  <p>Calixta, at home, felt no uneasiness for their safety. She sat at a side window sewing furiously
  on a sewing machine. She was greatly occupied and did not notice the approaching storm. But she felt
  very warm and often stopped to mop her face on which the perspiration gathered in beads. She unfastened
  her white sacque at the throat. It began to grow dark, and suddenly realizing the situation she got
  up hurriedly and went about closing windows and doors.</p>

  <p>Out on the small front gallery she had hung Bobinôt’s Sunday clothes to dry and she hastened out
  to gather them before the rain fell. As she stepped outside, Alcée Laballière rode in at the gate. She
  had not seen him very often since her marriage, and never alone. She stood there with Bobinôt’s coat
  in her hands, and the big rain drops began to fall. Alcée rode his horse under the shelter of a side
  projection where the chickens had huddled and there were plows and a harrow piled up in the corner.</p>

  <p>“May I come and wait on your gallery till the storm is over, Calixta?” he asked.</p>

  <p>“Come ’long in, M’sieur Alcée.”</p>

  <p>His voice and her own startled her as if from a trance, and she seized Bobinôt’s vest. Alcée, mounting
  to the porch, grabbed the trousers and snatched Bibi’s braided jacket that was about to be carried away
  by a sudden gust of wind. He expressed an intention to remain outside, but it was soon apparent that
  he might as well have been out in the open: the water beat in upon the boards in driving sheets, and
  he went inside, closing the door after him. It was even necessary to put something beneath the door
  to keep the water out.</p>

  <p>“My! what a rain! It’s good two years since it rain’ like that,” exclaimed Calixta as she rolled
  up a piece of bagging and Alcée helped her to thrust it beneath the crack.</p>

  <p>She was a little fuller of figure than five years before when she married; but she had lost nothing
  of her vivacity. Her blue eyes still retained their melting quality; and her yellow hair, dishevelled
  by the wind and rain, kinked more stubbornly than ever about her ears and temples.</p>

  <p>The rain beat upon the low, shingled roof with a force and clatter that threatened to break an entrance
  and deluge them there. They were in the dining room—the sitting room—the general utility room. Adjoining
  was her bedroom, with Bibi’s couch alongside her own. The door stood open, and the room with its white,
  monumental bed, its closed shutters, looked dim and mysterious.</p>

  <p>Alcée flung himself into a rocker and Calixta nervously began to gather up from the floor the lengths
  of a cotton sheet which she had been sewing.</p>

  <p>“If this keeps up, Dieu sait if the levees goin’ to stan it!” she exclaimed.</p>

  <p>“What have you got to do with the levees?” “I got enough to do! An’ there’s Bobinôt with Bibi out
  in that storm—if he only didn’ left Friedheimer’s!” “Let us hope, Calixta, that Bobinôt’s got sense
  enough to come in out of a cyclone.” She went and stood at the window with a greatly disturbed look
  on her face. She wiped the frame that was clouded with moisture. It was stiflingly hot. Alcée got up
  and joined her at the window, looking over her shoulder. The rain was coming down in sheets obscuring
  the view of far-off cabins and enveloping the distant wood in a gray mist. The playing of the lightning
  was incessant. A bolt struck a tall chinaberry tree at the edge of the field. It filled all visible
  space with a blinding glare and the crash seemed to invade the very boards they stood upon. Calixta
  put her hands to her eyes, and with a cry, staggered backward. Alcée’s arm encircled her, and for an
  instant he drew her close and spasmodically to him.</p>

  <p>“Bonté!” she cried, releasing herself from his encircling arm and retreating from the window, “the
  house’ll go next! If I only knew w’ere Bibi was!” She would not compose herself; she would not be seated.
  Alcée clasped her shoulders and looked into her face. The contact of her warm, palpitating body when
  he had unthinkingly drawn her into his arms, had aroused all the old-time infatuation and desire for
  her flesh. “Calixta,” he said, “don’t be frightened. Nothing can happen. The house is too low to be
  struck, with so many tall trees standing about. There! Aren’t you going to be quiet? say, aren’t you?”
  He pushed her hair back from her face that was warm and steaming. Her lips were as red and moist as
  pomegranate seeds. Her white neck and a glimpse of her full, firm bosom disturbed him powerfully. As
  she glanced up at him the fear in her liquid blue eyes had given place to a drowsy gleam that unconsciously
  betrayed a sensuous desire. He looked down into her eyes and there was nothing for him to do but to
  gather her lips in a kiss. It reminded him of Assumption.</p>

  <p>“Do you remember—in Assumption, Calixta?” he asked in a low voice broken by passion. Oh! she remembered;
  for in Assumption he had kissed her and kissed her; until his senses would well nigh fail, and to save
  her he would resort to a desperate flight. If she was not an immaculate dove in those days, she was
  still inviolate; a passionate creature whose very defenselessness had made her defense, against which
  his honor forbade him to prevail. Now—well, now—her lips seemed in a manner free to be tasted, as well
  as her round, white throat and her whiter breasts.</p>

  <p>They did not heed the crashing torrents, and the roar of the elements made her laugh as she lay in
  his arms. She was a revelation in that dim, mysterious chamber; as white as the couch she lay upon.
  Her firm, elastic flesh that was knowing for the first time its birthright, was like a creamy lily that
  the sun invites to contribute its breath and perfume to the undying life of the world. The generous
  abundance of her passion, without guile or trickery, was like a white flame which penetrated and found
  response in depths of his own sensuous nature that had never yet been reached.</p>

  <p>When he touched her breasts they gave themselves up in quivering ecstasy, inviting his lips. Her
  mouth was a fountain of delight. And when he possessed her, they seemed to swoon together at the very
  borderland of life’s mystery.</p>

  <p>He stayed cushioned upon her, breathless, dazed, enervated, with his heart beating like a hammer
  upon her. With one hand she clasped his head, her lips lightly touching his forehead. The other hand
  stroked with a soothing rhythm his muscular shoulders.</p>

  <p>The growl of the thunder was distant and passing away. The rain beat softly upon the shingles, inviting
  them to drowsiness and sleep. But they dared not yield.</p>

  <p>The rain was over; and the sun was turning the glistening green world into a palace of gems. Calixta,
  on the gallery, watched Alcée ride away. He turned and smiled at her with a beaming face; and she lifted
  her pretty chin in the air and laughed aloud.</p>

  <h3>III</h3>

  <p>Bobinôt and Bibi, trudging home, stopped without at the cistern to make themselves presentable.</p>

  <p>“My! Bibi, w’at will yo’ mama say! You ought to be ashame’. You oughta’ put on those good pants.
  Look at ’em! An’ that mud on yo’ collar! How you got that mud on yo’ collar, Bibi? I never saw such
  a boy!” Bibi was the picture of pathetic resignation. Bobinôt was the embodiment of serious solicitude
  as he strove to remove from his own person and his son’s the signs of their tramp over heavy roads and
  through wet fields. He scraped the mud off Bibi’s bare legs and feet with a stick and carefully removed
  all traces from his heavy brogans. Then, prepared for the worst—the meeting with an over-scrupulous
  housewife, they entered cautiously at the backdoor.</p>

  <p>Calixta was preparing supper. She had set the table and was dripping coffee at the hearth. She sprang
  up as they came in.</p>

  <p>“Oh, Bobinôt! You back! My! but I was uneasy. W’ere you been during the rain? An’ Bibi? he ain’t
  wet? he ain’t hurt?” She had clasped Bibi and was kissing him effusively. Bobinôt’s explanations and
  apologies which he had been composing all along the way, died on his lips as Calixta felt him to see
  if he were dry, and seemed to express nothing but satisfaction at their safe return.</p>

  <p>“I brought you some shrimps, Calixta,” offered Bobinôt, hauling the can from his ample side pocket
  and laying it on the table.</p>

  <p>“Shrimps! Oh, Bobinôt! you too good fo’ anything!” and she gave him a smacking kiss on the cheek
  that resounded, “J’vous réponds, we’ll have a feas’ to-night! umph-umph!”</p>

  <p>Bobinôt and Bibi began to relax and enjoy themselves, and when the three seated themselves at table
  they laughed much and so loud that anyone might have heard them as far away as Laballière’s.</p>

  <h3>IV</h3>

  <p>Alcée Laballière wrote to his wife, Clarisse, that night. It was a loving letter, full of tender
  solicitude. He told her not to hurry back, but if she and the babies liked it at Biloxi, to stay a month
  longer. He was getting on nicely; and though he missed them, he was willing to bear the separation a
  while longer—realizing that their health and pleasure were the first things to be considered.</p>

  <h3>V</h3>

  <p>As for Clarisse, she was charmed upon receiving her husband’s letter. She and the babies were doing
  well. The society was agreeable; many of her old friends and acquaintances were at the bay. And the
  first free breath since her marriage seemed to restore the pleasant liberty of her maiden days. Devoted
  as she was to her husband, their intimate conjugal life was something which she was more than willing
  to forego for a while. So the storm passed and everyone was happy.</p>

  <p>16.5 Writing Process: Thinking Critically About Text</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Develop a writing project focused on textual analysis.
  • Complete the stages of the writing process, including generating ideas, drafting, reviewing, revising,
  rewriting, and editing. • Integrate the writer’s ideas with ideas of others. • Collaborate in the peer
  review process.</p>

  <p>When analyzing a text, writers usually focus on the content of the text itself and deliberately leave
  themselves in the background, minimizing personal presence and bias. To write this way, they avoid first-person
  pronouns and value judgments. In reality, of course, writers do reveal their presence by the choices
  they make: what they include, what they exclude, and what they emphasize. Although your own subjectivity
  and situation will likely affect your inferences and judgments, recognizing these potential biases will
  help you keep the focus on your subject and off yourself.</p>

  <h3>Summary of Assignment</h3>

  <p>Write an analytical essay about a short story or another short text of your choice, either fiction
  or literary nonfiction. If desired, you may choose “The Storm” by Kate Chopin, reprinted above. Consider
  the author’s form and organization, tone, or stylistic choices, including diction and sensory or figurative
  language. You might also consider the historical or social context, the theme, the character development,
  or the relation between setting and plot or characterization. If you are free to choose your own text
  and topic, consider the following approaches:</p>

  <ul><li>Analyze the literary components mentioned and focus your essay on their significance in the
  work. • Like student author Gwyn Garrison, choose one or several components and examine how different
  authors use them and how they relate to broader contexts.</li></ul>

  <p>Convincing textual analysis essays usually include the following information:</p>

  <ul><li>overview of the text, identifying author, title, and genre • very brief summary • description
  of the text’s form and structure • explanation of the author’s point of view</li><li>summary of the
  social, historical, or cultural context in which the work was written • assertion or thesis about what
  the text means: your main task as an analyst</li></ul>

  <p>When writing about a novel or short story, explain how the main elements function:</p>

  <ul><li>narrator (who tells the story) • plot (what happens in the story) • one or more characters (who
  are acting or being acted upon) • setting (when and where things are happening) • theme (the meaning
  of the story)</li></ul>

  <p>Keep in mind that the author who writes the story is different from the narrator and invented characters
  in it. Keep in mind, too, that what happens in the story—the plot—is different from the meaning of the
  story—the theme. Understanding what happens will help you discover what the text means.</p>

  <p>The elements (https://openstax.org/r/elements) of literary or narrative nonfiction are similar to
  those of a fictional story except that everything in the text is supposed to have really happened. For
  this reason, the author and the narrator of the story may be one and the same. Informational nonfiction—essays,
  reports, and textbook chapters—is also meant to be believed; here, however, ideas and arguments must
  be strong and well supported to be convincing. When analyzing nonfiction, pay special attention to the
  author’s thesis or claim and to how it is supported through reasoning and evidence. Also note interesting
  or unusual tone, style, form, or voice.</p>

  <p>Another Lens 1. In writing from a personal or subjective viewpoint, the writer and their beliefs
  and experiences are necessarily part of your analysis and may need to be expressed and examined. For
  example, you may write subjectively and compare and contrast your situation with that of the author
  or a character. You might explain how your personal background causes you to read the text in a particular
  way that is meaningful to you. If you choose this option, be sure to analyze the text as you would for
  a more objective analysis before focusing on your personal views.</p>

  <p>Another Lens 2. A leading contemporary example of narrative nonfiction writing is Jon Krakauer’s
  (b. 1954) Into the Wild (https://openstax.org/r/Into-the-Wild), the story of Chris McCandless (1968–
  c. 1992), a young college graduate who lived at subsistence level in the backwoods of Alaska for 113
  days. The text is somewhat similar thematically to Henry David Thoreau’s (1817–1862) Walden (1854),
  written more than a century earlier and discussed later in this section. Both are about dropping out
  of society to create a meaningful life. After reading the excerpt of Into the Wild linked above, you
  may choose to write a textual analysis of it either on its own or in light of the sample analysis of
  Thoreau’s writings later in this section. Consider comparing and contrasting McCandless’s situation
  with Thoreau’s life in Walden and how Krakauer and Thoreau use various literary elements in their writing.
  Topics for analysis might be setting, character traits, motives, cultural communities, historical context,
  and attitudes toward life and society.</p>

  <h3>Quick Launch: Start with Your Thesis</h3>

  <p>For textual analysis, your thesis should be a clear, concise statement that identifies your analytical
  stance on which readers will expect you to elaborate.</p>

  <h3>Develop a working thesis</h3>

  <p>A working thesis is referred to as such because the thesis is subject to revision. You may have to
  revisit it later in the writing process, for it is almost impossible to craft a thesis without having
  analyzed some of the text first. Your thesis, therefore, will come from the element(s) you choose to
  analyze, such as the following:</p>

  <ul><li>an aspect or several aspects of form and structure and their significance • social, historical,
  or cultural context in which the text was written and its significance • style elements such as diction,
  imagery, or figurative language and their significance</li><li>aspects of characters, plot, or setting
  • overall theme of a single work or more than one work • comparison or contrast of elements within one
  or more works • relation to issues outside the text To develop a working thesis, use the formula shown
  in Table 16.1, basing your answers on one of the bulleted items listed above.</li></ul>

  <p>What are you doing? + Why are you doing it?</p>

  <p>What are you doing? Analyzing Kate Chopin’s short story “The Storm”</p>

  <p>+</p>

  <p>Why are you doing it? “To argue that…”</p>

  <p>=</p>

  <p>In the short story “The Storm,” author Kate Chopin uses linguistic variety to add to the character
  development.</p>

  <p>You can also start with an analytical question: For what reason(s) does Chopin use linguistic variety?
  Your initial answer might yield the thesis above. Or you can ask another analytical question, such as
  this one: In what ways do the plot and setting of “The Storm” reinforce its theme?</p>

  <h3>Drafting: Explore Possible Areas of Analysis for Fiction: Approach 1</h3>

  <p>Analytical essays (https://openstax.org/r/Analytical-essays) begin by answering basic questions:
  What genre is this text—poem, play, story, biography, memoir, essay? What is its title? Who is the author?
  When was it published? Identify and Summarize the Text</p>

  <p>In addition to the basic questions, analytical essays provide a brief summary of the plot or main
  idea. Summarize briefly, logically, and objectively to provide a background for what you plan to say
  about the text. This information may be incorporated into the introduction or may follow it. Explain
  the Form and Organization</p>

  <p>To analyze the organizational structure of a text, ask: How is it put together? Why does the author
  start here and end there? Why does the author sequence information in this order? What connects the
  text from start to finish? For example, by repeating words, ideas, and images, writers call attention
  to these elements and indicate that they are important to the meaning of the text. No matter what the
  text, some principle or plan holds it together and gives it structure. Fiction and nonfiction texts
  that tell stories are often, but not always, organized as a sequence of events in chronological order.
  Poems may have formal structures or other organizational elements. Other texts may alternate between
  explanations and examples or between firstperson and third-person narrative. You will have to decide
  which aspects of the text’s form and organization are most important for your analysis. For example,
  this student analyzes the point of view of Gwendolyn Brooks’s poem “We Real Cool (https://openstax.org/r/We-Real-Cool).”.</p>

  <p>Gwendolyn Brooks writes “We Real Cool” (1963) from the point of view of members of a street gang
  who speak as one voice. The boys have dropped out of school to spend their lives hanging around pool
  halls—in this case “The Golden Shovel.” These guys speak in slangy lingo, such as “Strike straight,”
  that reveals their need for a melded identity in their rebellious attitude toward life. The plural speaker
  in the poem, “We,” celebrates what adults might call adolescent hedonism—but the speaker, feeling powerful
  in the group identity, makes a conscious choice for a short, intense life over a long, safe, and dull
  existence.</p>

  <h3>Place the Work in Context</h3>

  <p>To analyze the context of a text, ask: What circumstances (historical, social, political, biographical)
  produced this text? How does this text compare or contrast with another by the same author or with a
  similar work by a different author? No text exists in isolation. Each was created by a particular author
  in a particular place at a particular time. Describing this context provides readers with important
  background information and indicates which conditions you think were most influential.</p>

  <p>For example, this student analyzes the social context of Gwendolyn Brooks’s poem “We Real Cool.”</p>

  <p>From society’s viewpoint, the boys are nothing but misfits—refusing to work, leading violent lives,
  breaking laws, and confronting police. However, these boys live in a society that is dangerous for Black
  men, who often die at the hands of police even when they are doing the right thing. The boys are hopeless,
  recognizing no future but death, regardless of their actions, and thus “Die soon.”</p>

  <h3>Explain the Theme of the Text</h3>

  <p>To analyze the theme of a text, determine the implied theme in fiction, poetry, and narrative nonfiction.
  One purpose for writing a textual analysis is to point out the theme. Ask yourself: So what? What is
  this text really about? What do I think the author is trying to say by writing this text? What problems,
  puzzles, or ideas are most interesting? In what ways do the characters change between the beginning
  and end of the text? Good ideas for a thesis arise from material in which the meaning is not obviously
  stated.</p>

  <p>For example, this student analyzes one theme of Gwendolyn Brooks’s poem “We Real Cool.”</p>

  <p>For the “Seven at the Golden Shovel,” companionship is everything. For many teenagers, fitting in
  or conforming to a group identity is more important than developing an individual identity. Brooks expresses
  this theme through the poem’s point of view, the plural “We” repeated at the end of each line.</p>

  <h3>Analyze Stylistic Choices</h3>

  <p>To analyze stylistic choices, examine the details of the text. Ask yourself: Why does the author
  use this word or phrase instead of a synonym for it? In what ways does this word or phrase relate to
  other words or phrases? In what ways do the author’s figurative comparisons affect the meaning or tone
  of the text? In what ways does use of sensory language (imagery) affect the meaning or tone of the text?
  In what ways does this element represent more than itself? In what ways does the author use sound or
  rhythm to support meaning?</p>

  <p>For example, this student analyzes the diction of Gwendolyn Brooks’s poem “We Real Cool.” Brooks
  chooses the word cool to open the poem and build the first rhyme. Being cool is the code by which the
  boys live. However, the word cool also suggests the idiom “to be placed ‘on ice,’” a term that suggests
  a delay. The boys live in a state of arrested development, anticipating early deaths. In addition, the
  term to ice someone means “to kill,” another reference to the death imagery at poem’s end. The boys
  are not suggesting suicide; they expect to be killed by members of society who find them threatening.</p>

  <h3>Support Your Analysis</h3>

  <p>Analytical interpretations (https://openstax.org/r/Analytical) are built around evidence from the
  text itself.</p>

  <p>You’ll note the quotations in the examples above. Summarize larger ideas in your own language to
  conserve space. Paraphrase more specific ideas, also in your own words, and quote directly to feature
  the author’s diction. See Editing Focus: Paragraphs and Transitions and Writing Process: Integrating
  Research for more information about summarizing, paraphrasing, and quoting directly. If you include
  outside information for support, comparison, or contrast, document the sources carefully: MLA Documentation
  and Format. Use a graphic organizer such as Table 16.2 to gather ideas for drafting.</p>

  <p>Genre</p>

  <p>If you’ve chosen to analyze poetry,</p>

  <p>Analysis</p>

  <p>Your Ideas</p>

  <p>Consider the role of…</p>

  <p>Word choice (imagery)</p>

  <p>Structure of lines and stanzas Sound (meter, rhyme, rhythm)</p>

  <p>Why does the author… ? What is the effect on meaning, tone, or audience?</p>

  <p>Figurative language (simile, metaphor, personification)</p>

  <p>If you’ve chosen to analyze drama,</p>

  <p>Consider the role of… Characters and dialogue Setting Plot and conflict Theme Structure of acts,
  scenes, and stage directions</p>

  <p>Why does the author… ? What is the effect on meaning, tone, or audience?</p>

  <p>If you’ve chosen to analyze fiction or narrative nonfiction,</p>

  <p>Consider the role of… Characters (narrator or author in narrative nonfiction) Setting Plot (or real
  events in narrative nonfiction) and conflict Theme Diction Structure (chronology, flashback or forward,
  foreshadowing, chapters)</p>

  <p>Why does the author… ? What is the effect on meaning, tone, or audience?</p>

  <p>Drafting: Explore Possible Areas of Analysis for Literary Nonfiction: Approach 2</p>

  <p>Although similar to fiction, narrative or literary nonfiction has a basic orientation toward exposition:
  relating real events in a creative way rather than inventing fictional events and characters. In reading
  and analyzing expository prose, you also may encounter literary language, narrative structure, characters,
  setting, theme, and plot development, depending on the type of prose. Therefore, your approach to analyzing
  nonfiction will call on many of the same strategies you use to analyze fiction. Two basic differences,
  however, are that literary nonfiction may have less dialogue, depending on the genre, and that the author
  and narrator may be the same. In other words, no intermediary or artistic filter may exist between the
  author and the work. The nonfiction author is assumed to be speaking a truth, which may be serious,
  comic, controversial, or neutral. Fictional characters, on the other hand, are creations of an author’s
  mind; they think and speak as they were created to do.</p>

  <h3>Planning the Essay</h3>

  <p>In writing your essay, you will need to present the same kinds of text evidence as you would when
  analyzing fiction to give credibility to your claims and to support your thesis. And you’ll need to
  keep in mind the rhetorical situation—purpose, audience, stance, context, and culture—as well, for it
  remains the building block of an effective analysis. As in most academic essays, body paragraphs refer
  to the thesis through topic sentences and move consistently toward supporting it before you finally
  arrive at a convincing conclusion that has grown out of the analysis. In nonfiction, because you assume
  you are dealing with a truthful explanation of facts and views, your task should be to give a new view
  and understanding of something that already may be familiar to readers. In writing your analysis, consider
  the following plan:</p>

  <ul><li>Begin your analysis of nonfiction with an introductory overview in which you include the work’s
  genre, title, author, and publication date.</li><li>Identify the literary point of view, if relevant:
  first person—I or plural we—or third-person—he, she, or they. • Continue with a brief summary of the
  work, and place it in context: the work’s social, historical, and cultural background will help readers
  follow your points about its theme. • Present your thesis near the end of the introduction. It should
  be argumentative, in an academic sense, so that you can “prove” your points. • Support your thesis with
  well-elaborated body paragraphs, as you do with all thesis-based writing. Include paraphrases, summaries,
  and quotations from the text (and outside sources, if you do research for the assignment). Body paragraphs
  support the topic sentences, which in turn support the thesis. • Conclude by restating your thesis (using
  different words and an appropriate transition). Add a general statement about the work and its significance
  or, if applicable, its relation to culture, history, current events, art, or anything else outside it.</li></ul>

  <p>Use the applicable suggestions in Table 16.3 in planning your essay (https://openstax.org/r/planning):</p>

  <p>Introduction</p>

  <h3>Title</h3>

  <p>Title(s), author(s), publication date(s), historical context, summary, thesis</p>

  <p>Body paragraphs (as many as needed; Transition Claims and supporting evidence: your ideas, paraphrases
  minimum of 3) and/or quotations from text</p>

  <p>Counterclaim (if any)</p>

  <p>Addressing opposing or negative ideas</p>

  <p>Conclusion</p>

  <h3>Restatement of thesis, broader generalization</h3>

  <p>Literary Nonfiction Model A frequent theme in literary nonfiction is the examination of alternative
  ways of living, often solitary and away from society, and finding truth in individualism and self-sufficiency.
  Although most people live in social groups and willingly accept the identity and security that communities
  offer, dropping out and going it alone have long been a part of emotional as well as physical life for
  some. You have the option to analyze the nonfiction accounts of writers exploring solitary human behavior
  in American life. If you select Another Lens 2, you will read an excerpt from the story of Chris McCandless
  (1968–c. 1992), who chose a brief and uncomfortable solitary existence in Alaska. Or you can read the
  following section dealing with the works of Henry David Thoreau, the American philosopher and author
  who dropped out of society temporarily, largely because of his strong opposition to government policies
  he believed to be morally wrong and because of his refusal to conform to social practices and expectations
  he found objectionable. Introduction</p>

  <p>I went to the woods because I wished to live deliberately [carefully, unhurried], to front [confront]
  only the essential facts of life, and see if I could not learn what it had to teach, and not, when I
  came to die, discover that I had not lived. I did not wish to live what was not life, living is so dear;
  nor did I wish to practise resignation, unless it was quite necessary. I wanted to live deep and suck
  out all the marrow of life.</p>

  <p>Thoreau’s insistence on standing by his principles and on living a simple life by choice are two
  abiding themes in his work. Even before the physical move to Walden, Thoreau had refused to pay his
  poll tax (granting him the right to vote) for a number of years because he strongly objected to the
  government’s use of his money to support enslavement and the war with Mexico. He went peacefully to
  jail as a result, until he was bailed out (the next day). In “Civil Disobedience,” Thoreau advocates
  for more individual freedom and for individuals to defy unjust laws in nonviolent ways. His writings
  on “passive resistance” inspired the thoughts and actions of influential figures such as Indian leader
  Mohandas Gandhi (1869–1948), American religious and civil rights leader Martin Luther King, Jr. (1929–1968),
  and other leaders of nonviolent liberation movements. In Walden, Thoreau describes and advocates for
  a simple life in which a person breaks with society when they feel the need to express their individualism,
  often based on ideas others do not share.</p>

  <p>These themes are the focus of analysis in the following excerpts from an essay by student Alex Jones
  for a firstyear composition class.</p>

  <h3>The Two Freedoms of Henry David Thoreau by Alex Jones</h3>

  <p>Henry David Thoreau led millions of people throughout the world to think of individual freedom in
  new ways. During his lifetime he attempted to live free of unjust governmental restraints as well as
  conventional social expectations. In his 1849 political essay “On the Duty of Civil Disobedience,” he
  makes his strongest case against governmental interference in the lives of citizens. In his 1854 book
  Walden; or Life in the Woods, he makes the case for actually living free, as he did in his own life,
  from social conventions and expectations.</p>

  <p>The title clearly identifies Thoreau and sets the expectation that two aspects or definitions of
  freedom will be discussed in two different works. Alex Jones wants readers to know that millions of
  people worldwide figure in Thoreau’s legacy. He gives the examples of “unjust governmental restraints”
  and “conventional social expectations” as the parts of social life Thoreau rejected, thus limiting the
  scope of the analysis and preparing for the body of the essay.</p>

  <p>Jones notes the titles and publication dates of both works and immediately moves ahead to analyze
  the two works, “Civil Disobedience” first. He will show how this political statement leads to the narrative
  of Walden, the actual story of a man’s life in temporary exile.</p>

  <p>Thoreau opens “Civil Disobedience” with his statement “that government is best which governs not
  at all.”</p>

  <p>The analysis moves immediately to the first work to be discussed and features the memorable quotation
  regarding a government that does not govern. The statement may seem contradictory, but for Thoreau it
  is a direct statement in that someone who allows himself to be imprisoned will find freedom by distancing
  himself from all others to prove his point.</p>

  <p>He argues that a government should allow its people to be as free as possible while providing for
  their needs without interfering in daily life. In other words, in daily life a person attends to the
  business of eating, sleeping, and earning a living and not dealing in any noticeable way with an entity
  called “a government.”</p>

  <p>Jones repeats “in daily life” to give a rhythm to his own prose and to emphasize the importance to
  Thoreau of daily activities that are simple and meaningful. The word government is repeated for emphasis
  as the negative subject of this essay—in literary terms, a powerful and constant antagonist that constrains
  and disempowers.</p>

  <p>Because Thoreau did not want his freedom overshadowed by government regulations, he tried to ignore
  them. However, the American government of 1845 would not let him. He was arrested and put in the Concord
  jail for failing to pay his poll tax, a tax he believed unjust because it supported the government’s
  war with Mexico as well as the immoral institution of slavery. Instead of protesting his arrest, he
  celebrated it and explained its meaning by writing “Civil Disobedience,” one of the most famous English-language
  essays ever written. In it, he argues persuasively, “Under a government which imprisons any unjustly,
  the true place for a just man is also a prison” (230). Thus, the idea of passive resistance—and accepting
  unjust arrest to make a point—was formed, a doctrine that advocated protest against the government by
  nonviolent means:</p>

  <p>How does it become a man to behave toward this American government today? I answer that he cannot
  without disgrace be associated with it. I cannot for an instant recognize that political organization
  as my government which is the slave’s government also. (224)</p>

  <p>Jones strengthens his own writing by calling the essay one of the most famous works ever written.
  This is not an ordinary technique in textual analysis, but when done for emphasis, it helps the analysis
  gain power. Using “instead of protesting” at the start of his sentence is another example of strong
  contrast and linkage.</p>

  <p>For nearly 200 years, Thoreau’s formulation of passive resistance has been a part of the human struggle
  for freedom. In fact, it changed the world by inspiring the resistance movements led by Mohandas Gandhi
  and Martin Luther King, Jr.</p>

  <p>The total effect is to make Jones’s analytical essay more important for readers, as Thoreau’s writings
  have indeed changed the world despite being written humbly as the voice of one man’s conscience and
  isolation in his own freedom.</p>

  <p>Thoreau also wanted to be free from the everyday pressures to conform to society’s expectations.</p>

  <p>Jones transitions from the first short work to the different and equally famous nonfiction narrative
  Walden, moving smoothly from one freedom to the next with the transition “also wanted.” This second
  analysis of freedom is the second part of the essay’s thesis.</p>

  <p>He believed in doing and possessing only the essential things in life. To demonstrate his case, in
  1845, he moved to the outskirts of Concord, Massachusetts, and lived by himself for just over two years
  in a cabin he built at Walden Pond. Thoreau wrote Walden to explain the value of living simply, far
  removed from the unnecessary complexity of society: “simplicity, simplicity, simplicity! I say, let
  your affairs be as two or three, and not a hundred or a thousand” (66). At Walden, he lived as much
  as possible by this statement, building his own house and furniture, growing his own food, bartering
  for simple necessities, and attending to his own business rather than seeking employment from others.</p>

  <p>Jones uses textual evidence to support his claim. He summarizes Thoreau’s activities at Walden and
  quotes Thoreau as evidence to reinforce the freedom of mind that simple living allows.</p>

  <p>Living at Walden Pond gave Thoreau the chance to formulate many of his ideas about living an unencumbered,
  economical life. At Walden, he lived simply to “front only the essential facts of life” (66) and to
  center his thoughts on “living” instead of on unnecessary details of mere livelihood. He developed survival
  skills that freed him from the constraints of city dwellers whose lives depended upon a web of material
  things and services provided by others. He preferred to “take rank hold on life and spend my day more
  as animals do” (117). Jones uses the poetic language of high rhetoric directly from Thoreau. The body
  of the essay gives specific evidence of how Thoreau ate, built, read, and provided for his needs, cutting
  away all but the essential man in the two settings of his life. While living at Walden Pond, Thoreau
  was free to occupy his time in any way that pleased him, which for him meant mostly writing and tending
  his bean patch. The details of his gardening appear frequently, as he concentrated on it during his
  time there. He wasn’t troubled by a boss hounding him with deadlines or a wife and children who needed
  his attention. His neighbors accused him of being selfish and did not understand that he sought most
  of all “to live deliberately” (66), as he felt all people should learn to do. Then, as now, most people
  had more responsibilities than Thoreau had and could not just pack up their belongings and go live in
  the woods—if they could find free woods to live in. Today, people are intrigued to read about Thoreau’s
  experiences and are inspired by his thoughts, but few people can actually live or do as he suggests.
  The idea of life without cell phones or Internet seems inconceivable, even if one grows one’s own food
  and lives mostly off the grid. The next-to-last paragraph recognizes what could be a counterclaim: not
  everyone in contemporary times would view living alone for two years as a pleasure. Rather, they might
  see it as a different kind of prison, perhaps even a dangerous one. Indeed, such deprivation has less
  appeal these days, and people who do go off by themselves may be seen to have questionable motives.
  The theme of exploring how a man lives in or outside governmental control is clear in the choices he
  must make to define himself as a free person. Nevertheless, practical or not, Thoreau’s writings about
  freedom from government and society have inspired countless people to reassess how they live their lives.
  Though unable to live as Thoreau advocated, readers everywhere remain inspired by his ideals and his
  belief in the two freedoms. Jones concludes by emphasizing the strength of Thoreau’s ideas—his two freedoms—and
  the influence they have had in the world.</p>

  <p>Review the Essay After reading Alex Jones’s essay, complete the following sentences to review his
  work:</p>

  <ul><li>He identifies and summarizes the content by ________. • He describes the form and structure
  of Thoreau’s works when ________. • He places Thoreau and his works in context by ________. • He clearly
  states his own theme in reading Thoreau, which is ________. • He indicates Thoreau’s unusual language
  at times, such as ________. • He gives supporting evidence for his points, such as ________. • He includes
  a visual to ________. • He concludes with a balanced and convincing viewpoint by ________.</li></ul>

  <p>For Reference: excerpt from Walden (https://openstax.org/r/Civil-Disobedience) by Henry David Thoreau
  from “Where I Lived and What I Lived For”</p>

  <p>When first I took up my abode in the woods, that is, began to spend my nights as well as days there,
  which, by accident, was on Independence Day, or the Fourth of July, 1845, my house was not finished
  for winter, but was merely a defense against the rain, without plastering or chimney, the walls being
  of rough, weather-stained boards, with wide chinks, which made it cool at night. The upright white hewn
  studs and freshly planed door and window casings gave it a clean and airy look, especially in the morning,
  when its timbers were saturated with dew, so that I fancied that by noon some sweet gum would exude
  from them. To my imagination it retained throughout the day more or less of this auroral character,
  reminding me of a certain house on a mountain which I had visited the year before. This was an airy
  and unplastered cabin, fit to entertain a travelling god, and where a goddess might trail her garments.
  The winds which passed over my dwelling were such as sweep over the ridges of mountains, bearing the
  broken strains, or celestial parts only, of terrestrial music.…</p>

  <p>The only house I had been the owner of before, if I except a boat, was a tent, which I used occasionally
  when making excursions in the summer, and this is still rolled up in my garret; but the boat, after
  passing from hand to hand, has gone down the stream of time. With this more substantial shelter about
  me, I had made some progress toward settling in the world. This frame, so slightly clad, was a sort
  of crystallization around me, and reacted on the builder. It was suggestive somewhat as a picture in
  outlines. I did not need to go outdoors to take the air, for the atmosphere within had lost none of
  its freshness. It was not so much within doors as behind a door where I sat, even in the rainiest weather.
  The Harivansa [important Sanskrit text] says, “An abode without birds is like a meat without seasoning.”
  Such was not my abode, for I found myself suddenly neighbor to the birds; not by having imprisoned one,
  but having caged myself near them.…</p>

  <p>For the first week, whenever I looked out on the pond it impressed me like a tarn high up on the
  side of a mountain, its bottom far above the surface of other lakes, and, as the sun arose, I saw it
  throwing off its nightly clothing of mist, and here and there, by degrees, its soft ripples or its smooth
  reflecting surface was revealed, while the mists, like ghosts, were stealthily withdrawing in every
  direction into the woods, as at the breaking up of some nocturnal conventicle. The very dew seemed to
  hang upon the trees later into the day than usual, as on the sides of mountains.</p>

  <p>This small lake was of most value as a neighbor in the intervals of a gentle rain storm in August,
  when, both air and water being perfectly still, but the sky overcast, mid-afternoon had all the serenity
  of evening, and the wood-thrush sang around, and was heard from shore to shore. A lake like this is
  never smoother than at such a time; and the clear portion of the air above it being shallow and darkened
  by clouds, the water, full of light and reflections, becomes a lower heaven itself so much the more
  important. From a hill top nearby, where the wood had been recently cut off, there was a pleasing vista
  southward across the pond, through a wide indentation in the hills which form the shore there, where
  their opposite sides sloping toward each other suggested a stream flowing out in that direction through
  a wooded valley, but stream there was none. That way I looked between and over the near green hills
  to some distant and higher ones in the horizon, tinged with blue. Indeed, by standing on tiptoe I could
  catch a glimpse of some of the peaks of the still bluer and more distant mountain ranges in the north-west,
  those true-blue coins from heaven’s own mint, and also of some portion of the village. But in other
  directions, even from this point, I could not see over or beyond the woods which surrounded me. It is
  well to have some water in your neighborhood, to give buoyancy to and float the earth. One value even
  of the smallest well is, that when you look into it you see that earth is not continent but insular.
  This is as important as that it keeps butter cool. When I looked across the pond from this peak toward
  the Sudbury meadows, which in time of flood I distinguished elevated perhaps by a mirage in their seething
  valley, like a coin in a basin, all the earth beyond the pond appeared like a thin crust insulated and
  floated even by this small sheet of interverting water, and I was reminded that this on which I dwelt
  was but dry land.</p>

  <p>We must learn to reawaken and keep ourselves awake, not by mechanical aids, but by an infinite expectation
  of the dawn, which does not forsake us in our soundest sleep. I know of no more encouraging fact than
  the unquestionable ability of man to elevate his life by a conscious endeavor. It is something to be
  able to paint a particular picture, or to carve a statue, and so to make a few objects beautiful; but
  it is far more glorious to carve and paint the very atmosphere and medium through which we look, which
  morally we can do. To affect the quality of the day, that is the highest of arts. Every man is tasked
  to make his life, even in its details, worthy of the contemplation of his most elevated and critical
  hour. If we refused, or rather used up, such paltry information as we get, the oracles would distinctly
  inform us how this might be done.</p>

  <p>I went to the woods because I wished to live deliberately, to front only the essential facts of life,
  and see if I could not learn what it had to teach, and not, when I came to die, discover that I had
  not lived. I did not wish to live what was not life, living is so dear; nor did I wish to practise resignation,
  unless it was quite necessary. I wanted to live deep and suck out all the marrow of life, to live so
  sturdily and Spartan-like as to put to rout all that was not life, to cut a broad swath and shave close,
  to drive life into a corner, and reduce it to its lowest terms, and, if it proved to be mean, why then
  to get the whole and genuine meanness of it, and publish its meanness to the world; or if it were sublime,
  to know it by experience, and be able to give a true account of it in my next excursion. For most men,
  it appears to me, are in a strange uncertainty about it, whether it is of the devil or of God, and have
  somewhat hastily concluded that it is the chief end of man here to “glorify God and enjoy him forever.”</p>

  <p>Still we live meanly, like ants; though the fable tells us that we were long ago changed into men;
  like pygmies we fight with cranes; it is error upon error, and clout upon clout, and our best virtue
  has for its occasion a superfluous and evitable wretchedness. Our life is frittered away by detail.
  An honest man has hardly need to count more than his ten fingers, or in extreme cases he may add his
  ten toes, and lump the rest. Simplicity, simplicity, simplicity! I say, let your affairs be as two or
  three, and not a hundred or a thousand; instead of a million count half a dozen, and keep your accounts
  on your thumb nail. In the midst of this chopping sea of civilized life, such are the clouds and storms
  and quicksands and thousand-and-one items to be allowed for, that a man has to live, if he would not
  founder and go to the bottom and not make his port at all, by dead reckoning, and he must be a great
  calculator indeed who succeeds. Simplify, simplify. Instead of three meals a day, if it be necessary
  eat but one; instead of a hundred dishes…</p>

  <p>Why should we live with such… waste of life? We are determined to be starved before we are hungry.
  Men say that a stitch in time saves nine, and so they take a thousand stitches to-day to save nine to-morrow.</p>

