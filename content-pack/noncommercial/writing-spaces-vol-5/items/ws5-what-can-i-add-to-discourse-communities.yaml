  <h3>What Can I Add to the Discourse Community? 99</h3>

  <p>Teacher Resources for “What Can I Add to Discourse Communities? How Writers Use Code-Meshing and
  Translanguaging to Negotiate Discourse”</p>

  <h3>Overview and Teaching Strategies</h3>

  <p>This essay can be used when teaching students about the concept of discourse community and is appropriate
  when discussing the ways that discourse communities communicate their goals and values through language
  expectations, especially via written genres. It might be read alongside Cristina Sánchez-Martín’s essay
  “Beyond Language Difference in Writing: Investigating Complex and Equitable Language Practices” or Mara
  Lee Grayson’s “Writing toward Racial Literacy,” both in Writing Spaces 4 (2022). This essay may also
  be read as a follow up to Kerry Dirk’s text “Navigating Genres” in Writing Spaces 1 and/or Dan Melzer’s
  essay “Understanding Discourse Communities” in Writing Spaces 3.</p>

  <p>The claims in this text regarding the characteristics of translanguaging, code-meshing and language
  as negotiation are presented as companion and counterpoint to the discourse community characteristic
  of lexis or specialized language. As students explore discourse communities, including academic disciplines
  or majors, and as they notice how language expectations establish or uphold goals, values, and beliefs,
  they can turn to investigating how translanguaging or code-meshing appears or might be part of negotiating
  discourse community expectations. Students might analyze: 1) the extent to which a specific discourse
  community values monolingual and/or multilingual language practices; 2) the potentialities of translingualism
  and/or code-meshing as tools to challenge the dominant language practices of the discourse communities
  in which they are (or want to be) members; 3) the possible risks and benefits of using these practices
  in relationship to their membership in a given discourse community. In addition to the questions for
  discussion for students shared below, instructors might consider specific questions in the context of
  this essay for their own teaching, such as:</p>

  <ul><li>How can writing instructors consider concepts like monolingualism, Whiteness and/or White language
  supremacy, in our teaching of writing, or of discourse community as a concept?</li><li>How can instructors
  explore or allow translingual and/or code-meshing practices in students’ language work (talk or text)
  as a viable and visible way to promote linguistic justice?</li></ul>

  <h3>Questions, Activities and Prompts for Discussion</h3>

  <p>1. Find and evaluate a meme as representative of a discourse community.</p>

  <p>{ Justify the extent to which the meme is or is not representative of a particular discourse community
  and explain your rationale.</p>

  <p>{ Analyze language expectations of the discourse community by comparing the meme to another genre
  from the discourse community.</p>

  <p>{ Evaluate the meme use (if present) of translanguaging or code-meshing. If no translanguaging or
  code-meshing is present, evaluate how well the meme adheres to its discourse community’s language expectations.</p>

  <p>2. Design a meme for a particular discourse community using its lexis and integrating translanguaging
  or code-meshing practices as appropriate to your linguistic resources. Be respectful and do not appropriate
