  <p>Frequently Used Reasoning Strategies Terms</p>

  <ul><li>Audience: the people who will read your paper. • Description: writing in which the author attempts
  to depict certain characteristics of a person, place, or object. Writers describe their subjects by
  carefully noting details and sensory impressions, such as what the subject looks, sounds, smells, tastes,
  or feels like. • Metaphors: comparison of two unlike elements. For example, the arguing protestors were
  volcanic, spewing hot, inflammatory speech. • Narration: telling a story or relating events. • Point:
  an important idea to share with the audience. • Purpose: reason for writing. • Sequencing: relating
  information in the order in which something happened or in which steps should be followed. • Similes:
  comparison of two unlike elements. The word as or like appears in a simile. For example, the protestors’
  arguments were as heated as an erupting volcano.</li><li>Thesis: the overarching and unifying idea of
  a piece of writing.</li></ul>

  <p>11.4 Annotated Sample Reading: from Book VII of The Republic by Plato</p>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Identify reasoning strategies and explain their function in a written text. • Explain how reasoning
  strategies are shaped by purpose, language, culture, and expectation. • Read and respond critically
  to a text.</li></ul>

  <p>Introduction escaped prisoner returned and explained to them that what they had believed to be real
  is, in fact, false. The allegory and questions Socrates poses illustrate that everyone is capable of
  knowing the truth; however, when someone has known a skewed reality for so long, learning the truth
  can be as blinding and difficult to fathom as seeing the sun for the first time. To contemporary readers,
  this tale may seem archaic. Consider, however, a modern-day scenario that mirrors many of the same elements.
  Suppose a child is born into a commune run by a group of racial supremacists and raised into adulthood
  by those people. The child is taught only doctrines the adults support and is allowed to view only particular
  Internet sites and television shows that reinforce the group’s racist views. Like the prisoners in the
  cave, the child has been kept from the realities of the outside world. The prisoners in the cave know
  about the outside world only through shadows. Similarly, the child knows about the outside world only
  through stories told by the adults. In “The Allegory of the Cave,” one of the prisoners leaves the cave,
  experiences the outside world, and returns with truths discovered during the time away. This experience
  would be analogous to the now-grown child from the commune escaping, living in the real world, learning
  that the “truths” they had been taught were, in fact, falsehoods, and then returning to the commune
  to let others know about the discoveries.</p>

  <h3>LIVING BY THEIR OWN WORDS Thinking Through Allegory</h3>

  <p>(Socrates) And now, I said, let me show in a figure how far our nature is enlightened or unenlightened:—Behold!
  human beings living in an underground den, which has a mouth open towards the light and reaching all
  along the den; here they have been from their childhood, and have their legs and necks chained so that
  they cannot move, and can only see before them, being prevented by the chains from turning round their
  heads. Above and behind them a fire is blazing at a distance, and between the fire and the prisoners
  there is a raised way; and you will see, if you look, a low wall built along the way, like the screen
  which marionette players have in front of them, over which they show the puppets. Narration. This narration
  relates the dialogue between Socrates and Glaucon. Description. Throughout the excerpt, Socrates uses
  description to paint a picture of the changing life of humans moving from living underground in darkness
  to living above ground in light. Problem and Solution. Plato uses the problem-and-solution reasoning
  strategy to offer a way to solve people’s ignorance. The problem is how to get people who are uneducated
  (living in darkness) to know the truth (see the light) and accept it. The solution is to rise from the
  cave (use effort) and face the harsh light (attain knowledge) about truth (the idea of good).</p>

  <p>Simile. Here Socrates, the speaker, uses a simile to compare a low wall to a screen that is in front
  of marionette players.</p>

  <p>Plot Summary. Socrates shares with Glaucon an allegory that centers on a group of people who were
  born into captivity in a deep cave and have never seen daylight. Instead, they are chained in a position
  so that they can look only straight ahead at shadows that appear on a wall in front of them. Behind
  them is another wall with puppetlike images of people, animals, and trees; behind this wall is a fire.
  Another group of people manipulate the images, and the fire causes the images’ shadows to project onto
  the large wall in front of the prisoners. The stories acted out by these shadows are all that the prisoners
  ever see of the outside world.</p>

  <p>(Glaucon) I see.</p>

  <p>(Socrates) And do you see, I said, men passing along the wall carrying all sorts of vessels, and
  statues and figures of animals made of wood and stone and various materials, which appear over the wall?
  Some of them are talking, others silent.</p>

  <p>(Glaucon) You have shown me a strange image, and they are strange prisoners.</p>

  <p>(Socrates) Like ourselves, I replied; and they see only their own shadows, or the shadows of one
  another, which the fire throws on the opposite wall of the cave?</p>

  <p>Comparison and Contrast. Socrates compares Glaucon and himself to the prisoners in that they too
  can know only that which they see or experience; thus, they are similar to the prisoners in how they
  achieve knowledge.</p>

  <p>(Glaucon) True, he said; how could they see anything but the shadows if they were never allowed to
  move their heads?</p>

  <p>(Socrates) And of the objects which are being carried in like manner they would only see the shadows?</p>

  <p>(Glaucon) Yes, he said.</p>

  <p>(Socrates) And if they were able to converse with one another, would they not suppose that they were
  naming what was actually before them?</p>

  <p>(Glaucon) Very true.</p>

  <p>(Socrates) And suppose further that the prison had an echo which came from the other side, would
  they not be sure to fancy when one of the passers-by spoke that the voice which they heard came from
  the passing shadow?</p>

  <p>(Glaucon) No question, he replied.</p>

  <p>(Socrates) To them, I said, the truth would be literally nothing but the shadows of the images.</p>

  <p>(Glaucon) That is certain.</p>

  <p>Plot Summary. Glaucon agrees with Socrates that the prisoners would think the shadows on the wall
  represented real life and that the statues and figures of animals made of wood and stone are real.</p>

  <p>(Socrates) And now look again, and see what will naturally follow if the prisoners are released and
  disabused of their error. At first, when any of them is liberated and compelled suddenly to stand up
  and turn his neck round and walk and look towards the light, he will suffer sharp pains; the glare will
  distress him, and he will be unable to see the realities of which in his former state he had seen the
  shadows; and then conceive someone saying to him, that what he saw before was an illusion, but that
  now, when he is approaching nearer to being and his eye is turned towards more real existence, he has
  a clearer vision,—what will be his reply? And you may further imagine that his instructor is pointing
  to the objects as they pass and requiring him to name them,—will he not be perplexed? Will he not fancy
  that the shadows which he formerly saw are truer than the objects which are now shown to him?</p>

  <p>Cause and Effect. Here Plato uses the cause-and-effect reasoning strategy. The causes of the prisoners’
  ignorance are the restrictions placed on them in the cave. The effect of the restrictions is the prisoners’
  ignorance of reality, or lack of knowledge.</p>

  <p>(Glaucon) Far truer.</p>

  <p>(Socrates) And if he is compelled to look straight at the light, will he not have a pain in his eyes
  which will make him turn away to take refuge in the objects of vision which he can see, and which he
  will conceive to be in reality clearer than the things which are now being shown to him?</p>

  <p>Cause and Effect. Here Plato uses the cause-and-effect reasoning strategy. The effect of the prisoner
  looking directly at the light will be pain. The effect of the pain will be the prisoner’s turning away
  from the light.</p>

  <p>(Glaucon) True, he said.</p>

  <p>Plot Summary. Glaucon agrees that a prisoner would suffer if he were suddenly released from the chains
  that held him and were then shown the reality of how the shadows were made. He would suffer physical
  pain from being held stiffly and then suddenly allowed to move and would experience eyestrain from being
  exposed to real sunlight for the first time. He would suffer mental anguish and confusion as he struggled
  to accept that what he had seen previously was not real, so he would turn his vision to look at the
  things he believed to be real.</p>

  <p>(Socrates) And suppose once more, that he is reluctantly dragged up a steep and rugged ascent, and
  held fast until he is forced into the presence of the sun himself, is he not likely to be pained and
  irritated? When he approaches the light, his eyes will be dazzled, and he will not be able to see anything
  at all of what are now called realities.</p>

  <p>(Glaucon) Not all in a moment, he said.</p>

  <p>(Socrates) He will require to grow accustomed to the sight of the upper world. And first he will
  see the shadows best, next the reflections of men and other objects in the water, and then the objects
  themselves; then he will gaze upon the light of the moon and the stars and the spangled heaven; and
  he will see the sky and the stars by night better than the sun or the light of the sun by day?</p>

  <p>(Glaucon) Certainly.</p>

  <p>(Socrates) Last of all he will be able to see the sun, and not mere reflections of him in the water,
  but he will see him in his own proper place, and not in another; and he will contemplate him as he is.</p>

  <p>(Glaucon) Certainly.</p>

  <p>Plot Summary. Socrates then poses that the prisoner be dragged up a hill so high that he is near
  the sun. The bright sunlight would prevent him from seeing anything, including what he thought was real.
  In getting accustomed to the brightness of the light, the prisoner would first see the shadows, then
  reflections in the water, then actual objects, and finally the moon and other celestial beings. Socrates
  ends by stating that only after the prisoner takes these steps to accepting his new reality can he understand
  his place in this new world.</p>

  <p>(Socrates) He will then proceed to argue that this is he who gives the season and the years, and
  is the guardian of all that is in the visible world, and in a certain way the cause of all things which
  he and his fellows have been accustomed to behold?</p>

  <p>(Glaucon) Clearly, he said, he would first see the sun and then reason about him.</p>

  <p>(Socrates) And when he remembered his old habitation, and the wisdom of the den and his fellow-prisoners,
  do you not suppose that he would felicitate himself on the change, and pity them?</p>

  <p>(Glaucon) Certainly, he would.</p>

  <p>(Socrates) And if they were in the habit of conferring honors among themselves on those who were
  quickest to observe the passing shadows and to remark which of them went before, and which followed
  after, and which were together; and who were therefore best able to draw conclusions as to the future,
  do you think that he would care for such honors and glories, or envy the possessors of them? Would he
  not say with Homer, “Better to be the poor servant of a poor master,” and to endure anything, rather
  than think as they do and live after their manner?</p>

  <p>(Glaucon) Yes, he said, I think that he would rather suffer anything than entertain these false notions
  and live in this miserable manner.</p>

  <p>Plot Summary. Through a series of questions, Socrates asks if the prisoner would claim that the sun
  is what makes all things possible and if he would remember his life in the cave and feel sorry for the
  other prisoners who do not have this knowledge that he has. Socrates then quotes the Greek poet Homer,
  saying that the prisoner would think it is better to be poor and have knowledge than to be rich and
  know nothing. Glaucon agrees with what Socrates poses in all his questions.</p>

  <p>(Socrates) Imagine once more, I said, such an one coming suddenly out of the sun to be replaced in
  his old situation; would he not be certain to have his eyes full of darkness?</p>

  <p>(Glaucon) To be sure, he said.</p>

  <p>(Socrates) And if there were a contest, and he had to compete in measuring the shadows with the prisoners
  who had never moved out of the den, while his sight was still weak, and before his eyes had become steady
  (and the time which would be needed to acquire this new habit of sight might be very considerable),
  would he not be ridiculous? Men would say of him that up he went and down he came without his eyes;
  and that it was better not even to think of ascending; and if any one tried to loose another and lead
  him up to the light, let them only catch the offender, and they would put him to death.</p>

  <p>(Glaucon) No question, he said.</p>

  <p>(Socrates) This entire allegory, I said, you may now append, dear Glaucon, to the previous argument;
  the prison-house is the world of sight, the light of the fire is the sun, and you will not misapprehend
  me if you interpret the journey upwards to be the ascent of the soul into the intellectual world according
  to my poor belief, which, at your desire, I have expressed—whether rightly or wrongly God knows. But,
  whether true or false, my opinion is that in the world of knowledge the idea of good appears last of
  all, and is seen only with an effort; and, when seen, is also inferred to be the universal author of
  all things beautiful and right, parent of light and of the lord of light in this visible world, and
  the immediate source of reason and truth in the intellectual; and that this is the power upon which
  he who would act rationally either in public or private life must have his eye fixed.</p>

  <p>Metaphor. In two metaphors, Socrates says (1) the prison-house is the world of sight and (2) the
  light of the fire is the sun.</p>

  <p>Analogy. Plato compares the prisoners’ climb from the cave into the light of day to people learning
  reality.</p>

  <p>Plot Summary. In the end of this excerpt, Socrates tells Glaucon to consider the prisoner being returned
  to the dark cave. He asks Glaucon if the prisoner, after his eyes had previously adjusted to the light
  of day, would be scorned by the other prisoners for being unable to see underground now. Socrates then
  suggests that in the allegory, light represents knowledge and the journey from below ground to above
  ground represents the intellectual growth of the individual. Those who have little knowledge—dim light
  from a fire that can only cast shadows—know little of the real world and of truth. Thus, he suggests
  that the prisoners’ fear of the knowledge (of that which they do not comprehend rightly) is so profound
  that they would kill anyone who attempted to drag them out of the cave.</p>

  <h3>Discussion Questions</h3>

  <p>1. What purpose might Plato have had for using an allegory to impart his message?</p>

  <p>2. In his allegory, Plato compares the prisoners’ climb from the cave into the light of day to people
  learning what reality is. Explain the allegory and how the prisoners’ emerging from the cave is similar
  to learning that what they thought previously was not real.</p>

  <p>3. In this excerpt, written around 375 BCE, Plato begins a discussion about what education ought
  to do. In the 21st century CE, what do you think education ought to do?</p>

  <p>4. In the last paragraph, Plato says that “in the world of knowledge the idea of good appears last
  of all.” Think critically think about whether you agree with that statement. Then explain your stance.</p>

  <p>11.5 Writing Process: Reasoning Supported by Evidence</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Use organizational and reasoning strategies to
  compose texts that integrate the writer’s ideas with those from appropriate sources. • Implement varying
  language structures in the process of composing. • Develop flexible strategies for drafting and revising.</p>

  <p>In this section you will practice writing paragraphs that demonstrate your ability to use the reasoning
  strategies discussed.</p>

