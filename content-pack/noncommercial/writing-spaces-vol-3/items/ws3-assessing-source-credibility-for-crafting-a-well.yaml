  <p>Teacher Resources for Assessing Source Credibility for Crafting a WellInformed Argument by Kate Warrington,
  Natasha Kovalyova, and Cindy King</p>

  <p>Overview and Teaching Strategies</p>

  <p>This essay is ideally taught in preparation for collecting sources for research writing and provides
  a nice scaffold for students who have already engaged in some critical reading assignments or reading
  responses prior to being assigned a research writing assignment. The flow of activities was designed
  to support students in introductory composition, although the topic of source evaluation fits well at
  all levels, across the curriculum. Recognizing a widespread practice among college students to Google
  their topics, we have found it critical to introduce students to some concrete ways to evaluate all
  types of sources since we’ve found it to be unlikely (and impractical) to prohibit the use of Web sources.</p>

  <h3>Questions</h3>

  <p>1. How, if at all, do sources dealing with certain subjects and/or arguments call for a more rigorous
  scrutiny of credibility? For example, do those that are emotionally charged demand a closer look? Do
  sources in highly specialized fields require you to scrutinize the structure of their arguments more
  carefully?</p>

  <p>2. To what extent should you consider an author’s credentials when determining his or her knowledge
  of the field, and ultimately the credibility of the source? When, for example, might a source written
  by a layperson be as valuable as one by an expert in the field? How might you compare, for instance,
  an article on juvenile delinquency written by a legislator to one produced by a social psychologist?
  How might you treat a book written by a physician who is also a TV personality?</p>

  <p>3. Do certain subjects, purposes, and audiences allow for a less critical evaluation of bias? How,
  specifically, might you determine when sources use emotional appeals without bias?</p>

  <p>4. What further challenges do Internet sources pose when it comes to gauging their credibility? How,
  for example, can you evaluate credibility when a Web site’s content comes from an indeterminate source
  or multiple authors? 5. In what situations, if any, might you disregard credibility of a source? If
  a source lacks credibility according to your examination through critical reading, does it always mean
  you shouldn’t use it? How, if at all, might you use a source that lacks credibility in your essay?</p>

  <h3>Activities</h3>

  <p>The following are two class activities that can help students put to action the advice and steps
  for critical reading discussed in the essay.</p>

  <h3>Critical Reading Practice</h3>

  <p>To get students more comfortable with reading academic writing, have them practice these skills in
  small groups in a low-stakes environment. Hand out a short scholarly source (3 to 5 pages) on an accessible
  topic and give them time in class to read it. Then divide them into small groups and ask them to apply
  the seven questions presented in the essay to this source. Once they have done so, they present to the
  class their recommendation about whether the source is credible, and if they would or wouldn’t use it
  in their research paper. These presentations typically generate a vibrant class discussion.</p>

  <h3>Web source Evaluation Practice</h3>

  <p>Since most students feel comfortable using the popular Internet to find sources for their research,
  offer them an opportunity to work through credibility of Internet sources during small group work in
  class. Ask each small group to choose a topic (it can be a topic they plan to work with for their research
  paper) and conduct an Internet search for sources on that topic. Once they have located a source that
  they believe looks like it has good information, ask them to locate basic information like the author/
  sponsoring organization and publication date. In many cases, this information will be difficult to locate,
  which not only helps them to prepare for the challenges they may face citing Internet sources, but also
  helps them to take a second look at the credibility of Internet sources.</p>'
