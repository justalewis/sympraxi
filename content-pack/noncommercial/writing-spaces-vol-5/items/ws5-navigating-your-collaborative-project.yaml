  <p>Teacher Resources for Navigating Your Collaborative Project</p>

  <p>Overview and Teaching Strategies</p>

  <p>This essay is for students working in collaborative project settings for the first time, but it can
  also provide a refresher for those well versed in teamwork. For this reason, we recommend having students
  read this chapter as soon as (or, better yet, before) a collaborative project is assigned. However,
  your work as an instructor should begin even earlier. At the beginning of the semester, you should set
  the groundwork for your team project by providing students with ample opportunities to get to know one
  another and having them practice team skills on low stakes assignments, like inclass work or minor homework
  assignments. This preparation will allow students to begin building rapport with their team and test
  the collaborative waters well before they’re thrown into the deep end with a high stakes assignment.
  Scaffolded teamwork will help lead your students to a smooth and successful project.</p>

  <p>To this end, this chapter introduces fundamental collaboration skills that will prepare students
  to tackle a variety of team projects (both textual and multimodal) while providing resources on how
  to build rapport, communicate, set expectations, and create a product. To help students achieve these
  goals, we’ve included important discussion questions for students to consider when working in a team.
  These questions ask students to reflect on their work styles, areas of expertise and growth, expectations
  for their teammates, and more. Some of these conversations may be more challenging than others, especially
  the ones in which we invite students to examine their cultural values and access needs. Some students
  might find these reflective questions to be intimidating or may have difficulty in advocating for their
  access needs. As such, we think it’s important to set aside time for your students to answer these questions
  with their teams during class time or as a formal homework assignment.</p>

  <p>By the end of this chapter, students should feel more comfortable working in a team, acquire organizational
  strategies for navigating team projects, be able to draw upon different methods for communicating, and
  have ideas for different technology they can use to complete their projects.</p>

  <p>Below, we offer five questions that you can use to help facilitate a discussion around key concepts
  in the chapter and group work in general.</p>

  <h3>Discussion Questions:</h3>

  <p>1. Have you ever had to work in a team in the past? What do you wish you could have known before
  you started?</p>

  <p>2. What are some of your worries or concerns about working in a team? Did anything in the chapter
  help you feel more comfortable with the process? What do you still have questions about?</p>

  <p>3. What do you believe are some of the most important skills individuals need in order to make a
  team project successful? What are some expectations you would have of your teammates in a group project?</p>

  <p>4. Take some time to think through your strengths as an individual. What abilities do you have which
  may support your team? Now, consider the skills that you’d really like to develop. What areas would
  you want to improve on in a collaborative setting?</p>

  <p>5. Working with a team requires coordinating tasks on both a team and individual level. This chapter
  has provided some recommendations on how to coordinate work on a team level. Given these recommendations,
  how do you plan on managing your own tasks for the project?</p>'
