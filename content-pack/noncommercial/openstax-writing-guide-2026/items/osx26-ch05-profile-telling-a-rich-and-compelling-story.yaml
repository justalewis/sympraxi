body: '<p><em>Access for free at openstax.org.</em></p>

  <p>Profile: Telling a Rich and Compelling Story</p>

  <p>5</p>

  <h3>CHAPTER OUTLINE</h3>

  <p>5.1 Profiles as Inspiration 5.2 Profile Trailblazer: Veronica Chambers 5.3 Glance at Genre: Subject,
  Angle, Background, and Description 5.4 Annotated Sample Reading: “Remembering John Lewis” by Carla D.
  Hayden 5.5 Writing Process: Focusing on the Angle of Your Subject 5.6 Editing Focus: Verb Tense Consistency
  5.7 Evaluation: Text as Personal Introduction 5.8 Spotlight on … Profiling a Cultural Artifact 5.9 Portfolio:
  Subject as a Reflection of Self</p>

  <p>INTRODUCTION This chapter explores the process of profile writing. Writers compose these articles
  or essays to present some essential insight about the subject to the audience; subjects can span a wide
  variety of topics, including individuals, groups, places, and events. A good profile tells one clear,
  overarching story, chosen from other possible stories about the subject.</p>

  <p>Although the central purpose of a profile is to convey a sense of the subject’s significance, a profile
  may have a more specific goal. Profile writers may simply want to inform audiences about their subjects,
  or they may aim to inspire audiences with the examples their subjects provide, highlighting something
  overlooked or underappreciated about them. In all cases, though, the writer’s goal is to share a crucial
  insight about the subject with the audience. Profiles lie on a spectrum between two related forms: informal
  interviews and formal biographies. Like interviews, profiles usually depend on direct conversations
  with living people. Like biographies, they make use of other sources of information about the subject.
  Profiles such as those published in popular magazines are usually longer and more focused than interviews
  but considerably shorter than biographies. The material in this chapter will help you develop a profile
  that will show a new perspective on a subject of your choosing to inform and inspire your readers.</p>

  <h2>LEARNING OUTCOMES By the end of this section, you will be able to:</h2>

  <ul><li>Identify characteristics of profile writing. • Explain how the profile genre has developed.
  Beginning with its first issue in 1925, The New Yorker magazine has run a regular feature called "Profiles."
  The earliest of this series of biographical sketches combined the elements still in use for profiles
  today: anecdotes (brief stories), interview data, descriptions of the subject and their surroundings,
  and researched information to provide background and context. In the early 1950s, then senator John
  F. Kennedy (1917–1963) had an idea to develop a similar article about U.S. senators who had shown moral
  courage in the face of opposition. He asked one of his speechwriters, Ted Sorensen (1928–2010), to research
  examples of senators who had displayed this quality. As he researched, Sorensen found so much information
  that he suggested Kennedy write a book about these individuals.</li></ul>

  <p>Author/Wikimedia Commons, Public Domain)</p>

  <p>The 1956 volume, titled Profiles in Courage, spotlights eight senators who took unpopular stances
  against majority consensus; subjects range from John Quincy Adams (1767–1848) to Robert A. Taft (1889–1953).
  Many of the profiled senators lost political power as a result of their actions. The John F. Kennedy
  Library Foundation later established the Profile in Courage Award, given to “a public official (or officials)
  at the federal, state, or local level whose actions demonstrate the qualities of politically courageous
  leadership” (“About the Award (https://openstax.org/r/abouttheaward)”). Kennedy’s book established a
  connection between the profile genre and the idea of courage, and other writers have continued drawing
  on this connection.</p>

  <p>One such writer is Veronica Chambers, this chapter’s trailblazer. In her book Resist: 40 Profiles
  of Ordinary People Who Rose Up against Tyranny and Injustice, Chambers includes profiles of individuals
  who displayed uncommon and often unpopular courage. Although profile pieces do not always focus on courageous
  people as subjects, that particular focus can provide a strong angle—a viewpoint or lens—for profile
  writing. Like Kennedy and Chambers, profile writers often communicate admiration for some attribute
  that their subject displays, whether courage or another quality that might provide an example to others.</p>

  <p>Although other types of writing can inspire readers to develop admirable qualities, profiles do so
  particularly well. They are generally short enough to read in one sitting and strongly focus on one
  main idea for readers to absorb. They are compelling because they combine elements of both storytelling
  and reporting. Profiles of people who embody certain ideals or principles can provide models for readers
  to become better at living up to those principles.</p>

  <h2>Profile Trailblazer: Veronica Chambers</h2>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Read for inquiry, learning, critical thinking,
  and communicating in varying rhetorical and cultural contexts. • Determine how genre conventions are
  shaped by purpose, culture, and expectation. • Comment on the interplay among author, subject, and audience.</p>

  <p>“There is not a story where the oppressor wins forever.”</p>

  <p>You may know Veronica Chambers (b. 1970) from having read Mama’s Girl, her 1996 memoir about being
  raised in Brooklyn by her mother, who had immigrated with her from Panama. You may have seen one of
  the many books that Chambers has coauthored, such as Yes, Chef with Marcus Samuelsson, published in
  2013; Make It Messy, also with Marcus Samuelsson, published in 2015; or Thirty two (32) Yolks, with
  Eric Ripert, published in 2016. Building on these successes, Chambers—who has served as senior editor
  at several major publications, including Glamour, Newsweek, and the New York Times Magazine—has recently
  focused on developing an array of young adult books highlighting the voices and histories of marginalized
  people, mainly Black women. In the expanded paperback edition of Resist: 40 Profiles of Ordinary People
  Who Rose Up against Tyranny and Injustice, published in 2020, Chambers delves into the profile genre,
  covering a variety of well-known and influential subjects dating from as early as 1429 to the present
  day. While many of her subjects are Black American women, such as civil rights activist Fannie Lou Hamer
  (1917–1977) and Georgia politician Stacey Abrams (b. 1973), the collection includes people from around
  the world and from different cultures, among them Indian leader Mohandas Gandhi (1869–1948), German
  industrialist Oskar Schindler (1908–1974), and</p>

  <p>South African singer Miriam Makeba (1932–2008). In every chapter, Chambers uses the profile genre
  to highlight one key aspect of each of her subjects’ lives.</p>

  <h3>Paying Attention to the Subject’s Voice</h3>

  <p>Profiles aim to help readers better understand their subject by focusing on one major idea. When
  the subject is a person, readers can better understand that person by reading their spoken or written
  words. Chambers uses this technique throughout her book. In the first chapter, Chambers tells the story
  of French heroine Joan of Arc (c. 1412–1431), centering on the idea that individuals are born for a
  purpose. Readers can better understand Joan of Arc’s singlemindedness because of the chapter’s epigraph
  (quotation provided at the beginning of a written piece that indicates how readers should approach the
  text), attributed to the subject: “I am not afraid.… I was born to do this” (Chambers, Resist 9). The
  profile itself offers an additional direct quote: “All battles are first won or lost in the mind”(10).
  Other chapters, such as those profiling Italian astronomer Galileo Galilei (1564–1642) and former South
  African president Nelson Mandela (1918–2013), also begin with the subject’s words in an epigraph or
  employ both strategies—epigraph plus direct quotes within the profile. (You may choose to use either
  or both of these strategies in your profile as well.)</p>

  <h3>Recognizing the Author’s Voice</h3>

  <p>Profile writers may choose to include themselves in the piece, referring to their own experiences
  and interactions with the subject. In this collection, Chambers instead speaks in her own voice in the
  “resist lesson” at the end of each chapter. These “resist lessons” distill each profile’s focus into
  a short phrase, such as “We must speak for the voiceless” (the lesson for the profile of Mexican revolutionary
  Emiliano Zapata, 1879–1919) and “Honor the hands that harvest your crops” (the lesson for the combined
  profile of American labor leaders Dolores Huerta (b. 1930) and Cesar Chavez, 1927–1993).</p>

  <p>Negotiating among Author’s Voice, Subject’s Voice, and Genre Expectations</p>

  <p>The profile genre enjoys considerable variety. While Chambers does not include her own experiences
  in this collection, other writers do insert themselves into the profiles they write. Yet even without
  first-person commentary, Chambers clearly communicates her opinions of the subjects with her word choices
  and “resist lessons.” Either choice—including the author directly in the text or not—can be appropriate,
  depending on the rhetorical situation.</p>

  <h3>Discussion Questions</h3>

  <p>1. Now that you have read the information provided in the chapter thus far, what do you think are
  the differences between a profile and a memoir or biography?</p>

  <p>2. Why might you include or exclude your own voice or experiences in the profile you write?</p>

  <p>3. Given that many of her subjects are historical figures, how do you think Chambers found the information
  for the profiles included in her book? How would research on someone who lived in the past differ from
  research on a living person?</p>

  <p>4. How is the profile genre uniquely suited to showcase the idea of courage or some other admirable
  trait?</p>

  <p>5. What profiles have you encountered that have inspired you? How have they done so? If you haven’t
  read any inspiring profiles, what subjects—people, places, or events—would you like to see profiled?
  Why?</p>

  <p>5.3 Glance at Genre: Subject, Angle, Background, and Description</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Identify elements of the profile genre. • Identify
  research methods for writing profiles.</p>

  <p>Profile writing are articles or essays in which the writer focuses on a specific trait or behavior
  that reveals something essential about the subject. Much profile material comes from interviews either
  with the subject or with people who know about the subject. However, interviews may not always be part
  of a profile, for profile writers also draw on other sources of information. In creating profiles, writers
  usually combine the techniques of narrative, or storytelling, and reporting, or including information
  that answers the questions of who, what, when, where, why, and how.</p>

  <h3>Potential Profile Subjects and Angles</h3>

  <p>You can find profile subjects everywhere. The purpose of a profile is to give readers an insight
  into something fundamental about the subject, whether that subject is a person, a social group, a building,
  a piece of art, a public space, or a cultural tradition. Writers of profiles often conduct several types
  of research, including interviews and field observations, as well as consult related published sources.
  A profile usually reveals one aspect of the subject to the audience; this focus is called an angle.
  To decide which angle to take, profile writers look for patterns in their research, then consider their
  audience when making choices about both the angle and the tone, or attitude toward the subject.</p>

  <h3>Defining Terms and Writing in the Genre</h3>

  <p>These terms, or genre elements, are frequently used in profile writing. The following definitions
  apply specifically to the ways in which the terms are used in this genre.</p>

  <ul><li>Anecdotes: brief stories about specific moments that offer insights into the profile subject.
  • Background information: key to understanding the profile’s significance. Background information includes
  biographical data and other information about the history of the profile subject. It often helps establish
  context as well. • Chronological order: information or a narrative presented in time order, from earliest
  to most recent. • Context: the situation or circumstances that surround a profile subject. Situating
  profile subjects within their contexts can offer deeper insights about them. • Factual information:
  accurate and verifiable data and other material gathered from research. • Field notes: information gathered
  and recorded by observing the profile subject within a particular environment. • Location: places relevant
  to the profile subject. For a person, location might include birthplace, place of residence, or place
  where events occurred. • Narrative structure: text organized as narratives, or stories, weaving research
  into the story as applicable. • Quotation: words spoken or written by the subject or from interviews
  about the subject. • Reporting structure: structure that relays factual information and answers who,
  what, when, where, why, and how questions. • Show and tell: descriptive and narrative techniques to
  help readers imagine the subject combined with reporting techniques to relay factual information. •
  Spatial structure: used in profiles of buildings, artworks, and public spaces. This structure reflects
  a “tour” of the space or image. • Thick description: combination of sensory perceptions to create a
  vivid image for readers. • Tone: the writer’s attitude toward the subject. For example, tone can be
  admiring, grateful, sarcastic, disparaging, angry, respectful, gracious, neutral, and so on. • Topical
  structure: structure that focuses on several specific topics within the profile.</li></ul>

  <p>5.4 Annotated Sample Reading: “Remembering John Lewis” by Carla D. Hayden</p>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Determine and articulate how conventions are shaped by purpose, language, culture, and expectation.
  • Analyze and evaluate relationships between ideas and patterns of organization in the profile genre.</li></ul>

  <p>Introduction</p>

  <p>LIVING BY THEIR OWN WORDS The Power of "Good Trouble"</p>

  <p>Angle and Choice of Subject. Hayden signals her profile’s angle in the title, linking Lewis’s signature
  phrase “good trouble” with the idea of power. Additionally, important dates—deaths, current events,
  or anniversaries of such happenings—often provide the incentive for writing profiles.</p>

  <p>Few people that you meet truly rouse the best in you. They are walking heroes, living historymakers.
  Their words and deeds have a thunderous impact on your soul. Congressman John Robert Lewis was such
  a person for me. I join the world in mourning the passing of this civil rights legend. Writer’s Voice.
  Hayden chooses to insert her own voice and experience to connect with her readers. She also expands
  on the theme of “power” introduced in the title, using words and phrases such as heroes, historymakers,
  thunderous impact, and legend. Tone. The words she uses to describe Lewis indicate a tone of respect
  and admiration. The son of a sharecropper growing up in rural Alabama, he said as a little boy he was
  in constant fear because of signs that said “no colored boys, no colored girls.” His parents and grandparents
  used to tell him “don’t get in trouble.” Nevertheless, as a young man he was inspired to activism by
  the Montgomery Bus Boycott that started when Rosa Parks refused to give up her seat.</p>

  <p>Structure. This paragraph features a chronological structure, beginning with Lewis’s childhood and
  creating a timeline from there to the beginning of his activism.</p>

  <p>Theme and Background. This paragraph also introduces the idea of “trouble,” which drove Lewis’s ideas
  about how to behave. Thus, it provides necessary background information for the points that follow,
  giving context for Lewis’s catchphrase of “good trouble.”</p>

  <p>This past December, the Library of Congress opened an extensive exhibition, “Rosa Parks: In Her Own
  Words,” where the congressman spoke. “Rosa Parks inspired us to get in trouble. And I’ve been getting
  in trouble ever since,” said Lewis. “She inspired us to find a way, to get in the way, to get in what
  I call good trouble, necessary trouble.” Over the years, he was able to meet and work with Rosa Parks
  who taught him about the philosophy and discipline of non-violence. “She kept on saying to each one
  of us, you too can do something,” he said. “And for people if you see something that is not right, not
  fair, not just, do something. We cannot afford to be quiet.” You can hear Lewis himself discuss the
  legacy of Parks (https://openstax.org/r/legacyofparks).</p>

  <p>Theme, Quotations, Audience. This paragraph continues the theme of “trouble,” redefining the idea
  now in Lewis’s terms. The paragraph also continues the theme of power. This paragraph focuses almost
  entirely on quoted material from Lewis, giving readers a direct connection to his voice. The embedded
  video allows readers to see and hear Lewis speaking, reinforcing this strategy. Lastly, Hayden refers
  to an event at the Library of Congress; this event is relevant to readers of the Library of Congress
  blog.</p>

  <p>During the exhibition opening, John Lewis told how he was inspired by Rosa Parks to write to Dr.
  Martin Luther King Jr. He was given a round trip bus ticket to Montgomery to meet with Dr. King and
  upon meeting him was nicknamed, “The Boy from Troy.”</p>

  <p>Location. Hayden places Lewis in different locations; the mention of a location-specific nickname
  personalizes him further. Hayden also places Lewis at pivotal civil rights events.</p>

  <p>Audience. This final placement of Lewis in the Library of Congress on several occasions is an effective
  choice to connect with readers of the Library of Congress blog.</p>

  <p>He risked his life countless times by organizing voter registration drives, sit-ins at lunch counters
  and was beaten and arrested for challenging the injustice of Jim Crow segregation in the South. While
  still a young man, John Lewis was already a nationally recognized leader and was named one of the Big
  Six leaders of the Civil Rights Movement. He was also the chairman of the Student Nonviolent Coordinating
  Committee (SNCC), and his papers and interviews from this time are held at the Library of Congress.
  At the age of 23, he was a keynote speaker at the historic March on Washington in 1963.</p>

  <p>Factual Information, Background, and Context. This paragraph offers a series of facts to back Hayden’s
  points. It also provides more background and context for Lewis’s later political efforts. This information
  is common knowledge, repeated in a variety of credible sources. Hayden takes care to note that Lewis’s
  papers are housed at the Library of Congress, a relevant detail for her audience.</p>

  <p>On March 7, 1965, John Lewis led more than 600 peaceful protestors across the Edmund Pettus Bridge
  in Selma to demonstrate the need for voting rights in the state of Alabama. They were greeted by brutal
  attacks by Alabama State Troopers that became known as “Bloody Sunday.”</p>

  <p>Anecdote and Context. This paragraph offers a brief anecdote about a defining moment of Lewis’s life,
  thus strengthening the power of the story and communicating the context of Lewis’s early activism.</p>

  <p>Despite numerous arrests and physical injuries, John Lewis remained a devoted advocate of the philosophy
  of nonviolence. He was elected to the Atlanta City Council and then the representative of Georgia’s
  Fifth Congressional District. He stuck to Rosa Parks’ advice to never be quiet and to continue getting
  into “good trouble.”</p>

  <p>Angle and Secondary Research. This paragraph continues the writer’s angle of “good trouble” and offers
  information from secondary sources.</p>

  <p>The congressman was a frequent guest at the Library of Congress. His generous spirit touched everyone
  he met in the halls of the Library—whether it was reading his graphic novel “March” or speaking at public
  events—his gentle temperament kept you at ease. His graphic novel allowed him to continue to connect
  with a new generation of young readers in the hope of inspiring them the way Rosa Parks had inspired
  him.</p>

  <p>Angle, Context, and Field Research. In this paragraph, Hayden implies that part of Lewis’s power
  came from his generosity and gentle temperament. She also shows readers that Lewis understood his work
  in the context of Parks’s achievements and that he hoped to provide the same context for activists who
  followed him. Instead of providing direct quotes, Hayden offers details that come from field research.</p>

  <p>In November, John Lewis celebrated the AIDS Memorial Quilt collection arriving at the Library of
  Congress. His message of peaceful resolve, perseverance and care still rings loud. “In the height of
  the civil rights movement, we spoke of love,” Lewis said. “On one occasion Dr. King said to some of
  us, just love everybody. Love them who fail to love you, just love. Just love a little hell out of everybody.”</p>

  <p>Quoted Material and Field Research. Using Lewis’s own words supports both his commitment to nonviolence
  and Dr. King’s playfulness with language. Hayden was likely present at the event when Lewis spoke; videos
  of and articles about the event corroborate her report.</p>

  <p>The world mourns. But we also celebrate a great warrior and fighter of injustice. Let us remember
  his story and listen to the words he passionately shared for more than a half a century. Congressman
  John Robert Lewis embodies the best in all of us. Let his legacy and spirit live on. I offer my prayers
  and condolences to his family and to the grateful people of his district in Georgia.</p>

  <p>Theme and Angle. Hayden ends by reconnecting to the themes that run through the profile. In returning
  to these themes, Hayden confirms and completes the angle of this profile.</p>

  <h3>Discussion Questions</h3>

  <p>1. How does the title both focus the scope and signal the angle of this blog post?</p>

  <p>2. How effective is Hayden’s angle in this piece? Provide evidence for your assessment.</p>

  <p>3. In what ways might Hayden, as librarian of Congress, have developed this profile further or differently?</p>

  <p>4. How might you revise this piece to fit into a “profiles in courage” collection targeted at a more
  general audience?</p>

  <p>5. How do the first and last paragraphs work differently from the other paragraphs in the text? How
  do Hayden’s choices for these paragraphs affect the cohesiveness of the profile she has written?</p>

  <p>5.5 Writing Process: Focusing on the Angle of Your Subject</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Plan a research calendar. • Conduct primary research,
  including field observations and interviews. • Conduct secondary research, drawing on credible academic
  and popular sources. • Compose an email that meets professional standards of the genre. • Synthesize
  research findings using elements of the profile genre to create a written profile. • Give and receive
  constructive feedback in peer review exercises. • Revise a draft in response to feedback.</p>

  <p>Now that you are familiar with the structure and content of profiles, you are ready to write one
  of your own. This section will show you how to apply the ideas and genre elements presented earlier
  in this chapter to develop your profile essay.</p>

  <h3>Summary of Assignment: A Profile in Courage or Other Admirable Trait</h3>

  <p>For this assignment, you will develop an essay that profiles the courage—or another admirable aspect—of
  someone or something associated with your college campus. You will create a profile of a person, group,
  place, or event that exemplifies the admirable aspect as you define it. For your profile, you will conduct
  the specific kinds of research done by profile writers: interviews, field research, and secondary research
  from credible sources.</p>

  <p>Once you have compiled your research, you will decide on the focus and angle of your piece, then
  plan and develop your draft. You will also participate in peer review to receive guidance for any needed
  revisions. Throughout the process, you will focus on developing an essay that shows readers how your
  subject exemplifies the admirable trait you have chosen.</p>

  <p>Another Lens. Another option for this assignment is a group writing project for your class or smaller
  groups within the class. Your instructor will decide whether the project will be completed by the whole
  class or smaller groups. With your peers, you will write a collaborative profile in courage of your
  class or group as a whole, showing how you all exemplify courage together. All students will contribute
  anecdotes about courage from their own lives in addition to conducting all other research on which profiles
  are based. The class or group will then work together to organize, draft, revise, edit, and proofread
  the collective composition.</p>

  <h3>Defining the Admirable Trait</h3>

  <p>Before beginning your profile, choose the admirable trait on which you will focus, and then create
  your own definition of it. This definition will help you select your subject and focus your research.
  Consider including the definition in your final product as well.</p>

  <p>First, to decide on the trait, follow these steps:</p>

  <ul><li>Set a timer for five minutes. During that time, write or record a comprehensive list of traits
  you admire in other people. Include a wide range of possibilities, such as “humor,” “generosity,” “patience,”
  and so on. To generate a robust list, think also of the people you admire, and then pinpoint the attributes
  you admire about them.</li><li>Consider all of the traits you have listed, and select one to focus on
  for this project.</li></ul>

  <p>Next, use one or more of the following methods to begin defining the aspect of the subject that you
  admire:</p>

  <ul><li>Think about the admirable trait you have chosen, and write down a few words or phrases that
  you associate with it.</li><li>Assemble a collage of images that make you think of the admirable trait.
  • Write brief notes about moments when you have personally shown the trait you are focusing on—or about
  times you have seen others exhibit this trait.</li></ul>

  <p>Looking at all of these notes, write your personal definition of the admirable trait. Your draft
  definition will probably evolve as you develop your profile. If so, great! That means you have been
  thinking more about the idea. Here is a sample definition of an admirable trait: Kindness is grace in
  action; it shows itself when people are willing to truly listen to others and to understand the world
  from another vantage point. People embody kindness when they choose to respond gently rather than angrily
  or when they help others without complaining.</p>

  <h3>Choosing a Subject</h3>

  <p>Now that you have a working definition of the trait you are using to focus your profile, you can
  choose your subject. Members of the campus community are usually willing subjects: professors, librarians,
  resident assistants, alumni, staff, and coaches, to name a few. You might also consider buildings, public
  spaces, or public art on campus. In addition, the local community may contain potential subjects—for
  example, business owners, city administrators, and other local individuals, groups, or events peripherally
  associated with your school. Also consider discussing your project with an archivist if one is available
  on campus or in your community; these specialist librarians always have interesting subjects to recommend
  for research. Follow these steps to choose a subject:</p>

  <ul><li>Jot down notes about intriguing buildings, public spaces, pieces of public art, people, events,
  and groups on or near campus.</li><li>Do a quick online search—perhaps on the campus website—to see
  what information is available about several potential subjects that most intrigue you. Remember that
  this research is simply to narrow your options; you will conduct more careful and thorough research
  after making your final choice.</li><li>Having gathered preliminary information, think about which potential
  subject best connects to the definition of the admirable trait you have developed. Also, think about
  which subject most interests you.</li></ul>

  <p>Now weigh the factors you have considered here, and choose the subject you would most like to pursue.
  If you are having trouble choosing between two subjects, discuss your options with your instructor or
  with someone in the campus writing center. Once you have chosen a subject, you can plan your research.
  You will need to schedule interviews, field observations, and time for secondary research before you
  begin organizing your findings and drafting your paper.</p>

  <h3>Preparing to Write: Conducting Research</h3>

  <p>Profile writers learn as much about their subjects as possible. Be sure to take advantage of all
  available sources of information, and follow up on new leads wherever you find them. After completing
  your research, you will be able to refine your angle and draft your piece. As you gather your research,
  keep your target audience in mind, and look for details about your subject that will interest them.
  For example, Carla D. Hayden included information about events in which John Lewis participated at the
  Library of Congress. These details would interest Library of Congress blog readers, the audience for
  this piece. You will need to complete three kinds of research for your profile: interviews, field research
  and secondary research; see The Research Process: Where to Look for Existing Sources and The Research
  Process: How to Create Sources. These types of research are outlined in Table 5.1 for efficient planning
  and discussed in detail below.</p>

  <h3>Plan Your Research Calendar Interviews</h3>

  <ul><li>If you can speak to your subject, find their contact information. • If you cannot speak directly
  to your subject, make a list of professionals with knowledge about your subject, and decide which person
  to contact first. One or two interviews should provide enough information for this assignment. • In
  either case, compose a professional email (see below) to respectfully ask for a brief phone call, video
  conference, or in-person meeting. Send these emails as soon as you have chosen your subject so that
  you have time to schedule the interview before you begin drafting.</li></ul>

  <p>Field Research • If your subject is a person, send a professional email (see below) to ask when you
  might observe them doing their job. • If your subject is not a person, decide when to be in the space
  to make your field notes. Be sure to obtain any needed permission to be in the space. • In both cases,
  set aside 30 minutes to an hour to make your field notes, using thick description (explained below).</p>

  <p>Secondary Research • Set aside time for several research sessions to find credible information about
  your subject. Refer to Chapters Research Process: Accessing and Recording Information and Annotated
  Bibliography: Gathering, Evaluating, and Documenting Sources for research guidance. • If you have trouble
  finding the information you need, contact one of your research librarians; they would be happy to help.</p>

  <h3>Professional Email Standards</h3>

  <p>Before you begin to do research, you will need to contact people via email about setting up interviews
  or gathering other necessary information. To come across as a credible researcher, follow professional
  email protocol when contacting subjects for interviews or other information. Subjects will take you
  and your requests far more seriously when you follow the protocols in Table 5.2.</p>

  <p>Professional Email Take care to use professional email etiquette when contacting potential interview
  subjects.</p>

  <ul><li>Subject Line. Your subject line, like an essay title, should represent your main point.</li><li>Salutation.
  Open with a polite greeting; use the Subject: Interview Request person’s title or honorific (such as
  Mr., Ms., Mrs., or Dr.).</li><li>Introduction. Introduce yourself to the person. Dear Dr. Kamau, Your
  name will appear in the signature line; here, offer information that shows the relationship you have
  to the request. • Statement of Purpose. State your purpose clearly.</li></ul>

  <p>I am a student in Dr. Liu’s first-year composition class, and I am researching the English Language
  Institute (ELI) on campus in order to write a profile on tenacity in relation to the ELI.</p>

  <p>I am writing to ask for a brief interview with you to find out more about the ELI.</p>

  <ul><li>Statement of Request. Make a polite request.</li></ul>

  <p>Would you have 15 minutes within the next week to speak with me by phone or videoconference?</p>

  <p>I hope to hear from you soon.</p>

  <ul><li>Next Steps. Say what you would like to happen next.</li><li>Closing. Include a polite closing
  line, use a professional complimentary close, and type your full name.</li></ul>

  <p>Thank you for considering this request. [Best, Regards, Sincerely, Yours] Sylvia Varela</p>

  <p>Interviews</p>

  <p>Talking with your subject—or a professional who knows a great deal about your subject—is often the
  best place to start your research. Interviews generally fall into the category of primary research,
  or research you collect directly for yourself. Try to interview your profile subject directly if the
  subject is a person. You also may find interviews with or about your subject that journalists have completed
  and published, though these would not be primary research. If you are unable to interview your subject
  directly, try to interview someone who has credible information about your subject; such interviews
  would be primary research as well. People who know, live, and work with your subject can provide additional,
  helpful background information. Try to set up a few short interviews with these people to deepen your
  insights.</p>

  <p>The easiest way to conduct an interview is to schedule a brief, informal conversation in a comfortable
  setting. For a successful interview, have questions prepared and be ready to take notes as you talk.
  Following in Table 5.3 are sample questions you might ask. To add to this list, think about your preliminary
  research as well as the definition of the admirable trait you are using for your profile.</p>

  <p>Note that you will need to cite any interviews you conduct, both within the text and in the Works
  Cited list. The Works Cited entry for an interview will read as follows:</p>

  <p>[Last name of interviewee], [First name of interviewee]. Personal interview. Day Month (abbreviated)
  Year.</p>

  <p>Interview Planning Worksheet</p>

  <p>If you are interviewing your subject:</p>

  <ul><li>What have you been doing or thinking about recently?</li><li>What about your work/hobby/area
  of focus is most interesting to you?</li><li>What aspect of your work/hobby/area of focus has surprised
  you?</li><li>What do you wish people knew about your work/ hobby/area of focus?</li><li>How might you
  define [the admirable trait]? • How do you see the idea of [the admirable trait] relating to your work/hobby/area
  of focus? • As I was preparing for this interview, I learned</li></ul>

  <p>&lt;WOL&gt;. Could you tell me more about that?</p>

  <p>If you are interviewing someone about your subject:</p>

  <ul><li>How did you learn about this subject? • What is the most fascinating part about this subject
  for you? • What should people know about this subject that may be overlooked? • How might you define
  [the admirable trait]? • Do you see the idea of [the admirable trait] relating to this subject? If so,
  how? • As I was preparing for this interview, I learned</li></ul>

  <p>&lt;WOL&gt;. Could you tell me more about that?</p>

  <h3>Thick Description</h3>

  <p>Another form of primary research is field observation. If at all possible, observe your subject in
  their element—watch them (with permission!) during their workday, spend an extended period of time in
  a related space, or watch available videos of your subject. In all cases, take thorough and detailed
  notes to create a thick description, or a careful record of every sensory detail you can capture—smells,
  sounds, sights, textures, physical sensations, and perhaps tastes. This thick description can provide
  meaningful details to illuminate the points in your piece. Meticulously record all sensory information
  about your subject and their setting, writing in-depth notes about what you see, smell, hear, feel,
  and taste. Remember to use words that express size, shape, color, texture, and sound. If you are taking
  notes on a person, describe their clothing, gestures, and physical characteristics. At the same time,
  take note of the interview setting. If the interview takes place in a neutral space, the setting can
  provide a backdrop for the profile. If the interview setting is a person’s room or apartment, record
  the details that tell the most about your subject’s special interests. If you are not used to taking
  these kinds of notes, practice doing so by following the steps in Table 5.4.</p>

  <p>Practice Field Notes and Thick Description Practice creating field notes with a peer. Take about
  10 minutes to record as much sensory information as possible.</p>

  <ul><li>What do you hear, close by and farther away? • What do you feel? Are there specific textures
  in your surroundings? • What do you smell? What seems to be the source of the smells? • Can you taste
  anything? • What do you see? Describe the space as well as your peer (without judgment). When the 10
  minutes are up, discuss the experience with your peer. Use these techniques to enliven the points you
  make in your profile.</li></ul>

  <p>You will also need to cite your field notes, both within the text and in the Works Cited list. The
  Works Cited entry for the field notes should be arranged according to this model: [Your last name],
  [Your first name]. Field notes. [Name of the department you are affiliated with], [Name of your university],
  Day Month (abbreviated) Year. Raw data. Secondary Research and Other Written and Published Information
  Profile writers supplement their primary research findings through secondary research, or research that
  others have completed and published. Ensure that any supplemental information you use comes from credible
  sources; these include peer-reviewed journals for academic sources and well-established, highly regarded
  organizations for public, nonacademic ones. Keep careful records of this research so that you can cite
  each source appropriately. Use the tools available from the Modern Language Association (https://openstax.org/r/modernlanguage)
  and in Research Process: Accessing and Recording Information and Annotated Bibliography: Gathering,
  Evaluating, and Documenting Sources for guidance in researching and managing source material. For more
  details on citing sources, see MLA Documentation and Format and APA Documentation and Format. Additionally,
  ask your subject for their résumé and any writing samples they may have developed. While this type of
  research may not be available about your subject, as many ordinary people have not published anything,
  find and read any existing publications by or about your subject. Additionally, you can focus your secondary
  research on information related to your subject rather than about your subject specifically. For example,
  Carla D. Hayden, in writing the profile of John Lewis, could have researched Bloody Sunday more generally,
  or she could have found secondary research about the AIDS quilt to which she refers. To see how authors
  can use such secondary research, read the sample of student work later in this section as well as the
  blog post in Spotlight on . . . Profiling a Cultural Artifact. Synthesizing Research After you have
  completed your research, the next step is to synthesize it, or put it all together. You can simplify
  this task by filling in a graphic organizer such as Table 5.5 with your findings and potential angles
  you might take in your profile.</p>

  <p>Source</p>

