  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Identify common formats and design features for different kinds of texts. • Implement style
  and language consistent with argumentative research writing while maintaining your own voice. • Determine
  how genre conventions for structure, paragraphing, tone, and mechanics vary. When drafting, you follow
  your strongest research interests and try to answer the question on which you have settled. However,
  sometimes what began as a paper about one thing becomes a paper about something else. Your peer review
  partner will have helped you identify any such issues and given you some insight regarding revision.
  Another strategy is to compare and contrast your draft with the grading rubric similar to one your instructor
  will use. It is a good idea to consult this rubric frequently throughout the drafting process.</li></ul>

