body: '<p>Academic Writing and the Myth of Standard English</p>

  <p>Kristin DeMint Bailey, An Ha, and AJ Outlar</p>

  <p>Overview</p>

  <p>In this chapter, a community college writing professor and two of her first-year writing students
  collaboratively address the issue of Whiteness in academic writing.1 Specifically, we challenge the
  notion that academic language is neutral as well as the expectation that all academic writers should
  strive for uniformity. We question notions of correctness and clarity, adopting Jacqueline Jones Royster’s
  definition of voice as “the power and authority to speak and make meaning” (31), and we challenge students
  to ask hard questions about language, identity, and power. We explain the inextricable bonds between
  language and community, examine the connections between language and racial identity, and explore the
  political nature of language, all of which affect a person’s voice as Royster has defined it. Then,
  the two of us who are students share our experiences with writing for school, reflecting on what we’ve
  learned both in and out of school about our language and our voice. Together, we invite students to
  reflect on their own voice in academic writing, asking themselves, “Whose voice do I hear in my writing,
  and why? What does this voice reveal about my identity as a writer, and how do I feel about what I uncover?
  What might I want to do more or differently?”</p>

  <p>. . . survival is not an academic skill. It is learning how to stand alone, unpopular and sometimes
  reviled, and how to make common cause with those others identified as outside the</p>

  <p>1. This work is licensed under the Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International
  License (CC BY-NC-ND 4.0) and is subject to the Writing Spaces Terms of Use. To view a copy of this
  license, visit http://creativecommons. org/licenses/by-nc-nd/4.0/, email info@creativecommons.org, or
  send a letter to Creative Commons, PO Box 1866, Mountain View, CA 94042, USA. To view the Writing Spaces
  Terms of Use, visit http://writingspaces.org/terms-of-use.</p>

  <p>structures in order to define and seek a world in which we can all flourish. It is learning how to
  take our differences and make them strengths. For the master’s tools will never dismantle the master’s
  house. They may allow us temporarily to beat him at his own game, but they will never enable us to bring
  about genuine change.”</p>

  <p>—Audre Lorde, The Master’s Tools Will Never Dismantle the Master’s House</p>

  <p>Introduction</p>

  <p>In school, we’re often asked to write using strict formats and formal language. Writing isn’t about
  personal expression or style; it’s about mastering “standard English,” “edited American English,” “formal
  English”—whatever you call it. It’s about communicating ideas and showing others (usually teachers,
  sometimes classmates, sometimes ourselves) what we know and understand about whatever it is we’re studying.
  And for many of us (if we’re being honest), it’s about sounding smart—writing the right things in the
  right ways to show that we belong, that we’re capable of doing the work. Because ultimately, we need
  people to know we’re capable so we can pass our classes and get that diploma.</p>

  <p>Our success, as we all know, is usually determined by how well we meet the standards that have been
  indoctrinated into us through feedback and grades for most of our lives. We accept those standards as
  the ideal because we see them played out in the texts we’re assigned to read. We believe that good academic
  writing is complicated and abstract, that it uses words we don’t know or hear very often, that it is
  objective and neutral and essentially personality-less. We believe that academic writing doesn’t have
  a voice.</p>

  <p>Oh, but it does. Many people don’t notice a voice in academic writing because the voice that is there
  has been normalized and disembodied. In other words, when people talk about “academic” writing, they
  don’t talk about the people who are doing that writing, who set those standards. Those standards, we
  think, simply reflect “correct” language usage, which we think is just how things are. Consider this:
  How often do you think about what the speaking voice of the person writing the academic texts you’re
  reading sounds like? How often do you think about what that person looks like? Regardless of whether
  you notice a voice in academic writing, however, that voice is still there. And because this is college,
  where you’ll learn to ask questions and dig deep for understanding, we’re asking you in this chapter
  to look closely at that normalized academic voice, to ask hard questions about what that voice reflects—and
  what it covers up.</p>

  <p>These kinds of questions are what many researchers in the field of rhetoric and composition, especially
  Black, Indigenous, and People of Color (BIPOC), have been asking for decades. One leading scholar in
  the field, Jacqueline Jones Royster, argues that a voice is a “central manifestation of subjectivity”
  (30). In other words, our relationship to power, as well as the opportunities it affords and the constraints
  it places on us, is revealed through our voice. Royster defines a voice as something “that is constructed
  and expressed visually and orally, and [...] a thing heard, perceived, and reconstructed” (31). Why
  does this distinction matter for Royster? Because it points our attention not only to who is doing the
  speaking, but also who is being heard. To have a voice, Royster argues, is to have “the power and authority
  to speak and make meaning” (31). This is the definition of voice we’re thinking of as we write this
  chapter.</p>

  <p>In a sense, Royster is bringing us back to that old saying, “If a tree falls in the forest, and there’s
  no one there to hear it, does it make a sound?” To have a voice means someone has to hear you. But what
  does it really mean to be heard? What kinds of sounds are meaningful, and to whom? What assumptions
  do we make about the listener (or reader) when we think about sounds that are meaningful?</p>

  <p>As you’ll learn in college if you haven’t already, sometimes the best answer to a question is another
  question. In this chapter, our goal isn’t to tell you what to think or how to write. Instead, we share
  with you what we know and leave you with challenging questions—questions about language, identity, and
  power that we ourselves don’t have good answers for. But we join many scholars who believe that those
  who write and teach writing in school need to be asking them. You might feel uncomfortable at times,
  and that’s okay—because discomfort can be productive. We hope that you’ll leave this chapter inspired
  to explore those questions and to work through any discomfort that comes up along the way.</p>

  <h3>How We Acquire Language: It’s All About Community</h3>

  <p>It’s hard to talk about voice without talking about language, because language is one of the primary
  ways most people communicate. So in order to think critically about voice in academic writing, we first
  need to think critically about language. Luckily for us, there’s an entire academic discipline called
  Linguistics where people study language. Linguistics scholars study how sounds and words form patterns,
  how humans develop language, what features all languages have in common, how language varieties differ,
  and more.</p>

  <p>One of the most fundamental things linguists have found that’s relevant to our discussion is this:
  language really isn’t something we learn through conscious effort; it’s something we acquire. In other
  words, language is sort of something that happens as we interact with other human beings. Research has
  shown that one of the best ways to acquire language is simply by using it with others, out of necessity
  to communicate. Language acquisition is one reason why language immersion programs and dual-language
  programs have become so popular, and it’s one benefit of study-abroad programs as well.</p>

  <p>Because language is acquired by interacting with others, it’s as diverse as the communities we’re
  part of: communities organized by where we live, our religious traditions, our interest groups, and
  so on. In each of our communities, the language we use is specific to those groups; for example, we
  use certain words or expressions, we focus on particular things, and we share certain beliefs that form
  the basis for our interactions. The language we use is also what creates a sense of community; it separates
  people who are in that community from those who are outside it. For example, writer and cultural theorist
  Gloria Anzaldúa says that Chicano Spanish “sprang out of the Chicanos’ need to identify ourselves as
  a distinct people” (33). This language is one “they can connect their identity to, one capable of communicating
  the realities and values true to themselves—a language with terms that are neither espanol ni ingles,
  but both” (33).</p>

  <p>Language is also connected to racial identity but not for the reasons most people think. “[R]ace
  does not determine what language a child will speak, there is no such thing as a ‘racial language,’
  and no race or ethnic group is born with a particular language,” explains Geneva Smitherman, a groundbreaking
  and important Black linguist who has spent the last 50 years researching Black Language, also known
  as Black English, African American Language (AAL), and African American Vernacular English (AAVE), and
  formerly known as Ebonics. She continues:</p>

  <p>Children acquire their language from the community of speakers they play, live, grow up, and socialize
  with. [... S]ince communities in the U.S. have been separated and continue to exist along distinct racial
  lines, language follows suit. An African American child will more than likely play, live, grow up, and
  socialize in any one of the numerous African American communities of the U.S. and thus will acquire
  the African American Language of her community. [...] Even though race does not determine what language
  a child will speak, race does determine what community a child grows up in, and it is that community
  which provides the child with language. (5)</p>

  <p>In short, what Smitherman is arguing is that language tends to differ among differently raced people,
  but that isn’t because language and race are inextricable from one another. That is, being Black doesn’t
  determine which language and dialect you’ll know and use most any more than being Mexican American means
  you’ll know and use Chicano/a Spanish or being white means you’ll speak middle-class English.</p>

  <h3>Why Language Is Political: The Silencing Power of Stigma</h3>

  <p>The discussion of communities and language gets tricky when we start to talk about value, specifically
  how different communities and languages are valued differently. At its most basic, value is attached
  to resources: land, money, time, materials, people, and other assets that we need in order to live.
  The more resources we have access to or possess, the more value we possess. The more value we possess,
  the more power we have, because we live in a world where resources are finite. More power means more
  authority, including authority to set standards and make the rules that govern society.</p>

  <p>Authority is inextricably connected to language because people are inextricably connected to language.
  In other words, language is political because politics is all about how humans living in groups make
  decisions. They make those decisions by using language, and in many settings, they make decisions about
  language: what is and isn’t valued, appropriate, correct, and so on. The issue, of course, is who is
  making those decisions—or historically has made those decisions—and whose values are accounted for in
  the decisions that they make, in the standards that they set.</p>

  <p>One of the most difficult concepts for non-linguists to grasp about language is that there really
  is no such thing as an objective “standard” version of a language. The idea that there is one is a myth.
  To the contrary, language doesn’t exist on its own; it’s created through interaction and changes over
  time, two truths that linguists have discovered through careful observation and deduction. In other
  words, there simply is no “pure” form of a language, no standard. The belief that standard English exists
  is called standard language ideology.</p>

  <p>Nevertheless, people try to standardize language—to create and uphold some notion of the “pure” form
  of a language—out of perceived necessity. Sociolinguist Rosina Lippi-Green explains that because we
  write to remember things and help others to remember them, and to preserve ideas we find valuable, we
  place a lot of demands on written language: “we want it to span time and space, and we want it to do
  that in a social vacuum, without the aid of paralinguistic features and often without shared context
  of any kind” (18). As a result, she says, people think that “written language needs to be free of variation:
  it must be consistent in every way, from spelling to sentence structure” (18).</p>

  <p>The problem, though, is that language doesn’t happen in a vacuum; it happens among people of diverse
  cultures, nationalities, religious traditions, and socioeconomic classes who have different orientations
  toward gender, sexuality, physical ability, neurotypicality, and so on. The demand for language consistency
  necessarily results in standards that reflect a particular worldview: the worldview of the people in
  positions of power. In the United States, these were the people who historically had access to education
  (until roughly the 1970s, most were wealthy white men). Smitherman raises a good point: “If Black people
  were in power in this country,” she says, “Black English would be the prestige idiom” (63).</p>

  <p>Language diversity in educational and professional spaces isn’t itself a problem, however. People
  in countries outside the U.S. have found ways to value such diversity; the American system of education
  is unique in its insistence on standardizing one language variety, says late writer and teacher June
  Jordan:</p>

  <p>In contrast to India, where at least fourteen languages co-exist as legitimate Indian languages,
  in contrast to Nicaragua, where all citizens are legally entitled to formal school instruction in their
  regional or tribal languages, compulsory education in America compels accommodation to exclusively White
  forms of “English.” White English, in America, is “Standard English.” (364)</p>

  <p>In other words, kids in the U.S. from ages 5-ish to 18-ish are required to learn and demonstrate
  proficiency in what Jordan calls “White English,” the language variety that has been standardized by
  people in power. In effect, the notion that written language must adhere to these standardized rules
  is a power play that inevitably reproduces white supremacist systems. It is the systems that are problematic,
  not the language differences within them.</p>

  <p>These systems are even more problematic because of how they influence our thoughts about one another.
  In judging language, we judge the people who use that language. Judgements1 are made through comparison,
  usually to some standard or ideal. So when someone who accepts standard language ideology judges our
  language, assessing it in terms of “correctness” and/or “appropriateness,” they’re effectively judging
  our own proximity to that ideal. In effect, they “devalue the intelligence and character of students,
  employees, and colleagues, who [...] don’t speak or write [‘standard’ English] by labeling their language
  improper, inappropriate, or incorrect,” explains writing scholar Anjali Pattanayak (84).</p>

  <p>Over time, humans internalize beliefs about ourselves and others based on judgements of language.
  Elaine Richardson, an influential Black professor of Literacy Studies at The Ohio State University,
  writes about these judgements in her memoir, entitled PHD (Po H# on Dope) to Ph.D.: How Education Saved
  My Life: “I had entered this class, this university and been told in so many words that I was illiterate
  because the words I used were awkward, not recognized as college format, because I didn’t know how to
  punctuate sentences” (202). She later recaps feedback from a writing professor:</p>

  <p>Miss Richardson, when your prose breaks down it’s because your logic has broken down … syntax problems
  come up not just when someone doesn’t have a command of the language or grammar, but because he or she
  hasn’t thought the argument through carefully enough. The language from your home and neighborhood is
  fine in that context, but it doesn’t work for the kind of careful analysis and expression expected in
  academic writing. (207)</p>

  <p>In other words, according to this professor, Black English doesn’t make possible the logical and
  analytical thinking expected of college students. Her white mentor’s suggestion? “Write more like I
  talk,” which meant code-switching like she did when “trying to project a positive self-image, especially
  when speaking to White folks” (207).</p>

  <p>Never mind that White linguist William Labov’s analyses of Black speech, published in 1970, clearly
  “dispel the racist myth that African American Language is illogical or ungrammatical [...] reveal[ing]
  the language to be rule-governed and systematic, not a collection of haphazard errors” (Smitherman 11).
  Never mind that they correct “false impressions about language, race and intelligence” (11). Never mind
  that Black English “comes out of the experience of U.S. slave descendants” and was developed through
  communal resistance to slavery, that it “meld[ed] diverse African ethnic groups into one community [and]
  was created as a communication system unintelligible to speakers of the dominant master class” (3).
  Standard language ideology is a powerful thing. “Black English don’t make it own-self oppressed,” argues
  Vershawn Ashanti Young, a prominent Black scholar of African American Studies. “It be negative views
  about other people usin they own language […] that make it so” (110).</p>

  <p>This stigmatization can have serious consequences for people who speak and/or write anything other
  than what sociolinguists H. Samy Alim and Geneva Smitherman call White Mainstream English, a term literacy
  scholar April Baker-Bell uses “to emphasize how white ways of speaking become the invisible—or better,
  inaudible—norm” (3). Consider, for example, George Zimmerman’s 2013 trial for the murder of Trayvon
  Martin. The star witness for the prosecution on whose testimony Zimmerman’s verdict hinged was a 19-year-old
  Black woman named Rachel Jeantel, a speaker of Black Language. An extensive (and dense) analysis of
  the trial by Stanford linguists John R. Rickford and Sharese King reveals that Jeantel’s “AAVE, though
  systematic, was misheard and maligned. Her testimony, which provided crucial evidence, was disregarded
  because of its unfamiliarity to most jurors and social biases against AAVE speakers” (980).</p>

  <p>Prejudices about language inferiority and intellectual ability are so deeply engrained through standard
  language ideology that peoples’ bodies themselves are stigmatized even when they haven’t uttered a word.
  This, of course, is an inevitable consequence of what writing and rhetoric scholar Asao Inoue calls
  “white language supremacy” and what Baker-Bell calls “anti-Black linguistic racism.” “When we read the
  words that come from [others’] bodies [...], we read those bodies as well,” argues Inoue, “and by reading
  those bodies we also read the words they present to us; some may bear/bare stigmas, some may not” (“Friday
  Plenary Address” 144).</p>

  <p>It is because of this shared concern that we urge you to ask, “What color is my voice?”</p>

  <p>As you’ll see in the narratives that follow, which were written by the two of us coauthors who were
  community college students in Kristin’s first-year writing courses, we believe this reflective work
  is an important first step in resisting white language supremacy. It’s especially important to do this
  work in educational settings, because education influences society, and because a collective voice (such
  as many voices of students in a class or a school) are more powerful than a single voice. We have three
  hopes for sharing our stories. We hope that those who’ve been forced to surrender their voice to an
  impossible standard will find solidarity. We hope that all readers will begin or continue to ask hard
  questions about voice and power.</p>

  <p>And we hope that all readers will do something in response, writing our way into finding our voice
  even in academic writing.</p>

  <h3>Writing Privileges from the “Good Writer”: An’s Story</h3>

  <p>I was lucky enough to grow up in a house that loved reading. My mom was a bookworm who read to me
  while I was still in the womb. Childhood was full of fairy tales and endless books using all kinds of
  language. The thee’s and the thou’s and the damsels in distress, I gobbled those stories up like Cheerios.
  Often, I would get busted for reading under the covers with my Hello Kitty flashlight. I’d say I was
  sorry, but it wasn’t my fault that stories got so much better after dark. Over the years my books and
  personal libraries were replaced by an iPhone, late-night reads became late-night texts, and “fancy
  language” went from being words of kings and queens to MLA format. As far away as childhood was, I can
  still say that my background affects the verbiage I use today.</p>

  <p>Speaking of background, let’s take it back, way back to 1991, the year my parents arrived.</p>

  <p>My parents are Vietnamese immigrants who came to this country riding on the promise of a better future
  for their not-yet-born kids (me and my sister). America was their ticket to success, and they made sure
  not to squander a second of it. Both of my parents graduated with Bachelor’s degrees in New York and
  made it a point to value education above all else. My mom was a Special Ed teacher before she had me,
  and my dad was a math substitute all throughout my adolescence. As for me, I started preschool ASAP
  and although I only remember how fun it was to play with giant bins of sand, I’m sure that going there
  benefitted me linguistically. Going on to elementary school, I recall reading absolutely anything and
  everything from cereal boxes to captions on the TV. In middle school the reading tests we did were my
  best tests (sorry, math teachers). I loved the thrill of reading faster and faster, zooming through
  the paragraphs and climbing the ladder of success. Sooner rather than later, it was clear to me that
  I was equipped with an arsenal of vocabulary. Reading felt like a train steadily chugging along with
  no reason to stop. But this was not the case for everyone. While I counted down the minutes left in
  class so I could race to the library, others around me avoided reading like the plague. Some simply
  had better things to do, like talk to their crushes at their lockers or gossip in the bathrooms. However,
  for some of my peers, the thought of picking up a book for leisure caused more stress than comfort.
  They only read books assigned for class, and even then those stories felt boring or overwhelming—the
  farthest thing from enjoyable. While reading for me felt like my greatest escape, my friends saw it
  as the greatest chore. I did not fully understand why this may have been until entering college. This
  was when I started learning more about how reading and writing experiences in childhood can affect people
  for the rest of their lives.</p>

  <p>As an Early Childhood Education major, I am taking courses about childhood development, and some
  of the things I’ve learned have been truly eye opening. For example, one of my classes focuses on how
  to use Art Integration in all subjects in order to give students creative outlets. Something we recently
  discussed was the concept of “art scars.” Art scars refer to past traumas that students have around
  art. Often, in childhood, students will experience shame or harsh criticism of their creativity from
  their peers or their teachers. This trauma can cause people to lose their sense of creativity entirely
  and can affect them well into adulthood. An example we spoke about in class was a story of a student
  applying to college. He flew through his application with full confidence, but when he was asked to
  draw an image of what represented him as a person, he broke down in tears, and ended up throwing his
  application away.</p>

  <p>In the same way, I believe that people have “writing scars.” Throughout school, I had various friends
  tell me that they were bad at writing. I took that statement as a call to action and stepped in as human
  Grammarly— reading through numerous essays, tweaking them here and there so that they sounded “more
  academic.” What I ended up noticing is that the essays that they gave me ended up sounding nothing like
  the final product that I produced. In making their writing “better,” what I actually did was censor
  their voices, stripping their colorful essays of what made them profound and thought provoking. Without
  knowing it, I was reinforcing what their past writing scars had told them, that they were no good at
  writing and that their language was not deemed academic. Perhaps, and I hate to admit this, I was the
  one giving them the writing scars and making them feel inadequate about their writing ability. This
  realization especially sucks because at the time, I genuinely felt that I was being a good friend by
  helping. I now understand how critical it is to believe that everyone’s stories are important, not just
  those who use “suburban” vocab or have perfected their citations. Looking back, I wish that I had just
  encouraged them to use more of the language that made them feel comfortable and heard. Instead, I took
  their narratives and shoved them into a box when I should have been the friend to set them free.</p>

  <p>To me, writing is freedom.</p>

  <p>I am a woman who feels with ferocity, and I love to express those feelings and be loud and pissed
  off and powerful. Writing should be used to empower people, not make them doubt their abilities. Often,
  writing can be cathartic or an emotional release. I know that that is what it feels like to me. The
  problem is that the academic writing standards that we currently have in place are way too rigid and,
  quite frankly, boring. Which is not how it’s supposed to be. When it comes to my own assignments, I
  find that in order to do well, my deep connection to my writing is something that I have to erase completely.
  But that SUCKS! I want to write the way I speak and to be able to share my story. I want to use expressions
  and italics and exclamation points. I want my bold points to be bold and for my essays to make people
  laugh or cry. Ultimately, I want my writing to sound like me. I recognize that it is much easier for
  me to excel in writing than it is for others who do not share my background. All my life I have had
  every chance to do well in English class, and this in itself is a blessing. My language doesn’t get
  nearly as much scrutiny as others do, and that’s not fair. I am not “better” at writing, I am not smarter
  or superior or even the best at writing this. The only thing that separates me from someone who is deemed
  a “bad writer” is access to opportunities. Everyone is a good writer. Because everyone who writes tells
  a story.</p>

  <p>I have so much love for writing, and I wish that everyone else had the opportunity to feel the same.
  But truly, all it comes down to is the fact that I was lucky enough to grow up in a house that loved
  reading.</p>

  <h3>Writing While Black: AJ’s Story</h3>

  <p>Growing up as a young Black man in the white suburbs of Chicago, I have experienced so much judgement
  and backlash when writing and how I’m viewed as uneducated due to my writing. Even after completing
  my associate’s degree. I still feel stuck in writer’s block every time I am tasked with a writing project
  or assignment. Recently I was involved in a motorcycle accident that temporarily made me unable to type.
  Both writer’s block and this accident have made it really hard to write this chapter. So what I decided
  to do is get creative and try from a different angle. Kristin and I decided to have a conversation,
  transcribe it, and share pieces of our conversation with you.2 Sometimes, life circumstances limit what
  we can do, so we gotta be flexible, and this is one of those situations.</p>

  <p>Kristin: Can you talk to me about some experiences you’ve had that stand out to you about your writing
  for school?</p>

  <p>AJ: So you know how when you’re a kid, you’re taught—what is it called, the—the correct “English,”
  or the correct way how you should write or say things. But then once you’re—as you grow up, especially
  when—growing up Black [...] it’s like learning two languages because you go to school and they teach
  you, “Oh, this word, you know, means this. And this is how you should use this word, this is how you
  should use it in a sentence, and you use this many words in a sentence and you use a comma, and this
  is how you properly do something.” And then you go home and then you pick up on vocabulary words, you
  pick up on how your [...] culture speaks and you’re [...] going in two different worlds because you
  tryna learn about your culture and how they speak, and then you grasp onto that. But then you going
  back to school and you tryna grasp onto that. But then let’s say a teacher writes you an assignment
  about “what do you think?” Oh, like a perfect question I just had recently asked: “What do you think,
  why is police recruiting down nationwide?” And then “what do you see as the problem, and do you see
  a remedy?” Now, you could choose two different options on how you can respond. [...] You can respond
  to the white version and use what you think that the audience would like, which is the white audience,
  or you could respond [...] how you truly feel about it, but when you try to respond how you truly feel
  about it, [...] you have to worry about who’s gonna be reading it and [...] what the type of audience
  is going to be reading it and how people will judge you on writing that. Does that make sense?</p>

  <p>Kristin: Yeah. So are you talking about the response that you give, or are you talking about the
  way that you—your voice in your writing?</p>

  <p>AJ: Yeah—it’s kind of both [...], because if you give the response that you believe in [...] I might
  get graded poorly on it, and I can’t voice how I really feel or speak how I really feel about the [thing
  I’m supposed to be writing about]. [...] In your mind you thinkin, am I writing for a white audience?
  When I get the assignment, I gotta think, “OK, who’s gonna be reading it?” If you know your teacher
  is white, then you’d be like, “OK, my teacher is white. So let me sound this way because I think this’ll
  impress my teacher, but I really don’t like how I’m putting this.” I’m not gonna really add flavor to
  it, or add how I really feel about it. But I wanna respond how I think that the teacher would like.
  Does that make sense?</p>

  <p>Kristin: Yeah. So would you say that race is the first, or one of the first, considerations that
  you think about when you’re writing for someone else?</p>

  <p>AJ: Oh absolutely. That’s the first thing that comes to my mind. Kristin: So what about a topic that’s
  not about police, like anything having to do with law enforcement, for example? Like for your meteorology
  class, or— AJ: Doesn’t matter. Because the first thing comes to my mind is that—I’m writing something,
  right? I’m gonna get judged automatically about what I’m writing about. Regardless. And there’s always
  gonna be somebody that don’t like what I say, but [...] I’m gonna to try to sound proper [...] regardless
  of if I don’t know if the teacher is white or black, whatever. I’m gonna try to sound proper because
  if I try to speak [...] using African-American Ebonics language, if I speak with slang and talk using
  slang words, then I’m gonna be viewed as uneducated or poor—poor choice of words, you know. People are
  not gonna try to validate my argument because the type of words that I’m using. Now, if I were to sound
  very proper, I’m still gonna get judged, but I may have a slim chance than if I were to use slang words
  to explain where I’m coming from. Kristin: Have you ever felt like you could write in ways that felt
  really authentic to you? AJ: No, I don’t think so. Not at all. I feel like it’s all sugar-coated and
  watered down. It’s like you’re beating around the bush. You’re at the top of the surface, but you’re
  not going underneath the surface. Because why even try if [...] Black people incapable of, aren’t capable
  of writing in a efficient and proper way. Kristin: Where do you get that message from? AJ: I just think
  it’s the experiences like, you know—I think it has to probably tie back to going to middle school and
  high school, being shamed in front of the whole class. I just feel like those experiences shape our
  way of thinking—when you go through an experience like that, it makes you think, like, damn, maybe I
  am not good enough to do this. Kristin: Would you be comfortable telling me about those experiences?
  AJ: Yeah. I had to write this essay for high school; it was called the Pettus Bridge Essay. Of course,
  it was about violence against Black people, and I fucking hated it. It was traumatizing learning about
  that in a white setting when you’re one of the only Black people in the class. And this teacher—it’s
  not the shit that he would say that would be racist, it was the antagonizing shit that he would do that
  made me believe he was racist. We would turn in our essays on Friday, and during class on Monday, he
  would call groups of people up, have them stand in a line, give them back their essays, and talk to
  each person for 30 to 45 seconds on what they can do to improve. And he got to the last three people—and
  what a coincidence that we’re all Black—and everybody was up and down in their seats, and no problems.
  And then like, the three Black people, it was like—I feel like I was standing in the courtroom in front
  of a fuckin judge, because we’re all standing in front of him, he’s all telling us how, “Oh, this isn’t
  good. Look how all the Black students didn’t do well on their assignments.” We all got like Cs and Ds,
  and we still talk about it to this day, [the teacher said,] “Oh, if you want a good grade, you’ll have
  to rewrite it over again in a different way—if you do it this way, improve here and there. And that
  shapes the way of you writing in the future, because now you thinking like, “Damn, I can’t really explain
  how I feel or what I think about this situation, because now I’m second-guessing every goddamn thing,
  thinking like, ‘I don’t know where to start. Does this sound good?’” And you know, that’s what makes
  writing so difficult. That shit right there. Experiences like that. Where you have someone that kinda
  shames you growing up, or someone shames you for your writing like that, it shapes you into a way of
  thinking that you’re not capable of being a good writer or not being a good, efficient, and proper writer,
  because everything you do, you feel like it’s not good enough. Kristin: Are there situations in school
  where you’ve been having to write and you felt like you were able to move past that writer’s block?
  AJ: It’s not something that you could just move past. I’m still not past it, cuz it’s like even with
  different teachers, I still have that in the back of my mind when it comes to writing. That’s not the
  first experience of me dealing with something like that one teacher, but just that one experience could
  impact you writing in your whole life because it’s just like—that was just too much for me, you know?
  That was sophomore year in high school. And to this day, I still have that same problem of second-guessing
  everything, and that’s [...] why I hate writing assignments so much. I mean,</p>

  <p>I’ll rather do a essay than do math. But it’s just like it takes so much longer to write because
  you’re second guessing everything. You write two pages? “Oh, that don’t sound— that don’t—I don’t think
  that’s right.” You know? You’re thinking you’re not good enough to write. [. . .] All it takes is one
  experience, is a white person to say—or, put you, like, make you feel like you’re beneath them, and
  then it just impacts your writing, and then it’ll fuck you up writing moving forward. Kristin: And you
  can’t— AJ: And you can’t get past it because that one experience is in your mind.</p>

  <h3>Where We Go from Here</h3>

  <p>The goal of empowering writers by preparing them to write in contexts where they will be judged for
  deviations from the “standard” might seem like a good one—people trying to help others to succeed in
  life. But with code-switching, the fact that the “standard” was set by the people who have historically
  had the most resources remains unchallenged—and that, we believe, is a huge oversight. “For the master’s
  tools will never dismantle the master’s house,” wrote Audre Lorde in a book titled for that quote. “They
  may allow us to temporarily beat him at his own game, but they will never enable us to bring about genuine
  change.” In other words, if we continue to follow the status quo with our academic writing and the teaching
  of it, we’ll never change white language supremacy. Black women like Rachel Jeantel still won’t be believed
  or taken seriously because she talks (or writes) in a stigmatized dialect (or language, depending on
  how you categorize AAVE). So even though students in higher education have become more diverse, the
  standards and expectations have not changed to reflect that diversity—and white supremacy lives on.</p>

  <p>Looking back on all the reading we’ve done for college, the books and articles that have stayed with
  us most are written by Black, Indigenous, and People of Color who’ve written about brilliant, complex
  ideas—with a voice. The language they use reflects the person behind those words and ideas. Their radical
  academic writing pushes us to ask hard questions about language and power, questions that unsettle the
  paralyzing fear of failure that so many students always carry because they’ve been socialized to believe
  their language and thus their intelligence is inferior, as AJ’s story exemplifies. It is for these students
  and all students who believe their voice doesn’t belong in higher education or professional workplaces—a
  belief rooted in white supremacy—that we urge us all to ponder how our own voices show up in our academic
  writing—or how they’re silenced, and what we want to do with that knowledge.</p>

