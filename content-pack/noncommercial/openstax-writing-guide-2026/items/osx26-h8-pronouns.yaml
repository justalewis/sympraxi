body: '<p><em>Access for free at openstax.org.</em></p>

  <h3>Pronouns</h3>

  <p>A Pronouns is a word used in place of a noun. Some pronouns are I, you, he, she, we, they, who, and
  everyone. The noun a pronoun replaces or refers to is its antecedent. (See Editing Focus: Pronouns for
  a related discussion of pronouns.)</p>

  <h3>Pronoun Reference</h3>

  <p>A pronoun should refer to a clear and specific antecedent. Clear Antecedent All nine members of the
  school board voted in favor of changing the district’s mascot. They explained their reasoning during
  the meeting. (They refers clearly to members.) Unclear Antecedent In Smith’s essay, she explains why
  many American families have less money saved and more debt than families in the 1970s. Revised In her
  essay, Smith explains why many American families have less money saved and more debt than families in
  the 1970s.</p>

  <p>Problems with pronoun reference occur in the following situations: Vague this, that, which, or it.
  The pronouns this, that, which, and it should not refer to words expressing an idea, an event, or a
  situation.</p>

  <p>Vague Reference The school board voted to change the district’s mascot without holding special meetings
  with the public. This made some community members angry. (Are community members angry about the vote
  or about the lack of special meetings?) Revised The school board voted to change the district’s mascot
  without holding special meetings with the public. Their decision to avoid public discussion before the
  vote made some community members angry. Indefinite it, they, or you. The pronouns it, they, and you
  should have a definite antecedent in a sentence. Indefinite it Crittenden explains that mothers are
  taken for granted and disrespected, even though our society calls it the most important job in the world.
  Revised Crittenden explains that mothers are taken for granted and disrespected, even though our society
  calls motherhood the most important job in the world. Indefinite they Japan has considerable wealth
  compared to Ireland, but they have a low subjective well-being index. Revised Japan has considerable
  wealth compared to Ireland, but Japanese citizens have a low subjective well-being index. Indefinite
  you The federal government should raise the minimum wage to ensure you earn a wage you can live on.
  Revised The federal government should raise the minimum wage to ensure workers earn a wage they can
  live on.</p>

  <h3>Pronoun-Antecedent Agreement</h3>

  <p>In many sentences, making a pronoun agree with its antecedent is straightforward: My neighbors gave
  me the keys to their apartment. However, pronoun-antecedent agreement gets tricky in the following circumstances.</p>

  <h3>Agreement with Generic Nouns and Indefinite Pronouns</h3>

  <p>Generic nouns refer to a type of person or job someone performs, such as athlete, child, scientist,
  doctor, or hairdresser. Indefinite pronouns include words such as anyone, each, everyone, everything,
  many, most, and none. All generic nouns and most indefinite pronouns are singular in meaning. Traditionally,
  these words took the singular pronouns he/him/his because English does not have a gender-neutral third-person
  pronoun that refers to people: Everyone has his own opinion or A doctor needs to show that he cares
  about his patients. More recently, writers have been replacing he/him/his or his/her with they/them/their
  when the person’s gender is unknown or unimportant or when the person has indicated a preference for
  non-gendered pronouns:</p>

  <p>Everyone has their own opinion. A doctor needs to show that they care about their patients. These
  plural pronouns are increasingly accepted and intentionally used by writers, teachers, and editors.
  Many prominent publications and style guides indicate that the plural pronoun should replace binary
  or singular ones in most cases. If using a plural pronoun does not fit the situation (such as in a paragraph
  where the pronoun they is also used several times to indicate a group), try rewriting the sentence in
  either of these ways: Remove the pronoun. Everyone has an opinion. Make the antecedent plural. People
  have their own opinions. Doctors need to show that they care about their patients.</p>

  <h3>Agreement with Collective Nouns</h3>

  <p>Collective nouns such as audience, band, class, crowd, family, group, or team can take a singular
  or plural pronoun depending on the context. When the group acts as a single unit, which is the most
  common construction, use a singular pronoun. When the group members act individually, use a plural pronoun.
  If using the plural sounds awkward, add the word members so that the plural is clear.</p>

  <p>The band went through its complete playlist. The band loaded their instruments on the bus. The band
  members loaded their instruments on the bus.</p>

  <h3>Pronoun Case</h3>

  <p>Pronouns have three cases: subjective, objective, and possessive. Pronouns change case according
  to their function in a sentence.</p>

  <ul><li>Subjective case pronouns function as subjects: I, we, you, he/she/it, they, who/whoever: Antonio
  and I share an apartment downtown in a neighborhood we like.</li><li>Objective case pronouns function
  as objects: me, us, you, him/her/it, them, whom/whomever: The manager gave us a tour of the building.</li><li>Possessive
  case pronouns show ownership: my/mine, our/ours, your/yours, his/her/hers/its, their/theirs, whose:
  Our friends live in the building too.</li></ul>

  <p>Pronoun case gets tricky in the circumstances explained below.</p>

  <h3>Case in Compound Structures</h3>

  <p>Compound subjects use subjective case pronouns. Compound objects use objective case pronouns. Subjective
  Case Antonio and I have occasional disagreements about the dishes. Objective Case Occasional disagreements
  about the dishes come up between Antonio and me.</p>

  <h3>Case After than or as</h3>

  <p>In a comparison, the case of the pronoun indicates which words have been left out: Antonio cares
  more about having a clean kitchen than I [do]. Sometimes I think Antonio cares more about a clean kitchen
  than [he cares about] me.</p>

  <h3>Who or Whom</h3>

  <p>Use the subjective case who in place of a subject—whether it is the subject of the sentence or the
  subject of a clause:</p>

  <p>Who is going to the concert? (subject of sentence) Give the tickets to whoever can use them. (subject
  of clause) She is the person who is best qualified for the job. (subject of clause) She is the person
  who I think is best qualified for the job. (subject of clause; the intervening words “I think” don’t
  change the subject or verb of the clause) Use the objective case whom in place of an object, whether
  it is the object of a verb, preposition, or clause: I don’t know whom to ask. (object of verb) To whom
  should I give the extra concert tickets? (object of preposition) Give the tickets to whomever you choose.
  (object of clause)</p>

  <h3>We or us with a Noun</h3>

  <p>Use we with a subject. Use us with an object. We citizens must vote in order to make our voices heard.
  (subject) Legislators need to hear from us citizens. (object)</p>

  <h3>Case Before or After an Infinitive</h3>

  <p>Use the objective case before and after an infinitive (the to form of a verb: to run, to walk, to
  eat): The agent asked Antonio and me to write a review. We agreed to give him a positive review.</p>

  <h3>Case Before a Gerund</h3>

  <p>Generally, use the possessive case of a pronoun before a gerund (the -ing form of a verb used as
  a noun: gentle snoring, elegant dining):</p>

  <p>He grew tired of their partying late into the night. The rental agreement depends on your approving
  the lease terms.</p>'
