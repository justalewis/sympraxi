  <h3>Step 3</h3>

  <p>One of us did the design and kept all the files stored on their computer because they had access
  to Adobe InDesign and that’s what they wanted to use. So when they couldn’t make it to class or to a
  meeting, we had no way of accessing the drafts. Plus, I couldn’t edit because I do not have the program.
  This became super stressful in the end.</p>

  <p>Having a common online folder with all the files for the project was very helpful. We could access
  the different drafts at all time. Working in an online setting that allowed us to comment on each other’s
  work saved us so much time. Plus, I could work at my pace before class. We’d leave comments during the
  week on the draft and then take turns editing.</p>

  <h3>Step 4</h3>

  <p>We basically only interacted in class. While it was OK, we often wasted time trying to figure out
  who did what during the week. Not knowing if my team members were going to be in class or what they
  had done that week made the whole experience more stressful than it needed to be. We could have done
  a better job managing our time.</p>

  <p>Deciding early on how we would communicate made it much easier to let each other know when something
  was not working or needed to be changed. We ended up meeting only once outside of class but we communicated
  almost every other day via text messages and in our online doc draft.</p>

  <h3>Step 5</h3>

  <p>We wrote a contract but never really followed it once we started. Looking back, I wish we had taken
  more time setting up how we would work, including how we would handle absences and such. Not having
  good policies made it difficult to have conversations about workload and absences.</p>

  <p>There were a few times when some of us dropped the ball, but we knew each other well enough then
  to know how to handle it based on the policies we had agreed on. Having a plan in place helped us to
  adjust our roles when needed.</p>

  <p>What does a collaborative writing project look like in action? The Collaborative Process Visualized</p>

  <p>Figure 6.1 shows an example of what a collaborative writing project that uses the methods outlined
  previously looks like in action. Note that your team contract would be effectively written during the
  3rd stage as the first content document after stage 1 and 2. Common Problems and Possible Solutions
  The methods outlined earlier offer a framework to build sound collaborative practices. They are, however,
  not full proof shields against every issue. What follows are some potential issues and solutions to
  keep in mind. Social Loafing/Freeloading If you end up with a non-contributing member, start by addressing
  the issue during one of the check-in moments. Give the person a chance to explain the situation first.
  Incomplete or no work is not always a sign of a freeloader.</p>

  <h3>Figure 6.1: The Collaborative Process Visualized</h3>

  <p>Sometimes, a person does not contribute because their schedule or other unexpected factors get in
  the way. Sometimes they may also have difficulties finding the information for completing a task, or
  they do not fully understand what is expected from them. Having a conversation as a group will give
  you a chance to identify the source of the issue, provide support, and make necessary adjustments.</p>

  <p>What started as a problem can then become a chance to build cohesion and trust. This may be enough
  to make a struggling team member a productive member. If these adjustments do not resolve the issue,
  consult your contract, which should have specific information regarding what constitutes a breach of
  contract and what procedure to follow. This may mean issuing a warning (with potential point deductions)
  and/or contacting your instructor. It may be helpful to organize a team meeting with your instructor
  as a facilitator. Remember to keep the focus on the problematic behavior and its consequences for the
  project, rather than on a particular individual. Make the outcome of the conversation what is needed
  to benefit the group and the project.</p>

  <h3>Unresponsive Team Members</h3>

  <p>To deal with members who go radio silent, apply the same steps as you would for non-contributing
  members. That is, start by giving a chance to the person to reconnect. Use the team’s preferred communication
  method and keep in mind that their silence may be due to circumstances outside of their control. Someone
  may also withdraw because they are struggling with the work and need encouragement. If the silence persists,
  consult your contract (and schedule) and reach out to your instructor.</p>

  <h3>Conflict Between Team Members</h3>

  <p>Sometime disagreements or domineering personalities can create conflicts. If this happens, use your
  check-ins to have a conversation as a group. Give everyone a chance to speak without interruption and
  respect each other’s ideas. Remember that the goal is not to be individually right or wrong; the goal
  is to be successful as a team. That is, understand that succeeding as a team may mean negotiating and
  compromising. Your project may include a peer assessment as one of the deliverables to be submitted
  at the end of the project. Such documents are helpful too for reflecting on collaboration issues and
  drawing lessons. However, if they are used as replacements for punctual assessments and check-ins during
  the project, group cohesion may suffer, and problems encountered during the project may become a major
  source of resentment and stress. In other words, do not delay and try to address issues as they arise.</p>

  <h3>Closing Thoughts</h3>

  <p>Collaborative writing projects are hard, as are any group projects, really. It is easy to focus only
  on the negative and the challenges and forget the benefits. However, as this chapter shows, there is
  much to gain from collaboration, including opportunities to develop relevant skills for the workplace,
  to get to know your peers better and make new friends, and to make your classwork more meaningful. In
  technical writing, group projects also offer unique opportunities to develop the kinds of skills required
  by today’s professionals in the field.</p>

  <p>Although there is no magic recipe for a successful collaboration, there are however specific strategies
  that one can use to plan and develop an effective group project. The key elements to remember is that
  collaboration is a process that takes time, effort, genuine engagement, and dialogue. In closing and
  just in case you may still be tempted to avoid collaboration at all costs or dislike the process no
  matter what, let’s reflect on the words of scholars Cathy Davidson and Christina Katopodis: “Ditching
  group projects now, as the world increasingly depends on them, does not prepare our students for life
  beyond college.” So, let’s keep working together on opening the classroom door and making your writing
  count.</p>

