  <p>15.8 Spotlight on … Applied Linguistics</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Identify cultural and linguistic variations in
  the English language. • Explain how case studies are used in the field of applied linguistics. • Explain
  how the field of applied linguistics has contributed to understanding of language.</p>

  <p>Scholars engaged in the field of applied linguistics seek to identify and offer solutions to real-life
  problems involving language. For example, immigrants who don’t speak the primary language of their new
  country might have difficulty attending school, finding a job, or accessing services. One subfield of
  applied linguistics is language acquisition theory, which focuses on the ways in which people learn
  language.</p>

  <h3>Solving Language-Related Problems</h3>

  <p>Applied linguistics has far-reaching implications that affect the real world. Effective communication
  in the workplace is one of the language-related problems that linguists study.</p>

  <p>For example, globalization of business means a greater likelihood that workers will need to collaborate
  with people from other cultures. It is not uncommon for American businesses to be owned by foreign companies
  or to hire foreign workers with temporary work visas. When different cultures interact, misunderstandings
  may occur. For example, directness when speaking is common and valued in American business culture,
  but indirectness is the norm in some other cultures. Understanding this difference can help workers
  communicate more effectively.</p>

  <p>The work of UCLA professor John Schumann in applied linguistics has helped researchers understand
  how people learn new languages. In 1976, Schumann conducted a case study of non-English speakers. His
  observations of one participant, Alberto, a 33-year-old man from Costa Rica, led Schumann to develop
  the acculturation model of second-language acquisition. Discounting Alberto’s age and ability, Schumann
  hypothesized that Alberto’s inability to learn English resulted from lack of contact with native English
  speakers. This theory thus suggests that learning a new language depends on societal and cultural factors—that
  is, the most successful language learners are those who immerse themselves most in the culture associated
  with the language.</p>

  <p>Consider also the research done by Dr. Kristine Hildebrandt (https://openstax.org/r/KristineHildebrandt),
  a researcher at Southern Illinois University Edwardsville. Hildebrandt’s studies of endangered languages
  of Nepal led her to start the research project “Narrating Disaster: Calibrating Causality and Responses
  to the 2015 Earthquakes in Nepal.” Soon after the earthquake that year, she and her team interviewed
  people in Nepal’s remote villages—remote both physically and linguistically—to learn more about their
  feelings and actions following the quake. From hearing the firsthand stories of how people in the region
  responded, adapted, and rebuilt shortly after the disaster, Hildebrandt hoped that the project’s findings
  could improve outside response to disasters in these areas by considering the perspectives and actions
  of their residents. Also of particular interest to her were the effects of culture on the response to
  disaster and the effects of disaster on the social, economic, and linguistic structures of a community.</p>

  <h3>Language Evolution</h3>

  <p>The work of linguists also guides people in how to use language and how to adapt it to contemporary
  situations. For example, speakers of English continue to revise their language to be more inclusive.
  The Associated Press and many other professional organizations have recently updated their stylebooks
  to refer to Americans of African descent as “Black” with a capital B instead of “African American.”
  These organizations considered and debated the change for a long time but ultimately concluded that
  using Black better reflects the shared experience and common culture of Black people living in the United
  States.</p>

  <p>Similarly, language is evolving to be more inclusive of people’s gender identities. For a long time,
  many considered it grammatically incorrect to use the plural pronoun they with a singular verb. However,
  it is now widely accepted that they is a useful gender-neutral pronoun to refer to an individual person
  whose gender is unknown—and to include those who fall outside the gender binary.</p>

  <h3>Linguistics-Related Task</h3>

  <p>To learn more about language acquisition, set up an interview with a person you know who has learned
  another language. It may be English as a second language, another spoken language, a language no longer
  spoken, American Sign Language, Braille, or even musical notation. Ask questions similar to those you
  asked your case study participant(s) to find out how they acquired this language. Consider asking some
  of the following questions:</p>

  <ul><li>What is your first language? • What caused you to learn a second language? • Under what conditions
  did you learn this language? (School? Surroundings? Family? Other?) • With whom do you use each language?
  • In which language do you feel more comfortable? Why? • How often and in what circumstances do you
  use both languages? • Do you think in your first language and then translate into the second language?
  • In which language do you have a larger vocabulary?</li></ul>

  <p>When you have enough information, write a summary of the information you gathered, and draw a conclusion
  about this person’s experience. Finally, suggest a question for further research.</p>

  <p>15.9 Portfolio: Your Own Uses of Language</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Write a reflection on the development of your
  composing processes. • Articulate how those processes affect your work. • Participate effectively in
  collaborative processes.</p>

  <p>Think about the different groups to which you belong. When you go to work, you are part of a group
  in which you and your colleagues complete specific tasks to earn money. When you are with your family,
  you are with a group of people who are related to you. When you are with your friends, you are with
  a group of people who share interests similar to yours. When you are at school, you are with a group
  of people who are there to teach and to learn. These groups usually have hierarchies, language terms,
  dress codes (official or unofficial), and rules of behavior.</p>

  <p>For example, think about the differences between standard English (formal, grammatically correct
  English) and the way you or people you know speak. Southerners might use expressions such as y’all and
  ain’t, long considered slang and/or incorrect. Some people pluralize nouns that would be grammatically
  correct as singular. Specific uses of English variants are often linked to a geographical region, ethnicity,
  or both.</p>

  <p>Variations of standard English are often the norm among people of color, and people who hold power
  over social mobility, such as teachers, hiring managers, and so on, traditionally consider use of standard
  English necessary to demonstrate education and professionalism. Thus, people of color often have to
  use two variations of English to navigate between professional and personal settings. A formal, grammatically
  correct sentence in standard English might impress an employer but might make you look out of touch
  to some in your community.</p>

  <h3>How Language Use Speaks to Who You Are</h3>

  <p>Pick a specific group of which you are a part, and reflect on that group’s use of language. The group
  you pick can be somewhat broad, such as “employees of Target,” or more specific, such as “members of
  the University of North Carolina marching band.” Ask yourself: What words are used in this group that
  might not be understood by people outside the group? Has the group changed the spelling or meaning of
  any words to communicate with one another? Does the group use any acronyms? Reflect on how language
  is used in your group to communicate ideas.</p>

  <p>Then, reflect on how language within your group is used to evaluate ethos, or credibility, of its
  members. In other words, how is language used to identify people who are initiated as “part of the group”?
  What flaws in the use of language would show that someone is not part of the group?</p>

  <p>Write your reflection in your notebook. If appropriate, discuss your reflection with another student,
  noting areas of similarity and difference. Add this reflection to your portfolio along with your case
  study profile.</p>

