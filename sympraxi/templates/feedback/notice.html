{% extends "base.html" %}
{% load i18n %}
{% block head_title %}{{ submission.title }}{% endblock head_title %}
{% block content %}
  {% include "scheduling/_breadcrumbs.html" with current=submission.title %}
  <h1>{{ submission.title }}</h1>
  <p>{{ message }}</p>
  <p><a href="{% url 'feedback:detail' slug=center.slug submission_id=submission.pk %}">{% translate "Go back" %}</a></p>
{% endblock content %}
