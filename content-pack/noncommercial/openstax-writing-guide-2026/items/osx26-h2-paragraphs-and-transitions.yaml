body: '<p><em>Access for free at openstax.org.</em></p>

  <h3>Introduction</h3>

  <p>This handbook is a brief yet comprehensive reference for you to consult as you write papers and other
  assignments for a college course. You can refer to it as you draft paragraphs and polish sentences for
  clarity, conciseness, and point of view. You can read it to learn how to identify and revise common
  sentence errors and confused words. You can use it to help you edit your writing and fine-tune your
  use of verbs, pronouns, punctuation, and mechanics. And you can have it open as you integrate and cite
  quotations as well as other source material in your papers in MLA or APA style.</p>

  <p>Designed as a reference tool, the handbook is organized to help you get answers to your questions.
  You do not need to read the entire handbook to get helpful information from it. For example, if your
  instructor has noted that you need to work on comma splices, you can refer to Sentence Errors, before
  you turn in a final draft of your writing. If you know you frequently misuse commas, refer to Punctuation,
  and check your sentences against the advice there. And if you, like many writers, can’t remember which
  punctuation marks go inside and outside quotation marks, refer to Quotations. Becoming familiar with
  the handbook and the various topics will allow you to use it efficiently.</p>

  <h3>Paragraphs and Transitions</h3>

  <p>Paragraphs help readers make their way through prose writing by presenting it in manageable chunks.
  Transitions link sentences and paragraphs so that readers can clearly understand how the points you
  are making relate to one another. (See Editing Focus: Paragraph and Transitions for a related discussion
  of paragraphs and transitions. See Evaluation: Transitions for a related discussion of transitions in
  multimodal compositions.)</p>

  <h3>Effective Paragraphs</h3>

  <p>Paragraphs are guides for readers. Each new paragraph signals either a new idea, further development
  of an existing idea, or a new direction. An effective paragraph has a main point supported by evidence,
  is organized in a sensible way, and is neither too short nor too long. When a paragraph is too short,
  it often lacks enough evidence and examples to back up your claims. When a paragraph is too long, readers
  can lose the point you are making.</p>

  <h3>Developing a Main Point</h3>

  <p>A paragraph is easier to write and easier to read when it centers on a main point. The main point
  of the paragraph is usually expressed in a topic sentence. The topic sentence frequently comes at the
  start of the paragraph, but not always. No matter the position, however, the other sentences in the
  paragraph support the main point.</p>

  <h3>Supporting Evidence and Analysis</h3>

  <p>All the sentences that develop the paragraph should support or expand on the main point given in
  the topic sentence. Depending on the type of writing you are doing, support may include evidence from
  sources—such as facts, statistics, and expert opinions—as well as examples from your own experience.
  Paragraphs also may include an analysis of your evidence written in your own words. The analysis explains
  the significance of the evidence to the reader and reinforces the main point of the paragraph.</p>

  <p>In the following example, the topic sentence is underlined. The supporting evidence discussed through
  causeand-effect reasoning comes in the next three sentences. The paragraph concludes with two sentences
  of analysis in the writer’s own words.</p>

  <p>Millions of retired Americans rely on Social Security benefits to make ends meet after they turn
  65. According to the Social Security Administration, about 46 million retired workers receive benefits,
  a number that reflects about 90 percent of retired people. Although experts disagree on the exact numbers,
  somewhere between 12 percent and 40 percent of retirees count on social security for all of their income,
  making these benefits especially important (Konish). These benefits become more important as people
  age. According to Eisenberg, people who reach the age of 85 become more financially vulnerable because
  their health care and long-term care costs increase at the same time their savings have been drawn down.
  It should therefore come as no surprise that people worry about changes to the program. Social Security
  keeps millions of retired Americans out of poverty.</p>

  <h3>Opening Paragraphs</h3>

  <p>Readers pay attention to the opening of a piece of writing, so make it work for you. After starting
  with a descriptive title, write an opening paragraph that grabs readers’ attention and alerts them to
  what’s coming. A strong opening paragraph provides the first clues about your subject and your stance.
  In academic writing, whether argumentative, interpretative, or informative, the introduction often ends
  with a clear thesis statement, a declarative sentence that states the topic, the angle you are taking,
  and the aspects of the topic the rest of the paper will support.</p>

  <p>Depending on the type of writing you’re doing, you can open in a variety of ways.</p>

  <ul><li>Open with a conflict or an action. If you’re writing about conflict, a good opening may be to
  spell out what the conflict is. This way of opening captures attention by creating a kind of suspense:
  Will the conflict be resolved? How will it be resolved?</li><li>Open with a specific detail, statistic,
  or quotation. Specific information shows that you know a lot about your subject and piques readers’
  curiosity. The more dramatic your information, the more it will draw in readers, as long as what you
  provide is credible.</li><li>Open with an anecdote. Readers enjoy stories. Particularly for reflective
  or personal narrative writing, beginning with a story sets the scene and draws in readers. You may also
  begin the anecdote with dialogue or reflection.</li></ul>

  <p>The following introduction opens with an anecdote and ends with the thesis statement, which is underlined.</p>

  <p>Betty stood outside the salon, wondering how to get in. It was June of 2020, and the door was locked.
  A sign posted on the door provided a phone number for her to call to be let in, but at 81, Betty had
  lived her life without a cell phone. Betty’s day-to-day life had been hard during the pandemic, but
  she had planned for this haircut and was looking forward to it: she had a mask on and hand sanitizer
  in her car. Now she couldn’t get in the door, and she was discouraged. In that moment, Betty realized
  how much Americans’ dependence on cell phones had grown in the months she and millions of others had
  been forced to stay at home. Betty and thousands of other senior citizens who could not afford cell
  phones or did not have the technological skills and support they needed were being left behind in a
  society that was increasingly reliant on technology.</p>

  <h3>Closing Paragraphs</h3>

  <p>The conclusion is your final chance to make the point of your writing stick in readers’ minds by
  reinforcing what they have read. Depending on the purpose for your writing and your audience, you can
  summarize your main points and restate your thesis, draw a logical conclusion, speculate about the issues
  you have raised, or recommend a course of action, as shown in the following conclusion:</p>

  <p>Although many senior citizens purchased and learned new technologies during the COVID-19 pandemic,
  a significant number of older people like Betty were unable to buy and/or learn the technology they
  needed to keep them connected to the people and services they needed. As society becomes increasingly
  dependent on technology, social service agencies, religious institutions, medical providers, senior
  centers, and other organizations that serve the elderly need to be equipped to help them access and
  become proficient in the technologies essential to their daily lives.</p>

  <h3>Transitions</h3>

  <p>Transitional words and phrases show the connections or relationships between sentences and paragraphs
  and help your writing flow smoothly from one idea to the next.</p>

  <h3>Flow</h3>

  <p>A paragraph flows when ideas are organized logically and sentences move smoothly from one to the
  next. Transitional words and phrases help your writing flow by signaling to readers what’s coming in
  the next sentence. In the paragraph below, the topic sentence and transitional words and phrases are
  underlined.</p>

  <p>Some companies court the public by mentioning environmental problems and pointing out that they do
  not contribute to these problems. For example, the natural gas industry often presents natural gas as
  a good alternative to coal. However, according to the Union of Concerned Scientists, the drilling and
  extraction of natural gas from wells and transporting it through pipelines leaks methane, a major cause
  of global warming (“Environmental Impacts”). Yet leaks are rarely mentioned by the industry. By taking
  credit for problems they don’t cause and being silent on the ones they do, companies present a favorable
  environmental image that often obscures the truth.</p>

  <h3>Transitional Words and Phrases</h3>

  <p>Following are some transitional words and phrases and their functions in paragraphs. Use this list
  when drafting or revising to help guide readers through your writing. (See Editing Focus: Paragraphs
  and Transitions for another discussion on transitions.)</p>

  <h3>Type of Transition</h3>

  <p>Examples to compare or show similarity likewise, similarly, in like manner to contrast or change
  but, yet, however, nevertheless, still, at the same time, on the other hand, conversely direction to
  add to also, and, furthermore, next, then, in addition to give examples for example, for instance, to
  illustrate, specifically, thus to agree or concede certainly, of course, to be sure, granted to summarize
  or conclude finally, in conclusion, in short, in other words, thus, in summary to show time first, second,
  third, next, then, soon, meanwhile, later, currently, concurrently, at the same time, eventually, at
  last, finally to show a spatial relationship here, there, in the background, in the foreground, in the
  distance, to the left, to the right, near, above, below</p>'
