  <h3>Overview and Teaching Strategies</h3>

  <p>This essay aims to help students who have interests in STEM fields make the most of their first year
  by showing them how to find opportunities to explore STEM topics in typical first-year writing classes,
  as well as in the STEM courses they will take, and even outside of courses; how strategies such as inquiry
  based rhetoric (IRB) apply to science writing in all situations; and how the work of equity, inclusion,
  and antiracism are foundational to science writing. This essay might be assigned as an option in the
  beginning of a first-year writing class to reassure STEM students that the FYW course is relevant to
  their needs. Parts of it might be assigned to prepare students for class work, formal writing activities,
  and peer review. Also, the essay might be used in first-year STEM classes to explain the importance
  of writing throughout STEM, or used in other ways depending on the goals and assignments of the specific
  course.</p>

  <p>Throughout the essay, specific uses of writing, sample assignments, and rationales for these are
  described so that students can employ these tools and teachers can adapt them. Each of the questions
  below can be turned into a classroom activity by having students work in small groups (in class or in
  Zoom breakout rooms). Students can share highlights from their small group discussions orally, by writing
  notes on the classroom chalkboard or white board, by writing notes in collaborative Google Docs, or
  by writing in class forums set up by their instructors in first-year writing courses or in first-level
  STEM courses.</p>

  <h3>Discussion Questions</h3>

  <p>1. In the section “Ways for STEM Students to Get the Most from Required First-year Writing Course(s),”
  we discuss ways that students can explore their interests in STEM in their first-year writing classes.
  Make a list of your interests. Then review your syllabus for your first-year writing class. Note the
  places in the syllabus where</p>

  <p>388 Christopher Thaiss and Stephanie Wade you think you could explore your interests. If you feel
  stuck or just have questions, talk with your instructor.</p>

  <p>2. We propose IBR (inquiry-based rhetoric) as an alternative to rulesbased writing classes. What
  rules do you remember being taught about writing? How often do you see published writers—including writers
  in STEM—following these rules? Look for examples of published writers breaking these rules, following
  other rules, or making their own.</p>

  <p>3. In the section on the first-year writing course, we explain how students with STEM interests can
  expand the typical literacy narrative assignment to include their interests. How did you become interested
  in STEM? Make a timeline of your life and jot down the moments that have been important to you regarding
  the development of your interests in STEM. Continue the timeline to project what your future might look
  like.</p>

  <p>4. In the section “Building Confidence and Rhetorical Awareness through Feedback and Peer Review,”
  we offer a rhetorical rubric to help you understand what makes good writing in different genres, for
  different audiences, and different purposes. Think about your own ideas of good writing. How does the
  rhetorical rubric match your ideas of good writing? What does it add? What does it leave out?</p>

  <p>5. In the section “Strengthening STEM Writing through Cultural Rhetorics and Antiracism,” we introduce
  the connections between antiracism and STEM and call upon readers to reflect on their individual backgrounds
  to facilitate the process of making STEM more equitable and inclusive. In what ways has your background
  prepared or failed to prepare you for this work? What resources does your campus offer? What next steps
  might you take to support yourself and your classmates in the project of improving equity and inclusion
  in STEM?</p>

  <p>6. In the section “Writing about Science Outside of Courses,” we suggest that blogs and social media
  such as Facebook provide important opportunities for you as a science writer. Do you have a favorite
  blogger or science writer who uses social media? If so, find a few examples of this person’s work and
  write about why you follow them. If not, spend some time exploring your STEM interests on your favorite
  social media (for example, using hashtags) and see what you find.</p>

  <p>7. In the same section, we write about how social media and much popular science writing “allow for
  multi-modal communication— in words, photos, drawings, video, and sound.” If you read such popular science
  periodicals as National Geographic, or STEM blogs and popular STEM websites, you’ll know many examples
  of multi-modal STEM communication. You may also have heard of STEAM—the joining of STEM research with
  the arts. Have you engaged in multi-modal STEM? If so, write about what you’ve tried. If not, write
  about how you might experiment with communicating your STEM interests through some of these media.</p>

  <p>8. In the section “Beyond the First-year Writing Course: Writing in STEM Classes,” we note that “writing
  about ideas and associated concepts works so well as a memorizing exercise.” To what extent have you
  used writing as a tool to help you understand and remember ideas, events, or procedures important to
  you? Reflect on when and how you have used this tool. Can you think of times when you’ve realized that
  you should have been more careful to make notes or write about what you had wanted to remember?</p>

  <h3>Activities for Teaching Rhetorical Reading</h3>

  <p>In addition to turning the discussion questions above into classroom activities, the following activities
  related to rhetorical reading can help teachers extend our essay. While we offer the “rhetorical reading
  rubric” (below) to help guide peer review, this rubric can be used to guide students through the rhetorical
  reading of the texts the teacher assigns in class:</p>

  <p>1. The teacher might assign two or more texts on the same topic in different genres, such as a news
  article, a blog post, and a research article.</p>

  <p>2. The teacher might assign two or more texts from different disciplines on the same topic.</p>

  <p>3. The teacher can model rhetorical analysis in class by pointing out features of text as we do using
  the article by Paradies cited in the essay.</p>

  <p>390 Christopher Thaiss and Stephanie Wade</p>

  <p>4. Students can continue rhetorical analysis by engaging in informal writing for homework and then
  share their work in class.</p>

  <p>5. The teacher can build these activities into a formal rhetorical analysis assignment that asks
  students to evaluate the different rhetorical moves writers use in different situations and to consider
  how they might use these moves in their own writing.</p>

  <p>Rhetorical Reading Rubric</p>

  <p>Logic and critical thinking:</p>

  <p>Emotions (gets the reader to care):</p>

  <h3>Character (earns the trust of the reader):</h3>

  <ul><li>The document presents clear claims/points with related reasons supported by reliable evidence.</li><li>The
  document shows how this research addresses a gap in prior research, and (2) shows why this research
  matters to other researchers or to a broader community.</li><li>The document shows understanding of
  relevant background research.</li><li>The document clearly explains methods and relevant materials.</li><li>The
  document uses visual techniques to achieve clarity.</li><li>The vocabulary used is accessible to the
  intended readers.</li><li>The document follows the general conventions of writing in the genre and discipline;
  for example in organization, format, and sentence style.</li></ul>

  <p>Activities to Incorporate “Writing to Learn”</p>

  <p>Our section “Beyond the First-year Writing Course: Writing in STEM Classes” describes the cognitive
  and metacognitive benefits of regularly using writing as a tool for memorization and for expanding thinking.
  It notes that “teachers may include online exercises to help [students] understand and apply the material.”
  Teachers might consider the following:</p>

  <p>1. At the beginning of a lecture, pose a question to students related to the theme of the lecture:
  e.g., “when you hear the term x, what do you think it means? What doesn’t it mean?” Ask students to
  write for just one minute without Googling the term. The question will immediately engage their attention
  and focus.</p>

  <p>2. As the final task toward the end of a lecture, ask students to write for 2-3 minutes to record
  thoughts/notes about the content of the lecture, perhaps phrased as “information and ideas that you
  don’t want to forget.” Such writings might be recorded in an online forum on the teacher’s course learning
  management system.</p>

  <p>3. Consider devoting a small part of class time at the beginning of a term, especially in introductory
  courses for first-year students, to the value of writing as a tool of thinking, remembering, and applying
  ideas. Consider describing to students your own practices as a researcher who takes careful notes and
  uses writing informally to expand your thinking.</p>

  <p>4. Teachers who set up student writing forums such as that described in a. and b. (above) might consider
  how frequently they will read or just browse them, and if they will grant them a small amount of course
  credit. Keep in mind that the writing of exercises like a. and b. is totally informal and spontaneous,
  and should always be a space for students to write without fear of evaluation. Indeed, teachers might
  tell students that such spontaneous writings should only be done in personal writing spaces that the
  teacher will have no access to.</p>

  <p>5. Conversely, teachers also may set up such forums more formally, often using them as quasi-public
  spaces open only to class members and the instructor. These often include regular deadlines, such as
  weekly, with named topics. In addition to giving students regular incentives to write about their reading
  and subjects of study, these forums are often used to build a course community, with expectations that
  students will read one another’s entries.</p>'
