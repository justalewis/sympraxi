  Have a peer evaluate your final draft using the following rubric. Although you might not agree with
  all the feedback or evaluation, peer reviewers bring a fresh perspective. At the end of the rubric is
  a section for your peer to offer additional feedback or expand on the reasoning behind their assessment.
  Listen to or read your peer’s feedback closely, asking any questions you have. Then, revise your paper
  again, according to the feedback you think is helpful.</li></ul>

