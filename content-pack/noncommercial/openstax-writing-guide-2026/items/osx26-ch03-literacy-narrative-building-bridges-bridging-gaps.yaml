  <p>Using Frederick Douglass’s Text as a Drafting Model</p>

  <p>As Douglass does, create your literacy narrative from your recollections of people, places, things,
  and events. Reread the following passage.</p>

  <p>The plan which I adopted, and the one by which I was most successful, was that of making friends
  of all the little white boys whom I met in the street. As many of these as I could, I converted into
  teachers. With their kindly aid, obtained at different times and in different places, I finally succeeded
  in learning to read. When I was sent of errands, I always took my book with me, and by going one part
  of my errand quickly, I found time to get a lesson before my return. I used also to carry bread with
  me, enough of which was always in the house, and to which I was always welcome; for I was much better
  off in this regard than many of the poor white children in our neighborhood. This bread I used to bestow
  upon the hungry little urchins, who, in return, would give me that more valuable bread of knowledge.
  I am strongly tempted to give the names of two or three of those little boys, as a testimonial of the
  gratitude and affection I bear them; but prudence forbids;—not that it would injure me, but it might
  embarrass them; for it is almost an unpardonable offence to teach slaves to read in this Christian country.
  It is enough to say of the dear little fellows, that they lived on Philpot Street, very near Durgin
  and Bailey’s ship-yard. I used to talk this matter of slavery over with them. I would sometimes say
  to them, I wished I could be as free as they would be when they got to be men. “You will be free as
  soon as you are twenty-one, but I am a slave for life! Have not I as good a right to be free as you
  have?” These words used to trouble them; they would express for me the liveliest sympathy, and console
  me with the hope that something would occur by which I might be free.</p>

  <p>In this selection from Narrative of the Life of Frederick Douglass, elements of the literacy narrative
  genre as explained in Glance at Genre: The Literacy Narrative are evident. First, Douglass introduces
  additional characters who help him resolve his earlier complication of being prevented from learning
  to read by the Aulds. The interaction he records here reiterates the larger conflict of the narrative:
  Douglass’s continuing enslavement. Although he does not give many scenic details, few more would be
  needed, for he places the action on the street near a shipyard, thereby giving an indication of the
  surroundings. Douglass presents his own words in dialogue to reinforce for readers that he knows how
  to speak and write in the ways that white people with means were taught at the time. In this piece,
  set against the backdrop of a culture that insisted on viewing enslaved people as “brutes,” Douglass
  demonstrates his dignity by displaying his facility with language and his humanity by offering bread
  to hungry children who have more freedom and opportunity, but less food, than he does.</p>

  <p>To create a draft that draws on multiple elements of storytelling, as this selection from Douglass
  does, you may need to generate ideas for additional scenes, or you may need to revisit a particular
  place so that you can provide concrete and sensory details for your readers. Refer to the storyboarding,
  web diagram, and plot flow charts in the “Organizing” section above to further develop your draft.</p>

  <h3>Another Way to Draft the Literacy Narrative</h3>

  <p>Read the literacy narrative by American author and educator Helen Keller (1880–1968). An Alabama
  native, Keller lost both sight and hearing after a serious illness as a young child. The selection relates
  a transformational literacy moment in her life, when Anne Sullivan (1866–1936), Keller’s teacher, helps
  her understand the connection between hand-spelled words and physical items. Keller’s literacies, along
  with heroic support from her teacher, later enabled her to complete college and tour as an activist
  and lecturer.</p>

  <p>The most important day I remember in all my life is the one on which my teacher, Anne Mansfield Sullivan,
  came to me. I am filled with wonder when I consider the immeasurable contrasts between the two lives
  which it connects. It was the third of March, 1887, three months before I was seven years old. The introduction
  sketches the boundaries of this literacy narrative by noting that the arrival of a teacher separated
  Keller’s life into two distinct parts. On the afternoon of that eventful day, I stood on the porch,
  dumb, expectant. I guessed vaguely from my mother’s signs and from the hurrying to and fro in the house
  that something unusual was about to happen, so I went to the door and waited on the steps. The afternoon
  sun penetrated the mass of honeysuckle that covered the porch, and fell on my upturned face. My fingers
  lingered almost unconsciously on the familiar leaves and blossoms which had just come forth to greet
  the sweet southern spring. I did not know what the future held of marvel or surprise for me. Anger and
  bitterness had preyed upon me continually for weeks and a deep languor had succeeded this passionate
  struggle. This paragraph helps establish the problem to be resolved in this short narrative: Keller
  is “dumb” but “expectant.” Additionally, the three characters in this section have been introduced—mother,
  teacher, and Keller herself—though the audience has few details yet about any of them. The author provides
  some sensory details in this paragraph, however, including her mother’s movements, the afternoon sun,
  and the tactile feeling of the honeysuckle. Have you ever been at sea in a dense fog, when it seemed
  as if a tangible white darkness shut you in, and the great ship, tense and anxious, groped her way toward
  the shore with plummet and sounding-line, and you waited with beating heart for something to happen?
  I was like that ship before my education began, only I was without compass or sounding-line, and had
  no way of knowing how near the harbour was. “Light! give me light!” was the wordless cry of my soul,
  and the light of love shone on me in that very hour. When Keller’s autobiography was originally written,
  the audience was readers of the Ladies’ Home Journal, a monthly magazine popular with homemakers; Keller’s
  autobiography was published in monthly installments. Keller appeals to this audience with her allusions
  to Judeo-Christian imagery and an evocative writing style. While her wording may seem a bit overdone
  today, such phrasing would have been familiar to her contemporary readers. A year later, in 1903, Keller’s
  story was published as a book and expanded to a much wider audience.</p>

  <p>I felt approaching footsteps, I stretched out my hand as I supposed to my mother. Some one took it,
  and I was caught up and held close in the arms of her who had come to reveal all things to me, and,
  more than all things else, to love me.</p>

  <p>The subject of love often appears in the literacy narrative genre, whether love of a certain skill
  or pastime or love for a relative or teacher who taught a certain literacy.</p>

  <p>The morning after my teacher came she led me into her room and gave me a doll. The little blind children
  at the Perkins Institution had sent it and Laura Bridgman had dressed it; but I did not know this until
  afterward. When I had played with it a little while, Miss Sullivan slowly spelled into my hand the word
  “d-o-l-l.” I was at once interested in this finger play and tried to imitate it. When I finally succeeded
  in making the letters correctly I was flushed with childish pleasure and pride. Running downstairs to
  my mother I held up my hand and made the letters for doll. I did not know that I was spelling a word
  or even that words existed; I was simply making my fingers go in monkey-like imitation. In the days
  that followed I learned to spell in this uncomprehending way a great many words, among them pin, hat,
  cup and a few verbs like sit, stand and walk. But my teacher had been with me several weeks before I
  understood that everything has a name.</p>

  <p>With the introduction of finger spelling, this paragraph and the next present the rising action building
  toward the climax of this story.</p>

  <p>One day, while I was playing with my new doll, Miss Sullivan put my big rag doll into my lap also,
  spelled “d-o-ll” and tried to make me understand that “d-o-l-l” applied to both. Earlier in the day
  we had had a tussle over the words “m-u-g” and “w-a-t-e-r.” Miss Sullivan had tried to impress it upon
  me that “m-u-g” is mug and that “w-a-t-e-r” is water, but I persisted in confounding the two. In despair
  she had dropped the subject for the time, only to renew it at the first opportunity. I became impatient
  at her repeated attempts and, seizing the new doll, I dashed it upon the floor. I was keenly delighted
  when I felt the fragments of the broken doll at my feet. Neither sorrow nor regret followed my passionate
  outburst. I had not loved the doll. In the still, dark world in which I lived there was no strong sentiment
  or tenderness. I felt my teacher sweep the fragments to one side of the hearth, and I had a sense of
  satisfaction that the cause of my discomfort was removed. She brought me my hat, and I knew I was going
  out into the warm sunshine. This thought, if a wordless sensation may be called a thought, made me hop
  and skip with pleasure.</p>

  <p>In Keller’s “still, dark world,” she offers little indication of setting, giving the audience only
  glimpses of her surroundings: honeysuckle, a house with interior stairs, and a hearth in her teacher’s
  room. Because she could not converse at the time, the only dialogue in this story appears in the form
  of the finger-spelled words. Plot tensions rise with Keller’s action of breaking the doll.</p>

  <p>We walked down the path to the well-house, attracted by the fragrance of the honeysuckle with which
  it was covered. Some one was drawing water and my teacher placed my hand under the spout. As the cool
  stream gushed over one hand she spelled into the other the word water, first slowly, then rapidly. I
  stood still, my whole attention fixed upon the motions of her fingers. Suddenly I felt a misty consciousness
  as of something forgotten—a thrill of returning thought; and somehow the mystery of language was revealed
  to me. I knew then that “w-a-t-e-r” meant the wonderful cool something that was flowing over my hand.
  That living word awakened my soul, gave it light, hope, joy, set it free! There were barriers still,
  it is true, but barriers that could in time be swept away.</p>

  <p>Keller’s literacy in finger spelling not only laid the foundation for her future literacies in reading,
  writing, and speaking but also provided her foundational access to language itself. This paragraph provides
  the climax of this story as well as the resolution for the problem introduced earlier; having been introduced
  to language, Keller is no longer “dumb” (though she cannot yet speak).</p>

  <p>I left the well-house eager to learn. Everything had a name, and each name gave birth to a new thought.
  As we returned to the house every object which I touched seemed to quiver with life. That was because
  I saw everything with the strange, new sight that had come to me. On entering the door I remembered
  the doll I had broken. I felt my way to the hearth and picked up the pieces. I tried vainly to put them
  together. Then my eyes filled with tears; for I realized what I had done, and for the first time I felt
  repentance and sorrow. I learned a great many new words that day. I do not remember what they all were;
  but I do know that mother, father, sister, teacher were among them—words that were to make the world
  blossom for me, “like Aaron’s rod, with flowers.” It would have been difficult to find a happier child
  than I was as I lay in my crib at the close of that eventful day and lived over the joys it had brought
  me, and for the first time longed for a new day to come. The final two paragraphs offer falling action
  following the dramatic climax. Consider the ways in which Douglass’s account and Keller’s account are
  stylistically similar and different. Both use figurative language—“bread of knowledge”—and make allusions
  to the Christian tradition. However, Douglass uses dialogue to illustrate a social disparity, whereas
  Keller’s transformation and her language are largely internal. You should make use of the strategies
  that best fit your own literacy narrative as shown in Table 3.3.</p>

