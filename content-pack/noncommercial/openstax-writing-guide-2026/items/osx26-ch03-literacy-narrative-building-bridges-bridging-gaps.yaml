  <h3>Generating Ideas</h3>

  <p>In addition to these notes, write a few ideas relating to your literacy experiences. Feel free to
  use bullet points or incomplete sentences.</p>

  <ul><li>What instructors, formal or informal, helped or hindered you in learning literacies? • Which
  of your literacies feel(s) most comfortable? • Which literacy experiences have transformed you? • Do
  you use specialized language to signal your identity as part of a community or cultural group? • After
  you look back over your notes, what is the most compelling story about a literacy or literacy experience
  that you can share, and what is the significance of that story?</li></ul>

  <p>Organizing In one last step before beginning to draft your literacy narrative, think visually about
  how you will put the pieces together.</p>

  <ul><li>Where will you begin and end your literacy narrative, and what is your story arc? Will you jump
  right into some richly described action, or will you set the scene for the reader by describing an important
  story locale first?</li><li>What tension will the story resolve? • What specific sensory details, dialogue,
  and action will you include? • What vignettes, or small scenes, will you include, and in what order
  should the audience encounter them? • Some of your paragraphs will “show” scenes to your readers, and
  some of your paragraphs will “tell” your readers explanatory information. After you decide what elements
  to show to your readers through vivid descriptions and what elements you will inform your readers about,
  decide how to order those elements within your draft. • Review the specific writing prompt given in
  the summary of the assignment, and make any additional notes needed in response to that material. Use
  visual organizers in such as those presented in Figure 3.10 through Figure 3.13 to develop the plan
  for your draft:</li></ul>

  <p>Use the graphic organizer structure above that best helps you establish the narrative arc for your
  literacy story, including the following elements:</p>

  <ul><li>Beginning. Set the scene by providing information about the characters, setting (where and when
  the narrative takes place), culture, background, and situation.</li><li>Rising Action. In each successive
  section, whether it is a paragraph or more, add dialogue and other details to make your story vivid
  and engaging for readers so that they will want to continue reading. Tell your story in an order that
  makes sense and is clear to readers.</li><li>Climax. At this point, show what finally happened to clinch
  the experience. How did the literacy experience finally take hold? Or why didn’t it? What happened at
  this “climactic” moment?</li><li>Falling Action. This is the part where the tension is released and
  you have achieved—or not—what you set out to do. This section may be quite short, as it may simply describe
  a new feeling or reaction. It leads directly to the next section, which may be more reflective.</li><li>Resolution.
  This is a reflective portion. How has this new literacy affected you? How do you view things differently?
  How do you think it affected the person who taught you or others with whom you are close?</li></ul>

