  <h3>Appendix Guiding Questions for Analyzing and Using Rhetorical Moves</h3>

  <p>Appendix Guiding Questions for Analyzing and Using Rhetorical Moves</p>

  <p>Identifying typical moves A “move” is a part of the text that helps the writer carry out a particular
  function or action. Label moves with a verb or an “action” word.</p>

  <p>Which moves seem obligatory or necessary to achieve the genre’s action(s)? Which moves seem common,
  but not necessary? Which moves seem optional or rare?</p>

  <h3>Identifying how moves help carry out the genre’s actions</h3>

  <p>How does each move work to achieve the action or goal of the genre? How do the moves work together,
  given what you know of the typical audience(s), purpose(s), and context(s) of the genre’s use?</p>

  <p>Identifying options and variations Some genres are rigid, while others are more flexible based on
  audience, context, or writer’s preference</p>

  <p>What organizational patterns (sequence, order) do you notice among the moves? How do different audiences
  or contexts seem to affect the moves? How do writers use language?</p>

  <p>Identifying common language features We often find similarities in linguistic choices within genres
  and/or moves. Try comparing entire texts (if short) or particular move across samples</p>

  <p>Critiquing rhetorical moves Try to identify strengths and limitations of the genre, as well as possibilities
  to shift, adapt, or transform it</p>

  <p>How is language used to carry out the moves you’ve identified? Consider examining:</p>

  <p>● verb tense (present, past, future)</p>

  <p>● word choice</p>

  <p>● passive/active voice</p>

  <p>● use of specialized vocabulary</p>

  <p>● contractions (e.g. it’s, I’m, we’re, you’ve)</p>

  <p>● use of pronouns</p>

  <p>● sentence types punctuation</p>

  <p>● sentence structures</p>

  <p>Do all moves have a clear purpose and help carry out the social actions of the genre? What is the
  significance behind the sequence of the moves? What are consequences for the writer or other users if
  certain moves are included, or not? Who seems to have freedom to break from common moves? Who does not?
  What do the moves suggest about the relationship between the writers and users of this genre? How might
  this relationship impact the inclusion/exclusion of certain moves? What do the moves suggest about the
  values of a broader community (i.e. a specific class, a specific institution, or the entire educational
  system of the region)?</p>

  <p>Teacher Resources for Make Your “Move”: Writing in Genres</p>

  <p>Overview and Teaching Strategies</p>

  <p>Rhetorical moves analysis is an adaptable strategy for analyzing, producing, and transforming genres.
  In this chapter, we walk students through an inductive process that makes visible the ways language
  choices and writing strategies like organization or structure are connected to the social action of
  a given genre. Moves analysis is thus a teaching strategy that can help demystify how writing works.
  Students do not need to have in-depth knowledge of genre theory to conduct a moves analysis, but it
  will be important for them to understand the concept of genre as social action. This chapter will work
  well paired with Kerry Dirk’s “Understanding Genres” in Writing Spaces, volume 1, and/or Dan Melzer’s
  “Understanding Discourse Communities” in volume 3. Connections can also be made to Mike Bunn’s “Reading
  Like a Writer” in volume 2.</p>

  <p>In a sense, conducting a moves analysis in a writing class is similar to what writers at all levels
  do all the time: gather some samples of work we find effective, try to figure out what specifically
  makes the samples effective, and then do those things (or transform them) in our own writing. Moves
  analysis is a flexible strategy that can be introduced when students begin reading a new genre or during
  their writing process. Christine likes to introduce moves analysis with short familiar genres (like
  the student absence email example in this chapter), and then return to moves analysis throughout a course
  when students approach a new genre. Madelyn uses moves analysis to help students identify obligatory,
  common, optional, and rare genre features as a way of collaboratively negotiating assignment guidelines
  and expectations, and identified moves become a part of the assessment criteria for student work in
  a given genre. Brad likes to use moves analysis after students have already written a first draft. After
  conducting the moves analysis in small groups and identifying some of the obligatory, common, and unusual
  moves as a class, students can then go back to their draft and make choices based on the analysis.</p>

  <p>One of the biggest challenges in facilitating moves analysis is selecting sample texts for analysis.
  The goal is to identify a narrow enough genre that the texts will be relatively similar, but also flexible
  enough to show variation. For example, in the student absence emails, we are clearly able to see variation
  across individual texts, but there are also common moves. If our sample set were broadened to also include
  faculty absence emails, we would probably start to identify slightly different patterns with moves.
  Some other shorter examples we’ve used to introduce moves analysis in class include wedding invitations,
  thank you notes, mission statements, obituaries, and protest signs, among others. If asking students
  to select their own samples, it will be important to emphasize the difference between a modality (email)
  and a genre (student absence email).</p>

  <p>We also need to acknowledge the concern that moves analysis can reinscribe a prescriptivism or focus
  on correctness that the field’s pedagogical focus on genre seeks to avoid. However, it’s important to
  recognize that the textual and discursive borrowing that emerges from moves analysis can provide students
  with effective rhetorical strategies and an entry point to discuss and critique discourses. Focusing
  discussion on how moves help to achieve an intended action and why particular moves are effective can
  also help students see the moves as conventions, not rules. The instructor should select a range of
  effective samples that demonstrate variation, and should identify outliers to raise for discussion.
  If students look at a range of examples, they are very likely to find variation; therefore, moves analysis
  can actually help highlight variation within a genre and show how writers have options to achieve their
  aims. Students can also be encouraged to use moves analysis to bend or remix a genre and compare the
  effects (Tardy). Like many pedagogical strategies, moves analysis can be a tool for reproducing, critiquing,
  and/or transforming hegemonic writing practices.</p>

  <h3>Activities and Process</h3>

  <p>While there are many possible ways to conduct a moves analysis in a class setting, we have generally
  had success using the following process:</p>

  <p>First, conduct a moves analysis of a familiar genre.</p>

  <p>The student absence email is our go-to genre because student writers have a close understanding of
  the rhetorical purposes and it brings some levity to the analysis process. By using the examples in
  this chapter or drawing on real student emails—anonymous, of course—teachers can also show some outliers
  or ineffective examples that elicit some knowing nods or laughs. Once students identify the genre, a
  brief discussion of context can elicit an understanding of the social action of this genre. We begin
  by modeling the process of moves analysis with one sample, helping students label each move with actions.
  Then, in small groups, we ask students to identify and analyze the moves in additional samples. We remind
  students that moves can be a sentence, a paragraph, or even just a few words, and we ask students to
  name them with a verb. In the absence emails, students will often use descriptive phrases like “why
  absent” or “apology”; it may be necessary to explicitly teach how to convert these descriptions into
  action-oriented phrases like, “providing reasons for absence” and “apologizing for absence.” In more
  academic genres, students may fall into generalized terminology like “introduction;” the introduction,
  however, is usually composed of multiple rhetorical moves (Swales).</p>

  <p>After identifying the moves, each small group can share out the moves they identified. It’s okay
  (and expected) that groups will use different terminology. Then, discuss how these moves facilitate
  the action of the genre. What are students generally trying to achieve with these absence emails? How
  do the typical moves (apologizing, providing reasons, expressing gratitude etc.) help to facilitate
  this goal? This step—discussing why certain moves are used—is essential to helping students see moves
  as rhetorical rather than simply formal. A critique of the genre’s moves can elicit discussion of writer-audience
  relationship and the embedded power relations of schooling. (We have also found wedding invitations
  to be an excellent entry point for moves analysis with opportunity for critique and transformation.)</p>

  <p>Next, analyze a less familiar genre.</p>

  <p>Follow the same procedures to analyze a target genre. It’s helpful first to discuss the social action
  of the genre. For more complex genres, like grant proposals or academic articles, it may also help to
  focus on specific sections. Limiting the analysis to a specific section of a longer genre can both focus
  the activity and remind students that different sections or parts of a text can serve different rhetorical
  purposes. Once a set of moves have been identified in group and class discussion, creating a table of
  obligatory, common, optional, and rare moves can be helpful for guiding students to their choices. Again,
  be sure to leave time to discuss how the moves facilitate the action of the genre.</p>

  <p>Finally, have students draft or revise using their knowledge of rhetorical moves.</p>

  <p>If you typically require students to reflect on their writing, you may ask them to discuss the moves
  they chose to use (or not), and why they made those choices. Christine likes to have students put in-text
  comments in their final drafts identifying their rhetorical moves and explaining their choices for using
  them (or putting them in a certain order).</p>

  <h3>Resources and Samples for Moves Analysis</h3>

  <p>The Statement of Need excerpts provided in the chapter are from sample grant proposals posted to
  Candid Learning (https://learning.candid.org), a resource site for nonprofit organizations formerly
  known as GrantSpace. Candid Learning requires registration, but it is free and has a wealth of resources.
  The three samples shared in this chapter can be found on the sample proposal page: https://learning.candid.org/resources/sample-documents/?tab=tab-fullproposals.
  Some of these proposals even include feedback from the funder describing why the proposal is effective.</p>

  <p>We have also used the WPA/CompPile bibliographies for annotated bibliographies (https://wac.colostate.edu/comppile/wpa/).
  The Michigan Corpus of Upper-Level Student Papers (MICUSP) (https://micusp.elicorpora.info/) includes
  successful student writing in a variety of genres by upper-level undergraduates and graduate students.
  Former student work can also make for excellent (and varied) samples for moves analysis.</p>

  <p>For further discussion on carrying out moves analysis activities, see chapter 2 of Sunny Hyon’s Introducing
  Genre and English for Specific Purposes and chapter 4 of Christine M. Tardy’s Genre-Based Writing: What
  Every ESL Teacher Needs to Know.</p>

  <h3>Discussion Questions</h3>

  <p>1. The authors of this chapter present a brief moves analysis of “student absence emails.” Why do
  you think these moves have become typical of this genre? If you have written a similar email recently,
  discuss how or if your moves align with the moves described in the chapter. How might your relationship
  with your professor affect the moves you use in such an email? What other factors might affect your
  use of different moves, or even your language choices within those moves? How might the moves in an
  absence email compare to a “grade change request” or an “appointment request” email to a professor?</p>

  <p>2. After analyzing student absence emails for moves, write three samples: one that you think is “prototypical”
  of this genre, one that you think would be poorly received by the instructor, and one that is not standard
  but would be especially successful. What did you learn from writing these samples? How did your moves
  analysis inform the choices you made in writing?</p>

  <p>3. The discussion of the grant proposal Statement of Need suggests that audience awareness is important
  in deciding which moves may be obligatory and, perhaps, where innovation might be acceptable or even
  encouraged. What other factors might you consider when determining which moves will be effective in
  the genre you are writing?</p>

  <p>4. Think about a time when you felt like you had to bend or transform the conventions of a genre
  in order to achieve your purpose. How did you make choices about which moves or conventions were necessary
  to keep, and which could be adapted?</p>

  <p>5. Gather a few samples of a genre from a discourse community you belong to and conduct a brief moves
  analysis. What is the action this genre carries out and how do the moves help it achieve that action?
  What can the common moves tell you about how structure and language create and reflect this community?</p>

  <p>6. Some genres tend to be more open to variation than others, including in their use of moves. Make
  a list of genres that you think are more open to variation and those in which bending the norms may
  be riskier. What kinds of things might affect your choices as a writer to depart from common moves or
  other features of a genre?</p>'
