  <p>Teaching Resources for The Importance of Transfer in your First Year Writing Course</p>

  <p>Overview and Teaching Strategies</p>

  <p>The goal of this essay is to introduce students to the transfer of writing knowledge and practices
  by offering some very common misconceptions about writing, ways to possibly overcome them, and revised
  “truths” about writing. As transfer research shows, one of the most important things we teachers can
  do for students in a first year writing course is to introduce the concept of transfer early on and
  to keep circling back so that students are aware that what they are learning is important for their
  future (whether that’s a current future, such as another class where they have a writing assignment,
  or the far off future, such as for a job). It’s also important to call it “transfer” so that students
  understand that what they are learning does and can move forward with them. Terminology gives them a
  way to verbalize their understanding. The assignments shared are examples of ways to reiteratively build
  upon students’ prior experiences, knowledge(s), dispositions, attitudes, etc. Because many students
  enter our classrooms with a “prior” understanding that conflicts with what they are currently learning,
  it’s important to keep returning to questions and having students reflect on those questions so that
  they begin to develop an awareness that there is more to learn about writing. This in turn helps them
  to understand more about what writing is and how they might go about framing a writing situation.</p>

  <h3>Discussion Questions</h3>

  <p>1. What does it mean to “transfer” writing knowledge and/or practices forward?</p>

  <p>2. What are some common misconceptions about writing?</p>

  <p>3. How might a writer overcome some of these misconceptions?</p>

  <p>4. Why is transfer important in a first year writing course?</p>

  <p>5. What was/is your biggest misconception about writing? How has it helped/hindered your ability
  to learn more about writing?</p>

  <p>6. Building on what the article suggests, what would be a revised truth about writing that you’ve
  learned in college?</p>

  <h3>Activities</h3>

  <p>The assignments below are meant to be scaffolded so that they build upon one another.</p>

  <p>Reflection Activity (Completed during Week 1 of the Semester/Quarter): In this introductory reflection
  to the course, to each other, and to your professor, please explore what’s called “the prior”: your
  previous relationship with writing, your understanding about writing, how you identify as a writer,
  and any previous attitudes and/or dispositions that you may have towards writing. Discuss in detail
  what writing is to you, what makes writing successful for you, and how it functions in your life by
  pulling from your prior experiences with it.</p>

  <p>Some Questions to Help with Your Thinking • What are some readings that have really helped define
  what writing is to you? • What are some key terms by which you understand writing? • What are some moments
  that have helped define who you are as a writer? • What is writing to you in day-to-day activities?
  • What type of writer do you see yourself as?</p>

  <p>Conceptual Map on Writing (Completed within the First Month of the Semester/Quarter): In this iteration
  of your map, you’ll be creating an actual map—the literal definition of “map.” Some examples: a road
  map; a world map; a map of a building; a treasure map; etc.</p>

  <p>The questions that are guiding your map are also guiding this course: 1. What is (good) writing?</p>

  <p>2. How have your prior experiences impacted your understanding of good writing?</p>

  <p>3. What set of key terms do you think about before writing?</p>

  <p>As you can see, you’ve already thought about most of these questions in some way or another with
  some of our readings and activities. To create this iteration of your map, begin by pulling out your
  key terms for writing. They will serve as your “getting-from-one-point-to-another-point” (i.e. the type
  of map you are creating serves the purpose of getting someone or something to a particular point). Right
  now, it doesn’t matter what terms you use, so long as they stem from terms that you think about before
  you begin to write and/or that guide your writing practices; they’ll serve as your starting point for
  the course and for your mapping projects.</p>

  <h3>Plot the Key Terms on a Map</h3>

  <p>The goal is to show the connections between, among, and around the key terms for you (the for you
  part is important!).</p>

  <h3>Then please respond to these reflection questions:</h3>

  <p>1. Defend your map. How does what you created represent a conceptual map of writing, specifically
  how you understand writing (at this point in the quarter)? Feel free to pull from readings, class discussions,
  and/or your writing activities to aid your defense.</p>

  <p>2. Discuss how your prior experiences with writing are/continue to impact how you understand good
  writing. Be specific—what prior experiences most influence your set of key terms and why?</p>

  <p>3. Come to one conclusion after completing this mapping activity; what that conclusion is can be
  anything—perhaps you learned that you don’t really think enough about writing before you actually write;
  perhaps you are still influenced heavily by your prior experiences with writing; perhaps you are confused
  and need more time to think.</p>

  <p>Theorizing about Writing (completed a month after the map above):</p>

  <h3>Key Terms for Writing</h3>

  <p>Building on your first reflective writing activity and your first map, what are your key terms for
  writing? How have they changed and/or evolved since the first week of the semester/quarter? How does
  understanding these key terms expand your writing practices? How do these terms help you to understand
  what writing is and how it functions within your own life?</p>

  <h3>Writerly Identity</h3>

  <p>Who are you as a writer? How would you define your writerly identity? What does that look like to
  you? How does considering key terms contribute to the development of your writerly identity?</p>

  <h3>Moments</h3>

  <p>Please conclude this reflective activity by generating three “moments.” These moments can be anything
  that helped you achieve active learning, an “a-ha!” moment, and/or connections you’ve made in/outside
  the classroom. Within these three moments, you are going to describe, explain, explore, and/or create
  a response to what you are learning in this course that helps you understand writing in a broader context
  and that helps you understand yourself as a writer and thinker.</p>

  <p>The Writerly Identity (completed towards the conclusion of the semester/quarter):</p>

  <p>Throughout the past semester/quarter, you have been thinking and theorizing about your understanding
  of writing and your identity as a writer. For this reflective writing activity, please discuss who you
  believe you are as a writer. You have to do this in a non-traditional way so that you are not merely
  responding to questions. Begin by thinking about some characteristics that define who you are as a writer.
  What are they? Then decide how you want to represent this.</p>

  <h3>Some Suggestions for What You Could Create to Get Your Point Across</h3>

  <ul><li>a job wanted ad or a personal • an obituary • a short short (a piece of fiction that is super
  short) • a song • a narrative poem (shorter poems will not count)</li></ul>

  <p>The possibilities are very open, but the end result must be representative of who you are as a writer.</p>

  <h3>Once You Complete This, Please Do a Quick Reflection</h3>

  <p>Why did you pick the characteristics that you did? What has influenced your writerly identity (include
  both past experiences and current experiences)? What’s been a memorable college writing experience that
  has impacted your writerly identity and why this experience? Sum up how you view yourself as a writer.</p>'
