  Literacy and the Rhetoric of Public Engagement. Southern Illinois University Press, 2008, pp. 9-43.
  Gere, Anne Ruggles, ed. Developing Writers in Higher Education: A Longitudinal Study. University of
  Michigan Press, 2019. JSTOR, http://www.jstor.org/stable/j.ctvdjrpt3.4. Koch, Stephen. Modern Library
  Writer’s Workshop: A Guide to the Craft of Fiction. Random House, Inc., 2003. Zimmerman, Barry, and
