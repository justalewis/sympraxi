  <h3>Refines for the Target Audience</h3>

  <p>One of the finer aspects when you get to the actual composing stage of things is making decisions
  about how much detail to share and what level or language to use. In the previous case, now that you’ve
  decided about the types of sources you’ll be including, you now need to ascertain how you’ll be framing
  the review and how deep to go into them. Should you spend one sentence summarizing a source or 600 words?
  That depends on the genre and the amount of space you have. The most astute literature reviews also
  attend—not surprisingly—to the audience’s needs; the language and assumptions about what they know need
  to be as tailored as possible. The research now needs to be refined, like that fancy wine filter thingy
  that elegant folks use at wine and cheese parties. I’m sure it has a name.</p>

  <p>So, for this you’ll really have to think hard about what you know about your audience so you can
  further improve their reading experience. If the development team are the “techy” people in the organization,
  what about them? Are they computer scientists? Data scientists? Web designers? Coders? Do they have
  college degrees? What are the types of technology they typically deal with? You need to find out as
  much as you can about them.</p>

  <p>I see this issue all the time in academic papers. I’ll assign a journal article for students to read
  and when it comes time to cite or reference that work in their paper, they assume the audience knows
  exactly who the authors are and what the field is. Even though I am the actual reader, assignments that
  ask students to “write to a more public audience” still suffer from this assumption. It’ll often go
  like:</p>

  <p>As Stephens et al. (2015) write, the field of UX is an important consideration of SLR viewers . .
  .</p>

  <p>Not wrong, necessarily—but misguided. First of all, would the public know who Stephens et al. are?
  Are they scholars? And of what? Have they written about this before? Are they emerging or renowned scholars?
  And, also, what are UX and SLR? Are those acronyms? When summarizing a piece for a literature review,
  you need to absolutely calibrate your level of writing and modify your assumptions about pre-existing
  knowledge of the readers.</p>

  <p>There is a big difference, then, in writing a summary of the NOAA tool for a group of data scientists
  than for web designers. For data scientists, you might summarize the NOAA tool as:</p>

  <p>NOAA’s Sea Level Rise Viewer is part of their Digital Coast project, an online repository of oceanographic
  and marine data accumulated using LiDAR technology, tide gauges, climate projections, and historical
  trends data sets.</p>

  <p>“Projections, “data sets,” and “repository” would be recognizable language for data scientists, most
  likely, regardless of their area of expertise.</p>

  <p>And it also highlights what they would be interested in, which are the data underlying the tool.
  A web designer audience, on the other hand, would most likely want to know what these tools look like
  and what web elements exist. It might go something more like this:</p>

  <p>NOAA’s Sea Level Rise Viewer is part of their Digital Coast project, which seeks to engage a more
  public audience as well as city and coastal planners by visualizing sea level rise data in an interactive
  map that allows for personalization and exploration.</p>

  <p>In this case, the web designers would want to know about target audiences and users as well as the
  visual aspects of the tool—essentially, how it would be used. Notions of audience, “personalization,”
  and “exploration” would be familiar concepts to web designers.</p>

  <h3>Practice</h3>

  <p>But how do you get to know your audience so well? Sometimes it is useful to create an audience profile
  sheet. This sheet can be filled in based on what you and your team already know about the audience or
  by asking them directly. An audience profile sheet might ask the following questions:</p>

  <ul><li>What are the job titles of the readers? • What are their backgrounds (majors in college, etc.)?
  • What are their areas of expertise (GIS, web development, research, etc.)? • What do they currently
  know about this topic? • What do they want to or need to know about this topic? • What are they expecting
  this piece of writing to look like?</li></ul>

  <p>Exhausted yet? Well, yes, writing effectively after conducting copious amounts of research isn’t
  for the faint of heart. But the next function should bring this party back to life! (Even if it does
  begin with an archaic word . . . )</p>

  <h3>Transmutes Into Trust</h3>

  <p>We should probably define transmute, eh? OK, Merriam-Webster (2020) defines it as such: “to change
  or alter in form, appearance, or nature and especially to a higher form.” (Which is probably what we
  wanted to do after embarrassing ourselves at the party by sharing our opinion on the new local coffee
  shop app, am I right?) This notion of alteration or change in our context pertains to the fact that
  a useful, well-research, tailored literature review meets your readers’ needs, yes, but it also imbues
  yourself as an author with a degree of trustworthiness. Conducting copious amounts of research, adjudicating
  it, and then adapting your summary of said sources to your audience, whom you actively sought to learn
  more about, brings about the positive net result of the reader knowing what they need to know but now
  also trusting your judgment.</p>

  <p>This is why literature reviews are more than just the banal task that feels like a formal requirement
  in papers. Done well, literature reviews are just as persuasive as the argument or position or proposal
  you lay out because, rhetorically speaking, ethos (your credibility and character) matters. Perhaps
  you’ve had this experience where two people have presented the same argument or provided the same advice
  to you, in the exact same form and construction, but because it came out of one person’s mouth and not
  the other, it spurred you to change or consider it—most likely because you trust one person over another.
  The source of an idea matters, and we have both conscious and unconscious ways we trust people and their
  ideas. If a well-written literature review can increase the degree of trust in your reader, then why
  not do this work? You might have a savvy argument but if you cannot show the reader that you are aware
  of the research on that topic that came before you, then why would someone believe you?</p>

  <p>Let’s say, for example, that you have an internship with your local city government in their office
  of elections. You notice that on their website they include flyers educating college students on how
  to register to vote. These flyers are poorly designed; you ask your director if you can take a shot
  at revising them knowing what you know about usability, accessibility, rhetoric, and document design.
  Your director agrees, but she’ll need first to see an informal proposal of why this work needs to be
  done before she can approve such a time-consuming project and take you away from other tasks. In essence,
  she needs to know that she can trust that what you’re doing is worthwhile.</p>

  <p>You begin work on the proposal, which has the fairly clear purpose of persuading your director that
  design is important in voter documentation materials. But how to communicate that purpose? You get the
  sense that your director is content with having the information on flyers, regardless of form or design.
  The information is accurate after all, so why should we spend any time on revising them, on redesigning
  them? All fair questions, to be sure.</p>

  <p>You begin to realize that the type of research your director will need to see is research on the
  positive impact on well-designed voter documentation materials—ranging from brochures, to flyers, to
  ballots. She knows accurate voter documentation materials are important, of course, but perhaps not
  that much about the importance of well-designed ones. More than that, she’ll need to trust that you
  know what you’re talking about. So, this is less about overwhelming your director with evidence after
  evidence but more about eliciting trust by establishing shared interest. And this can happen even within
  the context of a low-stakes informal proposal. You begin to cull the resources from your undergrad courses
  in writing and design, knowing that a well-researched proposal will give your director the faith and
  trust required to have you move forward with this project.</p>

  <h3>Practice</h3>

  <p>One strategy is to reach out to someone that you yourself trust on the given topic and have them
  review what you’ve written. A brief peer review from an expert in that field will help ensure you are
  depicting the field or topic well.</p>

  <h3>Yokes You to Others</h3>

  <p>Another odd, archaic word? Really? Yes, really. Back to the dictionary: Yoke is defined in many senses.
  The first is: “a wooden bar or frame by which two draft animals (such as oxen) are joined at the heads
  or necks for working together” (“Yoke”). Are there oxen at this party? Maybe. Maybe not. But the essence
  of it is there, and more evident in the last primary definition: “a clamp or similar piece that embraces
  two parts to hold or unite them in position.” That should be clearer. The literature “yokes” you to
  others by uniting your voice with theirs, even if it is in agreement or disagreement.</p>

  <p>This is different than the first function of participation. Yoking yourself to others means the literature
  review lets readers know the individuals and texts and projects and ideas you think are important and
  should act as a lineage for your current piece of writing. In some cases, you don’t have much of a choice
  in a key scholar or practitioner to cite. It is hard, for example, to talk about design and user experience
  without at least tipping your hat to Donald A. Norman, author of The Design of Everyday Things. And
  in most cases being yoked to Norman’s work is in your best interest, since it connects you to a major
  text and instills the audience with your credibility for knowing who the key people are in the field
  of study at hand.</p>

  <p>In other cases, you have more leeway in choosing the folks you’d like to unite with. There is power
  in the literature review because by selecting one source or another, you are telling the reader: “This
  is how the story goes and who has written it so far.” There is power in these decisions. In this sense
  you are not only participating in a conversation and selecting the sources, you are, theoretically,
  in some cases, actually becoming a part of the collective of thinkers who care about this topic. You
  are no longer a passive spectator but rather an active participant, yoked to folks who also care. You
  are oxen tilling fields of knowledge.</p>

  <h3>Practice</h3>

  <p>Select two sources that are closely related, either in argument or method. Review the sources they
  reference or cite in their own work, and ask: Are they the same? Different? Why or why not?</p>

  <h3>Conclusion</h3>

  <p>Before we finish, you should know that there is a popular concept created by famous rhetoric scholar
  Kenneth Burke called “the unending conversation.” He uses the metaphor of a parlor to help describe
  how argument works, and I think it is a useful way for you as a student to understand literature reviews
  as well:</p>

  <p>Imagine that you enter a parlor. You come late. When you arrive, others have long preceded you, and
  they are engaged in a heated discussion, a discussion too heated for them to pause and tell you exactly
  what it is about. In fact, the discussion had already begun long before any of them got there, so that
  no one present is qualified to retrace for you all the steps that had gone before. You listen for a
  while, until you decide that you have caught the tenor of the argument; then you put in your oar. Someone
  answers; you answer him; another comes to your defense; another aligns himself against you, to either
  the embarrassment or gratification of your opponent, depending upon the quality of your ally’s assistance.
  However, the discussion is interminable. The hour grows late, you must depart. And you do depart, with
  the discussion still vigorously in progress (Burke 110-111).</p>

  <p>Certainly, my use of “P-A-R-T-Y” relies on Burke’s inspiration. The similarity of this description
  to mine in the first function, participation, wherein you argue about the social function of local coffee
  shops is obvious. The main difference I wanted to make is that in Burke’s construction, there is success.
  In ours, there is not.</p>

  <p>Imagine, though, if I did not cite Burke here? I’m sure even the professor who assigned you this
  chapter was thinking at some point, “Hmmm . . . odd how Dan doesn’t mention Burke’s parlor at all here
  even though he is borrowing heavily from it . . . Especially since his Ph.D. is literally in rhetoric.”
  And that’s just it. While not in the form of a literature review, my reference and acknowledgment of
  Burke saved face a little. It bolsters my ethos in the fields of rhetoric and technical writing, and
  also gives you, the reader, trust that I am at least giving guidance of some value, since I have yoked
  myself to one of the forbearers of modern rhetoric.</p>

  <p>It might feel as though writing is a solitary activity because so much of it is done alone. But writing
  is always a social activity—writers are never alone (Ede). It may seem as though your argument about
  the value of a government policy, or your analysis of a text is your own. But the literature review
  portion of a document is the main connector of your work to others’. Without acknowledging the arguments
  that came before you, or the research conducted prior to your own, or how you have been influenced by—even
  indebted to—other ideas from other writers, your argument goes nowhere. Use this as a mindset while
  you are finding sources. Researching for sources is not a banal task but a basic guideline for participating
  in something bigger.</p>

  <p>And that, to me, is worth popping a bottle over. Cheers to literature reviews!</p>

