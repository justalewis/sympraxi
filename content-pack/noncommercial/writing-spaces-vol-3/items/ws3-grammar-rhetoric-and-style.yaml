  Standardization of Error.” PMLA, vol. 125, no. 1, 2010, pp. 92–106. JSTOR, www.jstor.org/stable/25614438.</p>

  <p>Kolln, Martha. Rhetorical Grammar. Longman, 2003. Micciche, Laura R. “Making a Case for Rhetorical
