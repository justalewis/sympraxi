  <p>3. Consider your language background and history. To what extent has your language use and literacy
  changed through your participation in a specific discourse community? If you are/are not a monolingual
  English speaker, for example, how does this interact with your membership in and access to the discourse
  communities where standard English is expected?</p>

  <p>4. Why do we use the Englishes that we do in particular discourse communities? How is audience a
