  <p>Teacher Resources</p>

  <p>Overview and Teaching Strategies</p>

  <p>Over the past few decades, visual forms of communication have increasingly been recognized as a central
  component of technical communication practice. More specifically, we no longer think of visuals as just
  ‘aids’ that simply illustrate or otherwise merely support the written content in a document. Rather,
  visual communication is its own powerful semiotic mode that works with other modes—writing, speaking,
  gesturing—to convey particular meanings. At the same time, visuals also construct and communicate ideas
  independently from these other modes. Indeed, we often encounter visuals that we have never seen before—the
  lead photograph in an online news story, a catchy YouTube video advertising the latest iPhone, a picture
  a friend just posted to social media—that we immediately understand because we are familiar with the
  context. And because we are unconsciously drawing from our own cultural knowledge to create that meaning.</p>

  <p>Given the ubiquity and importance of visual communication, this essay can be taught alongside instruction
  in the major genres in technical and professional communication—reports, proposals, instructions, descriptions,
  definitions. Today, all of these documents are likely to use visuals to convey concepts and information.
  This chapter explains to students how several commonly-used visual forms work and provide strategies
  for taking a rhetorically informed approach in their composing practices. The main take-away then for
  students reading this chapter is to attend to creating visuals with the same level of effort and thought
  that they give to their writing. More specifically, students should assess the rhetorical situation.
  That is, they should carefully consider the audience for the visual, how the audience will use it to
  make decisions and take actions, and the interpretive context in which it will be viewed. Engaging in
  such rhetorical decision-making will help students determine how they can create visuals that will be
  effective and persuasive in meeting the information needs of their readers.</p>

  <h3>Discussion Questions and Activities</h3>

  <p>The following questions and activities prompt students to engage with the material in this chapter
  and can be done individually or in groups and then discussed together as a class.</p>

  <p>1. You have likely heard the well-known expression that this chapter draws its title from: “A picture
  is worth a thousand words.” Consider the differences between how we interpret pictures (i.e., imagery
  and other visuals) and how we interpret words. What can images convey that words cannot and vice versa?
  Are there areas of overlap? What might these be? Consider the assignment you are currently working on
  for this class and determine what information you need to present in writing and what information would
  most effectively be presented visually. Why? Be prepared to share your reasoning. 2. Find an advertisement
  (digital or printed) that has few if any words and read the ad using the information in the semiotics
  and/ or photography sections of this chapter. What visual signs do you see, and what do they mean? How
  do you know? If the ad uses pictures, why do you think the photographer chose the particular subject
  matter selected? How are you interpreting the camera angles used and the composition of the photograph?
  How do these choices add to the meaning of the ad? 3. Envision you are a manager at an investment firm.
  Your supervisor has asked you to prepare a report that analyzes the financial portfolios of your firm’s
  four most profitable clients. Visualize the data provided below that gives percentages for the portfolio
  for each company. Explain why you chose to visualize the data using a particular format and compare
  your visualization with those created by your peers. { Company A: mutual funds, 18.5; annuities, 32.8;
  real estate,</p>

  <p>3.1; stocks, 1.2; bonds, 44.4. { Company B: mutual funds, 20.3; annuities, 26.9; real estate,</p>

  <p>3.8; stocks, 4.0; bonds, 45.0. { Company C: mutual funds, 23.5; annuities, 23.8; real estate,</p>

  <p>7.3; stocks, 4.1; bonds, 41.3. { Company D: mutual funds, 20.3; annuities, 25.2; real estate, 9.6;
  stocks, 6.3; bonds, 38.6. 4. Find a short set of instructions (between 6-8 steps) that uses visuals
  that are difficult to understand. Assess the rhetorical situation and explain why the visuals are difficult
  to understand. Then redesign the visuals to address the issues you identified. 5. Envision that you
  want to buy a new smartphone, laptop, or tablet. Make a list of 3-4 criteria that are important to you
  in making this decision: cost, features, design, battery life, etc. Research your criteria and then
  create a visual that allows you to compare what you found. What product do you think you will choose
