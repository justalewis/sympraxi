  <p>5.6 Editing Focus: Verb Tense Consistency</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Apply various editing strategies to a draft in
  progress. • Implement consistent use of verbs in a draft in progress.</p>

  <p>When you edit, you make changes at the sentence level: phrasing, grammar, mechanics, and wording.
  Read your paper aloud to check for needed editing. Alternately, you could have your device read the
  paper to you if it has that feature. As you read or listen, if you notice that something does not sound
  quite right, your draft probably needs editing at that point. Additionally, if your electronic draft
  shows blue underlining, check whether you should accept the changes suggested by your software. Once
  you have thoroughly reviewed each sentence in your draft, read aloud or listen to the entire piece again
  to see how it flows, making any additional needed changes as you go along.</p>

  <h3>English Varieties and Verbs</h3>

  <p>This section focuses on English verb tense consistency when editing. Every English speaker converses
  in one or more forms of the language. In the past, people have referred to these forms as dialects.
  Today, linguists more commonly call them English varieties. Every English variety uses verbs, as do
  most languages. Verbs are the words that express the action in a sentence. Their most distinguishing
  feature is that they change according to tense—that is, they take on different forms to express action
  that happened in the past, happens in the present, or will happen in the future.</p>

  <p>As you edit your profile, you will need to match the English variety you use to the expectations
  of your audience. If your instructor is your only reader, you will probably need to use an English variety
  appropriate for an academic setting. If the instructor has asked you to write a profile to appeal to
  another audience, think about how the English variety you choose might connect better with that audience.</p>

  <p>In every English variety, the form of the verb changes to indicate whether something is happening
  currently or has happened already. These changes that indicate time differences are called verb tenses.
  If an action or description occurs now or occurs regularly, in the present time, writers use the present
  tense. Conversely, if the action occurred in the past and no longer occurs, writers use the past tense.</p>

  <p>Present tense: She walks to class. Past tense: She walked to class yesterday.</p>

  <p>In simple sentences such as these, choosing a verb tense is fairly straightforward. The author decides
  when to place the event in time and chooses the corresponding verb form. Although people easily use
  different verb tenses every day, getting them right in writing can be tricky at times. Writers may accidentally
  change from past to present tense within a text—or even within the same sentence—for no particular reason.
  Consider these examples:</p>

  <p>Sentence 1: I lost a glove on my walk, but I find it later. Sentence 2: I lost a glove on my walk,
  but I found it later.</p>

  <p>In Sentence 1, the verb lost places the action in the past; the present-tense verb find is not consistent
  with that pattern. The revision in Sentence 2 places all of the action in the same time frame: the past.
  Because changing the tense for no reason can confuse the audience, be sure to use the same verb tense
  throughout, whether events happen in the past or they happen in the present.</p>

  <p>However, you do need to change tenses to indicate a difference in time, and such differences occur
  often. This situation is why choosing verb tenses in writing can sometimes pose challenges for writers.
  If you are using the present tense in writing but you want to tell about something that happened in
  the past, you need to change tenses to make that time difference clear. Look at these sentences:</p>

  <p>Sentence 1: The artist uses bright colors in her paintings. She says that when she is a child, these
  colors attract her. Sentence 2: The artist uses bright colors in her paintings. She says that when she
  was a child, these colors attracted her.</p>

  <p>The writer is discussing the artist in the present tense, and the artist is speaking in the present
  tense. However, she is telling about her childhood, which took place in the past. Therefore, she and
  the writer use both past and present tense to make the time distinction clear. To put all events in
  the present tense would not make sense in such cases. Look at the verb tense consistency revisions Houston
  Byrd made to his essay in Focusing on the Angle of Your Subject. When he tells about his trip to the
  store, describes it, and refers to his interview with the owner, he generally uses—or has revised to
  use—the past tense, whereas most of the essay is written in the present tense.</p>

  <h3>Proofreading</h3>

  <p>Another type of editing is proofreading. When you proofread, you check for small details, such as
  typing mistakes, that need fixing. If your instructor has asked you to follow a given style guide, such
  as MLA or APA, make sure your draft is formatted according to those guidelines. If any words are underlined
  in red on your electronic document (indicating a misspelling), address those issues as you complete
  your draft. Lastly, read each sentence individually, starting at the bottom of the draft, to make sure
  your spelling and punctuation meet the requirements for the genre and audience.</p>

  <p>You may feel that you are not yet a strong enough writer to edit or proofread on your own. If so,
  take advantage of your instructor’s office hours or your college’s writing center for support in developing
  your work.</p>

  <h3>Practice with Verb Tense Consistency</h3>

  <p>Depending on your writing context, you may be asked to write mainly in either the past or the present
  tense. For example, MLA style asks writers to refer to textual materials in the present tense, even
  though they have already been written.</p>

  <p>With a peer partner, practice choosing the most effective verb forms in the following sentences.
  Complete the exercise twice—once for a text written mainly in the present tense, and once again for
  a text written mainly in past tense. Because events happen at different times, you may have a combination
  of tenses.</p>

  <p>1. Carla D. Hayden (writes, wrote) ________ about John Lewis’s courageous stance against injustice
  when he (led, leads) the Selma protests.</p>

  <p>2. People throughout the country (admire, admired) ________ John Lewis and (mourn, mourned) ________
  his death.</p>

  <p>3. In 1995, Hayden (receives, received) ________ the Librarian of the Year Award, and in 2016, she
  (is, was) ________ listed by Fortune magazine as one of the world’s 50 greatest leaders.</p>

  <p>To check your draft for verb tense issues, read your profile aloud to a peer partner. If you notice
  that some verbs are in the past tense and some are in the present, make them all one consistent tense
  throughout the text—unless they indicate a change in time, which they often do. Making your verb tenses
  consistent will help clarify your ideas for readers.</p>

  <p>5.7 Evaluation: Text as Personal Introduction</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Apply profile genre conventions for structure,
  paragraphing, tone, and mechanics to a draft in progress. • Evaluate your text according to a given
  standard.</p>

  <p>One way to think about a profile is this: you are personally introducing your subject to your readers.
  When making introductions in everyday life, people generally highlight preferences that will help the
  people being introduced relate more easily to one another. For example, you might mention a specific
  shared video game interest when introducing gamers, or you could mention an appreciation for a particular
  musician shared by the people being introduced. In a similar way, include information in your profile
  that will connect your subject to your audience.</p>

  <p>In addition to making a personal introduction, you are striving to meet the standards of the profile
  genre. The following rubric will help you assess your use of interviews, field research, and secondary
  research. It will also help you evaluate how well you have organized, written, and revised the draft.
  Lastly, the rubric will help you determine whether your draft meets the criteria for the profile genre,
  including subject, angle, and tone. Aim to revise your draft to meet the “Skillful” criteria for each
  area of focus.</p>

