  <h3>Drafting the Conclusion</h3>

  <p>For the conclusion, summarize briefly how the criteria you used led you to your evaluation, rephrase
  or validate your thesis, and make a recommendation.</p>

  <p>Conclusion example. Crazy Ex-Girlfriend is a refreshing take on the romantic comedy genre. It elevates
  comedy by using catchy, original songs to accompany clever dialogue. Though Rebecca is intense and extreme,
  her situation is relatable, and she comes across as more sympathetic than not, proving that people don’t
  have to be perfect to be deserving of love. The departures from the romantic comedy playbook leave the
  audience guessing what will happen next, ensuring the show never feels tired or stale. What comes after
  the grand gesture and big kiss? That’s a question this show tries to answer, and sooner than you might
  expect. If you’re looking for a new binge-worthy show, clear your calendar for the next week and give
  Crazy Ex-Girlfriend a try.</p>

  <p>Now, write your conclusion.</p>

  <p>Brief summary of criteria and evaluation: ________</p>

  <p>Restate or validate thesis: ________</p>

  <p>Make a recommendation: ________</p>

  <h3>Peer Review: Conferencing with a Partner</h3>

  <p>After you finish your draft, receiving feedback from a peer will help you identify the strengths
  and weaknesses in your review. Because writers sometimes find it hard to review their work from the
  perspective of their audience, peer feedback will help you see your writing in ways not obvious to you.
  As a peer reviewer yourself, try to offer suggestions to make the essay more like something you would
  want to read.</p>

  <p>To give and receive the most effective feedback, use the following guidelines:</p>

  <p>1. On your own draft, note the areas you are unsure about and where you especially want feedback.
  It’s a good idea to have specific questions so that your peer can focus on what you think will help
  you.</p>

  <p>2. When you are assigned a peer, read their essay at least once without commenting, just to get a
  sense of what the essay is about.</p>

  <p>3. Read the essay a second time. In the margins, add any comments or reactions to the essay. 4. Focus
  on the introduction and comment on its effectiveness.</p>

  <p>1. In what ways are the first few sentences engaging? 2. Would you want to keep reading to learn
  more? Why or why not? 3. In what ways does the introduction clearly establish what is being reviewed?
  Does it provide sufficient background information? In what ways does the thesis make a judgment or an
  evaluation with a reason that leads to the judgment or evaluation? 4. Mark what you think the thesis
  is. If you find no clear thesis, mark something for the writer to focus on to arrive at a thesis. 5.
  Jot down one or two prodding, open-ended questions to help the writer develop or revise the thesis.</p>

  <p>5. Next, focus on the body paragraphs. 1. Is enough background provided, either in the introduction
  or early in the body, to give you a complete sense of what the writer is evaluating? 2. If there is
  not enough background, jot down a few questions that could be answered with additional background and
  context. 3. What is the main point of each body paragraph? 4. In what ways do the main points support
  the thesis (my thesis is true because . . .)? 5. Do the body paragraphs contain specific, concrete details
  from the primary source to support the main points? 6. If the body needs more specific details, mark
  places where the writer can add more detail.</p>

  <p>6. Next, focus on the conclusion. 1. Does the conclusion clearly tie up the main points? 2. If not,
  how might the writer revise the conclusion?</p>

  <p>7. Although your task is not to edit the essay or mark every error, point out any consistent patterns
  of grammatical errors.</p>

  <p>8. When you have finished, summarize your comments at the end of the review by writing three things
  on which your peer can focus when revising.</p>

  <p>As you work, be detailed and specific in your comments so that your peer can use them to make revisions:</p>

  <ul><li>What specifically is working or not working? • Why is it working or not working? • What can
  the writer do specifically to revise?</li></ul>

  <p>If you are having trouble finding something to comment on, remember that you can make comments about
  what the writer does well. Be sure to explain in detail why you think it’s working. Be sure to consult
  Evaluation: Effect on Audience as well.</p>

  <h3>Revising: Maintaining Ownership</h3>

  <p>When you receive your reviewed essay, look over the comments. Remember that they are merely suggestions;
  your revisions are ultimately up to you. For example, a sentence fragment, while technically incorrect,
  could be an effective way to emphasize a point. It is your call to decide whether your use of language
  is appropriate for your audience and purpose. With that said, however, it’s possible your peer pointed
  out something you did not notice.</p>

  <p>As you revise, keep in mind the following success criteria. Ensure your essay has them:</p>

  <ul><li>Specific topic: The essay is about a specific TV show, film, book, podcast, video game, or other
  primary source(s).</li><li>Interesting lead: You show your audience why this topic interests you and
  try to capture their attention. • Thesis: You present a clear, debatable, and specific thesis about
  your topic. • Body: The body supports the thesis with clear main points. Summary is used effectively
  to provide background and context. • Specific details: You support your main points with relevant and
  ample details (in the form of quotations, paraphrases, vivid descriptions, etc.) from the primary source
  or sources as well as secondary sources, if you have used them. • Citation: Sources are cited correctly
  in the text.</li></ul>

  <p>7.6 Editing Focus: Quotations</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Explain the role direct quotations play in writing.
  • Select and integrate direct quotations into your writing.</p>

  <p>Direct quotation, or someone’s exact words, provide specific, concrete evidence from your primary
  and secondary sources. When reviewing a film or book, for example, you are likely to incorporate a number
  of direct quotations into your writing. Quotations are effective when they are used appropriately and
  correctly. For example, a general statement of observation such as “The candidate for senate gave a
  disastrous interview on TV last night” should be backed up with concrete evidence from the interview.
  To demonstrate how and why the interview was “disastrous,” you might give examples such as these: “When
  asked whether she supported ethics reform, Ms. Simpson did not give a direct answer. She stated, ‘I
  think ethics are important, and I hold myself to a high ethical standard.’”</p>

  <p>While quotations are covered more extensively in Punctuation, this section will introduce you to
  using quotations in a review.</p>

  <h3>When to Use Quotations</h3>

  <p>Use quotations to support a point you are making. Avoid using them to present a point. Don’t pepper
  your essay with randomly selected quotations because you think they make your essay look well researched.
  Instead, present your point, and back it up with a quotation.</p>

  <p>Using a direct quotation is effective in the following instances:</p>

  <ul><li>Because of its source, the quotation adds credibility to your point. ◦ Wearing a mask is the
  easiest thing we can do as individuals to stop the spread of COVID-19. According to Dr. Anthony Fauci,
  “There should be universal wearing of masks.” (Castillejo and Yang)</li></ul>

  <p>Because Fauci is the director of the National Institute of Allergy and Infectious Diseases (NIAID),
  his statement on mask wearing is credible evidence that supports the point.</p>

  <ul><li>Because the author makes a statement in a particular way, its meaning would be less effective
  if paraphrased. ◦ In his review of the Microclimate Air Helmet, critic Drew Magary injects humor by
  quipping, “No one at the vape shop cared that I was dressed like I was in an old Moby video.”</li></ul>

  <p>Using a direct quotation from Magary’s review illustrates his style of humor more effectively than
  a description or paraphrase of the joke.</p>

  <ul><li>Because the quotation contains important information, it is more effective than a paraphrase.
  ◦ Hurricane Harvey brought a record amount of flooding when it hit the Houston, Texas, area in 2017.
  Harvey’s rainfall “dumped an estimated 27 trillion gallons of rain over Texas and Louisiana during a
  6-day period.” (Griggs)</li></ul>

  <p>The direct quotation contains the exact statistics that show the record amount of flooding.</p>

  <ul><li>Because the quotation adds variety to the language and voice of the essay, it makes the most
  impact on the audience in its original form. For example, quote directly from a person you are writing
  about so that the audience imagines them speaking.</li></ul>

  <p>A teacher may have suggested you use details to “show instead of tell.” Quotations are one way to
  show your audience what you mean rather than tell them.</p>

  <p>Practice finding quotations to illustrate the following point. You can search the web or your college
  library’s article databases.</p>

  <p>Personal computing has evolved from a single desktop computer for the whole family to a truly “personal”
  relationship each individual has with their devices.</p>

  <p>Hint: Look for information about how the size of personal computers has changed, how the industry
  has introduced new devices, how many Internet-connected devices an average person owns, and how many
  different people use an Internet-connected device on average.</p>

  <h3>Embedding Quotations</h3>

  <p>In reviews particularly, you may want to use dialogue or narration as evidence to support a point.
  Because a quotation should illustrate or support your point, be sure to state clearly and in your own
  words the point you are making. A properly formatted quotation will contain the following:</p>

  <ul><li>Quote in exact words: Use ellipses (. . .) to omit irrelevant sections of a quotation or to
  shorten it. Use brackets ([]) to add information to a quotation to help it make sense. ◦ Original Quotation:
  “Cybersecurity is an important issue for businesses of all sizes. Every business from Fortune 500 companies
  to mom-and-pop stores has an obligation to protect customers’ sensitive data. Data breaches, such as
  the Target breach in 2014, have been known to erode trust.” (Flynn)</li></ul>

  <p>◦ Quotation using ellipses and brackets: “Cybersecurity is an important issue for businesses . .
  . Data breaches, such as the Target breach in 2014, have been known to erode [consumers’] trust [in
  the company].” (Flynn)</p>

  <ul><li>Correct punctuation: Use quotation marks (“”) to show exactly where the quotation begins and
  ends. This punctuation helps separate the quotation from your words and ideas and helps you avoid plagiarism.</li><li>Signal
  phrase: Simple attribution phrases like “Smith says” or “As Jones argues” are important to use with
  quotations so that the quotation is integrated into your own sentence. When quoting directly, set off
  the quoted material from the signal phrase, or speaker tag, with a comma, as in Example 1 below. When
  the quotation is broken up by a signal phrase, use quotation marks around the quotation and commas around
  the signal phrase. Place periods and commas that belong to the quotation inside the quotation marks.
  ◦ Example 1: Smith shows us the importance of good time management skills when she says, “90% of A and
  B students begin their essays at least two weeks before they are due” (Flynn). ◦ Example 2: “Many students,”
  Smith says, “leave insufficient time for writing assignments” (Flynn).</li><li>Parenthetical citation:
  Cite the source of your quotation with a correct parenthetical citation. See the MLA Documentation and
  Format to learn more about citation.</li></ul>

  <p>Practice using a quotation you found in the previous exercise by introducing the quotation with a
  signal phrase, stating the quotation, and punctuating it correctly. Then introduce the signal phrase
  in the middle of the quotation, and punctuate it correctly.</p>

  <p>7.7 Evaluation: Effect on Audience</p>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Explain how your writing uses common elements of the review genre. • Evaluate reviews for thesis,
  evidence, rhetorical choices, clarity, and language awareness by using a rubric. Essays follow a structure
  that includes the introduction and thesis, body paragraphs with main points supported by relevant evidence,
  and a conclusion. In addition, academic essays are generally written with a formal tone, use precise
  wording, and are carefully edited. Essays should be written with a specific audience and purpose in
  mind and adhere to the conventions of the discipline’s formatting guide (MLA in this case). However,
  as you have worked to develop your writing voice during this course, you may have elected to challenge
  some of these conventions for rhetorical purposes. Beyond following the typical structure of an academic
  essay, a good review essay will demonstrate knowledge of the elements of the review genre, as discussed
  in Glance at Genre: Criteria, Evidence, and Evaluation clear evaluation, specific criteria, and understanding
  of genre and context. The following rubric reflects the characteristics of an effective evaluation essay.</li></ul>

