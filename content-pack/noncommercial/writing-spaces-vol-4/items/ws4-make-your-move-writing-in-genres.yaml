body: '<h3>Genres</h3>

  <p>Brad Jacobson, Madelyn Pawlowski, and Christine M. Tardy</p>

  <p>Overview</p>

  <p>When approaching new genres, students often wonder what kind of information to include and how.*
  Rhetorical moves analysis, a type of genre analysis, offers a useful, practical approach for students
  to understand how writers achieve their goals in a genre through various writing strategies. In this
  chapter, we introduce students to moves analysis, first describing what it is and then explaining various
  strategies for analyzing moves. The chapter walks students through moves analysis with both a familiar
  low-stakes genre (student absence emails) and a less familiar professional genre (grant proposals),
  demonstrating how such an analysis can be carried out. The goal of the chapter is to familiarize students
  with rhetorical moves analysis as a practical tool for understanding new genres and for identifying
  options that can help writers carry out their goals.</p>

  <p>If you are like most students, you’ve probably had to miss a class at some point. Maybe you were
  sick, stayed up too late the night before, or just weren’t prepared. When you’ve found yourself in this
  situation, have you emailed your professor about your absence? If so, how much information did you share?
  Did you include an apology, or maybe an explanation of how you plan to make up any missed work?</p>

  <p>You may not realize it, but the email written to a teacher in this situation can be considered a
  genre. You’ve probably heard the term genre used in relation to music, film, art, or literature, but
  it is also used to describe non-literary writing, like the writing we do in our personal lives, at school,</p>

  <p>* This work is licensed under the Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International
  License (CC BY-NC-ND 4.0) and is subject to the Writing Spaces Terms of Use. To view a copy of this
  license, visit http://creativecommons. org/licenses/by-nc-nd/4.0/, email info@creativecommons.org, or
  send a letter to Creative Commons, PO Box 1866, Mountain View, CA 94042, USA. To view the Writing Spaces
  Terms of Use, visit http://writingspaces.org/terms-of-use.</p>

  <p>and at work. These genres can be thought of as categories of writing. These categories are based
  on what the writing is trying to do, as well as who it is written for and the context it is written
  in (Dirk; Miller). For instance, a condolence card or message carries out the action (or goal) of sharing
  your sympathy with someone. A student absence email lets a teacher know about an absence and might also
  request information for how to make up a missed class.</p>

  <p>You encounter many genres every day. In your personal life, these might include to-do lists, menus,
  political ads, and text messages to schedule a get-together. In school, you may write in genres like
  proposals, lab reports, and university admission essays. People in professions often write in highly
  specialized genres: nurses write care plans; lawyers write legal briefs; scientists write research articles,
  and so on. (For a more in-depth introduction to the definition and functions of genre, check out Dirk’s
  “Navigating Genres” chapter in Writing Spaces Vol. 1.)</p>

  <p>Texts within a genre category aren’t identical, but they often resemble each other in many ways.
  For example, they might use similar kinds of vocabulary and grammar, design features, content, and patterns
  for organizing their content. Because of these resemblances, we can often recognize texts as belonging
  to a particular genre—as in figure 1.</p>

  <p>Figure 1: Four-star restaurant review of Boca Tacos &amp; Tequila, posted April 19, 2020. Text reads:
  “The food was amazing! Had ‘The Burro’ hands down one of the best carne asada burros I’ve had. Extremely
  huge could easily feed two people. Their salsa was amazing as well. Jalepeño crème was delicious! It
  was a little on the pricey side $80 for 5 entrees but certainly very top notch food.” Yelp; Yelp.com,
  19 Apr. 2020, https://www.yelp.com/biz/boca-tacos-y-tequila-tucson</p>

  <p>If you recognized this text as a consumer restaurant review, you likely have read similar reviews
  before, and you’ve started to get a sense of what they “look like.” This is how genres work: When we
  repeatedly encounter texts within a genre, we get a sense of the language and content they tend to use,
  as well as how they arrange that language and content. Successful writers have a good idea of how to
  write effectively in particular genres— this means satisfying readers’ expectations for the genre but
  maybe also making a text fresh and interesting. Can you think of a time you had to write in a new or
  unfamiliar genre for the first time? You might have gotten stuck with where to start or what to include.
  Writing in a new genre can be hard if you don’t yet know the expectations for content, language, and
  organization. In this chapter, we’ll share a specific strategy that can help you through these kinds
  of challenges. More specifically, we will look at how to identify and analyze the rhetorical moves of
  a genre.</p>

  <p>What Are Rhetorical Moves?</p>

  <p>Most likely, the term rhetorical moves is new to you. It may sound intimidating, but it’s just a
  (sort of) fancy phrase to describe something you probably already do. Rhetorical moves—also just called
  moves—are the parts of a text that carry out specific goals; they help writers accomplish the main action
  of the genre (Swales). For example, a typical wedding invitation in the United States includes moves
  like inviting (“You are invited to attend…”) and providing venue information (“...at the Tucson Botanical
  Gardens”). These moves are necessary to carry out the genre’s main action; without an inviting move,
  an invitation could easily fail to accomplish its goal, and without a providing venue information move,
  attendees won’t know where to go! A wedding invitation can also include optional moves like recognizing
  parents (“Jordan and Jaime Taylor request your company at…”) or signaling appropriate attire (“Black
  tie optional”). Optional moves often respond to specific aspects of a situation or give writers a way
  to express certain identities or personal goals. Wedding invitations in different countries or cultural
  communities can have different common moves as well. In China, for example, wedding invitations often
  include the character for double happiness (囍).</p>

  <p>Even a text as short as a restaurant review can include multiple moves. The main action of a restaurant
  review is to tell other people about the restaurant so that they can decide whether to eat there or
  not, so the moves that a writer includes work toward that goal. The review in Figure 1 includes three
  moves:</p>

  <ul><li>evaluating the restaurant overall (“The food was amazing!”) • evaluating specific dishes (“...one
  of the best carne asada burros I’ve had…,” “Their salsa was amazing...”)</li><li>providing details about
  the price (“It was a little on the pricey side…”)</li></ul>

  <p>After looking at just one restaurant review, we don’t really know if these are typical moves or if
  they are just unique to this one consumer’s review. To understand what moves are common to consumer
  restaurant reviews (which might be a bit different than professional restaurant reviews), we need to
  look at many examples of texts in that genre. As a writer, it can be very useful to look for moves that
  are required (sometimes called obligatory moves), common, optional, and rare. You can also think about
  moves that never seem to occur and consider why that might be the case. For example, have you ever seen
  a wedding invitation mention whether this is someone’s second (or third) marriage? Or that mentions
  how much the wedding is going to cost? Those particular moves would probably confuse some readers and
  not help achieve the goal of the genre!</p>

  <h3>Analyzing Rhetorical Moves</h3>

  <p>Analyzing rhetorical moves is the process of identifying moves in multiple samples of a genre, looking
  for patterns across these texts, and thinking critically about the role these moves play in helping
  the genre function. To get started with moves analysis, you just need a few strategies we’ll show you
  throughout the rest of this chapter. We ourselves have used these strategies in situations where we
  had to write in unfamiliar genres. As a new professor, Madelyn recently had to write her first annual
  review report—a document used to track her career progress. The instructions she was given were a bit
  vague and confusing, so she gathered samples of annual reviews from her colleagues to get a better sense
  of the typical length and type of content included in this genre. One sample she looked at used an elaborate
  chart, which made her quite nervous because she had no idea how to make this kind of chart for her own
  report! But after realizing that this chart was not included in the other samples, she decided this
  move was probably optional and decided to not include it. In this case, understanding the typical moves
  of the annual review report helped Madelyn avoid unnecessary stress and feel confident her report would
  meet readers’ expectations.</p>

  <p>Before trying to figure out a complicated or unfamiliar genre, it will help to practice first with
  something familiar like a student absence email. Having received hundreds of these emails as professors
  (and written a few ourselves), we know this genre is characterized by some typical rhetorical moves
  as well as a great deal of variation. Let’s walk through the process of carrying out a rhetorical moves
  analysis.</p>

  <p>Identifying Typical Moves of a Genre The emails in Table 1 were all written by college students (referred
  to here by pseudonyms). We only share four samples here, but it’s better to gather 5-10 or even more
  samples of a genre to really get a sense of common features, especially when you are working with a
  more complex or unfamiliar genre. To identify typical rhetorical moves, first, you’ll want to identify
  the moves in each individual text you collect. Remember that a move is a part of the text that helps
  the writer carry out a particular function or action. For this reason, it is helpful to label moves
  with a verb or an “action” word. When you sense that the writer is doing something different or performing
  a new “action,” you’ve probably identified another rhetorical move. A move can be one sentence long,
  an entire paragraph, or even longer, and your interpretation of a move might differ from someone else’s
  interpretation. That’s okay!</p>

  <p>Rhetorical moves in four sample absence emails</p>

  <p>Sample 1</p>

  <p>Dear Dr. Pawlowski, [1] I just wanted to tell you that I will be absent from class today. [2] I have
  completed my mid-term evaluation and I have started my annotated bibliography. If I have any other questions
  I will ask my study partner! [3] Thank you, and I will see you on Friday! Sincerely, Jay Johnson</p>

  <p>Sample 2</p>

  <p>Dear Professor, [1] I am sorry but [2] today I am missing class [3] because I have to take my cat
  to the vet due to an emergency. [4] Could you let me know what I need to do to make up the missed material?
  [5] Thank you for your understanding, Layla</p>

  <p>Sample 3</p>

  <p>Good morning,</p>

  <p>I hope you had a wonderful spring break. [1] I am still experiencing cold symptoms from the cold
  I caught during the start of spring break. It was mainly from digestive problems (bathroom issues) coming
  from medication that [2] I had trouble coming to class yesterday. [3] I would like to apologize for
  any inconvenience I might have caused.</p>

  <p>[4] I am continually working on the final assignment that is due tomorrow. [5] If I am not able to
  turn it in on time, could I possibly have a 24 hour extension? If not, I understand. [6] Thank you as
  always and I hope to see you tomorrow.</p>

  <p>Best Wishes,</p>

  <p>Corey M.</p>

  <p>Sample 4</p>

  <p>Hi,</p>

  <p>[1] Sorry but [2] I won’t be in class today.</p>

  <h3>Ali</h3>

  <p>Look at how we labeled the moves in these four samples. We did this by first reading each sample
  individually and thinking about how different parts achieve actions. We then labeled these parts with
  verb phrases to describe the writer’s moves. In some texts, multiple sentences worked together to help
  the writer accomplish a particular goal, so we grouped those sentences together and labeled them as
  a single move (notice move 2 in Sample 1). Sometimes we found that a single sentence helped to accomplish
  multiple goals, so we labeled multiple moves in a single sentence (notice Sample 4). Don’t worry if
  you feel like you aren’t locating the “right” moves or labeling them appropriately; this is not an exact
  science! You might choose different labels or identify more or fewer moves than someone else analyzing
  the same samples. To find a fitting label for a move, it’s helpful to ask, “What is the writer doing
  in this part of the text?” To keep consistency in your labeling, it might also help to ask, “Have I
  seen something like this before in a different sample?” Looking at how we labeled the moves, would you
  agree with our labels? Do you see any additional moves? Would you have broken up the samples differently?</p>

  <p>After identifying moves in individual samples, the next step is to compare the samples, looking for
  similarities and differences to better understand what moves seem typical (or unusual) for the genre.
  Based on our labels in Table 1, what moves do you see most and least frequently? A table is useful for
  this step, especially when you are working with longer or more complex genres and want to visualize
  the similarities and differences between samples. In Table 2, we listed all of the moves found in the
  four samples, noted which samples included each move, and decided whether each move seemed obligatory,
  common, optional, or rare for this particular genre based on how often it appeared. If we noticed the
  move in every sample, we labeled it as “obligatory,” but if we only saw a move in one or two samples,
  we figured it might be more optional or rare. We need to be careful, however, about making definite
  conclusions about what is or is not a typical feature of a genre when looking at such a small set of
  texts. We would probably locate many more moves or develop a different analysis with a larger sample
  size. Nevertheless, check out our findings in Table 1.</p>

  <p>Table 1. Comparing moves across samples</p>

  <p>Move</p>

  <p>S. 1 S.2 S. 3 S. 4 Obligatory, common, optional, or rare?</p>

  <p>Informing the teach-</p>

  <p>Obligatory er that an absence</p>

  <p> occurred/will occur</p>

  <p>Apologizing for absence</p>

  <p>   Common</p>

  <p>Explaining reason for absence</p>

  <p></p>

  <p>Common</p>

  <p>Requesting an accommodation</p>

  <p></p>

  <p>Optional or rare</p>

  <p>Requesting information about</p>

  <p> missed material</p>

  <p>Optional or rare</p>

  <p>Taking responsibility for missed work</p>

  <p></p>

  <p></p>

  <p>Common</p>

  <p>Expressing gratitude   </p>

  <p>Common</p>

  <p>Understanding How Moves Help Carry out the Genre’s Social Actions</p>

  <p>We now want to consider how certain moves help the genre function. Start by asking yourself, “What
  does the genre help the readers and writers do?”</p>

  <p>and “How do certain moves help carry out these actions?” Keep in mind that a genre may serve multiple
  purposes. You might send an email to excuse yourself from an upcoming class, to explain a previous absence
  (see Sample 3), ask questions about missed material (see Sample 2), to request an extension on an assignment
  (see Sample 3), and so on.</p>

  <p>Based on Table 1, at least one move could be considered essential for this genre because it is found
  in all four samples: informing the instructor about an absence. This move helps the writer make the
  purpose of the email explicit. Sometimes this simple announcement is almost all that an absence email
  includes (see Sample 4). Can you imagine trying to write an absence email without mentioning the absence?
  Would such an email even belong in this genre? Along with a general announcement of the absence, students
  often include information about when the absence occurred or will occur, especially if they need more
  information about missed material.</p>

  <p>Some of the moves we labeled as optional or rare in Table 2 are not necessarily ineffective or inappropriate,
  but they might not always be needed depending on the writer’s intentions or the context of the missed
  class. Sample 2 includes a request for information about missed material, and Sample 3 includes a request
  for an accommodation. Do the emails with requests leave a different impression than the samples without?
  Do the writers of requests carry them out in similar ways?</p>

  <p>We could continue going through each move, looking for patterns and considering rhetorical effects
  by asking a) why each move is typical or not, b) what role each move plays in carrying out the genre’s
  purpose(s), and c) how and why moves are sequenced in a particular way.</p>

  <h3>Identifying Options and Variations in Moves</h3>

  <p>Variation across genre samples is likely to occur because of differences in context, audience, and
  writers’ preferences. But some genres allow for more variation than others. If you’ve ever written a
  lab report, you likely received very specific instructions about how to describe the materials and methods
  you used in an experiment and how to report and discuss your findings. Other school genres, like essays
  you might write in an English or Philosophy course, allow for more flexibility when it comes to both
  content and structure. If you notice a lot of variation across samples, this might mean that the genre
  you are looking at is flexible and open to variations, but this could also indicate that you need to
  label the moves more consistently or that you are actually looking at samples of different genres.</p>

  <p>Based on our observations and analysis, the student absence email appears to have some degree of
  flexibility in both content and organizational structure. There is variation, for example, in how detailed
  the students are in providing a reason for their absence. Sample 2 mentions an emergency vet visit,
  providing just enough detail to show that the absence was justifiable and unexpected. Sample 3 also
  includes an explanation for the absence, but the writer chose to include a far more personal and detailed
  reason (a cold caught on spring break and bathroom issues from medication? Perhaps TMI (too much information)?).
  There is also a great deal of variation in the structure of the emails or the sequence of moves. In
  Sample 3, the student doesn’t mention their absence until the third sentence whereas all the other writers
  lead with this information. What other differences do you see? How do you think a professor would respond
  to each email? Understanding your options as a writer and learning how to identify their purposes and
  effects can help you make informed choices when navigating a new or unfamiliar genre.</p>

  <h3>Identifying Common Language Features</h3>

  <p>Writers make linguistic choices to carry out moves, and oftentimes you’ll find similarities across
  samples of a genre. While there are seemingly infinite features of language we could analyze, here are
  some to consider:</p>

  <ul><li>verb tense • passive/active voice • contractions (e.g., it’s, I’m, we’re, you’ve) • sentence
  types • sentence structures • word choice • use of specialized vocabulary • use of pronouns</li></ul>

  <p>To dig deeper into the linguistic features of moves, we could take a few different approaches. First,
  we could view the genre samples side-by-side and look for language-level patterns. This method works
  well when your genre samples are short and easy to skim. We noticed, for example, that all four student
  absence emails use first-person pronouns (I, me, my, we, us), which makes sense given that this genre
  is a type of personal correspondence. Would it be possible to write in this genre without using personal
  pronouns?</p>

  <p>Our analysis could also focus on how language is used to carry out a single move across genre samples.
  Using this method, we noticed that in both of the samples that included requests to the teacher, the
  students use the auxiliary verb could to make their requests. In Sample 2, Layla asks, “Could you let
  me know what I need to do to make up the missed material?” In Sample 3, Corey asks, “Could I possibly
  have a 24-hour extension?” There are other possibilities for phrasing both questions more directly,
  such as “What do I need to do?” or “Can I have a 24-hour extension?” Why might it be beneficial to phrase
  requests indirectly in this genre?</p>

  <p>You don’t need to be a linguistic expert to analyze language features of a genre. Sometimes all it
  takes is noticing a word that seems out of place (like the use of the greeting “Hi” instead of “Dear
  Professor”) or finding a phrase that is repeated across genre samples. Or you might start with a feeling
  you get while reading samples of a genre: the samples might generally feel formal or you might notice
  a humorous tone. Noticing language features helps you more closely analyze how certain moves are carried
  out and to what effect.</p>

  <h3>Critiquing Moves</h3>

  <p>To critique means to offer a critical evaluation or analysis. By critiquing a genre, we are doing
  more than identifying its faults or limitations, though that can certainly be part of the process. We
  might also look for potential strengths of the genre and possibilities for shifting, adapting, or transforming
  it. The use of the greeting “Hi” in Sample 4 could be an interesting start to a critique about how formal
  this genre is or should be. While we understand why some professors find it too informal to be addressed
  with a “Hi” or “Hey,” we also see this move as evidence of how the genre’s norms and expectations are
  seemingly changing. We personally don’t find these greetings as jarring or inappropriate as we might
  have 5-10 years ago. Our reactions might have to do with our individual teaching styles, but email etiquette
  may also be changing more broadly. To pursue this line of inquiry, we could collect more samples of
  student emails written to other professors and maybe even talk to those professors about their reactions
  to informal email greetings. Or we could talk to students about why they choose to use formal or informal
  greetings in these emails. To conduct a critique or analysis of a genre, it is sometimes useful to gather
  more samples or more information about the context in which the genre is used. Talking to actual users
  of the genre is often especially useful (see how Brad’s students did this in the next section). Here
  are some questions to get you started on a critique of rhetorical moves (some have been adapted from
  Devitt, et al.’s Scenes of Writing):</p>

  <ul><li>Do all moves have a clear purpose and help carry out the social actions of the genre?</li><li>What
  is the significance behind the sequence of the moves? • What are consequences for the writer or other
  users if certain moves are included, or not? • Who seems to have freedom to break from common moves?
  Who does not? • What do the moves suggest about the relationship between the writers and users of this
  genre? How might this relationship impact the inclusion/exclusion of certain moves? • What do the moves
  suggest about the values of a broader community (i.e. a specific class, a specific institution, or the
  entire educational system of the region)?</li></ul>

  <p>A critique of moves might also lead you to find ways to express your own identity or bend more traditional
  conventions of a genre. For example, U.S. wedding invitations traditionally included a move which recognized
  the parents of the bride as the hosts of the wedding (e.g., “Mr. and Mrs. John Smith request the pleasure
  of your company at the marriage of their daughter [bride] to [groom]”). A critique of this move shows
  that it reflects a more gender-biased social view, in which a female is given to a male by her parents.
  Today, many (perhaps even most) couples omit this move entirely.</p>

  <h3>Applying Moves Analysis: Writing a Statement of Need</h3>

  <p>Moves analysis can help as you write in different classes or other personal or professional situations.
  Let’s take a look at how we can use moves analysis to approach a complicated or unfamiliar genre. You
  can use the chart in the Appendix as you follow along.</p>

  <p>In one of Brad’s writing courses, students used moves analysis when they wrote a grant proposal on
  behalf of a local nonprofit organization. Grant proposals are common in academic and professional contexts.
  The goal of a grant proposal (the action it hopes to accomplish) is to convince a funder to support
  a project or initiative financially. In other words, “give us money!” Each granting agency—the organization
  with the money—has its own expectations in terms of format, organization, and even word count for proposals,
  but most include similar sections: a Statement of Need, Objectives for the project, Methods of implementing,
  Evaluation, and a proposed Budget (“How Do I Write a Grant Proposal?”). We can’t discuss all of these
  sections here, so in these next few paragraphs, we’ll walk you through a brief moves analysis of just
  the Statement of Need section (we’ll call it the Statement), just as Brad’s students did.</p>

  <p>First, we need to understand what the Statement is hoping to accomplish and why it is important.
  According to Candid Learning, a support website for grant seekers, a Statement “describes a problem
  and explains why you require a grant to address the issue” (“How Do I Write”). This section lays out
  the stakes of the problem and proposes the solution. To learn more about how these Statements work,
  Brad’s class reviewed several samples from Candid Learning’s collection of successful grant proposals
  (“Sample Documents”). Let’s take a look at some of the moves students identified in three samples. These
  proposals were requesting funds for educational development in Uganda (Proposal from Building Tomorrow),
  an interpreter training center (Proposal from Southeast Community College), and community-based art
  programming (Proposal from The Griot Project).</p>

  <h3>Identifying Typical Moves in Statements of Need</h3>

  <p>First, Brad and his students identified moves in the individual Statements, using verbs to describe
  them. Then, we compared moves across the samples. Here are three of the moves we found:</p>

  <h3>Connect Proposal to Broad Social Issue</h3>

  <p>The writers included statistics or other data from credible sources as a way to establish the need
  or problem and connect to broader societal issues. Here are a few examples of this move in action:</p>

  <ul><li>UNICEF and USAIDS estimate that 42 million children in this region alone are without access
  to primary education. (Proposal from Building Tomorrow)</li><li>A study, published in January of 2006
  in the journal Pediatrics shows that ad hoc interpreters were much more likely than professionally trained
  interpreters to make errors that could lead to serious clinical consequences, concluding that professionally
  trained medical interpreters are essential in health care facilities. (Proposal from Southeast Community
  College)</li></ul>

  <p>Why do you think the writers reference respected sources, like UNICEF, USAIDS, and the journal Pediatrics?
  Brad’s students thought this move could both help the grant writer build credibility with their reader
  and show how the project will impact a social problem that goes beyond their local context. We did not
  see this move in all of the samples, so we’d say this move is common but not necessarily obligatory
  for this genre.</p>

  <h3>Demonstrate Local Need</h3>

  <p>Grant writers have to show the local problem their project is going to solve and why it’s needed.
  For example:</p>

  <ul><li>Officials in the Wakiso District of Uganda...estimate that 55% of the district’s 600,000 children
  do not have access to education. (Proposal from Building Tomorrow)</li><li>Statewide, 143,251 people
  speak a language other than English at home. In Lancaster County, that number is 24,717, up 260% since
  1990 (U.S. Census 1990, 2000, 2005). (Proposal from Southeast Community College)</li><li>As community
  constituents, we have observed a lack of after school and summer enrichment projects that utilize the
  power of art as a means of community unification. (Proposal from The Griot Project)</li></ul>

  <p>Students decided this move is obligatory because it’s in all of the samples. This makes sense because
  grant writers need to show why their project is important. Referencing outside sources appears to be
  common within this move, but not required. Why do you think referencing outside sources could be effective,
  given this move’s role in the genre?</p>

  <h3>Identify Solution and/or Impact</h3>

  <p>At some point in the Statement, usually at the end, the grant writer explains how their proposed
  project will meet the need they identified:</p>

  <p>By opening doors to new, accessible neighborhood classrooms, BT can help reduce the dropout rate,
  provide children with the opportunity to receive a valuable education, and be an instrumental partner
  in building a better tomorrow. (Proposal from Building Tomorrow)</p>

  <p>Brad’s students noticed this move in all of the Statements. Why do you think this move seems to be
  obligatory?</p>

  <h3>Understanding How Moves Help Carry out the Genre’s Social Actions</h3>

  <p>Given what we know about grant proposals and the Statement, these moves seem to be rhetorically effective
  when sequenced in the order described above: connect to a societal problem, demonstrate local need,
  and identify a solution or describe the impact of the proposed project. Using these three basic moves
  helps writers show that their proposed work is important and that they have a plan to solve a problem
  with the grant money. Understanding the Statement in this way led Brad’s students to conduct further
  research into issues like food scarcity and access to health care that affected their partner organizations
  so they could make connections to social issues in their Statements.</p>

  <h3>Identifying Options and Variations in Moves</h3>

  <p>The three moves identified were used in most of the grant proposals Brad’s students read. But students
  did notice variation. Remember that even when moves seem obligatory or common, they won’t necessarily
  be found in the same order. For example, one proposal identified the local need before connecting to
  a broader issue, and The Griot Project’s proposal did not include the connecting move at all, instead
  focusing solely on local knowledge to make their case. Why do you think this might be? Here, it may
  help to learn more about the audience. The Griot Project’s grant proposal was submitted to Neighborhood
  Connections, an organization that provides “money and support for grassroots initiatives in the cities
  of Cleveland and East Cleveland.” When the grant writers say, “As community constituents, we have observed…,”
  they are localizing their efforts and showing how their project can be considered a “grassroots initiative.”
  Understanding the audience can be one factor in understanding variation among samples.</p>

  <h3>Identifying Common Language Features</h3>

  <p>When students looked across the samples, they noticed personal pronouns like I, we, or us were optional
  or rare. In fact, the only personal pronoun was in the demonstrating local need move, where one organization
  referenced their own observation (“we have observed”) to demonstrate the local need. However, they shifted
  back to third person when identifying the impact (“the Griot Project will improve”), like the other
  samples. Why do you think the writers included themselves so explicitly in the text when demonstrating
  the local need, while the rest of the samples maintained a more distant position? What might be gained
  with this choice, and why might some writers hesitate? Why do you think all of the writers used third
  person pronouns when identifying the organization’s impact?</p>

  <p>Students also noticed a common sentence structure in the identifying move, which we called “By x-ing.”
  Each of the grant writers used a single sentence and a By x-ing phrase to connect the proposed intervention
  to an outcome. For example, “By opening doors...BT can help reduce the dropout rate…” (emphasis added).
  Why do you think this sentence structure seems to be common within this move?</p>

  <h3>Critiquing Moves</h3>

  <p>Staff members from an organization supporting economic development on Native American sovereign lands
  reminded members of Brad’s class that writing a grant proposal means representing an organization and
  the people and communities it serves. With this in mind, they asked students to emphasize the resilience
  of the community rather than perpetuate negative stereotypes in the grant proposals; they didn’t want
  a pity campaign. As a result of this conversation, students decided to highlight local conditions like
  a lack of grocery stores and access to transportation before introducing statistics about obesity and
  diabetes rates. They also included pictures of happy families to counter stereotypical images of poverty.
  In this way, critique of the genre led to subtle, yet important, transformation.</p>

  <p>Clearly, a moves analysis like this could go on for a while! Remember, we’re not looking for the
  “right” answer—we’re trying to understand the options that we have as we begin to contribute our own
  examples to the genre.</p>

  <h3>Producing and Transforming Genres using Moves Analysis</h3>

  <p>Carrying out a moves analysis is more than just an academic exercise. You can use this process whenever
  you need to write in a new genre. Maybe you are applying for summer internships and you are writing
  a cover letter for the first time. Instead of starting from what you think a cover letter might look
  like, you can find several samples and conduct a moves analysis to identify features of this genre.
  You might also want to try pushing the boundaries a bit. Sometimes, playing with moves or incorporating
  additional moves in a genre can lead to interesting innovations or new uses for a genre. For each writing
  situation, you’ll want to decide whether it makes sense to take some risks and be innovative or to stick
  with more typical approaches. Conducting a moves analysis can be your first step to considering how
  to carry out your goals, and maybe even expressing your individuality, in a new genre.</p>

