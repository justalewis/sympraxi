  <p>Literacy Narrative: Building Bridges, Bridging Gaps</p>

  <p>3</p>

  <h3>CHAPTER OUTLINE</h3>

  <p>3.1 Identity and Expression 3.2 Literacy Narrative Trailblazer: Tara Westover 3.3 Glance at Genre:
  The Literacy Narrative 3.4 Annotated Sample Reading: from Narrative of the Life of Frederick Douglass
  by Frederick Douglass 3.5 Writing Process: Tracing the Beginnings of Literacy 3.6 Editing Focus: Sentence
  Structure 3.7 Evaluation: Self-Evaluating 3.8 Spotlight on … The Digital Archive of Literacy Narratives
  (DALN) 3.9 Portfolio: A Literacy Artifact</p>

  <p>INTRODUCTION “Literacy is now understood as a means of . . . communication in an increasingly digital,
  textmediated, information-rich, and fast-changing world,” according to UNESCO. The literacy narrative
  is a genre that provides an account of an individual or a member of a community and their experience
  with learning.</p>

  <p>Combining the broad definition of literacy with the term narrative, or storytelling, produces the
  literacy narrative: a story that provides an account of a learning experience. As you begin to reflect
  on what it means to learn, particularly in a college setting, this chapter will guide you through an
  exploration of the various features of the literacy narrative genre to prepare you to write one of your
  own. One path to becoming familiar with the language of higher institutional learning, or the academy,
  is what professors like to call entering the academic discourse community. This phrase means that you
  begin to reflect on the experiences that have laid the path for your admission to this new community.
  In the traditional sense, when talking about literacy, people think of reading and writing. However,
  in the modern multimedia and kinesthetic world, the definition of literacy has been expanded to mean
  “competence in communication,” including a multitude of methods, modes, and texts. This emerging definition
  means that literacy includes the abilities to compose and interpret messages using images, visual arrangements,
  spoken words, and other modes beyond simple written texts. People are considered literate in almost
  any concentrated area in which they demonstrate knowledge and communicate proficiently.</p>

  <h2>LEARNING OUTCOMES By the end of this section, you will be able to:</h2>

  <ul><li>Use reading and composing for inquiry, learning, critical thinking, and communicating. • Discern
  the nature of identity in various rhetorical and cultural contexts. You likely express your identity,
  or ideas about who you are, through language. The language you use also signals the ways in which you
  are rooted in specific culture, or groups of people who share common beliefs and lived experiences.
  Because the ways in which people speak and write are closely intertwined with their self-images and
  community affiliations, you can think, communicate, and interact most freely with others by using your
  personal idiolect—that is, your individual way of speaking and writing—which is based in cultural language
  use. This section examines a few myths about language use and explores some productive ways to think
  about language and communication.</li></ul>

  <h3>Language and Identity</h3>

  <p>As members of different communities, most Americans speak and write in a number of English varieties
  without even thinking about doing so. Like others, you generally speak differently with friends than
  you do with elders. You usually use different types of language when texting on your phone than when
  writing a professional email. As you make these communication choices based on different settings and
  audiences, you signal your identity and culture through word choice, sentence structure, and use of
  language in specific situations. For example, when speaking with friends, you may engage in wordplay
  to show identification with the group. On the other hand, you may speak with respect to elders to show
  an identity as a well-mannered younger relative, and you may use a standard email format to show a professional
  identity. If you speak other languages, you may find yourself freely switching between English and those
  other languages when conversing with people who share the same linguistic abilities; these shifts from
  one language to another showcase your identity as a multilingual person. As author Gloria Anzaldúa (1942–2004)
  writes in Borderlands / La Frontera, “I will no longer be made to feel ashamed of existing. I will have
  my voice: Indian, Spanish, white” (59). Every time you communicate, you signal some aspect of your identity.
  In the same way that everyone has multiple, intersecting identities, everyone has multiple ways of expressing
  themselves through language. As members of a multiethnic, multicultural society, everyone should recognize
  and respect these personal ways of communicating, which are integral to a shared human experience.</p>

  <h3>Expressing Identity in Writing</h3>

  <p>Even though individuals speak and write effectively using different varieties of English, many people
  nevertheless believe that one standard, “proper” English variety exists and that this “correct” way
  of speaking and writing should be used universally in all settings. This viewpoint considers varieties
  of English outside the imagined norm to be “wrong,” “bad,” or “substandard.” For example, speakers of
  some southern U.S. English varieties are often judged as “poor” or “unintelligent.” Similarly, people
  who speak English with the accent of another language may be incorrectly assumed to be illiterate. If
  you speak and write using one of those undervalued English varieties, others may have judged you for
  your language use or told you that your writing is “wrong.” Even without such judgment, you may have
  felt apprehensive when sharing your writing with others; you may still fear a harsh assessment, or you
  may feel vulnerable when others read your compositions.</p>

  <h2>Literacy Narrative Trailblazer: Tara Westover</h2>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Use reading for inquiry, learning, critical thinking, and communicating. • Identify various
  types of literacy in the context of a literacy narrative.</li></ul>

  <p>“We are all more complicated than the role we are assigned in stories.”</p>

  <h3>Being Educated</h3>

  <p>In her 2018 best seller, Educated: A Memoir, Tara Westover (b. 1986) considers the effects of academic
  and nonacademic literacies in her life. She also contemplates the ways in which identification with
  certain literacies can both create and disturb an individual’s relationships and community memberships.
  While Educated addresses a variety of themes, including the tensions that family members must confront
  when they disagree, the memoir can be read largely as a literacy narrative.</p>

  <p>Early in her memoir, Westover discusses a range of literacies she developed as the youngest of seven
  children in a homeschooled family. Although she was taught to read, her literary world consisted almost
  exclusively of the Book of Mormon and other religious texts. Her other literacies included preserving
  food, preparing herbs, and caring for the animals on the family farm, located on an Idaho mountain.
  She felt a keen sense of belonging both to her family and to their mountain home. Westover also learned
  how to work in and survive the dangerous junkyard her family owned and operated. Even though many family
  members sustained a variety of horrific accidents and injuries over the years, mostly at the junkyard
  or in car accidents, the family relied entirely on natural remedies; both parents considered doctors
  and medicine to be sinful. Despite the range of literacies that Westover learned at home, her parents
  did not value formal schooling and were indifferent to the development of a broad understanding of science,
  history, or current events. The Westover children were almost entirely self-directed in their academic
  studies.</p>

  <p>As a young child, Westover fully embraced her parents’ beliefs that “government schooling” was wholly
  unchristian and equivalent to brainwashing. Her brother Tyler, however, had always loved “book learning”
  and decided to leave home to attend college. He could not fully articulate why he felt compelled to
  be the first to leave, and his departure intrigued Westover. She, too, began to think about pursuing
  higher education. After another brother became physically abusive toward her, Tyler encouraged her to
  use college as an escape. She then bought an ACT prep book, studied on her own, and did well enough
  on the exams to be accepted to Brigham Young University.</p>

  <p>Westover articulates in her memoir that once on campus, she realized how her haphazard homeschooling
  experience had left her with large gaps in knowledge and no preparation for studying and taking tests.
  As she improved her academic skills, she also learned methods of academic inquiry that were at odds
  with her parents’ faith-based interpretations of both world and personal events.</p>

  <p>As Westover gained a science-based worldview through her college experience, she struggled to integrate
  her new understandings with her family’s perspectives; in other words, her new literacies were at odds
  with her old ones. She still felt connected to her family, but her new understanding of the world was
  irreconcilable with her father’s survivalist, fundamentalist beliefs. When she refused to submit to
  her father’s will and return to his rigid worldview and interpretation of Mormonism, Westover’s relationship
  with most of her family members disintegrated. Instead, she used her academic literacies to examine
  the history of their religion in her doctoral research. All three Westover children who left the mountain—and,
  to some extent, their family—earned PhDs.</p>

  <p>For Westover, the schism with her family was not primarily the result of her literacy learning; rather,
  the relationship ruptured because she refused to repudiate her newfound knowledge as inferior to her
  family’s ways of knowing. In subsequent interviews, Westover has discussed the loss she felt in being
  cut off from her family and place of origin. Although many college students experience similar challenges
  when integrating new ways of encountering the world with their family’s views of “how things are” or
  “how things should be,” some families feel enriched by the new information, whereas others feel threatened
  by it.</p>

  <h3>Discussion Questions</h3>

  <p>1. What are some of the literacies that Westover learned while living at home? How might they conflict
  with the new ones learned away from home?</p>

  <p>2. How might literacy learning have the potential both to separate and to unite individuals and their
  communities?</p>

  <p>3. Do you think the Westovers with PhDs are more “literate” than the ones who remained at home? Explain
  your answer.</p>

  <p>4. How are literacy and gaining new literacies related? Ambition? Desire for knowledge? Rebellion?
  Dissatisfaction? Explain your answer.</p>

  <p>5. How do your childhood literacy experiences align with Westover’s? How do they differ?</p>

  <p>6. At this point in your college experience, have you had any encounters with ideas that conflict
  with the value system(s) with which you were raised, as Westover did? How do you envision navigating
  those differences?</p>

  <p>3.3 Glance at Genre: The Literacy Narrative</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Read and compose in several genres to understand
  how genre conventions shape and are shaped by readers’ and writers’ practices and purposes. • Match
  the capacities of different environments to varying rhetorical situations.</p>

  <p>Over time, people have developed specific ways of writing for particular rhetorical situations. These
  distinctive ways of writing can be referred to in part as genres. You may have heard the term genre
  in reference to publishing categories, such as novels or memoirs, but the term can refer to any type
  of writing that conforms to specific forms and benchmarks. Many genres include stories of different
  kinds—for example, folktales, short stories, accounts of events, and biographies. As author Jonathan
  Gottschall says in his 2012 book of the same title, humankind is “the storytelling animal”; people of
  all cultures have engaged in telling stories, both as storytellers and as audience members. Simply put,
  narrative stories are essential to many genres of writing.</p>

  <h3>Exploring Narrative: Elements of Storytelling</h3>

  <p>Narratives, whether about literacy or anything else, include these key elements: • Plot. Authors
  of narratives tell about one or more events. In fiction, the plot is the sequence of those events. In
  nonfiction, a plot is often referred to simply as the events, but nonfiction texts follow similar plot
  patterns, including exposition or introduction, a series of events leading to a climax or discovery,
  and events following the climax or discovery. • Characters. The events in the story happen to characters,
  or individuals who are part of the story. In nonfiction, these characters are usually real people. The
  audience should feel a connection to the main character or characters. Readers may like or dislike characters,
  blame them or feel sorry for them, identify with them or not. Skilled writers portray characters through
  the use of dialogue, actions or behavior, and thoughts so that readers can understand what these individuals
  are like. • Setting. Stories, fiction and nonfiction, take place in settings, which include locations,
  time periods, and the cultures in which the characters or real people are immersed. • Problem and Resolution.
  In narratives, the characters generally encounter one or more problems. The tension caused by the problem
  builds to a climax. The resolution of the problem and the built-up tension usually occurs near the end
  of the story. • Story Arc. Most narratives have a story arc—a beginning, a middle, and an end—but not
  necessarily in that order. The story arc, or order of events, may occur chronologically, or the story
  may begin in the middle of the action and explain earlier events later in the sequence.</p>

  <h3>Specific Details and Other Conventions</h3>

  <p>To immerse the audience in the story, authors provide specific details of the scenes and action.
  Many authors, and teachers, call this strategy “showing, not telling.” These aspects can include the
  following elements:</p>

  <ul><li>Sensory Details: Full, literal or figurative descriptions of the things that the characters
  see, smell, hear, touch, and taste in their surroundings.</li><li>Dialogue: Conversation between characters.
  • Action: Vivid portrayal of the events in the story. Writers often use short sentences and strong verbs
  to indicate physical or mental action. • Engaging Language: Sentence structure and word choices, including
  tone (vocal attitude of the narrator or characters), diction (language used by the narrator or characters),
  and varied constructions (different kinds of sentences), that provide specific, clear, and compelling
  information for the audience.</li></ul>

  <h3>Establishing the Significance</h3>

  <p>Most importantly, the audience must feel that the story has some significance. While the author’s
  main point may only be implied, rather than stated outright as in a conventional academic essay, readers
  should understand the point of the story and believe that it matters.</p>

  <ul><li>Audience. Narratives are designed to appeal to specific audiences; authors choose storytelling
  elements, details, and language strategies to engage the target audience.</li><li>Purpose. Authors may
  tell stories for different reasons: to entertain, to reinforce cultural norms, to educate, or to strengthen
  social ties. The same story may, and often does, fulfill more than one purpose.</li></ul>

  <p>3.4 Annotated Sample Reading: from Narrative of the Life of Frederick Douglass by Frederick Douglass</p>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Read in several genres to understand how conventions are shaped by purpose, language, culture,
  and expectation.</li><li>Use reading for inquiry, learning, critical thinking, and communicating in
  varying rhetorical and cultural contexts.</li><li>Read a diverse range of texts, attending to relationships
  among ideas, patterns of organization, and interplay between verbal and nonverbal elements.</li></ul>

  <h3>Introduction</h3>

  <p>In the case of Mr. Auld and Douglass, Douglass gives an account of Auld’s exact language in order
  to hold a mirror to the racism of Mr. Auld—and the reading audience of his memoir—and to emphasize the
  theme that literacy (or education) is one way to combat racism.</p>

  <p>LIVING BY THEIR OWN WORDS</p>

  <h3>Literacy from Unexpected Sources</h3>

  <p>From the title and from Douglass’s use of pronoun I, you know this work is autobiographical and therefore
  written from the first-person point of view.</p>

  <p>[excerpt begins with first full paragraph on page 33 and ends on page 34 where the paragraph ends]</p>

  <p>Very soon after I went to live with Mr. and Mrs. Auld, she very kindly commenced to teach me the
  A, B, C. After I had learned this, she assisted me in learning to spell words of three or four letters.
  Just at this point of my progress, Mr. Auld found out what was going on, and at once forbade Mrs. Auld
  to instruct me further, telling her, among other things, that it was unlawful, as well as unsafe, to
  teach a slave to read.</p>

  <p>Douglass describes the background situation and the culture of the time, which he will defy in his
  quest for literacy. The word choice in his narration of events indicates that he is writing for an educated
  audience.</p>

  <p>To use his own words, further, he said, “If you give a nigger an inch, he will take an ell. A nigger
  should know nothing but to obey his master—to do as he is told to do. Learning would spoil the best
  nigger in the world. Now,” said he, “if you teach that nigger (speaking of myself) how to read, there
  would be no keeping him. It would forever unfit him to be a slave. He would at once become unmanageable,
  and of no value to his master. As to himself, it could do him no good, but a great deal of harm. It
  would make him discontented and unhappy.”</p>

  <p>In sharing this part of the narrative, Douglass underscores the importance of literacy. He provides
  a description of Mr. Auld, a slaveholder, who seeks to impose illiteracy as a means to oppress others.
  In this description of Mr. Auld’s reaction, Douglass shows that slaveholders feared the power that enslaved
  people would have if they could read and write.</p>

  <p>Douglass provides the details of Auld’s dialogue not only because it is a convention of narrative
  genre but also because it demonstrates the purpose and motivation for his forthcoming pursuit of literacy.
  We have chosen to maintain the authenticity of the original text by using the language that Douglass
  offers to quote Mr. Auld’s dialogue because it both provides context for the rhetorical situation and
  underscores the value of the attainment of literacy for Douglass. However, contemporary audiences must
  understand that this language should be uttered only under very narrow circumstances in any current
  rhetorical situation. In general, it is best to avoid its use.</p>

  <p>These words sank deep into my heart, stirred up sentiments within that lay slumbering, and called
  into existence an entirely new train of thought. It was a new and special revelation, explaining dark
  and mysterious things, with which my youthful understanding had struggled, but struggled in vain. I
  now understood what had been to me a most perplexing difficulty—to wit, the white man’s power to enslave
  the black man. It was a grand achievement, and I prized it highly. From that moment, I understood the
  pathway from slavery to freedom. It was just what I wanted, and I got it at a time when I the least
  expected it. Whilst I was saddened by the thought of losing the aid of my kind mistress, I was gladdened
  by the invaluable instruction which, by the merest accident, I had gained from my master.</p>

  <p>In this reflection, Douglass has a definitive and transformative moment with reading and writing.
  The moment that sparked a desire for literacy is a common feature in literacy narratives, particularly
  those of enslaved people. In that moment, he understood the value of literacy and its life-changing
  possibilities; that transformative moment is a central part of the arc of this literacy narrative.</p>

  <p>Though conscious of the difficulty of learning without a teacher, I set out with high hope, and a
  fixed purpose, at whatever cost of trouble, to learn how to read. The very decided manner with which
  he spoke, and strove to impress his wife with the evil consequences of giving me instruction, served
  to convince me that he was deeply sensible of the truths he was uttering. It gave me the best assurance
  that I might rely with the utmost confidence on the results which, he said, would flow from teaching
  me to read. What he most dreaded, that I most desired. What he most loved, that I most hated. That which
  to him was a great evil, to be carefully shunned, was to me a great good, to be diligently sought; and
  the argument which he so warmly urged, against my learning to read, only served to inspire me with a
  desire and determination to learn. In learning to read, I owe almost as much to the bitter opposition
  of my master, as to the kindly aid of my mistress. I acknowledge the benefit of both.</p>

  <p>Douglass articulates that this moment changed his relationship to literacy and ignited a purposeful
  engagement with language and learning that would last throughout his long life. The rhythm, sentence
  structure, and poetic phrasing in this reflection provide further evidence that Douglass, over the course
  of his life, actively pursued and mastered language after having this experience with Mr. Auld.</p>

  <p>[excerpt continues with the beginning of Chapter 7 on page 36 and ends with the end of the paragraph
  at the top of page 39]</p>

  <p>[In Chapter 7, the narrative continues] I lived in Master Hugh’s family about seven years. During
  this time, I succeeded in learning to read and write. In accomplishing this, I was compelled to resort
  to various stratagems. I had no regular teacher. My mistress, who had kindly commenced to instruct me,
  had, in compliance with the advice and direction of her husband, not only ceased to instruct, but had
  set her face against my being instructed by any one else. It is due, however, to my mistress to say
  of her, that she did not adopt this course of treatment immediately. She at first lacked the depravity
  indispensable to shutting me up in mental darkness. It was at least necessary for her to have some training
  in the exercise of irresponsible power, to make her equal to the task of treating me as though I were
  a brute.</p>

  <p>My mistress was, as I have said, a kind and tender-hearted woman; and in the simplicity of her soul
  she commenced, when I first went to live with her, to treat me as she supposed one human being ought
  to treat another. In entering upon the duties of a slaveholder, she did not seem to perceive that I
  sustained to her the relation of a mere chattel, and that for her to treat me as a human being was not
  only wrong, but dangerously so. Slavery proved as injurious to her as it did to me. When I went there,
  she was a pious, warm, and tenderhearted woman. There was no sorrow or suffering for which she had not
  a tear. She had bread for the hungry, clothes for the naked, and comfort for every mourner that came
  within her reach. Slavery soon proved its ability to divest her of these heavenly qualities. Under its
  influence, the tender heart became stone, and the lamblike disposition gave way to one of tiger-like
  fierceness. The first step in her downward course was in her ceasing to instruct me. She now commenced
  to practise her husband’s precepts. She finally became even more violent in her opposition than her
  husband himself.</p>

  <p>Douglass describes in detail a person in his life and his relationship to her. He uses specific diction
  to describe her kindness and to help readers get to know her—a “tear” for the “suffering”; “bread for
  the hungry, clothes for the naked, and comfort for every mourner.”</p>

  <p>She was not satisfied with simply doing as well as he had commanded; she seemed anxious to do better.
  Nothing seemed to make her more angry than to see me with a newspaper. She seemed to think that here
  lay the danger. I have had her rush at me with a face made all up of fury, and snatch from me a newspaper,
  in a manner that fully revealed her apprehension. She was an apt woman; and a little experience soon
  demonstrated, to her satisfaction, that education and slavery were incompatible with each other.</p>

  <p>The fact that Douglass can understand the harm caused by the institution of slavery to slaveholders
  as well as to enslaved people shows a level of sophistication in thought, identifies the complexity
  and detriment of this historical period, and demonstrates an acute awareness of the rhetorical situation,
  especially for his audience for this text.</p>

  <p>The way that he articulates compassion for the slaveholders, despite their ill treatment of him,
  would create empathy in his readers and possibly provide a revelation for his audience.</p>

  <p>From this time I was most narrowly watched. If I was in a separate room any considerable length of
  time, I was sure to be suspected of having a book, and was at once called to give an account of myself.
  All this, however, was too late. The first step had been taken. Mistress, in teaching me the alphabet,
  had given me the inch, and no precaution could prevent me from taking the ell.</p>

  <p>Once again, Douglass underscores the value that literacy has for transforming the lived experiences
  of enslaved people. The reference to the inch and the ell circles back to Mr. Auld’s warnings and recalls
  the impact of that moment on his life.</p>

  <p>The plan which I adopted, and the one by which I was most successful, was that of making friends
  of all the little white boys whom I met in the street. As many of these as I could, I converted into
  teachers. With their kindly aid, obtained at different times and in different places, I finally succeeded
  in learning to read. When I was sent of errands, I always took my book with me, and by going one part
  of my errand quickly, I found time to get a lesson before my return. I used also to carry bread with
  me, enough of which was always in the house, and to which I was always welcome; for I was much better
  off in this regard than many of the poor white children in our neighborhood. This bread I used to bestow
  upon the hungry little urchins, who, in return, would give me that more valuable bread of knowledge.
  I am strongly tempted to give the names of two or three of those little boys, as a testimonial of the
  gratitude and affection I bear them; but prudence forbids;—not that it would injure me, but it might
  embarrass them; for it is almost an unpardonable offence to teach slaves to read in this Christian country.</p>

  <p>Douglass comments on the culture of the time, which still permitted slavery; he is sensitive to the
  fact that these boys might be embarrassed by their participation in unacceptable, though humanitarian,
  behavior. His audience will also recognize the irony in his tone when he writes that it is “an unpardonable
  offense to teach slaves . . . in this Christian country.” Such behavior is surely “unchristian.”</p>

  <p>It is enough to say of the dear little fellows, that they lived on Philpot Street, very near Durgin
  and Bailey’s shipyard. I used to talk this matter of slavery over with them. I would sometimes say to
  them, I wished I could be as free as they would be when they got to be men. “You will be free as soon
  as you are twenty-one, but I am a slave for life! Have not I as good a right to be free as you have?”
  These words used to trouble them; they would express for me the liveliest sympathy, and console me with
  the hope that something would occur by which I might be free.</p>

  <p>Douglass pursues and attains literacy not only for his own benefit; his knowledge also allows him
  to begin to instruct, as well as advocate for, those around him. Douglass’s use of language and his
  understanding of the rhetorical situation give the audience evidence of the power of literacy for all
  people, round out the arc of his narrative, and provide a resolution.</p>

  <h3>Discussion Questions</h3>

  <p>1. Based on what you have learned about literacy thus far, would you consider this excerpt from Frederick
  Douglass’s autobiography a literacy narrative? Explain your response by providing evidence from Douglass’s
  text.</p>

  <p>2. How do Douglass’s descriptions of Mr. and Mrs. Auld make these characters come to life for the
  reader?</p>

  <p>3. What do Douglass’s tone, use of language, and commentary reveal about him and why literacy was
  so important?</p>

  <p>4. African American storytelling features a common trope (device) of a trickster character. The trickster
  is characterized by intellect or secret knowledge that they use to defy convention. How does Douglass
  play the role of trickster in this excerpt from his narrative, and what impact does this rhetorical
  device have on the reading audience?</p>

  <p>5. What elements of Douglass’s narrative might help you develop your own narrative about literacy?</p>

  <p>3.5 Writing Process: Tracing the Beginnings of Literacy</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Develop a writing project through multiple drafts.
  • Use composing for inquiry, learning, critical thinking, and communicating in various rhetorical, cultural,
  and language situations. • Give and act on productive feedback to works in progress. • Benefit from
  the collaborative and social aspects of writing processes. • Use language structures, including multilingual
  structures, grammar, punctuation, and spelling, during the processes of composing and revising.</p>

  <p>Many inexperienced writers imagine that “good” writers compose their texts all at once, from beginning
  to end, and need only a small amount of attention to polish the grammar and punctuation before arriving
  at a final draft. In reality, however, the writing process (steps for creating a finished composition)
  is typically recursive. That is, it repeats steps multiple times, not necessarily in the same order,
  and the process is more messy than linear or systematic. You can think of the writing process in terms
  of these broad categories:</p>

  <ul><li>Prewriting. You will end up with a stronger composition if you do some work before you begin
  writing. Before putting complete sentences on a page, take some time to think about the rhetorical situation
  for your writing, gather your thoughts, and consider how you might arrange your ideas.</li><li>Drafting.
  In the past, you may have dedicated most of your writing time to drafting, or putting words into a document.
  When you have strong prewriting and revision habits, however, drafting is often a smaller portion of
  the writing process.</li><li>Peer Review. Almost all strong writers rely on feedback from others, whether
  peers, instructors, or editors. Your instructor may guide you in some peer review exercises to complete
  with your classmates, or you might choose to consult with your university’s writing center. When others
  give you clear, honest feedback on your draft, you can use that information to strengthen your piece.</li><li>Revision.
  After you have a draft, carefully consider how to make it more effective in reaching the audience and
  fulfilling its purpose. You can make changes that affect the piece as a whole; such changes are often
  called global revisions. You can also make changes that affect only the meaning of a sentence or a word;
  these changes can be called local revisions.</li></ul>

  <h3>Summary of Assignment: Independent Literacy Narrative</h3>

  <p>In this assignment, you will write an essay in which you offer a developed narrative about an aspect
  of your literacy practice or experience. Consider some of these questions to generate ideas for writing:
  What literacies and learning experiences have had profound effects on your life? When did this engagement
  occur? Where were you? Were there other participants? Have you told this story before? If so, how often,
  and why do you think you return to it? Has this engagement shaped your current literacy practices? Will
  it shape your practices going forward?</p>

  <p>The development of your literacy experiences can take multiple paths. If you use the tools provided
  in this section, you will be able to effectively compose a unique literacy narrative that reflects your
  identities and experiences. The questions prompting your writing in this section can help you begin
  to develop an independent literacy narrative. The next section, on community literacy narratives, helps
  you consider your composition course community and ways to think about your shared experiences around
  literacy. The following section, on literacy narrative research, guides you to a database of literacy
  narratives that offer an opportunity to analyze the ways in which others in the academic community have
  reflected on their literacy experiences. Further sections will guide you through the development and
  organization of your work as you navigate this genre.</p>

  <p>Another Lens 1. As an alternative to an individual literacy narrative, members of your composition
  course community can develop a set of interview questions that will allow you to learn more about each
  other’s past and present experiences with literacy. After the community has determined what the interview
  questions will be, choose a partner from the composition community to work with on this assignment;
  alternatively, your instructor may assign partners for the class. Using the interview questions you
  have discussed and developed, you will conduct an interview with your partner, and they with you. Your
  instructor will allow you and your peers to record and transcribe one another’s responses and post them
  where all students in the community have access. After you have completed, transcribed, and posted your
  interviews, everyone will closely examine each of their peers’ interviews and look for recurring themes
  as well as unique aspects of the narratives shared. This assignment will inevitably illuminate both
  the communal nature and the unique, independent experiences of literacy engagement.</p>

  <p>Another Lens 2. Using DALN (https://openstax.org/r/daln), perform a keyword search for literacy narratives
  on one aspect or area of concentration that interests you, such as music, dance, or poetry. Select two
  or more narratives from the archive to read and analyze. Read and annotate each narrative, and then
  think about a unique position you can take when discussing these stories. Use these questions to guide
  the development of your stance: Do you have experiences in this concentrated area of literacy? If so,
  how do your experiences intersect with or depart from the ones you are reading? What common themes,
  if any, do these narratives share? What do these narratives reveal about literacy practices in general
  and about this area of concentration in particular?</p>

  <p>Quick Launch: Defining Your Rhetorical Situation, Generating Ideas, and Organizing</p>

  <p>When you are writing a literacy narrative, think about</p>

  <ul><li>your audience and purpose for writing; • the ideas and experiences that best reflect your encounters
  with various literacies; and • the order in which you would like to present your information.</li></ul>

