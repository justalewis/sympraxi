  <p>Teacher Resources for “Everything’s Biased: A Guide to Determining When Bias Matters”</p>

  <h3>Overview and Teaching Strategies</h3>

  <p>Building on students’ natural tendencies to recognize bias, this chapter might fit into a critical
  reading or research unit. I have found that if students can identify relevant instances of bias as they
  read, they become not only better at choosing high-quality sources for their writing projects, but also
  more aware of how their own biases might impact their approach to writing topics.</p>

  <p>For claims of author bias that may more accurately describe students’ own strong feelings about a
  topic, the discussion of context may help identify where tensions could occur between readers and writers.
  For students using the word bias to describe any non-neutral material, a review of genre may prompt
  them to differentiate among actual biases, academic arguments, and accepted features of some genres.</p>

  <h3>Discussion Questions</h3>

  <p>1. How many different genres do you encounter in a typical day? For which does the author’s or publisher’s
  bias affect your understanding the most? The least? Why?</p>

  <p>2. Free-write about a past experience of significant importance to you. How does the context surrounding
  this experience contribute to your memory and retelling? How does your present context compare or contrast
  with your past context?</p>

  <p>3. Which topics of controversy often simplified into two sides actually have more than two valid
  positions? How should writers handle topics for which a pervasive viewpoint has little or no credible
  supporting evidence?</p>

  <p>4. Write down an opinion about which you feel strongly. Is it a preference, a moral belief, or an
  informed viewpoint? What would it take (if anything) for you to change your mind?</p>

  <p>What’s That Supposed to Mean? 151</p>

  <p>Activities</p>

  <p>Inhabiting a biased reader’s perspective. This activity can be done in small groups, or it can be
  the subject of a low-stakes exercise. First, ask students to imagine a strongly negative response to
  an assigned text. Next, ask students to write a summary of the text using this biased tone/ style. Finally,
  discuss how these loaded summaries can be revised for more neutrality. (Note: I suggest asking students
  to embody a hypothetical reader rather than prompting them to use their own biases as examples. Of course,
  the latter is the eventual goal as they begin to transition from thinking of these concepts as readers
  to applying them in their own writing.</p>

  <p>Viewpoint Summary Project. Assign students to small groups (3-4 is ideal). As a group, students will
  choose a debatable issue for which there are several reputable viewpoints. Next, they will summarize
  various articles that express opinions on the topic. Finally, they will present their neutral summaries
  to a peer audience. This can be a stand-alone project to reinforce skills of source evaluation and summary,
  or it can serve as an early annotated bibliography if you plan to scaffold this activity to a research
  assignment.</p>'
