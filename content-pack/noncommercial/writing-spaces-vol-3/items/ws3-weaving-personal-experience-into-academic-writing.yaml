  <p>Teacher Resources for Weaving Personal Experience into Academic Writing by Marjorie Stewart</p>

  <p>Overview and Teaching Strategies</p>

  <p>This essay is useful for faculty teaching the research-based essays that are frequently the concentration
  in a second semester composition course in a two-term first year writing sequence. Instructors who encourage
  a personal connection to the research topic will find this essay helpful in guiding students as to when
  and how they might use their personal narratives in their academic research essays.</p>

  <p>The questions below are designed to stimulate discussion and to move students from thinking academically
  about this genre to delving into their own lives for experiences they are inspired to research and learn
  more.</p>

  <p>Often the attitude towards personal narrative, held by teachers and students alike, is that it is
  a beginning genre and an ice breaker that is designed as a stepping stone to real or more important
  ways of writing. This essay instead subscribes to the theory that personal narrative is, as Gian Pagnucci
  says, “if not instinctive, then at the very least quintessentially human” (41). My experience working
  with students on this kind of essay is that they are eager to both tell their own stories and to research
  the issues that inform those stories.</p>

  <h3>Questions</h3>

  <p>1. Marjorie Stewart claims that our minds are filing cabinets of stories. Do her stories, or the
  stories of her students, remind you of stories of your own? How does this chain of stories help us make
  sense of our experiences?</p>

  <p>2. Has there ever been a time when you wanted to include personal experience in a writing project
  but were discouraged or forbidden to by an instructor? Why did you feel the story was important? What
  might have motivated the instructor?</p>

  <p>3. Are their personal stories you are eager to include in an essay? What about stories that you would
  be uneasy revealing? How do you, and how do other writers, decide which stories they wish to share?</p>

  <p>4. Work with an essay, either assigned in class or one you are familiar with in which the author
  uses personal experience. Compare it to an article on the same topic with no personal writing. Which
  do your respond to more, and why? Does the personal writing help you understand the writer, or does
  it get in the way of your intellectual understanding of the topic?</p>

  <h3>Essay Resources</h3>

  <p>If you have a favorite example of a well-mixed narrative research essay, by all means, use it. If
  you are using a book with good examples, you might assign one as companion reading to “Warp and Weft.”
  I also recommend many essays published as creative nonfiction, especially those from The Creative Nonfiction
  Foundation, at creativenonfiction.org. One of my favorites is “Rachel at Work: Enclosed, A Mother’s
  Report” by Jane Bernstein, published in Creative Nonfiction and anthologized in their collection True
  Stories, Well Told.</p>'
