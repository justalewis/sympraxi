  <p>Teacher Resources for How to Write Meaningful Peer Response Praise by Ron DePeter</p>

  <p>Introduction for Teachers</p>

  <p>Instructors could assign this essay in a first-year or upper-level writing course or workshop, during
  the early part of a semester when students are practicing peer feedback. The essay is in some sense
  an indirect sequel to Straub’s “Response—Really Responding—To Other Students’ Writing,” looking more
  in-depth at one specific mode of peer response. It is recommended that students have opportunities to
  practice writing feedback— perhaps on one or more sample essays that the instructor has collected from
  previous students. Ideally, students should practice writing each mode of commentary (for example, 1–2
  sessions writing praise, 1–2 sessions writing questions/advice, 1–2 sessions combining several modes)
  before diving into small group or whole class workshops. Ideally, the instructor can give some feedback
  or grades on the practice feedback, letting the students know how they are doing and how they might
  improve (e.g., write more comments, make comments more specific, etc.). After each peer feedback practice
  session, and in the “real” workshops with classmates, students can reflect in their journal/class discussion
  on how they feel they are coming along as responders, as well as how they feel about the comments received.
  Such meta-writings are essential threads that facilitate the students’ growth as readers and responders.</p>

  <h3>Discussion Questions</h3>

  <p>1. Do any of the attitudes about peer response that DePeter discusses in the beginning of his essay
  apply to you (e.g., not wanting to “judge” others or regarding a teacher’s feedback as more important
  than peers’)? Where do you imagine these attitudes come from?</p>

  <p>2. How do you think Nick (or any peer) would feel hearing the praise comments written in the Donald
  Murray style of “I like the way you…”? What effect would such praise have on the writer, compared to
  just seeing “Good” next to a passage?</p>

  <p>3. Do you feel there is a difference between what you feel is “good writing,” and that which teachers
  have identified as “good?” If so, what accounts for these different expectations? What is your definition
  of “good writing?”</p>

  <p>4. Can you think of ways that Nick or Andrea’s peer response praise could be even sharper, or more
  helpful to an author?</p>

  <p>5. Discuss experiences you have had in other classes sharing peer response. Have they been a metaphorical
  “Descent,” or enjoyable journeys? What made your peer response sessions in the past work, or not work?</p>'
