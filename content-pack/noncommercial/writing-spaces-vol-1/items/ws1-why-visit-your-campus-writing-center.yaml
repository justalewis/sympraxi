body: '<p>Why Visit Your Campus Writing Center?</p>

  <h3>Ben Rafoth</h3>

  <p>There is something about the experience of speaking with someone one-on-one—the facial expressions,
  enunciations, gestures—that makes us feel alive and energized.* Who we talk with can matter more than
  the topic itself, but either way most people love a good conversation. Among strangers traveling through
  an airport or waiting in a doctor’s office, words seem to gather like stones in a pool. People gravitate
  to conversations so naturally that they make time and travel far to experience them. When time is short
  and travel impractical, people buy conversations by the minute.</p>

  <p>Conversation is the key idea behind writing centers, and it’s the number one reason why it pays to
  visit your campus writing center. Writing is too hard to do alone, and writing center tutors can help.
  I asked several tutors from different writing centers to tell me how students benefit from the writing
  center, and I hope you will find what they said as convincing as I did.</p>

  <h3>Talking It Up</h3>

  <p>Every day, tens of thousands of students across the U.S. and around the world walk into (or go online
  for) their campus writing center, many</p>

  <p>*  This work is licensed under the Creative Commons AttributionNoncommercial-Share Alike 3.0 United
