  <p>Analytical Report: Writing from Facts</p>

  <p>8</p>

  <h3>CHAPTER OUTLINE</h3>

  <p>8.1 Information and Critical Thinking 8.2 Analytical Report Trailblazer: Barbara Ehrenreich 8.3 Glance
  at Genre: Informal and Formal Analytical Reports 8.4 Annotated Student Sample: "U.S. Response to COVID-19"
  by Trevor Garcia 8.5 Writing Process: Creating an Analytical Report 8.6 Editing Focus: Commas with Nonessential
  and Essential Information 8.7 Evaluation: Reviewing the Final Draft 8.8 Spotlight on … Discipline-Specific
  and Technical Language 8.9 Portfolio: Evidence and Objectivity</p>

  <p>INTRODUCTION The writing genre for this chapter is the analytical report. The broad purpose of an
  analytical report is to inform and analyze—that is, to teach your readers (your audience) about a subject
  by providing information based on facts supported by evidence and then drawing conclusions about the
  significance of the information you provide. As an academic and professional genre, reports are necessarily
  objective, which can make for dry reading. Consider the writing identity that you have been developing
  throughout this course as you tackle this genre. In what ways can you give your report voice? In what
  ways can you acknowledge or challenge the conventions of the genre?</p>

  <p>You have likely written or presented a report at some point in your life as a student; perhaps you
  wrote a lab report on a science experiment, presented research you conducted, or analyzed a book you
  read. While some reports seek to inform readers about a topic, an analytical report examines a subject
  or an issue by considering its causes and effects, by comparing and contrasting, or by discussing a
  problem and proposing one or more solutions. See Reasoning Strategies: Improving Critical Thinking for
  more about using these reasoning and organizational strategies in your writing.</p>

  <p>8.1 Information and Critical Thinking</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Distinguish between fact and opinion. • Recognize
  bias in reading and in yourself. • Ask critical thinking questions to explore an idea for a report.</p>

  <p>Knowledge in the social and natural sciences and technical fields is often focused on data and ideas
  that can be verified by observing, measuring, and testing. Accordingly, writers in these fields place
  high value on neutral and objective case analysis and inferences based on the careful examination of
  data. Put another way, writers describe and analyze results as they understand them. Likewise, writers
  in these fields avoid subjectivity, including personal opinions, speculations, and bias. As the writer
  of an analytical report, you need to know the difference between fact and opinion, be able to identify
  bias, and think critically and analytically.</p>

  <h3>Distinguishing Fact from Opinion</h3>

  <p>An analytical report provides information based on facts. Put simply, facts are statements that can
  be proven or whose truth can be inferred.</p>

  <p>It may be difficult to distinguish fact from opinion or allegation. As a writer, use a critical eye
  to examine what you read. The following are examples of factual statements:</p>

  <ul><li>Article I, Section 1 of the U.S. Constitution specifies that the legislative branch of the government
  consists of the Senate and the House of Representatives.</li><li>The school board voted to approve the
  administration’s proposal.</li></ul>

  <p>Facts that use numbers are called statistics. Some numbers are stated directly:</p>

  <ul><li>The earth’s average land and ocean surface temperature in March 2020 was 2.09 degrees Fahrenheit
  higher than the average surface temperature during the 20th century.</li><li>The total number of ballots
  cast in the 2020 presidential election was approximately 159 million. • The survey results showed that
  45 percent of first-year students at this university attended every class, whether in person or online.</li></ul>

  <p>Other numbers are implied:</p>

  <ul><li>Mercury is the planet closest to the sun. • College tuition and fees have risen in the past
  decade.</li></ul>

  <p>Factual statements such as those above stand in contrast to opinions, which are statements of belief
  or value. Opinions form the basis of claims that are supported by evidence in argumentative writing,
  but they should be avoided in informative and analytical writing. Here are two statements of opinion
  about an increase in college tuition and fees:</p>

  <ul><li>Although tuition and fees have risen, the value of a college education is worth the cost. •
  The increase in college tuition and fees over the past 10 years has placed an unreasonably heavy financial
  burden on students.</li></ul>

  <p>Both statements indicate that the writer will make an argument. In the first, the writer will defend
  the increases in college tuition and fees. In the second, the writer will argue that the increases in
  tuition and fees have made college too expensive. In both arguments, the writer will support the argument
  with factual evidence. See Proposal: Writing about Problems and Solutions for more information about
  fact and opinion.</p>

  <p>Want to know more about facts? Read the blog post Fact-Checking 101 (https://openstax.org/r/factchecking101)
  by Laura McClure, posted to the TED-Ed website.</p>

  <h3>Recognizing Bias</h3>

  <p>In addition to distinguishing between fact and opinion, it is important to recognize bias. Bias is
  commonly defined as a preconceived opinion about something—a subject, an idea, a person, or a group
  of people. As the writer of a report, you will learn to recognize bias in yourself and in the information
  you gather.</p>

  <h3>Bias in What You Read</h3>

  <p>Some writing is intentionally biased and intended to persuade, such as the editorials and opinion
  pieces described above. However, a report and the evidence on which it is based should not be heavily
  biased. Bias becomes a problem when a source you believe to be neutral, objective, and trustworthy presents
  information that attempts to sway your opinion. Identifying Bias (https://openstax.org/r/identifyingbias),
  posted by Tyler Rablin, is a helpful guide to recognizing bias.</p>

  <p>As you consider sources for your report, the following tips can also help you spot bias and read
  critically:</p>

  <ul><li>Determine the writer’s purpose. Is the writer simply informing you or trying to persuade you?
  • Research the author. Is the writer known for taking a side on the topic of the writing? Is the writer
  considered an expert? • Distinguish between fact and opinion. Take note of the number of facts and opinions
  throughout the source. • Pay attention to the language and what the writer emphasizes. Does the author
  use emotionally loaded, inflammatory words or descriptions intended to sway readers? What do the title,
  introduction, and any headings tell you about the author’s approach to the subject? • Read multiple
  sources on the topic. Learn whether the source is leaving out or glossing over important information
  and credible views. • Look critically at the images and any media that support the writing. Do they
  reinforce positive or negative aspects of the subject?</li></ul>

  <h3>Bias in Yourself</h3>

  <p>Most individuals bring what psychologists call cognitive bias to their interactions with information
  or with other people. Cognitive bias influences the way people gather and process new information. As
  you research information for a report, also be aware of confirmation bias. This is the tendency to seek
  out and accept information that supports (or confirms) a belief you already have and may cause you to
  ignore or dismiss information that challenges that belief. A related bias is the false consensus effect,
  which is the tendency to overestimate the extent to which other people agree with your beliefs.</p>

  <p>For example, perhaps you believe strongly that college tuition is too high and that tuition should
  be free at the public colleges and universities in your state. With that belief, you are likely to be
  more receptive to facts and statistics showing that tuition-free college benefits students by boosting
  graduation rates and improving financial security after college, in part because the sources may seem
  more mainstream. However, if you believe strongly that tuition should not be free, you are likely to
  be more receptive to facts and statistics showing that students who don’t pay for college are less likely
  to be serious about school and take longer to graduate—again, because the sources may seem more mainstream.</p>

  <h3>Asking Critical Questions about a Topic for a Report</h3>

  <p>As you consider a topic for a report, note the ideas that occur to you, interesting information you
  read, and what you already know. Answer the following questions about potential topics to help you understand
  a topic in a suitably analytical framework for a report.</p>

  <ul><li>What is/was the cause of ________? • What is/was the effect of ________? • How does/did ________
  compare or contrast with another similar event, idea, or item? • What makes/made ________ a problem?
  • What are/were some possible solutions to ________? • What beliefs do I have about ________? • What
  aspects of ________ do I need to learn more about to write a report about it? In the report that appears
  later in this chapter, student Trevor Garcia analyzes the U.S. response to the COVID-19 pandemic in
  2020. Trevor began thinking about his topic with the question What was the U.S. response to the COVID-19
  pandemic? Because he had lived through 2020, he was able to draw upon personal experience: his school
  closed, his mother was laid off, and his family’s finances were tight. As he researched his question,
  he moved beyond the information he gathered from his own experiences and discovered that the United
  States had failed in several key areas. He then answered the questions below to arrive at an analytical
  framework: • What was the cause of the poor U.S. response to the COVID-19 pandemic in 2020? • What was
  the effect of the U.S. response to the COVID-19 pandemic in 2020? • How did the U.S. response to the
  COVID-19 pandemic compare/contrast with the responses of other countries? • What are some possible solutions
  to the U.S. response to the COVID-19 pandemic? • What do I already believe about the U.S. response to
  the COVID-19 pandemic? • What aspects of the U.S. response to the COVID-19 pandemic do I need to learn
  more about? For his report, Trevor chose to focus on the first question: What was the cause of the poor
  U.S. response to the COVID-19 pandemic in 2020?</li></ul>

  <h2>Analytical Report Trailblazer: Barbara Ehrenreich</h2>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Define the term myth buster and its connection to field research. • Answer questions about what
  it means to investigate and report information. • Gather information from a biographical text.</li></ul>

  <p>“As a journalist, I search for the truth.”</p>

  <h3>Myth-Buster</h3>

  <p>Self-described “myth buster by trade” Barbara Ehrenreich (b. 1941) has tackled many myths during
  her years as an activist and a writer, most often confronting widely held beliefs related to health
  and wealth.</p>

  <p>Ehrenreich was born in 1941 in Butte, Montana, the daughter of a copper miner who finished college
  after she and her siblings were born. The family moved frequently when Ehrenreich was young and finally
  settled in Los Angeles. Ehrenreich attended Reed College in Portland, Oregon, and went to graduate school
  at Rockefeller University in New York City, where she earned a PhD in cell biology. Ehrenreich became
  involved in the women’s health movement in the 1970s and at that point decided to become a full-time
  writer. Her work life settled into three tracks: “journalism, . . . book-length projects on subjects,
  . . . [and] activism.” Over her long career, she has written for magazines and newspapers and has published
  more than 20 books, the most recent of which is Natural Causes: An Epidemic of Wellness, the Certainty
  of Dying, and Killing Ourselves to Live Longer (2018).</p>

  <p>Ehrenreich is perhaps best known for Nickel and Dimed: On (Not) Getting By in America (2001), a first-person
  account of her three-month experiment trying to make ends meet on minimum wage. She went undercover,
  leaving her middle-class home behind, and moved around the United States from Florida to Maine to Minnesota.
  Ehrenreich worked as a waitress, hotel maid, house cleaner, nursing home aide, and Walmart salesperson.
  On the wages and tips she made at her various jobs, she attempted to find healthy food, health care,
  and affordable housing in trailer parks and residential hotels.</p>

  <p>In Nickel and Dimed, Ehrenreich busts the myth that poor people have figured out how to live well
  on less money than middle-class people. No such “secret economies” exist, Ehrenreich writes. Instead,
  poor people pay “a host of special costs,” whether for renting a room by the week because they cannot
  save up two months’ rent to get an apartment, buying restaurant food because the weekly room doesn’t
  have a stove, or going to the emergency room for a toothache because they can’t afford to go to the
  dentist.</p>

  <p>As a piece of writing, Nickel and Dimed falls into the genre of memoir. However, the book is also
  a report; Ehrenreich conducted extensive on-the-ground field research, recording the tasks she performed
  at her jobs, interactions with managers, and conversations with coworkers about their lives. She recorded
  her findings when she was not working. Although some readers have criticized Ehrenreich for not being
  honest about her background and education, most have praised the light she shines on the other side
  of American prosperity—the people who work hard but who never manage to get ahead. Her work as a “myth
  buster” to expose the hardships faced by poor working people in America illustrates the problem of accepting
  opinions as facts.</p>

  <p>In the introduction to Nickel and Dimed, Ehrenreich describes the research methods. She also discusses
  Nickel and Dimed on C-Span (https://openstax.org/r/C-span).</p>

  <h3>Discussion Questions</h3>

  <p>1. What does Barbara Ehrenreich mean when she describes herself as a “myth buster”? If you were to
  bust a myth, what would it be?</p>

  <p>2. What facts do you think Ehrenreich discovered during her time working undercover? What opinions
  do you think she formed?</p>

  <p>3. What do you think were Ehrenreich’s sources of information, and how did she obtain such information?</p>

  <p>4. If you went undercover to investigate and report on an issue that you think people should know
  about, what would it be? How would you go about your undercover reporting?</p>

  <p>5. Could someone live on minimum wage in your community? What information about the cost of housing,
  food, transportation, and medical care would you need to answer the question? How could you find it?</p>

  <p>8.3 Glance at Genre: Informal and Formal Analytical Reports</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Determine purpose and audience expectations for
  an analytical report. • Identify key features of informal and formal reports. • Define key terms and
  characteristics of an analytical report.</p>

  <p>It is important to understand the purpose of your report, the expectations of the audience, any specific
  formatting requirements, and the types of evidence you can use.</p>

  <h3>Defining a Specific Purpose</h3>

  <p>Your purpose is your reason for writing. The purpose of a report is to inform; as the writer, you
  are tasked with providing information and explaining it to readers. Many topics are suitable for informative
  writing—how to find a job, the way a disease spreads within a population, or the items on which people
  spend the most money. Some textbooks are examples of informative writing, as is much of the reporting
  you find on reputable news sites.</p>

  <p>An analytical report is a type of report. Its purpose is to present and analyze information. An assignment
  for an analytical report will likely include words such as analyze, compare, contrast, cause, and/or
  discuss, indicating the specific purpose of the report. Here are a few examples:</p>

  <ul><li>Discuss and analyze potential career paths with strong employment prospects for young adults.
  • Compare and contrast proposals to reduce binge drinking among college students. • Analyze the Cause-and-effect
  of injuries on construction sites and the effects of efforts to reduce workplace injuries. • Discuss
  the Effect of the 1965 Voting Rights Act on voting patterns among U.S. citizens of color. • Analyze
  the success and failure of strategies used by the major political parties to encourage citizens to vote.</li></ul>

  <h3>Tuning In to Audience Expectations</h3>

  <p>The audience for your report consists of the people who will read it or who could read it. Are you
  writing for your instructor? For your classmates? For other students and teachers in professional fields
  or academic disciplines? For people in your community? Whoever your readers are, they expect you to
  do the following:</p>

  <ul><li>Have an idea of what they already know about your topic, and adjust your writing as needed.
  If readers are new to the topic, they expect you to provide necessary background information. If they
  are knowledgeable about the topic, they will expect you to cover the background quickly.</li><li>Provide
  reliable information in the form of specific facts, statistics, and examples. Whether you present your
  own research or information from other sources, readers expect you to have done your homework in order
  to supply trustworthy information.</li><li>Define terms, especially if audience members may be unfamiliar
  with your topic. • Structure your report in a logical way. It should open with an introduction that
  tells readers the subject and should follow a logical structure. • Adopt an objective stance and neutral
  tone, free of any bias, personal feelings, or emotional language. By demonstrating objectivity, you
  show respect for your readers’ knowledge and intelligence, and you build credibility and trust, or ethos,
  with them. • Present and cite source information fairly and accurately.</li></ul>

  <h3>Informal Reports</h3>

  <p>An informal analytical report will identify a problem, provide factual information about the problem,
  and draw conclusions about the information. An informal report is usually structured like an essay,
  with an introduction or summary, body paragraphs, and a conclusion or recommendations. It will likely
  feature headings identifying key sections and be presented in academic essay format, such as MLA Documentation
  and Format or APA Documentation and Format. For an example of an informal analytical report documented
  in APA style, see Trevor Garcia’s paper on the U.S. response to COVID-19 in 2020 in the Annotated Student
  Sample.</p>

  <p>Other types of informal reports include journalism reports. A traditional journalism report involves
  a reporter for a news organization reporting on the day’s events—the results of an election, a political
  crisis, a plane crash, a celebrity marriage—on TV, on radio, or in print. An investigative journalism
  report, on the other hand, involves reporters doing original research over a period of weeks or months
  to uncover significant new information, similar to what Barbara Ehrenreich did for her book Nickel and
  Dimed. For sample traditional and investigative journalistic reports, visit the website of a reliable
  news organization or publication, such as the New York Times (https://openstax.org/r/newyorktimes),
  the Washington Post (https://openstax.org/r/ washingtonpost), the Wall Street Journal (https://openstax.org/r/wallstreetjournal),
  the Economist (https://openstax.org/r/economist), the New Yorker (https://openstax.org/r/newyorker),
  or the Atlantic (https://openstax.org/r/atlantic).</p>

  <h3>Formal Reports</h3>

  <p>Writers in the social sciences, the natural sciences, technical fields, and business often write
  formal analytical reports. These include lab reports, research reports, and proposals.</p>

  <p>Formal reports present findings and data drawn from experiments, surveys, and research and often
  end with a conclusion based on an analysis of these findings and data. These reports frequently include
  visuals such as graphs, bar charts, pie charts, photographs, or diagrams that are captioned and referred
  to in the text. Formal reports always cite sources of information, often using APA Documentation and
  Format, used in the examples in this chapter, or a similar style.</p>

  <p>If you are assigned a formal report in a class, follow the instructions carefully. Your instructor
  will likely explain the assignment in detail and provide explicit directions and guidelines for the
  research you will need to do (including any permission required by your college or university if you
  conduct research on human subjects), how to organize the information you gather, and how to write and
  format your report. A formal report is a complex, highly organized, and often lengthy document with
  a specified format and sections usually marked by headings.</p>

  <p>Following are the components of a formal analytical report. Depending on the assignment and the audience,
  a formal report you write may include some or all of these parts. For example, a research report following
  APA format usually includes a title page, an abstract, headings for components of the body of the report
  (methods, results, discussion), and a references page. Detailed APA guidelines are available online,
  including at the Purdue University Online Writing Lab (https://openstax.org/r/purdueuniversity).</p>

  <h3>Components of Formal Analytical Reports</h3>

  <ul><li>Letter of transmittal. When a report is submitted, it is usually accompanied by a letter or
  email to the recipient explaining the nature of the report and signed by those responsible for writing
  it. Write the letter of transmittal when the report is finished and ready for submission.</li><li>Title
  page. The title page includes the title of the report, the name(s) of the author(s), and the date it
  was written or submitted. The report title should describe the report simply, directly, and clearly
  and should not try to be too clever. For example, The New Student Writing Project: A Two-Year Report
  is a clear, descriptive title, whereas Write On, Students! is not.</li><li>Acknowledgments. If other
  people and/or organizations contributed to the report, include a page or paragraph thanking them.</li><li>Table
  of contents. For long reports (10 pages or more), create a table of contents to help readers navigate
  easily. List the major components and subsections of the report and the pages on which they begin.</li><li>Executive
  summary or abstract. The executive summary or abstract is a paragraph that highlights the findings of
  the report. The purpose of this section is to present information in the quickest, most concentrated,
  and most economical way possible to be useful to readers. Write this section after you have completed
  the rest of the report.</li><li>Introduction or background. The introduction provides necessary background
  information to help readers understand the report. This section also indicates what information is included
  in the report.</li><li>Methods. Especially in the social sciences, the natural sciences, and technical
  disciplines, the methods or procedures section outlines how you gathered information and from what sources,
  such as experiments, surveys, library research, interviews, and so on.</li><li>Results. In the results
  section, you summarize the data you have collected from your research, explain your method of analysis,
  and present this information in detail, often in a table, graph, or chart.</li><li>Discussion or Conclusion.
  In this section, you interpret the results and present the conclusions of your research. This section
  also may be called “Discussion of Findings.”</li><li>Recommendations. In this section, you explain what
  you believe should be done in response to your research findings.</li><li>References and bibliography.
  The references section includes every source you cited in the report. The bibliography contains, in
  addition to those cited in the report, sources that readers can consult to learn more.</li><li>Appendix.
  An appendix (plural: appendices) includes documents that are related to the report or contain information
  that can be culled but are not deemed central to understanding the report.</li></ul>

  <p>The following links take you to sample formal reports written by students and offer tips from librarians
  posted by colleges and universities in the United States. These samples may help you better understand
  what is involved in writing a formal analytical report.</p>

  <ul><li>Product review report (https://openstax.org/r/productreviewreport), from the University/College
  Library of Broward College and Florida Atlantic University</li><li>Business report (https://openstax.org/r/businessreport),
  from Wright State University • Technical report (https://openstax.org/r/technicalreport), from the University
  of Utah • Lab report (https://openstax.org/r/labreport), from Hamilton College • Field report (https://openstax.org/r/fieldreport),
  from the University of Southern California</li></ul>

  <p>Exploring the Genre</p>

  <p>The following are key terms and characteristics related to reports.</p>

  <ul><li>Audience: Readers of a report or any piece of writing. • Bias: A preconceived opinion about
  something, such as a subject, an idea, a person, or a group of people.</li></ul>

  <p>As a reader, be attentive to potential bias in sources; as a writer, be attentive to your own biases.
  • Body: The main part of a report between the introduction and the conclusion. The body of an analytical
  report consists of paragraphs in which the writer presents and analyzes key information. • Citation
  of sources: References in the written text to sources that a writer has used in a report. • Conclusion
  and/or recommendation: The last part of a report. In this section, the writer summarizes the significance
  of the information in the report or offers recommendations—or both. • Critical thinking: The ability
  to look beneath the surface of words and images to analyze, interpret, and evaluate them. • Ethos: The
  sense that the writer or other authority is trustworthy and credible; also known as ethical appeal.
  • Evidence: Statements of fact, statistics, examples, and expert opinions that support the writer’s
  points. • Facts: Statements whose truth can be proved or verified and that serve as evidence in a report.
  • Introduction: The first section of a report after any front matter, such as an abstract or table of
  contents. In an analytical report, the writer introduces the topic to be addressed and often presents
  the thesis at the end of the introduction. • Logos: The use of facts as evidence to appeal to an audience’s
  logical and rational thinking; also known as logical appeal. • Objective stance: Writing in a way that
  is free from bias, personal feelings, and emotional language. An objective stance is especially important
  in report writing. • Purpose: The reason for writing. The purpose of an analytical report is to examine
  a subject or issue closely, often from multiple perspectives, by looking at causes and effects, by comparing
  and contrasting, or by examining problems and proposing solutions. • Statistics: Factual statements
  that include numbers and often serve as evidence in a report. • Synthesis: Making connections among
  and combining ideas, facts, statistics, and other information. • Thesis: The central or main idea that
  you will convey in your report. The thesis is often referred to as the central claim in argumentative
  writing. • Thesis statement: A declarative sentence (sometimes two) that states the topic, the angle
  you are taking, and the aspects of the topic you will cover. For a report, a thesis indicates and limits
  the scope of the report.</p>

  <p>8.4 Annotated Student Sample: "U.S. Response to COVID-19" by Trevor Garcia</p>

  <p>LEARNING OUTCOMES</p>

  <p>By the end of this section, you will be able to: • Identify the genre conventions of an informal
  analytical report. • Analyze the organizational structure of a report and how writers develop ideas.
  • Recognize how writers use evidence and objectivity to build credibility. • Identify sources of evidence
  within a text and in source citations.</p>

  <h3>Introduction</h3>

  <p>The analytical report that follows was written by a student, Trevor Garcia, for a first-year composition
  course. Trevor’s assignment was to research and analyze a contemporary issue in terms of its causes
  or effects. He chose to analyze the causes behind the large numbers of COVID-19 infections and deaths
  in the United States in 2020. The report is structured as an essay, and its format is informal.</p>

  <h3>LIVING BY THEIR OWN WORDS Successes and Failures</h3>

  <p>With more than 83 million cases and 1.8 million deaths at the end of 2020, COVID-19 has turned the
  world upside down. By the end of 2020, the United States led the world in the number of cases, at more
  than 20 million infections and nearly 350,000 deaths. In comparison, the second-highest number of cases
  was in India, which at the end of 2020 had less than half the number of COVID-19 cases despite having
  a population four times greater than the U.S. (“COVID-19 Coronavirus Pandemic,” 2021). How did the United
  States come to have the world’s worst record in this pandemic? An examination of the U.S. response shows
  that a reduction of experts in key positions and programs, inaction that led to equipment shortages,
  and inconsistent policies were three major causes of the spread of the virus and the resulting deaths.
  Introduction. Informal reports follow essay structure and open with an overview. Statistics as Evidence.
  The writer gives statistics about infection rates and numbers of deaths; a comparison provides context.
  Source Citation in APA Style: No Author. A web page without a named author is cited by the title and
  the year. Thesis Statement. The rhetorical question leads to the thesis statement in the last sentence
  of the introduction. The thesis statement previews the organization and indicates the purpose—to analyze
  the causes of the U.S. response to the virus.</p>

  <h3>Reductions in Expert Personnel and Preparedness Programs</h3>

  <p>Headings. This heading and those that follow mark sections of the report.</p>

  <p>Body. The three paragraphs under this heading support the first main point in the thesis statement.</p>

  <p>Epidemiologists and public health officials in the United States had long known that a global pandemic
  was possible.</p>

  <p>Topic Sentence. The paragraph opens with a sentence stating the topic. The rest of this paragraph
  and the two that follow develop the topic chronologically.</p>

  <p>In 2016, the National Security Council (NSC) published Playbook for Early Response to High-Consequence
  Emerging Infectious Disease Threats and Biological Incidents, a 69-page document on responding to diseases
  spreading within and outside of the United States. On January 13, 2017, the joint transition teams of
  outgoing president Barack Obama and then president-elect Donald Trump performed a pandemic preparedness
  exercise based on the playbook; however, it was never adopted by the incoming administration (Goodman
  &amp; Schulkin, 2020). A year later, in February 2018, the Trump administration began to cut funding
  for the Prevention and Public Health Fund at the Centers for Disease Control and Prevention, leaving
  key positions unfilled. Other individuals who were fired or resigned in 2018 were the homeland security
  adviser, whose portfolio included global pandemics; the director for medical and biodefense preparedness;
  and the top official in charge of a pandemic response. None of them were replaced, thus leaving the
  White House with no senior person who had experience in public health (Goodman &amp; Schulkin, 2020).
  Experts voiced concerns, among them Luciana Borio, director of medical and biodefense preparedness at
  the NSC, who spoke at a symposium marking the centennial of the 1918 influenza pandemic in May 2018:
  “The threat of pandemic flu is the number one health security concern,” she said. “Are we ready to respond?
  I fear the answer is no” (Sun, 2018, final para.).</p>

  <p>Audience. The writer assumes that his readers have a strong grasp of government and agencies within
  the government.</p>

  <p>Synthesis. The paragraph synthesizes factual evidence from two sources and cites them in APA style.</p>

  <p>Expert Quotation as Supporting Evidence. The expert’s credentials are given, her exact words are
  placed in quotation marks, and the source is cited in parentheses.</p>

  <p>Source Citation in APA Style: No Page Numbers. Because the source of the quotation has no page numbers,
  the specific paragraph within the source (“final para.”; alternatively, “para. 18”) is provided in the
  parenthetical citation.</p>

  <p>Cuts continued in 2019, among them a maintenance contract for ventilators in the federal emergency
  supply and PREDICT, a U.S. agency for international development designed to identify and prevent pandemics
  (Goodman &amp; Schulkin, 2020). In July 2019, the White House eliminated the position of an American
  public health official in Beijing, China, who was working with China’s disease control agency to help
  detect and contain infectious diseases. The first case of COVID-19 emerged in China four months later,
  on November 17, 2019.</p>

  <p>Development of First Main Point. This paragraph continues the chronological development of the first
  point, using a transitional sentence and evidence to discuss the year 2019.</p>

  <p>After the first U.S. coronavirus case was confirmed in 2020, the secretary of the Department of Health
  and Human Services (HHS) was named to lead a task force on a response, but after several months, he
  was replaced when then vice president Mike Pence was officially charged with leading the White House
  Coronavirus Task Force (Ballhaus &amp; Armour, 2020). Experts who remained, including Dr. Deborah Birx
  and Dr. Anthony Fauci of the National Institutes of Health, were sidelined. Turnover of personnel in
  related government departments and agencies continued throughout 2020, leaving the country without experts
  in key positions to lead the pandemic response.</p>

  <p>Development of First Main Point. This paragraph continues the chronological development of the first
  point, using a transitional sentence and evidence to discuss the start of the pandemic in 2020.</p>

  <h3>Inaction and Equipment Shortages</h3>

  <p>Body. The three paragraphs under this heading support the second main point in the thesis statement.</p>

  <p>In January and February of 2020, the president’s daily brief included more than a dozen detailed
  warnings, based on wire intercepts, computer intercepts, and satellite images by the U.S. intelligence
  community (Miller &amp; Nakashima, 2020). Although senior officials began to assemble a task force,
  no direct action was taken until mid-March.</p>

  <p>Topic Sentences. The paragraph opens with two sentences stating the topic that is developed in the
  following paragraphs.</p>

  <p>The stockpile of medical equipment and personal protective equipment was dangerously low before the
  pandemic began. Although the federal government had paid $9.8 million to manufacturers in 2018 and 2019
  to develop and produce protective masks, by April 2020 the government had not yet received a single
  mask (Swaine, 2020). Despite the low stockpile, a request by the head of the Food and Drug Administration
  (FDA) in early 2020 to begin contacting companies about possible shortages of necessary medical equipment,
  including personal protective equipment, was denied. This decision was made to avoid alarming the industry
  and the public and to avoid giving the impression that the administration was not prepared for the pandemic
  (Ballhaus &amp; Armour, 2020).</p>

  <p>Topic Sentence. The paragraph opens with a sentence stating the topic that is developed in the paragraph.</p>

  <p>Objective Stance. The writer presents evidence (facts, statistics, and examples) in mostly neutral,
  unemotional language, which builds trustworthiness, or ethos, with readers.</p>

  <p>Synthesis. The paragraph synthesizes factual evidence from two sources.</p>

  <p>When former President Trump declared a national emergency on March 13, federal agencies began placing
  bulk orders for masks and other medical equipment. These orders led to critical shortages throughout
  the nation. In addition, states were instructed to acquire their own equipment and found themselves
  bidding against each other for the limited supplies available, leading one head of a coronavirus team
  composed of consulting and private equity firms to remark that “the federal stockpile was . . . supposed
  to be our stockpile. It’s not supposed to be states’ stockpiles that they then use” (Goodman &amp; Schulkin,
  2020, April 2, 2020).</p>

  <h3>Policy Decisions</h3>

  <p>Body. The paragraph under this heading addresses the third main point in the thesis statement.</p>

  <p>Policy decisions, too, hampered the U.S. response to the pandemic.</p>

  <p>Topic Sentence. The paragraph opens with a sentence stating the topic that is developed in the paragraph.</p>

  <p>Although the HHS and NSC recommended stay-at-home directives on February 14, directives and guidelines
  for social distancing were not announced until March 16, and guidelines for mask wearing were inconsistent
  and contradictory (Goodman &amp; Schulkin, 2020). Implementing the recommendations was left to the discretion
  of state governors, resulting in uneven stay-at-home orders, business closures, school closures, and
  mask mandates from state to state. The lack of a consistent message from the federal government not
  only delegated responsibility to state and local governments but also encouraged individuals to make
  their own choices, further hampering containment efforts. Seeing government officials and politicians
  without masks, for example, led many people to conclude that masks were unnecessary. Seeing large groups
  of people standing together at political rallies led people to ignore social distancing in their own
  lives.</p>

  <p>Synthesis. The paragraph synthesizes factual evidence from a source and examples drawn from the writer’s
  observation.</p>

  <h3>Conclusion</h3>

  <p>Although the first cases of COVID-19 were detected in the United States in January, genetic researchers
  later determined that the viral strain responsible for sustained transmission of the disease did not
  enter the country until around February 13 (Branswell, 2020), providing further evidence that the failed
  U.S. response to the pandemic could have been prevented. Cuts to public health staff reduced the number
  of experts in leadership positions. Inaction in the early months of the pandemic led to critical shortages
  of medical equipment and supplies. Mixed messages and inconsistent policies undermined efforts to control
  and contain the disease. Unfortunately, the response to the disease in 2020 cannot be changed, but 2021
  looks brighter. Most people who want the vaccine—nonexistent at the beginning of the pandemic and unavailable
  until recently—will have received it by the end of 2021. Americans will have experienced two years of
  living with the coronavirus, and everyone will have been affected in some way.</p>

  <p>Conclusion. The report concludes with a restatement of the main points given in the thesis and points
  to the future.</p>

  <h3>References</h3>

  <p>Ballhaus, R., &amp; Armour, S. (2020, April 22). Health chief’s early missteps set back coronavirus
  response. Wall Street Journal. https://www.wsj.com/articles/health-chiefs-early-missteps-set-back-coronavirusresponse-11587570514</p>

  <p>Branswell, H. (2020, May 26). New research rewrites history of when COVID-19 took off in the U.S.—and
  points to missed chances to stop it. STAT. https://www.statnews.com/2020/05/26/new-research-rewrites-history-ofwhen-covid-19-arrived-in-u-s-and-points-to-missed-chances-to-stop-it/</p>

  <p>COVID-19 coronavirus pandemic. (2021, January 13). Worldometer. https://www.worldometers.info/ coronavirus/#countries</p>

