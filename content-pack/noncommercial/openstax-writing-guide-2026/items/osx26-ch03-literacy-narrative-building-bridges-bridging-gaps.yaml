  <h3>Peer Review: Giving Specific Praise and Constructive Feedback</h3>

  <p>Although the writing process does not always occur in a prescribed sequence (you can move among steps
  of the process in a variety of ways), participating in peer review is a necessary part of the writing
  process. Having the response and feedback of an outside reader can help you shape your writing into
  work that makes you proud. A peer review occurs when someone at your level (a peer) offers an evaluation
  of your writing. Instructors aid in this process by giving you and your peers judgment criteria and
  guidelines to follow, and the feedback of the reader should help you revise your writing before your
  instructor evaluates it and offers a grade.</p>

  <p>When given the opportunity to engage in a peer review activity, use the following steps to provide
  your peers with effective, evidence-based feedback for their writing.</p>

  <ul><li>Review all the criteria and guidelines for the assignment. • Read the writing all the way through
  carefully before offering any feedback. • Read the peer review exercise, tool, or instrument provided
  by the instructor. • Apply and complete the peer review exercise while rereading the work. • Provide
  feedback to your peer. Your comments should focus on these questions:</li></ul>

  <p>◦ In what ways are the organization and coherence of the narrative logical and clear so that you
  can follow events?</p>

  <p>◦ What, if anything, do you not understand or need further explanation about? ◦ What do you want
  to know more about?</p>

  <p>Following these steps will give your reading the necessary context and situate your feedback within
  the criteria and guidelines of the assignment. This process will be critical to the revision process
  for your peer. In addition, reading and evaluating the work of another, and using the criteria and guidelines
  for that assignment, will strengthen your writing skills and help you when you revise your own work.</p>

  <p>Before you can engage in a successful peer review exercise, you must develop a first draft and carefully
  read it to determine whether you need to make any of these changes.</p>

  <ul><li>On a global, or structural, level, do you need to insert material, delete tangents, or rearrange
  some sections? Make the changes necessary to strengthen the coherence of your draft as whole</li><li>On
  a local, or surface, level, check for grammar, punctuation, and capitalization errors.</li></ul>

  <p>After you have done a thorough check of your own work, you are ready to share the draft of your literacy
  narrative with a peer review partner or group. Depending on the guidance of your instructor, you may
  use a peer review activity such as the one provided in Table 3.4 to evaluate the literacy narrative
  and provide feedback to your partner or group members.</p>

  <p>Guided Peer Review Activity</p>

  <p>Essay Criteria</p>

  <p>Evidence</p>

  <p>The narrative engages the identity of the writer.</p>

  <p>List evidence of the writer’s identity in the narrative: 1. 2. 3.</p>

  <h3>Suggestion for Revision</h3>

  <p>The writer could strengthen the ways in which identity is represented in the narrative by making
  the following changes: 1. 2. 3.</p>

  <p>The narrative is written from a particular viewpoint or perspective.</p>

  <p>List evidence that indicates the viewpoint or perspective of the narrative: 1. 2. 3.</p>

  <p>The writer could develop a (stronger) viewpoint or perspective in the narrative by making the following
  changes: 1. 2. 3.</p>

  <p>The narrative has moments that are centered on either a past or present literacy experience.</p>

  <p>Provide evidence from the narrative of past or present literacy experience(s): 1. 2. 3.</p>

  <p>The narrative could be better developed if the following literacy experience(s) were included or
  expanded: 1. 2. 3.</p>

  <p>The narrative has a literacy experience that is the focus of the writing.</p>

  <p>Identify the literacy experience that is the focus of the narrative:</p>

  <p>The focal literacy experience would be stronger with the following details and/or development: 1.
  2. 3.</p>

  <p>Essay Criteria</p>

  <h3>Evidence</h3>

  <p>The narrative identifies social, cultural, or environmental influences on the literacy experience(s).</p>

  <p>List the ways in which the narrative includes social, cultural, or environmental influences on the
  literacy experience(s): 1. 2. 3.</p>

  <h3>Suggestion for Revision</h3>

  <p>The literacy narrative would be stronger if the experiences included these details about social,
  cultural, or environmental influences: 1. 2. 3.</p>

  <p>The details of the narrative include descriptions of people, places, things, and events.</p>

  <p>Identify examples within the narrative that provide details about people, places, things, and events:
  1. 2. 3.</p>

  <p>The narrative would be stronger if the following details about people, places, things, and events
  were more fully developed: 1. 2. 3.</p>

  <p>The elements of the rhetorical situation—author, message, audience, purpose, means, context, and
  culture—are addressed and included in the essay.</p>

  <p>List elements of the rhetorical situation included in the narrative:</p>

  <ul><li>Author • Message • Audience • Purpose • Means • Context • Culture</li></ul>

  <p>The narrative would be more effective if the following elements of the rhetorical situation were
  more fully developed and provided greater details (list all that apply):</p>

  <ul><li>Author • Message • Audience • Purpose • Means • Context • Culture</li></ul>

  <p>After you and your partner have completed the written guided exercise, spend some time talking about
  the elements of the essay and the feedback that you are giving one another. Talk through the suggestions,
  and ask questions about issues that arise during your assessment of one another’s writing.</p>

  <h3>Revising: Adding and Deleting Information</h3>

  <p>After you have completed the peer review exercise and received the related constructive feedback,
  you are ready to revise your literacy narrative in preparation for submission to your instructor for
  grading and a possible publication venue. (See “Spotlight on . . . the Digital Archive of Literacy Narratives
  (DALN).”) The peer review exercise guided you and your partner or group members through a thorough assessment
  of your narratives. If you are not able to participate in peer review, make an appointment with your
  campus writing center to receive similar feedback. After getting responses from peers or the writing
  center, the next step is to take that feedback and make changes to your draft.</p>

  <p>Look at the criteria in the first row of the peer review chart above, and then look at the evidence
  for that criteria that your partner listed. Does your reviewer’s understanding of the parts of your
  essay match your own? Where are the disconnects between what you intended for a section of your writing
  and what your reviewer has read and understood? These points of disconnect are good places to begin
  your revisions. Your peer reviewers represent your audience, so if they experience some misunderstandings
  in the reading of your narrative, you will want to make changes to clarify your writing.</p>

  <p>Imagine you have written a literacy narrative in which you discuss the difficulty of learning to
  read music. Imagine the opening paragraph contains the following sentence: “I have always had a hard
  time reading music.” Your peer reviewer might list in column 2, for the first criterion on engaging
  identity, that you read music, and that is all. Such a brief and limited assessment might lead your
  partner to suggest in column 3 that you strengthen your identity by answering the following questions:</p>

  <ul><li>When and why did you begin trying to learn to read music? • Do you come from a musical background?
  • Did you have a music reading teacher, or are you self-taught? • What are your specific challenges
  in reading music?</li></ul>

  <p>During the discussion after the written peer review, you might share the details of your learning
  to play the piano: that you were five years old and that your grandmother was your teacher. Your revision
  for this opening paragraph might then include a sentence such as the following: “I have struggled to
  read music since I began playing piano at five years old, when my grandmother, our church musician,
  gave me my first lesson.” This process demonstrates the way in which the peer review should lead to
  substantive change and revision in your writing.</p>

  <p>You will want to read and discuss the details of the evidence (column 2) and suggestions (column
  3) for each of the above criteria (column 1) with your peer review partner. On the basis of your partner’s
  assessment—and your own judgment, of course—make any necessary revisions before submitting your literacy
  narrative for grading. The more time you take to go through this process, the more developed and comprehensive
  your writing will be. Some people may feel anxious about having others read their work, but the scenario
  provided above demonstrates the valuable ways in which a preliminary reading audience can help improve
  the narrative.</p>

  <p>3.6 Editing Focus: Sentence Structure</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Use language structures, including multilingual
  structures, grammar, punctuation, and spelling, during the process of editing. • Develop flexible strategies
  for drafting, reviewing, collaborating, revising, rewriting, and editing. • Use composing processes
  and tools as a means to discover and reconsider ideas.</p>

  <p>After writing a draft of your literacy narrative and revising it to strengthen the overall structure
  and content of the text, you are ready to pay closer attention to individual sentences within it. This
  section offers several strategies for improving your sentences to communicate meaning more effectively
  to your audience and to make the reading experience more engaging.</p>

  <h3>Sentence Combining</h3>

  <p>Sentence combining is an often-used revision strategy that can completely transform a narrative.
  When writers compose early drafts with many short sentences rather than more sophisticated efforts at
  varied or complex sentence construction, the writing appears choppy and disjointed. Once you have a
  complete draft of your essay, consider combining sentences to provide your audience with more effective
  and nuanced ways of reading your work. You can combine short, repetitive sentences into a simple sentence
  with a compound predicate or subject, as in the first example below. Or you can combine the shorter
  sentences into a complex sentence with a dependent clause, as in the second example. See Clear and Effective
  Sentences for more information about effective sentences and sentence structure.</p>

  <p>1a. I learned to play piano. I was five years old. Learning to play piano is my literacy experience.
  Memorizing the location of the keys is also my literacy experience.</p>

  <p>1b. Learning to play piano at the age of five and memorizing the location of the keys are my literacy
  experiences.</p>

  <p>2a. I learned to read in first grade. Learning to read made me want to be a teacher. I want to share
  my experience with reading with future first graders.</p>

  <p>2b. Learning to read as a first grader made me want to become a teacher so that I could share my
  experiences with future first graders.</p>

  <p>Read through the draft of your essay, and look for sentences that are closely related enough that
  they can be combined for richer meaning. However, keep in mind that short sentences can be effective
  in your writing, especially when you want to create realistic dialogue or show action. Strive to create
  a balance among sentence lengths and types to engage your audience. Remember, too, that the best test
  of whether words are pulling their own weight and providing rhythm, balance, and emphasis is to read
  the passage aloud. Let your ear tell you what is sharp and clear and what could benefit from editing.</p>

  <h3>Revising Common Sentence Patterns for More Effective Communication</h3>

  <p>If you have often been told to make your sentences clearer, less wordy, or both, but you do not know
  where to start, this section offers some quick strategies to address some of the most common issues
  that contribute to unclear or wordy writing.</p>

  <p>Defining You and This. One common pattern that makes writing less clear is the use of you to mean
  “a random person” rather than “you,” the audience. Here is an example, followed by a revision.</p>

  <p>1a. You must plan your document carefully to connect with your audience.</p>

  <p>1b. Writers must plan their documents carefully to connect with their audiences.</p>

  <p>This sentence is stronger with the revision clearly indicating who needs to plan their writing. You
  might be writing a piece addressed directly to the audience, as this textbook is. If so, be careful
  to distinguish between the use of you to mean your specific audience—appropriate when directly addressing
  an audience—and a hazier use of you that needs clarification. Use the “find” function to search your
  document for the word you, and then replace every unclear you with a definite noun.</p>

  <p>Another pattern affecting the clarity of written work is using the word this on its own without an
  explanation of what “this” is. Here is an example, along with its revision.</p>

  <p>1a. This can be confusing to the reader.</p>

  <p>1b. This lack of explanation can be confusing to the reader.</p>

  <p>In the first sentence, the audience wonders, “This what?” In the second sentence, the writer simply
  adds a noun phrase to explain, and readers will appreciate the clarification. Use the “find” function
  to search your document for this, and make sure you have defined or explained this in all cases.</p>

  <p>Revising Sentences to Change There are / There is or It is. Readers relate better to sentences that
  feature a “doer”—someone or something performing an action—and an “action”—the activity of the doer.
  For this reason, writing that overuses the sentence patterns There are . . . / There is . . . and It
  is . . . in place of a doer and action can seem unclear, remote, or dull for the reader. As you revise
  such sentences, you may find at times that you need to insert a doer or an action; one or both may be
  missing from the first version of the sentence. Here is one example, with a suggested revision.</p>

  <p>1a. There are many strategies to revise written work.</p>

  <p>1b. Authors employ many strategies to revise written work.</p>

  <p>In the first sentence, the doer (“authors”) is implied, but the second sentence includes a doer for
  a more reader-friendly version.</p>

  <p>Sentences using the It is . . . pattern need similar attention to present a doer and an action to
  the reader. Here is one example and revision.</p>

  <p>1a. It is challenging and rewarding to revise a composition.</p>

  <p>1b. I feel challenged and rewarded when revising a composition.</p>

  <p>Again, the first sentence needs an agent to do the sentence’s actions. Use the “find” function to
  search your document for “there are,” “there is,” and “it is,” and replace these weaker sentence constructions
  with doers and actions wherever possible.</p>

  <p>Eliminating Wordiness. To begin, look at the sentences below to get a sense of what wordiness is.
  Eliminating wordiness should not alter or omit information. In these sentences, the information remains
  the same, but the edited sentence shows a trimmed-down version. There was and that are eliminated, as
  is the unnecessary adverb really; was shining becomes shone; and the phrase waves in the ocean becomes
  ocean waves.</p>

  <p>1a. There was a really bright light that was shining on the waves in the ocean.</p>

  <p>1b. A bright light shone on the ocean waves.</p>

  <p>In general, try to cut out words that do not add meaning, rhythm, or emphasis. Sentences clogged
  with unnecessary words often cause readers to lose interest, patience, and comprehension. Edit sentences
  to include concrete nouns and action verbs—or “doers” and “actions,” as described above. Additionally,
  choosing modifiers carefully will help you weed out unnecessary words. Look at the following sentences,
  which all say essentially the same thing. However, you will see some changes and omissions.</p>

  <ul><li>In almost every situation that I can think of, except with few exceptions, it will make good
  sense for you to look for as many places as possible to cut out needless, redundant, and repetitive
  words from the papers and reports, paragraphs and sentences you write for college assignments. (49 words)</li><li>In
  most situations, it makes good sense to cut out needless words from your college papers. (16 words)
  • Whenever possible, omit needless words from your writing. (8 words) • Omit needless words. (3 words)</li></ul>

  <p>The 49-word sentence is full of early-draft language; you can almost visualize the writer finding
  their way while writing. The 16-word sentence says much the same thing with far fewer words. Most of
  this editing simply cut out unnecessary words. Only at the end were several wordy phrases condensed:
  “from the papers and reports, paragraphs and sentences you write for college assignments” was reduced
  to “from your college papers.” That 16-word sentence was reduced by half by rephrasing and dropping
  the emphasis on college writing. And that sentence was whittled down by nearly two-thirds to arrive
  at the core three-word sentence, “Omit needless words.”</p>

  <p>The first sentence is long-winded by any standard or in any context; each of the next three might
  serve well in different situations. Thus, when you edit to make language more concise, think about the
  overall effect you intend to create. Sometimes the briefest construction is not the best one for your
  purpose. For example, the three-word sentence is more suited to a brief list than to a sentence of advice
  for this book.</p>

  <h3>Editing for More Effective Sentences</h3>

  <p>This paragraph from a student''s first draft of a narrative contains sentences that need editing.
  On a separate sheet of paper, revise the sentences to eliminate There are . . . / It is . . . , unclear
  you and this, and wordiness. For better flow, combine sentences that are repetitive or choppy.</p>

  <p>It is now hours later. I think it is almost midnight, in fact. I have finally managed to get my paper
  started and studied for my exam. My eyes are very tired. I get up and leave my comfortable chair. Next,
  I walk out of the library. You have to walk through a glass door. I retrace the path that goes back
  to my apartment, where I came from earlier. Revision: _________________________________________________________________
  Since it is midnight, it is dark, and I nervously listen to footsteps. They are coming up behind me.
  Then they get too close for comfort. This is really making me very, very nervous. I am really very scared,
  but I step over to the sidewalk’s edge. I am trying to be calm, and I let a man walk briskly past. Phew!
  Revision: _________________________________________________________________ When I am finally at my
  door to my apartment, I fumble for the key to the door. I insert the key in the lock. I open the door,
  put my hand on the switch to turn on the hall light, and step inside the door to my apartment. There
  are two slices of pizza left in the box that is on the kitchen counter. They are really cold and very
  congealed. Revision: _________________________________________________________________ Possible edited
  version. Hours later—my paper started, my exam studied for, my eyes tired—I leave my comfortable chair
  in the library, go through the glass door, and retrace the path to my apartment. It is midnight now.
  I listen closely when I hear footsteps approaching behind me, their steady rhythm making me nervous.
  Scared, I step to the sidewalk’s edge to let a man walk briskly past. Phew! At my apartment door, I
  fumble for the key, insert it in the lock, open the door, tum on the hall light, and step inside. On
  the kitchen counter, I see the box with its two slices of cold, congealed pizza.</p>

  <p>3.7 Evaluation: Self-Evaluating</p>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Gain experience negotiating variations in genre conventions. • Learn common formats and design
  features for different kinds of texts. • Identify how genre conventions for structure, paragraphing,
  tone, and mechanics vary. The section below provides a rubric that your instructor will use to evaluate
  the aspect of your literacy experience that you have chosen to explore in a full essay. Refer to it
  frequently throughout the writing process to make sure that you are fulfilling the requirements of the
  assignment.</li></ul>

