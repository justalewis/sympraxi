body: '<p>Users to Design the Right</p>

  <p>Solution</p>

  <p>Candice Lanius and Ryan Weber</p>

  <p>Scenario 1: You have a great idea for a new invention: an umbrella that doubles as a portable coffee
  maker! But before you start creating prototypes and getting startup funding from investors, it is important
  to think “not so fast. Does this invention solve a problem for real people?” To succeed, new products
  must solve people’s problems and give them positive experiences.1</p>

  <p>Scenario 2: Your company has an existing app that allows people to find dog sitters, and they want
  to add a new feature that lets people get take-out food from local restaurants delivered to their dog.
  Management may be tempted to assign programmers to start developing this feature right away. However,
  a better approach would be to say “not so fast. Do people actually want this feature? Will they actually
  use it?” Ideally, new product features are designed based on user research, input, and needs.</p>

  <p>Scenario 3: Your manager strolls by your desk and says, “We need a 300-page PDF user manual that
  documents every feature of our website.” You’ll be tempted to jump in and get started. But if you can,
  think “not so fast. Does the audience really need a 300-page PDF? Maybe they want web help or a quick
  start guide instead.” In some cases, your manager will have done the legwork to know that users need
  the long manual. But too often, technical writing projects are based on assumptions, rather than research,
  about what users want and need.</p>

  <p>User-centered design (often abbreviated as UCD) is a methodology and work process where you do not
  make assumptions about what your audience or user needs (Lowdermilk; Norman). Instead, you “center”</p>

