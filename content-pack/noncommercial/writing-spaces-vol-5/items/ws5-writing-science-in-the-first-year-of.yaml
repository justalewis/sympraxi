body: '<p>Year of College: Why It Matters to STEM Students and How STEM Students Benefit from It</p>

  <p>Chris Thaiss and Stephanie Wade</p>

  <p>Overview</p>

  <p>This essay aims to help students who have interests in STEM fields make the most of their first year
  by showing them how to find opportunities to explore STEM topics in typical first-year writing classes,
  as well as in the STEM courses they will take, and even outside of courses; how strategies such as inquiry-based
  rhetoric (IRB) apply to science writing in all situations; and how the work of equity, inclusion, and
  antiracism are foundational to science writing.</p>

  <h3>Introduction and Background</h3>

  <p>We are writing specialists who have decades of experience working with scientists and writers. We
  believe that the communication of science is as important as the research itself; that the ways we approach
  research and writing can push against systemic inequities; and that all students have the capacity to
  be successful writers. For these reasons, we aim to illustrate the significance of writing as a vital
  part of becoming an ethical, successful scientist.</p>

  <p>This essay will consider writing both in STEM courses and in first-year writing courses that almost
  all US college students are required to take. In this article, we will show you:</p>

  <ul><li>the power of scientific literacy and its importance in your education • ways to get the most
  out of your required first-year writing course(s) • how to gain confidence and flexibility via inquiry-based
  rhetoric</li></ul>

  <p>(IBR)</p>

  <ul><li>ways to develop antiracist research and writing practices • how to give and receive useful feedback
  from teachers and through peer review • how to deepen learning and improve writing in your STEM classes
  • ways to write about STEM outside your courses</li></ul>

  <p>The Power of Scientific Literacy and Its Importance in Your Writing Education</p>

  <p>The successful transition to college requires adapting to different expectations and practices. In
  writing, this often includes moving from a rulesbased approach to an inquiry-based rhetorical approach
  (IBR), which simply means studying and practicing how writers—including yourself and your classmates—earn
  readers’ trust, make clear claims with good reasons and reliable evidence, and show why their work matters.
  In other words, pretty much the same goals as good science.</p>

  <p>The discipline of writing studies, which most first year writing courses follow, believes in the
  power of scientific literacy to improve individual lives and communities. The scientific practices of
  careful study of artifacts, asking good questions, and evaluating data to arrive at evidence creates
  the backbone of IBR, just as in STEM. These practices help you understand the choices you have as writers.
  These practices help you make choices that include all community members and achieve goals based on
  good evidence.</p>

  <p>The COVID-19 pandemic has illustrated the dire consequences of scientific illiteracy, as misunderstandings
  and deliberate misinformation have thwarted individual, community, and international responses by undermining
  respect for science. But the significance of improving public engagement in science dates back at least
  to the 1600s, when Bernard de Fontenelle wrote an argument for life on other planets, a book that was
  translated into English and became the most popular nonfiction text in colonial New England. At that
  time, modern science was a revolutionary discourse, which was just beginning to challenge the authority
  of organized religion and royalty in Europe.</p>

  <p>While this revolution contributed to more freedom for many people, STEM fields have yet to fulfill
  their liberating potential. Between the 1600s and today, access to—and lack of access to—scientific
  thinking and its results have affected many issues, such as personal and public health, urban planning,
  wildlife management, environmental protection, our understanding of race and identity, space exploration—even
  writing. We invite you to participate in the enactment of STEM communication as an</p>

  <p>374 Christopher Thaiss and Stephanie Wade inclusive practice by learning more about writing studies,
  by reflecting on your past experiences as writers, by listening closely to your peers and to scholars
  from diverse backgrounds, and by making inclusive choices as researchers and writers.</p>

  <p>The field of writing studies, which has roots in classical and modern traditions of rhetoric (Murphy
  and Thaiss 2020), also includes empirical approaches that follow steps similar to those of scientific
  research: identifying questions or gaps in knowledge or methods; reviewing literature; collecting data,
  which often come through observation, surveys, interviews, and careful reading; data analysis; and discussion
  of the implications of data. For example, research in writing studies (1981) conducted by the team of
  Linda Flower and John Hayes used think-aloud protocols to document the cognitive processes of writers.
  This research—which many researchers since have questioned, refined, and built upon—contributed to a
  cognitive model for understanding writing, which demonstrates that one important difference between
  successful writers and stymied writers is that successful writers build time to revise into their process.</p>

  <p>Ways for STEM Students to Get the Most from Required First-year Writing Course(s)</p>

  <p>Even if your past experiences have led you to doubt your strengths as a writer, decades of research
  in writing studies have shown that all writers can succeed, and your first-year writing class can support
  your growth in STEM fields in several ways.</p>

  <p>First, as you get into the course, look for connections between your interests in STEM and the course.
  The writing assignments you get in your first-year writing course will be intended to help you develop
  your general academic writing skills as a college student, but may not initially appear to provide opportunities
  to write in ways that scientists or engineers write as part of their work. But, as you learn about the
  assignments and procedures of the course, seek opportunities to connect those assignments with STEM
  topics you want to write about. For example, most first-year writing courses require some form of research
  writing: most of these assignments will require you to consult sources—and then use those sources to
  develop your own ideas. (For more on this topic, check out Stephen Lessner and Collin Craig’s “Finding
  Your Way In: Invention as Inquiry Based Learning in First Year Writing,” Writing Spaces, Vol. 1.)</p>

  <p>Second, most of these required first-year courses want students to write about subjects they are
  interested in—the courses allow choice of topics.</p>

  <p>Talk with your instructor regarding topics you might like to pursue. Even if your instructor does
  not have a formal background in STEM research, the instructor can help you connect your interests in
  STEM with the classwork and will provide useful feedback on your writing.</p>

  <p>For example, one of Stephanie’s students who was enrolled in a class on the topic of gardening at
  Bates College found a way to research her interests in the science of ecology by creating a project
  on pollinator habitats. A student in a class that she taught about place-based writing at Unity College
  researched the impact of dams on fish migration. A student in a class about culture she taught at Stony
  Brook University researched the relationship between culture and nutrition. These examples suggest how
  you might connect your interests in STEM fields to your writing class.</p>

  <p>Third, one common assignment in first year writing classes asks students to reflect on their past
  experiences with reading and writing. Ask your instructor if you can include your interests in STEM
  in this assignment. For example, in the classes Chris teaches in Writing in Science, he asks students
  to write about themselves as scientists and writers. The assignment, “Writing and Science—Your History,”
  asks students to respond to four questions:</p>

  <p>1. What are ways that writing has related to your interests as a student and scientist? Describe
  one or more examples.</p>

  <p>2. Have you seen a relationship between your growth as a writer and as a science student? Has one
  influenced the other? Or have they developed along different, even contrary, paths? Recall specific
  moments of growth—or frustration.</p>

  <p>3. Regarding your future goals, what do you see as challenges for you as a writer and as a scientist?</p>

  <p>4. What roles do you see writing playing in your ideal scientific future?</p>

  <p>The assignment helps his students set goals for the Writing in Science course—they say that no one
  has asked them these questions before. Some responses reveal that writing about science has been an
  important part of their growth. This relationship is true for students whose STEM teachers made writing
  part of their classes in high school or in college. It’s also true for students who decided on their
  own to write about their scientific interests—in a blog, for example, or on Instagram, or other social
  media. Or for students who have gone beyond their classes to create presentations</p>

  <p>376 Christopher Thaiss and Stephanie Wade for science research competitions—or to write about their
  STEM work for college applications!</p>

  <p>But more of Chris’s students say that they have done little writing about their STEM interests—especially
  in school. Many see school writing as divorced from science, mainly because these students have rarely
  written in their high school science classes. Their high school writing has been mainly in language
  arts classes, and in forms, such as essays about literature, that they see unrelated to their interests
  in STEM. Even more troubling, many of his students have developed fear of writing and look for ways
  to avoid it.</p>

  <p>If you have had experiences like these, it is even more important to look for ways to connect your
  STEM interests to your first-year writing course, as ways to build your skill and confidence.</p>

  <p>How to Gain Confidence and Flexibility via Inquiry-based Rhetoric (IBR)</p>

  <p>One way to build confidence in first-year writing is to develop what neuroscientists call metacognition,
  also known as thinking about thinking. For writing, this means assessing your past work and your writing
  processes. When have you felt good about yourself as a writer, in school or out? What mistakes have
  you made that you have learned from? How can you take these lessons to new situations?</p>

  <p>Metacognition is an essential part of inquiry-based rhetoric (IBR), which we introduced earlier.
  Learning inquiry-based rhetoric (IBR) takes time and practice, just as learning lab techniques and applying
  formulas does. And, just as determining which methods, pipettes, or formulas to use requires experience
  and the ability to make judgements about the purpose of the experiment and the context, so IBR relies
  on experience and the ability to make judgements about the purposes, audiences, and situations of the
  writing.</p>

  <p>IBR works against the common misperception of writing as a set of rigid rules. For example, you may
  have been told never (or always!) to use “I” in your writing, or that every paragraph should have 4-7
  sentences, or that all papers have a thesis at the end of the first paragraph. You might also have observed
  that most published writers, including in STEM, rarely follow these “rules.” IBR teaches students how
  to move beyond so-called ‘rules’ and instead to understand the choices writers face when composing in
  various situations (contexts) for diverse readers (audiences) and to make savvy choices.</p>

  <p>IBR is part of the broader field of rhetoric, which you will hear about in your first-year writing
  courses. In brief, rhetoric has two parts. The first part focuses outside the text: on the writer’s
  purpose, audience, and context. The second part focuses on the text itself: use of logic—the ability
  to make clear claims with related reasons and reliable evidence; character—the ability to earn your
  readers’ trust; and emotions—the ability to show why the work matters. In many writing classes, you
  will be taught to read rhetorically: analyzing ways writers use logic, emotions, and character to achieve
  their purposes for their intended readers.</p>

  <h3>Strengthening STEM Writing through Cultural Rhetorics and Antiracism</h3>

  <p>Some writing classes will introduce you to a particular form of rhetoric known as cultural rhetorics,
  and you might have an instructor who practices antiracist pedagogies. Cultural rhetorics are “the study
  and practice of making meaning and knowledge with the belief that all cultures are rhetorical and all
  rhetorics are cultural” (Bratta and Powell 2016). Cultural rhetoric changes rhetorical analyses and
  practices in significant ways by illustrating the richness of knowledge available when we pay attention
  to the work of people who have historically been marginalized in Western, colonial academic institutions
  in general and in STEM fields in particular. Developing scientific literacy practices that follow principles
  of cultural rhetorics includes asking questions about audience, purpose, context, logic, emotions, and
  character. It also requires understanding the impact of racism and other forms of systemic inequality
  on our personal perspectives and our cultural traditions—including scientific methods and knowledge.</p>

  <p>Some scholars and teachers have developed antiracist teaching practices to ensure their classes are
  inclusive spaces that serve the needs of all students, that value the various forms of knowledge students
  bring to class, and that use the classroom to address systemic inequities such as racism and sexism.
  Antiracist teaching practices in STEM and in writing acknowledge that systemic inequity, implicit biases,
  and micro-aggressions disadvantage Black people, Indigenous people, People of Color, first generation
  college students, and other people who have been minoritized due to their skin color, ethnicity, gender
  identity, sexual orientation, and class. Antiracist teaching and writing practices aim to correct these
  inequities in a number of ways.</p>

  <p>For example, Chris’s classes of STEM majors from the sciences and engineering are highly diverse
  ethnically and linguistically. Some writ-</p>

  <p>378 Christopher Thaiss and Stephanie Wade ing assignments in these classes are multimodal (using
  video, photography, and infographic charts, as well as written texts in accessible language). Each student
  chooses an audience (family members, home communities, special-interest groups, etc.) they would like
  to reach. Designs of projects use multimodal tools that the students feel can reach the audiences they
  choose, so that these readers can, the students hope, improve their lives. Sample projects include,
  among many possibilities, brochures and infographic charts on health topics for medical offices visited
  by children and parents in communities of color; websites, blogs, and calendars (some multilingual)
  on nutrition, agricultural practices, and new technologies; oral-visual presentations to high schoolers
  that encourage them to consider STEM fields.</p>

  <p>Nationally, the American Association of Colleges and Universities (AAC&amp;U) through its Project
  Kaleidoscope (PKAL) sponsors annual conferences on Transforming STEM Education. PKAL’s central goal
  is increasing the representation—and success—of BIPOC students and researchers in all STEM fields. Moreover,
  because many STEM fields have historically failed to recognize and advance the careers of women and
  of LGBTQ+ scholars, AAC&amp;U has also made gender inclusiveness a continuing goal.</p>

  <p>What this means for you as a student and a writer with interests in STEM will depend on your own
  background; the intersections of race, class, gender identity, sexual orientation, and language in your
  identity and experience. You will want to reflect on the possibility that you have implicit biases and
  should work to overcome them. If you come from a privileged background, you will want to be attuned
  to the possibility that you engage in micro-aggressions and you will need to learn alternatives. If
  you are a first-generation college student or a BIPOC student, you may want to know about the resources
  available to help you navigate systems of oppression. Many campuses have programs and offices devoted
  to supporting students from minoritized backgrounds. #ShutDownSTEM offers many resources organized to
  address various backgrounds.</p>

  <p>You will also want to learn to look for bias in research because much scientific research is inflected
  by racism and sexism. This bias shows up in the types of questions investigated, the subjects chosen,
  the types of evidence valued, the methods selected, the language used, and the metaphors employed. “Want
  to Dismantle Racism in Science? Start in the Classroom,” a conversation between science educators, illustrates
  problems such as the erasure of Black scientists from history, ​a​ nd offers solutions to address racism.
  For more information in regard to gender, check out Emily</p>

  <p>Martin’s 1991 article, “The Sperm and the Egg: How Science Has Constructed a Romance based on Stereotypical
  Male-Female Roles.”</p>

  <p>In addition to analyzing your behavior and analyzing bias in STEM research, you can actively transfer
  antiracism to your STEM classes by:</p>

  <ul><li>Working in diverse groups • Listening across difference • Creating research questions that serve
  underrepresented people • Engaging in inclusive citation practices • Using inclusive language</li></ul>

  <p>The 2020 Conference on College Composition and Communication statement “This Ain’t Another Statement!
  This is a DEMAND for Black Linguistic Justice!” offers important information and resources on antiracism
  and college writing. You will also find deeper explorations of language justice in two essays in Writing
  Spaces, vol. 4: “Workin’ Languages: Who We Are Matters in Our Writing” (by Sara P. Alvarez, Amy J. Wan,
  and Eunjeong Lee) and “Beyond Language Difference in Writing: Investigating Complex and Equitable Language
  Practices” (by Christina Sánchez-Martín).</p>

  <p>Building Confidence and Rhetorical Awareness through Feedback and Peer Review</p>

  <p>Learning inquiry-based rhetoric (IBR) develops your metacognitive writing process. To achieve this,
  you’ll closely read your draft to identify which parts you most want your reader to comment on. If your
  instructor has given you a rubric (list of questions) for the assignment, you can use it to analyze
  your work, then to frame your request for feedback. If a rubric is not provided, create your own. As
  an example, here’s a rhetorical rubric we provide:</p>

  <h3>Logic</h3>

  <p>Questions to Help Writers Set the Agenda for Feedback</p>

  <p>Questions about Critical Thinking and Logic • What is my central claim? • What reasons do I give?
  • Is my evidence reliable?</p>

  <p>380 Christopher Thaiss and Stephanie Wade</p>

  <p>Emotions</p>

  <p>Questions about Why the Work Matters</p>

  <ul><li>What gap in research or knowledge of the subject does my work address?</li><li>Why does this
  matter? • What are the implications of my work that</li></ul>

  <p>I’ve stated? • What next steps do I see for this research?</p>

  <p>Character</p>

  <p>Questions about Genre and Reader Expectations</p>

  <ul><li>What organizational patterns do I follow? • What are the relationships between my points? •
  Do I provide appropriate detail about my methods and materials? • Who does this research serve? • Are
  my research methods ethical? • Do my visuals accurately represent my results? • Do I use inclusive language?
  How understandable would I be to someone reading this draft? • Do I follow ethical and inclusive citation
  practices</li></ul>

  <p>(Bali 2020)?</p>

  <p>Questions about Your Goals and Process • How did I generate material, draft, and revise this paper?
  What worked? What should or might I do differently? • What were my goals as a writer? How did I achieve
  them? Where would I like to continue to improve?</p>

  <p>In addition to feedback from instructors, you will most likely give and receive feedback from classmates
  via peer review. You and the other members of your class will learn how to read your classmates’ writing
  rhetorically, appreciate its strengths, and suggest improvements. Peer review is a vital learning opportunity;
  it sparks insight into how others conceive writing tasks similar to yours. It gives you permission to
  ask for their careful response to your work.</p>

  <p>Moreover, as a STEM student, you already know that knowledge in any scientific field grows primarily
  through peer review, by which practitioners are called on to review grant applications and articles
  submitted for publication. If you use the opportunity in your writing class to learn how to perform
  peer review carefully and respectfully, you will get closer to becoming a STEM student whom future colleagues
  will value. Successful peer review requires practice in rhetorical reading, which we describe in the
  next section of this essay. As you perform peer review, you might use a rubric such as that we showed
  earlier, one designed by your instructor, or one you might create. Find more information about peer
  review in Ron DePeter’s “How to Write Meaningful Peer Response Praise,” in Writing Spaces, vol 3.</p>

  <h3>Beyond the First-Year Writing Course: Writing in STEM Classes</h3>

  <p>In STEM writing, as part of IBR, authors establish their character and earn the trust of readers
  in several ways that depend on the genre in which the author is writing and the audience the writer
  aims for. STEM writers situate their work in previous research, summarizing relevant publications; they
  carefully describe their methods and illustrate their data in clear charts, graphs, and other visuals.
  STEM writers, like other writers, make clear claims about what their results mean as well as about the
  limits of their results.</p>

  <p>For the genre of formal scientific lab reports for academic audiences, writers carry out IBR through
  the format of the IMRAD report, which in the 20th century became standard in STEM journals. The IMRAD
  acronym means Introduction, Materials and Methods, Results, And Discussion. The IMRAD structure includes
  the following sections:</p>

  <ul><li>An Abstract that summarizes the overall report • An Introduction that summarizes prior research
  on this topic, then states the gap in knowledge, the purpose of this research, and perhaps a hypothesis
  • A Materials and Methods section that describes the tools used and the steps in the research process
  • A Results section that reports the principal findings of the research • A Discussion section (including
  a conclusion) that states what the authors consider the significance of the results and necessary further
  research.</li></ul>

  <p>You may be fortunate in your first year to be in a STEM course that actually asks you to read and
  write in the IMRAD form, perhaps in a lab section that accompanies a large lecture. Writing IMRAD-style
  reports, as well as reading closely the research articles in journals, will definitely</p>

  <p>382 Christopher Thaiss and Stephanie Wade build your powers as a scientific thinker. These articles
  will often challenge students through difficult, highly technical language, but learning to read and
  understand these articles is critical for your growth as a scientist.</p>

  <p>But other than the practice you’ll get in such a course, how do you learn to do these IMRAD exercises
  well? Fortunately, many guides online as well as STEM writing textbooks focus on the IMRAD report (see
  our list of resources). Because every journal in science contains articles that use the IMRAD structure,
  you’ll have many opportunities to study articles that will help you learn how to do IMRAD well.</p>

  <p>Another helpful practice is to use rhetorical reading as a way to apply IBR. Compare articles on
  the same subject and consider how and why the subject is written about differently. Is there another
  way that the subject could be written about that seems clearer or truer to you? Put your thoughts into
  writing. Try out different ways to say things on subjects of interest to you.</p>

  <p>You can actively “transfer” the skills of rhetorical reading from your first-year writing class to
  your work in STEM by analyzing how texts in STEM fields use emotional appeals. (For a fuller discussion
  of such transfer of ideas, see “The Importance of Transfer in Your First Year Writing Course” by Kara
  Taczak, Writing Spaces, vol. 4.) In STEM writing, authors typically create emotional appeals by demonstrating
  a gap in the prior research and by explaining the implications of their research to show why their work
  matters. In the example below, an article titled “A Systematic Review of Empirical Research on Self-Reported
  Racism and Health” by Yin Paradies (International Journal of Epidemiology, 2006), the author briefly
  summarizes previous studies and then build emotional appeals by noting that his work updates and expands
  prior work.</p>

  <p>A handful of previous reviews have attempted to provide an overview of certain aspects of this emerging
  area of epidemiological research. The first article to consider the health impact of racism (along with
  sexism and social class) was published by Krieger et al. in 1993. This was followed, in 1999, by a review,
  also by Krieger, of 15 studies examining ethnic and/or racial discrimination and health and, in 2000,
  by a review of 13 studies examining racism and mental health for African Americans by Williams et al.
  There were also three reviews published in 2003, with Wyatt et al. summarizing 19 studies relating racism
  to cardiovascular disease for African Americans, Brondolo et al. discussing studies relating racism
  to blood pressure (six studies) and cardiovascular reactivity (11 studies), and Williams et al. reviewing
  53 population-based empirical studies of ethnic and/or racial discrimination, which were published from
  1998 onwards and related to various health outcomes. Drawing in particular on the most recent review
  by Williams et al., this paper updates and expands upon these earlier reviews by examining the key characteristics
  of epidemiological studies of self-reported racism and health—where and when studies have been conducted,
  the race, age and gender of study populations, study designs, sample sizes, and data sources used. (n.p.)</p>

  <p>At the end of the introduction, the author further develops his emotional appeals by signaling that
  his research has important implications in regard to the health of those who experience racism:</p>

  <p>The nature of associations found between self-reported racism and health is detailed for a range
  of health outcomes across various study and exposure characteristics along with identified effect modifiers
  and mediators of these associations. (Paradis n.p.)</p>

  <p>Conversely, many first-year STEM courses do NOT give you the opportunity to write reports but are
  primarily lecture-and-reading courses. These require you to memorize principles, formulae, and substances,
  on which you will be tested.</p>

  <p>Nevertheless, even these courses present opportunities to write to enhance your learning of facts
  and principles:</p>

  <ul><li>Teachers may include online exercises to help you understand and apply the material. As you
  engage in these exercises, you solidify knowledge and build powers of expression—even if the process
  seems difficult at first.</li><li>Because STEM courses often require you to read textbooks in print
  or online, write notes and explanations for yourself as (1) means to understand all those terms and
  ideas and (2) make it easier for you to put those terms and ideas into wording that you are comfortable
  with and likely to remember.</li><li>Memorizing means making your perceptions and your connections between
  ideas part of your working memory. Every time you think about a concept and try to express it in related
  words, you are building your ability to draw on that concept in multiple situations. That is why writing
  about ideas and associated concepts works so well as a memorizing exercise. The same goes for other
  memorizing methods: drawing, diagramming, and discussing ideas with others. Consider all the ways you
  have memorized an idea—or perfected a skill—that is important to you. What tools have you</li></ul>

  <p>384 Christopher Thaiss and Stephanie Wade employed to learn that idea or skill so that you can remember
  and apply it?</p>

  <h3>Writing about Science Outside Your Courses</h3>

  <p>Beyond your courses, you may have discovered ways to use writing to deepen your STEM learning and
  build your powers of expression. Here are some widely-used methods:</p>

  <p>1. Start your own blog.</p>

  <p>Blogs have proliferated in every STEM discipline (just Google “STEM blogs” and you’ll see). Set one
  up using Blogspot, Wordpress, or another tool. You don’t need to publish your blog, but you can if you
  wish to build a readership. You can start out using your blog as a writing and learning space just for
  yourself; you can make it public as you gain confidence. Four rewards of blogging:</p>

  <ul><li>Keep a record of your thinking, and return to earlier entries to see how you’ve grown, which
  contributes to metacognition</li><li>Read other bloggers, to get ideas for your own blog or perhaps
  begin to build a blogging community in your area of interest</li><li>Experiment with photos, videos,
  audio, infographics, and charts • Practice different writing styles and writing for diverse readers—
  children, parents, friends, people you admire, people who think differently from you.</li></ul>

  <p>2. Write to memorize and reflect on your reading.</p>

  <p>Writing about what you read helps you to (1) understand it, (2) remember it, and (3) evaluate it.
  Too often, students assume that what they read in textbooks or hear in lectures is merely information
  to be spit back on tests. But to be a scientist, you need to become a strong reader: to develop a critical
  eye and ear not only for what other writers write, but also how they write. If you learn IBR, you’ll
  have a framework for this analysis. For example, when you read a scientific journal article or a popular
  article about science, look carefully at how the subject is described. Note differences from one article
  to another. Ask yourself: “how might I say this differently?”</p>

  <p>3. Write about science via social media.</p>

  <p>Facebook, Instagram, and TikTok allow for multi-modal communication— in words, photos, drawings,
  video, and sound. They allow researchers to share work in progress. By participating in these conversations,
  you’ll</p>

  <ul><li>learn from ways others use multimodal tools • learn about emerging research, and • practice
  multimodal communication</li></ul>

  <p>Moreover, most of these platforms limit the number of words, so you’ll practice how to communicate
  succinctly.</p>

  <h3>Conclusion</h3>

  <p>This brief guide introduces you to tools to make the most of opportunities you have in your first
  year of college to build your skill as a writer and learner in STEM. Equally important, we’ve explained
  a conceptual framework, inquiry-based rhetoric (IBR), to apply to all the reading and writing you will
  do in college. This framework includes a related system, antiracist cultural rhetorics, that can expand
  your rhetorical expertise, so that how and why you communicate becomes more inclusive and versatile—while
  helping in the effort to overcome historical inequities among people, especially in STEM fields.</p>

  <h3>Works Cited</h3>

