  <p>Teacher Resources for “You Are Good for Wikipedia”</p>

  <h3>Overview and Teaching Strategies</h3>

  <p>This essay invites students to consider their potential in relation to contributing to and reading
  Wikipedia through three specific frames of interaction. First, by participating in the Wikipedia community,
  students bring a more diverse set of identities and positionalities compared to the current editorial
  demographic. Next, because students have access to academic libraries (and all the resources those institutions
  provide), they are well-positioned to bridge the uneven divide that currently exists between open access
  resources and closed or paywalled databases. Finally, because they are actively learning to become critical
  thinkers and evaluators, students can leverage skills like lateral reading to assess and improve the
  content, further boosting Wikipedia’s credibility. While this essay would pair well with a course that
  invites students to research and add to an existing Wikipedia article, we also believe that it could
  serve students and teachers who might be engaging the encyclopedia as a discussion topic or low-stakes
  activity.</p>

  <p>For instance, teachers might ask students to use the citation hunt tool (https://citationhunt.toolforge.org/),
  which identifies unsourced (“citation needed”) statements, to add a reference to a Wikipedia article.
  In this example, the essay would work well in a larger unit related to online source evaluation, research,
  misinformation, or digital culture. Teachers interested in replacing a formal writing assignment with
  a Wikipedia-based project might consider assigning James P. Purdy’s previous Writing Spaces essay “Wikipedia
  Is Good for You!?” before asking students to read this piece. Teachers should also be aware of a few
  organizations to reach out to for help in designing and implementing Wikipedia-based assignments.</p>

  <p>Wiki Education (https://wikiedu.org) provides active support for instructors and students trying
  out Wikipedia-based education, including learning modules, teacher and student training, live advice
  for pedagogical design, etc. While the Wiki Education Foundation works with college instructors and
  students in the U.S. and Canada, the Wikipedia Education Program (https://meta.wikimedia.org/wiki/Wikipedia_Education_Program)
  serves educators at all levels worldwide. So, whether you want to jump into a more robust assignment
  or just skim the surface, teachers are</p>

  <p>298 Matthew Vetter and Oksana Moroz encouraged to check these resources and get involved in the communities
  that support them.</p>

  <p>Suppose you would like to provide your students with a sample student reflection on their experiences
  with Wikipedia editing. In that case, you can share Abby’s essay entitled “Wikipedia’s Place in Higher
  Education” (https://wikiedu.org/blog/2019/07/09/wikipedias-place-in-higher-education/) published by
  Wiki Education.</p>

  <h3>Discussion Questions</h3>

  <p>1. Let’s think back to your middle/high school years. Do you remember that mantra from your teacher:
  “Do not use Wikipedia for your papers”? What would you reply to that teacher today? How can you prove
  that Wikipedia is not bad for your writing? What would you say to that teacher after reading this essay?</p>

  <p>2. What about Wikipedia’s diversity problem? In what areas do you think you can contribute the most?
  Reflect on your own identities first, and then think about gender identity issues, race, discrimination,
  diversity, and inclusivity pertaining to Wikipedia’s goal of representation. To get started, skim the
  “Gender Bias on Wikipedia’’ (https://en.wikipedia.org/wiki/Gender_bias_on_Wikipedia) article to get
  an idea of what is going on.</p>

  <p>3. In groups or with a partner, discuss possible roadblocks or challenges on your way to start editing
  Wikipedia and ways to overcome those.</p>

  <p>4. Look up Wikipedia policies and guidelines related to “Neutral Point of View,” “Reliable Sources,”
  and “Verifiability.” What do you learn about how the community works together to evaluate information
  and prevent the spread of misinformation?</p>

  <p>5. As a group activity, create a plan for finding an article that needs improvement due to its lack
  of diverse representation or problematic positioning by adding an additional source, rephrasing some
  sentences, and/or expanding the topic. Next, look for credible sources in library databases and study
  them carefully. Finally, contribute to the article by adding an extra source or go big and edit some
  sentences, adding new relevant information.</p>'
