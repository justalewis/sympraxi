  <p>Teacher Resources</p>

  <p>Overview and Teaching Strategies</p>

  <p>Instruction on composing literature reviews typically happens near the beginning of a writing project.
  As such, this chapter can be integrated into the early phases of student writing either as a theoretical
  framework to introduce students into the idea of a literature review or as a heuristic to get students
  started on gathering, curating, and annotating sources that are to be potentially relevant to their
  piece of writing—or both! There is a procedural element to this chapter that might allow for instructors
  to use it as a guide over the course of one or two weeks at the outset of an assignment, as students
  transition from finding sources to evaluating them to curating them.</p>

  <p>Given my argument that literature reviews are an integral part of many genres, from academic papers
  to informal proposals, this chapter can be applied to most any genre covered in a technical writing
  classroom. That said, individual instructors will need to supplement this chapter with specific guidance
  on the particularities of the nature of literature reviews for each genre. Issues such as length, style,
  tone, and depth of “literature reviews,” broadly defined, are determined by genre, industry, and organization.
  Integrating these specific features into the larger instruction on literature reviews will be most helpful.</p>

  <p>The tables used in this chapter also might lend themselves well to collaborative work, where groups
  of students are tasked with finding and synthesizing their researched sources into a centralized document.</p>

  <h3>Discussion Questions</h3>

  <p>Consider supplementing this chapter with the following questions:</p>

  <p>1. How have you been taught to write literature reviews in the past? Was it always in the context
  of academic papers?</p>

  <p>2. Where else do you see the function of literature reviews in contexts not discussed here? Do you
  see overviews of existing content take shape in, say, YouTube videos? If so, how?</p>

  <p>3. In a small group, discuss how literature reviews vary by major, field, or discipline. What differences
  do you see? And why do you think those differences exist?</p>

  <p>4. Composing an effective literature review requires handling a good deal of information. What are
  some ways you can manage your content and information in an efficient way?</p>'
