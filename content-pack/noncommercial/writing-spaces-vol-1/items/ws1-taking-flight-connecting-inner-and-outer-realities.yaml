body: '<p>Taking Flight: Connecting Inner and Outer Realities during Invention</p>

  <p>Susan E. Antlitz</p>

  <p>One of the toughest challenges beginning writers face is figuring out what to write about.* Connecting
  personal identity and purpose to more public contexts and subjects can play a significant role in helping
  people to write confidently. Also, since writing anxiety is a common cause of difficulty getting started,
  strategies for reducing anxiety including movement, sound, intentional distraction, role playing, journaling,
  and prayer and meditation can help the invention process to unfold more smoothly. Electronic media such
  as email, messaging or texting, and presentation software also provide avenues for generating ideas.
  By exploring these methods, you can also increase your satisfaction with writing, and you can find new
  ways to build bridges between the ideas and purposes that are meaningful to you and the writing you
  produce for others.</p>

  <h3>Understanding the Connection between the Personal and the Social</h3>

  <p>Some college writers see the writing that is done for classes as separate or different from one’s
  personal goals and interests. It can be easy to slip into the mindset that those personal activities,
  commitments, and</p>

  <p>*  This work is licensed under the Creative Commons AttributionNoncommercial-Share Alike 3.0 United
  States License and is subject to the Writing Spaces Terms of Use. To view a copy of this license, visit
  http:// creativecommons.org/licenses/by-nc-sa/3.0/us/ or send a letter to Creative Commons, 171 Second
  Street, Suite 300, San Francisco, California, 94105, USA. To view the Writing Spaces Terms of Use, visit
  http://writingspaces. org/terms-of-use.</p>

  <p>Connecting Inner and Outer Realities during Invention convictions are off-topic or not relevant to
  class-work. But it doesn’t have to be that way.</p>

  <p>Instead of writing being driven either by individual identity or by outside criteria, both of these
  facets of identity are interwoven, and used in conjunction with one another, these influences act as
  the two wings that can help get a writing project off the ground. The sense of personal identity and
  having one’s own goals when writing (something that waits to take flight) can play a significant role
  in a writer’s motivation and ability to write confidently. However, a text also needs to connect with
  the rest of the world in ways the audience can understand if it is to be effective.</p>

  <p>That which makes us unique also connects us to others. Our DNA is our individual blueprint, and except
  for the case of identical twins or clones, each person has his or her own unique combination of genes.
  Yet, those genes come to us through a long heritage, stretching back countless generations, and have
  been passed down to us by our ancestors. Much like DNA, the social world of ideas and experiences we
  are born into both forms the basis of our individuality and deeply connects us to larger contexts in
  the world around us.</p>

  <p>The individual and the collective are not mutually exclusive; in fact, they complement and reinforce
  one another. The inner world and the outer world are in constant flux, shaping, reinforcing, and challenging
  one another into new awareness. This matters in writing because it’s easy for people to think of writing
  as more one or the other—as being about personal expression, creativity, inspiration and communicating
  one’s ideas, or as being a task that is required by and for teachers, supervisors, or other audiences.
  Neither fully captures what writing is, and indeed, these two aspects can work together in many ways.</p>

  <p>Trying to divide the personal from the social is ultimately a futile task because they overlap and
  influence one another so much, but as human beings, we have a tendency to think in terms of categories,
  porous as they may be. The categories are an illusion, but they can be helpful as a way to get started.</p>

  <h3>The Two Wings: An Exercise</h3>

  <p>While thinking about an idea and devising a way to write about it, you may find the following exercise
  helpful. We can call this exercise</p>

  <p>Susan E. Antlitz</p>

  <p>Taking Flight, or finding the two wings of your ideas. Since there is a personal as well as an inter-personal,
  or social, aspect to any idea, this is a way of mapping out those aspects of the idea.</p>

  <p>1. Sketch out a blank diagram like the one I’ve drawn below.</p>

  <p>2. Think about your interests, thoughts, activities, goals, and questions.</p>

  <p>3. List the ideas that are mostly personal under one wing (leave the corresponding space under the
  opposite wing blank until step 5).</p>

  <p>4. List the ideas that are connected to larger contexts, communities, or issues under the other wing.</p>

  <p>5. Once you have your initial list, go back and fill in information relating to each idea under the
  opposite column, so that each idea now lists both a personal and a social component.</p>

  <p>In Figure 1, I’ve outlined some key areas that will generally fall under each category. You might
  think of other key areas to include. Figure 2 shows an example of what your actual diagram might look
  like.</p>

  <h3>Figure 1. Diagram of Personal and Social Topical Aspects</h3>

  <p>This diagram can be used with either a list of interests you are using to try to find an idea, or
  it can be used to focus or develop an idea once you have a general direction.</p>

  <h3>Here is the diagram I made that lists several possible ideas:</h3>

  <h3>Connecting Inner and Outer Realities during Invention</h3>

  <p>Figure 2. Diagram of Personal Interests and Social Components.</p>

  <p>Here, I listed a few of the ideas or causes that are personally important to me, and then tried to
  pair those with the issues in the outside world by asking questions that I could explore in the process
  of building an essay. For example, an issue that I have a strong personal and emotional response to
  is the killing of healthy and potentially adoptable animals in shelters and animal control facilities.
  To link this to a context beyond myself, I listed the issue of kill versus no-kill shelters in the right-hand
  column, and in the left-hand column, I asked how the strategies used by no-kill shelters could also
  help other shelters to increase adoption rates and reduce euthanasia. I now have a question I can research
  and write about.</p>

  <h3>Look for Unexpected Connections</h3>

  <p>Another way to build possibilities for writing is to look over your list of ideas and create connections
  between options that are not deliberately paired. For example, since I already had three potential ideas
  and their social aspects listed in the diagram, I didn’t put anything in the social column for the last
  few ideas I had in the personal column. One of these was “Favorite shows.” If I had gone into more detail,
  I might have listed the titles of some of my favorite television series, and then connected that to
  the social aspects I had listed for other items. In this case, one that would work would be “models
  or types of community. How does one build or encourage community?” I could write an essay that looks
  at how the relationships form and change over time between the characters in my favorite shows, and
  then even do some research into models of community building and community formation and</p>

  <p>Susan E. Antlitz see how well fiction mirrors what the relationship/community scholars have theorized.</p>

  <p>Alternately, I could connect the subject of TV programs to the animal shelter idea. It’s unlikely
  I’d find a direct connection, but if I alter the idea of the animal shelter to something like how animals
  are portrayed on screen, I could also build on that idea, or even write about the different ways our
  society views or treats animals.</p>

  <p>Remember that your diagram and your list of ideas are meant to be a jumping-off place, so you can
  change them as needed if you think of new ideas or find a new direction you want to explore.</p>

  <p>The openness to creating connections where you may not expect to find them can be very useful. Cultivating
  creativity and connectionbuilding is a very healthy habit that can have unforeseen benefits for your
  writing.</p>

  <h3>Random Words</h3>

  <p>Here is a game you can use to help develop your creative flexibility. It’s one of my favorites.</p>

  <p>1. Take a sheet of paper and fold it in half.</p>

  <p>2. On one half write a list of random words, one per line.</p>

  <p>3. Then, with the page still folded down the middle, give the paper to someone else, with your list
  facing down so the other person can’t see it.</p>

  <p>4. On the other half of the paper, ask the other person to write a list of random words that he or
  she thinks of.</p>

  <p>5. Then unfold the paper. You should have, on each line, a word you wrote and a word someone else
  wrote. These words will hopefully have nothing to do with one another.</p>

  <p>6. And this is where the game begins: Try to find the connection between the two words on each line.
  Write a sentence that uses both of them in a logical and believable way.</p>

  <p>This exercise can help to build your mental agility and help to make you more alert to forming connections
  that may not be immediately obvious to other people.</p>

  <h3>Connecting Inner and Outer Realities during Invention</h3>

  <p>For example, I have picked a word, tree, and using a Facebook status update, asked one of my friends
  to give me a random word, which has turned out to be svelte. The sentence I created from these two words
  was, “The svelte tree waved its branchy arms like an ecstatic dancer.” I used the metaphor of the dancer
  to make it more of a challenge, but the sentence could have been simply, “The svelte tree waved its
  branches.”</p>

  <p>Half of the game is the sense of anticipation before you know what word or words the other person
  will give you. It lightly mirrors the anxiety you may feel before you know what to write about. However,
  since, it’s also a game and the stakes are low, it begins to build an association between the anticipation
  of the unknown and your amusement or enjoyment. The game usually turns out to not be as hard as one
  anticipates. An element of play can take the edge off of writing anxiety.</p>

  <p>Another friend gave me the word bongo. I admit this was slightly harder, but I came up with, “As
  the tree stood drinking in the sun with its verdant leaves, it had no awareness that its life would
  soon change forever, and that it was destined to become the frame of a pair of bongo drums for young
  Sally.” I saw a connection between the tree and the word bongo because a bongo is a type of drum, and
  drum frames are usually made of wood. I’ve embellished my sentence just to play with the language, but
  “The wood from the tree was used to make bongo drums” would have also sufficed. Simple or complex, poetic
  or plain, no sentence that connects the two words is wrong. This is also fun to do with a group of people,
  where everyone can share what they came up with. It’s neat to see the sorts of things people can create
  out of this.</p>

  <h3>Build Ideas through Compound Topics</h3>

  <p>An important part of invention is the ability to make connections. One strategy that I find myself
  using is to think of my topics not as single ideas, but rather pairs of related ideas. It can be helpful
  to phrase your topic in such a way that it includes “and,” “or,” “but,” or other connecting words because
  that can shift your focus to the relationships between parts of the subject. You are more likely to
  end up with a more specific focus or direction that way.</p>

  <p>An example might be to take a broad subject such as the Internet and combine it with another subject,
  such as the workplace, to focus on the Internet in the workplace. Bringing the two subjects together</p>

  <p>Susan E. Antlitz makes me think of the following questions. How has the workplace changed as a result
  of the Internet? How has email changed the way a company is run? What do employees or managers need
  to know about digital communications technologies? What problems might they encounter, and how can those
  be resolved or prevented? From there, I can keep asking questions until I find one I want to learn more
  about and eventually write about.</p>

  <p>The advantage of focusing your essay around a compound idea is that it will tend to make the subject
  and focus of what you are writing about more complex. For example, if I make up a pair of subjects like
  “Animals and the Elderly,” “Doctor Who and identity,” or “work as spiritual growth,” I could then build
  on each of these ideas and try to think of what sorts of things might be in a resulting essay.</p>

  <p>Embracing the Personal</p>

  <p>Prayer and Meditation</p>

  <p>You may be surprised to find a reference to personal spirituality in an essay of this kind, but when
  you are doing the invention work for writing, you need to be who you are. If you have your own faith,
  embrace it as part of your thinking and writing process, and that openness can help to keep your creativity
  flowing. It’s much harder to be creative and generate ideas while closing off a part of yourself. Therefore,
  love and accept all aspects of yourself as you are in the process of creating a text.</p>

  <p>I worked for a time at a private, religious institution, and the classes I taught there were like
  most writing classes in terms of the content of the class and the use of well known invention techniques
  for writing such as freewriting, looping, concept mapping, etc. (if you are unfamiliar with these, ask
  your teacher to explain them to you or look them up online). However, since it was a religious school,
  I had the freedom and even the institutional support to bring faith into the work the class did.</p>

  <p>One day at the beginning of the semester after we had been discussing various aspects of our individual
  writing processes, I asked the students if they ever included prayer as part of their writing process,
  and I was surprised when no one in the class had previously thought to do that, even though prayer was
  a part of their lives in other ways. This</p>

  <p>Connecting Inner and Outer Realities during Invention demonstrates that using one’s personal and
  even spiritual resources is not always an obvious strategy in a formal class setting, even when it would
  be welcomed. Sometimes we have to bring those options out into the open and talk about them because
  it might not automatically occur to us that we can make those connections.</p>

  <p>If you belong to a religion or spiritual tradition that uses prayer or meditation, then I encourage
  you to also include that as part of your writing process and as part of how you generate ideas to write
  about. Pray for insight and ideas, if that fits with your belief system, or meditate to free up your
  awareness. These activities may lead to becoming aware of an idea that you had not considered before,
  and they may help with exploring and developing an idea once you have one. These practices can also
  lessen anxiety since anxiety is partly about being alone when facing an overwhelming task. If you are
  a spiritual person who believes in a deity, then use that to remind yourself that you are not alone,
  even when confronted with a challenging writing task. Or, if you meditate, that can help you to relax
  your mind and body and let go of stress, which usually increases intellectual and creative performance.
  Let those parts of your life be part of your writing process as well.</p>

  <p>I often pray for insight when I am working on a writing project. There is a certain amount of trust
  involved—I am generally confident that I will be able to think of something, and I always do, even if
  I am not sure at first what I am going to come up with. That sort of confidence helps to limit my worrying
  about what I am going to write, and it puts me more in the frame of mind that discovering possible ideas
  is an exciting adventure. Then I can’t wait to see what happens. If you are a person who prays about
  other aspects of your life, try doing so with your writing assignments, and see how it turns out. Remember,
  let all of who you are be part of your inventing. What other aspects of your identity might inform your
  writing process?</p>

  <p>During invention, no aspect of who you are is off limits, though you need to decide for yourself
  how much of that process you are willing to share publicly, and how much is appropriate to include in
  the final draft. The final draft should be adjusted to fit the needs and expectations of your audience
  and to suit the purpose of your writing. The behind-the-scenes work you do, however, is yours to do
  with as you will, unless an assignment also asks you to try specific invention or pre-writing strategies
  as part of your work.</p>

  <p>Susan E. Antlitz</p>

  <p>Feelings and Ideas</p>

  <p>I have learned that feelings and ideas are very closely related during invention, and so it’s a good
  idea to pay attention to them. One of my hobbies is collecting gemstones and crystals, which are to
  me an inspiring form of natural artwork. Part of what gives me such a sense of delight when looking
  at stones comes from seeing them through an artist’s eye. Consider, for instance, a polished stone made
  from polychromatic jasper and how my observations led me to think about writing.</p>

  <p>Figure 3. Polychromatic Jasper.</p>

  <p>One day, I picked up this stone and took a careful look at it. The bands of color reminded me of
  the seashore and a beach of pink sand. Since it was late at night, I imagined what it would be like
  to stand on such a beach, silhouetted by the twilight, and stare out to sea, an endless dark sky stretching
  into the distance with a single bright star illuminating the silent silvery waves. The scene, if one
  could touch it, would be soft and even soothing, like velvet. The meaning of this scene to me is one
  of potential waiting to be explored. It felt like stand-</p>

  <p>Connecting Inner and Outer Realities during Invention ing on the shores of a world that was waiting
  to be created, imagined into being. And I thought about people who write stories, and how they create,
  in their imagination, the worlds they write into being— which in some sense is always what we do when
  we write. We are creating a picture of the world for our audience, and it is colored and stylized by
  how it emerges from our own perspectives.</p>

  <p>The artist in me also wanted to try to paint this scene. And this is one of the most natural forms
  of invention of all—we see something and our imagination responds. We feel a desire to create something
  in response to what we have seen, whether that creation is a painting, a poem, or an essay. Often in
  a writing class, we are responding to texts, but our response could really be to anything.</p>

  <p>Figure 4. Landscape Painting Inspired by Polychromatic Jasper.</p>

  <p>My quick painting is far from photorealistic, and if you saw the painting by itself, I very much
  doubt that “polychromatic jasper” would spring to mind. But that is the beauty of invention. As an artist,
  photorealism is not, and likely never will be, my style. I accept that about myself, and instead of
  seeing it as a limitation, I choose to celebrate my own unique style. One of my art teachers back in
  high school once told the class that if a perfect recreation of reality was the goal, then one might
  as well take a photograph, because painting is</p>

  <p>Susan E. Antlitz more about interpreting the world through the artist’s vision and way of seeing.
  I’d like to suggest the same principle to you: your writing is not about trying to recreate what is
  out there in the world, or to write what someone else—some imaginary perfect writer—could write, but
  rather to see the subject of your writing through your own vision of it. Even when we write non-fiction,
  we are recreating a vision of the world with our words and putting that portrayal out there to share
  with our audience. As my art teacher told the class that day, what you create will be unique because
  you are unique.</p>

  <h3>Creativity and Play</h3>

  <p>Having an attitude of play can help writers to be more open to creativity, and increased creativity
  means that ideas are likely to flow more easily. Reflective activities, such as journaling, can also
  lead to creative new insights. While taking time to play with words or reflect on ideas may seem like
  a distraction from the work of writing a paper, building one’s creative fluency tends to save time in
  the long run.</p>

  <p>An example of how taking the time to do some reflective writing can lead to new ideas is illustrated
  in the following journal entry:</p>

  <h3>July 4, 2009</h3>

  <p>Invention is more than a set of techniques—it’s an attitude and an openness to inviting new ideas
  and experiences into our lives. A willingness to approach writing playfully, without allowing concerns
  about grades and even the final outcome to intrude into the time and space set aside for that thinking
  and play is ironically an important practical step in the work of writing. Writing certainly can be
  hard work, and while that may make having an open and exploratory approach to writing challenging, the
  play really is part of the work. This is a paradox, but the key to accepting it, I think, is often a
  matter of giving ourselves permission to be less than serious during the process of creating a serious
  outcome. Cultivating play is basically practicing generating ideas and trying out new approaches and
  ways of thinking, which</p>

  <p>Connecting Inner and Outer Realities during Invention is what is most needed when trying to get a
  piece of writing started.</p>

  <p>Play, and giving oneself the permission to play, is also part of lessening anxiety, since worry about
  how a text will or will not turn out in the end, or how it will be evaluated, can lead one to second-guess
  one’s work. I often feel like writing is like building a house of cards—when I’m focused on putting
  one card on top of the others, the house gets built, but when I start worrying about whether it is good
  enough, whether readers will like it or not, how long it needs to be, or whether I can finish or not,
  it’s like the wind that comes along and blows the house of cards apart, all collapsing in on itself.
  Some patterns of thinking are not helpful during the early phases of a writing project. It’s important
  to catch these negative patterns and purposefully move oneself back into the mindset of building the
  house.</p>

  <p>What I did when writing these last few paragraphs was to think of the first sentence, and then write
  to elaborate on it. Be open to the possibility that a text, especially during its generative moments,
  does not need to conform to a traditional format. Give yourself permission to write an early draft that
  is a combination of prose, snippets of thoughts, images, or even audio or video, if you have access
  to those technologies.</p>

  <p>It might be helpful to think of your early work on a text as a collection of all sorts of documents
  and items. Don’t limit yourself just to paper. Let your thinking grow, without regard to traditional
  formats. Once you have a grasp on the ideas and direction for your writing, you can make the final draft
  fit the guidelines you have been given and the expectations of your audience. Working with non-traditional
  formats can be helpful when generating ideas for a traditional paper assignment.</p>

  <p>Susan E. Antlitz</p>

  <p>Writing Anxiety</p>

  <p>The idea-based play writers engage in can serve a dual purpose. It helps to generate ideas and possibilities
  for writing, and it can also help to alleviate writing anxiety. Even for experienced writers, the pressure
  to produce something substantial can be intimidating. I think one’s expectations for oneself grow proportionately
  to one’s abilities—as human beings, I think we tend to always be looking ahead, envisioning the level
  we would like to be at.</p>

  <p>I know for myself, I can imagine what I want a text or a painting to be, and the way I picture it
  often exceeds what I know how to produce. It’s not a weakness, per se, but rather, a tendency that shows
  how we are always growing into something new. I’d be more concerned if my ideas never pushed the limits
  of my current abilities. So, if you get frustrated because your writing is never quite how you want
  it to be, just accept it as a sign of your potential to grow. I think over time, we move ourselves closer
  to what we envision.</p>

  <p>One can be a successful writer and still experience moments of anxiety or frustration. I have known
  students who were very anxious writers, but produced wonderful texts despite those feelings. Feeling
  stressed or overwhelmed when faced with a writing assignment does not mean that you are a bad writer.
  It means that you are a writer who needs to learn, and can learn, ways to overcome those challenges.
  The strategies in the following sections can help you to work around any writing anxiety you may have;
  however, these strategies can be used by any writer as part of his or her invention process.</p>

  <h3>Anxiety and Procrastination</h3>

  <p>Anxiety can be a cause for procrastination for me. I don’t panic, really. I get just nervy enough
  to not be able to concentrate. And so I’ll put off writing. I have, however learned something along
  the way: whether I write a text weeks in advance or the night before, it still takes the same number
  of hours to write it. If you find you tend to procrastinate, it may be possible (though not optimal)
  to write a paper the day before it is due. But make sure you block out the hours you will need, say
  about eight hours for a five-to-seven page paper. And make sure you have access to sources and other
  people to talk to and get feedback from if you can—the conversation helps to break up the time, and
  other people can help keep you motivated if they are there to help.</p>

  <h3>Connecting Inner and Outer Realities during Invention</h3>

  <p>A very common recommended strategy is to put a draft away for at least a few days and then reread
  it and make changes. Keep in mind that you will miss out on that if you do wait until the last day.
  But if it can’t be helped, and you find yourself having put off the paper until the end, then at least
  make sure you have enough hours available to put a solid effort into the paper. I’ll confess to having
  put papers off to the last day before, but I will also admit that I always ended up wishing that I had
  more time to work over the finished draft than what I ended up with. Planning ahead can spare you some
  anxiety if you don’t respond well to feeling rushed.</p>

  <h3>Invention and Anxiety Reducing Activities</h3>

  <p>Journaling as a Way to Reflect on Writing (and to discover new ideas)</p>

  <p>The following is a brief journal entry I wrote while gathering my ideas for this essay that reflects
  on the connection between feelings of anxiety and other related emotions that can affect one’s writing
  processes:</p>

  <p>Notes: April 18, 2009 (Visual Feelings)</p>

  <p>When I think about starting to write, I feel both an excitement about the possibilities, but also
  some uncertainty as well—some anxiety about creating an actual text that resembles the one I can imagine.
  The feeling of potential often comes to me as a vague sense impression of a visual image. For example,
  around 2:00 a.m. yesterday as I was thinking about writing this, what I felt was an image of a starlit
  midnight with crickets chirping and perhaps a moon in the sky, or a streetlight. And I suppose that
  image makes sense as a way to think about the feeling of anticipation that comes with starting to write—the
  very early morning hours tend to be cool and crisp, and one tingles a bit as a result of that coolness.
  Anticipation or the sense that one is on the verge of creating a text that is somewhat stirring or artistic
  has the same kind of tingle to it. Sometimes, creativity feels like an eagle</p>

  <p>Susan E. Antlitz soaring or like a bright, warm sun. These feelings and faint visual impressions
  are almost always part of what’s going on in my mind and spirit when I am planning a piece of writing.
  Once, when I found myself with only two hours to write a seven-page paper, my feeling was that of being
  like a racecar driver, with the keyboard as my steering wheel. (Incidentally, my limited time wasn’t
  because I procrastinated—it was because I had thought so much about the topic that I couldn’t get the
  ideas organized, and so, even though I had put a lot of hours into the paper, I found myself running
  out of time.)</p>

  <p>I had little idea what I would I write in that journal entry when I first touched pen to paper, but
  while writing, I became consciously aware of the way anticipation and excitement feel very similar to
  anxiety. And that gave me an idea—what if there was a way to turn one emotion into another? Essentially,
  this is what many of the activities I use to reduce stress do—redirect the emotions into a more constructive
  direction.</p>

  <p>Just as it did for me, taking the time to journal about your thoughts and feelings related to the
  activity of writing and to specific writing assignments can help you to gain insight and find new ideas
  and directions.</p>

  <h3>Be a Star</h3>

  <p>Even though you may not think of writing as fun, try to enjoy it and role-play having a positive
  attitude. The following role-playing activity may help you:</p>

  <p>1. Pretend you are an established writer, that everyone loves your work, and that your audience is
  eager to read your next exciting publication, which they will love simply because they adore you. You
  have to do the work of writing eventually anyway, and optimism yields better results than worrying.
  Staying positive gives you the best chance of doing your best. So, imagine an audience that will be
  delighted with everything and anything you write.</p>

  <h3>Connecting Inner and Outer Realities during Invention</h3>

  <p>2. If this is hard to imagine, ask a friend or two to role-play your adoring public and make the
  whole thing a game.</p>

  <p>3. Pretend you’re giving them the press release about what your next book will be about. Let them
  ask questions, and let it become a conversation.</p>

  <p>4. Let yourself be over-the-top with the ideas you share, and have a good time.</p>

  <p>5. Dress up in pretentious or obnoxious clothing and pretend to be more eccentric than you actually
  are if this helps to create the mood and make you feel more outgoing.</p>

  <p>If you are anything like me, you and your friends will likely find yourselves laughing at some point
  during this activity. Laughter is a great way to beat anxiety and build a positive attitude. You’ll
  be retraining your gut response to writing tasks, and you may even find yourself looking forward to
  these sorts of fun interactions with your friends or classmates during the early stages of writing.
  Take turns being the star and audience. A more serious peer review can be done later, after you actually
  have a completed draft.</p>

  <h3>If You Can’t Avoid Distractions, Use Them</h3>

  <p>I find that being slightly distracted helps with invention, and that sometimes, it’s helpful to watch
  TV or a movie while thinking about a writing project. Doing so lets me take micro breaks and keeps anxiety
  to a minimum. It can be counterproductive to see all distractions as a problem—rather, use and even
  create distractions to consciously adjust the emotions you feel when trying to get started with writing.
  It may help to have a couple of fun objects within reach. Items that light up and make sounds are great
  for this. Small puzzles can also help, especially the kind where you try to fit different plastic geometric
  shapes together to form a particular outline. A glass of water to drink or a healthy snack can serve
  as a brief distraction.</p>

  <p>I do find that activities involving sound can help. I have a Bodhran, which is an Irish frame drum,
  and a singing bowl. If I seriously need to de-stress, I go and bang on my drum. Both of these instruments
  require movement to produce the sound. The drum has to be stuck with fast, rhythmic movements using
  a stick called a cipin or beater, and</p>

  <p>Susan E. Antlitz the singing bowl is made to sing, or produce harmonic tones, by rubbing the outside
  rim of the bowl with a suede covered striking tool or mallet. Listening to the drumbeat or whirring
  of the bowl is calming, giving the mind one thing to focus on, and the arm movement releases tension
  by using up excess adrenaline.</p>

  <p>Figure 5. Bodhran</p>

  <p>Figure 6. Singing Bowl</p>

  <p>Connecting Inner and Outer Realities during Invention</p>

  <p>Once you’ve indulged in a few of these methods of intentional distraction, bring yourself back to
  the page or screen. I have found that it is important to make the very small step of writing something,
  even if it is not much. Even if it is only a word or two, or one sentence, write it down. Take a break,
  and come back in five minutes and write down another few words or another line. Eventually, you’ll find
  you have more to say.</p>

  <h3>Movement</h3>

  <p>Movement helps. With as much work as I often to do, it is very easy to be sedentary, and sitting
  for long periods of time each day can lead to sluggishness and fatigue. Students with a full load of
  classes and the accompanying hours of studying are likely to face similar issues. Getting up and moving
  gets the circulation and adrenaline going and can sometimes build enjoyment. I find that I become more
  excited about my writing projects—usually because I will have had a miniepiphany by then—after I take
  some time to engage in some type of physical activity, whether it is taking a walk or doing some manual
  labor around the house. If you feel nervous, physical activity like lifting weights or taking a walk
  can help. I like to go for a walk or a drive and listen to music just to unwind and think. Getting the
  circulation moving improves thinking for me. When writing, I often feel the urge to get up and pace
  for a few minutes before getting back to work. It’s both a way to release excess energy as well as to
  celebrate the energy that writing tends to generate for me. Keeping the adrenaline regulated can help
  you to avoid getting too worked up, or feeling too overwhelmed.</p>

  <h3>Change of Scenery or Method</h3>

  <p>Another strategy that I find helpful is periodically moving to a new location. If I am writing at
  the table downstairs and start to get stuck, I’ll take the laptop upstairs, or take it to the office
  and work there instead. Changing the scenery every few hours helps. Also, even though my composing primarily
  takes place on the computer, I do switch back and forth between the computer and paper if I am at a
  sticking point. Usually, the change is all I need to get going again.</p>

  <p>Susan E. Antlitz</p>

  <p>Describe Your Plans—Even if You Don’t Have Any Yet</p>

  <p>One strategy that I often use is to write a brief summation of what I plan to do with an essay I
  am starting to work on. I am someone who usually doesn’t have more than a vague idea of what I will
  write until I actually start writing. The activity of writing a plan jumpstarts that process. I make
  up my plan as I start to put it down in writing. I recommend that you try this and write a paragraph
  or so about what you plan to put in your paper, even if you aren’t sure where you are going with your
  general idea yet. At first, this may sound like a paradox, but for some people this will get the ideas
  flowing. Some writers are more comfortable with paradox than others, but it can’t hurt to give it a
  try.</p>

  <p>Electronic Strategies</p>

  <p>Email and Messaging</p>

  <p>Email or instant messaging can be used as part of this planning and reflecting. I have even used
  my Facebook wall in this way. The exchange that follows was prompted by a document I wrote while just
  playing around with ideas. I wrote my 1400 word essay because I thought my sister and sister-in-law
  would find it amusing, and I am aware that other people in my field have presented conference papers
  that link science fiction or fantasy programs to theoretical concepts. You might try to pair one of
  your own favorite programs to theories from psychology, sociology, or from your major area of study
  for one of your papers, if your instructor allows you to develop your own topics for class papers.</p>

