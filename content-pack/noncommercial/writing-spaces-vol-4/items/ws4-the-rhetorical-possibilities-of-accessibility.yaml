  <h3>Teacher Resources for The Rhetorical Possibilities of Accessibility</h3>

  <p>This essay is intended as a basic introduction of accessibility and what starting points students
  can take in becoming more accessible writers and project creators. In my experience, few, if any, students
  have learned about accessibility and their role in it before reaching college, so my providing information
  about alt text, headings and styles, and presentation scripts merely lays a foundation. Next steps for
  continuing this conversation about accessibility can include (but aren’t limited to) serif versus sans
  serif fonts, using color contrast, blending smart design choices with accessibility, and accessible
  social media practices, including capitalizing each word in multiword hashtags and creating captions
  for video posts.</p>

  <p>Given that accessibility is applicable to all forms of document creation, this essay could work well
  as early reading in a course. If assigned early, students have the opportunity to practice this awareness
  and related skills with each project they create over the course of the semester. With accessibility’s
  relatedness to multiple ways of reading a text and representing information, this essay would also work
  well in conjunction to other readings and conversations on multimodality (Price 96). The beauty of accessibility
  is its limitless creativity and universality, so this conversation could really fit anywhere in a course,
  but for maximum effectiveness, I recommend using it near the beginning of the semester.</p>

  <p>As a final note, I talk quite a bit about equity at the end of the essay and it may be worth having
  a conversation with students about how equity is not synonymous with equality and the differences between
  the two terms.</p>

  <h3>Discussion Questions</h3>

  <p>1. If you use a screen reader, what advice would you give nondisabled writers who are creating accessible
  documents? Are there other strategies and tools besides alt text, headings and styles, and presentation
  scripts that you would recommend that writers use?</p>

  <p>2. If you don’t use a screen reader (and have ready access to JAWS, Dragon, or other screen reading
  technology on campus), close your eyes and test a website of your choice using screen reading software.
  How would you describe the experience of listening versus reading visually? Does using this software
  make you think of your design choices differently?</p>

  <p>3. How does the choice to be accessible when writing connect to the idea of a writer’s ethos?</p>

  <p>4. Presentations are far from the only circumstances where having a script or visual access to spoken
  text is helpful. What other circumstances or media could benefit from scripts or captioning?</p>'
