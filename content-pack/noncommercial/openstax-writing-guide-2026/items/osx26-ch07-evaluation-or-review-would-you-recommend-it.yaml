  <p>7.9 Portfolio: What the Arts Say About You</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Reflect in writing on the development of composing
  processes. • Explain how those processes affect your work.</p>

  <p>As you prepare to place this chapter’s writing task in your portfolio, reflect on your review by
  answering the following questions.</p>

  <ul><li>On what basis did you choose your topic? Did you choose it because of a long-standing interest
  in films, TV, books, or video games or because of something else?</li><li>Did your evaluation and thesis
  seem obvious from the beginning, or did you have to think for a long time before settling on them?</li><li>What
  made this topic personally appealing? • What was easy about composing your essay? What was hard? • What
  would you do differently if you could start over again? • In what ways did you revise your essay between
  the first and final drafts? • How did you get ideas for revision? Was it from peer feedback, your instructor,
  or a tutor?</li></ul>

  <h3>Reflective Task</h3>

  <p>Now write a reflection for your portfolio, adding a section about your interest in the genre of the
  primary source you chose. Discuss your reflection with another student, noting areas of similarities
  and differences.</p>

