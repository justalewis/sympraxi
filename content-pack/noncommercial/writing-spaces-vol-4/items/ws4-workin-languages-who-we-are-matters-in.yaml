  <p>Teacher Resources for “Workin’ Languages: Who We Are Matters in Our Writing”</p>\n<p>This essay was\
  \ written to invite students, educators, and writing community members to become more conscientious\
  \ of the power of laboring language, and the work required to move within and against the norms of academic\
  \ writing. Our goal is to help students recognize the value in bringing themselves into these spaces\
  \ and to provide strategies that students can use to rethink their own relationships with writing. Instructors\
  \ can use this essay to help students develop awareness of the assumptions behind what we learn as constituting\
  \ “academic language” or “academic writing” and to write about topics that have greater relevance to\
  \ their lived experiences, as they also centralize their communities’ voices and their own.</p>\n<h3>Questions\
  \ and Strategies for Teachers</h3>\n<ul><li>A strategy that will not be immediately visible to students\
  \ is the necessity of educators to rethink listening/reading practices when it comes to assessment,\
  \ particularly with regard to racialization and language bias. The discussion about appropriateness\
  \ from Flores and Rosa that we outline in the essay has direct implications for how educators assess\
  \ student writing. How do we resist responding to student writing in a way that can reinforce, either\
  \ inadvertently or directly, what has been constructed as appropriate in academic settings? How can\
  \ we frame responses in a way that helps them build and navigate expectations that do not diminish them\
  \ as writers?</li><li>Assignments and activities can begin with thinking about students as “language\
  \ architects” and build on the navigations with language that they are already doing in their everyday\
  \ lives. These can include:</li></ul>\n<p>{ Assignments where students are remediating and remixing,\
  \ giving them the opportunity to communicate in a variety of modes and media (Gonzales).</p>\n<p>{ Making\
  \ space in class design for students to practice and develop metacognition about their writing and linguistic\
  \ choices and make connections between what they do in and out of the classroom. We often include guided\
  \ writing in order to describe and provide a vocabulary for these processes and give students the opportunity\
  \ to practice them. We also assign reflective writing at the end of a formal assignment to allow students\
  \ to articulate the practices that work best for them. \x86 Literacy narrative assignments, in this\
  \ regard, can be a good place to encourage students to reflect on their experiences and relationships\
  \ with different languages and literacies, while providing us, instructors, with an opportunity to better\
  \ understand and begin conversations about “appropriate” language and ideologies that sustain such thinking.\
  \ { Writing assignments that build on students’ existing knowledge and authority about language use.\
  \ For example, a project that asks students to examine the role of writing in their communities or to\
  \ study their own writing ecologies creates an opportunity for students to connect their own experiences\
  \ to scholarly concepts in literacy and writing studies.</p>\n<ul><li>Course design should actively\
  \ work against deficit models and help students grow their identities as writers and language architects.\
  \ Assignments and teacher feedback on student writing should address students as writers and frame all\
  \ aspects of writing in terms of choice, context, and power, rather than right or wrong answers.</li></ul>\n\
  <p>{ Classroom discussions can also invite students to actively discuss their experience with assessment\
  \ and create a rubric or feedback points collaboratively, and these collaboratively built rubric or\
  \ feedback points can be used during their peer review and teacher feedback practice.</p>\n<p>{ The\
  \ question of assessment of one’s language and racialization can be also taken as a discussion point\
  \ or even a writing assignment based on a reading that reflects different manifestations of linguistic\
  \ racism and the consequences outside the school context such as in housing, healthcare, employment,\
  \ and finance.</p>\n<ul><li>Assigning readings from multilingual authors who reflect on or demonstrate\
  \ their own movements in and across languages, including Englishes, is one way to show students how\
  \ published authors cultivate (and do) the kind of writing that you’re now asking them to do.</li></ul>\n\
