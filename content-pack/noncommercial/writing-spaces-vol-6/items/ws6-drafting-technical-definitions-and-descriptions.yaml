  <h3>DNA Structure</h3>

  <p>DNA is made up of millions of nucleotides. These are molecules composed of a deoxyribose sugar, with
  a phosphate and a base (or nucleobase) attached to it. These nucleotides are attached to each other
  in strands via phosphodiester bonds to form a ‘sugar-phosphate backbone’.</p>

  <p>The author describes the DNA structure before explaining the replication process.</p>

  <p>Table 4.2. A Process Description (continued)</p>

  <p>The bond formed is between the third carbon atom on the deoxyribose sugar of one nucleotide (henceforth
  known as the 3’) and the fifth carbon atom of another sugar on the next nucleotide (known as the 5’).
  N.B: 3′ is pronounced ‘three prime’ and 5′ is pronounced ‘five prime’. There are two strands running
  in opposite or antiparallel directions to each other. These are attached to each other throughout the
  length of the strand through the bases on each nucleotide. There are 4 different bases associated with
  DNA; Cytosine, Guanine, Adenine, and Thymine. In normal DNA strands, Cytosine binds to Guanine, and
  Adenine binds to Thymine. The two strands together form a double helix.</p>

  <p>Visuals are used to explain the complex DNA structure.</p>

