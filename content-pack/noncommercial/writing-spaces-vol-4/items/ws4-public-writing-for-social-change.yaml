  <h3>Teacher Resources for Public Writing for Social Change</h3>

  <p>“Public Writing for Social Change” represents a compilation of my best advice for students who are
  writing for public audiences and contexts based on the lessons I’ve learned from teaching public writing
  for over 15 years. Public writing assignments require rhetorical sophistication, genre awareness, and
  targeted research toward a specific audience, context, and exigence. The essay addresses some of the
  common pitfalls I have seen from students who struggle with public writing, such as choosing an issue
  that does not have a public exigence, conceiving of one’s audience too broadly, or not following through
  by actually “going public” with their writing.</p>

  <p>Even with the many benefits, assigning public writing can be tricky if the goals of one’s writing
  courses or programs are solely based within academic writing styles and genres. Without delving too
  deeply into the perennial debates about what the “content” of first-year composition courses should
  be, I would like to encourage instructors interested in teaching public writing but also concerned about
  preparing students to write for academic purposes and contexts to situate and frame the public writing
  you assign within the academic goals of your courses. Public writing pedagogies are deeply enmeshed
  with academic literacies, such as research skills, clarity and coherence in communication, having a
  clear thesis or main idea, and supporting one’s argument with convincing evidence. To meet the needs
  and expectations of writing programs, students, and the broader academic community, you may need to
  make these connections between academic and public writing explicit, while also highlighting how the
  differences between them can help develop rhetorical sophistication as students shift from one style
  to the next.</p>

  <p>An ideal way to build into your course design this lesson about the relationship between academic
  and public writing is to preface a public writing assignment with a more traditional academic writing
  assignment. For example, when I assign public business letters on social justice issues, students first
  conduct academic research on the issue in advance, and I have, in some courses, assigned an academic
  research essay, rhetorical analysis, and/or annotated bibliography as the project immediately preceding
  the public writing assignment. I have also taught public writing as part of a “remix” or “re-mediation”
  project after a research essay; in this scenario, students transform their traditional research essay
  into a public and/or digital, multimodal piece of writing. Students have to consider how a change from
  academic to public audience, purpose, genre, and/or context might impact their argument, evidence, or
  approach to persuasion and rhetorical appeals. Yet another course progression I have used starts with
  the personal, then moves to the academic, and ends with the public, asking students to hone and develop
  their rhetorical understanding with each assignment. Ideally, students pull a thread of personal interest
  from the first assignment (a literacy narrative, for instance), then conduct academic research on the
  topic and write in an academic genre, and, finally, situate that personal topic as a public issue to
  then use a mix of personal and academic research to persuasively argue one’s stance to an audience who
  can effect change.</p>

  <p>I continue to teach public writing because of the powerful ways it bridges academic literacies with
  civic purposes to address social justice issues—all within public genres that will serve students in
  their careers and lives post-graduation. I hope this essay offers support for you to pursue this pedagogical
  work, too.</p>

  <h3>Discussion Questions</h3>

  <p>1. The opening of this chapter asks “Can a tweet—a genre of public writing—cause social change?”
  Read Malcolm Gladwell’s article “Small Change: Why the Revolution Won’t Be Tweeted” and offer your reaction
  to Gladwell’s perspective. Do you think social media writing—like Twitter or Facebook posts—as a kind
  of public writing can lead to meaningful social change? Give examples from current events and/or your
  life experiences to support your stance.</p>

  <p>2. Based on the brainstorming you did in Table 1, how would you define an “academic citizen” in your
  own words? Can you think of any examples of academic citizens or public intellectuals from popular culture
  or from among your teachers or peers? What do those individuals do that make them academic citizens
  or public intellectuals in your view?</p>

  <p>3. Try the invention activity “Writing on Location,” and then write a reflection about your experience.
  What was your reaction to writing on location—helpful, distracting, surprising, upsetting, exciting,
  a mix of reactions? What ideas, writing, pictures did you create that may be useful in your public writing
  assignment? How might you use those items in your public writing?</p>

  <p>4. The section of the essay on “publics” highlights debates among public sphere theories about whether
  there is a singular public sphere or whether there are multiple publics and counterpublic spheres. What
  is your opinion in this debate? Give examples from your experiences or from public culture to support
  your position.</p>

  <p>5. What have been your prior experiences with writing in digital public spaces, and what have you
  learned about writing in general from writing in digital contexts? Give a specific example from your
  experience, such as posting to a social media site or commenting on a website, and explain what unique
  considerations you had to account for in terms of the style of your writing, how you conceived of audience,
  the type of writing, or the context in which it was publicly viewable. How was this writing similar
  to the writing you do for school? How was it different?</p>

  <p>6. This essay invites you to “go public” by publishing and/or circulating your writing to reach an
  audience who can effect change. Brainstorm a list of possibilities for going public with your writing;
  include a mix of digital and print publishing contexts and consider how to circulate (i.e., distribute
  or share) your writing with others. For example, you could “publish” your writing by printing it to
  a flyer, but you would need to consider where to post or hand out your flyer to “circulate” it to your
  targeted audience.</p>'
