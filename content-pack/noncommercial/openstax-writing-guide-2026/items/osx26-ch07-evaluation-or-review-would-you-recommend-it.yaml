  <h3>Discussion Questions</h3>

  <p>1. What criteria does Caelia Marshall use to evaluate the films she reviews in her essay?</p>

  <p>2. How does Marshall provide background and context behind the films Rear Window and Black Panther?</p>

  <p>3. Why has Marshall chosen to focus on criteria other than those listed in Figure 7.3? Do you think
  her choice is effective? Why or why not?</p>

  <p>4. How does Marshall''s use of secondary sources help support or hinder her review of the films she
  discusses?</p>

  <p>5. What are the advantages or disadvantages of films with characters to whom the audience can or
  cannot relate? Which do you prefer? Why?</p>

  <p>7.5 Writing Process: Thinking Critically About Entertainment</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Compose a review based on a thesis supported by
  analysis and evaluation. • Demonstrate the steps of the writing process: invention, drafting, revising,
  and editing. • Participate in the collaborative and social aspects of writing processes. • Give and
  act on productive feedback to works in progress. • Adapt composing processes for a variety of technologies
  and modalities.</p>

  <p>Throughout this chapter, you have learned about the review genre. You have learned that reviews evaluate
  a variety of items. In addition to books, films, and TV shows, people look to reviews to buy cars, choose
  restaurants, hire plumbers, and more. In this section, you will have the opportunity to demonstrate
  your understanding of the review genre by composing your own review.</p>

  <h3>Summary of Assignment: Review of Primary Media Source</h3>

  <p>Write a review of a specific film, book, TV series, podcast, play, or video game that you think contributes
  something significant to the genre and to the culture at large. Show how the subject—the primary source—of
  your review illustrates something compelling or exceptional about a particular idea or theme common
  to the genre. For example, the CW series Crazy Ex-Girlfriend (2015–2019) is a romantic comedy that eschews
  and even satirizes traditional romantic comedy tropes such as the “grand gesture,” doing something out
  of love for someone. Use specific evidence from your primary source to support a central idea, or thesis.
  In an essay of about 1,200 to 1,500 words, provide an overall judgment about your subject and support
  it with evidence from the primary source and from secondary sources if applicable. In addition, explore
  how your specific source has contributed something significant to its genre. In other words, why is
  this subject interesting, different, or worthy of analysis? Be sure to demonstrate awareness of your
  source’s cultural and historical context as well. For example, if your review is about a romantic comedy,
  provide relevant information about the history, conventions, or expectations of that genre. Think about
  and explain the ways your topic adheres to or breaks from audience expectations.</p>

  <p>Another Lens 1. Create a three-to-five-minute podcast review of a specific film (https://openstax.org/r/film),
  book (https://openstax.org/r/book), TV series, album (https://openstax.org/r/album), podcast, play,
  or video game. How does the subject of your review illustrate something interesting or unique about
  a particular idea or theme common to the genre? Integrate specific evidence from the primary source
  and secondary sources, if applicable, to support a main idea, or thesis.</p>

  <p>To record your podcast review, use either a simple recording method, such as the voice memo app on
  your smartphone, or something more sophisticated, such as Garage Band or iMovie. To become more familiar
  with this genre of reviewing, listen to one or two of the examples linked above. Note how this genre
  is somewhat different from an academic essay. For example, the speaker’s voice is more conversational
  and engages the audience auditorily by stressing particular words or syllables. In your review podcast,
  take advantage of the opportunity to present a more informal tone than you might use in an academic
  essay. Podcast hosts are often successful because of their personality and ability to connect with their
  audience. Draft a script for your review podcast that reflects your personality and use of language,
  rather than formal language. For example, use contractions, first- or second-person pronouns, and appropriate
  slang.</p>

  <p>Finally, to maximize the effect of your podcast, consider incorporating short clips from the subject
  of your review. Upload your podcast review to SoundCloud (https://openstax.org/r/SoundCloud) and share
  your review with the class. For more direction on public speaking, consult Scripting for the Public
  Forum: Writing to Speak.</p>

  <p>Another Lens 2. Instead of a straightforward review of a single primary source, review several sources
  in the same genre, as Caelia Marshall has done in her essay. Or compare a film to the book on which
  it is based and evaluate it. Select your sources from films, books, television programs, video games,
  or any other form of entertainment, focusing your review essay on a single area, such as social context,
  character development, or screenplay vs. original text. Choose other genre-specific evaluation criteria
  as well, and address them in your essay, as Marshall does. Use specific evidence from your primary sources
  and secondary sources, as needed, to support your main idea, or thesis. In other words, why is this
  source interesting, different, or worthy of analysis?</p>

  <h3>Quick Launch: Developing Evaluative Criteria</h3>

  <p>To write an effective review, you need clear and relevant evaluation criteria. To help you establish
  your review criteria, fill in a table similar to Table 7.3 by following these steps:</p>

  <p>1. Write the name of your primary source. 2. In the left-hand column, write the genre category to
  which your topic belongs (horror, action, biography, etc.). 3. Under the genre, brainstorm as many characteristics
  of the genre as you can. 4. In the right-hand column, write “Examples.” 5. Brainstorm as much evidence
  from your primary source as you can think of. 6. Create a second table called “Subgenre.” For example,
  if your topic is a horror film, some possible subgenres might be “ghost horror,” “monster horror,” or
  “slasher horror.” Add a colon after Subgenre, and write the subgenre type. 7. Label the left-hand column
  “Subgenre Elements” and the right-hand column “How to Evaluate.” 8. In the Subgenre Elements column,
  brainstorm for as many characteristics of the subgenre as you can. You can use some relevant characteristics
  from step 3, but try to focus on unique characteristics of the subgenre. For example, what makes a horror
  film about a ghost, such as The Grudge (2020), different from a slasher horror film, such as The Texas
  Chainsaw Massacre (2003)? 9. In the right-hand column, develop questions to assess characteristics.
  10. Select three to five genre characteristics with the most evidence, and focus on them as you look
  closely at your primary sources. Take notes and gather evidence to support your evaluation.</p>

  <p>Primary Source: The Texas Chainsaw Massacre (2003 Film)</p>

  <p>Genre Characteristics: Horror</p>

  <p>Examples</p>

  <p>Script/plot: Scary story</p>

  <p>Presented as a “true” story, scary ending</p>

  <p>Characters: “Monster” or “thing” that kills</p>

  <h3>Leatherface, a masked killer who wields a chainsaw</h3>

  <p>Characters: Victims, usually multiple Young people stranded on a road trip</p>

  <p>Setting: Rural Texas</p>

  <p>Creepy locations with potential for violence</p>

  <p>Special effects: (gore, jump scares, etc.)</p>

  <p>Gore: blood and guts</p>

  <p>Sound effects: Screaming</p>

  <p>Many victims and screaming from road trippers</p>

  <p>Cinematography: “Gross” or “creepy” images</p>

  <p>Meat plant, creepy house</p>

  <p>Subgenre: Slasher Horror</p>

  <p>Subgenre Elements</p>

  <p>How to Evaluate</p>

  <h3>One deranged killer</h3>

  <p>Is the killer believable in the moment? Does the killer scare me?</p>

  <p>One weapon characteristic to the killer Is the weapon creative? Does it fit the killer’s character?</p>

  <h3>Killer with a backstory</h3>

  <p>Does the backstory tell me why the killer is deranged? Does it convince me it’s the reason they kill?</p>

  <h3>Killer hunts the victims</h3>

  <p>Victims’ terror should be convincing: realistic screaming, fear, etc.</p>

  <h3>Creepy images: setting, props, etc. need to be realistic</h3>

  <p>Are they realistic? How? How do the images add to the sense of fear?</p>

  <p>Evaluation Criteria for The Texas Chainsaw Massacre:</p>

  <p>The Killer (Leatherface): How effective is he at scaring the audience? How does he scare the audience
  (backstory, appearance, weapon, etc.)?</p>

  <p>Images/Setting: How do the filmmakers create a creepy setting? How does the setting add to the fear?</p>

  <p>The Victims: How do they project fear (screaming, etc.)? How effective or convincing is their fear?</p>

  <h3>Drafting: Thesis Statement, Analysis, and Supporting Examples</h3>

  <p>After you have selected a topic and decided on the evaluation criteria, spend some time looking closely
  at your primary source (the film, TV show, book, etc. you have chosen to review). With these criteria
  in mind, view/ read/listen to your primary source. Take notes on how your selected evaluation criteria
  apply to your source. When you come across strong and relevant examples, write down vivid, detailed
  descriptions of the scene and quote applicable dialogue. By looking closely at your primary source and
  taking notes now, you will have solid and specific examples to illustrate your points later when you
  draft your review.</p>

  <p>Also, while you are looking closely at your primary source, think about the features that appeal
  to you. Is there a character that is particularly interesting? Do you see an interesting viewpoint on
  a theme or idea? Is the writing or the use of language interesting, different, or clever? How does it
  keep your attention or provide something unexpected? The answers to these questions can lead you to
  your overall evaluation and thesis.</p>

  <h3>Thesis</h3>

  <p>Use a graphic organizer like Table 7.4 to plan your draft. Then, you will use the notes you took
  earlier to help you brainstorm for the main points that support the thesis and provide specific, concrete
  evidence.</p>

  <p>Primary Source</p>

  <p>Title of work(s) being reviewed</p>

  <h3>Angle of Analysis</h3>

  <p>Overall way you will organize your review: aspects of the source you will analyze or criteria on
  which you plan to focus.</p>

  <p>Example: female romantic-comedy leads.</p>

  <h3>Filters</h3>

  <p>Ways to narrow your focus, such as time, place, cultural context, comparison to similar sources.</p>

  <p>Examples: the female lead in Crazy Ex-Girlfriend versus other female romantic comedy leads or how
  the 1961 film version of A Raisin in the Sun depicts Lena Younger as a “tyrant.”</p>

  <h3>Main Argument</h3>

  <p>The idea you’ll use to draft a working thesis; must be a debatable point about your topic.</p>

  <p>Example: Rebecca Bunch, the female lead in Crazy Ex-Girlfriend, is flawed and not virtuous. Her shortcomings
  make her character more engaging than traditional romantic-comedy female leads.</p>

  <h3>Thesis</h3>

  <p>One sentence (sometimes two) that clearly states your argument.</p>

  <p>Example: Although most romantic-comedy female leads are virtuous and have admirable character traits,
  Crazy Ex-Girlfriend’s Rebecca Bunch is flawed and sometimes unsympathetic; however, the audience still
  roots for her to find love.</p>

  <h3>Planning the Main Points and Body Paragraphs</h3>

  <p>Your main points should be your topic sentences, expressed as one sentence at the beginning of each
  paragraph. Preview these main points by adding because to your thesis statement as illustrated below.</p>

  <h3>Examples</h3>

  <ul><li>Because romantic comedies such as Knocked Up (2007) depict their leads as unquestionably “good”
  people . . .</li><li>Because Rebecca Bunch is sometimes selfish . . . • Because Rebecca Bunch is sometimes
  promiscuous . . . • Because despite these flaws, men still seek her attention . . . • Because the audience
  sees Rebecca as realistic, they root for her . . .</li></ul>

  <p>Now complete a graphic organizer like Table 7.5 by adding your main points from your primary source.</p>

