- id: unc-understanding-assignments
  title: "Understanding Assignments"
  url: https://writingcenter.unc.edu/tips-and-tools/understanding-assignments/
  publisher: UNC Writing Center
  license: CC-BY-NC-ND-4.0
  can_vendor: false
  link_check: auto
  summary: >-
    How to decode an assignment sheet: the parts most prompts have, what the
