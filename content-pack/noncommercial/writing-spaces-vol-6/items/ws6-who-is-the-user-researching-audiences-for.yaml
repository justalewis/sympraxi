  <p>Teacher Resources</p>

  <p>Overview and Teaching Strategies</p>

  <p>Researching audiences can be addressed at several points in a technical communication course. Any
  document that is being written or designed for an audience beyond the instructor would benefit from
  activities related to researching audiences. For most assignments in technical communication, the 5
  Whys exercise is helpful for students to understand and articulate the exigency for crafting a document.
  Further, for most assignments, it is helpful to have a research and evaluation phase and to choose methods
  accordingly.</p>

  <p>In the research phase, students can explore how to understand audience by looking at existing data
  or collecting new data, as explained in the previous chapter. Some examples of assignments and corresponding
  activities are:</p>

  <p>1. Resume and cover letters: Interviews with hiring managers within a specific field to understand
  what they look for and how they read a resume.</p>

  <p>2. Writing for the web: Looking at social media or existing data about current usage to understand
  issues or gaps.</p>

  <p>3. Proposal writing: Conducting a survey to better understand the existing needs of a community or
  audience.</p>

  <p>4. Instructions: Conducting a contextual inquiry to learn the steps and technical know-how of how
  a skilled user does something.</p>

  <p>In the evaluation phase, students can conduct usability testing with a think aloud protocol on most
  documents and artifacts produced in class. The challenge is to access participants who are representative
  of the target audience. For educational purposes, you can have students conduct usability tests on each
  others’ work, but having representative users is beneficial if possible. Here are some ideas on assignments
  and how to conduct usability tests:</p>

  <p>1. Websites or instructions – create scenarios to identify problems and ask representative users
  to perform them on a site or page.</p>

  <p>2. Proposal writing – ask a professional or a funder to read through an abstract or proposal to identify
  strengths and weaknesses.</p>

  <p>A key item of researching audience is to help students connect what they learned through research
  to the decisions they have made in their design or document. One strategy to help students make these
  connections is to include a reflective memo as an addendum to each assignment. Ask students to reflect
  on one re more of the following:</p>

  <p>1. How does the design of the document meet the needs of users? 2. What specific choices did you
  make in the design or writing of the document to meet users’ needs? 3. How are you ensuring that your
  document or design is not biased?</p>

  <p>How does it reflect the needs of the diversity of your audience? 4. What aspects of the document
  or its design are you unsure about?</p>

  <p>What areas do you need to gather feedback on? 5. What changes did you make to the document or design
  based on usability testing or feedback?</p>

  <p>Finally, being able to have students experience both the research and evaluation phase is beneficial,
  it is helpful to provide them with an endto-end design experience which may span the entire term. Clients,
  campus partners, and community-based organizations are helpful to partner with. For example, partnering
  with local business to redesign a website, writing a grant for a non-profit, or working with iFixit.com
  where students can design and usability test instructions for repairing electronic devices. When working
  on a larger project such as the ones described previously, having students work in teams can also help
  share the work and strengthen human skills like communication and collaboration.</p>

  <h3>Discussion Questions</h3>

  <p>To help students understand the ideas related to researching audience, consider posing the following
  discussion questions or activities. Some of these can be explored individually, others are better done
  in small groups or by a full class.</p>

  <p>1. Think of something you have used or read that you felt like wasn’t designed for you and you felt
  excluded. What was it? How did it make you feel? How could you redesign that item, document, or design
  to make it feel like it was designed for you?</p>

  <p>2. Let’s imagine we work at a company and we’re going to design a new backpack. First, brainstorm
  all the possible potential users of a backpack. Second, list out all the unique needs of the potential
  users. Third, in small groups, each group should select one user to design for and list all the features
  of the backpack they are designing for that one user. Finally, come back together to share out different
  design ideas. How did the unique group you chose to design for impact the design and features you chose
  for the backpack your team designed?</p>

  <p>3. How are technical documents different from other kinds of documents? Why is this difference important
  and how does it inform the process we use to design technical documents?</p>

  <p>4. In the section that describes the techniques for researching and understanding audience, define
  each of the techniques and list what are the pros and cons of each method?</p>

  <p>5. In the section on usability testing, there is an activity that asks you to conduct your own test.
  In teams, conduct the usability test on a local transit website. Share your responses to the following
  questions: What was it like to be in your role (participant, facilitator, notetaker)? What did you learn
  about the website? What works well? What ideas do you have for changing the site?</p>'
