body: '<p>Technical Instructions for</p>

  <p>Cross-Cultural Resonance</p>

  <p>Using a Culturally Inclusive</p>

  <p>Approach</p>

  <p>Audrey G. Bennett</p>

  <p>“The Increasingly Diverse United States of America” (https://tinyurl. com/5n7rk443) maps the evolving
  racial and ethnic diversity of regions nationwide (Keating and Karklis).1 It provides compelling visual
  evidence that the nation is diversifying rapidly and will likely continue to do so moving forward.2
  What does this mean today for designers of technical instructions? It means that your readers are more
  diverse in cultural backgrounds and experiences than a decade ago and will likely continue to diversify
  moving forward. As access to digital media and shipped products continue to increase around the world,
  readers of technical instructions are becoming more global as well.</p>

  <p>Now, we are amid an age of heightened awareness and cognizance of cross-cultural presence (e.g.,
  consider the recent emergence of the Black Lives Matter movement) and the related rising advocacy and
  clarion calls for diversity, equity, access, inclusion, and justice. Within the current age of decolonization
  (i.e., the dismantling of a culture’s domination over others), readers, the people served through our
  technical instructions, are culturally diverse human beings who need and want information that speaks
  their culture-based languages or can be accessed in a tech-mediated way that translates information
  into their respective languages. An example of</p>

