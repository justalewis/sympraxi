  <p>Teacher Resources for Beyond Language Difference in Writing: Investigating Complex and Equitable
  Language Practices</p>

  <p>Conversations about language difference and its relationship to writing are not just shaped by our
  own interests and practices, but are also determined by the space that is made or not for it in our
  teaching, programs, resources, etc. As a teacher, these are some activities that have contributed to
  making “space” in my own contexts for language difference in complex ways, despite surrounding dominant
  ideologies and requirements. To enable students’ self-inquiry processes about their own language practices,
  students can be asked to respond to the following activities:</p>

  <p>1. Think about: what are some of the language myths you know? Have you ever been “corrected” based
  on your language practices? Have you ever corrected anyone? What do those “corrections” and “language
  myths” tell you about people’s language preferences and the ways society works?</p>

  <p>2. Take a “language difference walk” on campus and document (observe and write down) how language
  practices change depending on the environment you are in (cafeteria, class, students’ building, gym,
  hallway, library, etc.), the modalities used in the genres (visuals, color, size, gestures, spatial
  arrangement, sound, etc.), the material used (paper, new technologies, chalk, spoken conversations),
  the people involved and their perceived identities, and any other factor you find relevant to those
  language practices. What does “language appropriateness” mean in each situation? Who defines it? Why?
  What counts as a successful language?</p>

  <p>3. Document your language practices for a day across various genres (social media genres, email,
  text, posters, signs, writing for different classes, etc.), in different spaces and when different audiences
  are involved. What does “language appropriateness” mean in each situation? Who defines it? Why? What
  counts as successful language in those cases?</p>

  <p>4. Share your notes with your peers and listen to theirs. In what ways do the language practices
  you documented differ from everyone else’s or not? What have you learned about language that you didn’t
  know before? How does the creative/ non-normative use of language make you all feel?</p>'
