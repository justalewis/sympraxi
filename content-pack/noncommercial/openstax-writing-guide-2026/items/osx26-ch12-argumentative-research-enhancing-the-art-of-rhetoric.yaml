  <p>Argumentative Research: Enhancing the Art of Rhetoric with Evidence</p>

  <p>12</p>

  <h3>CHAPTER OUTLINE</h3>

  <p>12.1 Introducing Research and Research Evidence 12.2 Argumentative Research Trailblazer: Samin Nosrat
  12.3 Glance at Genre: Introducing Research as Evidence 12.4 Annotated Student Sample: "Healthy Diets
  from Sustainable Sources Can Save the Earth" by Lily Tran 12.5 Writing Process: Integrating Research
  12.6 Editing Focus: Integrating Sources and Quotations 12.7 Evaluation: Effectiveness of Research Paper
  12.8 Spotlight on … Bias in Language and Research 12.9 Portfolio: Why Facts Matter in Research Argumentation</p>

  <p>INTRODUCTION The term research is used widely and regularly and may have different—sometimes contradictory—meanings.
  Therefore, it is important to clarify what research is, why it is a key tool for academic success, and
  how using research-based evidence can enhance a writer’s rhetorical abilities and effectiveness.</p>

  <p>No matter what academic subjects you study, at some point you will need to conduct research. Although
  research is an integral part of all disciplines, even those primarily related to art or performance,
  the product of the research will vary. Even if your coursework does not require formal, documented research,
  it will, at minimum, include regular research behaviors. Every day, whether deciding which movie to
  watch or choosing a new technology product, everyone participates in basic, informal research behaviors:
  a process of seeking information, testing it against other forms of collected information, and analyzing
  as much “data” as possible before making decisions or being persuaded. Although more formal, the same
  process applies to academic writing. You may be required to conduct research, gather evidence (data),
  and present your ideas and findings in a range of genres.</p>

  <p>Like all communication, conducting and citing research is rhetorically situated and thus has a purpose,
  the reason or goal for the research; an audience, the recipient of the research findings; a genre, the
  structure of reported research; a stance, the position, or viewpoint, supported by research; a context,
  the situation in which the research or subject occurs; and a culture, the groups of people who share
  common beliefs and lived experiences, reflected by the author, audience, and subject. Furthermore, the
  researcher uses effective rhetorical strategies, such as reasoning supported by evidence. Therefore,
  it is important to match your research to the elements of the rhetorical situation, as indicated. For
  example, for a political science course, you may find that current unrest on campus regarding politics
  or race functions as a context for conducting formal research (through surveys or interviews) on students’
  responses to that unrest. Your purpose might be to provide evidence that supports your stance in proposing
  a change of campus policies. Your audience may include university administrators and student representatives.
  Your genre may be a persuasive speech, an article in the student newspaper, a poster, or a public service
  video. Cultural elements include the unrest and its relation to the university environment for both
  students and faculty. The supporting evidence is the resulting data and analysis from the surveys or
  interviews. But before you consider how to use evidence in reporting research, it is important to understand
  the research process itself.</p>

  <p>With a focus on the role of evidence collection in research, this chapter presents methods for introducing
  research as evidence, examines the genre and writing processes associated with argumentative research
  papers, and addresses the use of unbiased language in creating and reporting effective research.</p>

  <p>12.1 Introducing Research and Research Evidence</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Articulate how research evidence and sources are
  key rhetorical concepts in presenting a position or an argument. • Locate and distinguish between primary
  and secondary research materials. • Implement methods and technologies commonly used for research and
  communication within various fields.</p>

  <p>The writing tasks for this chapter and the next two chapters are based on argumentative research.
  However, not all researched evidence (data) is presented in the same genre. You may need to gather evidence
  for a poster, a performance, a story, an art exhibit, or even an architectural design. Although the
  genre may vary, you usually will be required to present a perspective, or viewpoint, about a debatable
  issue and persuade readers to support the “validity of your viewpoint,” as discussed in Position Argument:
  Practicing the Art of Rhetoric. Remember, too, that a debatable issue is one that has more than a single
  perspective and is subject to disagreement.</p>

  <h3>The Research Process</h3>

  <p>Although individual research processes are rhetorically situated, they share some common aspects:</p>

  <ul><li>Interest. The researcher has a genuine interest in the topic. It may be difficult to fake curiosity,
  but it is possible to develop it. Some academic assignments will allow you to pursue issues that are
  personally important to you; others will require you to dive into the research first and generate interest
  as you go.</li><li>Questions. The researcher asks questions. At first, these questions are general.
  However, as researchers gain more knowledge, the questions become more sharply focused. No matter what
  your research assignment is, begin by articulating questions, find out where the answers lead, and then
  ask still more questions. • Answers. The researcher seeks answers from people as well as from print
  and other media. Research projects profit when you ask knowledgeable people, such as librarians and
  other professionals, to help you answer questions or point you in directions to find answers. Information
  about research is covered more extensively in Research Process: Accessing and Recording Information
  and Annotated Bibliography: Gathering, Evaluating, and Documenting Sources. • Field research. The researcher
  conducts field research. Field research allows researchers not only to ask questions of experts but
  also to observe and experience directly. It allows researchers to generate original data. No matter
  how much other people tell you, your knowledge increases through personal observations. In some subject
  areas, field research is as important as library or database research. This information is covered more
  extensively in Research Process: Accessing and Recording Information. • Examination of texts. The researcher
  examines texts. Consulting a broad range of texts—such as magazines, brochures, newspapers, archives,
  blogs, videos, documentaries, or peer-reviewed journals—is crucial in academic research. • Evaluation
  of sources. The researcher evaluates sources. As your research progresses, you will doublecheck information
  to find out whether it is confirmed by more than one source. In informal research, researchers evaluate
  sources to ensure that the final decision is satisfactory. Similarly, in academic research, researchers
  evaluate sources to ensure that the final product is accurate and convincing. Previewed here, this information
  is covered more extensively in Research Process: Accessing and Recording Information. • Writing. The
  researcher writes. The writing during the research process can take a range of forms: from notes during
  library, database, or field work; to journal reflections on the research process; to drafts of the final
  product. In practical research, writing helps researchers find, remember, and explore information. In
  academic research, writing is even more important because the results must be reported accurately and
  thoroughly. • Testing and Experimentation. The researcher tests and experiments. Because opinions vary
  on debatable topics and because few research topics have correct or incorrect answers, it is important
  to test and conduct experiments on possible hypotheses or solutions. • Synthesis. The researcher synthesizes.
  By combining information from various sources, researchers support claims or arrive at new conclusions.
  When synthesizing, researchers connect evidence and ideas, both original and borrowed. Accumulating,
  sorting, and synthesizing information enables researchers to consider what evidence to use in support
  of a thesis and in what ways. • Presentation. The researcher presents findings in an interesting, focused,
  and well-documented product.</li></ul>

  <h3>Types of Research Evidence</h3>

  <p>Research evidence usually consists of data, which comes from borrowed information that you use to
  develop your thesis and support your organizational structure and reasoning. This evidence can take
  a range of forms, depending on the type of research conducted, the audience, and the genre for reporting
  the research.</p>

  <h3>Primary Research Sources</h3>

  <p>Although precise definitions vary somewhat by discipline, primary data sources are generally defined
  as firsthand accounts, such as texts or other materials produced by someone drawing from direct experience
  or observation. Primary source documents include, but are not limited to, personal narratives and diaries;
  eyewitness accounts; interviews; original documents such as treaties, official certificates, and government
  documents detailing laws or acts; speeches; newspaper coverage of events at the time they occurred;
  observations; and experiments. Primary source data is, in other words, original and in some way conducted
  or collected primarily by the researcher. The Research Process: Where to Look for Existing Sources and
  Compiling Sources for an Annotated Bibliography contain more information on both primary and secondary
  sources.</p>

  <h3>Secondary Research Sources</h3>

  <p>Secondary sources, on the other hand, are considered at least one step removed from the experience.
  That is, they rely on sources other than direct observation or firsthand experience. Secondary sources
  include, but are not limited to, most books, articles online or in databases, and textbooks (which are
  sometimes classified as tertiary sources because, like encyclopedias and other reference works, their
  primary purpose might be to summarize or otherwise condense information). Secondary sources (https://openstax.org/r/
  secondarysources1) regularly cite and build upon primary sources to provide perspective and analysis.
  Effective use of researched evidence usually includes both primary and secondary sources. Works of history,
  for example, draw on a large range of primary and secondary sources, citing, analyzing, and synthesizing
  information to present as many perspectives of a past event in as rich and nuanced a way as possible.
  It is important to note that the distinction between primary and secondary sources depends in part on
  their use: that is, the same document can be both a primary source and a secondary source. For example,
  if Scholar X wrote a biography about Artist Y, the biography would be a secondary source about the artist
  and, at the same time, a primary source about the scholar.</p>

  <h2>Argumentative Research Trailblazer: Samin Nosrat</h2>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Identify and explain key rhetorical concepts.
  • Analyze how authors make claims and support them with evidence in a range of activities outside of
  academic writing.</p>

  <p>“I love doing the homework on recipes and traditions . . . [I’m] excited to . . . read and research.”</p>

  <p>Food writer, chef, and TV host Samin Nosrat (b. 1979) was born in San Diego, California, to Iranian
  parents who, as followers of the Baha’i faith, immigrated to the United States to avoid religious persecution
  in their native country. When she was a student at the University of California, Berkeley, Nosrat became
  interested in cooking after a dinner at Berkeley’s well-known Chez Panisse, the restaurant belonging
  to award-winning chef, author, and food activist Alice Waters (b. 1944). Indeed, Nosrat became so interested
  that she got a job bussing tables at the restaurant several months later. After a year, she “moved up”
  to the kitchen, where she became a cook, working with Chez Panisse chef Cal Peternell.</p>

  <p>Nosrat is well known for her cookbook Salt, Fat, Acid, Heat: Mastering the Elements of Good Cooking
  (2017), which won the prestigious James Beard Award in 2018 and also reached the New York Times best
  seller list that year. In the book, Nosrat claims that “like a scholar in search of primary sources,”
  she wanted “to experience authentic versions of the dishes” she loved. In addition to being a chef and
  writer, she has hosted an award-winning Netflix docuseries based on her book and until February 2021
  was a regular columnist for The New York Times Magazine.</p>

  <p>The underlying thesis of Nosrat’s Salt, Fat, Acid, Heat (https://openstax.org/r/saltfatacid) is that
  one should trust their senses in the kitchen, building confidence and developing the knowledge to gain
  this trust. Nosrat emphasizes an intuitive, elemental approach to cooking. “Anyone can cook anything
  and make it delicious,” Nosrat claims in the book’s introduction, establishing that excellent cooking
  is based on skill in using and balancing the four basic elements named in the title. She found solid
  evidence for this stance in Japan, where the cuisine features salt; in Italy, where the cuisine features
  fat; in Mexico, where the cuisine features acid; and in California, where the cuisine features heat.
  Nosrat explains these four elements in detail and supports her premise with research, interviews, and
  internships with talented cooks in different countries.</p>

  <p>When talking about her television show, Nosrat says, “Good food around the world is more similar
  than it is different.” She considers how the chemistry and the culture of cooking work together around
  the world to create universally good food and, at the same time, create empathy and common ground.</p>

  <p>Nosrat’s audience can thus discern a persuasive purpose to her research into cooking. She argues
  that in addition to food, cooking is about people, and she hopes that by eating the food of a particular
  culture, readers and viewers will develop compassion for the people of that culture, despite politics
  or history. Seeking answers to important questions, Nosrat asks, “Does [food] really matter? Can food
  make a difference?”</p>

  <p>As she continues her mission of research and writing, Nosrat feels the responsibility of her calling:
  to provide greater cross-cultural understanding and to center minoritized voices and traditions. She
  wants readers to feel safe inside her book, supported by the context she provides and her sensitivity
  to culture.</p>

  <h3>Discussion Questions</h3>

  <p>1. Consider the rhetorical situation: In what ways does Samin Nosrat’s writing respond to purpose,
  audience, genre, stance, culture, and context?</p>

  <p>2. In what ways does Nosrat aim to make the cookbook genre persuasive or argumentative?</p>

  <p>3. What is Nosrat’s claim in Salt, Fat, Acid, Heat?</p>

  <p>4. In what ways does Nosrat present reasoning and evidence?</p>

  <p>5. In what ways does Nosrat use research to support her claim?</p>

  <p>12.3 Glance at Genre: Introducing Research as Evidence</p>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Identify key terms and characteristics of evidence-based research writing. • Participate effectively
  in a continuing scholarly conversation by synthesizing research and discussing it with others. • Identify
  and analyze genre conventions as shaped by purpose, culture, and expectation. Good writing satisfies
  audience expectations in genre, style, and content. Similarly, careful research, conducted according
  to the scope and method of each discipline, is a precondition of good research writing. In the humanities,
  research usually focuses on texts, individual ideas, speculations, insights, and imaginative connections.
  On the other hand, research in the social and physical sciences tends to focus on data and ideas that
  can be verified through observation, measurement, and testing. However, regardless of differences in
  disciplines and preferences of varying audiences, certain principles of research, writing, and supporting
  a position hold true across the curriculum.</li></ul>

  <h3>The Genre of Research: Joining Scholarly Conversations</h3>

  <p>Conducting research on topics about which you have limited knowledge can be intimidating. To feel
  more comfortable with research, you can think of it as participating in a scholarly conversation, with
  the understanding that all knowledge on a particular subject is connected. Even if you discover only
  a small amount of information on your topic, the conversations around it may have begun long before
  you were born and may continue beyond your lifetime. Your involvement with the topic is your way of
  entering a conversation with other students and scholars at this time, as you discuss and synthesize
  information. After you leave the conversation, or finish your research, others are likely to pick it
  up again.</p>

  <h3>Key Terms in Research Writing</h3>

  <p>These are key terms and characteristics of evidence-based research writing:</p>

  <ul><li>Citation. When reporting research, writers use citations to acknowledge and give credit for
  all borrowed materials. Citation also strengthens the credibility, or ethos, of the researcher. Citations
  always have two parts. Internal citations are short references that lead readers to more detailed information
  about how to find the sources. External citations are the entries listed, with publishing information,
  on the Works Cited or References page of the paper. Formatting of both internal and external citations
  is disciplinary specific. See the Handbook for specific information about MLA Documentation and Format
  and APA Documentation and Format.</li><li>claim. Claims are the points you make in your report. They
  are based on and supported by research and evidence.</li><li>Counterclaims. When it comes to research,
  the counterclaim is the writer’s thoughtful consideration and addressing of the other side’s objections
  to claims made or even to the topic itself. Counterclaims may need to be supported by further research
  and evidence.</li><li>Evidence. Within the genre of research, evidence is either findings from original
  research or, more often, borrowed information that helps you develop your thesis and support your organizational
  structure and line of reasoning.</li><li>Field research. Field research is basically primary research
  you conduct through observation or experimentation. Depending on your research question, you may need
  to seek answers by visiting museums or businesses, attending concerts, conducting interviews, observing
  classrooms or professionals at work, performing experiments, or following leads. Field research is covered
  extensively in Research Process: How to Create Sources.</li><li>Research question. Your research question
  dictates your general line or lines of inquiry that ultimately guide your research. In developing your
  research question(s), you are narrowing the scope of your topic. Your research question(s) will come
  from the purpose of your research, the audience of your research product, and the genre for reporting
  your research.</li><li>Thesis. The thesis is the claim, position, or hypothesis by which you attempt
  to answer your formulated research question(s).</li><li>Reasoning. Similar to an argumentative essay,
  the line of reasoning in a research essay, report, or presentation is the organizational arrangement
  of the supports and evidence that back up your thesis.</li><li>Topic. The topic is the general subject
  or content area of your research. Strong topics are usually those that involve some controversy or debate.
  Topics that are not debatable or have no nuanced perspectives do not make for strong research questions
  or lines of inquiry.</li></ul>

  <p>12.4 Annotated Student Sample: "Healthy Diets from Sustainable Sources Can Save the Earth" by Lily
  Tran</p>

  <p>LEARNING OUTCOMES</p>

  <p>By the end of this section, you will be able to: • Analyze how writers use evidence in research writing.
  • Analyze the ways a writer incorporates sources into research writing, while retaining their own voice.
  • Explain the use of headings as organizational tools in research writing. • Analyze how writers use
  evidence to address counterarguments when writing a research essay.</p>

  <h3>Introduction</h3>

  <p>In this argumentative research essay for a first-year composition class, student Lily Tran creates
  a solid, focused argument and supports it with researched evidence. Throughout the essay, she uses this
  evidence to support cause-and-effect and problem-solution reasoning, make strong appeals, and develop
  her ethos on the topic.</p>

  <h3>LIVING BY THEIR OWN WORDS Food as Change</h3>

  <p>For the human race to have a sustainable future, massive changes in the way food is produced, processed,
  and distributed are necessary on a global scale. Purpose. Lily Tran refers to what she sees as the general
  purpose for writing this paper: the problem of current global practices in food production, processing,
  and distribution. By presenting the “problem,” she immediately prepares readers for her proposed solution.
  The required changes will affect nearly all aspects of life, including not only world hunger but also
  health and welfare, land use and habitats, water quality and availability, energy use and production,
  greenhouse gas emissions and climate change, economics, and even cultural and social values. These changes
  may not be popular, but they are imperative. The human race must turn to sustainable food systems that
  provide healthy diets with minimal environmental impact—and starting now. Thesis. Leading up to this
  clear, declarative thesis statement are key points on which Tran will expand later. In doing this, she
  presents some foundational evidence that connects the problem to the proposed solution.</p>

  <h3>THE COMING FOOD CRISIS</h3>

  <p>The world population has been rising exponentially in modern history. From 1 billion in 1804, it
  doubled to approximately 2 billion by 1927, then doubled again to approximately 4 billion in 1974. By
  2019, it had nearly doubled again, rising to 7.7 billion (“World Population by Year”). It has been projected
  to reach nearly 10 billion by 2050 (Berners-Lee et al.). At the same time, the average life span also
  has been increasing. These situations have led to severe stress on the environment, particularly in
  the demands for food. It has been estimated, for example, that by 2050, milk production will increase
  58 percent and meat production 73 percent (Chai et al.). Evidence. In this first supporting paragraph,
  Tran uses numerical evidence from several sources. This numerical data as evidence helps establish the
  projection of population growth. By beginning with such evidence, Tran underscores the severity of the
  situation. Theoretically, the planet can produce enough food for everyone, but human activities have
  endangered this capability through unsustainable practices. Currently, agriculture produces 10–23 percent
  of global greenhouse gas emissions. Greenhouse gases—the most common being carbon dioxide, methane,
  nitrous oxide, and water vapor— trap heat in the atmosphere, reradiate it, and send it back to Earth
  again. Heat trapped in the atmosphere is a problem because it causes unnatural global warming as well
  as air pollution, extreme weather conditions, and respiratory diseases. Audience. With her audience
  in mind, Tran briefly explains the problem of greenhouse gases and global warming. It has been estimated
  that global greenhouse gas emissions will increase by as much as 150 percent by 2030 (Chai et al.).
  Transportation also has a negative effect on the environment when foods are shipped around the world.
  As Joseph Poore of the University of Oxford commented, “It’s essential to be mindful about everything
  we consume: air-transported fruit and veg can create more greenhouse gas emissions per kilogram than
  poultry meat, for example” (qtd. in Gray). Transition. By beginning this paragraph with her own transition
  of ideas, Tran establishes control over the organization and development of ideas. Thus, she retains
  her sources as supports and does not allow them to dominate her essay.</p>

  <p>Current practices have affected the nutritional value of foods. Concentrated animal-feeding operations,
  intended to increase production, have had the side effect of decreasing nutritional content in animal
  protein and increasing saturated fat. One study found that an intensively raised chicken in 2017 contained
  only onesixth of the amount of omega-3 fatty acid, an essential nutrient, that was in a chicken in 1970.
  Today the majority of calories in chicken come from fat rather than protein (World Wildlife Fund).</p>

  <p>Example. By focusing on an example (chicken), Tran uses specific research data to develop the nuance
  of the argument.</p>

  <p>Current policies such as government subsidies that divert food to biofuels are counterproductive
  to the goal of achieving adequate global nutrition. Some trade policies allow “dumping” of below-cost,
  subsidized foods on developing countries that should instead be enabled to protect their farmers and
  meet their own nutritional needs (Sierra Club). Too often, agriculture’s objectives are geared toward
  maximizing quantities produced per acre rather than optimizing output of critical nutritional needs
  and protection of the environment.</p>

  <p>AREAS OF CONCERN</p>

  <h3>Hunger and Nutrition</h3>

  <p>Headings and Subheadings. Throughout the essay, Tran has created headings and subheadings to help
  organize her argument and clarify it for readers.</p>

  <p>More than 820 million people around the world do not have enough to eat. At the same time, about
  a third of all grains and almost two-thirds of all soybeans, maize, and barley crops are fed to animals
  (Barnard). According to the World Health Organization, 462 million adults are underweight, 47 million
  children under 5 years of age are underweight for their height, 14.3 million are severely underweight
  for their height, and 144 million are stunted (“Malnutrition”). About 45 percent of mortality among
  children under 5 is linked to undernutrition. These deaths occur mainly in low- and middle-income countries
  where, in stark contrast, the rate of childhood obesity is rising. Globally, 1.9 billion adults and
  38.3 million children are overweight or obese (“Obesity”). Undernutrition and obesity can be found in
  the same household, largely a result of eating energy-dense foods that are high in fat and sugars. The
  global impact of malnutrition, which includes both undernutrition and obesity, has lasting developmental,
  economic, social, and medical consequences.</p>

  <p>In 2019, Berners-Lee et al. published the results of their quantitative analysis of global and regional
  food supply. They determined that significant changes are needed on four fronts:</p>

  <p>Food production must be sufficient, in quantity and quality, to feed the global population without
  unacceptable environmental impacts. Food distribution must be sufficiently efficient so that a diverse
  range of foods containing adequate nutrition is available to all, again without unacceptable environmental
  impacts. Socio-economic conditions must be sufficiently equitable so that all consumers can access the
  quantity and range of foods needed for a healthy diet. Consumers need to be able to make informed and
  rational choices so that they consume a healthy and environmentally sustainable diet (10).</p>

  <p>Block Quote. The writer has chosen to present important evidence as a direct quotation, using the
  correct format for direct quotations longer than four lines. See Section Editing Focus: Integrating
  Sources and Quotations for more information about block quotes.</p>

  <p>Among their findings, they singled out, in particular, the practice of using human-edible crops to
  produce meat, dairy, and fish for the human table. Currently 34 percent of human-edible crops are fed
  to animals, a practice that reduces calorie and protein supplies. They state in their report, “If society
  continues on a ‘business-asusual’ dietary trajectory, a 119% increase in edible crops grown will be
  required by 2050” (1). Future food production and distribution must be transformed into systems that
  are nutritionally adequate, environmentally sound, and economically affordable.</p>

  <h3>Land and Water Use</h3>

  <p>Agriculture occupies 40 percent of Earth’s ice-free land mass (Barnard). While the net area used
  for producing food has been fairly constant since the mid-20th century, the locations have shifted significantly.
  Temperate regions of North America, Europe, and Russia have lost agricultural land to other uses, while
  in the tropics, agricultural land has expanded, mainly as a result of clearing forests and burning biomass
  (Willett et al.). Seventy percent of the rainforest that has been cut down is being used to graze livestock
  (Münter). Agricultural use of water is of critical concern both quantitatively and qualitatively. Agriculture
  accounts for about 70 percent of freshwater use, making it “the world’s largest water-consuming sector”
  (Barnard). Meat, dairy, and egg production causes water pollution, as liquid wastes flow into rivers
  and to the ocean (World Wildlife Fund and Knorr Foods). According to the Hertwich et al., “the impacts
  related to these activities are unlikely to be reduced, but rather enhanced, in a business-as-usual
  scenario for the future” (13).</p>

  <p>Statistical Data. To develop her points related to land and water use, Tran presents specific statistical
  data throughout this section. Notice that she has chosen only the needed words of these key points to
  ensure that she controls the development of the supporting point and does not overuse borrowed source
  material.</p>

  <p>Defining Terms. Aware of her audience, Tran defines monocropping, a term that may be unfamiliar.</p>

  <p>Earth’s resources and ability to absorb pollution are limited, and many current agricultural practices
  undermine these capacities. Among these unsustainable practices are monocropping [growing a single crop
  year after year on the same land], concentrated animal-feeding operations, and overdependence on manufactured
  pesticides and fertilizers (Hamilton). Such practices deplete the soil, dramatically increase energy
  use, reduce pollinator populations, and lead to the collapse of resource supplies. One study found that
  producing one gram of beef for human consumption requires 42 times more land, 2 times more water, and
  4 times more nitrogen than staple crops. It also creates 3 times more greenhouse gas emissions (Chai
  et al.). The EAT–Lancet Commission calls for “halting expansion of new agricultural land at the expense
  of natural ecosystems . . . strict protections on intact ecosystems, suspending concessions for logging
  in protected areas, or conversion of remaining intact ecosystems, particularly peatlands and forest
  areas” (Willett et al. 481). The Commission also calls for landuse zoning, regulations prohibiting land
  clearing, and incentives for protecting natural areas, including forests.</p>

  <p>Synthesis. The paragraphs above and below this comment show how Tran has synthesized content from
  several sources to help establish and reinforce key supports of her essay.</p>

  <h3>Greenhouse Gas and Climate Change</h3>

  <p>Climate change is heavily affected by two factors: greenhouse gas emissions and carbon sequestration.
  In nature, the two remain in balance; for example, most animals exhale carbon dioxide, and most plants
  capture carbon dioxide. Carbon is also captured, or sequestered, by soil and water, especially oceans,
  in what are called “sinks.” Human activities have skewed this balance over the past two centuries. The
  shift in land use, which exploits land, water, and fossil energy, has caused increased greenhouse-gas
  emissions, which in turn accelerate climate change.</p>

  <p>Global food systems are threatened by climate change because farmers depend on relatively stable
  climate systems to plan for production and harvest. Yet food production is responsible for up to 30
  percent of greenhouse gas emissions (Barnard). While soil can be a highly effective means of carbon
  sequestration, agricultural soils have lost much of their effectiveness from overgrazing, erosion, overuse
  of chemical fertilizer, and excess tilling. Hamilton reports that the world’s cultivated and grazed
  soils have lost 50 to 70 percent of their ability to accumulate and store carbon. As a result, “billions
  of tons of carbon have been released into the atmosphere.”</p>

  <p>Direct Quotation and Paraphrase. While Tran has paraphrased some content of this source borrowing,
  because of the specificity and impact of the number— “billions of tons of carbon”—she has chosen to
  use the author’s original words. As she has done elsewhere in the essay, she has indicated these as
  directly borrowed words by placing them within quotation marks. See Section 12.5 for more about paraphrasing.</p>

  <p>While carbon sequestration has been falling, greenhouse gas emissions have been increasing as a result
  of the production, transport, processing, storage, waste disposal, and other life stages of food production.
  Agriculture alone is responsible for fully 10 to 12 percent of global emissions, and that figure is
  estimated to rise by up to 150 percent of current levels by 2030 (Chai et al.). Münter reports that
  “more greenhouse gas emissions are produced by growing livestock for meat than all the planes, trains,
  ships, cars, trucks, and all forms of fossil fuel-based transportation combined” (5). Additional greenhouse
  gases, methane and nitrous oxide, are produced by the decomposition of organic wastes. Methane has 25
  times and nitrous oxide has nearly 300 times the global warming potential of carbon dioxide (Curnow).
  Agricultural and food production systems must be reformed to shift agriculture from greenhouse gas source
  to sink.</p>

  <h3>Social and Cultural Values</h3>

  <p>As the Sierra Club has pointed out, agriculture is inherently cultural: all systems of food production
  have “the capacity to generate . . . economic benefits and ecological capital” as well as “a sense of
  meaning and connection to natural resources.” Yet this connection is more evident in some cultures and
  less so in others. Wealthy countries built on a consumer culture emphasize excess consumption. One result
  of this attitude is that in 2014, Americans discarded the equivalent of $165 billion worth of food.
  Much of this waste ended up rotting in landfills, comprised the single largest component of U.S. municipal
  solid waste, and contributed a substantial portion of U.S. methane emissions (Sierra Club). In low-
  and middle-income countries, food waste tends to occur in early production stages because of poor scheduling
  of harvests, improper handling of produce, or lack of market access (Willett et al.). The recent “America
  First” philosophy has encouraged prioritizing the economic welfare of one nation to the detriment of
  global welfare and sustainability.</p>

  <p>Synthesis and Response to Claims. Here, as in subsequent sections, while still relying heavily on
  facts and content from borrowed sources, Tran provides her synthesized understanding of the information
  by responding to key points.</p>

  <p>In response to claims that a vegetarian diet is a necessary component of sustainable food production
  and consumption, Lusk and Norwood determined the importance of meat in a consumer’s diet. Their study
  indicated that meat is the most valuable food category to consumers, and “humans derive great pleasure
  from consuming beef, pork, and poultry” (120). Currently only 4 percent of Americans are vegetarians,
  and it would be difficult to convince consumers to change their eating habits. Purdy adds “there’s the
  issue of philosophy. A lot of vegans aren’t in the business of avoiding animal products for the sake
  of land sustainability. Many would prefer to just leave animal husbandry out of food altogether.”</p>

  <p>At the same time, consumers expect ready availability of the foods they desire, regardless of health
  implications or sustainability of sources. Unhealthy and unsustainable foods are heavily marketed. Out-ofseason
  produce is imported year-round, increasing carbon emissions from air transportation. Highly processed
  and packaged convenience foods are nutritionally inferior and waste both energy and packaging materials.
  Serving sizes are larger than necessary, contributing to overconsumption and obesity. Snack food vending
  machines are ubiquitous in schools and public buildings. What is needed is a widespread attitude shift
  toward reducing waste, choosing local fruits and vegetables that are in season, and paying attention
  to how foods are grown and transported.</p>

  <p>Thesis Restated. Restating her thesis, Tran ends this section by advocating for a change in attitude
  to bring about sustainability.</p>

  <h3>DISSENTING OPINIONS</h3>

  <p>Counterclaims. Tran uses equally strong research to present the counterargument. Presenting both
  sides by addressing objections is important in constructing a clear, well-reasoned argument. Writers
  should use as much rigor in finding research-based evidence to counter the opposition as they do to
  develop their argument.</p>

  <p>Transformation of the food production system faces resistance for a number of reasons, most of which
  dispute the need for plant-based diets. Historically, meat has been considered integral to athletes’
  diets and thus has caused many consumers to believe meat is necessary for a healthy diet. Lynch et al.
  examined the impact of plant-based diets on human physical health, environmental sustainability, and
  exercise performance capacity. The results show “it is unlikely that plant-based diets provide advantages,
  but do not suffer from disadvantages, compared to omnivorous diets for strength, anaerobic, or aerobic
  exercise performance” (1).</p>

  <p>A second objection addresses the claim that land use for animal-based food production contributes
  to pollution and greenhouse gas emissions and is inefficient in terms of nutrient delivery. Berners-Lee
  et al. point out that animal nutrition from grass, pasture, and silage comes partially from land that
  cannot be used for other purposes, such as producing food directly edible by humans or for other ecosystem
  services such as biofuel production. Consequently, nutritional losses from such land use do not fully
  translate into losses of humanavailable nutrients (3).</p>

  <p>Paraphrase. Tran has paraphrased the information as support. Though she still cites the source, she
  has changed the words to her own, most likely to condense a larger amount of original text or to make
  it more accessible.</p>

  <p>While this objection may be correct, it does not address the fact that natural carbon sinks are being
  destroyed to increase agricultural land and, therefore, increase greenhouse gas emissions into the atmosphere.</p>

  <p>Another significant dissenting opinion is that transforming food production will place hardships
  on farmers and others employed in the food industry. Farmers and ranchers make a major investment in
  their own operations. At the same time, they support jobs in related industries, as consumers of farm
  machinery, customers at local businesses, and suppliers for other industries such as food processing
  (Schulz). Sparks reports that “livestock farmers are being unfairly ‘demonized’ by vegans and environmental
  advocates” and argues that while farming includes both costs and benefits, the costs receive much more
  attention than the benefits.</p>

  <h3>FUTURE GENERATIONS</h3>

  <p>The EAT–Lancet Commission calls for a transformation in the global food system, implementing different
  core processes and feedback. This transformation will not happen unless there is “widespread, multi-sector,
  multilevel action to change what food is eaten, how it is produced, and its effects on the environment
  and health, while providing healthy diets for the global population” (Willett et al. 476). System changes
  will require global efforts coordinated across all levels and will require governments, the private
  sector, and civil society to share a common vision and goals. Scientific modeling indicates 10 billion
  people could indeed be fed a healthy and sustainable diet.</p>

  <p>Conclusion. While still using research-based sources as evidence in the concluding section, Tran
  finishes with her own words, restating her thesis.</p>

  <p>For the human race to have a sustainable future, massive changes in the way food is produced, processed,
  and distributed are necessary on a global scale. The required changes will affect nearly all aspects
  of life, including not only world hunger but also health and welfare, land use and habitats, water quality
  and availability, energy use and production, greenhouse gas emissions and climate change, economics,
  and even cultural and social values. These changes may not be popular, but they are imperative. They
  are also achievable. The human race must turn to sustainable food systems that provide healthy diets
  with minimal environmental impact, starting now.</p>

  <p>Sources. Note two important aspects of the sources chosen: 1) They represent a range of perspectives,
  and 2) They are all quite current. When exploring a contemporary topic, it is important to avoid research
  that is out of date.</p>

