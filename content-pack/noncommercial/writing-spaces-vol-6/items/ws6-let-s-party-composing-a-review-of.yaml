body: '<p>Review of the Literature on a</p>

  <p>Technical Topic</p>

  <p>Daniel P. Richards</p>

  <p>If you’re reading this essay, then you most likely have a daunting task ahead of you: writing a literature
  review.1 Rest assured that you are not alone in your apprehension or lack of excitement at the prospect
  laid in front of you—most writers feel the same. Parties have never been thrown for a literature review.
  No champagne bottles have been uncorked in its name.</p>

  <p>It is likely that your experience in writing literature reviews to this point has been when composing
  that section of your research paper where all the secondary sources you found belong. You have located
  the requisite five sources for your teacher and now need to cite and summarize them. You dump them in
  the boring space of the document that exists after your clever introduction but before your savvy argument.
  That space might be more than boring; it might be treacherous, a place where all the MLA and APA errors
  live and where you feel right out of your league in being able to aptly summarize complex scholarship.</p>

  <p>Yet, rest assured, a literature review remains a vital ingredient in the effectiveness of a given
  piece of writing, and it might even surprise you that literature reviews serve a critical function in
  technical and professional workspaces as well. Research does not end once a degree is conferred. A literature
  review can take many forms and can be found in a wide array of academic, scientific, technical, and
  workplace documents spanning all fields and disciplines. Sometimes it is the full document; sometimes
  it is but part of a document. From essays in philosophy to journal articles in oceanography to grant
  applications in microbiology to proposals in public policy to informal reports in social media marketing
  to business pitches in accounting, each have a type of literature review component that are connected
  more by function (what it does) than by form (how it is organized).</p>

  <p>1 This work is licensed under the Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International
  License (CC BY-NC-ND 4.0) and is subject to the Writing Spaces Terms of Use. To view a copy of this
  license, visit http://creativecommons. org/licenses/by-nc-nd/4.0/, email info@creativecommons.org, or
  send a letter to Creative Commons, PO Box 1866, Mountain View, CA 94042, USA. To view the Writing Spaces
  Terms of Use, visit http://writingspaces.org/terms-of-use.</p>

  <p>That is, the form can take many shapes: A literature review can be a threepage section of an academic
  essay, yes, but it also can be a one paragraph overview of common platforms used by other companies
  in their social media marketing. It can be a background research section of a grant application for
  a municipal project. The functions, however, by and large stay the same. The goal of this essay is to
  examine what these functions are and, in doing so, present the case that a literature review is not
  supplemental but foundational to any piece of writing—including those in more technical documents.</p>

  <p>So, actually, you know what? Let’s throw literature reviews a party, after all. And let’s do so by
  way of an acrostic (a type of verse in which the first letters of each line form a word) of five functions
  of a literature review, which we’ll address in order, and which end with practical guidance. In terms
  of its functions, a literature review:</p>

  <ul><li>Participates in a Conversation • Adjudicates Sources • Refines for the Target Audience • Transmutes
  into Trust • Yokes You to Others</li></ul>

  <p>Literature reviews deserve as much, given their bad rap, indeed their pivotal but thankless role
  in writing success. And it might make the prospect a little clearer and, dare I say, exciting.</p>

  <h3>Participates in a Conversation</h3>

  <p>Alright, first things first: “literature” doesn’t mean what you might think it means. In the context
  of a “literature review” the term means much more than just literary texts, especially those covered
  in English and, well, literature classes. In academic and workplace contexts, “reviewing the existing
  literature” on a topic means to account for the work on your given topic that has come before you in
  this current moment in time. This work can be books, of course, but also journal articles, websites,
  projects, funded grants, white papers, or any document that discusses the best practices of a given
  process. To review the literature is to acknowledge the predecessors that came before you. It is to
  participate in the larger conversation around the topic you are researching.</p>

  <p>This idea of participation is key. While it may seem like secondary research is static and somewhat
  disconnected from your current writing project in front of you at this very moment, discovering what
  research, practices, and perspectives have been established before you actually connect your work to
  a larger system of ideas. Discovering what has already been done by others does not subtract from the
  value of your work. It adds to it by linking it directly to an ongoing conversation in which you are
  seeking to be a participant.</p>

  <p>Imagine showing up hours late to a party and your friends are having an unexpectedly vigorous debate.
  As you approach closer to the loud noise of your fiery friends you notice that they seem to be debating
  whether or not a beloved local coffee shop’s new app allowing for online ordering is a good idea—a contentious
  topic if there ever was one! As you reach the circle, you apologize for interrupting with your lateness
  and vocalize, as a regular patron of the local coffee shop and former coffee barista yourself, that
  you think the new app is ridiculous and will take away the essence of the local coffee shop experience.</p>

  <p>You even surprise yourself at how riled up you are about this topic and continue on with examples
  from your time as a coffee barista where you would get to know and even anticipate orders of regular
  customers from the moment they walked in the door. You gave examples of Julia’s double mocha at eight
  in the morning, or Ahmad’s late afternoon triple espresso on his way to his late shift. You fervently
  insist that getting to know customers personally is part of the coffee shop experience, and that the
  time spent chatting while the customer is waiting in person is a vital social event to our culture!
  We need to retain these coffee shops to retain our sense of community, you exclaim! The faces of your
  friends slowly take puzzled forms; a few even glance at each other, polite but confused. “What?” you
  ask. “Am I being wild? Do you all disagree with me? I’m not being radical here!”</p>

  <p>“No, you’re not,” your closest friend, and now spokesperson for the group, calmly responds. “It’s
  just that we weren’t talking about local coffee shops generally and their social functions. We were
  talking about how everything in this world is just speeding up, and how no one has any patience for
  anything anymore. It’s go-go-go all the time, and this new app is just one example. This conversation
  actually started with social media. We were a bit thrown off by your, um, statements because your story
  about your time as a barista was pretty deep in the weeds about coffee shops and not at all about the
  death of patience in our society. So, it’s kinda related, but, like, not really, right?”</p>

  <p>How embarrassing. You completely misread the conversation. You want to go back home, or at least
  sink into a hole in the floor, but you simply apologize and tell yourself you’re going to learn how
  to listen better and be less opinionated all the time. You’re quiet for the rest of the night, which
  is probably for the best.</p>

  <p>The party rule you broke was the unstated condition of participation in conversation: that you listen
  and acknowledge and then speak. You might feel like you have a grasp of a conversation by the last one
  or two things said, but without the full understanding of the conversation’s starting point, not to
  mention the opinions of others that have been stated before your arrival, your vocalization is not really
  participation in the truest, most honest and productive sense of the word. You’re making noise and people
  hear it, but it is not connected and, therefore, not really useful. Or persuasive. Or meaningful. By
  analogy, the literature review helps satisfy this condition. It shows that you have been paying attention,
  you understand the origins of the conversation, and you acknowledge and value the words of others above
  or at least before your own.</p>

  <p>To improve this function of your literature review, you’ll need then to conduct a thorough review
  of all the work that has been done and is currently being done on your topic. This ensures a more seamless
  entry into participation and also ensures that you are not repeating the work of others. It shows you
  are “listening” before speaking. This process of review must be diligent, even painstakingly so, depending
  on the level of depth you are seeking to achieve.</p>

  <p>The reader has absolutely no obligation to do any research for you. You will, of course, have to
  draw the line somewhere—you can’t research everything ever. So, seeking the guidance of your professor
  or a subject-specific librarian would be wise to help scope the breadth of the project. The type of
  reviewing and researching you’ll be doing and the places you’ll look will depend on the piece of writing
  you’re working on. And each piece will have different places to start and different times to stop.</p>

  <h3>Practice</h3>

  <p>Find everything you can on the topic, using resources around you like a librarian or professor to
  point you in the right direction. Create a spreadsheet—a running inventory of sorts—to archive your
  finds (Table 5.1).</p>

  <p>Creating a table ensures that (a) you don’t have 21 browser tabs open with important information
  and then lose them when your internet crashes and (b) you are thinking about how each piece of information
  you find—could be books, journal articles, web pieces, blog posts, or software applications—connects
  to your research. They could support it, challenge it, facilitate it—whatever. But listening to as many
  folks as you can and learning (and remembering!) their positions on a topic is one of the best ways
  to have a great time at a party and avoid any social faux pas. Off you go to dig into the research.</p>

  <h3>Table 5.1. Source Spreadsheet for Literature Reviews</h3>

  <p>Author Title Publication Link/ Reliability Main Argu-</p>

  <p>DOI Rating (1 ment/Findto 5) ings</p>

  <p>Connection to Your Project</p>

  <p>...</p>

  <p>... ...</p>

  <p>... ...</p>

  <p>...</p>

  <p>...</p>

  <h3>Adjudicates Sources</h3>

  <p>Whew! That was a lot of sources. You have currently . . . let’s see . . . 5 . . . 10 . . . 17 sources!
  Great work. But your professor only asked for a few. Now what? Need you include all of them in your
  literature review? Short answer: No. But I want the professor to know how much research I’ve done, you
  retort. Understandable, but another key function of the literature review is adjudication—or, judging
  which sources are most relevant to include and why, essentially sifting through your list and transitioning
  from indiscriminate collection of sources to a more focused curation of the most credible and relevant
  sources for the constraints, genre, and purpose of your piece of writing. This takes time, experience,
  and deliberation— much like it would for any astute judge.</p>

  <p>The process of adjudication serves the function of scoping your topic. So, when I say that you curate
  your sources according to constraints, genre, and purpose this means that you narrow down what you’ll
  be including by thinking about how much space you have, who your audience is, what the expectations
  are for type of document, and what it is you are trying to accomplish. Sometimes literature reviews
  are one paragraph in a report, and sometimes they are 10 pages in a research paper. Sometimes the source
  is a journal article and sometimes it is a software application. Again, the form differs widely but
  the function of focusing and framing your topic remains across the board.</p>

  <p>As an example: Imagine you just got hired for an entry level communications position at a local nonprofit
  environmental organization whose mission is to engage the public on issues around global warming and
  sea level rise. This is your dream job! You’re on the communications team for a science-centered organization
  and can now put your English degree in technical writing to use. You’re excited to funnel in your passion
  about protecting the earth and its residents to a real job. You’re also interested to see how your academic
  degree will transfer into a real-world job context.</p>

  <p>The development team contacts the communications team with an idea. They would like to develop their
  own sea level rise viewer that is interactive and that would allow folks along the coastlines to see
  what a certain amount of flooding or sea level rise would do to their home and when. They are sick and
  tired of trying to connect to residents by sharing scientific data; they want to help personalize the
  risk in the hopes of engaging residents who are at risk. They have some preliminary design ideas, and
  they have a good sense of what type of coding needs to go into such a GIS-focused tool. But they want
  to see what the current research is on these types of tools. They of course reach out to the communications
  team because this team consists of astute researchers with freshly minted degrees in the humanities.</p>

  <p>You start accumulating sources in your nifty table (Table 5.2). During your research you start to
  realize that on this topic there are academic sources as well as actual tools (like applications and
  maps). Are these “sources,” you wonder? Is this part of the “literature” that needs to be reviewed?
  In technical contexts, the answer is yes. When exploring technical topics, all sources are game, even
  if they don’t fit as neatly into the nifty table.</p>

  <p>You consider what sources would be useful for the development team to know about. You really engaged
  with the Rawlins and Wilson journal article, most likely because you have a knack for theory, but would
  this be helpful to review for the purpose ahead of you? The constraints of the informal report genre?
  The audience at hand? The Stephens et al. piece you also enjoyed and was much more practical and research
  based. But they focused on the user experience of sea level rise viewers, which seems farther down the
  project road for the developers, who have barely started prototyping their vision. You realize now that
  a source can be quite reliable, engaging, and connected but not of immediate relevance for your project.
  And that’s OK—that’s part of savvy rhetorical adjudication that focuses on the needs of the reader more
  than a window into the full extent of your research.</p>

  <p>You then decide that for this “review of literature” you’ll just be listing, summarizing, and synthesizing
  the actual tools themselves. You’ll make a note in there about how there is ample scholarship on these
  tools, but for the purpose of this project, and its scope, at this time you are choosing to focus on
  the technical sources.</p>

  <p>Table 5.2. Populated Source Spreadsheet for Literature Reviews, Including Both Academic and Technical
