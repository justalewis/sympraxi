  <p>Case Study Profile: What One Person Says About All</p>

  <p>15</p>

  <h3>CHAPTER OUTLINE</h3>

  <p>15.1 Tracing a Broad Issue in the Individual 15.2 Case Study Trailblazer: Vilayanur S. Ramachandran
  15.3 Glance at Genre: Observation, Description, and Analysis 15.4 Annotated Sample Reading: Case Study
  on Louis Victor "Tan" Leborgne 15.5 Writing Process: Thinking Critically About How People and Language
  Interact 15.6 Editing Focus: Words Often Confused 15.7 Evaluation: Presentation and Analysis of Case
  Study 15.8 Spotlight on … Applied Linguistics 15.9 Portfolio: Your Own Uses of Language</p>

  <p>INTRODUCTION Academic research is often about finding answers to human questions. How do people live,
  and how do they learn? In what ways is language an expression of thought? Why do people act as they
  do? How do people’s feelings affect their behavior? Answers to these questions are not easy to find
  because many are hidden in the human brain. Indeed, researchers may spend years of study looking for
  such answers and, in doing so, may discover only more questions.</p>

  <p>How do you begin to find answers to such behavioral research questions? One research tool, the case
  study, gives researchers the opportunity to observe people and draw conclusions about their behavior.
  Education, psychology, sociology, and linguistics are just some of the research fields that rely on
  these studies as a way of drawing conclusions through observation.</p>

  <p>A case study is a genre of academic writing in which researchers use firsthand evidence to share
  findings, draw hypotheses, and identify opportunities for further investigation. In this chapter, you
  will learn what a case study is, how it contributes to research, and how to conduct an informal one
  of your own.</p>

  <p>15.1 Tracing a Broad Issue in the Individual</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Define the term case studies. • Explain the purpose
  of case studies in academic research. • Identify ethical considerations of research on human subjects.</p>

  <p>To gain more knowledge of or insights into human behavior, thoughts, or emotions, researchers conduct
  observations of participants. Case studies are the written results of these observations. Because authors
  of case studies interpret results within the context of a limited setting and sample size, these authors
  often theorize about their findings and aim to discover opportunities for further research rather than
  draw hard, universal conclusions.</p>

  <p>Case studies depend on qualitative research and analysis. Qualitative research involves subjective
  evidence that is difficult to control and difficult to replicate. For example, if a researcher observes
  a classroom, business, or hospital setting, their observations are limited to what they observe at that
  particular location on that particular day at that particular time.</p>

  <p>Case studies also depend on quantitative research. Quantitative research involves hard, specific
  data that can be replicated in a controlled environment. You may have read about health studies that
  suggest a moderate amount of red wine or chocolate is good for your health or that eating red meat is
  bad for your health. Authors of case studies use quantitative research by looking at data drawn from
  a group and using it as a basis for their findings. In other words, the data, not the researchers’ observations,
  form the primary evidence.</p>

  <p>Another thing to know about case studies is that their authors attempt to observe participants in
  their natural environments. For example, to learn something about customer-service skills for a case
  study, an author would observe employees at a call center or in a retail store as they do their jobs.
  Similarly, to learn about how people use language, an author might observe people communicating naturally
  with their friends, family, or colleagues. Because case studies take place in the participants’ natural
  environments, analyzing case studies can help readers imagine themselves in that environment. For example,
  as part of their training, a nurse or doctor might read a case study about a patient to think about
  what they would do in the same situation. Examining case studies helps readers imagine a wide range
  of outcomes, while conducting case studies helps researchers discover opportunities for further research.</p>

  <h3>Case Study Ethics</h3>

  <p>Professional researchers must abide by a complex ethical and legal framework when conducting case
  studies. More importantly, participants must give their permission to be part of the study and to have
  their information shared. Researchers are obligated to act ethically when conducting case studies, but
  what does “act ethically” mean, exactly? Most people would agree that it is unethical to inflict harm
  on a case study participant, yet there are instances of researchers injuring their participants either
  physically or psychologically. One of the best-known examples of a case study conducted unethically
  (https://openstax.org/r/conductedunethically) is the Milgram Experiment (https://openstax.org/r/milgramexperiment),
  in which Yale University psychologist Stanley Milgram (https://openstax.org/r/stanleymilgram) (1933–1984)
  attempted to study the extent of people’s willingness to submit to authority when ordered to do something
  they know is wrong. Participants were instructed to deliver a range of electric shocks to other participants,
  who in fact were not actual participants but other researchers. Unbeknownst to the participants, the
  shocks were not real, and no electric current was delivered when participants pressed the button to
  deliver the shocks. Responses to shocks—screams and other indications of pain—were prerecorded. Yet
  some participants reported suffering psychological trauma from what they believed were their actions.
  Most people also would consider it unethical to be dishonest about a case study. Researchers are expected
  to conduct their studies and analyze their data objectively, without bias. Over the years, laws and
  ethical codes have been implemented to protect case study participants. If you pursue an academic or
  career field that uses case studies, you will learn more about ethical and legal considerations specific
  to that field. For example, most academic case studies must be approved by an institutional review board
  (IRB) before the research can be conducted. Most universities have specific guidance on how faculty
  and students should go about research involving human subjects and most likely will have strict guidelines
  for conducting case studies. The assignment in this chapter, however, asks only that you conduct an
  informal case study. Your instructor will be your best resource to get answers to questions you have
  about your college’s policies on conducting research and whether and how they apply to the research
  you intend to do.</p>

  <h2>Case Study Trailblazer: Vilayanur S. Ramachandran</h2>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Apply critical thinking and communication in varying
  rhetorical and cultural contexts. • Identify and describe the genre conventions and rhetorical situation
  of case studies.</p>

  <p>“My . . . work . . . has been to unravel . . . the mysterious connections between brain, mind, and
  body.”</p>

  <h3>Ramachandran’s Case Study on Phantom Limbs</h3>

  <p>Neuropsychologist Vilayanur Subramanian Ramachandran (https://openstax.org/r/vsramachandran) (b.
  1951) was born in Tamil Nadu, India. He was educated in India and Thailand before earning a PhD from
  the University of Cambridge in England. Both a physician and a medical researcher, Dr. Ramachandran
  is a distinguished professor of psychology at the University of California, San Diego. He is best known
  for his work in behavioral neurology, particularly his research on the phenomenon of phantom limbs.
  Behavioral neurology is a specialty that focuses on the ways in which neurological damage and disease
  affect behavior, memory, and cognition and how these problems can be treated. Ramachandran is the author
  of the books Phantoms in the Brain (1998) and The Tell-Tale Brain (2011), among others. Ramachandran’s
  most significant contribution to the field of behavioral neurology is the mirror box (https://openstax.org/r/mirrorbox),
  a device used to treat patients with amputated limbs. Phantom limb, a condition that afflicts people
  who have had an arm or leg amputated, is characterized by a feeling or sensation in the area of the
  amputated limb. In some cases, patients report pain in a phantom limb. Connecting brain, mind, and body,
  Ramachandran theorized that in cases of phantom limb pain, the brain could be tricked into thinking
  the limb was still there. Thus, the brain would reorient itself (scientifically referred to as neural
  plasticity) and, consequently, reduce pain. He then conducted case studies to test this theory. Ramachandran’s
  first task was to identify a research question, which he formulated from a theory based on existing
  literature on neural plasticity. At the time, little scientific research existed on phantom limbs, thus
  providing Ramachandran with an opportunity to gain new insights into the phenomenon. Aware that existing
  research suggested the brain could reorient, or rewire, itself, he posited that neural plasticity could
  be used to help people with phantom limb syndrome. Ramachandran’s methods included recruiting case study
  participants whom he could observe. He placed ads in newspapers seeking volunteers who had undergone
  amputations. He then conducted case studies on the volunteers to observe how phantom limbs affected
  them. These observations, along with previous research, convinced Ramachandran that neural plasticity
  could be used to treat patients with phantom limb syndrome. Based on his observations of a limited number
  of people, Ramachandran analyzed the results of his studies and developed the mirror box, a treatment
  that is used today to help ease chronic pain when it exists on one side of the body. Focusing on the
  connections of brain, mind, and body, Ramachandran created a box containing a mirror that reflects the
  existing limb. The reflection of the limb, which the participant moves, creates an illusion in the brain,
  tricking it into thinking it has control of the missing limb.</p>

  <h3>Discussion Questions</h3>

  <p>1. What advantages and disadvantages would a case study offer a researcher such as Ramachandran for
  finding information?</p>

  <p>2. What do you think Ramachandran’s research question was? 3. What would have constituted quantitative
  and qualitative research in Ramachandran’s case study?</p>

  <p>4. What do you think Ramachandran might have told participants regarding the ethics of the study?</p>

  <p>15.3 Glance at Genre: Observation, Description, and Analysis</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Identify the structural components of case studies.
  • Determine the objectivity of case studies. • Apply the genre conventions of case studies in your own
  research.</p>

  <p>The goal of case study authors is to expand knowledge in a field of study. In many case studies,
  researchers look for “blind spots”: areas of investigation that the current research is not addressing
  or not addressing sufficiently. Sometimes the authors of a study will explicitly state what they believe
  are the gaps in their research and call on other researchers to fill in those gaps.</p>

  <h3>Components of Case Studies</h3>

  <p>Case studies generally have five main parts. They begin by presenting an overview of previous case
  studies on the topic. Sometimes called a literature review, this part of the case study provides background
  and helps readers understand where the current study fits within previous research. The second component
  of a case study is a detailed description of the participants and the observation environment. These
  descriptions of the individuals being studied and the conditions under which they are being studied
  provide additional background and context. The third component is the methods section, in which the
  author explains the ways in which data will be collected, such as interviews, surveys, observations,
  document analysis, and so on. The fourth component, following the methods section, is an organized presentation
  of the data collected, or the findings of the study. Finally, an analysis of the results concludes the
  case study. In this section, the author provides an interpretation of the collected data. This section
  usually includes an explanation of the limitations of and gaps in the case study’s data, methods, or
  anything else the author believes is important.</p>

  <p>Similar to academic essays, case studies adhere to a formal structure and voice. They are organized
  clearly, edited carefully, and reflect objectivity. As with all academic work, sources are documented
  and cited, usually using APA Documentation and Format.</p>

  <h3>Key Terms</h3>

  <p>A case study, at its most basic level, is about close observation as a basis for analysis. By observing
  individuals or groups in a particular setting, researchers attempt to learn something about the participants’
  thoughts, actions, behavior, or feelings. To conduct a case study, you should be familiar with the following
  terms.</p>

  <ul><li>Analysis: Interpretation of data gathered in a case study. • Data: Information gathered from
  observation, interviews, research, or any other part of a case study. • field observations: Observations
  made while participants are engaged in “real” activities at “real” places.</li></ul>

  <p>Usually these are the workplace, school, or home. Other locations might be athletic or social venues
  or any other setting in which participants can be observed acting as they would if they were not being
  observed. • Results: What collected data reveals about the research question. • Participants: The human
  or, in some cases, nonhuman subjects observed in specific settings for the purpose of collecting data
  and evidence. • Observation environment: The location and conditions under which participants are observed.
  • qualitative research: Subjective information based on observations or elements that are difficult
  to replicate. • quantitative research: Specific data that can be replicated in a controlled environment.
  • Research question: Focused question about the topic being researched. A research question is the basis
  of a case study.</p>

  <ul><li>Survey or Interview: Questions that the author of a case study asks participants in order to
  elicit relevant information.</li></ul>

  <p>15.4 Annotated Sample Reading: Case Study on Louis Victor "Tan" Leborgne</p>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Apply critical thinking and communication in varying rhetorical and cultural contexts. • Identify
  and describe the genre conventions and rhetorical situation of case studies. • Analyze relationships
  between ideas and patterns of organization.</li></ul>

  <p>Introduction</p>

  <p>LIVING BY THEIR OWN WORDS</p>

  <h3>Patient Admission</h3>

  <p>This 50-year-old Caucasian male was transferred from the psychiatry division to the surgical ward
  of Bicêtre Hospital in Paris on 11 April 1861. I performed a thorough physical examination upon his
  admission. The presenting diagnosis is diffuse gangrenous inflammation and infiltration of connective
  tissue of the entire lower right extremity, extending from the instep upward to the buttock. The patient
  shows complete paralysis of his right-side limbs. The left limbs are mobile with adequate control and
  power. Both bowel and bladder control are intact. The eyes are equally focused and reactive to light,
  although the vision in the left eye has deteriorated more than in the right eye. The patient exhibits
  difficulty in swallowing food, but the tongue is not paralyzed, and voice is normal.</p>

  <p>Introduction. Broca first orients readers to the details of the case study: the participant, Leborgne,
  and how Leborgne came to be under his care.</p>

  <p>Background and Context. Broca gives a detailed description of the case study participant. He notes
  physical details of Leborgne’s paralysis so that readers understand that Leborgne retains control over
  his voice and tongue. This knowledge allows Broca to eliminate paralysis as a cause of the subject’s
  inability to use language.</p>

  <p>The patient is completely unable to form words other than the single syllable tan, which he most
  often repeats twice in rapid succession: “tan-tan.” This is said in varying tones and inflections. Paralysis
  of the patient’s dominant arm prevents writing. Nevertheless, the patient can communicate to a surprising
  extent through facial expressions and gestures with his left hand. His intellect appears normal, and
  he shows no signs of head trauma.</p>

  <p>Research Question. In this paragraph, Broca further describes his participant and begins to bring
  the case study into focus. The details he provides about Leborgne’s ability to communicate and use language
  will be the focus of the study. Broca observes that Leborgne can communicate nonverbally, and no physical
  signs indicate that his brain may be affected. Broca wants to understand why Leborgne communicates as
  he does.</p>

  <h3>Patient History</h3>

  <p>Personal History. My personal interviews with family members revealed that Louis Victor Leborgne
  was born 21 July 1809, in Moret-sur-Loing. The town has many tanneries, a fact that may account for
  his use of the syllable tan. His father is an elementary school teacher. The patient is one of six siblings.
  His previous occupation was formier [artisan who made forms for shoemakers]. He is unmarried and has
  no children. Members of his immediate family visit but have been unable to provide care for him at home,
  resulting in an extended hospital stay of 21 years. Interviews with other patients in the ward have
  indicated that the patient is unfavorably viewed as egotistical and vindictive.</p>

  <p>Description of Research Methods. In this section, Broca notes that he interviewed Leborgne’s family
  and other patients in the hospital and provides a hypothesis as to why Leborgne uses the syllable tan
  to communicate.</p>

  <p>Organization. The author uses headings to organize the different sections of the case study. Main
  headings are centered; subheadings are left-justified.</p>

  <p>Medical History. My interviews with family members and hospital staff responsible for his care yielded
  only a cursory medical history. They did, however, reveal that the patient developed epilepsy in his
  childhood or youth; the exact age is unknown.</p>

  <p>At age 30, the patient lost the ability to speak but did not immediately seek medical attention.
  When the condition persisted, he came to Bicêtre Hospital and was admitted to the psychiatry division
  in 1840 (exact date not recorded).</p>

  <p>Limitations of Research. Broca again notes the use of personal interview data as a research method
  / primary source. He acknowledges the limitations of this method (“only a cursory medical history”)
  but was able to gather relevant details, such as when Leborgne developed epilepsy, when he lost the
  ability to speak, and when he was first admitted to the hospital.</p>

  <p>Approximately 10 years after the onset of his first symptoms, Leborgne experienced gradual weakness
  of his right arm, which developed into complete paralysis in that limb. This condition was followed
  by weakness in his right leg and foot. Apparently, it took four years from the start of the paralysis
  of his right arm until the patient completely lost the ability to stand. In these years, his vision
  and mental faculties also deteriorated.</p>

  <p>The patient remains in bed, having refused to leave it for the past seven years. During this time,
  his clothing was changed once a week. The infrequent change of clothes caused a delay in discovering
  the extent of his gangrenous inflammation and infection. At this point, the patient could hardly move
  and was transferred to the surgical unit, where I first met him.</p>

  <p>Background and Context. More details of Leborgne’s medical history are given. Broca concludes the
  patient history by relating the circumstances leading to his treatment of Leborgne. This section provides
  a detailed account of everything known about the participant and his condition. Broca doesn’t rely only
  on records to gather this history, though. He interviews hospital staff to try to gather additional
  information not recorded.</p>

  <h3>Treatment</h3>

  <p>The gangrene being too extensive for surgery, I confined myself to testing his mental faculties and
  language comprehension. By using his fingers, the patient was able to respond accurately to mathematical
  questions. He understood and responded to verbal questions as well. At times, his answers were incorrect,
  such as claiming to have children; I attribute these lapses to sepsis, which by now was far advanced.</p>

  <p>Research Methods. In this section, Broca begins to relate how he observed Leborgne’s ability to communicate.</p>

  <p>Analysis of Results. Broca tries to explain the reason for Leborgne’s incorrect responses.</p>

  <p>Lacking any physical irregularities that would cause his loss of speech, I conclude the condition
  must be related to brain function. This condition is so singular that it seems useful to assign it a
  special name. I will designate it, therefore, as aphemia, or loss of speech.</p>

  <p>The patient expired on 17 April 1861 at 11:00 a.m. Cause of death was gangrenous infection and sepsis.</p>

  <p>Broad Theory. Broca poses a theory about Leborgne’s limited ability to communicate: “the condition
  must be related to brain function.” This theory will be tested later in the case study and, if correct,
  might be applicable to how the brain works for everyone.</p>

  <h3>Autopsy Findings</h3>

  <p>I performed an autopsy 24 hours postmortem and found a number of irregularities in the patient’s
  brain. A softened area over the perisylvian region contained a cavity the size of a chicken’s egg, filled
  with serous fluid. Volume loss affected the gyri, subcortical perisylvian area, insula, and part of
  the striate nucleus. I weighed the brain and discovered it to be lighter than normal. I attribute the
  low weight to the loss of volume in the left cerebral hemisphere.</p>

  <p>I observed a significant malformation on the left frontal lobe, which I believe to be the source
  of the patient’s aphemia and, therefore, the brain location controlling speech production. Wishing to
  preserve the brain, I performed a surface examination only, without a full dissection. I have placed
  the preserved brain at the Musée Dupuytren in Paris.</p>

  <p>Research Methods. Broca provides details of the autopsy and describes the abnormalities he found
  in Leborgne’s brain. These details are crucial to the study because of Broca’s earlier comment about
  Leborgne’s inability to communicate resulting from brain function.</p>

  <p>Analysis of Results. Broca further hones his theories based on his observations of Leborgne’s brain.
  Broca hypothesizes that this malformation is the cause of Leborgne’s condition and, therefore, is located
  in the part of the brain that is related to speech.</p>

  <h3>Discussion</h3>

  <p>I presented Leborgne’s case at the meeting of the Société d’Anthropologie de Paris on 18 April 1861,
  where it generated considerable controversy. My former teacher Jean-Baptiste Bouillaud had previously
  advanced the idea that the language function is localized in the frontal lobes, with which, based on
  my autopsy of Leborgne’s brain, I concur. Anatomist Louis Pierre Gratiolet opposed the idea that there
  could exist a specific area responsible for speech, arguing that the brain functions as a whole. Esteemed
  physician Ernest Auburtin asserted that specific areas of the brain have specific functions and further
  stated that motor articulation is not directly relevant to the ability to conceive words and ideas.
  Advancing Knowledge. Broca uses his case study to contribute to the research on brain functions. Limitations
  of the Research. Broca notes that not all attending the meeting are in agreement, suggesting that further
  research is needed to learn more about the brain and whether specific parts control specific functions.</p>

  <h3>Conclusion</h3>

  <p>Given my patient Leborgne’s success at responding to verbal and mathematical questions despite his
  loss of speech, I am convinced that brain function is localized. Auburtin’s theory of more compartmentalized
  specificity is intriguing, and I intend to pursue this idea. Leborgne’s preserved brain remains at the
  Musée Dupuytren, where it is available for further study. What’s Next. Inviting additional research,
  Broca calls on his audience to research localized brain function. He notes that Leborgne’s brain is
  available for researchers to observe.</p>

  <h3>References</h3>

  <p>Domanski, C. W. (2013). Mysterious “Monsieur Leborgne”: The mystery of the famous patient in the
  history of neuropsychology is explained. Journal of the History of the Neurosciences, 22(1), 47–52.
  https://www.tandfonline.com/doi/abs/10.1080/0964704X.2012.667528</p>

  <p>Konnikova, M. (2013, February 8). The man who couldn’t speak and how he revolutionized psychology.
  Scientific American. https://blogs.scientificamerican.com/literally-psyched/the-man-who-couldnt-speakand-how-herevolutionized-psychology/</p>

  <p>Mohammed, N., Narayan, V., Patra, D. P., &amp; Nanda, A. (2018). Louis Victor Leborgne (“Tan”). World
  Neurosurgery, 114, 121–125. https://doi.org/10.1016/j.wneu.2018.02.021</p>

  <p>Ruane, M. (2013, July). Discovering the identity of a 150-year-old patient. Smithsonian. https://www.smithsonianmag.com/history/discovering-the-identity-of-a-150-year-old-patient-4563869/</p>

  <p>Discussion Questions</p>

  <p>1. What methods does Broca use in his case study? 2. What are Broca’s field observations? 3. What
  types of evidence does Broca gather for his case study? 4. How does Broca analyze his data? What conclusion
  does he reach? 5. If Leborgne had lived longer, what are some ways Broca could have expanded his study
  on his patient’s use of language?</p>

  <h3>Language and Expression</h3>

  <p>One significant finding of Broca’s case study was that Leborgne grew up in the town of Moret-sur-Loing.
  The town had many tanneries, leading Broca to theorize that Leborgne’s use of the syllable tan was related
  to his home. Why is this theory important? It illustrates how personal history affects people. It is
  possible that Leborgne used language in this way because of his history and cultural association with
  his hometown. Culture and identity have a big impact on how people use language, even among people who
  speak the same language.</p>

  <p>15.5 Writing Process: Thinking Critically About How People and Language Interact</p>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Identify and implement genre conventions of case studies for structure, paragraphing, voice,
  and mechanics.</li><li>Articulate how genre conventions are shaped by purpose, culture, and expectation.
  • Participate successfully in the collaborative and social aspects of writing processes. • Give and
  act on productive feedback to works in progress. Having learned about case studies and how they help
  advance research and knowledge, you are ready to do an informal one of your own. You will conduct an
  informal case study profile by selecting a topic to research, observing a setting and a participant
  (or participants), and using specified research methods. If applicable, see The Research Process: How
  to Create Sources for more information about selecting a research topic. You will then analyze the results
  of your study to determine its significance. As indicated in Tracing a Broad Issue in the Individual,
  many universities and professional organizations will provide guidance on how to adhere to ethical standards
  when conducting a case study. Your instructor will be your best resource for answers to questions you
  have about your college’s policies on conducting research and whether and how they apply to the research
  you intend to do. Remember, however, that for any research you do involving human subjects, you must
  obtain participants’ written permission to be included in your study.</li></ul>

  <h3>Summary of Assignment</h3>

  <p>Conduct an informal case study of a classmate, friend, or family member to gain insight into the
  participant’s use of language, specifically the ways in which their culture(s) and language(s) interact.
  Try to find a willing participant who is either bilingual or fluent in, familiar with, or an occasional
  user of a language other than English. You can focus your case study on the ways in which your participant
  changes their language according to context, how their use of language is different when they interact
  with family and friends as opposed to in academic or professional contexts, or how using one language
  affects the other. Be sure to consult your instructor about the school’s policy on student participation
  in studies, and obtain written permission from the participant before you begin. If you do not know
  anyone who speaks another language, consider these topics:</p>

  <ul><li>Body language that accompanies linguistic communication • Language shifts according to medium
  (text, phone call, email, in person) • In-person vs. written communication • Comparison of language
  use between two participants from different cultures or age groups</li></ul>

  <p>After you decide on your topic, formulate a research question that asks precisely what you want to
  learn from your study. Next, you will need to plan your case study by drafting questions for interviews
  and conducting observations at determined times and places. Then, using the information you collect
  from your interviews and observations, you will offer an interpretation about the participant’s use
  of language that might be helpful to your college’s instructors and administrators. Present your findings
  in a report of around 1,000 to 1,200 words.</p>

  <p>Another Lens. Complete the same case study, and share your findings in a presentation that is 7 to
  10 minutes in length. See Scripting for the Public Forum: Writing to Speak for more information about
  scripting for a public forum. For this version of the assignment, record your interviews on video or
  use a voice recorder. Play clips of your interviews in your presentation to illustrate the participant’s
  use of language. Organize the presentation into clear, distinct sections with subtitles. Instead of
  long, dense paragraphs, use short bullet points to state your main points. Use visuals to communicate
  abstract ideas or data. Make sure your presentation flows logically and that you use appropriate transitions
  to maintain coherence. To indicate clear demarcations between sections, use headings and subheadings,
  as in the Annotated Sample Reading. In your presentation, include all of the typical sections of a written
  case study:</p>

  <ul><li>Background/Context. Give an overview of previous research on the topic. • Methods. Provide a
  detailed description of the methods you used to collect the data. Include a description of the participant
  and the observation environment. • Results. Provide the data collected: answers to interview or survey
  questions, your observations, and any other pertinent information. • Analysis. Interpret the data, and
  discuss any limitations of the case study.</li></ul>

  <p>See the resources below for some helpful presenting tips.</p>

  <ul><li>6 Tips to Calm Your Nerves before Speaking (https://openstax.org/r/6tips) • Like, Eliminate
  Ums and Ahs, Right? (https://openstax.org/r/eliminateums) • Do You Write the Way You Speak? (You Should!)
  (https://openstax.org/r/doyouwritetheway) • Do You Write the Way You Speak? (You Should!) Part 2 (https://openstax.org/r/doyouwritetheway2)</li></ul>

  <h3>Quick Launch: Research Question and Data Collection</h3>

  <p>Within your selected topic, begin to brainstorm possible research questions, keeping in mind the
  following characteristics:</p>

  <ul><li>Open Ended. A good research question has multiple possible answers, all equally plausible. Avoid
  a yes- or-no question or one with an obvious answer. • Debatable. The research question should spark
  reasonable debate around the best answer or solution. If you think you know the answer to the research
  question or if you doubt that people can be open-minded about a range of answers, it is not a good research
  question. • Answerable. You should be able to answer your research question by using the evidence you
  gather. You should be able to consult existing source material on the topic. • Consequential. The outcome
  of the debate around your research question should be of consequence. In other words, what you or others
  choose to do going forward should matter and affect others.</li></ul>

  <p>You probably will revise the wording of your research question quite a bit before it aligns with
  the characteristics listed. Spend time thinking about your research question, and revise it as necessary
  to prepare to conduct your case study. See Table 15.1 for examples of how to revise research questions
  in various fields of study.</p>

  <p>Topic Sports</p>

  <h3>Research Questions</h3>

  <p>Research question doesn’t meet basic requirements. It is a yesor-no question, of little consequence,
  easy to answer, or suggestive of the “right” answer.</p>

  <p>Research question is of some consequence and could have multiple answers but needs further revision
  to be open-ended, more specific, or more consequential.</p>

  <p>Research question is specific, open-ended, consequential, and suitable for a case study.</p>

  <p>Who are the best college athletes now?</p>

  <p>Should college athletes be paid?</p>

  <p>Is it fair to other students to pay college athletes?</p>

  <p>How do colleges benefit—or not—from paying student athletes?</p>

  <p>How do college athletes benefit—or not—from being paid?</p>

  <p>Finance</p>

  <p>Should you invest in stocks or bonds?</p>

  <p>Should the government regulate the economy?</p>

  <p>What was the GDP in the year 2016?</p>

  <p>What are some things the U.S. government does to protect the economy?</p>

  <p>How are individuals affected by government intervention in freemarket economies?</p>

  <p>Technology</p>

  <p>Are high-quality cell phones too expensive?</p>

  <p>Is Apple a monopoly?</p>

  <p>What will be the future of landlines?</p>

  <p>Why do some people continue to use landlines?</p>

  <p>How do people combine cell phone and landline use?</p>

  <p>Once you select a topic and research question, you can begin looking for background information.</p>

  <p>Data Collection Before starting your actual research, get a sense of the body of knowledge around
  your topic. Remember, case studies are about advancing research in a particular field. For a case study
  to effectively advance knowledge, it must show awareness of the research already done in the field.
  A literature review section, which includes previous research and background about the topic, is typically
  included in a case study. Browsing trade publications and academic journals can help you get a sense
  of existing research. Looking for articles frequently referred to in other articles is a good way to
  locate important research, as researchers typically cite significant studies. Look at important, groundbreaking
  research in addition to recently published work. The information you gather from existing literature
  may be either qualitative or quantitative. See The Research Process: Where to Look for Existing Sources
  for more information about conducting research.</p>

  <p>Drafting:</p>

  <p>After you have established your research question, you can begin your actual study. Start by planning
  how you will collect your primary source data. First, review the literature in the field if you have
  not yet done so. Next, draft questions to ask your case study participant. The strongest case studies
  provide a unique perspective that is applicable to your specific audience—in this case, students, teachers,
  and administrators at your college. Keep in mind that not every college is the same. Some colleges,
  such as “open admissions” community colleges, admit all who apply, whereas other colleges accept only
  5 percent or fewer of their applicants. Interview questions are likely to be different depending on
  the individual characteristics of your college. To learn more about your college and its student population,
  search for information on the college website. Look for sections that have titles such as “About Us,”
  “About Our Students,” “College Facts” / “Factbook,” and so on. Brainstorm a list of characteristics
  that make your college and its students unique. Figure 15.6 shows how a student at Midlands Technical
  College began data collection for a case study on language use.</p>

  <h3>Create Interview Questions</h3>

  <p>Using your research and brainstorming ideas, draft a series of 10 to 15 questions you plan to ask
  your case study participant. Remember that these questions should be open-ended (no yes-or-no questions)
  and give the participant an opportunity to speak freely and extemporaneously. There are no right or
  wrong answers. With these questions, keep your purpose in mind: to gather information that will be helpful
  to students, teachers, and administrators about how a student at Midlands (or another school) uses language.
  Here are some sample questions:</p>

  <ul><li>What are your hobbies, or what do you do for entertainment? (This question should elicit responses
  that provide insight into the student’s leisure activities and the groups they identify with.)</li><li>What
  new language uses did you have to develop when you became a college student? • If you have a job in
  addition to being a student, what are some ways you use language to do that job? • How do you communicate
  with friends and family? (Text messages? Apps such as Snapchat? Phone calls?) • Describe your style
  of text messaging. (Probe for details about situations and contexts.)</li></ul>

  <p>◦ When do you send long texts? ◦ How long do you usually wait for a response before sending a new
  message? ◦ How long do you usually wait before responding to a message? ◦ When do you use standard English?
  ◦ When and for what purposes do you use emoji?</p>

  <ul><li>How do you communicate using voice or video chat (Zoom, video games, iMessage, etc.)? • With
  whom do you communicate, and in what contexts? • How do you adjust your use of language in these situations?</li></ul>

  <p>Remember to use the brainstorming and research you did previously to draft appropriate questions
  for your case study participant. Also, try to find ways to encourage the participant to provide as many
  details as they can and to identify an appropriate setting in which you can observe them using language.</p>

  <p>Interview the person you have chosen to study. Record their responses on paper or on a digital voice
  recorder. If using a digital recorder, briefly note anything you want to review later in writing. If
  you find an opportunity to elicit further information or follow up, do so. You may find it helpful to
  print the bulleted list of questions and write the participant’s answers directly on the page.</p>

  <h3>Field Observation</h3>

  <p>The next step is to observe. If you haven’t already done so, decide on a setting in which to observe
  the participant. You might observe in person and/or use a messaging app or video chat to observe them
  using language at work, with their friends and family, or in some other setting. The setting should
  be one in which you can get a good idea of how the participant uses language naturally in that context.
  For example, you would not want to observe a student playing a video game if they aren’t a gamer. Here
  are some suggestions about what to note as you observe. Be sure to take detailed notes during your observation.
  Consider printing this page as well and writing observation notes on it. See The Research Process: How
  to Create Sources to learn more about field research.</p>

  <ul><li>What are some common words or phrases used? • In what ways does the participant replace or substitute
  certain words with emoji, slang, acronyms, and the like? • When does the participant’s voice indicate
  shifts in volume, tone, or vocabulary? If you are observing texts or writing, how does the participant
  communicate tone? • What specific words and phrases does the participant use? That is, what words and
  phrases might not be understood by you or others but are understood by the participant and the people
  with whom they are communicating?</li></ul>

  <p>Analysis of Data After collecting data, analyze your findings and write your report. First, look
  closely at the data you have collected, and decide what the information is telling you about how the
  participant uses language. You should have data gathered from both qualitative and quantitative research.
  If you need more of either one, interview or observe the participant again, or conduct more background
  research. Practice identifying qualitative and quantitative data. Access multimedia content (http://openstax.org/books/writing-guide/pages/15-5-writing-process-thinkingcritically-about-how-people-and-language-interact)
  Writing the Introduction: Background, Context, and Methods In the introduction, provide background and
  context for the case study. To begin, write a detailed description of the study you have conducted and
  what you sought to learn from it. Also include the details of your literature review and the methods
  you used to collect data (interviews, observations, and so on). The example below is an introduction
  to the Midlands Technical College student’s case study on how students use language: Background and
  Context</p>

  <p>Midlands Technical College is a two-year public college in Columbia, South Carolina. Over the course
  of two weeks, I observed two students to better understand their uses of language. A generational shift
  in the average college student population is occurring, with millennials graduating and making up less
  of the college student population. At the same time, Gen Z’s numbers on college campuses continue to
  grow. Studying how college students use language can provide valuable insights into how to communicate
  effectively with this population.</p>

  <p>Methods and Participant I gathered my data using three methods. In the first method, I researched
  literature about both Midlands Technical College’s student population and communication habits and attitudes
  among Gen Z students, and I looked into some case studies about the use of emoji. For the second method,
  I created a group chat consisting of me and two students enrolled in the same section of an introductory
  psychology course. We used this group chat to discuss the course, assignments, due dates, etc. For the
  third method, I created a survey of 10 questions asking the students to think about and reflect on how
  they use language at home versus at school. I then interviewed the students to record their answers.
  Using this data, I was able to analyze how students use language among their peers versus how they use
  language around their family.</p>

  <p>Body: Presentation of Data The next step in writing your case study is to present your data and analysis.
  How you set up your body paragraphs is up to you or your instructor. Like the sample study about Leborgne,
  most case studies are organized into sections and subsections, each devoted to an aspect of the study.
  You have already written an introduction in which you presented the scope of your study, the participant,
  the field of research, and other pertinent background information. Now you can continue by organizing
  each element that you studied into its own section, or you can choose another way of setting it up.
  For example, your overall structure might look like the structure in Table 15.2, using your own criteria
  and as many sections as you need. If you choose another structure, create a similar organizer to help
  you keep focused as you write.</p>

