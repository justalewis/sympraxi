  <p>Teacher Resources for Writing with Force and Flair by William T. FitzGerald</p>

  <p>Overview and Teaching Strategies</p>

  <p>This essay on the use of rhetorical figures is ideally taught as part of a general approach to writing,
  and writing in college contexts, as a means for exploring attitudes, expectations, and presumed restrictions
  that students (and, often, teachers) may bring to the composition classroom. It is intended to start
  conversation and spark interest in experimenting with the resources of stylistic figuration.</p>

  <p>Students will typically know a handful of rhetorical figures by name (alliteration, onomatopoeia)
  based on exposure to literary devices in previous English (literature) classes. But they are not likely
  to think of rhetorical figures as tools they can use in their writing. This chapter encourages exactly
  that, but unless students are given permission, encouragement even, from their instructor, they are
  unlikely to follow up on this invitation.</p>

  <p>A challenge in teaching this essay is anchoring it to exercises in language exploration and play,
  as suggested in the section “Go Figure” and below. A second challenge is supplementing a reading of
  the chapter together with further discussion and examples. Figurative language is everywhere, from puns
  and sound-based features of spoken and written prose to punctuation effects in digital environments.
  Indeed, there are likely new figures.</p>

  <p>A final challenge is one this author has wrestled with personally with his students. How much Greek
  and Roman nomenclature is too much? There is no question that learning a catalog of rhetorical figures
  is overwhelming and arguably beside the point of the essay. What’s more important is to teach patterns
  and options rather than assimilate a list of strange-sounding names. At the same time, it’s useful to
  recognize these established moves have names—and a long lineage. So long as students know they won’t
  be tested on their recall of specific figures, it’s useful to call the figures by their names when exploring
  their features and functions.</p>

  <h3>Questions</h3>

  <p>1. Which figures in this essay or elsewhere do you want to experiment with in your writing?</p>

  <p>2. What figures in writing by others do you admire and wish to emulate? After reading this essay,
  can you better recognize figurative devices, if not necessarily by name?</p>

  <p>3. What can you learn about writing as a craft from Erasmus’ exercise in copia? How could you push
  past 50, 100, or even 200 variations?</p>

  <p>4. What rhetorical figures are appropriate for academic writing? What rhetorical figures are inappropriate
  for academic writing? What borderline cases can you identify for particular figures?</p>

  <p>5. Now that you know a little more about rhetorical figures, can you identify any that seem to you
  to be part of your stylistic tool kit in your everyday writing, perhaps on social media?</p>

  <h3>Activities</h3>

  <p>This essay ends with brief descriptions of four exercises that have been part of courses I have taught
  on style or figures of speech in particular: compiling a figure journal, analyzing texts, imitating
  passages, practicing copia. It’s probably not prudent to include all of these exercises in a single
  semester of first year writing. One or two, carefully scaffolded and sustained, seems a productive sidebar
  addition to a first year writing course. Those identified here are intended as models to be adapted
  to local situations. This essay and related exercises should be introduced early in a semester, around
  the time of a first paper draft or revision.</p>

  <p>Hands-on attention to style and figuration meets students as readers and writers in unexpected ways
  to boost awareness of rhetorical aspects of writing. Rather than see prose as a neutral vehicle for
  expressing ideas, students can learn to notice elements of design and infer intended effects. Such insights
  can thus transfer to their own writing. But do not expect an immediate impact on the writing that students
  do. Confidence in employing figures does not come easily.</p>

  <p>A final activity, then, is to encourage students to experiment with rhetorical figures in their own
  papers. Students might be asked, per the questions above, if there are particular figures they would
  want to use in a future writing project. They might also be asked to identify a handful of figures they
  find themselves using, whether by design or fortuitously.</p>'
