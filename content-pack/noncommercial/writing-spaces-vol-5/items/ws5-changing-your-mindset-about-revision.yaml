  <p>Teacher Resources for “Changing Your Mindset About Revision”</p>

  <h3>Overview and Teaching Strategies</h3>

  <p>In my syllabus statement of my objectives for Freshman Composition I, I make this statement: “Our
  most devoted effort will go into supporting substantive revision, for it is during revision that new
  learning is most likely to occur and your competence to develop.” I’ve found that I have to do a lot
  of work, though, to get students to engage in “deep revision” of what are commonly called global concerns.
  In my own study of student revisions and surveying student beliefs about revision, most of my students
  see revision as a matter of tidying up the one draft they have composed. They mistake editing as revision.
  I’m not alone in this observation because one of the most frequent findings from research into revision
  is that new college writers mostly make only surface changes when they revise.</p>

  <p>The goal of this essay is to help you teach your students what revision really involves. As Richard
  Beach found in an early study on revision, the most significant thing we can do as teachers to help
  our students become better revisers is to work on their mental model—their concept—of what revision
  is and involves. Luckily, today we have developed the frameworks of “threshold concepts” and “transfer
  concepts” to help us communicate and teach writing, and this essay is particularly designed to tie into
  a curriculum designed around these concepts.</p>

  <p>I have a few suggestions for how this essay might fit successfully into your course.</p>

  <ul><li>The first one is that you engage your students in a multi-draft writing process which includes
  peer response (and even reflection) between drafts. Ideally, this includes three drafts to break the
  pattern of a two-draft sequence which shortcuts the opportunities for writing growth through revision.</li><li>You
  might also make revision a topic of discussion early in the semester as your review the writing process
  with your students. Ask them to write their definitions of “revision,” “editing,” and “proofreading.”
  If your students are like mine, only a few will see any difference between revision and editing. As
  you review their answers with them, work on establishing clear definitions and distinctions between
  these activities of the writing process.</li><li>After the final draft of your students’ first essay,
  ask them to do a post-draft reflection where they write a process narrative telling the story of their
  work on the essay and how the text grew and changed. Students struggle grasping what to do for this
  kind of meta-cognitive task, so I urge you to take time to explain the task, provide prompts, and even
  provide models to help them. Then have students share their stories of the writing process where the
  theme of revision can be highlighted.</li><li>I recommend that you ask students to read this Writing
  Spaces essay as they begin to revise for the second draft of Essay #1. You might use one or more of
  the discussion questions included after the chapter (and below) as a homework or in-class journal response
  to the reading. Then, as your students begin to review their draft and formulate plans for revision,
  ask them the key questions from the essay: Is what I’ve written really what I mean? Is what I mean what
  I’ve really written?</li><li>Alternatively, you could ask students to read the essay later in the essay
  as they are asked to revise a previously graded essay or for a final portfolio where revised essays
  are submitted.</li></ul>

  <p>The bulk of the work of fleshing out the model and practices of revision will be up to you. This
  essay seeks only to re-set students’ mental model and mindset regarding revision. Hopefully, it provides
  a new framework for your students to begin engaging in productive and substantial revision beyond tidying
  up errors.</p>

  <p>Other resources: There are so many good resources about revision and teaching revision, but I want
  to highlight some other ones I have created for my classes found at “The Write Place: Guides for Writing
  and Grammar” https://www.lirvin.net/WGuides/default.htm. The guides on the writing process, drafting,
  and revision may be particularly relevant as complementary resources to this essay.</p>

  <h3>Discussion Questions</h3>

  <p>1. Write about some everyday non-school writing that you have done in the last week (like text messages,
  emails, social media posts or any writing). How much revision do you do on these pieces of writing.
  Why? Describe the kinds of changes you made?</p>

  <p>2. What has been your approach to revising essays in school previous to this class? Describe what
  you have done in the past to “revise.” Talk about one instance of revising following your method.</p>

  <p>3. What have been your greatest challenges when you have been asked to revise a draft? Talk about
  a past experience before this class and a more current experience from revising a draft in this class.</p>

  <p>4. Why should your first draft of a college essay never be your last draft (even if you tidy it up)?</p>

  <p>5. How is this concept of writing as an inquiry process founded upon revision different and foreign
  to what you have thought before?</p>

  <p>6. How does this essay help you understand what you have been learning about writing and revision
  so far in this class? How do you think it will affect how you will go about revision in the future?</p>'
