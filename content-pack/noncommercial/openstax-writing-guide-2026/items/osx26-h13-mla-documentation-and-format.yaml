  <h3>MLA Paper Format</h3>

  <p>Follow your instructor’s formatting guidelines or those indicated here. For sample papers with MLA
  format and works-cited pages, visit this site (https://openstax.org/r/this-site1).</p>

  <ul><li>Margins. Use one-inch margins on all sides. • Spacing. Double-space throughout the paper, including
  the works-cited page. • Paragraph format. Indent paragraphs one-half inch. • Page numbers. Start numbering
  on the first page of your paper and continue to the end of the works-cited page. Place page numbers
  in the upper-right corner, and add your last name before the page number: “Coleman 3.”</li><li>Identifying
  information. Put your name, your instructor’s name, the course title, and the date in the left corner
  of the first page of the body of the paper, not in the header. Double-space this information.</li><li>Title.
  Center the title on the first page. Do not use italics, boldface, all capitals, or quotation marks.
  Do not add extra space below the title.</li><li>Long quotations and quotations from poetry. See Quotations
  for how to cite long quotations and poetry quotations.</li></ul>'
