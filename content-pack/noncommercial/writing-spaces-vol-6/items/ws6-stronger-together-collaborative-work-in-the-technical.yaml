body: '<p>Collaborative Work in the</p>

  <p>Technical Writing Classroom</p>

  <p>Laurence José</p>

  <p>Group work is hard.1 It requires careful planning, negotiation, and trust. Most of us, as students
  and teachers, have been in a situation when we were assigned a collaborative project and thought how
  easier it would be to do it alone. Collaborative writing projects are no different. Before even considering
  questions related to work distribution and fairness, it is very tempting to think of writing as a solitary
  act that a group setting slows down and makes more difficult. What we often forget though is that collaboration
  can be an asset by giving us more ideas to draw from to generate and shape the content for the audience.
  It also gives us opportunities to participate in bigger projects that could not be completed by one
  person alone and it helps to emulate workplace writing experiences. Collaborative writing is indeed
  a key component of many professions and a core competency in technical writing. Learning how to do it
  well does not just make for higher quality class projects, it can also offer space for students to work
  with clients and, consequently, become a line on a résumé to transition into post-academic contexts.</p>

  <p>College classes often involve some level of collaborative work. Technical writing courses are no
  different. In fact, collaboration has long been identified as one of the key components of technical
  and professional writing courses (Allen and Benninghoff). Yet, many of us have experienced times of
  anxiety and even dread when we mark the days on the class calendar that precede the start of the group
  project. From communication issues to fear of unequal workload distribution or scheduling difficulties,
  let’s be honest, there are many reasons for being leery about group work.</p>

  <p>Because we tend to think of writing as a solitary act, collaborating on writing projects may seem
  even more complicated. How can one create</p>

