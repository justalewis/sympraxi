  St. Martin’s, 2007, pp. 363-76. Truss, Lynne. Eats, Shoots &amp; Leaves: A Zero Tolerance Approach to
  Punctuation. Gotham Books, 2003.</p>

  <p>Teacher Resources for Punctuation’s Rhetorical Effects by Kevin Cassell</p>

  <p>Overview and Teaching Strategies</p>

  <p>Punctuation, along with grammar, has long been conceived of in Composition and Writing Studies as
  a Lower Order Concern. It is not unusual for college and university students to complete two semesters
  of first year writing without attending to punctuation in any meaningful way. Primarily this oversight
  – if it can be called that – is a result of the disciplinary privileging of process over product. We
  all know that knowledge of how to use semicolons and commas effectively is negligible if a writer doesn’t
  have something worth punctuating in the first place. Hence we spend what precious little class time
  we have with our students focusing on Higher Order Concerns: developing a thesis or claim, writing with
  a central purpose for a target audience, organizing ideas and information, drafting and revising. We
  know that punctuation matters – after all, when we ourselves write essays and reports and emails and
  syllabi, we’re generally pretty meticulous about how we use it. But as teachers, we don’t have the time
  to cover the exhaustive number of standard usage expectations, the “rules” governing punctuation, that
  we’ve learned over time. That’s why so many of us supplement our primary textbooks with writing handbooks
  (or link to online sites like Purdue Owl), which more often than not are used as a “reference” for students
  to consult on their own, usually during the editing stage of final drafts.</p>

  <p>This essay offers an approach to punctuation that is not based on “rules.” It doesn’t tell students
  how to use punctuation correctly. Instead, it encourages them to become explicitly aware of punctuation
  as they read by seeing and hearing it, and ultimately understanding how it’s employed for what purposes.
  Standard usage expectations or “rules” are just one way of learning punctuation; reading with an awareness
  of how those marks (, : “ ? ; b ‘ i – ) operate in standard written English across multiple genres is
  a significant first step to learning punctuation – and many of us, I think, have learned usage in this
  manner. Yes, we need to know certain usage rules, but these can often be discerned (and sometimes implicitly
  learned) from reading with an awareness of punctuation as a textual feature that shapes phrases, sentences,
  and paragraphs. Writing handbooks, online tutorials and guides are not the only way for students to
  become familiar with punctuation usage.</p>

  <p>I introduce punctuation in my FYW courses early in the semester. I don’t discuss it solely in terms
  of editing and proofreading final drafts for the sake of correctness. Instead, I point out that it is
  a material and rhetorical element in the texts they read and plays a role in their reception of those
  texts. As shown in my essay, I distinguish between punctuation usage that is “required” (apostrophes
  to show contractions or possession, question marks for questions, periods to end sentences) and usage
  that is more flexible and oftentimes rhetorical (parentheses or em dashes, italics or bold, ellipses).
  I introduce students to the strategy of explicit reading, which I associate in my chapter, following
  Charles Moran and Mike Bunn, with “reading like a writer” (RLW). I bring up punctuation throughout the
  course, when appropriate, and often in relation to Higher Order Concerns like purpose, context, and
  especially audience. For example, when reading an essay – like a Writing Spaces chapter – I’ll ask students
  to choose a particular paragraph where the author makes a salient point or just says something memorable.
  After discussing that point in relation to the essay’s purpose, I’ll ask them to consider how that point
  or memorable statement is conveyed. This leads inevitably to the text of that paragraph and the sentences,
  words, and – yes – punctuation marks that compose it. Sometimes that punctuation supports an “aural”
  representation of an author’s voice (like my use of two em dashes around the word “yes” in the previous
  sentence), which provides an occasion to consider how audience awareness informs certain choices the
  author makes during the writing process that are sometimes supported punctuationally.</p>

  <p>I have emphasized multimodal reading strategies – reading as “seeing” and “hearing” especially –
  for some years now. (I don’t use the term multimodal in my chapter; I use the more common term “sensory.”)
  I believe that this style of reading, because it makes students conscious of how language functions
  as writing, helps them develop as writers. While I don’t eschew “rules,” “guidelines,” and “best practices,”
  I believe that one of the best ways to learn how to write is to read with an awareness of writing –
  to read like a writer. With the exception of some text messages perhaps, punctuation is something we
  encounter every time we read across all genres. Because we tend to read for information and ideas, however,
  punctuation tends to slip out of sight. The 20th century thinker Theodor Adorno called punctuation “inconspicuous.”
  What I try to do is have it visually and aurally register with the eyes and ears of readers so that
  it is less inconspicuous. I believe that being mindful of, first, the material existence of punctuation
  in writing, and second, of its effective employment will help students use it with confidence and facility
  in their own writing.</p>

  <h3>Activities</h3>

  <p>1. Have students choose one punctuation mark that they feel they don’t know as well as they’d like
  to. Have students go online or look in their writing handbook at how this mark is used, then share that
  usage skill with others.</p>

  <p>2. Have students pair up. Working separately, ask them to find a short paragraph from an essay, article,
  or book that has a variety of punctuation marks in it. Have them write that paragraph down on a piece
  of paper, taking out all of the punctuation marks. Student pairs should exchange paragraphs and be instructed
  to punctuate their partner’s paragraph. Ask students to compare the original with their punctuated paragraph,
  seeing how close both students came to the original, and have students discuss why they chose some of
  the marks they did.</p>'
