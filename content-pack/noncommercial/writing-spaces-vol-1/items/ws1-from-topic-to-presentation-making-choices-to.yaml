  <p>Returning full circle to Nadya Suleman’s octuplets, it seems possible to predict the some of the
  ramifications for the children—both the octuplets and the six youngsters born previously. In the past,
  she has subsisted with disability payments for a job‐related injury and she currently receives $490
  per month in food stamps and federal disability assistance for three of her first six children (“Octuplets’
  Mom,” 2009); yet, Suleman has said that she refuses welfare money to support herself and her children
  (Celizic, 2009). Asked how she will afford the children with no job and no other adult family member
  to help her pay her bills, she claims: “I know I’ll be able to afford them when I’m done with my schooling”
  (Celizic, 2009). Shortly after the birth, she retained a publicist, who offered her services pro‐bono
  and mentioned that Suleman is looking at seven‐figure offers for her “story,” as well as offers for
  photographs, interviews, books, and other commercial enterprises (Celizic, 2009; Rochman, 2009). If
  she were to get them, those offers would come in handy. Her hospital delivery bill for eight premies
  alone may cost upwards of one million dollars; forty six physicians and staff attended the births (“Grandma,”
  2009). Further, she will need to feed, diaper, clothe, and provide appropriate medical care for children
  who likely will have significant medical conditions. Additionally, it is important not to forget the
  six children that she has at home; each of them has similar needs. While such offers of commercial assistance
  have not yet been revealed (perhaps because of recent negative press surrounding Suleman’s situation),
  Suleman has set up a website where she will accept donations payable by PayPal, MasterCard, Visa, and
  other credit card options (“Welcome to,” 2009). Undoubtedly, Hence, while Suleman will need both commercial
  those offers and private donations, they represent the kind of exploitation suffered by the Dionne and
  Gosselin children.</p>

  <p>Beyond those physical needs are emotional ones, as well. The Suleman children are not likely to be
  met by a mother with sufficient time to spend. She recently proudly stated that “she holds each child
  45 minutes a day”</p>

