  license, visit http://creativecommons. org/licenses/by-nc-nd/4.0/, email info@creativecommons.org, or
  send a letter to Creative Commons, PO Box 1866, Mountain View, CA 94042, USA. To view the Writing Spaces
  Terms of Use, visit http://writingspaces.org/terms-of-use.</p>

  <p>room.” This means identifying the values and circumstances that shape the new social context so we
  can communicate confidently and appropriately. But, as we know, what it means to speak or write “appropriately”
  is not the same in all social contexts. While it may seem like a stretch to compare the task of writing
  a lab report and that of writing a text message, each context equally requires us to examine what counts
  as “appropriate.” This chapter offers you tools and examples that should help you examine and respond
  to the social circumstances that characterize unfamiliar contexts in your own life.</p>

  <p>To help guide the process of “reading” whatever “room” you may find yourself in, we will begin with
  a discussion of an important concept: the discourse community. We will use the social media platform
  TikTok as an example as we explore the various criteria that define a discourse community. We will then
  move on to offer two narrative-based examples of how college students have navigated the social challenges
  involved with becoming productive members of new-to-them scientific discourse communities. Kelly Xu
  will detail her experiences as a biology student interning at a cancer research institution, and Matthew
  Chen will discuss his experiences of being a mechanical engineering student doing research in an ecology
  laboratory. We juxtapose these scientific examples with the TikTok example because we want you, the
  reader, to understand that academic communication practices are structured in ways that are actually
  quite similar to the more familiar communication practices you use on a daily basis.</p>

  <h3>The Discourse Community</h3>

  <p>Being new to “the room” is an inevitable experience. This happens whenever we start a new class or
  accept a new job. We have to learn the language and expectations required to succeed in the new situation.
  The discourse community concept will help you examine, understand, and thus succeed in those new situations.
  The linguist John Swales first developed a list of criteria for defining discourse communities in his
  book Genre Analysis (1990). In a more recent (2017) article, he revised these criteria because he wanted
  to account for the changing nature of communication in our contemporary world. In the following list,
  we are paraphrasing an article published in the journal Composition Forum, where Swales suggests that
  discourse communities are defined by the following eight criteria:</p>

  <p>1. broadly agreed upon sets of goals</p>

  <p>2. ways of communicating within the group</p>

  <p>3. member participation that provides information, feedback, and initiates action</p>

  <p>4. the use of specific formats (genres) for communicating within the group</p>

  <p>5. the use of specific vocabulary (lexis) for communicating within the group</p>

  <p>6. a core group of experienced members</p>

  <p>7. the sense that certain things can be left unsaid</p>

  <p>8. horizons of expectation</p>

  <p>In the next section, we will have a closer look at each of these criteria.</p>

  <p>How Can These Criteria be Used to Understand TikTok?</p>

  <p>At the time of this writing, TikTok is consistently in the news for its role in circulating conspiracy
  theories and cultivating extremism (Ovide; Clayton). The community is receiving increasing amounts of
  attention, and, with the mobile app having been downloaded more than 2 billion times, it offers a timely
  case study: can TikTok “tick” all the boxes in Swales’ list (Brown; Leskin)?</p>

  <p>First, Swales suggests that a discourse community is defined by a broadly agreed upon set of goals.
  Can we say this is true of the TikTok community as a whole? Probably not. Like most others of its kind,
  this platform is made up of distinctive interest communities (more on this in a moment). Such divisions
  make it hard to say that the community is defined by shared goals. For example, it is difficult to claim
  that the dancer Charli D’Amelio shares the same goals as the people behind the far-right extremist accounts.
  It is similarly difficult to claim that #cottagecore creators like @speckledhijabi or users posting
  to #blacklivesmatter share the same goals as content creators who are cancelled for their use of racist
  slurs (Jennings). Within this vast social landscape, the only agreed upon goals are very, very broad:
  producing, circulating, and accessing new and quickly consumable content. As we know, that could mean
  nearly anything.</p>

  <p>What about ways of communicating and participating within the community? Here is where we move onto
  firmer ground. All social media platforms offer methods for group communication and participation. From
  rotating trends to “likes” and hashtags, TikTok seems to tick boxes two and three on Swales’ list.</p>

  <p>How about specific formats and vocabulary? Tick, tick. TikTok is defined by short video content sharing.
  Creators can loop or otherwise string together shorter clips to circulate “larger” videos that are up
  to 60 seconds long. In this way, TikTok builds on the short video format, or genre, that was a staple
  of its predecessor Musical.ly. Of course, this genre has also been popularized by Vine’s 6 second videos
  (R.I.P.), and we can also see short form video content sharing in other places, like 15-second Instagram
  Reels.</p>

  <p>Now, does TikTok have a core group of experienced members? Well, yes and no. We cannot answer this
  question without circling back to our discussion of the first criterion. Recall, we had trouble saying
  that the TikTok community, as a whole, shares any specific goals. Building on this, we can say that
  there are experienced or core members, but that they are clustered across different “pockets” of the
  community. These clusters can be mapped across one important divide: Alt TikTok vs. Straight TikTok.
  Within these very large categories, content is characterized by wildly different goals and values. So,
  while there are core members within “sub-communities” across, for example, Alt TikTok, individual users
  also retain the freedom to shape genres and vocabulary in individualistic and grassroots ways (Sung).</p>

  <p>Swales’s seventh criterion relates to the fact that, within a given community, certain things can
  be left unsaid. Drawing on the work of the linguist Alton Becker, Swales calls this “silential relations.”
  To understand this concept, we could think about the building abbreviations and program acronyms that
  are used on our respective campuses. For example, as members of our own campus-based discourse community,
  we, the writers, know exactly what “COMM+D” means, so we don’t need to spell out the Center for Global
  Communication and Design. We’re sure there are similar acronyms and abbreviations that define your campus
  community. We could also think about “silential relations” in terms of slang. From platform-wide slang
  like “story time” and “duet” to the slang that characterizes TikTok’s niche communities, this box is
  ticked.</p>

  <p>The final criterion relates to something Swales calls a “horizon of expectation.” As he puts it,
  a discourse community “develops horizons of expectation, defined rhythms of activity, a sense of its
  history, and value systems for what is good and less good work” (Swales, “Concept”). There are a lot
  of considerations bundled here. Linking back to the idea that TikTok users generally aim to produce,
  circulate, and access new and quickly consumable content, we can see, once again, that the TikTok community
  as a whole is too large to be meaningfully examined in terms of some of these criteria. Numerous histories,
  value systems, and associated social expectations are observable across TikTok at any given moment.
  For example, at the time of this writing, the TikTok site indicates that videos categorized under #BLM
  have received a collective 12.3 billion views. On the other hand, TikTok also had to issue an apology
  in June 2020 over allegations of censoring this very hashtag (Harris). In other words, TikTok is comprised
  of a myriad of “rooms” that may need to be “read” quite differently.</p>

  <p>As a new(ish) member of a university community, you may be interested to know that, like TikTok,
  the academic community as a whole is also too large to be meaningfully examined as a singular discourse
  community. What counts as “good” writing or “successful” communication is going to vary widely across
  the classes you take in different disciplines. This is because disciplinary goals, genres, languages,
  and expectations all vary. We must always read the room and respond accordingly. Now that we’ve explored
  how the discourse community criteria can (and cannot) help us understand TikTok, Kelly Xu and Matthew
  Chen will apply the same ideas in their stories of learning social norms and gaining authority as new
  members of scientific discourse communities.</p>

  <p>The Lab Experience: Free Trial vs. Full Membership (Kelly)</p>

  <p>After interning at a medical oncology lab for two summers, I have experienced being a member, an
  outsider, and everything in between. In what follows, I will reflect on these experiences using the
  discourse community framework. As you likely know from your own experiences, the conceptual boundaries
  of any community are most evident to anyone who is new. Simply not understanding the tacit rules, structure,
  and lexis of a community can make one feel ostracized as an outsider to the “in group.” In the case
  I’m about to describe, I entered the lab community as an intern who had minor publications and one year
  of undergraduate education under my belt. I was certainly under-qualified, and I felt daunted before
  I even stepped foot in the lab.</p>

  <p>In lab settings, educational qualifications underlie all power structures. In other settings, positions
  may be malleable and accommodating based on pertinent experience, but in the lab, power is clearly defined
  by education and publication status. The Principal Investigator holds the most authority, followed by
  MD/PhDs and post-doctoral students, then doctoral students, followed by lab technicians, and finally
  undergraduate interns. We will also see how this same type of hierarchy structures other lab contexts
  in the next section, but for now, we should keep in mind: no amount of seniority as an undergraduate
  can ever allow for a “promotion” to the level of a PI.</p>

  <p>Upon receiving my internship offer, I felt like I was infiltrating the company, rather than earning
  my position. Although I owned a company ID and looked like any other lab member, there were clearly
  invisible borders that I needed to breach to become an integrated member of the community. I was a long
  way from understanding the means of participating and communicating that were seemingly obvious to core
  members of the community. For example, even menial tasks like picking up mice revealed the fact that
  I was still an outsider. My mentor often said that mice perceive their handler’s emotions and react
  correspondingly. While she confidently grabbed the base of their tails with ease and they would immediately
  stop squirming, my hesitant grip allowed the mice to wriggle out with ease.</p>

  <p>Lab-specific lexis, or vocabulary, also proved to have a learning curve. I was fascinated by the
  secret language of abbreviations and terminology that researchers commanded so fluently. I took fastidious
  notes on the aliases we used for reagents, the tiny modifications made to procedures, etc. But I found
  that even self-proclaimed mastery of the genres and lexis of this community were insufficient for me
  to establish a place in the lab. Though I rehearsed the words I heard my colleagues use so expertly,
  they felt ill-fitting and improper when I used them in practice, akin to a child wearing an oversized
  suit. More precisely, I didn’t (yet) feel I had the right to use such mature terminology because I still
  had so little experience. I now realize that the attribute I lacked and yearned for so distinctly was
  authority. Since gaining authority is a multi-faceted task, I want to discuss two components of this
  process: autonomy and reputation.</p>

  <h3>Autonomy</h3>

  <p>From where I sit now, I see my first summer interning as a “training period” wherein I lacked the
  agency to plan my own schedule or act without supervision. To put it in Swales’ terms, I could not yet
  participate independently or initiate my own action. While my days were rigidly structured and scheduled
  by my mentor, I looked upon the independence of my lab peers with admiration. They were so familiar
  with the intervals of time they needed to complete aspects of their projects that they could come into
  work at any time and leave at their leisure. Whereas I was paid hourly and expected to work 9-5, their
  jobs seem so much more integrated into their lifestyles and tailored to their personal work ethic. Perhaps
  more importantly, they were confident enough in their skills to complete tasks within a time window
  they allotted themselves. Circling back to Swales’ criteria, it is clear that my peers were self-sufficient
  enough that they were able to recognize and participate in the rhythms of work that support overarching
  lab goals. Meanwhile, I was given a generous margin of error in everything I did, from booking lab machines
  times to pipetting reagents from a mastermix. I had to gain my own footing and learn to function as
  an individual before I could participate as a member of the community and contribute towards its goals.</p>

  <p>For an undergraduate with little formal lab training, there is only so much autonomy you can attain
  since most procedures must be learned under supervision. However, I would like to argue that I did make
  some progress towards attaining autonomy. At first, I repeatedly executed the same protocol under strict
  observation. After verifying that I could successfully replicate one protocol, I was invited to apply
  the same skills (e.g. pipetting or making a gel) to other protocols without supervision. I repeated
  this process until I was gradually trusted to learn new protocols entirely on my own. Though I still
  felt restricted by the structure of the lab hierarchy, I came to appreciate these small landmarks of
  independence as they reminded me of the progress I was making. The better I understood the goals, actions,
  and lexis of the community, the more my autonomy increased. Hence, personal growth and increased familiarity
  are the keys to establishing an autonomous position within any discourse community. Whereas my earliest
  days in the lab felt like a stressful lab practical, I felt like a valuable partner by the end.</p>

  <h3>Reputation</h3>

  <p>I was often scared of asking questions during the first year of my internship. Not only did I lack
  the confidence to ask a question, but I lacked the basic understanding needed to even form a question.
  At meetings, I would often stay quiet. This was out of fear that I would ask about something that had
  already been clearly explained or that I had misinterpreted a figure. Even during my second year, after
  having completed two rigorous 4000-level biology courses, I still found it challenging to interpret
  the specifics of my colleagues’ experiments. This, of course, was because I was still developing an
  understanding of my colleagues’ goals, and I was still in the process of mastering their genres. During
  the typical lab day, I felt like a nuisance asking what I thought were overly simplistic questions.
  In fact, I would ask questions in a “bottom-up” manner. I started with asking my undergraduate peers
  and then worked my way up the ladder if needed because I didn’t want to damage my reputation by annoying
  the higher-ups.</p>

  <p>In doing so, I was actually internalizing and taking action within the social structure of the lab.</p>

  <p>This social work eventually started to pay off. Another lab member actually consulted me for advice
  on executing an assay that I commonly performed. I was shocked and honored. This was a recognition of
  my proficiency and knowledge, and I was elated that, despite my position in the academic hierarchy,
  my work and reputation preceded me. I had established my colleague’s respect, which went a long way
  toward making me feel like I was establishing my own authority. Afterwards, I proudly listed “PCR” as
  a lab skill on my resume; I finally felt confident enough in my technique to claim that I specialized
  in it. I no longer felt like I was a child donning an ill-fitting lab coat, but began to believe in
  my own credibility. Thus, practice with the genres and lexis of the lab allowed me to gain confidence
  as a researcher.</p>

  <p>Finally, I took the ultimate test of trust and reputation: the dreaded lab meeting. Lab meetings
  are notoriously difficult because one is required to present their research progress to-date. In addition,
  rigorous follow-up questions test your knowledge of every detail of your project and (potentially) highlight
  every oversight. For example, it was insufficient for me to just know the names of the cell lines I
  was growing. I also needed to know why they were chosen and be able to discuss the levels of expression
  for multiple genes in each. To put it in Swales’ terms, the lab meeting is a demonstration of member
  participation: you provide information, receive feedback, and action is initiated. Though it was incredibly
  daunting, I was proud to work with my mentor to create the slides I would present as well as field questions
  from the audience. By being held to the same scrutiny and high standards as my peers, I really felt
  like I was no longer just an undergraduate intern but recognized as a true researcher.</p>

  <p>One of the most important ways to gain membership within a new discourse community is to cultivate
  your confidence and a sense of belonging. While this involves rather gradual changes in perception,
  it is something we can all take control of as individual communicators. Ultimately, though, becoming
  integrated into a discourse community is a more nuanced process than a simple list of criteria might
  indicate. Learning vocabulary and techniques is merely the beginning of fitting into a discourse community.
  This is true in the same way that reading a book can’t replace having the actual experience being described.
  However, the novice communicator can make the integration process less daunting by setting more attainable
  goals. We can proudly reflect on the landmarks we achieve. In my case, this meant presenting with my
  mentor during a lab meeting or pausing to feel gratified after a peer had asked me for advice. Upon
  concluding my two-year internship, I finally felt like I earned a place in my lab community. I have
  moved beyond the free trial into the highest level of membership I can afford for now.</p>

  <p>From Robots to Frog Guts: An Engineer in Ecologist’s Clothes (Matthew)</p>

  <p>Going into my second semester of college, I found myself wanting to do something apart from my regimented
  engineering classes, so I decided to join an ecology lab. My routine of experimenting with circuits
  and fixing up machines was no more. Instead, I was experimenting with snails and fixing lunch for frogs.
  Some may ask why I would do this. Through countless hours spent hiking, mountain biking, and camping,
  the environment has become significant to me. That said, I quickly realized the vast difference between
  my personal environmental interests and the ecological knowledge these researchers possessed. Similar
  to the situation described in the previous section, I had some work to do! In order to establish myself
  within this discourse community, I had to accomplish three main tasks: adapting to their way of communicating,
  understanding their professional motives, and building their trust. Progressively meeting these goals
  allowed me to integrate myself into the ecology community in increasingly meaningful ways.</p>

  <p>Throughout that first semester, I picked dead invertebrates from a slushy mixture of dirt and sand
  for eight hours a week. As we saw in the previous section, mundane tasks often serve as a foundation
  for adjusting to new environments. After weeks spent alone in a windowless lab, churning through one
  Petri dish of smudge after another, a post-doc invited me to their weekly “journal discussions.” I accepted
  the invitation immediately and found out later that these meetings were a venue for discussing ecology
  and environmental science papers.</p>

  <p>Going into my first journal meeting, I felt that my contributions were going to be pointless. At
  first, this fear was confirmed. While the graduate students and postdocs shared their thoughts, I was
  frantically Googling on my laptop in an attempt to understand them. Though I had read the entire paper
  front to back, I hadn’t grasped the context behind it. These ecologists came to these discussions with
  years of experience conducting, writing up, and publishing experiments. Thinking in terms of Swales’
  criteria, these years of experience furnished them with a context for understanding the goals of ecological
  research, for critiquing such research, for decoding ecology genres, and for using ecology vocabulary.
  I had had none of that.</p>

  <p>However, after attending a few of the discussions, I started to understand more. For example, I realized
  that no one says “standard artificial media 5-salt culture water.” This phrase is ridiculously long
  and thus shortened to SAM-5S water. Here, we can see the concept of silential relations at play, yet
  understanding what should be said and what can remain unsaid required more than just learning word definitions.
  It also required me to understand the ideas within a larger context. For example, through talking with
  a grad student, I learned the context surrounding the issue of pseudoreplication, which is a situation
  where one would artificially inflate their sample size by sampling multiple times from a single source.
  She explained how she would avoid this by setting up 50 individual pools of water with the experimental
  chemicals and animals. Thus, the experiment would generate true statistical significance, which would
  make it publishable, thus serving one of the main goals of this discourse community.</p>

  <p>In addition, I realized that the journal discussions were always guided by a series of standard questions.
  Where and when was the paper published? What is the significance of the results? Do they make sense?
  Are there any discrepancies? Recognizing the format of the discussions and learning more about ecology
  and scientific genres, I was able to understand the goals of the lab and the context behind their experiments.
  After attending several journal discussions, I became comfortable speaking my thoughts to the group.
  I began relating the paper we were discussing to the current research being done in the lab, and making
  these connections allowed me to get a deeper understanding of the life of an ecologist. Doing this,
  my comments and questions began sparking a more in-depth discussion, rather than a dead-end conversation.
  I no longer needed to stress about what to say next or worry about the discussion becoming awkward.
  Thinking in Swales’ terms, this is when I started to internalize one facet of the community’s horizon
  of expectations: the value system that defines meaningful (and not-so-meaningful) commentary and critique.</p>

  <p>On another occasion, a postdoc started passionately exclaiming how the figures in a paper were way
  too confusing and complex. This showed me how undoubtedly passionate they are about their work, and
  how they meticulously critique the textual artifacts that make up their scientific community. It was
  also relieving to know how even the most experienced in the lab sometimes found figures difficult to
  interpret too, with the difference being that they are able to back up their critiques with an onslaught
  of evidence. With each passing journal discussion, I was increasingly able to relate to the ecologists’
  work and get to know them better. This is how I started to break free of that “new person” feeling.</p>

  <p>While these journal discussions expanded my knowledge of ecology, I also gained insight into how
  the scientific research community communicates and circulates information. Put differently, these are
  the actions encompassed by Swales’ second and third criteria. As opposed to engineering, the scientific
  method for demonstrating results is quite textual. This differs from the more physical nature of engineering,
  as while I am resizing the fit of a 3D model, the ecologists are meticulously rewriting their manuscripts
  so as to appease reviewer two. In noting this realization about textual vs. material communication,
  we can circle back to Swales’ first and fourth criteria. Here we see members of engineering and ecology
  discourse communities using very different research genres, or formats, to achieve very different goals.
  And, to put it in more day-to-day terms, I learned that emailing busy ecologists is a nuanced task.
  These messages had to be short and to the point if I wanted to receive a response in the same week!</p>

  <p>At the end of the fall semester working in the lab, I’d learned how these ecologists communicate,
  how they characterize their passions and goals, and how I fit into the community. These successes paved
  the way for my next opportunity: a summer internship position. Shifting into the new role, I would continue
  the work of picking dead invertebrates out of wet dirt. Then, after three weeks, a grad student asked
  me if I wanted to catch snails from a pond. I was so excited to finally work with an organism that was
  alive. A little slow, but alive, nonetheless. I picked each snail out from the pond so gently, like
  they were the last one on earth, and I brought them back to the lab for the graduate student. Upon examining
  the snails and realizing they were all alive, she told me “good job.” This very brief interaction demonstrated
  that she regarded snail collection as the most basic of tasks, while I perceived it to be more involved
  and sophisticated. Essentially, I was the ecologists’ coffee boy, but instead of delivering coffee,
  I delivered snails!</p>

  <p>Nevertheless, after having success with retrieving snails, I was able to communicate to my co-workers
  that I am capable of successfully carrying out more complex tasks. After around two weeks of snail work,
  I advanced to a more complex (and quicker!) organism: frogs. I began transporting live (jumping!) frogs
  from outdoor experiments into the lab. Given the strong possibility that I might lose a frog, or a data
  point in the eyes of a PhD student, I worked alongside another person. After a week as a member of the
  frog-catching duo, I was told I could catch them on my own. I was no longer the undergrad who picks
  dead worms from dirt. I had become the undergrad who catches live frogs out of kiddie pools!</p>

  <p>In addition, I started to realize subtleties in the way my colleagues worked, and I developed my
  own daily routines. I was finally gaining some of that autonomy Kelly Xu discusses in the previous section.
  For example, each morning I would organize the glassware, check-up on the live animals, collect specific
  animals, and touch base with the director. At the close of each day, I would start washing glassware
  and check our chemical inventory. Initially, I did not do any of those things; it was only after talking
  to them over lunch each day that I came to recognize my colleagues’ workloads and time constraints.
  So, when I was given a menial task like washing dishes, I worked it into my routine and continued to
  do it each day, thus freeing up crucial time for my colleagues. By demonstrating that I shared the ecologists’
  goals and viewpoints, I was able to gain their trust and integrate myself into their discourse community.</p>

  <h3>Conclusion</h3>

  <p>Regardless of the discourse community, gaining membership and authority involves recognizing the
  social context that surrounds communication. It demands that we read the room. In doing so, we can gain
  trust through demonstrating our awareness of a community’s goals, genres, and language. As we have seen
  through our explorations of social media and scientific discourse communities, understanding situated
  social norms is essential for developing that awareness. Effective communication always requires contextual
  awareness. This is the social side of communication. In order to understand and be understood, one must
  learn to read the room. We hope that our examples and discussions have illustrated the intellectual
  and emotional components of being a novice communicator. Further, we hope you now have the tools to
  embrace this novice status. It is inevitable that we will all wander into a new room from time to time.
  Once we cross a new threshold, it is up to us to find knowledge and power there.</p>

