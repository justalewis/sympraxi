  <p>Teacher Resources</p>

  <p>Overview and Teaching Strategies</p>

  <p>Thus is revealed the total existence of writing: a text is made of multiple writings, drawn from
  many cultures and entering into mutual relations of dialogue, parody, contestation, but there is one
  place where this multiplicity is focused and that place is the reader, not as was hitherto said, the
  author. We are now beginning to let ourselves be fooled no longer by the arrogant antiphrastical recriminations
  of good society in favor of the very thing it sets aside, ignores, smothers, or destroys; we know that
  to give writing its future, it is necessary to overthrow the myth: the birth of the reader must be at
  the cost of the death of the author.</p>

  <p>--Roland Barthes, The Death of the Author, p. 148</p>

  <p>Access to technologies can extend globally. However, as this chapter noted, locally within the United
  States of America, ethnic and cultural diversity is increasing. Thus, technical writing students, whether
  addressing a global or local target community, will grapple with the challenge of communicating to diverse
  readers. To address this challenge, instructors may supplement students’ writing knowledge with training
  in visual communication design to acquire applied skills, strategies, and techniques to relay information
  aesthetically and cross-culturally. They may even integrate graphic designers as guest speakers in the
  course schedule to consult on how to translate the instructions visually and aesthetically.</p>

  <p>These traditional approaches tend to keep the design of the technical instructions focused on what
  the author intends contrary to Barthes’ perspective that the reader should be and is the focus of the
  communication. Since the goal essentially is to achieve cultural resonance in the communication of technical
  instructions, the process of designing the instructions must change to be more focused on the reader.
  Instead of communicating to diverse readers and users, technical communicators should pivot towards
  communicating with them. Teaching the next generation of professional technical communicators entails
  teaching them a culturally inclusive approach to technical writing that yields cross-cultural resonance
  with diverse readers.</p>

  <p>The culturally inclusive approach introduced in this chapter can be used to design multimodal technical
  instructions that resonate cross-culturally by 1) representing culture appropriately from knowledge
  gleaned conducting primary and secondary research, and 2) enabling cross-cultural interpretation through
  interactive aesthetics. The approach aligns with a curriculum that teaches technical writing as a process
  of inquiry in which students engage in primary and secondary research towards developing a prototype
  of how instructions should be multimodally-designed with interactive aesthetics to yield cross-cultural
  resonance. Primary research entails engaging with the readers to gather creative insight. This interaction
  may take the form of surveys, questionnaires, ethnography, and other qualitative and quantitative instruments.
  Whereas secondary research entails accessing public archives and libraries of text and images that provide
  credible information that relates to the subject matter or technology or getting to know the culture
  of the readers.</p>

  <h3>Applied Discussion</h3>

  <p>Using the following table as a guide, independently or in small groups discuss and plan how you would
