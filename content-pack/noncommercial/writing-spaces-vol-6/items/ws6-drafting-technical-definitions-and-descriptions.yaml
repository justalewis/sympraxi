  <p>Teacher Resources</p>

  <p>Overview and Teaching Strategies</p>

  <p>Technical definitions and descriptions can be addressed in several ways in an introductory technical
  communication course. Instructors of such courses can incorporate technical definitions and descriptions
  in various kinds of projects, including but not limited to user manuals, product documentation, scientific
  publications, and Web content.</p>

  <p>Instructors should follow the structure of this chapter by first providing learners an overview of
  technical definitions and descriptions, then analyzing the various types of definitions and descriptions,
  and ultimately practicing how to draft them. Because technical definitions and descriptions vary greatly
  by document genre, context, and audience goals, excellent examples that are contextualized can effectively
  illuminate this knowledge. Likewise, when students practice drafting technical definitions and description,
  such practices are best done in specific contexts of use. Because technical definitions and descriptions
  often come as part of a technical document — and are shaped by the broader goal of the document — instructors
  can embed relevant assignments in the creation of whole technical documents such as user manuals and
  product documentation. These whole documents provide rich contexts and defined audience that are ideal
  for practicing technical definitions and descriptions.</p>

  <p>When asking learners to draft technical definitions and descriptions, instructors can consider the
  following activities:</p>

  <ul><li>Begin with an analysis of audience and context. Instructors can help learners approach technical
  definitions and descriptions not as still dictionary entries, but as rhetorical messages that are aimed
  at audiences and contexts. Guide learners to investigate the intended audience and goals and apply concepts
  and strategies from this chapter.</li><li>Gather subject-matter information. Instructors can help learners
  become skilled at gathering information from documents and consulting with subject-matter experts.</li><li>Draft
  the technical definition or description. Instructors can guide learners to select the appropriate type
  of definition or description and apply appropriate strategies that respond to the given audience and
  context. It is also helpful to ask learners to try different strategies and compare how each strategy
  works with the context.</li><li>Test with audiences. If conditions allow, it could be fruitful for learners
  to test their drafted technical definitions and descriptions with target audiences. This process often
  allows learners to discover issues that they can’t otherwise see and improve their ability to meet audience
  goals.</li></ul>

  <p>In summary, instructors can use this chapter to teach learners why technical definitions and descriptions
  matter, what they are, and how to create them. The key is to contextualize technical definitions and
  descriptions and link concepts from this chapter with specific contexts and audience goals.</p>

  <h3>Discussion Questions</h3>

  <p>To help learners understand technical definitions and descriptions, consider the following questions
  when analyzing or drafting these definitions and descriptions:</p>

  <p>1. What technical definitions and descriptions do you encounter in everyday life? Where and how are
  they provided? In what contexts do you use them?</p>

  <p>2. Who is the intended audience of a technical definition or description?</p>

  <p>3. What are the primary goals of your audience in using a given technical document?</p>

  <p>4. What do your audiences already know about the concepts to be defined and mechanisms or processes
  to be described?</p>

  <p>5. What widely held views or misunderstandings, if any, exist in your audiences?</p>

  <p>6. What resources are available on the subject matter? 7. What strategies are the most appropriate
  for defining a technical term or describing a technical mechanism or process?</p>

  <p>These questions can be used to analyze examples of excellent and poorly written technical definitions
  and descriptions; they are particularly helpful when learners draft definitions and descriptions from
  scratch. The key is to help learners think about many factors that technical communicators must attend
  to when drafting technical definitions and descriptions and link these factors with the concepts and
  strategies from this chapter.</p>'
