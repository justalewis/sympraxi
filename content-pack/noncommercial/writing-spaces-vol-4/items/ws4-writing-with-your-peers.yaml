  Theory and Pedagogy.” College Composition and Communication, vol. 35, no. 2, 1984, pp. 155-171.</p>

  <p>Edwards, Dustin, and Enrique Paz. “Only Geniuses Can Be Writers.” Bad Ideas about Writing, edited
  by Cheryl E. Ball and Drew M. Loewe, West Virginia University Libraries, Digital Publishing Institute,
  2017, pp. 64-70.</p>

  <p>Eodice, Michele, and Kami Day. “Learning from Coauthoring: Composing Texts Together in the Composition
  Classroom.” Teaching with Student Texts, edited by Joseph Harris, John D. Miles, and Charles Paine,
  Utah State UP, 2010, pp. 190-99.</p>

  <p>Hewett, Beth L., and Charlotte Robidoux, editors. Virtual Collaborative Writing in the Workplace:
  Computer-Mediated Communication Technologies and Processes: Computer-Mediated Communication Technologies
  and Processes. IGI Global, 2010.</p>

  <p>Lockett, Alexandria. “The Traditional Research Paper Is Best.” Bad Ideas about Writing, edited by
  Cheryl E. Ball and Drew M. Loewe, West Virginia University Libraries, Digital Publishing Institute,
  2017, 236-241.</p>

  <p>Palmer, Parker. The Courage to Teach. Jossey-Bass, 1998.</p>

  <p>Vygotsky, Lev S. Mind in Society: The Development of Higher Psychological Processes. Translated by
  Michael Cole, Vera John-Steiner, Sylvia Scribner, and Ellen Souberman, Harvard U P, 1978.</p>

  <p>Wojahn, Pattie, Kristin A. Blicharz, and Stephanie K. Taylor. “Engaging in Virtual Collaborative
  Writing: Issues, Obstacles, and Strategies.” Virtual Collaborative Writing in the Workplace: Computer-Mediated
  Communication Technologies and Processes, edited by Beth L. Hewett and Charlotte Robidoux, IGI Global,
  2010, 65-87.</p>

  <p>Wolfe, Joanna. Team Writing: A Guide to Writing in Groups. Bedford/St. Martin’s, 2010.</p>

  <h3>Teacher Resources for Writing with Your Peers</h3>

  <p>This chapter is designed to encourage students to consider the benefits of collaborative writing
  and coauthoring. But it is important the instructor also have a positive disposition toward such work.
  At some point in your teaching career, you might have asked your students to coauthor, felt the experience
  was negative or not useful for your students and for you, and decided student coauthoring would not
  be part of your pedagogy. We hope this chapter will make you hopeful about trying again. There is plenty
  of research in writing studies about authorship and collaborative writing, but for a useful discussion
  of how to prepare students to write together and facilitating the process, we suggest the chapter “Learning
  from Coauthoring: Composing Texts Together in the Composition Classroom” (Eodice and Day) in the collection
  Teaching with Student Texts.</p>

  <p>It also might be useful, as you form student writing groups, to think about what your own experiences
  with collaborative writing and coauthoring have been or whether you have always avoided that type of
  interaction or have never had the opportunity to try it. We also encourage you to try experimenting
  with low-stakes collaborative writing exercises in your classroom if you are not yet ready to dedicate
  a whole assignment in your course to this endeavor. We know sometimes as educators we need the opportunity
  to start small before fully committing to a new assignment.</p>

  <p>The following prompts are designed for you to uncover your own disposition toward coauthoring. Your
  answers might uncover views of coauthoring that could impact the way you present collaborative activities
  and coauthoring in your course. We also think the prompts could be offered to students as well.</p>

  <h3>Reflection Questions:</h3>

  <p>4. Did you have a particular feeling or opinion about collaborative writing and coauthoring before
  reading the chapter? Has that feeling or opinion changed?</p>

  <p>5. When you imagine yourself in a writing group, what role do you see yourself playing? What strength
  can you contribute?</p>

  <p>6. What is your biggest concern about working with others on a coauthored paper?</p>

  <p>7. Some writers and researchers view all writing as problem solving; how do you see yourself solving
  problems with others in the group?</p>

  <h3>Sample Writing Tasks</h3>

  <p>Below, we provide writing activities, assignments, and guidelines we use in our individual classes.
  You could ask students to experiment with the first set of collaborative low-stakes writing exercises
  prior to engaging in the longer assignment. However, you could also just experiment with one or two
  of these exercises to see how students respond to help you prepare for eventually implementing the essay
  assignment. After these writing exercises, we provide an essay assignment and guidelines students can
  use to help them manage conflict. Feel free to use any of these activities and templates and adapt them
  in any way that makes sense for your context. Finally, we include a list of touchstones that have guided
  our teaching and our students’ interactions with each other.</p>

  <h3>Note on Group Formation</h3>

  <p>Some instructors assign students to permanent groups about three weeks into a semester after the
  whole class has had a chance to become more comfortable with each other. In this way, students have
  had a few weeks’ practice working with each other in small groups that change membership, and the teacher
  has had a chance to see which students are introverts or extroverts, who comes to class regularly, and
  so forth. Other instructors prefer to allow students to self-select, others form groups randomly, others
  ask the students to count off and form groups of all ones, all twos, etc. Each method has advantages,
  but what matters ultimately is creating a classroom in which students understand the value of collaborative
  learning, feel that the work they do is meaningful, and acknowledge their responsibility to each other.</p>

  <h3>Low-Stakes Collaborative Writing Exercises</h3>

  <p>Put students in small groups of three to four individuals. Provide them with a writing prompt to
  a reading they completed for homework (or one they read together in class). Ask them to respond in writing
  as an entire group. Usually, based on context, we provide students more step-by-step instructions on
  how this works so they understand the various steps this exercise requires of them. For instance, we
  have provided students the following order of instructions:</p>

  <ul><li>Take some time together to verbally discuss your answers to the prompt.</li><li>Make sure everyone
  has had a chance to share their thoughts. • Afterwards, try to determine which ideas you may want to
  communicate in your written response. You may not be able to discuss everyone’s ideas, so which one(s)
  is the larger group interested in? • Then, begin the writing process.</li></ul>

  <p>If computers are available, encourage everyone to use Google Docs to start writing together, or if
  it is done by hand, encourage the group to come up with certain roles. Remember to make it clear to
  students that they are to work together to submit one written response. You should indicate how long
  you want that response to be and what kind of content you would like to receive (do you want them to
  present evidence or quotes from the reading?).</p>

  <p>You can provide students a writing prompt based on an issue they may be acquainted with and have
  them argue or share a perspective on it. This could be a topic they choose amongst themselves, too.
  As mentioned above, you may want to break down the list of activities they must go through in order
  to create a fully formulated written response.</p>

  <p>Process Guidelines for an Essay</p>

  <p>Essay 1</p>

  <p>Your group has had several opportunities this semester to coauthor, or create short pieces of writing
  together, and now it’s time for the text you write as groups. Some of you might be groaning about this,
  but in the past, my students have found this to be a mostly positive experience. They learn from each
  other about the topic and about writing, they enjoy the support from each other, and sometimes they
  even have fun! I believe it’s some of the most important work you do since it has so much to do with
  the relationships in the group and how you value each other and fulfill your responsibilities to your
  peers. So here are some guidelines to help you with this process.</p>

  <p>Schedule: You’ll write most of this text in class. If you like, you can exchange your drafts with
  another group for feedback and work on revisions. In addition to working together in class, you might
  want to work on the document virtually in a shared-document platform like Google Docs.</p>

  <p>Contents of the paper: Your essay can include some research, but that is not a requirement. Remember,
  coauthoring can be challenging since you might not all agree totally on the topic. That’s okay—consensus
  on everything is not necessary. You’ll need to find a way, though, to create a new voice from all your
  voices so the essay fits together smoothly and does not sound as though it is written by several different
  people. You may have to weave together different views, but no one’s voice need be silenced. Cognitive
  conflict is a good thing, and we could all use more practice negotiating diverse views and respecting
  each other’s positions.</p>

  <p>In-class work: You’ll have four full class periods to work on this project. If you have research
  to do, you must do it outside class time and bring it to class with you. Class time will be for writing.
  At the end of each writing period, I’ll take up what you have written so it will be sure to make it
  to class the next time (or you’ll send me an electronic copy if you’re working on a computer). If you
  need to take a hard copy with you, I’ll make copies for you. We’ll decide as a class whether you want
  to spend some writing time in the computer lab.</p>

  <p>The process: Remember the guidelines we came up with at the beginning of the semester for working
  together. Please take turns as you discuss your work, make room respectfully for all views, think of
  the value of hearing each other rather than making someone agree with you. Just do what you’ve been
  doing already this semester! Please take turns scribing, and don’t write the whole paper by writing
  individual sections and smooshing them together. Most of the text should be written by the whole group—you’ve
  had practice doing this and you’ve done it well.</p>

  <p>The product: This is one of the major projects of the semester, so please take it seriously—I do.
  It’s a chance for you to review what you’ve learned and practiced this semester: writing together, invention
  strategies, unified paragraphing, sentence variety, perhaps integrating research sources, using MLA
  format, editing for nonessential words, spelling and punctuation, transitions, etc. The text should
  be well edited, and if you use any outside sources, it should include a Works Cited page. These essays
  are typically not long—writing together is hard! —but they are rich in that they bring together so many
  styles and ideas. I will be circulating among your groups as you write and assisting if I need to, but
  I expect each group to develop its own process.</p>

  <p>Reflections on Coauthoring All the students are asked to write reflections on their required coauthoring
  experiences, but when students are given the choice to coauthor (as they are with their research projects),
  which means they will be working together outside of class, the students who choose coauthoring are
  asked to turn in reflections on that process. Below is the reflection assignment.</p>

  <h3>If You Coauthor</h3>

  <p>In my experience, coauthors find the best way, without any help from me, to work together successfully.
  My main concerns are that you contribute equally to the project, that all your voices are heard in the
  text as a voice you create together, that you appreciate each other’s strengths and learn from each
  other, and that you have a positive and productive experience. I’m as interested in your process as
  in the text you produce, so I’m going to ask you to write some individual (each person will write their
  own) reflections on that process. I hope you’ll be honest about your experience and your roles, and
  that you’ll describe your experience in detail.</p>

  <p>Reflection guidelines: Choose from the prompts below to develop a reflection about your coauthoring
  experience.</p>

  <p>1. Why did you decide to coauthor the essay? 2. How did you all do the research together? 3. How
  did you do the writing of the essay so far? (Did you each write sections and put them together? Did
  you sit down together and write each sentence together? Did you do a combination of the two or some
  other combination I have not thought of?) 4. What do you think you contributed to the essay? (your strengths)
  5. What do you think your coauthors contributed? (their strengths) 6. How did you feel about any feedback
  you got from peers? 7. How did you make the revisions?</p>

  <p>8. How do you feel about the quality of the essay?</p>

  <p>9. How do you feel about the whole process?</p>

  <p>10. What have you learned from the other coauthor(s) about writing, research, or anything else?</p>

  <p>11. What have you learned in the coauthoring process about writing, working with another person?</p>

  <p>12. Has anything about this whole experience surprised you?</p>

  <p>Conflict</p>

  <p>Navigating Conflict</p>

  <p>Writing with others is not just about stringing words together with a few people you hardly know.
  Sometimes the writing part is the easy part. Getting to know, respect, and value others is important—but
  conflicts will arise. Check your privilege and be sure you are listening to all voices. You might not
  agree with everyone, you might bring bias or impatience with others, but the goal is to learn and write
  as a member of an ability-diverse team to experience community problem solving.</p>

  <p>In life as in the classroom, you should expect to encounter some conflict. This is inevitable as
  we work with others and especially when we have to write together. Writing is something many of us feel
  is personal and belongs to us. You have to acknowledge this is because you actually care! However, when
  we write with others, we must begin to break away from this idea. Your writing is a contribution to
  a group or a team, and it helps all of you meet a goal, but that does not mean it will not be questioned
  or bettered by others. This is what makes cowriting so rewarding (as we have said several times already).</p>

  <p>But the reality is, you won’t always find it so rewarding—you may encounter some difficulties in
  working with others. Some of these difficulties may include that you have a different idea or set of
  values surrounding the writing prompt and what it’s asking you to do. Simply said, you may have a different
  answer to the prompt than your cowriter(s). You may find in your group that a few of you have different
  ideas about the kind of writing you want to write or even the words used. Yes, it can be that small!
  Sometimes it can be as complex as not knowing how to move forward with so many different ideas or if
  the writing is sounding like a cohesive piece. You may also encounter a situation where you feel as
  though some people are not contributing or doing as much as others. We ask that you be patient with
  yourself, others, and the writing process. Working in groups is not easy even when writing is not required,
  so you can expect this process to be a challenge. However, we believe it is in the midst of these struggles
  that you will have the opportunity to learn more about yourself and the writing process. Although it
  may sound too simple to say “be patient,” the reality is, it has to be that simple. Being patient to
  us means the following:</p>

  <ul><li>Stop after engaging for a while in a particularly difficult conversation about a difference
  in opinion or ideas or thoughts. So, yes, engage in some meaningful conversation with your writing partner(s)
  and then maybe take a day to think on what was exchanged or even just a few minutes before deciding
  how you’re all going to move forward. Maybe take a moment and process the conversation via some reflective
  writing or with a trusted friend or family member who you know can give you their perspective as well.</li><li>Be
  open to others’ ideas and approach to writing. The beauty of working with others is that we have access
  to a wider range of language and knowledge—don’t take it for granted!</li><li>Build a thick skin and
  do not take offense too much. Someone is in class just like you, trying to do the best they can, so
  take their suggestions to heart; see how they can help make your thinking and writing better, just as
  yours makes theirs better. Be able to accept feedback on your writing and do not be afraid to “touch”
  each other’s words and writing! This is where the true collaborative nature of writing together happens—when
  you work and meld your efforts on the page! Use the “suggesting” or “tracking” feature on Google/Word
  to make changes so everyone is aware of what is being recommended and get in there! Remember, the writing
  process is not linear—it’s messy!</li><li>Finally, being patient also involves being willing to learn
  more about yourself and who you are as a writer and a person. Your professor may ask you at the end
  of your collaborative writing project to reflect on your experience working with others. We encourage
  you to keep this in mind as you work with others. Who are you in a group? We mentioned briefly that
  there are usually roles in a group. So, which one do you usually take on? Are you the one who reminds
  the group of the amount of time left on the project? The requirements associated with the project? Do
  you usually try to motivate others? Do you take the lead and get the writing started? Or do you like
  to wait and see what others have contributed and then move into writing and help others develop what
  is on the page? The answers to these questions are really for you to get a better understanding of who
  you are as you continue to engage in groups and write or work collaboratively with others in the workforce
  or even in student organizations while you’re still in college.</li></ul>

  <h3>Creating a Class Ethos with Touchstones</h3>

  <p>It is important to define the space in which learning together will take place, and one way to do
  that is to introduce guidelines like the Touchstones below early in the semester (these are based on
  the work of Parker Palmer and are adapted from the list of Touchstones on the Center for Courage and
  Renewal’s website, http://www.couragerenewal.org/touchstones/). The class can read this list together,
  and students too can be invited to choose a Touchstone that seems particularly challenging and share
  their thoughts with the class if they feel comfortable doing that (many do). Of course, it’s important
  to revisit these Touchstones often during the semester.</p>

  <h3>Classroom Community Touchstones</h3>

  <p>Ideas that increase the likelihood of our working together productively</p>

  <p>1. Extend welcome and accept welcome. We all learn most effectively in spaces that welcome us. Therefore,
  we have a responsibility to welcome each other to this place and the work of this course and to presume
  that we are being welcomed as well.</p>

  <p>2. Be here. Be as present as possible. Set aside, as much as you can, the usual distractions of things
  undone from yesterday, things to do tomorrow. Bring all of yourself to our class; allow yourself to
  “be here now.”</p>

  <p>3. Listen. Listen intently to what is said; listen to the feeling beneath the words. Listen to yourself
  as well as others. Strive to achieve a balance between listening and reflecting, speaking and acting.</p>

  <p>4. Be open to share. You will be invited to share in small groups and the large group. You will determine
  the extent to which you want to share or disclose information about yourself. There are levels of self-disclosure.
  Self-disclosure requires risk. You will decide how much you wish to reveal.</p>

  <p>5. Suspend judgment. Set aside your judgments. By creating a space between judgements and reactions
  we can listen to each other, and to ourselves, more fully.</p>

  <p>6. Identify assumptions. Our assumptions are usually transparent to us, yet they show our worldview.
  By identifying our assumptions, we can then set them aside and open our viewpoints to greater possibilities.</p>

  <p>7. Speak your truth. You are invited to say what is in your mind and heart, trusting that your voice
  will be heard and your contribution respected. Your truth may be different from, even the opposite of,
  what another person in the class has said. Avoid introducing defensive feelings that distract from the
  dialogue; speaking your truth and arguing for what you believe is true (or to change someone else’s
  truth) are two different things.</p>

  <p>8. Respect silence. Silence is a rare gift in our busy world. After someone has spoken, take time
  to reflect without immediately filling the space with words. This applies to the speaker as well—be
  comfortable leaving your words to resound in the silence, without refining or elaborating on what you
  have just said. This process allows others time to fully listen before reflecting on their own reactions.</p>

  <p>9. Be generous and kind. We are all learning and it’s important that we are patient with each other.</p>

  <p>10. When things get difficult, turn to wonder. If you find yourself disagreeing with another, becoming
  judgmental, or shutting down in defense, try turning to wonder: “I wonder what brought them to this
  place?” “I wonder what my reaction teaches me?” “I wonder what they’re feeling right now?”</p>'
