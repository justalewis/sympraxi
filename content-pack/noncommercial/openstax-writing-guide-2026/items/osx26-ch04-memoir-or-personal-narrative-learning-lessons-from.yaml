  <p>4.9 Portfolio: Filtered Memories</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Reflect on the composition process. • Reflect
  on how the composition process affects your writing. • Use composition for learning, critical thinking,
  and communicating in various rhetorical contexts.</p>

  <p>As part of this course, you are creating a portfolio of your compositions to show your development
  as a writer.</p>

  <p>As you add to this portfolio, you assess your growth as a writer. The portfolio of your work allows
  you not only to have a record of your compositions but also to reflect on those compositions and the
  process involved in writing them. In this section, you will write a reflection on the process you followed
  in writing your turningpoint story, including revision and editing. Consider your original intention
  when creating your essay and how close your final composition comes to fulfilling that intention.</p>

  <h3>Reflective Task</h3>

  <p>Answer the following questions before writing several paragraphs reflecting on the personal turning
  point you wrote about in this chapter. Consider both the process and the outcome of the writing assignment.</p>

  <ul><li>Why did you choose the turning-point moment or event that you did? • Which part of the writing
  process came the most naturally? Which was the most difficult? • Which parts of the composition do you
  think are the strongest? Why? • Which parts of the composition would you still like to improve? • How
  did you develop your voice as a narrator as you wrote? • If you were to write another turning-point
  story, what would you do differently? (Consider topic, organization, structure, point of view, and voice.)
  • How did your story change through the revision and peer-editing processes? Name at least two changes
  you made, and reflect on how they made the piece stronger. • What did you learn about yourself, both
  as a writer and as a person, from this exercise?</li></ul>

