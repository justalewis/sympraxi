  <p>Teacher Resources</p>

  <p>Overview and Teaching Strategies</p>

  <p>User-centered design helps people create better products and technical documents. Starting product
  designs and the writing process with a focus on users helps ensure that you will meet their needs with
  your finished product. Consider these ideas when implementing user-centered design:</p>

  <ul><li>Prioritize the needs of users over the ideas of the designer or writer. • Learn information
  about user goals, context of use, emotions, vocabulary, and challenges. • Conduct user research using
  methods like contextual inquiry, interviews, focus groups, and surveys to learn about your users. •
  Remember that user-centered design is an iterative process that involves users from the beginning of
  design and throughout the design process.</li></ul>

  <p>While user-centered design research can be complex and time-consuming, students can take on basic
  user-centered design projects and processes in the technical writing classroom. For instance, they may
  conduct interviews or a short survey about why users need a particular document that they are assigned
  to write. They might observe users complete work using a technical document (or without one, to find
  out how a document might help users complete their tasks). They might complete iterative document design
  projects that involve bringing in potential users at several stages of the writing process to help guide
  revision. Additionally, students might conduct user research and write a report about their findings
  as a written deliverable in the class.</p>

  <h3>Discussion Questions</h3>

  <p>These discussion questions are designed to accompany the SeeClickFix case study presented earlier.</p>

  <p>1. Using the SeeClickFix website, try and find a version of the application that is close to your
  hometown. Based on the branding and available categories, do you think the SeeClickFix team has used
  user-centered design principles while localizing their service for this community?</p>

  <p>2. Thinking about this local community, who are the target user groups of the SeeClickFix system?
  Make sure not to overlook anyone!</p>

  <p>3. As a group, think of a product or service that you are all familiar with. If you were tasked with
  creating a list of potential user issues for this product or service, which user-centered design methods
  would you use?</p>'
