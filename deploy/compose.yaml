# Production stack for one college. Run every command from this directory:
#   docker compose up -d
# See docs/install.md. Settings live in deploy/.env (start from .env.example).

name: sympraxi

x-app: &app
  image: ${SYMPRAXI_IMAGE:-sympraxi:local}
  build:
    context: ..
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://sympraxi:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@db:5432/sympraxi
    SYMPRAXI_TRUST_X_FORWARDED_FOR: "true"
  volumes:
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: sympraxi
      POSTGRES_USER: sympraxi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sympraxi -d sympraxi"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    <<: *app
    # Gunicorn starts WEB_CONCURRENCY workers, set in deploy/.env (3 if it isn't).

  worker:
    <<: *app
    # Built from the Dockerfile's "worker" stage, which adds LibreOffice for the PDF
    # copies the comment viewer draws (SYMPRAXI_CONVERT_DOCUMENTS in deploy/.env).
    # With a prebuilt SYMPRAXI_IMAGE, the worker runs that image, without LibreOffice,
    # unless SYMPRAXI_WORKER_IMAGE names the build that has it.
    image: ${SYMPRAXI_WORKER_IMAGE:-${SYMPRAXI_IMAGE:-sympraxi-worker:local}}
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker
    command: ["python", "manage.py", "db_worker"]
    # The image's check calls the web server, which the worker doesn't run.
    # Instead, confirm Django starts and can reach the database.
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--database", "default"]
      interval: 60s
      timeout: 20s
      start_period: 30s
      start_interval: 5s
      retries: 3

  scheduler:
    <<: *app
    # Sends reminder emails and flags possible no-shows, once a minute. Run one
    # copy; a second sends nothing twice but does no good either.
    command: ["python", "manage.py", "scheduler"]
    # Healthy only if a sweep finished in the last three minutes, so a scheduler
    # that can't reach the database shows as unhealthy, not only a dead one.
    healthcheck:
      test: ["CMD", "python", "-m", "sympraxi.healthcheck", "scheduler"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      start_interval: 5s
      retries: 3
    # On `docker compose stop` it finishes the sweep in progress, then exits.
    stop_grace_period: 30s

  # Optional: scans each file people attach before anyone can open it. Start it
  # with `docker compose --profile clamav up -d` and set
  # SYMPRAXI_CLAMAV_ADDRESS=clamav:3310 in deploy/.env (docs/install.md, "Files").
  # It needs about 3 GB of memory for its virus database.
  clamav:
    image: clamav/clamav:1.4
    profiles: ["clamav"]
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SYMPRAXI_DOMAIN: ${SYMPRAXI_DOMAIN:?Set SYMPRAXI_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
  clamav_db:
