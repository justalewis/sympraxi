  <p>References Page in APA Style. All sources cited in the text of the report, and only those sources,
  are listed in alphabetical order with full publication information. See the Handbook for more on APA
  documentation style.</p>

  <h3>Discussion Questions</h3>

  <p>1. Trevor Garcia identifies three reasons for the failure of the United States to contain the coronavirus
  in 2020. What are they? Can you think of others he should have included?</p>

  <p>2. What does Trevor use as evidence—facts, statistics, examples? What are the sources of his evidence?
  Are his sources credible and reliable?</p>

  <p>3. Analyze Trevor’s objectivity and bias as a writer. Is his language objective? Give examples of
  where he is objective and where he reveals his bias.</p>

  <p>4. In what ways does Trevor view the U.S. response to the pandemic through the lens of critical,
  analytical thinking? Give examples.</p>

  <p>5. What are three strengths of Trevor’s report? What are three weaknesses?</p>

  <p>8.5 Writing Process: Creating an Analytical Report</p>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Identify the elements of the rhetorical situation for your report. • Find and focus a topic
  to write about. • Gather and analyze information from appropriate sources. • Distinguish among different
  kinds of evidence. • Draft a thesis and create an organizational plan. • Compose a report that develops
  ideas and integrates evidence from sources. • Give and act on productive feedback to works in progress.
  You might think that writing comes easily to experienced writers—that they draft stories and college
  papers all at once, sitting down at the computer and having sentences flow from their fingers like water
  from a faucet. In reality, most writers engage in a recursive process, pushing forward, stepping back,
  and repeating steps multiple times as their ideas develop and change. In broad strokes, the steps most
  writers go through are these: • Planning and Organization. You will have an easier time drafting if
  you devote time at the beginning to consider the rhetorical situation for your report, understand your
  assignment, gather ideas and information, draft a thesis statement, and create an organizational plan.
  • Drafting. When you have an idea of what you want to say and the order in which you want to say it,
  you’re ready to draft. As much as possible, keep going until you have a complete first draft of your
  report, resisting the urge to go back and rewrite. Save that for after you have completed a first draft.
  • Review. Now is the time to get feedback from others, whether from your instructor, your classmates,
  a tutor in the writing center, your roommate, someone in your family, or someone else you trust to read
  your writing critically and give you honest feedback. • Revising. With feedback on your draft, you are
  ready to revise. You may need to return to an earlier step and make large-scale revisions that involve
  planning, organizing, and rewriting, or you may need to work mostly on ensuring that your sentences
  are clear and correct.</li></ul>

  <h3>Considering the Rhetorical Situation</h3>

  <p>Like other kinds of writing projects, a report starts with assessing the rhetorical situation—the
  circumstance in which a writer communicates with an audience of readers about a subject. As the writer
  of a report, you make choices based on the purpose of your writing, the audience who will read it, the
  genre of the report, and the expectations of the community and culture in which you are working. A graphic
  organizer like Table 8.1 can help you begin.</p>

  <p>Rhetorical Situation Element</p>

  <p>Brainstorming Questions</p>

  <h3>Topic</h3>

  <p>Is the topic of your report specified, or are you free to choose?</p>

  <p>What topic or topics do you want to know more about? How can you find out more about this topic or
  topics? What constraints do you have?</p>

  <p>Your Responses</p>

  <p>Purpose What is the purpose of your report?</p>

  <p>To analyze a subject or issue from more than one perspective? To analyze a cause or an effect? To
  examine a problem and recommend a solution? To compare or contrast? To conduct research and report results?</p>

  <p>Audience Who will read your report?</p>

  <p>Who is your primary audience—your instructor? Your classmates?</p>

  <p>What can you assume your audience already knows about your topic?</p>

  <p>What background information does your audience need to know?</p>

  <p>How will you shape your report to connect most effectively with this audience?</p>

  <p>Do you need to consider any secondary audiences, such as people outside of class?</p>

  <p>If so, who are those readers?</p>

  <p>Presentation What format should your report take?</p>

  <p>Should you prepare a traditional written document or use another medium, such as a slide deck or
  video presentation?</p>

  <p>Should you include visuals and other media along with text, such as figures, charts, graphs, photographs,
  audio, or video?</p>

  <p>What other presentation requirements do you need to consider?</p>

  <p>Rhetorical Situation Element</p>

  <p>Brainstorming Questions</p>

  <h3>Context</h3>

  <p>How do the time period and location affect decisions you make about your report?</p>

  <p>What is happening in your city, county, state, area, or nation or the world that needs reporting
  on?</p>

  <p>What current events or new information might relate to your topic?</p>

  <p>Is your college or university relevant to your topic?</p>

  <p>Your Responses</p>

  <h3>Culture and Community</h3>

  <p>What social or cultural assumptions do you or your audience have?</p>

  <p>How will you show awareness of your community’s social and cultural expectations in your report?</p>

  <h3>Summary of Assignment</h3>

  <p>Write an analytical report on a topic that interests you and that you want to know more about. The
  topic can be contemporary or historical, but it must be one that you can analyze and support with evidence
  from sources.</p>

  <p>The following questions can help you think about a topic suitable for analysis:</p>

  <p>1. Why or how did ________ happen? 2. What are the results or effects of ________? 3. Is ________
  a problem? If so, why? 4. What are examples of ________ or reasons for ________? 5. How does ________
  compare to or contrast with other issues, concerns, or things?</p>

  <p>Consult and cite three to five reliable sources. The sources do not have to be scholarly for this
  assignment, but they must be credible, trustworthy, and unbiased. Possible sources include academic
  journals, newspapers, magazines, reputable websites, government publications or agency websites, and
  visual sources such as TED Talks. You may also use the results of an experiment or survey, and you may
  want to conduct interviews.</p>

  <p>Consider whether visuals and media will enhance your report. Can you present data you collect visually?
  Would a map, photograph, chart, or other graphic provide interesting and relevant support? Would video
  or audio allow you to present evidence that you would otherwise need to describe in words?</p>

  <p>Another Lens. To gain another analytic view on the topic of your report, consider different people
  affected by it. Say, for example, that you have decided to report on recent high school graduates and
  the effect of the COVID-19 pandemic on the final months of their senior year. If you are a recent high
  school graduate, you might naturally gravitate toward writing about yourself and your peers. But you
  might also consider the adults in the lives of recent high school graduates—for example, teachers, parents,
  or grandparents—and how they view the same period. Or you might consider the same topic from the perspective
  of a college admissions department looking at their incoming freshman class.</p>

  <h3>Quick Launch: Finding and Focusing a Topic</h3>

  <p>Coming up with a topic for a report can be daunting because you can report on nearly anything. The
  topic can easily get too broad, trapping you in the realm of generalizations. The trick is to find a
  topic that interests you and focus on an angle you can analyze in order to say something significant
  about it. You can use a graphic organizer to generate ideas, or you can use a concept map similar to
  the one featured in Writing Process:</p>

  <h3>Thinking Critically About a “Text.” Asking the Journalist’s Questions</h3>

  <p>One way to generate ideas about a topic is to ask the five W (and one H) questions, also called the
  journalist’s questions: Who? What? When? Where? Why? How? Try answering the following questions to explore
  a topic: Who was or is involved in ________? What happened/is happening with ________? What were/are
  the results of ________? When did ________ happen? Is ________ happening now? Where did ________ happen,
  or where is ________ happening? Why did ________ happen, or why is ________ happening now? How did ________
  happen? For example, imagine that you have decided to write your analytical report on the effect of
  the COVID-19 shutdown on high-school students by interviewing students on your college campus. Your
  questions and answers might look something like those in Table 8.2:</p>

  <p>Question</p>

  <p>Sample Answer</p>

  <p>Who was involved in the 2020 COVID-19 shutdown?</p>

  <p>Nearly every student of my generation was sent home to learn in 2020. My school was one of the first
  in the United States to close. We were in school one day, and then we were all sent home, wondering
  when we would go back.</p>

  <p>What happened during the shutdown?</p>

  <p>What were/are the results of the shutdown?</p>

  <p>Schools closed in March 2020. Students started online learning. Not all of them had computers. Teachers
  had to figure out how to teach online. All activities were canceled—sports, music, theater, prom, graduation
  celebrations—pretty much everything. Social life went online. Life as we knew it changed and still hasn’t
  returned to normal.</p>

  <p>When did the shutdown happen? Is it happening now?</p>

  <p>Everything was canceled from March through the end of the school year. Although many colleges have
  in-person classes, many of us are doing most of our classes online, even if we are living on campus.
  This learning situation hasn’t been easy. I need to decide whether I want to focus on then or now.</p>

  <p>Where did the shutdown happen, or where is it still happening?</p>

  <p>Schools were closed all over the United States and all over the world. Some schools are still closed.</p>

  <p>Question</p>

  <p>Sample Answer</p>

  <p>Why did the shutdown happen, or why is it happening now?</p>

  <p>Schools closed because the virus was highly contagious, and no one knew much about how many people
  would get sick from it or how sick they would get. Many schools were still closed for much of the 2020–21
  school year.</p>

  <p>How was the shutdown implemented? How is it still in effect?</p>

  <p>Governors of many states, including mine, issued orders for schools to close. Now colleges are making
  their own plans.</p>

  <h3>Asking Focused Questions</h3>

  <p>Another way to find a topic is to ask focused questions about it. For example, you might ask the
  following questions about the effect of the 2020 pandemic shutdown on recent high school graduates:</p>

  <ul><li>How did the shutdown change students’ feelings about their senior year? • How did the shutdown
  affect their decisions about post-graduation plans, such as work or going to college? • How did the
  shutdown affect their academic performance in high school or in college? • How did/do they feel about
  continuing their education? • How did the shutdown affect their social relationships?</li></ul>

  <p>Any of these questions might be developed into a thesis for an analytical report. Table 8.3 shows
  more examples of broad topics and focusing questions.</p>

  <p>Broad Topics</p>

  <p>Sports, such as college athletes and academic performance</p>

  <h3>Focusing Questions</h3>

  <p>How does participating in a sport affect the academic performance of college athletes? Does participation
  help or hurt students’ grades? Does participation improve athletes’ study habits?</p>

  <h3>Culture and society, such as cancel culture</h3>

  <p>Who is affected by cancel culture? Who is canceled, and who is empowered?</p>

  <p>How do the lives of people who are canceled change? How do the lives of people who are canceling
  others change?</p>

  <p>How does cancel culture affect community attitudes and actions?</p>

  <h3>Broad Topics</h3>

  <p>History and historical events, such as the Voting Rights Act of 1965</p>

  <h3>Focusing Questions</h3>

  <p>How did voting patterns change after the passage of the Voting Rights Act of 1965? How has the law
  been challenged? How have voting patterns changed in the years since the law was challenged?</p>

  <h3>Health and the environment, such as a plant-based diet</h3>

  <p>What are the known health benefits of a plant-based diet? What are the effects of a plant-based diet
  on the environment? How much money can a person save (or not save) by adopting a plantbased diet, such
  as vegetarianism or veganism?</p>

  <h3>Entertainment and the arts, such as TV talent shows</h3>

  <p>How do TV talent shows affect the careers of their contestants? How many of the contestants continue
  to develop their talent? How many continue to perform several years after their appearance on a show?</p>

  <h3>Technologies and objects, such as smartphones</h3>

  <p>Do people depend on smartphones more than they did a year ago? Five years ago?</p>

  <p>What has changed about people’s relationships with their phones?</p>

  <h3>Gathering Information</h3>

  <p>Because they are based on information and evidence, most analytical reports require you to do at
  least some research. Depending on your assignment, you may be able to find reliable information online,
  or you may need to do primary research by conducting an experiment, a survey, or interviews. For example,
  if you live among students in their late teens and early twenties, consider what they can tell you about
  their lives that you might be able to analyze. Returning to or graduating from high school, starting
  college, or returning to college in the midst of a global pandemic has provided them, for better or
  worse, with educational and social experiences that are shared widely by people their age and very different
  from the experiences older adults had at the same age.</p>

  <p>Some report assignments will require you to do formal research, an activity that involves finding
  sources and evaluating them for reliability, reading them carefully, taking notes, and citing all words
  you quote and ideas you borrow. See Research Process: Accessing and Recording Information and Annotated
  Bibliography: Gathering, Evaluating, and Documenting Sources for detailed instruction on conducting
  research.</p>

  <p>Whether you conduct in-depth research or not, keep track of the ideas that come to you and the information
  you learn. You can write or dictate notes using an app on your phone or computer, or you can jot notes
  in a journal if you prefer pen and paper. Then, when you are ready to begin organizing your report,
  you will have a record of your thoughts and information. Always track the sources of information you
  gather, whether from printed or digital material or from a person you interviewed, so that you can return
  to the sources if you need more information. And always credit the sources in your report.</p>

  <h3>Kinds of Evidence</h3>

  <p>Depending on your assignment and the topic of your report, certain kinds of evidence may be more
  effective than others. Other kinds of evidence may even be required. As a general rule, choose evidence
  that is rooted in verifiable facts and experience. In addition, select the evidence that best supports
  the topic and your approach to the topic, be sure the evidence meets your instructor’s requirements,
  and cite any evidence you use that comes from a source. The following list contains different kinds
  of frequently used evidence and an example of each.</p>

  <ul><li>Definition: An explanation of a key word, idea, or concept. The U.S. Census Bureau refers to
  a “young adult” as a person between 18 and 34 years old.</li><li>Example: An illustration of an idea
  or concept. The college experience in the fall of 2020 was starkly different from that of previous years.
  Students who lived in residence halls were assigned to small pods. On-campus dining services were limited.
  Classes were small and physically distanced or conducted online. Parties were banned.</li><li>Expert
  opinion: A statement by a professional in the field whose opinion is respected. According to Louise
  Aronson, MD, geriatrician and author of Elderhood, people over the age of 65 are the happiest of any
  age group, reporting “less stress, depression, worry, and anger, and more enjoyment, happiness, and
  satisfaction” (255).</li><li>Fact: Information that can be proven correct or accurate. According to
  data collected by the NCAA, the academic success of Division I college athletes between 2015 and 2019
  was consistently high (Hosick).</li><li>Interview: An in-person, phone, or remote conversation that
  involves an interviewer posing questions to another person or people. During our interview, I asked
  Betty about living without a cell phone during the pandemic. She said that before the pandemic, she
  hadn’t needed a cell phone in her daily activities, but she soon realized that she, and people like
  her, were increasingly at a disadvantage.</li><li>Quotation: The exact words of an author or a speaker.
  In response to whether she thought she needed a cell phone, Betty said, “I got along just fine without
  a cell phone when I could go everywhere in person. The shift to needing a phone came suddenly, and I
  don’t have extra money in my budget to get one.”</li><li>Statistics: A numerical fact or item of data.
  The Pew Research Center reported that approximately 25 percent of Hispanic Americans and 17 percent
  of Black Americans relied on smartphones for online access, compared with 12 percent of White people.</li><li>Survey:
  A structured interview in which respondents (the people who answer the survey questions) are all asked
  the same questions, either in person or through print or electronic means, and their answers tabulated
  and interpreted. Surveys discover attitudes, beliefs, or habits of the general public or segments of
  the population. A survey of 3,000 mobile phone users in October 2020 showed that 54 percent of respondents
  used their phones for messaging, while 40 percent used their phones for calls (Steele).</li><li>Visuals:
  Graphs, figures, tables, photographs and other images, diagrams, charts, maps, videos, and audio recordings,
  among others.</li></ul>

  <p>Thesis and Organization</p>

  <h3>Drafting a Thesis</h3>

  <p>When you have a grasp of your topic, move on to the next phase: drafting a thesis. The thesis is
  the central idea that you will explore and support in your report; all paragraphs in your report should
  relate to it. In an essaystyle analytical report, you will likely express this main idea in a thesis
  statement of one or two sentences toward the end of the introduction.</p>

  <p>For example, if you found that the academic performance of student athletes was higher than that
  of nonathletes, you might write the following thesis statement:</p>

  <p>Although a common stereotype is that college athletes barely pass their classes, an analysis of athletes’
  academic performance indicates that athletes drop fewer classes, earn higher grades, and are more likely
  to be on track to graduate in four years when compared with their non-athlete peers.</p>

  <p>The thesis statement often previews the organization of your writing. For example, in his report
  on the U.S. response to the COVID-19 pandemic in 2020, Trevor Garcia wrote the following thesis statement,
  which detailed the central idea of his report:</p>

  <p>An examination of the U.S. response shows that a reduction of experts in key positions and programs,
  inaction that led to equipment shortages, and inconsistent policies were three major causes of the spread
  of the virus and the resulting deaths.</p>

  <p>After you draft a thesis statement, ask these questions, and examine your thesis as you answer them.
  Revise your draft as needed.</p>

  <ul><li>Is it interesting? A thesis for a report should answer a question that is worth asking and piques
  curiosity. • Is it precise and specific? If you are interested in reducing pollution in a nearby lake,
  explain how to stop the zebra mussel infestation or reduce the frequent algae blooms. • Is it manageable?
  Try to split the difference between having too much information and not having enough.</li></ul>

  <h3>Organizing Your Ideas</h3>

  <p>As a next step, organize the points you want to make in your report and the evidence to support them.
  Use an outline, a diagram, or another organizational tool, such as Table 8.4.</p>

  <p>Report Section</p>

  <p>Content</p>

