  <p>5 Skillful</p>

  <p>The text always adheres to the “Editing Focus” of this chapter: using the literary present tense
  as discussed in Section 16.6. The text also shows ample evidence of the writer’s intent to consciously
  meet or challenge conventional expectations in rhetorically effective ways.</p>

  <p>All paragraphs in the paper reflect its purpose, stated in the thesis, and allow for a thorough analysis
  of a literary work. The overall organization is clear, and ideas are connected with effective transitions.
  Paragraphs have topic sentences and proceed logically from them to support the thesis.</p>

  <p>The tone and language choices are well suited to the audience and purpose. The work reflects thought,
  fairness, general comprehension, and keen awareness of the rhetorical situation.</p>

  <p>4 Accomplished</p>

  <p>The text usually adheres to the “Editing Focus” of this chapter: using the literary present tense
  as discussed in Section 16.6. The text also shows some evidence of the writer’s intent to meet or challenge
  conventional expectations in rhetorically effective ways.</p>

  <p>Most paragraphs in the paper reflect its purpose, stated in the thesis, and allow for a strong analysis
  of a literary work. The overall organization is clear, and most ideas are connected with transitions.
  Most paragraphs have topic sentences and proceed logically from them to support the thesis.</p>

  <p>The tone and language choices are usually well suited to the audience and purpose. The work reflects
  thought, fairness, comprehension, and reasonable awareness of the rhetorical situation.</p>

  <p>3 Capable</p>

  <p>The text generally adheres to the “Editing Focus” of this chapter: using the literary present tense
  as discussed in Section 16.6. The text also shows limited evidence of the writer’s intent to meet or
  challenge conventional expectations in rhetorically effective ways.</p>

  <p>Some paragraphs in the paper reflect its purpose, which may be stated in the thesis, and may not
  provide a strong focus for analysis of a literary work. The overall organization is discernible, and
  some ideas are connected with transitions. Most paragraphs have topic sentences but may not proceed
  logically from them to support the thesis.</p>

  <p>The tone and language choices are somewhat suited to the audience and purpose. The work reflects
  some thought, fairness, comprehension, and reasonable awareness of the rhetorical situation</p>

