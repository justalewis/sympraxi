  <h3>Drafting an Analytical Report</h3>

  <p>With a tentative thesis, an organization plan, and evidence, you are ready to begin drafting. For
  this assignment, you will report information, analyze it, and draw conclusions about the cause of something,
  the effect of something, or the similarities and differences between two different things.</p>

  <h3>Introduction</h3>

  <p>Some students write the introduction first; others save it for last. Whenever you choose to write
  the introduction, use it to draw readers into your report. Make the topic of your report clear, and
  be concise and sincere. End the introduction with your thesis statement. Depending on your topic and
  the type of report, you can write an effective introduction in several ways. Opening a report with an
  overview is a tried-and-true strategy, as shown in the following example on the U.S. response to COVID-19
  by Trevor Garcia. Notice how he opens the introduction with statistics and a comparison and follows
  it with a question that leads to the thesis statement (underlined).</p>

  <p>With more than 83 million cases and 1.8 million deaths at the end of 2020, COVID-19 has turned the
  world upside down. By the end of 2020, the United States led the world in the number of cases, at more
  than 20 million infections and nearly 350,000 deaths. In comparison, the second-highest number of cases
  was in India, which at the end of 2020 had less than half the number of COVID-19 cases despite having
  a population four times greater than the U.S. (“COVID-19 Coronavirus Pandemic,” 2021). How did the United
  States come to have the world’s worst record in this pandemic? An examination of the U.S. response shows
  that a reduction of experts in key positions and programs, inaction that led to equipment shortages,
  and inconsistent policies were three major causes of the spread of the virus and the resulting deaths.</p>

  <p>For a less formal report, you might want to open with a question, quotation, or brief story. The
  following example opens with an anecdote that leads to the thesis statement (underlined).</p>

  <p>Betty stood outside the salon, wondering how to get in. It was June of 2020, and the door was locked.
  A sign posted on the door provided a phone number for her to call to be let in, but at 81, Betty had
  lived her life without a cell phone. Betty’s day-to-day life had been hard during the pandemic, but
  she had planned for this haircut and was looking forward to it; she had a mask on and hand sanitizer
  in her car. Now she couldn’t get in the door, and she was discouraged. In that moment, Betty realized
  how much Americans’ dependence on cell phones had grown in the months since the pandemic began. Betty
  and thousands of other senior citizens who could not afford cell phones or did not have the technological
  skills and support they needed were being left behind in a society that was increasingly reliant on
  technology.</p>

  <h3>Body Paragraphs: Point, Evidence, Analysis</h3>

  <p>Use the body paragraphs of your report to present evidence that supports your thesis. A reliable
  pattern to keep in mind for developing the body paragraphs of a report is point, evidence, and analysis:</p>

  <ul><li>The point is the central idea of the paragraph, usually given in a topic sentence stated in
  your own words at or toward the beginning of the paragraph. Each topic sentence should relate to the
  thesis.</li><li>The evidence you provide develops the paragraph and supports the point made in the topic
  sentence. Include details, examples, quotations, paraphrases, and summaries from sources if you conducted
  formal research. Synthesize the evidence you include by showing in your sentences the connections between
  sources.</li><li>The analysis comes at the end of the paragraph. In your own words, draw a conclusion
  about the evidence you have provided and how it relates to the topic sentence.</li></ul>

  <p>The paragraph below illustrates the point, evidence, and analysis pattern. Drawn from a report about
  concussions among football players, the paragraph opens with a topic sentence about the NCAA and NFL
  and their responses to studies about concussions. The paragraph is developed with evidence from three
  sources. It concludes with a statement about helmets and players’ safety.</p>

  <p>The NCAA and NFL have taken steps forward and backward to respond to studies about the danger of
  concussions among players. Responding to the deaths of athletes, documented brain damage, lawsuits,
  and public outcry (Buckley et al., 2017), the NCAA instituted protocols to reduce potentially dangerous
  hits during football games and to diagnose traumatic head injuries more quickly and effectively. Still,
  it has allowed players to wear more than one style of helmet during a season, raising the risk of injury
  because of imperfect fit. At the professional level, the NFL developed a helmet-rating system in 2011
  in an effort to reduce concussions, but it continued to allow players to wear helmets with a wide range
  of safety ratings. The NFL’s decision created an opportunity for researchers to look at the relationship
  between helmet safety ratings and concussions. Cocello et al. (2016) reported that players who wore
  helmets with a lower safety rating had more concussions than players who wore helmets with a higher
  safety rating, and they concluded that safer helmets are a key factor in reducing concussions.</p>

  <h3>Developing Paragraph Content</h3>

  <p>In the body paragraphs of your report, you will likely use examples, draw comparisons, show contrasts,
  or analyze causes and effects to develop your topic.</p>

  <p>Paragraphs developed with Example are common in reports. The paragraph below, adapted from a report
  by student John Zwick on the mental health of soldiers deployed during wartime, draws examples from
  three sources.</p>

  <p>Throughout the Vietnam War, military leaders claimed that the mental health of soldiers was stable
  and that men who suffered from combat fatigue, now known as PTSD, were getting the help they needed.
  For example, the New York Times (1966) quoted military leaders who claimed that mental fatigue among
  enlisted men had “virtually ceased to be a problem,” occurring at a rate far below that of World War
  II. Ayres (1969) reported that Brigadier General Spurgeon Neel, chief American medical officer in Vietnam,
  explained that soldiers experiencing combat fatigue were admitted to the psychiatric ward, sedated for
  up to 36 hours, and given a counseling session with a doctor who reassured them that the rest was well
  deserved and that they were ready to return to their units. Although experts outside the military saw
  profound damage to soldiers’ psyches when they returned home (Halloran, 1970), the military stayed the
  course, treating acute cases expediently and showing little concern for the cumulative effect of combat
  stress on individual soldiers.</p>

  <p>When you analyze causes and effects, you explain the reasons that certain things happened and/or
  their results. The report by Trevor Garcia on the U.S. response to the COVID-19 pandemic in 2020 is
  an example: his report examines the reasons the United States failed to control the coronavirus. The
  paragraph below, adapted from another student’s report written for an environmental policy course, explains
  the effect of white settlers’ views of forest management on New England.</p>

  <p>The early colonists’ European ideas about forest management dramatically changed the New England
  landscape. White settlers saw the New World as virgin, unused land, even though indigenous people had
  been drawing on its resources for generations by using fire subtly to improve hunting, employing construction
  techniques that left ancient trees intact, and farming small, efficient fields that left the surrounding
  landscape largely unaltered. White settlers’ desire to develop wood-built and woodburning homesteads
  surrounded by large farm fields led to forestry practices and techniques that resulted in the removal
  of old-growth trees. These practices defined the way the forests look today.</p>

  <p>Compare and contrast paragraphs are useful when you wish to examine similarities and differences.
  You can use both comparison and contrast in a single paragraph, or you can use one or the other. The
  paragraph below, adapted from a student report on the rise of populist politicians, compares the rhetorical
  styles of populist politicians Huey Long and Donald Trump.</p>

  <p>A key similarity among populist politicians is their rejection of carefully crafted sound bites and
  erudite vocabulary typically associated with candidates for high office. Huey Long and Donald Trump
  are two examples. When he ran for president, Long captured attention through his wild gesticulations
  on almost every word, dramatically varying volume, and heavily accented, folksy expressions, such as
  “The only way to be able to feed the balance of the people is to make that man come back and bring back
  some of that grub that he ain’t got no business with!” In addition, Long’s down-home persona made him
  a credible voice to represent the common people against the country’s rich, and his buffoonish style
  allowed him to express his radical ideas without sounding anti-communist alarm bells. Similarly, Donald
  Trump chose to speak informally in his campaign appearances, but the persona he projected was that of
  a fast-talking, domineering salesman. His frequent use of personal anecdotes, rhetorical questions,
  brief asides, jokes, personal attacks, and false claims made his speeches disjointed, but they gave
  the feeling of a running conversation between him and his audience. For example, in a 2015 speech, Trump
  said, “They just built a hotel in Syria. Can you believe this? They built a hotel. When I have to build
  a hotel, I pay interest. They don’t have to pay interest, because they took the oil that, when we left
  Iraq, I said we should’ve taken” (“Our Country Needs” 2020). While very different in substance, Long
  and Trump adopted similar styles that positioned them as the antithesis of typical politicians and their
  worldviews.</p>

  <h3>Conclusion</h3>

  <p>The conclusion should draw the threads of your report together and make its significance clear to
  readers. You may wish to review the introduction, restate the thesis, recommend a course of action,
  point to the future, or use some combination of these. Whichever way you approach it, the conclusion
  should not head in a new direction. The following example is the conclusion from a student’s report
  on the effect of a book about environmental movements in the United States.</p>

  <p>Since its publication in 1949, environmental activists of various movements have found wisdom and
  inspiration in Aldo Leopold’s A Sand County Almanac. These audiences included Leopold’s conservationist
  contemporaries, environmentalists of the 1960s and 1970s, and the environmental justice activists who
  rose in the 1980s and continue to make their voices heard today. These audiences have read the work
  differently: conservationists looked to the author as a leader, environmentalists applied his wisdom
  to their movement, and environmental justice advocates have pointed out the flaws in Leopold’s thinking.
  Even so, like those before them, environmental justice activists recognize the book’s value as a testament
  to taking the long view and eliminating biases that may cloud an objective assessment of humanity’s
  interdependent relationship with the environment.</p>

  <h3>Citing Sources</h3>

  <p>You must cite the sources of information and data included in your report. Citations must appear
  in both the text and a bibliography at the end of the report.</p>

  <p>The sample paragraphs in the previous section include examples of in-text citation using APA documentation
  style. Trevor Garcia’s report on the U.S. response to COVID-19 in 2020 also uses APA documentation style
  for citations in the text of the report and the list of references at the end. Your instructor may require
  another documentation style, such as MLA or Chicago.</p>

  <h3>Peer Review: Getting Feedback from Readers</h3>

  <p>You will likely engage in peer review with other students in your class by sharing drafts and providing
  feedback to help spot strengths and weaknesses in your reports. For peer review within a class, your
  instructor may provide assignment-specific questions or a form for you to complete as you work together.</p>

  <p>If you have a writing center on your campus, it is well worth your time to make an online or in-person
  appointment with a tutor. You’ll receive valuable feedback and improve your ability to review not only
  your report but your overall writing.</p>

  <p>Another way to receive feedback on your report is to ask a friend or family member to read your draft.
  Provide a list of questions or a form such as the one in Table 8.5 for them to complete as they read.</p>

  <h3>Questions for Reviewer</h3>

  <p>Does the introduction interest you in the topic of the report? Can you find the thesis statement?
  Underline it for the writer. Does the thesis indicate the purpose of the report? Does each body paragraph
  start with a point stated in the writer’s own words? Does that point relate to the thesis? Mark paragraphs
  that don’t have a clear point.</p>

  <p>Comment or Suggestion</p>

  <h3>Questions for Reviewer</h3>

  <p>Does each body paragraph support the main point of the paragraph with details and evidence, such
  as facts, statistics, or examples? Mark paragraphs that need more support and/or explanation.</p>

  <h3>Comment or Suggestion</h3>

  <p>Does each body paragraph end with an analysis in the writer’s own words that draws a conclusion?</p>

  <p>Mark paragraphs that need analysis.</p>

  <p>Where do you get lost or confused? Mark anything that is unclear.</p>

  <p>Does the report flow from one point to the next? Does the organization make sense to you? Does the
  conclusion wrap up the main points of the report and connect to the thesis? Mark anything in the conclusion
  that seems irrelevant.</p>

  <p>Does the report have an engaging title? TABLE 8.5 Peer review questions</p>

  <p>Revising: Using Reviewers’ Responses to Revise your Work</p>

  <p>When you receive comments from readers, including your instructor, read each comment carefully to
  understand what is being asked. Try not to get defensive, even though this response is completely natural.
  Remember that readers are like coaches who want you to succeed. They are looking at your writing from
  outside your own head, and they can identify strengths and weaknesses that you may not have noticed.
  Keep track of the strengths and weaknesses your readers point out. Pay special attention to those that
  more than one reader identifies, and use this information to improve your report and later assignments.</p>

  <p>As you analyze each response, be open to suggestions for improvement, and be willing to make significant
  revisions to improve your writing. Perhaps you need to revise your thesis statement to better reflect
  the content of your draft. Maybe you need to return to your sources to better understand a point you’re
  trying to make in order to develop a paragraph more fully. Perhaps you need to rethink the organization,
  move paragraphs around, and add transition sentences.</p>

  <p>Below is an early draft of part of Trevor Garcia’s report with comments from a peer reviewer:</p>

  <p>To truly understand what happened, it’s important first to look back to the years leading up to the
  pandemic. Epidemiologists and public health officials had long known that a global pandemic was possible.
  In 2016, the U.S. National Security Council (NSC) published a 69-page document with the intimidating
  title Playbook for Early Response to High-Consequence Emerging Infectious Disease Threats and Biological
  Incidents. The document’s two sections address responses to “emerging disease threats that start or
  are circulating in another country but not yet confirmed within U.S. territorial borders” and to “emerging
  disease threats within our nation’s borders.” On 13 January 2017, the joint Obama-Trump transition teams
  performed a pandemic preparedness exercise; however, the playbook was never adopted by the incoming
  administration.</p>

  <p>Peer Review Comment: Do the words in quotation marks need to be a direct quotation? It seems like
  a paraphrase would work here.</p>

  <p>Peer Review Comment: I’m getting lost in the details about the playbook. What’s the Obama-Trump transition
  team?</p>

  <p>In February 2018, the administration began to cut funding for the Prevention and Public Health Fund
  at the Centers for Disease Control and Prevention; cuts to other health agencies continued throughout
  2018, with funds diverted to unrelated projects such as housing for detained immigrant children.</p>

  <p>Peer Review Comment: This paragraph has only one sentence, and it’s more like an example. It needs
  a topic sentence and more development.</p>

  <p>Three months later, Luciana Borio, director of medical and biodefense preparedness at the NSC, spoke
  at a symposium marking the centennial of the 1918 influenza pandemic. “The threat of pandemic flu is
  the number one health security concern,” she said. “Are we ready to respond? I fear the answer is no.”</p>

  <p>Peer Review Comment: This paragraph is very short and a lot like the previous paragraph in that it’s
  a single example. It needs a topic sentence. Maybe you can combine them?</p>

  <p>Peer Review Comment: Be sure to cite the quotation.</p>

  <p>Reading these comments and those of others, Trevor decided to combine the three short paragraphs
  into one paragraph focusing on the fact that the United States knew a pandemic was possible but was
  unprepared for it. He developed the paragraph, using the short paragraphs as evidence and connecting
  the sentences and evidence with transitional words and phrases. Finally, he added in-text citations
  in APA documentation style to credit his sources. The revised paragraph is below:</p>

  <p>Epidemiologists and public health officials in the United States had long known that a global pandemic
  was possible. In 2016, the National Security Council (NSC) published Playbook for Early Response to
  HighConsequence Emerging Infectious Disease Threats and Biological Incidents, a 69-page document on
  responding to diseases spreading within and outside of the United States. On January 13, 2017, the joint
  transition teams of outgoing president Barack Obama and then president-elect Donald Trump performed
  a pandemic preparedness exercise based on the playbook; however, it was never adopted by the incoming
  administration (Goodman &amp; Schulkin, 2020). A year later, in February 2018, the Trump administration
  began to cut funding for the Prevention and Public Health Fund at the Centers for Disease Control and
  Prevention, leaving key positions unfilled. Other individuals who were fired or resigned in 2018 were
  the homeland security adviser, whose portfolio included global pandemics; the director for medical and
  biodefense preparedness; and the top official in charge of a pandemic response. None of them were replaced,
  leaving the White House with no senior person who had experience in public health (Goodman &amp; Schulkin,
  2020). Experts voiced concerns, among them Luciana Borio, director of medical and biodefense preparedness
  at the NSC, who spoke at a symposium marking the centennial of the 1918 influenza pandemic in May 2018:
  “The threat of pandemic flu is the number one health security concern,” she said. “Are we ready to respond?
  I fear the answer is no” (Sun, 2018, final para.).</p>

  <p>A final word on working with reviewers’ comments: as you consider your readers’ suggestions, remember,
  too, that you remain the author. You are free to disregard suggestions that you think will not improve
  your writing. If you choose to disregard comments from your instructor, consider submitting a note explaining
  your reasons with the final draft of your report.</p>

  <p>8.6 Editing Focus: Commas with Nonessential and Essential Information</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Distinguish between essential and nonessential
  information in sentences. • Use commas for clearer, more effective sentences.</p>

  <p>A comma is a mark of separation. It alerts readers to a brief pause or pauses within a sentence that
  is part of your analytical report.</p>

  <h3>Nonessential and Essential information</h3>

  <p>Nonessential information refers to information within a sentence that is not necessary for the reader
  to understand its meaning. Essential information refers to information within a sentence that is necessary
  for the reader to understand its meaning. Nonessential Information</p>

  <p>Placing commas around a word or group of words within a sentence usually indicates that the information
  is not necessary for readers to understand the sentence’s meaning. In the example below, the underlined
  words refer to and explain the phrase current math curriculum, but they can be removed without changing
  the meaning of the sentence: the math curriculum currently in use isn’t meeting current needs. The information
  is interesting and perhaps useful, but it is “extra” and does not change the basic meaning of the sentence.</p>

  <p>The current math curriculum, which was adopted by the school district 10 years ago, no longer meets
  the needs of the students. Essential Information</p>

  <p>Certain words in a sentence are often necessary for readers to understand its meaning. In the example
  below, the word current was removed from between the words The and math and replaced by the underlined
  words that tell readers which curriculum no longer meets students’ needs. It is essential because without
  it, confusion may arise about which math curriculum no longer meets students’ needs.</p>

  <p>The math curriculum that the district adopted 10 years ago no longer meets the needs of the students.</p>

  <p>To Comma or Not to Comma?</p>

  <p>Place commas around nonessential information, but not around essential information. You can test
  whether information is nonessential by removing the information. If the meaning of the sentence is unchanged,
  the information is nonessential. If the meaning becomes too general or changes in any way, the information
  is essential. Often, nonessential information is introduced with the word which and essential information
  with that. Place Commas around Nonessential Information</p>

  <p>Place commas around information that is not essential to the meaning of a sentence, as illustrated
  in the following sentences:</p>

  <ul><li>The entire math department, which consists of 16 teachers and 7 staff members, has requested
  a review of the curriculum.</li><li>The department chair, who has led the math department for 11 years,
  has agreed to the teachers’ request. • The curriculum will become effective in June, when the school
  year is finished.</li></ul>

  <h3>Do Not Place Commas around Essential Information</h3>

  <p>Do not place commas around information that is essential to the meaning of a sentence, as illustrated
  in the following sentences:</p>

  <ul><li>According to the department chair, the math curriculum needs to focus on skills that students
  need after high school graduation.</li><li>The math teachers who teach Algebra 1 and Algebra 2 have
  requested a review of the curriculum. • The teachers are concerned that students are not retaining what
  they have learned. • The department has consulted the curriculum expert Malcolm Green.</li></ul>

  <p>See Punctuation for more on commas.</p>

  <h3>Practice Using Commas</h3>

  <p>Read each of the following sentences. Decide whether the underlined portion of each sentence is nonessential
  or essential. Place commas before, after, or around the nonessential information as appropriate.</p>

  <p>1. The department has consulted the curriculum expert Malcolm Green whose textbook is widely used.
  2. Two members of the math department Janelle Brady and Tye Lavalle are retiring next year. 3. The textbooks
  that are now in use are outdated. 4. Students have given feedback on the online classes that have replaced
  in-person classes. 5. The math department now offers more evening classes which attract more students
  and fewer summer classes. 6. Several instructors who teach math also teach computer science classes.</p>

