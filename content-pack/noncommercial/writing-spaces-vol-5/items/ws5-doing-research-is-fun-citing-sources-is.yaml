  <p>226 Rachel Buck and Silvia Vaccino-Salvadore</p>

  <p>Teacher Resources for “‘Doing Research Is Fun; Citing Sources Is Not’”: Understanding the Fuzzy Definition
  of Plagiarism</p>

  <p>Overview and Teaching Strategies</p>

  <p>As composition teachers, we find that students are not aware of the complex nature of plagiarism,
  and because of the stigma associated with it, are not willing to discuss this topic or ask their teachers
  questions because of a fear of being “caught” plagiarizing. To remedy these situations, writing instructors
  can use this chapter to help students understand the complexity of what plagiarism entails, to start
  having open discussions of plagiarism with students in and outside the classroom, and ultimately to
  help students take ownership of their own research process.</p>

  <p>The chapter describes three activities (the similar quotes activity, the two speeches activity, and
  the research log activity) which we believe are apt to classroom discussions and are eye-openers for
  many students. In terms of process, we find it interesting to start by asking what students believe
  plagiarism is and if they believe they own the language and ideas that they write. This can begin with
  asking students what it means to “write in your own words.” Once we have answers to these questions,
  we build on their understanding by assigning the three activities mentioned above. We also like to include
  a newspaper article about paper-mills as a first assignment (Farooqui), as this is a clear-cut example
  of plagiarism, and then move on to the similar quotes activity followed by the speech activity. We then
  ask students to use a research log while conducting research on their writing topic and discuss some
  examples of student writings in class.</p>

  <h3>Discussion Questions</h3>

  <p>1. How do you define plagiarism? Do you think you own the ideas and language you write?</p>

  <p>2. How did the activities about plagiarism challenge or change your definition of plagiarism?</p>

  <p>3. How might your own revised definition of plagiarism influence the way you can integrate the ideas
  and language of your scholarly sources into your own research paper?</p>

  <p>4. Plagiarism is often discussed in terms of ownership. One helpful activity after you’ve written
  your final research paper is to identify areas that you feel are “yours” and sections that “belong”
  to others. Why might this be a difficult activity?</p>

  <p>5. In what ways do you think you “own” your final research paper?</p>'
