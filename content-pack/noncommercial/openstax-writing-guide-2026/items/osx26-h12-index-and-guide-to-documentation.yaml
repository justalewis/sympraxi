body: '<p><em>Access for free at openstax.org.</em></p>

  <h3>Index and Guide to Documentation</h3>

  <p>Although formal differences exist among the conventions for documenting sources, the underlying principle
  of all documentation systems is the same: When borrowing words, facts, or ideas from someone else, writers
  must indicate that the material is borrowed. They do this by providing a citation in the text of their
  paper that points readers to detailed publication information about the source of the material, usually
  at the end of the paper but sometimes in footnotes. The following examples are in MLA style:</p>

  <h3>Citation in the Text</h3>

  <p>Describing Martin Luther King, Jr.’s visit to India, Isabel Wilkerson notes that King was taken aback
  by the suggestion that Black Americans were the equivalent of the Dalits in the Indian caste system
  (22).</p>

  <h3>Works-Cited Entry</h3>

  <p>Wilkerson, Isabel. Caste: The Origins of Our Discontents. Penguin, 2020.</p>

  <h3>Documentation Styles by Discipline</h3>

  <p>Each discipline has its own authority or authorities that provide rules about issues such as spelling
  of technical terms, preferred punctuation, and editing mechanics, as well as documentation style. In
  addition, if you write for publication in a magazine, professional journal, book, or website, the publisher
  will have a “house” style, which may vary in some details from the conventions listed in the authoritative
  guidelines for the discipline in which you are writing. Below are the sources of style manuals for various
  disciplines. Always check with your instructor about which style to use in a class.</p>

  <h3>Discipline</h3>

  <h3>Documentation Style languages, literature, philosophy, and some arts</h3>

  <p>Modern Language Association (MLA) social sciences, education, and some other sciences American Psychological
  Association (APA) history, religion, fine arts, and business</p>

  <p>Chicago Manual of Style (CMS) life sciences</p>

  <p>Council of Science Editors (CSE) chemistry</p>

  <p>American Chemical Society (ACS) physics</p>

  <p>American Institute of Physics (AIP) journalism</p>

  <p>Associated Press (AP) medicine</p>

  <p>American Medical Association (AMA) law</p>

  <p>Bluebook: A Uniform System of Citation</p>

  <h3>Index to MLA Documentation Models</h3>

  <p>The models, listed numerically, provide examples of in-text citations and works-cited entries (MLA).
  The models themselves are located in Handbook Section 13 (H13).</p>

  <h3>In-Text Citation Models</h3>

  <p>1. One author 2. Two or more works by the same author 3. Two authors 4. Three or more authors 5.
  Authors with the same last name 6. Organization, government, corporation, or association as author 7.
  Unknown author 8. Work in more than one volume 9. Work with no page or other reference numbers 10. One-page
  or entire work 11. Source quoted in another source (indirect quotation) 12. Literary works</p>

  <p>◦ Poetry and verse plays ◦ Fiction and prose plays</p>

  <p>13. Two or more works in the same citation 14. Sacred text</p>

  <p>Endnotes and Footnotes (MLA)</p>

  <p>Format of the List of Works Cited (MLA)</p>

  <p>Authors and Contributors (MLA)</p>

  <p>15. Book: one author 16. Book: two authors 17. Book: three or more authors 18. Book: two or more
  works by the same author 19. Author and editor 20. Author and translator 21. Author and illustrator
  22. Work by an organization, a government, a corporation, or an association 23. Unknown author</p>

  <p>Articles in Journals, Magazines, and Newspapers (MLA)</p>

  <p>24. Basic format for a journal article in a database 25. Article in an academic journal</p>

  <p>◦ Database ◦ Print ◦ Online</p>

  <p>26. Article in a weekly or biweekly magazine ◦ Database ◦ Print ◦ Online</p>

  <p>27. Article in a monthly or bimonthly magazine ◦ Database</p>

  <p>◦ Print ◦ Online</p>

  <p>28. Article in a newspaper ◦ Database ◦ Print ◦ Online</p>

  <p>29. Editorial or letter to the editor 30. Review</p>

  <p>Books and Parts of Books (MLA)</p>

  <p>31. Basic entry for a book 32. Print book 33. E-book 34. Book, anthology, or collection with an editor
  35. Work in an anthology or chapter in an edited collection 36. Two or more works in an anthology or
  edited collection 37. Revised or later edition 38. Multivolume work 39. One volume of a multivolume
  work 40. Book in a series 41. Republished work 42. Sacred text 43. Introduction, preface, foreword,
  or afterword 44. Published letter 45. Conference paper</p>

  <p>Websites and Parts of Websites (MLA)</p>

  <p>46. Basic format for a short work or page on a website 47. Short work or page on a website 48. Blog
  post 49. Entire website 50. Wiki</p>

  <p>Social Media (MLA)</p>

  <p>51. Basic format for a social media post 52. Social media post 53. Online forum post 54. Online comment</p>

  <p>Personal Communication (MLA)</p>

  <p>55. Email 56. Text message 57. Personal letter</p>

  <p>Video, Audio, and Other Media Sources (MLA)</p>

  <p>58. Film 59. Online video 60. Television programs</p>

  <p>◦ TV series</p>

  <p>◦ TV episode</p>

  <p>61. Advertisement ◦ Print ◦ Online</p>

  <p>62. Cartoon or comic ◦ Print ◦ Online</p>

  <p>63. Painting or other visual artwork ◦ Original work ◦ Reproduction ◦ Online</p>

  <p>64. Map, chart, or diagram ◦ Print ◦ Online</p>

  <p>65. Sound recording ◦ Album ◦ Song ◦ Online</p>

  <p>66. Radio 67. Podcast 68. Interview</p>

  <p>◦ Broadcast ◦ Online ◦ Personal interview</p>

  <p>69. Video game, software, or app</p>

  <p>Other Sources (MLA)</p>

  <p>70. Live lecture, speech, address, or reading 71. Live performance 72. Letter in an archive 73. Dissertation
  74. Pamphlet</p>

  <p>Index to APA Documentation Models</p>

  <p>The models, listed numerically, provide examples of in-text citations and reference entries (APA).
  The models themselves are located in Handbook Section 14 (H14).</p>

  <p>In-Text Citation Models (APA)</p>

  <p>75. One author 76. Two authors 77. Three or more authors 78. Authors with the same last name 79.
  Organization, government, corporation, or association as author 80. Unknown author 81. Two or more works
  in the same citation 82. Work with no page numbers 83. Source quoted in another source (indirect quotation)</p>

  <p>84. Entire work 85. Personal communication</p>

  <p>Format of the References List (APA)</p>

  <p>Authors (APA)</p>

  <p>86. One author 87. Two authors 88. Three to twenty authors 89. Work by an organization, a government,
  a corporation, or an association 90. Unknown author 91. Two or more works by the same author</p>

  <p>Articles in Journals, Magazines, and Newspapers (APA)</p>

  <p>92. Basic format for an article in an academic journal</p>

  <p>93. Article in an academic journal ◦ With DOI ◦ With URL ◦ Without DOI or URL</p>

  <p>94. Article in a magazine ◦ Database ◦ Print ◦ Online</p>

  <p>95. Article in a newspaper ◦ Database or print ◦ Online</p>

  <p>96. Blog post 97. Published interview 98. Editorial or letter to the editor 99. Review</p>

  <p>Books and Parts of Books (APA)</p>

  <p>100. 101. 102. 103. 104. 105. 106. 107. 108.</p>

  <p>Basic entry for a book Print book or e-book Book, anthology, or collection with an editor Article
  in an edited book, anthology, or collection Translated or reprinted book Revised edition One volume
  of a multivolume work Report or publication by a government agency or other organization Conference
  paper</p>

  <p>Web Sources (APA)</p>

  <p>109. Basic format for a page or work on a website 110. Page or work on a website 111. Wiki</p>

  <p>Social Media (APA)</p>

  <p>112. Social media post</p>

  <p>113. Online forum post</p>

  <p>Video, Audio, and Other Media Sources (APA)</p>

  <p>114. Film</p>

  <p>115. Online video</p>

  <p>116. Television programs ◦ TV series ◦ TV episode</p>

  <p>117. 118. 119. 120. 121. 122.</p>

  <p>Music recording Radio Podcast Painting or other visual artwork Map, photograph, or other visual Video
  game, software, or app</p>'
