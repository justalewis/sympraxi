  <h3>Beth L. Hewett</h3>

  <p>The evidence provided in the next two paragraphs might be called arguing from anecdote (story), but
  really it’s a continuation of argument from past (to present) to future fact. It can be a very convincing
  technique because people tend to believe that what was possible in the past is possible again in the
  present or future. Part of reasoning from past fact to future fact is bringing in recent and current
  examples. It’s impossible to accurately predict the future, but it’s possible to suggest how the future
  might develop based on current events.</p>

  <p>When I was writing this essay in early 2009, for example, the parents of the Gosselin children (Jon
  and Kate) appeared to be happily married. In the short months between writing my essay and using it
  to write this chapter for you, the Gosselin adults have become common faces in print and TV media tabloids
  as Jon has admitted to adultery and has taken on a playboy persona, and Kate has aired their problems
  publically and filed for divorce. Their children are sometimes photographed looking confused and sad.
  For all of that, the network has continued the television show for some time, suggesting that this divorce
  is just a normal part of the children’s lives. Anecdotally, I think readers who are children of divorce
  would not have wanted television cameras filming their experiences and emotions as they adjusted to
  the new family situation. Similarly, in early 2010, Suleman contracted to begin a reality show with
  her currently-one year-old octuplets. If I were revising this essay today, I’d certainly be adding this
  material as proof of exploitation of the Gosselin children’s painful home life and the Suleman children’s
  lack of privacy.</p>

  <p>Student 8 still wasn’t convinced that the argument was reasonable. Fair enough. We can’t convince
  everyone to take our position in an argument although we can present reasonable evidence. One student
  suggested that I use the case of child celebrities to show how innocent children can be ruined by exploitation
  and publicity. In a longer revised essay, I would seriously consider that argument from analogy.</p>

  <p>Students 6 expressed a need for more direct connections among the past, present, and future. That
  was the difficulty of my argument from the outset because I was writing it only weeks after the Suleman
  octuplets were born. All I could do at this point was to predict, but my prediction wasn’t a far stretch
  given that the infants already were on camera as a way to exonerate the mother’s choice and to make
  money for her. Multiple sources revealed that she had received money to buy a much larger house and
  that she had daily outside assistance with</p>

