  <h3>Rhetorical Analysis: Key Terms</h3>

  <p>Rhetorical Appeals When doing a rhetorical analysis, notice these appeals writers use to persuade
  their audiences.</p>

  <ul><li>Ethos: believable, authoritative voice that elicits credibility and audience trust. • Kairos:
  sense of appropriate timing when attempting to persuade. • Logos: credible information—facts, reasons,
  or examples—presented as evidence that moves toward a sensible and acceptable conclusion. • Pathos:
  the use of appeals to feelings and emotions shared by an audience. Some of the general categories are
  fear, guilt, anger, love, loyalty, patriotism, and duty.</li></ul>

  <h3>Rhetorical Devices and Language Use</h3>

  <p>When doing a rhetorical analysis, notice these devices writers use to organize and emphasize their
  writing.</p>

  <ul><li>Figurative language: similes and metaphors. Comparing one aspect of things that in other ways
  are completely different is an essential part of rhetorical language. Simile example: “The treasure
  chest of nature’s wonders shone like a pirate’s gold tooth.” Metaphor example: “The pizza was a disk
  of saucy sunlight.”</li><li>Numerical data: statistics and figures. When accurate, numerical data can
  strengthen an argument. • Parallel structure: repetition of the same pattern of words to show that ideas
  are equally significant.</li></ul>

  <p>Parallel structure, or parallelism, calls attention to these ideas, achieves balance, and makes the
  statements more memorable. Example: “Ask not what your country can do for you but what you can do for
  your country.” • Personification: giving an inanimate or nonhuman object human characteristics to make
  it seem alive and relatable. Examples: “The virus packed its bags and spread across the ocean”; “Twitter
  erupted in outrage.” • Repetition: repeating a single word or group of words to build emphasis. Example:
  “The first cause is poverty; the second cause is poor health; the third cause is discrimination. These
  causes have been studied, but to what effect?” • Rhetorical question: a question that is not expected
  to be answered, one for which there is no answer, or one that creates a dramatic effect. Examples: “Has
  it occurred to you to ask why the economy is so unstable? A first point to consider is . . .”; “Do you
  think poverty will go away by itself?” • Understatement: presenting something as less important than
  it is as a way of distancing from the truth. Understatement is often used sarcastically or ironically.
  Example: “It may not have occurred to politicians that poverty leads to a host of health-related issues.”</p>

  <h3>Rhetorical Fallacies</h3>

  <p>When doing a rhetorical analysis, notice these fallacies writers may use to unethically persuade
  their audiences.</p>

  <ul><li>Ad hominem: logical fallacy that attempts to discredit a person, not an argument. Ad hominem,
  meaning “against the man,” is often termed name-calling. Examples: “She’s just a leftover from another
  era who can’t accept change”; “He’s a stupid bully and an outright thief.”</li><li>Bait and switch:
  logical fallacy that introduces a point about one thing that is likely to be accepted and then changes
  the terms once initial agreement occurs. Example: “Buy these phones at this price before they’re all
  gone!” When you go to buy one, moments later, the phones are gone—and they’re far more expensive.</li><li>Bandwagon:
  logical fallacy often used in advertising and propaganda. It tries to make people do something or think
  a certain way because everyone is doing it, and if they don’t go along, they will be excluded. Example:
  “Everyone is buying these sneakers; get yours now before you’re left out.” Negative example: “This style
  is so dated; no one wears things like this now.”</li><li>Causal fallacy: the faulty logic of claiming
  or believing that an event that follows another event is the result of it. For example, losing your
  keys after going to a concert does not mean the events are connected causally; going to the concert
  did not cause you to lose your keys.</li><li>Hyperbole: exaggeration. Hyperbole is one of the staples
  of advertising language. Examples: “Season’s Best Peppermint Glazed Delights”; “I have a ton of homework.”</li></ul>

  <p>9.4 Annotated Student Sample: “Rhetorical Analysis: Evicted by Matthew Desmond” by Eliana Evans</p>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Identify the ways a student writer has analyzed the rhetorical strategies in a persuasive text.
  • Demonstrate critical thinking and problem-solving when reading a rhetorical analysis.</li></ul>

  <h3>Introduction</h3>

  <p>Matthew Desmond (b. 1979 or 1980) is a sociology professor at Princeton University. He has published
  four books, each addressing issues of poverty or racial inequality in American life. He has been recognized
  by the Politico 50 list as an important contributing voice to national political debate. In the analysis
  that follows, student Eliana Evans examines Desmond’s work from a rhetorical perspective.</p>

  <h3>LIVING BY THEIR OWN WORDS Story as Persuasion</h3>

  <p>Imagine it’s Friday—payday. One American worker picks up her check for $637. Now, imagine that $550
  will go toward rent, leaving only a small amount for everything else. The remaining $87 must be divided
  among food, utilities, childcare, and medical treatment. Unfortunately, many of the nation’s poor don’t
  have to imagine this troubling scenario because this is their reality. In his book Evicted: Poverty
  and Profit in the American City, ethnographer and author Matthew Desmond follows eight poor families
  in Milwaukee, Wisconsin, as they struggle to establish and maintain one of humanity’s most basic needs:
  housing. As an ethnographer, Desmond gathers research to promote the study and documentation of human
  culture: how people live under all kinds of conditions.</p>

  <p>Ethos. By mentioning Desmond’s qualifications as an ethnographer, Eliana Evans appeals to ethos:
  Desmond is an authority whose opinions can be taken seriously. Introductory Anecdote. By beginning with
  a real-life example and addressing the reader directly, the writer immediately emphasizes Desmond’s
  hard-hitting point. This strategy engages readers from the start.</p>

  <p>Living and working in the typical mid-size American city of Milwaukee in the early 2000s, Desmond
  highlights the source of the cyclical poverty he observes around him. He concludes that unstable housing
  is “deeply . . . implicated in the creation of poverty” (5). Thesis Statement. The writer notes that
  Desmond offers his thesis statement, or the main point of his argument, without delay, building off
  the specific example in the introduction. Throughout his book, Desmond explains that inflated rents
  and evictions— the forced loss of housing—create power imbalances between landlords and tenants. Legal
  and economic systems rigged against the poor are to blame for creating an unbreakable cycle of poverty
  for renters. To advance his deductive argument, Desmond largely employs emotional anecdotal evidence,
  introducing readers to the real-life circumstances of eight families, thus using pathos to reach his
  readers. To reinforce this anecdotal evidence, he also employs logical statistical evidence as well
  as emotional allusions to the nation’s founding principle of equality. To bring his book to life, Desmond
  uses many quotations from the people he portrays in the cycle of poverty. Early in the book, he describes
  the life of Sherrena Tarver, an entrepreneur landlord who owns and manages numerous properties and has
  to evict nonpaying tenants in the most difficult circumstance. At one point, she faces a tough decision
  about Lamar, a legless man who occupies an apartment where he helps neighborhood boys stay in school
  and control their lives. He simply cannot meet his financial responsibilities, and Sherrena is torn
  between helping him and protecting her own bottom line. “I guess I got to stop feeling sorry for these
  people because nobody is feeling sorry for me,” she states (11). She will have to pay her own mortgage
  on the property. No connection exists if others do not feel sorry for Sherrena, who has to face her
  own inner conflict about Lamar. Ethos, Pathos, and Logos. Desmond speaks with authority as someone who
  cares deeply about the injustices of the housing situation. Evans notes that Desmond also relies on
  emotional and logical thought and examples, and she shows this in his quotations. Although his book
  identifies unstable housing as a cause of poverty, Desmond writes for the purpose of creating empathy
  in voters and establishing facts that policy makers cannot ignore to remedy the housing trap. The moving
  description of eviction and its effects allows readers to fully appreciate his proposed solutions. As
  a main point, Desmond advocates for legislation that would establish a universal housing voucher program
  combined with government regulation to stabilize rents. He explains that voucher “programs lift roughly
  2.8 million people out of poverty” each year (302). If these programs were expanded and supported by
  laws that would prevent landlords from establishing exploitative rents, many more people could be helped.
  Desmond hopes to convince voters who have been moved by his ethnographic discussion to elect candidates
  who are serious about ending poverty and creating a more equal America. Language Use. Evans uses the
  phrase “as a main point” to emphasize to readers that Desmond strongly believes in the voucher system.</p>

  <p>In support of his argument, Desmond presents multiple anecdotal examples to illustrate the root of
  the cyclical poverty his subjects face. For example, in Chapter 16, Kamala, a middle-aged mother of
  three, leaves her children for one evening in the care of Devon, their father. Later, a fire caused
  by a lamp kills their eight-monthold daughter. The apartment is uninhabitable, but the landlord, Sherrena,
  keeps the month’s rent. The police report that the three children, abandoned by Devon, were alone in
  the apartment. The high cost of monthly rent leaves Kamala with few options for proper childcare, and
  without childcare, she has few options for employment. The exploitation by landlords such as Sherrena
  only intensifies the tenant’s poverty. Kamala, who still has two children to support, is left with no
  home, no money, and little means of survival. Her story, and the stories of the many others Desmond
  chronicles, supports the argument that unstable housing is a cause of poverty, not a condition.</p>

  <p>Examples and Pathos. Desmond’s discussion gains emotional strength from the story of a child’s needless
  death.</p>

  <p>Pathos and Logos. The logic of the situation is that a family must endure hardship with little support.
  The overwhelming need and the trap of poverty in poor housing make for strong logical and emotional
  persuasion.</p>

  <p>Desmond relays the stories of Kamala and others to generate empathy with readers. These stories create
  emotional appeal in that they allow readers to experience the spiraling effects of poverty along with
  people they come to care about. Indeed, Desmond relies on the intensity of Kamala’s story to give poverty
  a face. Kamala is no longer a nameless, faceless statistic. She is a real woman who experiences the
  loss of a child as a result of circumstances beyond her control. Kamala’s story helps break the preconception
  that poor people are lazy and make individual choices to perpetuate their own poverty. Her situation
  illustrates a cycle of unbreakable tragedy and poverty that begins with her inability to secure affordable
  and stable housing. The details of her story make it hard for the public to ignore.</p>

  <p>Desmond does not rely on anecdotal evidence alone. He also includes statistical evidence to support
  his argument.</p>

  <p>Logical Evidence. The writer notes Desmond’s use of quantitative evidence—an appeal to logic. Readers
  are eager to learn facts that will strengthen the impact of Desmond’s argument.</p>

  <p>In the prologue, Desmond explains that Arleen pays “88 percent of [her] $628-a-month welfare check”
  in rent (3). This disproportionate sum creates a situation in which “1 in 8 poor renting families nationwide
  [are] unable to pay all of their rent” (5). In Milwaukee, “landlords evict roughly 16,000 adults and
  children each year” (4). Such numbers go beyond empathy and instead appeal to logic. Policy makers are
  likely to reject the idea of drafting laws to relieve poverty based on feelings or empathy. Statistics,
  however, provide hard numbers that are not subject to debate and that reinforce the need for logical
  and realistic solutions. Desmond also notes that eviction and its effects have been vastly ignored by
  sociologists. These statistics fight preconceptions such as Why don’t poor people just get jobs? In
  addition, by using personification, Desmond explains that poverty is a formidable enemy that a minimum-wage
  job cannot defeat.</p>

  <p>Logos. As a skilled writer, Desmond knows that if political action is called for, he will have to
  present a heavy dose of facts and numbers. Evans notes that readers are more likely to be persuaded
  by a combination of different rhetorical strategies, such as pathos and logos.</p>

  <p>Personification. Evans notes that Desmond uses figurative language to personify the idea of poverty,
  calling it “a formidable enemy.”</p>

  <p>Finally, Desmond appeals to his readers’ sense of right and wrong when he asks a key rhetorical question:
  Is housing a fundamental American right? If readers answer “yes,” then it is un-American to systematically
  lock poor people away from the founding ideals of the country through housing, banking, and legal systems
  that work to guarantee their poverty. The American dream is one of equal opportunity. Yet, despite the
  constitutional guarantee of civil rights, the poor people who struggle to maintain housing in Desmond’s
  Milwaukee are further separated from the American dream by race.</p>

  <p>For example, in Chapter 3, Desmond describes the segregation that has long plagued Milwaukee: despite
  the “open housing measure” guaranteed by “the 1968 Civil Rights Act,” Milwaukee “remain[s] one of the
  most racially divided cities in the nation” (34). The housing divide in Milwaukee not only keeps poor
  people from achieving the American dream of stable and affordable housing, but it also supports a system
  of segregation that goes against the founding ideal of equality. Logos and Pathos. Desmond addresses
  the issue of right vs. wrong. He attempts to persuade readers by offering examples that make them think
  about the legal aspects of housing (logos) and the effects that deprivation have on individuals (pathos).
  Desmond’s argument is enticing in many ways. However, critics point out that he proposes a solution
  that fixes only the short-term problem of sustaining stable housing with a universal voucher program
  that provides no incentive for work. The long-term problem, which Desmond never addresses, would have
  to include a solution that would raise a massive number of people out of poverty by enabling them to
  sustain reliable housing, along with other living expenses, without relying heavily on government assistance.
  Vouchers may begin to eat away at the root of poverty, but they are a short-term, rather than a long-term,
  fix. Addressing Counterclaims. Evans is careful to include some possibly negative views of Desmond’s
  main points to indicate that she has considered all sides before reaching a final verdict on the validity
  of his argument. In the end, though, Desmond’s argument is effective because he provides ample evidence
  with varying appeals to support his claims. The use of anecdotes allows readers to feel the pain of
  poverty. Desmond’s statistical research shows logical reasons to end poverty through universal housing.
  The mentions of founding principles such as equality show that readers have a moral obligation as Americans
  to participate in a solution to the housing crisis. Although much of Desmond’s book relies on its anecdotal
  evidence and emotional appeal, it is his logic that ultimately proves convincing. He identifies a tangible
  cause of poverty, then offers an equally tangible solution to the problem he describes. If having stable
  and affordable housing will help end poverty and thus improve society, then the government should provide
  this through vouchers and rent regulation. Conclusion and Thesis Statement Reaffirmed. Evans praises
  Desmond for his rhetorical ability to appeal to readers in different ways. She claims that his logical
  approach, presenting facts and figures along with emotional appeals, should be enough to convince the
  government to act.</p>

  <h3>Work Cited</h3>

  <p>Desmond, Matthew. Evicted: Poverty and Profit in the American City. Broadway Books, 2016.</p>

  <h3>Discussion Questions</h3>

  <p>1. Why do you think Eliana Evans begins her rhetorical analysis with an example about the problems
  of paying rent and living on a reduced income?</p>

  <p>2. How does Evans portray Desmond as someone worth listening to? 3. How does Evans evaluate Desmond’s
  use of logic in arguing his points? 4. According to Evans, how does Desmond use pathos in persuading
  readers? 5. What is Evans’s final opinion of Desmond’s ability to persuade? Explain.</p>

  <p>9.5 Writing Process: Thinking Critically about Rhetoric</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Develop a rhetorical analysis through multiple
  drafts. • Identify and analyze rhetorical strategies in a rhetorical analysis. • Demonstrate flexible
  strategies for generating ideas, drafting, reviewing, collaborating, revising, rewriting, and editing.
  • Give and act on productive feedback for works in progress.</p>

  <p>The ability to think critically about rhetoric is a skill you will use in many of your classes, in
  your work, and in your life to gain insight from the way a text is written and organized. You will often
  be asked to explain or to express an opinion about what someone else has communicated and how that person
  has done so, especially if you take an active interest in politics and government. Like Eliana Evans
  in the previous section, you will develop similar analyses of written works to help others understand
  how a writer or speaker may be trying to reach them.</p>

  <h3>Summary of Assignment: Rhetorical Analysis</h3>

  <p>The assignment is to write a rhetorical analysis of a piece of persuasive writing. It can be an editorial,
  a movie or book review, an essay, a chapter in a book, or a letter to the editor. For your rhetorical
  analysis, you will need to consider the rhetorical situation—subject, author, purpose, context, audience,
  and culture—and the strategies the author uses in creating the argument. Back up all your claims with
  evidence from the text. In preparing your analysis, consider these questions:</p>

  <ul><li>What is the subject? Be sure to distinguish what the piece is about. • Who is the writer, and
  what do you know about them? Be sure you know whether the writer is considered objective or has a particular
  agenda. • Who are the readers? What do you know or what can you find out about them as the particular
  audience to be addressed at this moment? • What is the purpose or aim of this work? What does the author
  hope to achieve? • What are the time/space/place considerations and influences of the writer? What can
  you know about the writer and the full context in which they are writing? • What specific techniques
  has the writer used to make their points? Are these techniques successful, unsuccessful, or questionable?</li></ul>

  <p>For this assignment, read the following opinion piece by Octavio Peterson, printed in his local newspaper.
  You may choose it as the text you will analyze, continuing the analysis on your own, or you may refer
  to it as a sample as you work on another text of your choosing. Your instructor may suggest presidential
  or other political speeches, which make good subjects for rhetorical analysis.</p>

  <p>When you have read the piece by Peterson advocating for the need to continue teaching foreign languages
  in schools, reflect carefully on the impact the letter has had on you. You are not expected to agree
  or disagree with it. Instead, focus on the rhetoric—the way Peterson uses language to make his point
  and convince you of the validity of his argument.</p>

  <p>Another Lens. Consider presenting your rhetorical analysis in a multimodal format. Use a blogging
  site or platform such as WordPress or Tumblr to explore the blogging genre, which includes video clips,
  images, hyperlinks, and other media to further your discussion. Because this genre is less formal than
  written text, your tone can be conversational. However, you still will be required to provide the same
  kind of analysis that you would in a traditional essay. The same materials will be at your disposal
  for making appeals to persuade your readers. Rhetorical analysis in a blog may be a new forum for the
  exchange of ideas that retains the basics of more formal communication. When you have completed your
  work, share it with a small group or the rest of the class. See Multimodal and Online Writing: Creative
  Interaction between Text and Image for more about creating a multimodal composition.</p>

  <h3>Quick Launch: Start with a Thesis Statement</h3>

  <p>After you have read this opinion piece, or another of your choice, several times and have a clear
  understanding of it as a piece of rhetoric, consider whether the writer has succeeded in being persuasive.
  You might find that in some ways they have and in others they have not. Then, with a clear understanding
  of your purpose—to analyze how the writer seeks to persuade—you can start framing a thesis statement:
  a declarative sentence that states the topic, the angle you are taking, and the aspects of the topic
  the rest of the paper will support.</p>

  <p>Complete the following sentence frames as you prepare to start:</p>

  <p>1. The subject of my rhetorical analysis is ________. 2. My goal is to ________, not necessarily
  to ________. 3. The writer’s main point is ________. 4. I believe the writer has succeeded (or not)
  because ________. 5. I believe the writer has succeeded in ________ (name the part or parts) but not
  in ________ (name the part or parts). 6. The writer’s strongest (or weakest) point is ________, which
  they present by ________.</p>

  <h3>Drafting: Text Evidence and Analysis of Effect</h3>

  <p>As you begin to draft your rhetorical analysis, remember that you are giving your opinion on the
  author’s use of language. For example, Peterson has made a decision about the teaching of foreign languages,
  something readers of the newspaper might have different views on. In other words, there is room for
  debate and persuasion.</p>

  <p>The context of the situation in which Peterson finds himself may well be more complex than he discusses.
  In the same way, the context of the piece you choose to analyze may also be more complex. For example,
  perhaps Greendale is facing an economic crisis and must pare its budget for educational spending and
  public works. It’s also possible that elected officials have made budget cuts for education a part of
  their platform or that school buildings have been found obsolete for safety measures. On the other hand,
  maybe a foreign company will come to town only if more Spanish speakers can be found locally. These
  factors would play a part in a real situation, and rhetoric would reflect that. If applicable, consider
  such possibilities regarding the subject of your analysis. Here, however, these factors are unknown
  and thus do not enter into the analysis.</p>

  <h3>Introduction</h3>

  <p>One effective way to begin a rhetorical analysis is by using an anecdote, as Eliana Evans has done.
  For a rhetorical analysis of the opinion piece, a writer might consider an anecdote about a person who
  was in a situation in which knowing another language was important or not important. If they begin with
  an anecdote, the next part of the introduction should contain the following information:</p>

  <ul><li>Author’s name and position, or other qualification to establish ethos • Title of work and genre
  • Author’s thesis statement or stance taken (“Peterson argues that . . .”) • Brief introductory explanation
  of how the author develops and supports the thesis or stance • If relevant, a brief summary of context
  and culture</li></ul>

  <p>Once the context and situation for the analysis are clear, move directly to your thesis statement.
  In this case, your thesis statement will be your opinion of how successful the author has been in achieving
  the established goal through the use of rhetorical strategies. Read the sentences in Table 9.1, and
  decide which would make the best thesis statement. Explain your reasoning in the right-hand column of
  this or a similar chart.</p>

  <h3>Sentence</h3>

  <p>Only 50 percent of the students have said they want to study Spanish or any other language, so statistics
  show a lack of interest in spite of Octavio Peterson’s rhetorical claims.</p>

  <p>A public vote should be taken to see how many residents support Octavio Peterson’s rhetoric and ideas
  on language and whether his divisive opinion can be considered as it stands.</p>

  <p>Because Octavio Peterson’s ideas on foreign language teaching are definitely worthy of support, I
  will summarize his letter and show why he is correct.</p>

  <p>This analysis of Peterson’s language shows how he uses rhetorical strategies to persuade readers
  to consider the future of language learning in the city’s schools.</p>

  <p>Why or Why Not?</p>

  <p>The introductory paragraph or paragraphs should serve to move the reader into the body of the analysis
  and signal what will follow.</p>

  <h3>Body</h3>

  <p>Your next step is to start supporting your thesis statement—that is, how Octavio Peterson, or the
  writer of your choice, does or does not succeed in persuading readers. To accomplish this purpose, you
  need to look closely at the rhetorical strategies the writer uses.</p>

  <p>First, list the rhetorical strategies you notice while reading the text, and note where they appear.
  Keep in mind that you do not need to include every strategy the text contains, only those essential
  ones that emphasize or support the central argument and those that may seem fallacious. You may add
  other strategies as well. The first example in Table 9.2 has been filled in.</p>

  <p>Rhetorical Device/ Strategy</p>

  <p>Paragraph(s) Location</p>

  <p>Effect on Argument</p>

  <h3>Ethos, credibility</h3>

  <p>By referring to himself, his education, his job, and his community involvement as First, second,
  a parent and concerned resident and by saying he has researched the subject, fourth the writer establishes
  credibility.</p>

  <p>Pathos, emotion</p>

  <p>Logos, reason</p>

  <p>Rhetorical Device/ Strategy</p>

  <p>Paragraph(s) Location</p>

  <p>Kairos, timeliness</p>

  <p>Repetition</p>

  <p>Figurative language</p>

  <p>Speaking familiarly or “folksily”</p>

  <p>Rhetorical question</p>

  <p>Parallel structure</p>

  <p>Addressing counterclaims</p>

  <p>Bandwagon</p>

  <p>Ad hominem (namecalling)</p>

  <p>Hyperbole (exaggeration)</p>

  <p>Causal fallacy</p>

  <h3>Effect on Argument</h3>

  <p>When you have completed your list, consider how to structure your analysis. You will have to decide
  which of the writer’s statements are most effective. The strongest point would be a good place to begin;
  conversely, you could begin with the writer’s weakest point if that suits your purposes better. The
  most obvious organizational structure is one of the following:</p>

  <ul><li>Go through the composition paragraph by paragraph and analyze its rhetorical content, focusing
  on the strategies that support the writer’s thesis statement.</li><li>Address key rhetorical strategies
  individually, and show how the author has used them.</li></ul>

  <p>As you read the next few paragraphs, consult Table 9.3 for a visual plan of your rhetorical analysis.
  Your first body paragraph is the first of the analytical paragraphs. Here, too, you have options for
  organizing. You might begin by stating the writer’s strongest point. For example, you could emphasize
  that Peterson appeals to ethos by speaking personally to readers as fellow citizens and providing his
  credentials to establish credibility as someone trustworthy with their interests at heart.</p>

  <p>Following this point, your next one can focus, for instance, on Peterson’s view that cutting foreign
  language instruction is a danger to the education of Greendale’s children. The points that follow support
  this argument, and you can track his rhetoric as he does so.</p>

  <p>You may then use the second or third body paragraph, connected by a transition, to discuss Peterson’s
  appeal to logos. One possible transition might read, “To back up his assertion that omitting foreign
  languages is detrimental to education, Peterson provides examples and statistics.” Locate examples and
  quotes from the text as needed. You can discuss how, in citing these statistics, Peterson uses logos
  as a key rhetorical strategy.</p>

  <p>In another paragraph, focus on other rhetorical elements, such as parallelism, repetition, and rhetorical
  questions. Moreover, be sure to indicate whether the writer acknowledges counterclaims and whether they
  are accepted or ultimately rejected.</p>

  <p>The question of other factors at work in Greendale regarding finances, or similar factors in another
  setting, may be useful to mention here if they exist. As you continue, however, keep returning to your
  list of rhetorical strategies and explaining them. Even if some appear less important, they should be
  noted to show that you recognize how the writer is using language. You will likely have a minimum of
  four body paragraphs, but you may well have six or seven or even more, depending on the work you are
  analyzing.</p>

  <p>In your final body paragraph, you might discuss the argument that Peterson, for example, has made
  by appealing to readers’ emotions. His calls for solidarity at the end of the letter provide a possible
  solution to his concern that the foreign language curriculum “might vanish like a puff of smoke.”</p>

  <p>Use Table 9.3 to organize your rhetorical analysis. Be sure that each paragraph has a topic sentence
  and that you use transitions to flow smoothly from one idea to the next.</p>

  <h3>Body paragraph 1</h3>

  <p>Write a topic sentence explaining your first point of analysis. If you begin with what you think
  is the writer’s strongest point, state what it is and explain the rhetorical strategies used to support
  it. Provide appropriate quotations from the text.</p>

  <p>Suggestion: Address ethos, pathos, and logos first. You may need more than one paragraph to cover
  them.</p>

  <h3>Body paragraph 2</h3>

  <p>If needed, continue your discussion of ethos, pathos, and/or logos, explaining how they function
  in the text and providing examples. Once you have completed your discussion, move on to your next point,
  which will address one or more specific strategies used.</p>

  <h3>Body paragraph 3</h3>

  <p>Following a transition, write a topic sentence to address another point or points in the text. Discuss
  the strategies used, provide examples and quotations as appropriate, and show how they support (or don’t
  support) the writer’s thesis statement. Consider rhetorical strategies such as parallelism, repetition,
  rhetorical questions, and figurative language.</p>

  <p>Body paragraphs 4–6 (or more if needed)</p>

  <p>Continue as needed. In this paragraph, you might point out rhetorical fallacies, such as bandwagon,
  ad hominem, or any others you notice, if you have not yet done so. Indicate how they strengthen or weaken
  the writer’s position. If you have already addressed all the elements of your analysis, discuss the
  writer’s approach to counterclaims. You may need more than four body paragraphs for your rhetorical
  analysis.</p>

  <h3>Conclusion</h3>

  <p>As you conclude your essay, your own logic in discussing the writer’s argument will make it clear
  whether you have found their claims convincing. Your opinion, as framed in your conclusion, may restate
  your thesis statement in different words, or you may choose to reveal your thesis at this point. The
  real function of the conclusion is to confirm your evaluation and show that you understand the use of
  the language and the effectiveness of the argument.</p>

  <p>In your analysis, note that objections could be raised because Peterson, for example, speaks only
  for himself. You may speculate about whether the next edition of the newspaper will feature an opposing
  opinion piece from someone who disagrees. However, it is not necessary to provide answers to questions
  you raise here. Your conclusion should summarize briefly how the writer has made, or failed to make,
  a forceful argument that may require further debate.</p>

  <p>For more guidance on writing a rhetorical analysis, visit the Illinois Writers Workshop website (https://openstax.org/r/Illinois)
  or watch this tutorial (https://openstax.org/r/this-tutorial).</p>

  <p>Peer Review: Guidelines toward Revision and the “Golden Rule”</p>

  <p>Now that you have a working draft, your next step is to engage in peer review, an important part
  of the writing process. Often, others can identify things you have missed or can ask you to clarify
  statements that may be clear to you but not to others. For your peer review, follow these steps and
  make use of Table 9.4.</p>

  <p>1. Quickly skim through your peer’s rhetorical analysis draft once, and then ask yourself, What is
  the main point or argument of my peer’s work?</p>

  <p>2. Highlight, underline, or otherwise make note of statements or instances in the paper where you
  think your peer has made their main point.</p>

  <p>3. Look at the draft again, this time reading it closely.</p>

  <p>4. Ask yourself the following questions, and comment on the peer review sheet as shown.</p>

  <p>Peer Review: Rhetorical Analysis Name of Writer: ________ Name of Reviewer: ________ Title</p>

  <ul><li>Is the title of this work straightforward and consistent with the content? If not, how can your
  peer revise their title?</li><li>If the title is more creative, does it attract readers and make them
  want to read further? If not, how can your peer revise the title?</li></ul>

  <p>Thesis Statement • Does the thesis statement succinctly communicate the purpose? If not, how can
  your peer better communicate this in a thesis statement? • Does your peer offer an appropriate discussion
  of their chosen rhetorical topic, purpose, writer, reader(s), and context? If not, how can your peer
  better address these areas? • Does your peer address the writer’s success in persuading readers and
  explain how the writer succeeds or does not succeed? If not, how can your peer better provide reasoning
  and text evidence to support their evaluation? • Depending on your peer’s approach, does the thesis
  statement appear in an appropriate place? If not, how can your peer improve the placement or strength
  of the statement?</p>

  <p>Body • Does your peer mention the three major appeals and provide sufficient explanations and examples
  of their use? If not, what needs to be added or revised? • Does your peer mention relevant rhetorical
  strategies and explain their functions? If not, how can your peer improve this part of the analysis?
  • Does your peer note any logical fallacies, explain why the author uses them, and analyze their effects
  on the text? If not, what does your peer need to add or change? • Does your peer note and explain the
  writer’s counterclaims? If the writer doesn’t address them, has your peer noted this omission? If not,
  what does your peer need to add?</p>

  <p>Conclusion • Does the conclusion support your peer’s thesis statement? If not, what revisions does
  your peer need to make?</p>

  <h3>The Golden Rule</h3>

  <p>An important part of the peer review process is to keep in mind the familiar wisdom of the “Golden
  Rule”: treat others as you would have them treat you. This foundational approach to human relations
  extends to commenting on others’ work. Like your peers, you are in the same situation of needing opinion
  and guidance. Whatever you have written will seem satisfactory or better to you because you have written
  it and know what you mean to say. However, your peers have the advantage of distance from the work you
  have written and can see it through their own eyes. Likewise, if you approach your peer’s work fairly
  and free of personal bias, you’re likely to be more constructive in finding parts of their writing that
  need revision. Most important, though, is to make suggestions tactfully and considerately, in the spirit
  of helping, not degrading someone’s work. You and your peers may be reluctant to share your work, but
  if everyone approaches the review process with these ideas in mind, everyone will benefit from the opportunity
  to provide and act on sincerely offered suggestions.</p>

  <h3>Revising: Staying Open to Feedback and Working with It</h3>

  <p>Once the peer review process is complete, your next step is to revise the first draft by incorporating
  suggestions and making changes on your own. Consider some of these potential issues when incorporating
  peers’ revisions and rethinking your own work.</p>

  <ul><li>Too much summarizing rather than analyzing • Too much informal language or an unintentional
  mix of casual and formal language • Too few, too many, or inappropriate transitions • Illogical or unclear
  sequence of information • Insufficient evidence to support main ideas effectively • Too many generalities
  rather than specific facts, maybe from trying to do too much in too little time</li></ul>

  <p>In any case, revising a draft is a necessary step to produce a final work. Rarely will even a professional
  writer arrive at the best point in a single draft. In other words, it’s seldom a problem if your first
  draft needs refocusing. However, it may become a problem if you don’t address it. The best way to shape
  a wandering piece of writing is to return to it, reread it, slow it down, take it apart, and build it
  back up again. Approach first-draft writing for what it is: a warm-up or rehearsal for a final performance.</p>

  <h3>Suggestions for Revising</h3>

  <p>When revising, be sure your thesis statement is clear and fulfills your purpose. Verify that you
  have abundant supporting evidence and that details are consistently on topic and relevant to your position.
  Just before arriving at the conclusion, be sure you have prepared a logical ending. The concluding statement
  should be strong and should not present any new points. Rather, it should grow out of what has already
  been said and return, in some degree, to the thesis statement. In the example of Octavio Peterson, his
  purpose was to persuade readers that teaching foreign languages in schools in Greendale should continue;
  therefore, the conclusion can confirm that Peterson achieved, did not achieve, or partially achieved
  his aim.</p>

  <p>When revising, make sure the larger elements of the piece are as you want them to be before you revise
  individual sentences and make smaller changes. If you make small changes first, they might not fit well
  with the big picture later on.</p>

  <p>One approach to big-picture revising is to check the organization as you move from paragraph to paragraph.
  You can list each paragraph and check that its content relates to the purpose and thesis statement.
  Each paragraph should have one main point and be self-contained in showing how the rhetorical devices
  used in the text strengthen (or fail to strengthen) the argument and the writer’s ability to persuade.
  Be sure your paragraphs flow logically from one to the other without distracting gaps or inconsistencies.</p>

  <p>9.6 Editing Focus: Mixed Sentence Constructions</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Apply knowledge of linguistic structures, including
  grammar and punctuation. • Recognize and correct errors in mixed sentence construction.</p>

  <p>A mixed-construction sentence contains parts that do not fit together because of grammatical structure
  or meaning. These sentence errors occur when writers begin a statement in one way, or one direction,
  and then unintentionally change grammatical paths. This kind of sentence construction can detract from
  an otherwise solidly analytical text.</p>

  <ul><li>Mixed Sentence 1: Learning to ballroom dance it has shown increased agility, and you live longer.</li></ul>

  <p>First Problem: The reader expects a verb to follow “learning to ballroom dance” so that learning
  will mean something. But the word it interrupts before the verb appears. It collides with the first
  part of the sentence rather than completing it, and the sentence ends up making little sense. Second
  Problem: The second part of the sentence, “and you live longer,” is confusing because it introduces
  you instead of continuing the idea of learning to ballroom dance. To eliminate confusion, you would
  have to rewrite either the first or the second part of the sentence. Revised: Studies have shown that
  learning to ballroom dance increases agility and lengthens life span. In fact, because it is the dancing
  itself and not the learning that has these effects, the sentence could be edited further. Further Revision:
  Ballroom dancing has been shown to increase agility and lengthen life. In the following examples, the
  writer needs to revise either the second part to fit with the first part or the first part to fit with
  the second. • Mixed Sentence 2: By starting my general studies classes last semester gave me the opportunity
  to take classes in my major this fall. Second Part Revised: By starting my general studies classes last
  spring, I had the opportunity to take classes in my major this fall. First Part Revised: Starting my
  general studies classes last spring gave me the opportunity to take classes in my major this fall. Read
  the following mixed-construction sentences, and note the ways they have been corrected. • Mixed Sentence
  3: For people who have hobbies, they are happier than others. Revision: People who have hobbies are
  happier than others. • Mixed Sentence 4: The required qualification is someone who writes well. Problem:
  The qualification is the ability to write well, not the person. Revision: The required qualification
  is the ability to write well. Further Revision: The company requires someone who writes well. • Mixed
  Sentence 5: Nurses, an excellent career choice, involves an extra semester. Problem: Nurses are not
  a profession, nursing is. Revision: Nursing, an excellent career choice, involves an extra semester.</p>

  <h3>Just Because… Doesn’t Mean and Is When Constructions</h3>

  <p>Just because . . . doesn’t mean constructions are common in speech but should be avoided in writing.
  They are another example of mixed sentence construction.</p>

  <ul><li>Just Because . . . Construction: Just because I want to work in Washington doesn’t mean I’ll
  get a good job there. Revision: Simply wanting to work in Washington doesn’t guarantee a good job there.
  Revision: Although I want to work in Washington, I will need to find a good job there.</li></ul>

  <p>Another common mixed construction in spoken English involves the use of is when. This construction
  should also be avoided in writing.</p>

  <ul><li>Is When Construction: A feeling of accomplishment is when I finish revising a paper.</li></ul>

  <p>Problem: “A feeling of accomplishment” is a noun phrase followed by a linking verb. This construction
  means that what follows the verb either describes the noun or renames it in different words. Therefore,
  to balance the sentence, you need an adjective or noun to complete the subject. When, however, is an
  adverb referring to time, and in this sentence, it begins an adverb clause. In other words, “a feeling”
  cannot be the same as or described in terms of time.</p>

  <p>Revision: A feeling of accomplishment is finishing revising a paper.</p>

  <p>Revision: I feel a sense of accomplishment when I finish revising a paper.</p>

  <h3>Your Turn</h3>

  <p>Now, correct the following mixed-construction sentences. After you have finished, go back and check
  your rhetorical analysis for mixed-construction sentences, and revise them as needed.</p>

  <p>1. Putting your computer to sleep is when you can save the most electricity. 2. If you plant your
  seeds too close, anyone knows tomatoes cannot grow with corn. 3. Swimming in deep water is the danger
  of tides. 4. Just because you like math doesn’t mean to eliminate classes in the humanities. 5. For
  people who want to be firefighters may have to work long and often intense shifts.</p>

