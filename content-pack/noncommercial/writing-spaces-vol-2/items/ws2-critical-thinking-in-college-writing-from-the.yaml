body: "<p>Critical Thinking in College</p>\n<p>Writing: From the Personal to the</p>\n<p>Academic</p>\n\
  <p>Gita DasBender</p>\n<p>There is something about the term “critical thinking” that makes you draw\
  \ a blank every time you think about what it means.* It seems so fuzzy and abstract that you end up\
  \ feeling uncomfortable, as though the term is thrust upon you, demanding an intellectual effort that\
  \ you may not yet have. But you know it requires you to enter a realm of smart, complex ideas that others\
  \ have written about and that you have to navigate, understand, and interact with just as intelligently.\
  \ It’s a lot to ask for. It makes you feel like a stranger in a strange land.</p>\n<p>As a writing teacher\
  \ I am accustomed to reading and responding to difficult texts. In fact, I like grappling with texts\
  \ that have interesting ideas no matter how complicated they are because I understand their value. I\
  \ have learned through my years of education that what ultimately engages me, keeps me enthralled, is\
  \ not just grammatically pristine, fluent writing, but writing that forces me to think beyond the page.\
  \ It is writing where the writer has challenged herself and then offered up that challenge to the reader,\
  \ like a baton in a relay race. The idea is to run with the baton.</p>\n<p>* This work is licensed under\
  \ the Creative Commons AttributionNoncommercial-ShareAlike 3.0 United States License and is subject\
  \ to the Writing Spaces’ Terms of Use. To view a copy of this license, visit http:// creativecommons.org/licenses/by-nc-sa/3.0/us/\
  \ or send a letter to Creative Commons, 171 Second Street, Suite 300, San Francisco, California, 94105,\
  \ USA. To view the Writing Spaces’ Terms of Use, visit http://writingspaces. org/terms-of-use.</p>\n\
  <h3>Gita DasBender</h3>\n<p>You will often come across critical thinking and analysis as requirements\
  \ for assignments in writing and upper-level courses in a variety of disciplines. Instructors have varying\
  \ explanations of what they actually require of you, but, in general, they expect you to respond thoughtfully\
  \ to texts you have read. The first thing you should remember is not to be afraid of critical thinking.\
  \ It does not mean that you have to criticize the text, disagree with its premise, or attack the writer\
  \ simply because you feel you must. Criticism is the process of responding to and evaluating ideas,\
  \ argument, and style so that readers understand how and why you value these items.</p>\n<p>Critical\
  \ thinking is also a process that is fundamental to all disciplines. While in this essay I refer mainly\
  \ to critical thinking in composition, the general principles behind critical thinking are strikingly\
  \ similar in other fields and disciplines. In history, for instance, it could mean examining and analyzing\
  \ primary sources in order to understand the context in which they were written. In the hard sciences,\
  \ it usually involves careful reasoning, making judgments and decisions, and problem solving. While\
  \ critical thinking may be subject-specific, that is to say, it can vary in method and technique depending\
  \ on the discipline, most of its general principles such as rational thinking, making independent evaluations\
  \ and judgments, and a healthy skepticism of what is being read, are common to all disciplines. No matter\
  \ the area of study, the application of critical thinking skills leads to clear and flexible thinking\
  \ and a better understanding of the subject at hand.</p>\n<p>To be a critical thinker you not only have\
  \ to have an informed opinion about the text but also a thoughtful response to it. There is no doubt\
  \ that critical thinking is serious thinking, so here are some steps you can take to become a serious\
  \ thinker and writer.</p>\n<h3>Attentive Reading: A Foundation for Critical Thinking</h3>\n<p>A critical\
  \ thinker is always a good reader because to engage critically with a text you have to read attentively\
  \ and with an open mind, absorbing new ideas and forming your own as you go along. Let us imagine you\
  \ are reading an essay by Annie Dillard, a famous essayist, called “Living like Weasels.” Students are\
  \ drawn to it because the idea of the essay appeals to something personally fundamental to all of us:\
  \ how to</p>\n<p>Critical Thinking in College Writing live our lives. It is also a provocative essay\
  \ that pulls the reader into the argument and forces a reaction, a good criterion for critical thinking.</p>\n\
  <p>So let’s say that in reading the essay you encounter a quote that gives you pause. In describing\
  \ her encounter with a weasel in Hollins Pond, Dillard says, “I would like to learn, or remember, how\
  \ to live . . . I don’t think I can learn from a wild animal how to live in particular . . . but I might\
  \ learn something of mindlessness, something of the purity of living in the physical senses and the\
  \ dignity of living without bias or motive” (220). You may not be familiar with language like this.\
  \ It seems complicated, and you have to stop ever so often (perhaps after every phrase) to see if you\
  \ understood what Dillard means. You may ask yourself these questions:</p>\n<ul><li>What does “mindlessness”\
  \ mean in this context? •• How can one “learn something of mindlessness?” •• What does Dillard mean\
  \ by “purity of living in the physical senses?” •• How can one live “without bias or motive?”</li></ul>\n\
  <p>These questions show that you are an attentive reader. Instead of simply glossing over this important\
  \ passage, you have actually stopped to think about what the writer means and what she expects you to\
  \ get from it. Here is how I read the quote and try to answer the questions above: Dillard proposes\
  \ a simple and uncomplicated way of life as she looks to the animal world for inspiration. It is ironic\
  \ that she admires the quality of “mindlessness” since it is our consciousness, our very capacity to\
  \ think and reason, which makes us human, which makes us beings of a higher order. Yet, Dillard seems\
  \ to imply that we need to live instinctually, to be guided by our senses rather than our intellect.\
  \ Such a “thoughtless” approach to daily living, according to Dillard, would mean that our actions would\
  \ not be tainted by our biases or motives, our prejudices. We would go back to a primal way of living,\
  \ like the weasel she observes. It may take you some time to arrive at this understanding on your own,\
  \ but it is important to stop, reflect, and ask questions of the text whenever you feel stumped by it.\
  \ Often such questions will be helpful during class discussions and peer review sessions.</p>\n<p>Gita\
  \ DasBender</p>\n<p>Listing Important Ideas</p>\n<p>When reading any essay, keep track of all the important\
  \ points the writer makes by jotting down a list of ideas or quotations in a notebook. This list not\
  \ only allows you to remember ideas that are central to the writer’s argument, ideas that struck you\
  \ in some way or the other, but it also you helps you to get a good sense of the whole reading assignment\
  \ point by point. In reading Annie Dillard’s essay, we come across several points that contribute toward\
  \ her proposal for better living and that help us get a better understanding of her main argument. Here\
  \ is a list of some of her ideas that struck me as important:</p>\n<p>1. “The weasel lives in necessity\
  \ and we live in choice, hating necessity and dying at the last ignobly in its talons” (220).</p>\n\
  <p>2. “And I suspect that for me the way is like the weasel’s: open to time and death painlessly, noticing\
  \ everything, remembering nothing, choosing the given with a fierce and pointed will” (221).</p>\n<p>3.\
  \ “We can live any way we want. People take vows of poverty, chastity, and obedience—even of silence—by\
  \ choice. The thing is to stalk your calling in a certain skilled and supple way, to locate the most\
  \ tender and live spot and plug into that pulse” (221).</p>\n<p>4. “A weasel doesn’t ‘attack’ anything;\
  \ a weasel lives as he’s meant to, yielding at every moment to the perfect freedom of single necessity”\
  \ (221).</p>\n<p>5. “I think it would be well, and proper, and obedient, and pure, to grasp your one\
  \ necessity and not let it go, to dangle from it limp wherever it takes you” (221).</p>\n<p>These quotations\
  \ give you a cumulative sense of what Dillard is trying to get at in her essay, that is, they lay out\
  \ the elements with which she builds her argument. She first explains how the weasel lives, what she\
  \ learns from observing the weasel, and then prescribes a lifestyle she admires—the central concern\
  \ of her essay.</p>\n<h3>Critical Thinking in College Writing</h3>\n<p>Noticing Key Terms and Summarizing\
  \ Important Quotes</p>\n<p>Within the list of quotations above are key terms and phrases that are critical\
  \ to your understanding of the ideal life as Dillard describes it. For instance, “mindlessness,” “instinct,”\
  \ “perfect freedom of a single necessity,” “stalk your calling,” “choice,” and “fierce and pointed will”\
  \ are weighty terms and phrases, heavy with meaning, that you need to spend time understanding. You\
  \ also need to understand the relationship between them and the quotations in which they appear. This\
  \ is how you might work on each quotation to get a sense of its meaning and then come up with a statement\
  \ that takes the key terms into account and expresses a general understanding of the text:</p>\n<p>Quote\
  \ 1: Animals (like the weasel) live in “necessity,” which means that their only goal in life is to survive.\
  \ They don’t think about how they should live or what choices they should make like humans do. According\
  \ to Dillard, we like to have options and resist the idea of “necessity.” We fight death—an inevitable\
  \ force that we have no control over—and yet ultimately surrender to it as it is the necessary end of\
  \ our lives.</p>\n<p>Quote 2: Dillard thinks the weasel’s way of life is the best way to live. It implies\
  \ a pure and simple approach to life where we do not worry about the passage of time or the approach\
  \ of death. Like the weasel, we should live life in the moment, intensely experiencing everything but\
  \ not dwelling on the past. We should accept our condition, what we are “given,” with a “fierce and\
  \ pointed will.” Perhaps this means that we should pursue our one goal, our one passion in life, with\
  \ the same single-minded determination and tenacity that we see in the weasel.</p>\n<p>Quote 3: As humans,\
  \ we can choose any lifestyle we want. The trick, however, is to go after our one goal, one passion\
  \ like a stalker would after a prey.</p>\n<p>Quote 4: While we may think that the weasel (or any animal)\
  \ chooses to attack other animals, it is really only surrendering to the one thing it knows: its need\
  \ to live. Dillard tells us there is “the perfect freedom” in this desire to survive because to</p>\n\
  <p>Gita DasBender her, the lack of options (the animal has no other option than to fight to survive)\
  \ is the most liberating of all.</p>\n<p>Quote 5: Dillard urges us to latch on to our deepest passion\
  \ in life (the “one necessity”) with the tenacity of a weasel and not let go. Perhaps she’s telling\
  \ us how important it is to have an unwavering focus or goal in life.</p>\n<h3>Writing a Personal Response:\
  \ Looking Inward</h3>\n<p>Dillard’s ideas will have certainly provoked a response in your mind, so if\
  \ you have some clear thoughts about how you feel about the essay this is the time to write them down.\
  \ As you look at the quotes you have selected and your explanation of their meaning, begin to create\
  \ your personal response to the essay. You may begin by using some of these strategies:</p>\n<p>1. Tell\
  \ a story. Has Dillard’s essay reminded you of an experience you have had? Write a story in which you\
  \ illustrate a point that Dillard makes or hint at an idea that is connected to her essay.</p>\n<p>2.\
  \ Focus on an idea from Dillard’s essay that is personally important to you. Write down your thoughts\
  \ about this idea in a first person narrative and explain your perspective on the issue.</p>\n<p>3.\
  \ If you are uncomfortable writing a personal narrative or using “I” (you should not be), reflect on\
  \ some of her ideas that seem important and meaningful in general. Why were you struck by these ideas?</p>\n\
  <p>4. Write a short letter to Dillard in which you speak to her about the essay. You may compliment\
  \ her on some of her ideas by explaining why you like them, ask her a question related to her essay\
  \ and explain why that question came to you, and genuinely start up a conversation with her.</p>\n<p>This\
  \ stage in critical thinking is important for establishing your relationship with a text. What do I\
  \ mean by this “relationship,” you may ask? Simply put, it has to do with how you feel about the text.\
  \ Are you amazed by how true the ideas seem to be, how wise Dillard sounds? Or are you annoyed by Dillard’s\
  \ let-me-tell-you-how-to-live approach and disturbed by the impractical ideas she so easily prescribes?\
  \ Do you find Dillard’s voice and style thrilling and engaging or merely confus-</p>\n<p>Critical Thinking\
  \ in College Writing ing? No matter which of the personal response options you select, your initial\
  \ reaction to the text will help shape your views about it.</p>\n<h3>Making an Academic Connection:\
  \ Looking Outward</h3>\n<p>First year writing courses are designed to teach a range of writing— from\
  \ the personal to the academic—so that you can learn to express advanced ideas, arguments, concepts,\
  \ or theories in any discipline. While the example I have been discussing pertains mainly to college\
  \ writing, the method of analysis and approach to critical thinking I have demonstrated here will serve\
  \ you well in a variety of disciplines. Since critical thinking and analysis are key elements of the\
  \ reading and writing you will do in college, it is important to understand how they form a part of\
  \ academic writing. No matter how intimidating the term “academic writing” may seem (it is, after all,\
  \ associated with advanced writing and becoming an expert in a field of study), embrace it not as a\
  \ temporary college requirement but as a habit of mind.</p>\n<p>To some, academic writing often implies\
  \ impersonal writing, writing that is detached, distant, and lacking in personal meaning or relevance.\
  \ However, this is often not true of the academic writing you will do in a composition class. Here your\
  \ presence as a writer—your thoughts, experiences, ideas, and therefore who you are—is of much significance\
  \ to the writing you produce. In fact, it would not be farfetched to say that in a writing class academic\
  \ writing often begins with personal writing. Let me explain. If critical thinking begins with a personal\
  \ view of the text, academic writing helps you broaden that view by going beyond the personal to a more\
  \ universal point of view. In other words, academic writing often has its roots in one’s private opinion\
  \ or perspective about another writer’s ideas but ultimately goes beyond this opinion to the expression\
  \ of larger, more abstract ideas. Your personal vision—your core beliefs and general approach to life—\
  \ will help you arrive at these “larger ideas” or universal propositions that any reader can understand\
  \ and be enlightened by, if not agree with. In short, academic writing is largely about taking a critical,\
  \ analytical stance toward a subject in order to arrive at some compelling conclusions.</p>\n<p>Let\
  \ us now think about how you might apply your critical thinking skills to move from a personal reaction\
  \ to a more formal academic</p>\n<p>Gita DasBender response to Annie Dillard’s essay. The second stage\
  \ of critical thinking involves textual analysis and requires you to do the following:</p>\n<ul><li>Summarize\
  \ the writer’s ideas the best you can in a brief paragraph. This provides the basis for extended analysis\
  \ since it contains the central ideas of the piece, the building blocks, so to speak.</li><li>Evaluate\
  \ the most important ideas of the essay by considering their merits or flaws, their worthiness or lack\
  \ of worthiness. Do not merely agree or disagree with the ideas but explore and explain why you believe\
  \ they are socially, politically, philosophically, or historically important and relevant, or why you\
  \ need to question, challenge, or reject them.</li><li>Identify gaps or discrepancies in the writer’s\
  \ argument. Does she contradict herself? If so, explain how this contradiction forces you to think more\
  \ deeply about her ideas. Or if you are confused, explain what is confusing and why.</li><li>Examine\
  \ the strategies the writer uses to express her ideas. Look particularly at her style, voice, use of\
  \ figurative language, and the way she structures her essay and organizes her ideas. Do these strategies\
  \ strengthen or weaken her argument? How?</li><li>Include a second text—an essay, a poem, lyrics of\
  \ a song— whose ideas enhance your reading and analysis of the primary text. This text may help provide\
  \ evidence by supporting a point you’re making, and further your argument.</li><li>Extend the writer’s\
  \ ideas, develop your own perspective, and propose new ways of thinking about the subject at hand.</li></ul>\n\
  <h3>Crafting the Essay</h3>\n<p>Once you have taken notes and developed a thorough understanding of\
  \ the text, you are on your way to writing a good essay. If you were asked to write an exploratory essay,\
  \ a personal response to Dillard’s essay would probably suffice. However, an academic writing assignment\
  \ requires you to be more critical. As counter-intuitive as it may sound, beginning your essay with\
  \ a personal anecdote often helps to establish your relationship to the text and draw the reader into\
  \ your writing. It also helps to ease you into the more complex task of textual analysis. Once you begin\
  \ to analyze Dillard’s ideas, go back to the list of im-</p>\n<p>Critical Thinking in College Writing\
  \ portant ideas and quotations you created as you read the essay. After a brief summary, engage with\
  \ the quotations that are most important, that get to the heart of Dillard’s ideas, and explore their\
  \ meaning. Textual engagement, a seemingly slippery concept, simply means that you respond directly\
  \ to some of Dillard’s ideas, examine the value of Dillard’s assertions, and explain why they are worthwhile\
  \ or why they should be rejected. This should help you to transition into analysis and evaluation. Also,\
  \ this part of your essay will most clearly reflect your critical thinking abilities as you are expected\
  \ not only to represent Dillard’s ideas but also to weigh their significance. Your observations about\
  \ the various points she makes, analysis of conflicting viewpoints or contradictions, and your understanding\
  \ of her general thesis should now be synthesized into a rich new idea about how we should live our\
  \ lives. Conclude by explaining this fresh point of view in clear, compelling language and by rearticulating\
  \ your main argument.</p>\n<h3>Modeling Good Writing</h3>\n<p>When I teach a writing class, I often\
  \ show students samples of really good writing that I’ve collected over the years. I do this for two\
  \ reasons: first, to show students how another freshman writer understood and responded to an assignment\
  \ that they are currently working on; and second, to encourage them to succeed as well. I explain that\
  \ although they may be intimidated by strong, sophisticated writing and feel pressured to perform similarly,\
  \ it is always helpful to see what it takes to get an A. It also helps to follow a writer’s imagination,\
  \ to learn how the mind works when confronted with a task involving critical thinking. The following\
  \ sample is a response to the Annie Dillard essay. Figure 1 includes the entire student essay and my\
  \ comments are inserted into the text to guide your reading.</p>\n<p>Though this student has not included\
  \ a personal narrative in his essay, his own world-vievvw is clear throughout. His personal point of\
  \ view, while not expressed in first person statements, is evident from the very beginning. So we could\
  \ say that a personal response to the text need not always be expressed in experiential or narrative\
  \ form but may be present as reflection, as it is here. The point is that the writer has traveled through\
  \ the rough terrain of critical thinking by starting out with his own ruminations on the subject, then\
  \ by critically analyzing and responding to Dillard’s text, and finally by developing a strong</p>\n\
  <p>Gita DasBender</p>\n<p>Building our</p>\n<p>Lives:</p>\n<p>The</p>\n<p>Blueprint</p>\n<p>Lies</p>\n\
  <p>Within</p>\n<p>We all may ask ourselves many questions, some serious, some less important, in our\
  \ lifetime.</p>\n<p>But at some point along the way, we all will take a step back and look at the way\
  \ we are living our lives, and wonder if we are living them correctly.</p>\n<p>Unfortunately, there\
  \ is no solid blueprint for the way to live our lives.</p>\n<p>Each person is different, feeling different\
  \ emotions and reacting to different stimuli than the person next to them.</p>\n<p>Many people search\
  \ for the true answer on how to live our lives, as if there are secret instructions out there waiting\
  \ to be found.</p>\n<p>But the truth is we as a species are given a gift not many other creatures can\
  \ claim to have:</p>\n<p>the ability to choose to live as we want, not as we were necessarily designed\
  \ to.</p>\n<p>Even so, people look outside of themselves for the answers on how to live, which begs\
  \ me to ask the question:</p>\n<p>what is wrong with just living as we are now, built from scratch through\
  \ our choices and memories?</p>\n<p>Annie</p>\n<p>Dillard’s essay entitled</p>\n<p>“Living</p>\n<p>Like</p>\n\
  <p>Weasels”</p>\n<p>is an exploration into the way human beings might live, clearly stating that</p>\n\
  <p>“We could live any way we want”</p>\n<p>(Dillard</p>\n<p>211).</p>\n<p>Dillard’s encounter with an\
  \ ordinary weasel helped her receive insight into the difference between the way human beings live their\
  \ lives and the way wild animals go about theirs.</p>\n<p>As a nature writer,</p>\n<p>Dillard shows\
  \ us that we can learn a lot about the true way to live by observing nature’s other creations.</p>\n\
  <p>While we think and debate and calculate each and every move, these creatures just simply act.</p>\n\
  <p>The thing that keeps human beings from living the purest life possible, like an animal such as the\
  \ weasel, is the same thing that separates us from all wild animals:</p>\n<p>our minds.</p>\n<p>Human\
  \ beings are creatures of caution, creatures of undeniable fear, never fully living our lives because\
  \ we are too caught up with avoiding risks.</p>\n<p>A weasel, on the</p>\n<p>Comment:</p>\n<p>Even as\
  \ the writer starts with a general introduction, he makes a claim here that is related to</p>\n<p>Dillard’s\
  \ essay.</p>\n<h3>Comment:</h3>\n<p>The student asks what seems like a rhetorical question but it is\
  \ one he will answer in the rest of his essay.</p>\n<p>It is also a question that forces the reader\
  \ to think about a key term from the text— “choices.”</p>\n<p>Comment:</p>\n<h3>Student summarizes</h3>\n\
  <p>Dillard’s essay by explaining the ideas of the essay in fresh words.</p>\n<p>Critical Thinking in\
  \ College Writing other hand, is a creature of action and instinct, a creature which lives its life\
  \ the way it was created to, not questioning his motives, simply striking when the time to strike is\
  \ right.</p>\n<p>As</p>\n<p>Dillard states,</p>\n<p>“the weasel lives in necessity and we live in choice,\
  \ hating necessity and dying at the last ignobly in its talons”</p>\n<p>(Dillard</p>\n<p>210).</p>\n\
  <h3>It is important to note and appreciate the uniqueness of the ideas</h3>\n<p>Dillard presents in\
  \ this essay because in some ways they are very true.</p>\n<p>For instance, it is true that humans live\
  \ lives of caution, with a certain fear that has been built up continually through the years.</p>\n\
  <p>We are forced to agree with</p>\n<p>Dillard’s idea that we as humans</p>\n<p>“might learn something\
  \ of mindlessness, something of the purity of living in the physical senses and the dignity of living\
  \ without bias or motive”</p>\n<p>(Dillard</p>\n<p>210).</p>\n<p>To live freely we need to live our\
  \ lives with less hesitation, instead of intentionally choosing to not live to the fullest in fear of\
  \ the consequences of our actions.</p>\n<p>However,</p>\n<p>Dillard suggests that we should forsake\
  \ our ability of thought and choice all together.</p>\n<p>The human mind is the tool that has allowed\
  \ a creature with no natural weapons to become the unquestioned dominant species on this plant planet,\
  \ and though it curbs the spontaneity of our lives, it is not something to be simply thrown away for\
  \ a chance to live completely</p>\n<p>“free of bias or motive”</p>\n<p>(Dillard</p>\n<p>210).</p>\n\
  <p>We are a moral, conscious species, complete with emotions and a firm conscience, and it is the power\
  \ of our minds that allows us to exist as we do now:</p>\n<p>with the ability to both think and feel\
  \ at the same time.</p>\n<p>It grants us the ability to choose and have choice, to be guided not only\
  \ by feelings and emotions but also by morals and an understanding of consequence.</p>\n<p>As such,\
  \ a human being with the ability to live like a weasel has given up the very thing that makes him human.</p>\n\
  <p>Comment:</p>\n<p>Up until this point the student has introduced</p>\n<p>Dillard’s essay and summarized\
  \ some of its ideas.</p>\n<p>In the section that follows, he continues to think critically about</p>\n\
  <p>Dillard’s ideas and argument.</p>\n<h3>Comment:</h3>\n<p>This is a strong statement that captures\
  \ the student’s appreciation of</p>\n<p>Dillard’s suggestion to live freely but also the ability to\
  \ recognize why most people cannot live this way.</p>\n<p>This is a good example of critical thinking.\
  \ thinking—evaluating the writer’s</p>\n<p>Cidoemams aenndt:</p>\n<p>t</p>\n<p>Ahgeani n  p,r ethsee\t\
  n sttiundge nt aaclktenronwalteed agregsu tmhee\tn imtsp.</p>\n<p>ortance of c o  nscious thought.</p>\n\
  <h3>Comment:</h3>\n<p>While the student does not include a personal experience in the essay, this section\
  \ gives us a sense of his personal view of life.</p>\n<p>Also note how he introduces the term</p>\n\
  <p>“morals”</p>\n<p>here to point out the significance of the consequences of our actions.</p>\n<p>The\
  \ point is that not only do we need to act but we also need to be aware of the result of our actions.</p>\n\
  <p>Comment:</p>\n<h3>Student rejects</h3>\n<p>Dillard’s ideas but only after explaining why it is important\
  \ to reject them.</p>\n<p>Gita DasBender</p>\n<p>Here, the first true flaw of</p>\n<p>Dillard’s essay\
  \ comes to light.</p>\n<h3>While it is possible to understand and even respect</h3>\n<p>Dillard’s observations,\
  \ it should be noted that without thought and choice she would have never been able to construct these\
  \ notions in the first place.</p>\n<p>Dillard protests,</p>\n<p>“I tell you</p>\n<p>I’ve been in that\
  \ weasel’s brain for sixty seconds, and he was in mine”</p>\n<p>(Dillard</p>\n<p>210).</p>\n<p>One cannot\
  \ cast oneself into the mind of another creature without the intricacy of human thought, and one would\
  \ not be able to choose to live as said creature does without the power of human choice.</p>\n<p>In\
  \ essence,</p>\n<p>Dillard would not have had the ability to judge the life of another creature if she\
  \ were to live like a weasel.</p>\n<p>Weasels do not make judgments; they simply act and react on the\
  \ basis of instinct.</p>\n<p>The</p>\n<p>“mindlessness”</p>\n<p>that</p>\n<p>Dillard speaks of would\
  \ prevent her from having the option to choose her own reactions.</p>\n<h3>Whereas the conscious-­‐\
  \ thinking</h3>\n<p>Dillard has the ability to see this creature and take the time to stop and examine\
