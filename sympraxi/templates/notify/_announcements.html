{% load i18n %}
{% if announcements %}
  <section class="sympraxi-announcements" aria-label="{% translate 'Announcements' %}">
    {% for announcement in announcements %}
      <div class="usa-alert usa-alert--info">
        <div class="usa-alert__body">
          <h2 class="usa-alert__heading">{{ announcement.title }}</h2>
          <div class="usa-alert__text">{{ announcement.body|urlize|linebreaks }}</div>
        </div>
      </div>
    {% endfor %}
  </section>
{% endif %}
