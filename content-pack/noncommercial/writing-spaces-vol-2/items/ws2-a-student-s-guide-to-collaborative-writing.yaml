  <h3>The Basics of Style Guides</h3>

  <p>Style guides are collections of conventions on everything from word choice to format gathered into
  one place and used in writing. Their primary purpose is to ensure that all documents in a given environment
  adhere to a certain look and consistent use of language, but they serve a much broader purpose.</p>

  <p>Style guides eliminate the guesswork in areas of writing that have multiple options. For example,
  both advisor and adviser are accurate</p>

  <p>Document Design and Formatting in the Writing Classroom spellings of a word; a style guide specifies
  which instance is preferred for the document you are writing. Style guides assure consistency in an
  organization’s publications, such as placing the titles and page numbers in the same area of the page
  for all documents. Finally, they make reading and comprehension easier for the audience by presenting
  similar information in similar ways. Readers who want to view the source material you’ve used in a paper,
  for example, will refer to your list of authors and publications. The format and even the title of this
  section will vary depending on the style guide you’ve chosen. The “Works Cited” or “Reference” pages
  provide the information on all referenced documents in a presentation different from the main text,
  making it easy to identify.</p>

  <p>Most academic disciplines follow a style guide. In addition, many companies and academic institutions
  establish their own style guides to supplement established style guides. In most writing courses, as
  well as other courses in the humanities, we use the Modern Language Association (MLA) style.</p>

  <h3>A Primer on MLA Style</h3>

  <p>The Modern Language Association produced their first “MLA style sheet” in 1951 as a way to ensure
  consistency within documents shared in the academic community. The style sheet evolved into the first
  edition of the MLA Handbook in 1977. Now in its seventh edition, the MLA Handbook is the primary source
  for stylistic choices made in writing for the humanities.</p>

  <p>Style guides reflect the items of importance in writing for a particular community. The types and
  structure in information shown in the MLA style guide differ from those in other disciplines. For example,
  the American Psychological Association (APA)—used by many of the sciences—has its own style guide. Even
  popular media, including newspapers and magazines have their own style guide: the Associated Press (AP)
  guide.</p>

  <p>Writers using a specific style guide will emphasize different pieces of information. For example,
  citations in MLA emphasize the author as primary focus, while the APA style guide features dates (see
  Fig. 3).</p>

  <p>Style guides are dynamic documents, and they change to reflect evolutions in technology for both
  research and production. When MLA style was first developed, it did not include a style for referencing</p>

