  <p>Teacher Resources for Understanding and Maintaining Your Privacy When Writing with Digital Technologies</p>

  <p>This chapter aims to introduce students to the concept of information privacy, explain its impact
  on students’ writing, and provide students with knowledge and strategies for regaining control over
  the information they produce on the Web. Such an essay would complement lessons on digital writing,
  research, and on critical digital literacies. Networks play a major part in our students’ writing practices
  and in their digital habits, so this chapter can help students gain greater critical awareness of the
  role that their data plays in forming the web, as well as how it affects their writing. Moreover, it
  provides vocabulary to understand information privacy and its impact on their writing. This chapter
  focuses particularly on information privacy as it relates to corporate data-mining practices. It does
  not offer discussion on other issues that could regulate digital privacy more broadly, such as online
  harassment or doxxing. Some of the concepts and vocabulary can be applicable to such kinds of privacy
  invasions, and while the piece at times can gesture broadly to these types of intrusions, its focus
  remains primarily on data and data-mining since these practices are often less visible to students.
  Ultimately, these materials (both the chapter and these accompanying resources) aim to help students
  develop critical orientations toward the digital technologies and services that they integrate into
  their writing networks and processes.</p>

  <p>Here are several discussion questions and in-class activities that can help students practice critically
  analyzing the data and privacy practices of the technologies they use or that can give them experience
  in exercising agency in regard to how their personal information is shared when they write online.</p>

  <h3>Discussion Questions</h3>

  <p>1. This chapter supplied you with some questions to help you analyze and determine the appropriate
  flow of information in a given context. Describe a time when you felt your privacy was breached due
  to inappropriate information flow. Using the questions from the chapter as a guide, explain why the
  instance was a breach of your privacy. How did the flow go wrong?</p>

  <p>2. Current debates regarding privacy and data often involve the data-mining practices of popular
  social media companies. Pick a popular social media platform, and explain what you consider to be the
  appropriate flow of your personal information when using that platform. Describe the context of social
  media, which actors should be involved in the exchange of your personal information, what type(s) of
  information should be shared, what type of sharing you expect to occur, and whether there are any pertinent
  rules or norms that shape or constrain how your information is shared.</p>

  <p>3. As mentioned in the conclusion to this chapter, while this chapter outlines ways of understanding
  and maintaining the privacy of your personal information online, there is only so much that one individual
  can do. Advocacy thus becomes a central part of preserving and shaping digital privacy. What kinds of
  policies and practices do you think should be implemented to help protect and preserve the privacy of
  your data and personal information online?</p>

  <p>4. The chapter discussed the importance of integrating digital technologies and services that valued
  privacy, transparency, and offered you more control over the data you produce through your digital activity.
  Map out your writing “network” for academic writing, including the various digital devices, services,
  and platforms that you commonly use when writing a research paper for class. Are there any you might
  want to investigate further in regard to their data practices? Are there items you might rethink or
  revise after reading this chapter? Why or why not?</p>

  <p>Exercises and Activities</p>

  <p>Profiling and Revising Privacy Defaults</p>

  <p>Pick a popular social media platform, preferably one that you already use, and investigate its default
  settings for privacy and for sharing information. Consider the implications for these defaults. What
  kind of information is shared and with whom is it shared? Is any potentially sensitive information shared
  with any problematic parties? Finally, what kind of revisions would you suggest to the defaults? Create
  a short presentation that summarizes the default settings, the potential implications of these defaults,
  and explains how you would revise the defaults so that users have greater control over their personal
  information and the data they produce.</p>

  <h3>Analyzing Terms of Service Agreements</h3>

  <p>Terms of service agreements, privacy policies, and data-use policies are great sites to begin to
  analyze the privacy practices of a digital service or platform. Yet, they are notoriously hard to understand
  due to everything from their difficult language and syntax to their length, so few users read them,
  causing their contents to remain unknown to many. “Terms of Service; Didn’t Read” (ToS;DR) is a digital
  service that summarizes the content of these documents into short bulleted lists that are written in
  simple language (“Frontpage”). The short summaries also include ratings of the terms according to their
  fairness to users. Visit the website and review some of the entries. Then locate the entry for a platform
  or service that you either use or have used. Read both the terms of service agreement for the platform
  or service as well as the ToS;DR entry. Do you think that the entry accurately represented the terms?
  Is there anything you would change or include in the entry? For your final task, propose some revisions
  to the terms of service agreements that would make them more fair to users.</p>

  <h3>Investigating Your Digital Identity</h3>

  <p>If you have a Google account, visit your Google Ad settings at www.google.com/settings/u/0/ads to
  learn more about the data that Google has collected on your activities. How has Google categorized your
  interests and identity based on its algorithm’s interpretation of your data? Do you think their profile
  presents an accurate picture of you? Why or why not?</p>'
