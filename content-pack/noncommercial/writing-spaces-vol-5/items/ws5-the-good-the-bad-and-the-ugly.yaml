  <p>Teacher Resources for “The Good, the Bad, and the Ugly of Peer Review”</p>

  <h3>Overview and Teaching Strategies</h3>

  <p>Instructors could assign this essay in a first-year or upper-level writing course as students are
  learning to offer each other peer feedback. Questions, models, and charts in the chapter and appendices
  can support peer review assignments and revision exercises in or outside of class. However, it might
  be even more useful to have students work through this material after they have already experienced
  one round of peer review with classmates and received written feedback from the instructor since it
  offers strategies for transforming comments on a piece of writing into plans for revision – and provides
  advice about processing the emotions that come up whenever someone criticizes our writing.</p>

  <h3>Discussion Questions</h3>

  <p>1. This chapter offers some examples of Reviewer Two comments, and we can find even nastier ones
  in the Twitter accounts that are referenced. What is the harshest comment you ever got about your writing?
  How did you feel about that comment when you first got it, and how do you feel about it now? Do you
  think the comment presented any valid criticism, or was it just wrong, or mean, or misguided? Imagine
  exactly how you would respond to that comment if it showed up on something you are currently writing.</p>

  <p>2. Writing is an activity that generates a lot of emotions. Why do you think this is? What words
  come up for you when you describe how you feel when you get a writing assignment or sit down to write?
  How do you think these emotions affect your writing work? Is there anything about this relationship
  to your writing that you would like to change? If you would describe yourself as someone who hates writing,
  what would it take for you to feel good (or even neutral) about your writing?</p>

  <p>3. Kelly notes that “even the most skilled writers are challenged by revising their own work.” Peer
  review can help with revision because it’s not just a way of getting someone else’s perspective on a
  piece of your writing; reflecting on peer review comments is a chance to experiment with that different
  perspective yourself as part of the process of planning a revision. Think about times you have revised
  your own work and the strategies you used when deciding what changes to make. Whether or not peer review
  was involved, what ways did you find to get different perspectives on and distance from your work-in-progress
  while revising?</p>

  <h3>Activities</h3>

  <p>Students in higher education classrooms often lack the understanding that the instructors teaching
  their courses are accomplished researchers – possibly graduate students working on MA or PhD thesis
  projects; possibly authors of published articles, chapters, or books; and always teachers whose work
  engages with the scholarship of teaching and learning. While we aren’t trying to make all students into
  academics, much less clones of ourselves, we do them no favors by failing to share our own stories of
  academic research and writing. By focusing on peer review – and particularly on the label we give to
  peer-review-gone-wrong, Reviewer Two – this chapter ensures that students see academic writing as produced
  through collaboration (by writers, reviewers, and editors) and involving revision. Instructors can make
  clear the importance of drafting, revision, and workshopping by linking such classroom “assignments”
  or “scaffolding activities” to real experiences of professional academic writing – ideally their own.</p>

  <ul><li>In a class session, walk students through an example of your writing at various stages of development;
  doing so makes clear not only that you are an academic writer but also that you are not a divine creature
  who produces brilliant one-and-done drafts. I find it helpful to show my students how an idea developed
  from a conference paper proposal into a conference paper, then a first draft of a book chapter or article,
  then a revision of that piece, then another revision, etc. I explain what feedback – from audience members
  at a conference presentation, colleagues I asked to read work in progress, peer reviewers, editors,
  etc. – I took into account at each stage of revision. You might share a seminar paper, thesis chapter,
  or any other piece of writing that has gone through multiple revisions guided by feedback from several
  readers.</li><li>If you have peer review/reader reports for a piece of writing you published, share
  these documents, and talk students through how you responded to the feedback you received. Make explicit
  that by the time a piece of scholarship shows up as a published article or book chapter a student can
  read and cite, it has been checked, reworked, and revised many times.</li><li>Give students a piece
  of writing that you consider to be a very rough first draft (maybe two or three typed pages that you
  pounded out in half an hour without revising, editing, or even proofreading), and ask them to give you
  feedback on it. If you like, start by asking them to offer mean, nitpicky Reviewer Two types of criticism,
  and model how you would handle those sorts of comments as well as what ideas for revision you might
  glean from this feedback.</li></ul>'
