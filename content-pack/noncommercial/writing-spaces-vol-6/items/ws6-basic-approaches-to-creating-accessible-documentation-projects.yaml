  <h3>Teacher Resources</h3>

  <p>Overview and Teaching Strategies Designing documentation projects with accessibility in mind requires
  a sensitivity to difference and the ability to imagine the widest audience possible, including considerations
  of visual, cognitive, and aural disabilities. As this chapter shows, there are simple, thoughtful steps
  you can take to ensure that documentation projects are as accessible as possible. These steps include
  the following.</p>

  <p>Considering Colorblindness • Use patterns to create contrast. • Keep color palette simple, using
  a maximum of three colors. • Pay special attention to contrast. • Do not rely on color alone to communicate
  important information.</p>

  <h3>Considering Dyslexia and Other Conditions that Alter Visual Abilities</h3>

  <ul><li>Choose fonts that work better for those with dyslexia (such as Verdana).</li><li>Ensure that
  the text can easily be changed to a more readable font by the user (Zhu et al.).</li><li>Avoid font
  styles that are known to be difficult for those with dyslexia to read (such as Arial Italics or other
  italics and serif fonts).</li></ul>

  <p>Creating Documents that are Compatible with Assistive Devices Use backend properties (also called
  “metadata” or information about a document) to tag your document with vital information for readers.</p>

  <ul><li>Arrange information in a logical way. • Make strategic arrangement decisions, using headings,
  lists, and meaningful hyperlinks. • Don’t get fancy with symbols and punctuation.</li></ul>

  <p>Using Alternative Text for Images • Use the “show, don’t tell” principle. • See if your alt text
  can pass “the yellow test.” • Gauge the purpose and aim of the image in relation to the project.</p>

  <p>Gaining mastery of the basics requires students to learn the fundamental idea that creating compelling
  documentation projects means taking steps to accommodate the widest range of end users they can imagine.
  Such an approach is more inclusive, but it also makes good business sense given the rather large percentage
  of the population that has disabilities.</p>

  <p>The accessibility framework described here emphasizes that rather than limiting or stifling the work
  of a technical communicator, though, decision-making with accessibility in mind often opens up creativity
  and enhances the overall quality of a documentation project. What’s more, focusing on issues of accessibility
  is important work as the projects a technical communicator creates have the capacity to empower those
  who are too often left behind.</p>

  <h3>Discussion Questions</h3>

  <p>To help students explore the ideas in this entry, consider having them address—as individuals, in
  small groups, or as an overall class—the following questions:</p>

  <p>1. Thinking of a recent document you created for a specific audience, purpose, and occasion, list
  the ways you managed to consider accessibility and the ways you would revise your composing process
  now that you’ve read this chapter.</p>

  <p>2. How might the recommendations found in this chapter change how you approach your documentation
  projects?</p>

  <p>3. What do you want to know more about in terms of accessibility? Scan the Web Accesibltiy Initiative
  “W3C Accessibility Standards Overview” page at https://www.w3.org/WAI/standards-guidelines/. Which topics
  would you like to learn more about?</p>

  <p>4. Choose any of the main sections of this chapter and find an example of a text that does not adhere
  to the recommendations. Redesign the document to be more accessible.</p>

  <p>5. This chapter makes a clear claim that considering accessibility leads to more innovative and accomplished
  documentation projects. To what extent do you agree or disagree with this idea, and why or why not?</p>

  <p>Exploring these topics can help students contemplate and deliberate over how to apply the ideas presented
  in the chapter within the context of their own documentation projects in school and beyond.</p>'
