  <p>12.5 Writing Process: Integrating Research</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Identify characteristics of and formulate a strong
  thesis. • Evaluate sources to decide what to include in a research essay. • Synthesize information from
  outside sources with your own ideas in research writing while retaining a writerly voice. • Distinguish
  between a quotation, summary, and paraphrase and use each appropriately. • Draft an argumentative research
  essay. • Experience the collaborative and social aspects of writing processes. • Give and act on productive
  feedback to works in progress.</p>

  <p>With a clearer understanding of how to work with sources to support and develop your position, you
  are just about ready to join the conversation and begin a research writing project of your own. The
  rest of this chapter will guide you through the process.</p>

  <h3>Summary of Assignment</h3>

  <p>For this assignment, you will write an argumentative research essay in which you take a position
  on a foodbased topic. The objective in developing this essay is to explore a topic, concept, or question
  with which you may be unfamiliar or about which you want to know more. As a first step, creating a list
  of possible topics will allow you to consider the range of possibilities. Consider the following, for
  example:</p>

  <ul><li>Health aspects of caffeine or alcohol • Vegetarian diets • Eating disorders • Food shortages
  • School lunches</li></ul>

  <p>Next, formulating a research question will help you consider the scope of your essay by providing
  guidelines to follow in your research. Consider the following, for example:</p>

  <ul><li>Is the long-term but limited consumption of caffeine or alcohol (red wine, for example) healthy
  or unhealthy for the body? Why?</li><li>What are the environmental benefits of a vegetarian diet? •
  What are the causes of eating disorders, and how can they be circumvented? • What can be done to alleviate
  food shortages in a particular country? • What is the school’s responsibility in providing students
  with nutrition?</li></ul>

  <p>As you explore possible topics and develop your focus for the paper, consider significant points
  of contention—that is, their debatable nature: perhaps an important viewpoint that has not been widely
  addressed or a perspective that has not adequately been explored. Your thesis-driven essay should follow
  these criteria:</p>

  <ul><li>10–12 pages, double-spaced, 12-point font (standard one-inch margins) • 8–10 sources (reflecting
  a range of primary and secondary sources, both print and digital) • MLA or APA documentation (in-text
  and end-of-text citation) as assigned by your instructor</li></ul>

  <p>You will synthesize the information you discover during your research to make connections about the
  potential significance of your topic for your audience and for further inquiry. You will develop your
  essay on the basis of thorough research of multiple sources and full analysis of your findings. Use
  sources as evidence to support, contradict, or expand your original ideas or thinking. Be sure to include
  extensive analysis or evaluation regarding your research question.</p>

  <p>Another Lens 1. It can be challenging to come up with topics for your research paper; however, because
  research can often be a collaborative activity (several people researching different aspects of a topic
  to collaboratively write a report), brainstorming possible topics with others can help you get started.</p>

  <p>To collaborate, form a small group, and list five possible topics on a sheet of paper or your laptop.
  Leave space under each topic for comments, ideas, and questions. After everyone has completed their
  list of topics, either move the paper or rotate seats every 10 minutes to allow group members to provide
  comments, ideas, and questions for all topic lists. If four people are in your group, you would provide
  comments, ideas, and question for three other group members, as you too will receive the same.</p>

  <p>Another Lens 2. Be as creative and inclusive as possible when thinking about topics and data source
  materials. Making a list of all possible nontraditional sources that could inform your topic may help
  you provide another lens. Or consider the varying viewpoints from which to explore your topic. While
  the Annotated Student Sample includes a range of traditionally academic sources, it might be interesting
  to consider possible nontraditional sources for researching a food- and culture-based topic. For example,
  consider these as primary sources: cookbooks, food blogs, or cultural festivals at which foods are included.
  If possible, consider doing field research, such as conducting interviews or observing professionals
  on site. As you choose your topic and begin your research process, keep an open mind about ways to use
  a variety of sources to approach your topic in different ways.</p>

  <p>Another Lens 3. Consider working in pairs in which each partner researches and writes on an opposing
  view of a single debatable issue. After researching and writing the papers as instructed, partners can
  set up a debate or panel discussion in which each presents their views on the subject, offering supporting
  evidence from their papers. Partners may want to enhance their presentations with PowerPoint or other
  media, including graphics, other visuals, or even sound, once again using or building further on researched
  evidence.</p>

  <h3>Quick Launch: Thesis Frames</h3>

  <p>The most specific way to define the scope and focus of your research paper—and, as a writer, to control
  the thought and creativity of it—is through the position you take on the topic: your stance, or thesis.
  A thesis statement is often (though not always) a single, clear, and concise sentence that reveals your
  stance early in the essay. Keep in mind, though, that it is not the essay question restated, a topic
  statement, an assertion of fact, or a step-by-step writing plan. Strong academic writing generally shows
  the thesis in the introductory section and then returns to it throughout, allowing readers to understand
  the writer’s purpose and stance. To use a travel analogy, your thesis tells readers where you are going
  and why the journey matters.</p>

  <p>As you are composing your essay, the thesis serves as a touchstone to help you determine what material
  is pertinent. Keeping your thesis in mind as you draft is important to ensure that your reasoning and
  supporting evidence are focused and relevant. A strong thesis also provides a way to measure how successful
  you have been in achieving your purpose—in travel terms again, it lets you judge whether you have reached
  your destination and explained the journey’s meaning. See Writing Process: Thinking Critically About
  Rhetoric for more information about thesis statements.</p>

  <p>Review the Annotated Student Sample to follow the way Lily Tran presents her thesis: “The human race
  must turn to sustainable food systems that provide healthy diets with minimal environmental impact,
  starting now.” What works? What doesn’t? What can you learn from her for your own writing?</p>

  <p>Remember that as your topic and ideas develop, you may need to revisit your thesis statement. One
  good practice in writing is to revisit the thesis after completing your draft to ensure the thesis reflects
  the content and focus of your paper. If it does not align with the content, readers may think that you
  set yourself one task but completed another. If this disconnect occurs, it’s time to revise the thesis
  or content accordingly.</p>

  <p>To develop a working thesis for your argumentative research paper, try using one of these frames.
  You may change the phrasing as needed to support your ideas.</p>

  <ul><li>Because ________, [someone] should ________. • ________ saves ________, reduces ________, and
  saves ________. • The lack of ________ shows ________. • ________ influences ________ and by extension
  ________. • ________ accurately (inaccurately) portrays ________ because ________. • ________ is a result
  of ________, ________, and ________. • Although some argue that ________, a close examination shows
  ________. • ________ and ________ prove that ________.</li></ul>

  <h3>Drafting: Working with Sources</h3>

  <p>When writing an argumentative research essay, you will need to draw on other people’s research to
  support your original thinking. Such a proposition may seem complicated and even contradictory.</p>

  <p>Your argumentative research essay writing assignment may require that you …</p>

  <p>While also … develop a topic based on what has already been said writing something new and original.</p>

  <p>and written rely on experts’ and authorities’ opinions and facts to engaging with the borrowed materials
  by improving upon support your ideas or disagreeing with those same opinions.</p>

  <p>Your argumentative research essay writing assignment may require that you …</p>

  <p>While also … attribute credit meticulously to previous researchers finding a way to develop your
  own significant contribution.</p>

  <p>adapt your language to fit the discipline of your topic by building upon what you hear and read finding
  a way to incorporate your own words and your own voice.</p>

  <p>You can meet these writing requirements through planning and organization. The following information
  is designed to help you simplify the steps.</p>

  <h3>Don’t Skip the Outline</h3>

  <p>Take the time to outline each body paragraph. Compose a working topic sentence, and choose a reasoning
  strategy or strategies. Then, in a paragraph outline organizer like the one presented in Table 12.2,
  list the researched evidence you will use in the paragraph to support your topic sentence and related
  thesis. Model your entry on the first entry by Lily Tran. Be sure to include the in-text citation in
  the evidence column. Add more rows as needed.</p>

  <p>Working Thesis: The human race must turn to sustainable food systems that provide healthy diets with
  minimal environmental impact, starting now.</p>

  <p>Topic Sentence</p>

  <p>Reasoning Supporting Researched Evidence</p>

  <h3>Strategy</h3>

  <p>Global food systems are threatened by climate change because farmers depend on relatively stable
  climate systems to plan for production and harvest.</p>

  <h3>Cause and effect</h3>

  <p>Yet food production is responsible for up to 30 percent of greenhouse gas emissions (Barnard).</p>

  <h3>Summary vs. Synthesis</h3>

  <p>In a research essay, you may incorporate borrowed material through synthesis, summary, quotation,
  or paraphrase. Because research writing is more than cutting and pasting together other people’s ideas,
  good writers synthesize the material they use by looking for connections among sources to develop their
  own arguments. Summary—or a brief review of main points—is a necessary foundation for synthesis, but
  it is important to avoid constructing an essay simply on a series of summaries. Part of developing your
  own voice and control over your essay stems from your decision about which supports you use and why.
  You do not want sources to override your ideas. Remember, sources provide evidence for your thesis.</p>

  <p>Table 12.3 shows some key differences between summary and synthesis:</p>

  <p>Summary</p>

  <h3>Synthesis</h3>

  <p>Demonstrates comprehension/understanding Demonstrates critical/creative thinking and insight</p>

  <p>Collects information</p>

  <p>Compares/contrasts information</p>

  <p>Restates key points</p>

  <p>Interprets key points to make new meaning</p>

  <p>Looks within a text</p>

  <p>Looks for connections/relationships between texts</p>

  <p>Treats sources as distinct entities</p>

  <p>Combines bits and pieces of sources for specific purpose</p>

  <p>Provides overview of content</p>

  <p>Interprets content</p>

  <p>Requires basic reading and thinking skills</p>

  <h3>Requires complex reading and thinking skills</h3>

  <p>Notice how Lily Tran synthesizes information in her work, combining sources to respond to a claim
  and adding her own views in the second paragraph:</p>

  <p>In response to claims that a vegetarian diet is a necessary component of sustainable food production
  and consumption, Lusk and Norwood determined the importance of meat in a consumer’s diet. Their study
  indicated that meat is the most valuable food category to consumers, and “humans derive great pleasure
  from consuming beef, pork, and poultry” (120). Currently only 4 percent of Americans are vegetarians,
  and it would be difficult to convince consumers to change their eating habits. Purdy adds “there’s the
  issue of philosophy. A lot of vegans aren’t in the business of avoiding animal products for the sake
  of land sustainability. Many would prefer to just leave animal husbandry out of food altogether.”</p>

  <p>At the same time, consumers expect ready availability of the foods they desire, regardless of health
  implications or sustainability of sources. Unhealthy and unsustainable foods are heavily marketed. Out-of-season
  produce is imported year-round, increasing carbon emissions from air transportation. Highly processed
  and packaged convenience foods are nutritionally inferior and waste both energy and packaging materials.
  Serving sizes are larger than necessary, contributing to overconsumption and obesity. Snack food vending
  machines are ubiquitous in schools and public buildings. What is needed is a widespread attitude shift
  toward reducing waste, choosing local fruits and vegetables that are in season, and paying attention
  to how foods are grown and transported.</p>

  <h3>Quoting vs. Paraphrasing</h3>

  <p>One of the most common ways to use sources is by incorporating other people’s words into your work.
  Students who are unsure about their writing sometimes overuse quotations, creating a patchwork essay
  of other people’s voices, because they may lack confidence about using their own words. However, one
  key point to remember is not to allow your sources to drown out your own voice. As a writer, you can
  avoid overreliance on others’ words by being strategic about the quotations you include and by incorporating
  your own explanations and analysis for the quotations that you do include. Always explain or analyze
  your quotations; they do not speak for themselves.</p>

  <p>For example, Lily Tran does this kind of analysis in the following paragraph. In the first three
  sentences, she paraphrases and quotes from the source. In the final sentence, she looks at the implications
  and relates the evidence to her thesis.</p>

  <p>Among their findings, they singled out, in particular, the practice of using human-edible crops to
  produce meat, dairy, and fish for the human table. Currently 34 percent of human-edible crops are fed
  to animals, a practice that reduces calorie and protein supplies. They state in their report, “If society
  continues on a ‘business-as-usual’ dietary trajectory, a 119% increase in edible crops grown will be
  required by 2050” (1). Future food production and distribution must be transformed into systems that
  are nutritionally adequate, environmentally sound, and economically affordable.</p>

  <p>A crucial skill you will develop as you practice writing is the ability to judge when to quote directly
  and when to paraphrase. You have no doubt used direct quotations in your writing, repeating someone
  else’s words verbatim within your paper and placing them within quotation marks, “like this.” Another
  way to incorporate borrowed ideas into your writing is to paraphrase them, or restate them in your own
  words. If the ideas you want to borrow are particularly long, complicated, or filled with jargon, consider
  paraphrasing for brevity or clarity. Paraphrasing also allows you to maintain your own voice, keeping
  the writing style and language as consistent as possible—a benefit especially when you draw on multiple
  sources at once.</p>

  <p>Table 12.4 reviews the differences between quoting and paraphrasing and when to use each.</p>

  <p>Quotation</p>

  <h3>Paraphrase</h3>

  <p>The borrowing must be identical to the original, comprising a narrow segment of the source. The quoted
  material must match the source document word for word and must be attributed to the original author.</p>

  <p>The idea or concept borrowed from a passage is rephrased in your own words. A paraphrase must be
  attributed to the original source. Paraphrased material may (or may not) be shorter than the original
  passage, depending on the text. If any language used is the same as the language of the original source,
  then you are quoting, not paraphrasing. It is sometimes necessary in a paraphrase to use words directly
  from the borrowed material to account for technical or discipline-specific language. In such instances,
  place the directly quoted words within quotation marks.</p>

  <h3>Use a quotation …</h3>

  <ul><li>to support your definition of a new or unfamiliar term or phrase</li><li>when you want to distance
  yourself from the original source by quoting it to make clear that the statement is not your own</li><li>to
  show that an expert or authority supports your position</li><li>to provide factual evidence for a claim
  • to include historically significant language • when a source presents an idea in a particularly striking,
  moving, or unique way • to serve as a passage for analysis, comment, or critique; for example, to set
  out a position with which you intend to agree or disagree</li></ul>

  <p>Use a paraphrase …</p>

  <ul><li>if a quotation would break the flow of your paper (Too many quotations can make an essay sound
  choppy and difficult to follow.)</li><li>to communicate statistics and numerical data • when combining
  information from a source with your own analysis or other data (synthesizing) • when what you want from
  your source is the idea, not the language that expresses it • if you can state the point of the material
  more succinctly by eliminating irrelevant information and not alter the meaning of the passage • to
  explain or simplify a passage that may be difficult to understand</li></ul>

  <p>Although quoting can be more straightforward, consider these suggestions when paraphrasing:</p>

  <ul><li>Focus on ideas and on understanding the paper or passage as a whole rather than skimming for
  specific phrases.</li><li>Put the original text aside when you write so that it doesn’t overly influence
  you. • Restructure the idea to reflect the way your brain works. • Change the words so that the paraphrase
  reflects your language and tone. Think about how you would explain the idea to someone unfamiliar with
  your subject (your mother, your roommate, your sister).</li></ul>

  <p>Here is an example of how Lily Tran combines paraphrase and quotation:</p>

  <p>Global food systems are threatened by climate change because farmers depend on relatively stable
  climate systems to plan for production and harvest. Yet food production is responsible for up to 30
  percent of greenhouse gas emissions (Barnard). While soil can be a highly effective means of carbon
  sequestration, agricultural soils have lost much of their effectiveness from overgrazing, erosion, overuse
  of chemical fertilizer, and excess tilling. Hamilton reports that the world’s cultivated and grazed
  soils have lost 50 to 70 percent of their ability to accumulate and store carbon. As a result, “billions
  of tons of carbon have been released into the atmosphere.”</p>

  <p>For more information on quoting, summarizing, and paraphrasing, visit Purdue University’s Online
  Writing Lab (OWL) (https://openstax.org/r/purdueOWL).</p>

  <h3>Opening and Closing</h3>

  <p>Lead your argumentative research essay with your best punch. Make your opening so strong your reader
  feels compelled to continue. Make your closing so memorable your reader can’t forget it. Because readers
  pay special attention to openings and closings, make these sections work for you. Start with a title
  and lead paragraph that grab readers’ attention and alert them to what is to come. End with closings
  that sum up and reinforce where readers have been. Choose from the menu of options presented in Table
  12.5 as you draft your essay. You may want to write more than one opening and closing and then ask your
  peer conference partner to give feedback about their preference and why they have that preference.</p>

  <p>Opening Strategies</p>

  <p>Closing Strategies</p>

  <p>Describe a related conflict.</p>

  <p>Explain the evolution of your thesis. Provide the answer to your research question.</p>

  <p>Provide a related anecdote.</p>

  <p>Return to the scene set by the opening.</p>

  <p>Start with a sensory detail.</p>

  <p>Resolve the problem you have explored.</p>

  <p>Introduce a related quotation.</p>

  <p>Make a recommendation or a call to action.</p>

  <p>Shock readers with a statistic.</p>

  <p>Speculate about the future with regard to the issue.</p>

  <p>Ask a rhetorical question.</p>

  <p>Revisit your thesis.</p>

  <p>Present the chronology of the issue. Leave readers with an insightful thought to ponder.</p>

  <p>End with your thesis.</p>

  <p>Look again at the way Lily Tran begins her essay by explaining the evolution of her thesis. Is it
  effective in grabbing your attention? Why or why not? What are some other strategies that she might
  have used?</p>

  <p>For the human race to have a sustainable future, massive changes in the way food is produced, processed,
  and distributed are necessary on a global scale. The required changes will affect nearly all aspects
  of life, including not only world hunger but also health and welfare, land use and habitats, water quality
  and availability, energy use and production, greenhouse gas emissions and climate change, economics,
  and even cultural and social values. These changes may not be popular, but they are imperative. The
  human race must turn to sustainable food systems that provide healthy diets with minimal environmental
  impact, starting now.</p>

  <p>Now look again at the way Lily Tran ends her essay by revisiting her thesis. Is it effective in leaving
  you with something to think about? Why or why not? What are some other strategies that she might have
  used?</p>

  <p>For the human race to have a sustainable future, massive changes in the way food is produced, processed,
  and distributed are necessary on a global scale. The required changes will affect nearly all aspects
  of life, including not only world hunger but also health and welfare, land use and habitats, water quality
  and availability, energy use and production, greenhouse gas emissions and climate change, economics,
  and even cultural and social values. These changes may not be popular, but they are imperative. They
  are also achievable. The human race must turn to sustainable food systems that provide healthy diets
  with minimal environmental impact, starting now.</p>

  <h3>Responding to Counterarguments</h3>

  <p>The final element of your argumentative research essay is a response to counterarguments, or others’
  objections. To establish your credibility on the subject, you need to acknowledge and address the most
  important arguments against your thesis. Look again at Lily Tran’s response to a counterargument, which
  she acknowledges and then addresses. Does she address the counterargument fully? What could she add
  to the paragraph to address the counterargument more fully and forcefully?</p>

  <p>A second objection addresses the claim that land use for animal-based food production contributes
  to pollution and greenhouse gas emissions and is inefficient in terms of nutrient delivery. Berners-Lee
  et al. point out that animal nutrition from grass, pasture, and silage comes partially from land that
  cannot be used for other purposes, such as producing food directly edible by humans or for other ecosystem
  services such as biofuel production. Consequently, nutritional losses from such land use do not fully
  translate into losses of human-available nutrients.</p>

  <p>Use a graphic organizer like Table 12.6 to plan your response to important arguments against your
  thesis, and consult Writing Process: Creating a Position Argument.</p>

  <p>Introduction</p>

  <p>That … (What do critics claim?)</p>

  <p>However, But, Despite … (What do you say in response?)</p>

  <p>While some may claim …</p>

  <p>Although critics argue …</p>

  <p>Those opposed suggest …</p>

  <p>Some opponents claim …</p>

  <h3>Those critical of the idea argue …</h3>

  <p>Some opponents claim … that nutritional losses from such land use do not fully translate into losses
  of humanavailable nutrients.</p>

  <p>While this objection may be correct, it does not address the fact that natural carbon sinks are being
  destroyed to increase agricultural land and, therefore, increase greenhouse gas emissions into the atmosphere.</p>

  <h3>Peer Review: Switch Sides</h3>

  <p>One way to gain a new perspective for revision is to switch sides in arguing a position. Your peer
  conference partner can help you with this exercise. Rewrite a paragraph of your draft from an alternative
  viewpoint. Ask your partner to read both versions. Discuss the similarities and differences regarding
  the rhetorical situation. In what ways might you revise your original paragraph to better address the
  issues of the alternative paragraph?</p>

  <p>For example, Issa, a mountain bike enthusiast, wrote his draft in favor of opening up more wilderness
  trails for mountain bikers to use. However, before writing his final draft, he researched the arguments
  against his position and wrote from that viewpoint:</p>

  <p>Hikers and other passive trail users argue against allowing mountain bikes onto narrow trails traditionally
  traveled only by foot and horse. They point out that the wide, deeply treaded tires of mountain bikes
  cause erosion and that the high speeds of the bikers startle and upset both hikers and horses. According
  to hiker Donald Meserlain, the bikes “ruin the tranquility of the woodlands and drive out hikers, bird
  watchers, and strollers” (Hanley 4).</p>

  <p>For the writer, the main advantage of switching sides for a draft may be a better understanding of
  the opposition’s viewpoint, making for a more effective argument against it in the final draft. In fact,
  for his final draft, Issa argues his original position in favor of mountain bikes, but he does so with
  more understanding, empathy, and effectiveness because he spent some time with the opposition. His final
  draft makes it clear where he stands on the issue. The tone of the mountain bike essay is now less strident
  and more thoughtful.</p>

  <p>Educated mountain biking, like hiking and horseback riding, respects the environment and promotes
  peace and conservation, not noise and destruction. Making this case has begun to pay off, and the battle
  over who walks and who rides the trails should now shift in favor of peaceful coexistence. Buoyed by
  studies showing that bicycle tires cause no more erosion or trail damage than the boots of hikers, and
  far less than horses’ hooves, mountain bike advocates are starting to find receptive ears among environmental
  organizations (Schwartz 78).</p>

  <p>Another switch that pays good dividends for the writer is changing the audience. In college writing
  situations, the final audience always includes the instructor, so such a change may simply be a temporary
  but useful fiction. Had a draft of the mountain bike essay been aimed at the different constituencies
  mentioned in the essay—the Sierra Club, mountain bicycle manufacturers, property owners, or local newspapers—the
  writer might have gained a useful perspective in attempting to switch language and arguments to best
  address this more limited readership. Likewise, drafts of various papers written to young children,
  sympathetic classmates, skeptical professors, or sarcastic friends may also provide useful variations
  in the writing perspective.</p>

  <p>In addition to working with a partner on this activity, take some extra time to check the essential
  elements of the argumentative research essay. Note whether the paper you are reviewing has these elements:</p>

  <ul><li>a strong thesis • sufficient and accurate support for claims • a combination of summary, paraphrase,
  quotation, and synthesis • strong counterclaims • complete and correct citations • a strong closing</li></ul>

  <p>Revising: Who’s Game?</p>

  <p>As you know, revising means reseeing, rereading, and rethinking your thoughts on paper until they
  match your intention. Mentally, it is conceptual work in which you focus on larger units of meaning.
  Be prepared to do a lot of copying, cutting, pasting, crossing out, and rewriting until you are satisfied
  with the ideas and where they appear in your paper.</p>

  <p>12.6 Editing Focus: Integrating Sources and Quotations</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Apply citation conventions systematically in your
  work, understanding the concepts of intellectual property that motivate documentation conventions. •
  Compose texts that integrate the writer’s ideas with those from appropriate sources.</p>

  <p>Direct quotations are most effective when you integrate them smoothly into the flow of your paper.
  You can do this by introducing the source and reason for the quotation in a phrase or sentence. Readers
  should be able to follow your meaning easily and to understand the relevance of the quotation immediately.</p>

  <h3>Introduce Quotations</h3>

  <p>Because readers need to know who is speaking, introduce quoted material with a signal phrase (sometimes
  called an attributory phrase). A signal phrase is a word or group of words that introduces borrowed
  or quoted material and informs readers of the source and purpose of the quotation. If the source is
  well-known, the name alone will be enough of a signal phrase. For example, a first-year student wrote,
  “Henry David Thoreau asserts in Walden, ‘The mass of men lead lives of quiet desperation’” (5).</p>

  <p>If your paper focuses on the published work itself, introduce a quotation with the work’s title rather
  than the author’s name, as long as the reference is clear—for example, “Walden sets forth one individual’s
  antidote against the ‘lives of quiet desperation’ led by the working class in mid-nineteenth-century
  America” (Thoreau</p>

  <p>5). If either the author or the source is not well-known, introduce the quotation with a brief explanation
  to give readers enough context to understand the quotation—for example, “Mary Catherine Bateson, daughter
  of renown anthropologist Margaret Mead, has become, in her own right, a student of modem civilization.”</p>

  <h3>Select the Right Signal Phrase</h3>

  <p>Signal phrases (https://openstax.org/r/signalphrases) tell readers that the words or ideas that follow
  come from another source. Signal phrases often contain a verb that indicates the tone or intention of
  the author. To avoid monotony, vary the placement and words of the signal phrases you use. Note the
  differences, both slight and significant, in the following signal words and phrases as you integrate
  some of them into your draft:</p>

  <p>acknowledges denies points out admits emphasizes refutes agrees endorses reports argues follows up
  reveals asserts grants says believes illustrates shows claims implies states comments insists suggests
  concedes maintains thinks concludes notes writes declares observes</p>

  <p>Quote Smoothly and Correctly</p>

  <p>A direct quotation repeats an author’s or speaker’s exact words. Slight changes in wording are permitted,
  but these changes must be clearly marked. Although you cannot change what a source says, you do have
  control over how much of it you use. Because using quotations that are too long can imply that you have
  little to say for yourself, use only the part of the quotation needed to make your point. Quotations
  should support your points, not say them for you.</p>

  <p>To shorten a quotation to include only the most important information, integrate it smoothly and
  correctly into the body of your paragraph to provide minimal disruption for readers. Unless the source
  quoted is itself the topic of the paper (as in a literary interpretation), limit brief quotations to
  no more than two per page and long quotations to no more than one every three pages. The following examples
  illustrate both correct and incorrect use of quoted material.</p>

  <h3>Original Passage</h3>

  <p>According to one film critic, the plot is exciting, but most of the dialogue “has the energy and
  impact of day-old gruel, without sugar, spice, or raisins.” In fact, if I had to judge the film on dialogue
  alone, I’d say, “Save your money.” Most of the characters alternate between a low and intermittent mumble,
  like a distant helicopter with engine trouble, and garbled whoops, as though speaking in tongues. Perhaps
  this is the director’s way of trying to mask a cornucopia of cliché-ridden, monosyllabic utterances,
  which, I agree, are not worth audience attention. Much of the acting is no better. However, some notable
  exceptions eclipse all the negatives of the script and the bit-part actors.</p>

  <h3>Omit or Substitute Words Judiciously</h3>

  <p>Cutting words for the sake of brevity is often useful, but do not distort meaning. Indicate omitted
  words by using ellipsis points (three dots within a sentence, four to indicate a complete sentence is
  being omitted). Use brackets ([ ]) to indicate any changes or additions.</p>

  <h3>Distorted Quotation</h3>

  <p>“The plot is exciting . . . the dialogue has . . . energy and impact.”</p>

  <p>The critic’s words are taken out of context. Negatives are removed, as are the critic’s dismissive
  comments about the film and the exceptions to the opinion.</p>

  <h3>Accurate Quotation</h3>

  <p>“The plot is exciting, but most of the dialogue ‘has the energy and impact of day-old gruel. . .
  .’ However, some notable exceptions eclipse all the negatives of the script.”</p>

  <h3>Quotation Marks for Short Quotations</h3>

  <p>Embed brief quotations in the main body of your paper, and enclose them in quotation marks. The previous
  examples in this section are brief and would be embedded within paragraphs as normal sentences. According
  to MLA style guidelines, a brief prose quotation consists of four or fewer typed lines; a brief poetry
  quotation consists of three or fewer typed lines.</p>

  <h3>Block Format for Long Quotations</h3>

  <p>Set quotations of more than four lines in block format. Block quotations are indented but spaced
  the same as the normal text. Format block quotations as follows:</p>

  <ul><li>Introduce the quotation in the last line of normal text with a sentence that ends with a colon.
  • Indent one half inch, and then begin the quotation. • Do not use quotation marks, as the indentation
  signals direct quotation. • Include the page number, in parentheses, after the end punctuation.</li></ul>

  <p>For example, this student writing on Thoreau used a block quotation from Walden to describe the scenery
  in the author’s own words:</p>

  <p>The scenery of Walden is on a humble scale, and, though very beautiful, does not approach to grandeur,
  nor can it much concern one who has not long frequented it or lived by its shore; yet this pond is so
  remarkable for its depth and purity as to merit a particular description. It is a clear and deep green
  well, half a mile long and a mile and three quarters in circumference, and contains about sixtyone and
  a half acres; a perennial spring in the midst of pine and oak woods, without any visible inlet or outlet
  except by the clouds and evaporation (195).</p>

  <h3>Explain and Clarify Quotations</h3>

  <p>Sometimes you will need to explain a quotation’s relevance or meaning in the context of your discussion.
  For example, one student wrote, “In A Sand County Almanac, author Aldo Leopold invites modern urban
  readers to confront what they lose by living in the city and mentions the resulting ‘spiritual dangers’:
  ‘supposing that breakfast comes from the grocery and . . . heat comes from the furnace’ (6). Leopold
  sees city-dwellers as selfcentered children, blissfully but dangerously unaware of how their basic needs
  are met.”</p>

  <p>If you need to clarify what a word or reference means, write your definition or explanation and enclose
  it within square brackets. Adjust for Clarity and Accuracy A passage containing a quotation must follow
  all the rules of grammatical sentence structure: tenses should be consistent, verbs and subjects should
  agree, and so on. If the form of the quotation doesn’t quite fit the grammar of your own sentences,
  you can either quote less of the original source, change your sentences, or make a slight alteration
  in the quotation. For example, you might write, “Leopold writes that city dwellers assume ‘breakfast
  comes from the grocery’” or “Leopold writes that city dwellers ‘[suppose] that breakfast comes from
  the grocery.’” For more information on using quotations, see Editing Focus: Quotations and Quotations.</p>

  <h3>When to Quote</h3>

  <p>Reserve direct quotations for cases in which you cannot express ideas better yourself or when the
  exact words offer the strongest support for your ideas. Use quotations when the original words are especially
  precise, clear, powerful, or vivid, but ensure they do not substitute for your own thoughts.</p>

  <ul><li>Precise. Use quotations when the words are important in themselves or when the author makes
  fine but important distinctions. “Government, even in its best state, is but a necessary evil: in its
  worst state, an intolerable one.”—Thomas Paine</li><li>Clear. Use quotations when the author’s ideas
  are complex and difficult to paraphrase. “Paragraphs tell readers how writers want to be read.”—William
  Blake</li><li>Powerful. Use quotations when the words are especially authoritative and memorable. “You
  shall know the truth, and the truth shall make you free.”—John 8:32, King James Version</li><li>Vivid.
  Use quotations when the language is lively and colorful, when it reveals something of the author’s or
  speaker’s character. “A person who won’t read has no advantage over one who can’t read.”—Mark Twain</li></ul>

