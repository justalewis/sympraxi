  <p>Internet sources. As online media became an increasingly significant means of sharing resources,
  the style guide was adapted to incorporate references for Web sites, online journals, and print journals
  retrieved online. Changes in production options for writers and publishers also influenced changes to
  style guides. When authors typed papers using traditional typewriters, they were unable to use italics
  to indicate the name of a publication; instead, the underlining of text indicated these documents. Modern
  word processing programs allow the author to control type at a much more precise level, allowing italics
  as well as control of spacing and line breaks.</p>

  <p>Like most style guides, MLA style changes over time. The guidelines presented here are appropriate
  for the seventh edition of the MLA Style Guide. You should check to make sure you are using the most
  current version. In the college courses you take, your individual instructors may impose additional
  style choices or ones that conflict with the style guide for the academic discipline. Be sure to follow
  the special style instructions for the assignments in that course.</p>

  <h3>Applying MLA Style in Your Own Papers</h3>

  <p>The way you use words and place text on a page influence the audience’s ability to comprehend information.
  Much the way the shape of a stop sign indicates the same meaning as “STOP” to a driver, readers understand
  information in part through its placement and format. As a result, there is consistency among the papers
  submitted within a</p>

  <p>Document Design and Formatting in the Writing Classroom writing classroom and established journals
  in an academic field. This consistency allows readers to become accustomed to certain conventions and
  increases readability. When a professor reviews multiple papers formatted in the same way, for example,
  she can easily find the author’s name and class section on all of the papers. Likewise, students in
  an English class will be able to find a source from the information given in an academic journal because
  they can understand in-text citation and bibliographic reference.</p>

  <p>MLA-formatted papers for a class rarely include graphic elements, like illustrations or tables. In
  fact, MLA style limits the use of design in formatting to ensure that the focus remains on the text.
  Settings specified by MLA incorporate the design principles reviewed above. The remainder of the chapter
  discusses MLA formatting of academic papers, like the research papers you’ll develop in your writing
  classes, as opposed to writing for publication, such as professional journals.</p>

  <p>The primary use of repetition in MLA format is to indicate that text formatted in the same way throughout
  a paper signifies a similar use. Contrast is important in separating distinct sections of a paper from
  one another. Alignment in MLA increases readability by providing a common starting point for the reader.
  Proximity helps readers follow related ideas. For example, section headers are located directly over
  the text they introduce, allowing readers to quickly find information.</p>

  <h3>Margins</h3>

  <p>Margins are the distance from the edge of the paper to where the text starts. They define the amount
  of white space around the text on the page. They are important because they emphasize the text through
  contrast (black text on a white page) and increase readability through consistent alignment (headings
  and text line up to the left margin). Margins also contribute to readability by providing a place for
  the reader’s eyes to rest: they ensure appropriate white space to prevent a page from becoming too dense
  with text.</p>

  <p>The MLA style guide requires specific margins of one inch (1”) on all four sides of a page (see Fig.
  4).</p>

