  <h3>Rhetorical Choices</h3>

  <p>The text always adheres to the task as discussed in Section 1.5: summarizing, paraphrasing, explaining,
  analyzing, and evaluating a reading selection. The text also shows ample evidence of the writer’s intent
  to consciously meet or challenge conventional expectations in rhetorically effective ways.</p>

  <p>The written work consistently features clear and coherent language that allows readers to move seamlessly
  from section to section with clearly linked concepts and transitions. The writing is consistently focused
  on the topic.</p>

  <p>Each aspect of the rhetorical situation is clearly identifiable, presented clearly, and understood.
  The language is perfectly suited to the writer’s purpose and audience.</p>

  <p>4 Accomplished</p>

  <p>The text usually adheres to the task as discussed in Section 1.5: summarizing, paraphrasing, explaining,
  analyzing, and evaluating a reading selection. The text also shows some evidence of the writer’s intent
  to consciously meet or challenge conventional expectations in rhetorically effective ways.</p>

  <p>The writing usually provides clear and coherent language that allows readers to move easily from
  section to section with linked concepts and transitions. The writing is mostly focused on the topic.</p>

  <p>Most aspects of the rhetorical situation are identifiable, presented clearly, and understood. Language
  is generally suited to the writer’s purpose and audience.</p>

  <p>3 Capable</p>

  <p>The text generally adheres to the task as discussed in Section 1.5: summarizing, paraphrasing, explaining,
  analyzing, and evaluating a reading selection. The text also shows limited evidence of the writer’s
  intent to consciously meet or challenge conventional expectations in rhetorically effective ways.</p>

  <p>The writing provides general awareness of clear and coherent language and sometimes allows readers
  to move from section to section with basic linking of concepts and meaningful transitions. The writing
  may show a lack of focus on the topic.</p>

  <p>Some aspects of the rhetorical situation are identifiable, presented, and partly understood. Language
  is sometimes unsuited to the writer’s purpose and audience.</p>

  <p>Score</p>

  <p>2 Developing</p>

  <p>Critical Language Awareness</p>

  <p>Clarity and Coherence</p>

  <h3>Rhetorical Choices</h3>

  <p>The text occasionally adheres to the task as discussed in Section 1.5: summarizing, paraphrasing,
  explaining, analyzing, and evaluating a reading selection. The text also shows emerging evidence of
  the writer’s intent to consciously meet or challenge conventional expectations in rhetorically effective
  ways.</p>

  <p>The writing provides minimal attention to clear and coherent language and does not adequately allow
  readers to move from section to section through the use of linked concepts or transitions. The writing
  is often unfocused.</p>

  <p>One aspect of the rhetorical situation is identifiable and presented and is partially or minimally
  understood. Language is mostly unsuited to the writer’s purpose and audience.</p>

  <p>1 Beginning</p>

  <p>The text does not adhere to the task as discussed in Section 1.5: summarizing, paraphrasing, explaining,
  analyzing, and evaluating a reading selection. The text also shows little to no evidence of the writer’s
  intent to consciously meet or challenge conventional expectations in rhetorically effective ways.</p>

  <p>The writing reflects minimal or no attention to clear and coherent language and may hinder readers
  in moving from section to section. Transitions are either missing or incorrect. The writing is unfocused.</p>

  <p>No aspect of the rhetorical situation is identifiable, presented, or understood. Language is unsuited
  to the writer’s purpose and audience.</p>

  <p>1.7 Spotlight on … Academia</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Determine how various mediums address, affect,
  and interact with a range of audiences. • Examine the importance of your college experience and larger
  impact on society. • Write and post texts in different environments and in varying rhetorical situations.</p>

  <h3>The Role of the Classroom in This Brave New World</h3>

  <p>The term academia refers to “the life, community, or environment of teachers, schools, and education.”
  With the advent of the COVID-19 pandemic in 2020, the world of academia was challenged. There were logistical
  challenges, of course: How would students and teachers attend classes and remain safe? In what ways
  could digital learning replace classroom learning effectively? But there were deeper philosophical challenges:
  What is the real value of a traditional college education in a world that is seemingly on the brink
  of one crisis after another? Would the classroom become something of value, leading the way in this
  brave new world, or would it become obsolete? While some students chose not to return to their classrooms
  in the fall of 2020, others either returned or logged on virtually. Whichever way students decided to
  engage, the larger purpose of college was challenged.</p>

  <h3>Authentic Publication</h3>

  <p>To practice your knowledge and use some of the tools in your growing skill set, do this short activity.
  If you have a social media account, use it to bridge social media and academia by publishing a version
  of your critical response that meets the characteristics of the platform, likely by reducing the character
  count or posting a video. First, summarize or paraphrase your main points. Research a link you might
  include to provide readers with background information and a larger context of your rhetorical situation.
  Next, create a post that asks an honest, analytical, or evaluative question about the topic. In determining
  your phrasing, assess the rhetorical situation. If you can, tag a few of your followers to encourage
  them to respond. You might even mention that this is part of a school project or add a hashtag—a word
  or phrase preceded by # that categorizes the accompanying text. If you are on multiple platforms, try
  different versions or approaches to see which one generates the most attention and discussion. As a
  result, you might learn something compelling or find your interest piqued by engaging with others. Maybe
  you can even incorporate what you learn into your portfolio reflection, which is covered at the end
  of this chapter. Remember, part of the goal of writing is learning. Writing helps you solidify what
  you are thinking, what it might mean, why it matters, how to say it, and how to communicate it to others.
  Using various media to convey information will continue to be an essential element of your education
  and your life, so be sure to practice it.</p>

  <p>1.8 Portfolio: Tracing Writing Development</p>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Reflect on the development of composing processes. • Reflect on how those composing processes
  affect your work.</li></ul>

  <p>The Portfolio: And So It Begins . . .</p>

  <p>In simplest terms, a writing portfolio is a collection of your writing contained within a single
  binder or folder. This writing may have been done over a number of weeks, months, or even years. It
  may be organized chronologically, thematically, or according to quality. A private writing portfolio
  may contain writing that you wish to keep only for yourself. In this case, you decide what is in it
  and what it looks like. However, a writing portfolio assigned for a class will contain writing to be
  shared with an audience to demonstrate the growth of your writing and reasoning abilities. One kind
  of writing portfolio, accumulated during a college course, presents a record of your work over a semester,
  and your instructor may be use it to assign a grade. Another type of portfolio presents a condensed,
  edited story of your semester’s progress in a more narrative form. The most common type of portfolio
  assigned in a writing course combines the cumulative work collected over the semester, plus a cover
  letter in which you explain the nature and value of these papers. Sometimes you will be asked to assign
  yourself a grade on the basis of your own assessment. The following suggestions may help you prepare
  a course portfolio:</p>

  <ul><li>Make your portfolio speak for you. If your course portfolio is clean, complete, and carefully
  organized, that is how it will be judged. If it is unique, colorful, creative, and imaginative, that,
  too, is how it will be judged. Similarly, your folder will be judged more critically if it is messy,
  incomplete, and haphazardly put together. Before giving your portfolio to somebody else for evaluation,
  consider whether it reflects how you want to be presented.</li><li>Include exactly what is asked for.
  If an instructor wants three finished papers and a dozen sample journal entries, that is the minimum
  your course portfolio should contain. Sometimes you can include more than what is asked for, but never
  include less.</li><li>Add supplemental material judiciously. Course portfolios are among the most flexible
  means of presenting yourself. If you believe that supplemental writing will show you in a better light,
  include that too, but only after the required material. If you include extra material, attach a memo
  to explain why it is there and what you think it adds to your portfolio. Supplemental writing might
  include journals, letters, sketches, or diagrams that suggest other useful dimensions of your thinking.
  • Include perfect final drafts. At least make them as close to perfect as you can. Show that your own
  standard for finished work is high. Check spelling, grammar, citation, formatting, and font sizes and
  types. You should go over your work carefully and be able to find the smallest errors. In addition,
  if you are asked for a hard copy of your portfolio, final drafts should be double-spaced and printed
  on only one side of highquality paper, unless another format is requested. And, of course, your work
  should be carefully proofread and should follow the language and genre conventions appropriate to the
  task. • Demonstrate growth. This is a tall order, but course portfolios, unlike most other assessment
  instruments, can show positive change. The primary value of portfolios in writing classes is that they
  allow you to demonstrate how a finished paper came into being. Consequently, instructors frequently
  ask for early drafts to be attached to final drafts of each paper, the most recent on top, so they can
  see how you followed revision suggestions, how much effort you invested, how many drafts you wrote,
  and how often you took risks and tried to improve. To build such a record of your work, make sure the
  date of every draft is clearly marked on each one, and keep it in a safe place (and backed up electronically).
  • Demonstrate work in progress. Course portfolios allow writers to present partially finished work that
  suggests future directions and intentions. Both instructors and potential employers may find such preliminary
  drafts or outlines as valuable as some of your finished work. When you include a tentative draft, be
  sure to attach a memo or note explaining why you still believe it has merit and in which direction you
  plan to take your next revisions. • Attach a table of contents. For portfolios containing more than
  three papers, attach a separate table of contents. For those containing only a few papers, embed your
  table of contents in the cover letter. • Organize your work using clear logic. Three methods of organization
  are particularly appealing: ◦ Chronological order: Writing is arranged in order, beginning with the
  first week of class and ending with the last week, with all drafts, papers, journal entries, letters,
  and such fitting in place according to the date written. Only the cover letter is out of chronological
  order, appearing at the beginning and serving as an introduction to what follows. This method allows
  you to show the evolution of growth most clearly, with your latest writing (presumably the best) presented
  at the end. ◦ Reverse chronological order: The most recent writing is up front, and the earliest writing
  at the back. In this instance, the most recent written document—the cover letter—is in place at the
  beginning of the portfolio. This method features your latest (presumably the best) work up front and
  allows readers to trace the history of how it got there. ◦ Best-first order: You place your strongest
  writing up front and your weakest in back. Organizing a portfolio this way suggests that the work you
  consider strongest should count most heavily in evaluating the semester’s work.</li></ul>

  <p>With each completed chapter in this textbook, you will add to this portfolio. As you work through
  the chapters and complete the assignments, save each one on your computer or in the cloud, unless your
  instructor asks you to print your work and arrange it in a binder. Each assignment becomes an artifact
  that will form a piece of your portfolio. Depending on your preference or your instructor’s approach,
  you may write a little about each assignment as you add to the portfolio. As you compile your portfolio,
  take some time to read the assignments—drafts and finished products—carefully. Undoubtedly, you will
  see improvement in your writing over a short amount of time. Be sure to make note of this improvement
  because it will prove useful moving forward.</p>

  <h3>Reflective Task: The Freedom of Freewriting</h3>

  <p>As you begin your portfolio with the addition of your critical response, compose an accompanying
  freewrite, sometimes called a quick write. In this case, you will be responding to your own text—a powerful
  tool in your intellectual development. To begin, write quickly and without stopping about the process
  of composing your critical response and the finished product. See where your thoughts go, a process
  that often helps you clarify your own thoughts about the subject—your own text and its creation. When
  you freewrite, write to yourself in your own natural style, without worrying about sentence structure,
  grammar, spelling, or punctuation. The purpose is to help you tie together the ideas from your writing
  process, your assignment, and other thoughts and experiences in your mind. One future value of freewriting
  is that the process tends to generate questions at random, capture them, and leave the answering for
  a later task or assignment. Another bonus of freewriting is that you will build confidence with writing
  and become more disciplined when you have to write. In other words, the more you write, the more confidence
  you will have in your voice and your writing. By now you may have realized that writing, whether on
  social media platforms or in the classroom, is a conversation. The conversation may take place with
  yourself (freewriting), with your instructor and classmates (assignment), or with the world (social
  media). You have learned how people like Selena Gomez and others use simple and effective strategies,
  such as vulnerability, understanding, analysis, and evaluation, to engage in such conversations. Now
  adopt these same processes—try them on for size, practice them, and learn to master them. As you move
  through the remainder of this course and text, compose with intention by keeping in mind the limits
  and freedoms of a particular defined rhetorical situation.</p>

