  <p>Recall that my major thesis regards the emotional well-being of multiple birth children, of which
  the Suleman octuplets were an example. According to Student 1, this argument would have benefited from
  psychological predictions from experts or authorities. I didn’t find any such psychological predictions
  in my initial research, but my readers have convinced me that I would need to do that research for any
  future revisions of this argument. They simply need more evidence that my reasoning is sound and probable.</p>

  <p>In the third paragraph of this set, I used a psychologist’s statement about Suleman’s likely exploitation
  of the children for money as a way of showing irony. To me, it was clear that calling the octuplets
  a “commodity that grabs the attention of the world” and stating that “she’s going to get rewarded” for
  it, was disturbing in that the psychologist herself wasn’t showing appropriate concern for the babies’
  welfare. In the preliminary draft, I assumed that all readers would understand the import of this psychologist’s
  statement. But as I thought about the feedback I was getting—Student 9, for example—I realized this
  point needed sharper language in the presentation draft to indicate the bargaining power of children
  viewed as a “commodity” to be bought and sold.</p>

