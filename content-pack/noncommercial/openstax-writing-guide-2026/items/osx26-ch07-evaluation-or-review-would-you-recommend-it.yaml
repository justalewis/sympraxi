  <p>As you continue to plan your review, consider these questions: Depending upon your audience, how
  much background or context should you provide about your topic? Are they likely or unlikely to have
  knowledge about the topic? Do you need to summarize anything about your primary source? Do you need
  to provide historical or cultural context? Use the notes you took earlier as your draft your essay.
  Remember, you can change things! It is up to you to decide how to organize your argument and where to
  present specific evidence. Your review will contain both summary/observation (objectivity) and evaluation/analysis
  (subjectivity). Practice determining whether statements are summary or observation as opposed to evaluation
  or analysis. Access multimedia content (http://openstax.org/books/writing-guide/pages/7-5-writing-process-thinkingcritically-about-entertainment)
  Secondary Source Evidence</p>

  <p>Once you form your own opinions, you may want to look for additional sources to support your review.
  Secondary sources, or sources that contain the opinions and analyses of others, are frequently used
  in academic writing to help writers support a point or provide background and context. Scholarly, peer-reviewed
  secondary sources give your review greater credibility because the articles are written by experts in
  their fields. Use your college library’s databases, or ask a librarian whether your college provides
  access to journals that publish articles on movies, television, and culture. Most colleges have access
  to JSTOR, a database search engine focused on the humanities. In addition, the MLA International Bibliography
  is a common database of journals related to culture. Research Process: Accessing and Recording Information
  and Annotated Bibliography: Gathering, Evaluating, and Documenting Sources provide more information
  about finding sources. Another, less academic, place to look for secondary sources is in Recap. In recent
  years, recapping has become a popular way to join the conversation about TV shows, with sites such as
  The AV Club, The Huffington Post, Slate (https://openstax.org/r/slate), The Verge (https://openstax.org/r/theverge),
  and Vox (https://openstax.org/ r/vox) dedicating staff to summarizing and discussing popular shows.
  Fans engage with each other and recap writers by commenting on and sharing the articles. Note, too,
  that well-known publications, such as The New York Times (https://openstax.org/r/ thenewyorktimes),
  review not only movies and TV shows but also products such as those you may have chosen to write your
  review about. In addition, Consumer Reports (https://openstax.org/r/consumerreports) is one of the longest-running
  magazines dedicated to reviewing products of all kinds. Many websites, as well, review video games and
  consoles.</p>

  <h3>Drafting the Introduction</h3>

  <p>The introduction should interest readers in your topic and make them eager to learn more about it.
  If you were proposing this idea to a company, what would your “elevator pitch” be? What might you say
  to quickly pique audience interest? You might describe the part that convinced you it was good. You
  might explain why your audience would find the topic relatable.</p>

  <p>Be sure readers know by the end of the introduction what specifically you are reviewing. Provide
  the title and necessary background/context: when it was made, the medium (film, book, podcast), the
  genre, and how to find it (Netflix, Amazon Prime, Hulu). Include your overall evaluation: Did you like
  it or not, and why overall?</p>

  <p>Then present your thesis at the end of your introduction.</p>

  <p>Introduction example. Many people love romantic comedies, but what happens when real life isn’t like
  the movies? We are conditioned to believe there is one person we are destined to be with. Disney movies,
  TV shows like The Office, Hallmark Channel Christmas movies, and traditional romantic comedies reinforce
  the notion that for the believer, true love is right around the corner. But everyone knows the pain
  of rejection or of pining for a person who doesn’t seem to notice them. The CW series Crazy Ex-Girlfriend
  shows what it’s like when love is more complicated than what we see in the movies. The show follows
  Rebecca Bunch, a successful but unhappy—and far from virtuous or admirable—New York lawyer who instantly
  abandons her life to move to West Covina, California, to pursue Josh Chan, her summer-camp crush from
  long ago. Rebecca cooks up crazy, desperate schemes to get the attention of the aloof and clueless Josh.
  Crazy Ex-Girlfriend masterfully taps into our inner crazy ex by making good comedy out of Instagram
  stalking, relationship sabotage, and infatuation.</p>

  <p>Now, write your introduction:</p>

