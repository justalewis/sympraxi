- id: uw-madison-interpreting-assignments
  title: "Interpreting Writing Assignments from Your Courses"
  url: https://writing.wisc.edu/handbook/processandstructure/interpreting-writing-assignments-from-your-courses/
  publisher: UW-Madison Writer's Handbook
  license: CC-BY-NC-SA-4.0
  can_vendor: false
  link_check: auto
  summary: >-
    How to read an assignment closely enough: read it several times, find the
    central task, treat a key plural noun in the prompt (reasons, causes,
    effects) as a hint about structure, learn the basics of the genre, study
    successful models, and ask your instructor specific questions.
  topics:
    concern: [assignment:prompt, assignment:genre-conventions]
    stage: [understanding-assignment]
  audience: [undergraduate, graduate]
  language: en
  last_checked: 2026-10-14
  last_status: 200

