  <h3>Publish Your Work</h3>

  <p>After completing your argumentative research paper, you should have a product to be proud of. Your
  instructor may have a plan to publish papers written by class members, or you may be interested in publishing
  on your own and joining a wider scholarly conversation. Consider submitting your work to one of these
  journals that publish undergraduate research:</p>

  <ul><li>Butler Journal of Undergraduate Research (https://openstax.org/r/butlerjournalUG) • Crossing
  Borders: A Multidisciplinary Journal of Undergraduate Scholarship (https://openstax.org/r/ crossingborders)
  • Liberated Arts: A Journal for Undergraduate Research (https://openstax.org/r/liberatedarts) • Reinvention:
  An International Journal of Undergraduate Research (https://openstax.org/r/reinvention)</li></ul>

  <p>In addition, if you have designed your research project as a solution to a local problem, consider
  finding venues to disseminate the information to those for whom it would be the most useful. This decision
  may mean adjusting the format, tone, language, and/or conventions of your work to address the needs
  of a specific audience.</p>

  <p>12.9 Portfolio: Why Facts Matter in Research Argumentation</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Distinguish between facts, inferences, and informed
  opinion and when to use each. • Analyze how facts have shaped your research and composing processes.</p>

  <p>As this assignment draws to a close, you will note that facts, examples, inferences, informed opinions,
  and personal experiences all provided believable evidence for your argument. However, be aware that
  the difference between facts and other evidence is that facts are verifiable. That Alaska has the most
  territory of all U.S. states is not up for question or interpretation; personal belief or opinion is
  irrelevant. Unless their accuracy is challenged, facts are essential in any research paper. Yet they
  can be misleading when used in certain ways or proved incorrect by later discovery. Hopefully, you have
  supported your research paper with verifiable factual information.</p>

  <p>Inferences are conclusions based on a combination of facts and personal knowledge. For example, if
  you attend five different classes in five different academic departments and find no minority students
  in each class, you may infer that very few minority students attend the school. However, although your
  inference may seem reasonable, it is not a fact because you have not met all the students at the college,
  nor do you have access to enrollment figures.</p>

  <p>Facts are not necessarily better or more important than inferences; they serve different purposes.
  Facts provide information, and inferences give that information meaning. Sometimes inferences are all
  you will have available. For example, statistics reflecting what “Americans” believe or do are only
  inferences about these groups based on information collected from a relatively small number of individuals.
  To be credible, inferences must be reasonable and based on factual evidence.</p>

  <p>Expert opinion makes strong evidence. A forest ranger’s testimony about trail damage caused by mountain
  bikes or lug-soled hiking boots reflects the training and experience of an expert. A casual hiker making
  the same observation is less believable. Personal testimony or informed opinion is based on direct personal
  experience. When someone has experienced something firsthand, their knowledge cannot be discounted easily.
  If you have been present at the mistreatment of someone, whether as the object or observer of the incident,
  your eyewitness testimony will carry weight.</p>

  <h3>Reflective Task</h3>

  <p>After reflecting on your argumentative research essay by considering bias, facts, and inferences,
  you now have the opportunity to reflect on what you learned through the research and writing process
  in general. Think critically about your writing process, reflect on each stage, and consider how this
  writing experience was similar to or different from others. Also, estimate roughly what percent of your
  sources are facts, examples, inferences, or informed opinion. As you reflect, answer the following questions
  in your notebook or as part of a cover letter for your research paper:</p>

  <ul><li>How did you decide on the topic for your paper? • How did you decide on the scope of your topic?
  • What did you know about your topic before you began your research? • What did you learn about your
  topic? • What primary and secondary sources did you collect, and why? • How did you arrive at a workable
  thesis? • How did you determine which sources best supported your thesis? • Did you rely most on facts,
  examples, inferences, expert opinion, or personal experiences? Why? • What type of citation did you
  use for crediting material you did not write? • How did collaboration with others help you as you wrote
  and revised your paper? • How did the writing for this paper compare with other writing assignments?
  Was it easier or harder to write than others you have written? • How did you manage the timing of your
  essay, from topic selection, to gathering sources, to writing and revising? • What could you have done
  differently to make your writing process easier or more effective? • What insights do have about yourself
  as a writer?</li></ul>

