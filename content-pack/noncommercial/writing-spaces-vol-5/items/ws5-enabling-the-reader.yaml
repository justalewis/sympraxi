  <p>Teacher Resources for “Enabling the Reader”</p>

  <h3>Overview and Teaching Strategies</h3>

  <p>This chapter draws on feminist disability studies that perceive disability as a defect in the surrounding
  environment of disabled bodies rather than the bodies themselves. Within that framework, student authors
  are invited to recognize themselves as contributors to environments that could disable the readers at
  times. This chapter can be used as a foundation to maintain readability and accessibility in students’
  produced documents as social justice action throughout the semester. Thus, it might be more beneficial
  to introduce readability and accessibility and assign the chapter to students at the very beginning
  of the semester. The chapter can be assigned for reading as a whole or in parts, depending on the teacher’s
  agenda and course scope. Exercises and discussion questions are embedded inside the text for accessibility
  reasons.</p>

  <p>The chapter draws on the information design theory forwarded by Janice Redish, “What Is Information
  Design?”, to identify three levels of readability and accessibility of texts. The three levels are:</p>

  <ul><li>Reading the text • Comprehending it • Using it appropriately</li></ul>

  <p>Thus, the examples in the chapter reiterate the three levels of readability and accessibility to
  help students internalize Redish’s definition of readability and accessibility.</p>

  <h3>Activities</h3>

  <p>Purposefully, exercises were suggested to students in-text to relate to a particular example of text
  that disables/enables the reader. These exercises can be assigned to students as homework that they
  do individually or as group work to do in class. In what follows, I provide five more activities that
  aim to engage students in research around readability and accessibility in and outside the classroom.
  You might introduce these activities as actions that respond to Jay Dolmage’s invitation for an ongoing
  performance of action toward composing readable and accessible texts.</p>

  <p>Interviews Concerning Emails’ Readability and Accessibility This activity starts and ends in the
  classroom, but the research component occurs outside the classroom.</p>

  <p>1. Introduce the activity to students indicating that each needs to interview someone who has a profession
  that requires extensive email communication. Each student needs to ask their interviewee about practices
  they perceive in the email communication that makes it hard for them to read, understand, and/or respond
  to emails.</p>

  <p>2. Ask students to compose the interview questions together, first in small groups, and after that
  as a whole class. Prompt students to use the examples in this book chapter to inspire their questions
  and make sure they bring questions about new aspects of readability and accessibility that the book
  chapter didn’t include.</p>

  <p>3. After students conduct their interviews, let them share their findings in class. Help students
  arrange their findings in categories of readability and accessibility and draw conclusions accordingly.</p>

  <p>4. Ask students how their research findings might influence their future composition of emails.</p>

  <p>Professional Document Analysis This activity aims to analyze professional documents with an eye on
  readability and accessibility.</p>

  <p>1. Depending on the focus of your course, provide students with professional documents (brochures,
  flyers, resumes, instructions, etc.) to analyze in groups in class.</p>

  <p>2. Ask students to create two lists: one about what was done well to facilitate the document readability
  and accessibility, and one about what violated readability and accessibility guidelines.</p>

  <p>3. Ask the groups to share their findings with the whole class. Help students create class guidelines
  for readability and accessibility that they’d commit to in their document design.</p>

  <p>Conducting Internet Research about Accessibility Checkers This activity introduces students to accessibility
  checkers that are embedded in various software such as MS Word, Acrobat Reader, and Learning Management
  Systems.</p>

  <ul><li>Ask students to search the internet for tutorials about accessibility checkers in M.S. Word,
  Acrobat Reader, and the Learning Management System that they use in your school.</li><li>Require students
  to follow the instructions in the tutorials to check the readability and accessibility of M.S. Word
  or PDF documents on their computers.</li><li>Ask students to follow the instructions to enhance the
  readability and accessibility of the checked text(s).</li><li>Ask students to share what they learn
  from the process with their class community.</li></ul>

  <h3>Font Types, Colors, and Sizes as Rhetorical Choices</h3>

  <p>1. Ask students to conduct research about font types, colors, and sizes that facilitate readability
  to readers with different conditions and capabilities, such as Dyslexia and color-blind readers.</p>

  <p>2. Encourage students to think of the implications of their findings on their rhetorical choices
  of font size, type, and color as writers.</p>

  <p>Naming Files Meaningfully 1. Introduce file names as a pointer to file contents that function similarly
  to email subject lines and document titles.</p>

  <p>2. Ask students to go back to the last three assignment files submitted to their teacher and/or peers
  through the learning management system they use.</p>

  <p>3. Ask students to pay attention to how they named their files.</p>

  <p>4. Ask students to reflect on whether they made it easy for their teacher and/or peers to know who
  submitted what by reading the file names.</p>

  <p>5. Ask students to revise the file names, when necessary, to point out the author and what they submitted
  to the reader.</p>'
