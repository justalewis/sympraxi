  <p>Multimodal and Online Writing: Creative Interaction between Text and Image</p>

  <p>18</p>

  <h3>CHAPTER OUTLINE</h3>

  <p>18.1 Mixing Genres and Modes 18.2 Multimodal Trailblazer: Torika Bolatagici 18.3 Glance at Genre:
  Genre, Audience, Purpose, Organization 18.4 Annotated Sample Reading: “Celebrating a Win-Win” by Alexandra
  Dapolito Dunn 18.5 Writing Process: Create a Multimodal Advocacy Project 18.6 Evaluation: Transitions
  18.7 Spotlight on . . . Technology 18.8 Portfolio: Multimodalism</p>

  <p>INTRODUCTION Chances are you already have a great deal of experience with multimodal composition—that
  is, writing or creating content by combining different types of communication. Much of your experience
  may come from digital spaces, perhaps even from platforms such as social media that you don’t associate
  with academics. According to literature examining adolescent and young adult literacy skills, young
  adults incorporate a great deal of multimodal communication—which includes sound, images, movement,
  and text—into their everyday lives to express themselves and connect with others. Social media has no
  doubt hastened the spread of multimodal communication, and its prevalence in the world is unprecedented.
  Perhaps you have never believed that your experience with digital and multimodal writing connects to
  academic composition, but indeed it does. Just as technology has changed how people interact with the
  world, multimodal composition has altered how they create content. In this chapter, you will learn how
  to combine your experience in creating and using multimodal composition with established writing practices,
  particularly those used in argumentative writing, to generate connected content that creates meaning.
  Multimodal composition begins where any other composition does: with the rhetorical situation, or the
  circumstance of communication in which one person (the composer) uses communication to influence the
  perspective of another (the audience). All multimodal compositions are created for a specific time and
  place and a particular audience who views the world in an explicit and culturally influenced way. As
  a writer, you make choices based on the rhetorical situation: context, audience, purpose, genre, and
  culture. You consider the strengths and weaknesses of all the possible means and tools available for
  reaching your rhetorical goals. By identifying the audience, determining what you need to tell the audience,
  and analyzing the best way to do that (including which types of media to use), you are empowered to
  create an effective and targeted composition. In many ways, multimodal composition opens a range of
  possibilities by offering you any number of tools to make meaning, rather than limiting you to text
  alone. For example, a sportswriter might rely heavily on visuals to engage readers and demonstrate a
  runner’s prowess, or they might create infographics to relay statistics about the athlete or the meet
  itself.</p>

  <h2>LEARNING OUTCOMES By the end of this section, you will be able to:</h2>

  <ul><li>Address a range of audiences using a variety of technologies. • Adapt composing processes for
  a variety of modalities, including textual and digital compositions. • Match the capacities of different
  print and electronic environments to varying rhetorical situations. The writing genre for this chapter
  incorporates a variety of modalities. A genre is a type of composition that encompasses defined features,
  follows a style or format, and reflects your purpose as a writer. For example, given the composition
  types romantic comedy, poetry, or documentary, you probably can think easily of features of each of
  these composition types. When considering the multimodal genres, you will discover that genres create
  conventions (standard ways of doing things) for categorizing media according to the expectations of
  the audience and the way the media will be consumed. Consider film media, for example; it encompasses
  genres including drama, documentaries, and animated shorts, to name a few. Each genre has its own conventions,
  or features. When you write or analyze multimodal texts, it is important to account for genre conventions.
  A note on text: typically, when referring to text, people mean written words. But in multimodal genres,
  the term text can refer to a piece of communication as a whole, incorporating written words, images,
  sounds, and even movement. The following images are examples of multimodal texts.</li></ul>

  <p>Linguistic text: The most common mode for writing, the linguistic mode includes written or spoken
  text. Visuals: The visual mode includes anything the reader can see, including images, colors, lighting,
  typefaces, lines, shapes, and backgrounds. Audio: The audio mode includes all types of sound, such as
  narration, sound effects, music, silence, and ambient noise. Spatial: Especially important in digital
  media, the spatial mode includes spacing, image and text size and position, white space, visual organization,
  and alignment. Gestural: The gestural mode includes communication through all kinds of body language,
  including movement and facial expressions. Multimodal composition provides an opportunity for you to
  develop and practice skills that will translate to future coursework and career opportunities. Creating
  a multimodal text requires you to demonstrate aptitude in various modes and reflects the requirements
  for communication skills beyond the academic world. In other words, although multimodal creations may
  seem to be little more than pictures and captions at times, they must be carefully constructed to be
  effective. Even the simplest compositions are meticulously planned and executed. Multimodal compositions
  may include written text, such as blog post text, slideshow text, and website content; image-based content,
  such as infographics and photo essays; or audiovisual content, including podcasts, public service announcements,
  and videos.</p>

  <h2>Multimodal Trailblazer: Torika Bolatagici</h2>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Identify various rhetorical and culture contexts while reading for inquiry, learning, critical
  thinking, and communication.</li><li>Demonstrate that genre conventions vary and are shaped by purpose,
  culture, and expectation.</li></ul>

  <p>“I can never deny the deeply personal place that the work comes from.”</p>

  <h3>Digital Representations of Embodiment and Cultural Identity</h3>

  <p>Torika Bolatagici is a creator, educator, and art historian who works with various modalities, including
  photography (https://openstax.org/r/photography), video, fine art, and mixed media (https://openstax.org/r/
  mixed_media). Bolatagici was born in Tasmania and, as a young person, spent time living in Hobart, Tasmania;
  Sydney, Australia; and her father’s village of Suvavou, Fiji. Her work has been featured across the
  globe, including in exhibits in the United States, Taiwan, and Mexico as well as throughout New Zealand
  and Australia. She has a PhD from the School of Art and Design, University of New South Wales, where
  she wrote her dissertation on “Somatic Sotia: Commodity, Agency and the Fijian Military Body.”</p>

  <p>In 2013 and 2014, Bolatagici coordinated the Contemporary Pacific Arts Festival (https://openstax.org/r/
  contemporary_specific), curating an experience that focused on Pacific arts practices in Australia.
  She invited speakers to present on themes spanning activism and the arts, cultural appropriation, and
  contemporary artistic practices. Bolatagici now works as an educator, lecturing on art and performance
  at Deakin University in Australia, and has led youth arts workshops in the local Pacific community.</p>

  <p>Reflecting on the beginnings of her career, she describes going through her undergraduate coursework
  and feeling the responsibility of bringing “brown-ness” to the classroom. After finding that higher
  education largely dismissed the lived experiences of marginalized communities and spending time at the
  Stuart Hall Library at the Institute of International Visual Arts, Bolatagici was inspired to create
  the pop-up Community Reading Room in Melbourne, Australia, in 2013.</p>

  <p>Through the pop-up room, she hoped to engage the community in international visual arts and culture.
  She began her initiative by sharing her own personal collection, including texts and anthologies of
  BIPOC (Black, Indigenous, and people of color) art. The Community Reading Room provides an emphasis
  on contemporary art and theory from Africa, the Americas, and Oceania.</p>

  <p>Bolatagici has incorporated a variety of media (https://openstax.org/r/variety) into her academic
  and professional portfolios, describing how her work helps her not only represent diverse cultures (https://openstax.org/r/represent)
  but also explore her own identity. From photo essays (https://openstax.org/r/ photo_essays) to academic
  papers, her compositions are anchored by the common thread of representing marginalized people and experiences,
  particularly those related to communities of color. Her creative output has focused on representation
  of mixed-race identity, Pacific arts practices, and militarism. Through mixed media, she investigates
  relationships between visual culture and historiography (study of historical writings); human ecology
  (study of relationships between humans and their natural, social, and created environments); and the
  intersection of gender, knowledge, and globalization.</p>

  <p>Bolatagici describes her work as interdisciplinary, creating components across a wide range of media.
  Instead of limiting herself, she allows her work to flow naturally, staying focused in the moment. With
  these unique components, she looks at the relationship between visual culture and human ecology. This
  interdisciplinary approached emerged for Bolatagici even before she knew it as multimodalism. Because
  her interests in college varied so greatly, she pursued a media arts degree so that she could explore
  visual arts as they related to cultural studies. This pursuit grew into a career that now includes new
  modes and media sources, such as photography, video, and mixed media.</p>

  <p>Choosing a multimodal approach because it better communicates the complex subjects she conveys, Bolatagici
  draws on her own experiences in order to represent the experiences of marginalized people at the forefront
  of her compositions. For Bolatagici, creating in any form is bigger than the page, and she aims to bring
  her reality to life through visual, textual, and multimedia creations that communicate in four dimensions.</p>

  <p>Read Bolatagici’s weekly journal (https://openstax.org/r/freshmilk) during her residency in Barbados.</p>

  <h3>Discussion Questions</h3>

  <p>1. How does using a multimodal approach allow Bolatagici to communicate her lived experience?</p>

  <p>2. Why does representation matter in multimodal composition? How has Bolatagici addressed this in
  her methods?</p>

  <p>3. What role can multimodal compositions play in exploring experiences beyond your own?</p>

  <p>4. How can multimodal works at times better communicate aspects of culture and history than literary
  text alone?</p>

  <p>5. In what sense is bringing communities together an important aspect of Bolatagici’s work?</p>

  <p>18.3 Glance at Genre: Genre, Audience, Purpose, Organization</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Identify key genre conventions, including structure,
  tone, and mechanics. • Implement common formats and design features for different text types. • Demonstrate
  how genre conventions vary and are shaped by purpose, culture, and expectation.</p>

  <p>The multimodal genres of writing are based on the idea that modes work in different ways, with different
  outcomes, to create various vehicles for communication. By layering, or combining, modes, an author
  can make meaning and communicate through mixed modes what a single mode cannot on its own. Essentially,
  modes “cooperate” to communicate the author’s intent as they interweave meanings captured by each. For
  example, think of a public service announcement about environmental conservation. A composer can create
  a linguistic text about the dangers of plastic pollution in oceans and support the ideas with knowledge
  of or expertise in the subject. Yet words alone may not communicate the message forcefully, particularly
  if the audience consists of people who have never considered the impact of pollution on the oceans.
  That composer, then, might combine the text with images of massive amounts of human-generated plastic
  waste littering a shoreline, thus strengthening the argument and enhancing meaning by touching on audience
  emotions. By using images to convey some of the message, the composer layers modes. The picture alone
  does not tell the whole story, but when combined with informational text, it enhances the viewer’s understanding
  of the issue. Modes, therefore, can be combined in various ways to communicate a rhetorical idea effectively.</p>

  <h3>Audience Awareness</h3>

  <p>As with any type of composition, knowing your audience (the readers and viewers for whom you are
  creating) will help you determine what information to include and what genre, mode(s), or media in which
  to present it. Consider your audience when choosing a composition’s tone (composer’s attitude toward
  the audience or subject), substance, and language. Considering the audience is critical not only in
  traditional academic writing but also in nearly any genre or mode you choose. Ask yourself these questions
  when analyzing your audience’s awareness:</p>

  <ul><li>What (and how much) does the audience already know about the topic? The amount of background
  information needed can influence what genre, modes, and media types you include and how you use them.
  You don’t want to bore an audience with information that is common knowledge or overwhelm an audience
  with information they know nothing about.</li><li>What is the audience’s viewpoint on the subject? Are
  you creating for a skeptical audience or one that largely agrees with your rhetorical arguments? • How
  do you relate to your audience? Do you share cultural understanding, or are you presenting information
  or beliefs that will be unfamiliar? This information will help you shape the message, tone, and structure
  of the composition.</li></ul>

  <p>Understanding your audience allows you to choose rhetorical devices that reflect ethos (appeals to
  ethics: credibility), logos (appeals to logic: reason), and pathos (appeals to sympathy: emotion) to
  create contextually responsive compositions through multiple modes.</p>

  <p>It important to address audience diversity in all types of composition, but the unique aspects of
  multimodal composition present particular opportunities and challenges. First, when you compose, you
  do so through your own cultural filter, formed from your experiences, gender, education, and other factors.
  Multimodal composition opens up the ability to develop your cultural filter through various methods.
  Think about images of your lived experiences, videos capturing cultural events, or even gestures in
  live performances. Also consider the diversity of your audience members and how that affects the content
  choices you make during composition. Avoiding ethnocentrism—the assumption that the customs, values,
  and beliefs of your culture are superior to others—is an important consideration when addressing your
  audience, as is using bias-free language, especially regarding ethnicity, gender, and abilities.</p>

  <h3>Blogs, Vlogs, and Creative Compositions</h3>

  <p>Among the modes available to you as a composer, blogs (regularly updated websites, usually run by
  an individual or a small group) have emerged as a significant genre in digital literature. The term
  blog, a combination of web and log, was coined in 1999 and gained rapid popularity in the early 2000s.
  In general, blogs have a relatively narrow focus on a topic or argument and present a distinctive structure
  that includes these features:</p>

  <ul><li>A headline or title draws in potential readers. Headlines are meant to grab attention, be short,
  and accurately reflect the content of the blog post.</li><li>An introduction hooks the reader, briefly
  introducing the topic and establishing the author’s credibility on the subject.</li><li>Short paragraphs
  often are broken up by images, videos, or other media to make meaning and supplement or support the
  text content.</li><li>The narrative is often composed in a style in which the author claims or demonstrates
  expertise. • Media such as images, video, and infographics depict information graphically and break
  up text. • Hyperlinks (links to other internet locations) to related content often serve as evidence
  supporting the author’s claim. • A call to action provides clear and actionable instructions that engage
  the reader.</li></ul>

  <p>consciousness style or interview-like style. (credit: “BloggerCon IV Day 2 24Jun06 – 13” by Roland
  Tanglao/flickr, CC0 1.0) Other creative compositions include websites, digital or print newsletters,
  podcasts, and a wide variety of other content. Each composition type has its own best practices regarding
  structure and organization, often depending on the chosen modalities, the way they are used, and the
  intended audience. Whatever the mode, however, all multimodal writing has several characteristics in
  common, beginning with effective, intentional composition.</p>

  <h3>Effective Writing</h3>

  <p>Experimenting with modes and media is not an excuse for poorly developed writing that lacks focus,
  organization, thought, purpose, or attention to mechanics. Although multimodal compositions offer flexibility
  of expression, the content still must be presented in well-crafted, organized, and purposeful ways that
  reflect the author’s purpose and the audience’s needs.</p>

  <ul><li>To be well-crafted, a composition should reflect the author’s use of literary devices to convey
  meaning, use of relevant connections, and acknowledgment of grammar and writing conventions.</li><li>To
  be organized, a composition should reflect the author’s use of effective transitions and a logical structure
  appropriate to the chosen mode.</li><li>To be purposeful, a composition should show that the author
  addresses the needs of the audience, uses rhetorical devices that advance the argument, and offers insightful
  understanding of the topic.</li></ul>

  <p>Organization of multimodal compositions refers to the sequence of message elements. You must decide
  which ideas require attention, how much and in what order, and which modalities create maximum impact
  on readers. While many types of formal and academic writing follow a prescribed format, or at least
  the general outline of one, the exciting and sometimes overwhelming features of multimodal possibilities
  open the door to any number of acceptable formats. Some of these are prescribed, and others more open
  ended; your job will inevitably be to determine when to follow a template and when to create something
  new. As the composer, you seek to structure media in ways that will enable the reader, or audience,
  to derive meaning. Even small changes in media, rhetorical appeal, and organization can alter the ways
  in which the audience participates in the construction of meaning. Within a medium—for example, a video—you
  might include images, audio, and text. By shifting the organization, placement, and interaction among
  the modes, you change the structure of the video and therefore create varieties of meaning. Now, imagine
  you use that same structure of images, audio, and text, but change the medium to a slideshow. The impact
  on the audience will likely change with the change in medium. Consider the infamous opening scene of
  the horror movie The Shining (1980). The primary medium, video, shows a car driving through a mountainous
  region. After audio is added, however, the meaning of the multimodal composition changes, creating an
  emphasis on pace—management of dead air—and tone—attitude toward the subject—that communicates something
  new to the audience.</p>

  <p>Island. The addition of the audio mode, music featuring ominous-sounding horns (https://openstax.org/r/ominous),
  not only communicates new information to viewers but also shapes an emphasis on drama and danger. (credit:
  “The upper end of St. Mary Lake and Wild Goose Island, Glacier National Park, Montana. Photo taken from
  Going-to-theSun Road” by Ken Thomas/Wikimedia Commons, Public Domain)</p>

  <h3>Exploring the Genre</h3>

  <p>These are the key terms and characteristics of multimodal texts.</p>

  <ul><li>Alignment: the way in which elements such as text features, images, and particularly text are
  placed on a page. Text can be aligned at the left, center, or right. Alignment contributes to organization
  and how media transitions within a text.</li><li>Audience: readers or viewers of the composition. •
  Channel: a medium used to communicate a message. Often-used channels include websites, blogs, social
  media, print, audio, and video-hosting sites. • Complementary: describes content that is different across
  two or more modes, both of which are necessary for understanding. Often audio and visual modes are complementary,
  with one making the other more meaningful. • Emphasis: the elements in media that are most significant
  or pronounced. The emphasis choices have a major impact on the overall meaning of the text. • Focus:
  a clear purpose for composition, also called the central idea, main point, or guiding principle. Focus
  should include the specific audience the composer is trying to influence. • Layering: combining modes
  in a single composition. • Layout: the organization of elements on a page, including text, images, shapes,
  and overall composition. Layout applies primarily to the visual mode. • Media: the means and channels
  of reaching an audience (for example, image, website, song). A medium (singular form of media) can contain
  multiple modes. • Mode: the method of communication (linguistic, visual, audio, or spatial means of
  creating meaning). Media can incorporate more than one mode. • Organization: the pattern of arrangement
  that allows a reader to understand text or images in a composition. Organization may be textual, visual,
  or spatial. • Proximity: the relationship between objects in space, specifically how close to or far
  from one another they are. Proximity can show a relationship between elements and is often important
  in layout. • Purpose: an author’s reason for writing a text, including the reasoning that accounts for
  which modes of presentation to use. Composers of multimodal texts may seek to persuade, inform, or entertain
  the audience. • Repetition: a unifying feature, such as a pattern used more than once, in the way in
  which elements (text features, typeface, color, etc.) are used on a page. Repetition often indicates
  emphasis or a particular theme. Repetitions and patterns can help focus a composition, explore a theme,
  and emphasize important points. • Supplementary: describes content that is different in two or more
  modes, where a composer uses one mode to convey primary understanding and the other(s) to support or
  extend understanding. Supplementary content should not be thought of as “extra,” for its purpose is
  to expand on the primary media. • Text: written words. In multimodal composition, text can refer to
  a piece of communication as a whole, incorporating written words, images, sounds, and movement. • Tone:
  the composer’s attitude toward the subject and/or the audience. • Transitions: words, phrases, or audiovisual
  elements that help readers make connections between ideas in a multimodal text, including connections
  from sentence to sentence, paragraph to paragraph, and mode to mode. Transitions show relationships
  between ideas and help effectively organize a composition.</li></ul>

  <p>18.4 Annotated Sample Reading: “Celebrating a Win-Win” by Alexandra Dapolito Dunn</p>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Read a diverse range of texts in different genres to identify how conventions are shaped by
  purpose, language, culture, and audience expectation.</li><li>Read effectively for inquiry, learning,
  critical thinking, and communication in various rhetorical and cultural contexts.</li><li>Demonstrate
  the relationships between ideas, patterns of organization, and verbal and nonverbal elements.</li></ul>

  <p>Introduction</p>

  <h3>LIVING BY THEIR OWN WORDS</h3>

  <p>“Celebrating a Win-Win: 30 Years of Progress under the Pollution Prevention Act” by Alexandra Dapolito
  Dunn (b. 1967)</p>

  <p>On this day in 1990, a new era was ushered in for Environmental Protection Agency (EPA) and the nation
  when the Pollution Prevention (P2) Act was signed into law. The act gave the agency new tools to join
  with states, tribes, and communities to prevent pollution before it happens. It also marked a shift
  in the paradigm of environmental protection, which had been mostly focused on end-of-pipe pollution
  control and clean-up strategies.</p>

  <p>Headline and Tone. The linguistic headline immediately allows readers to know the author’s position
  on the subject, and its visual component of boldfaced text allows readers to understand that it’s important.
  Not only does it clearly preface the article by informing the reader of its topic (the Pollution Prevention
  Act), but it also presents the author’s positive attitude toward the subject through the words celebrating
  and win-win.</p>

  <p>Context. Dunn contextualizes the Pollution Prevention Act, showing it as a positive national achievement
  that partnered the government with the people to prevent pollution.</p>

  <p>Equally important, the P2 Act strengthened EPA’s role as an ally of American businesses, helping
  them save billions of dollars and improve operations. As EPA Administrator Andrew Wheeler has said,
  “It’s far better to prevent pollution from occurring than to go in after the fact and clean it up.”</p>

  <p>Quotation from an Authority. This quotation from the EPA administrator supports Dunn’s assertion
  that the P2 Act is good for America. The quotation helps lend credibility to the author’s claim that
  the P2 Act has been a success over the past 30 years.</p>

  <p>Purpose. Dunn’s purpose is to show how the P2 Act has been successful over time. Thus far, she has
  supported the claims that it has improved the environment and helped local governments and private businesses.</p>

  <p>The P2 Act greatly expanded the opportunities for “source reduction” to reduce or prevent pollution
  at the source through cost-effective changes in production, operation, and raw materials use. These
  changes can reduce the amount of pollution entering a waste stream or the environment prior to recycling,
  treatment or disposal, and can offer industry substantial savings in reduced raw material, pollution
  control, pollution cleanup and liability costs.</p>

  <p>Short Paragraphs. Dunn uses short, easily digestible paragraphs in her blog post. Short paragraphs
  are visually effective on a screen and ensure that the reader is not overwhelmed by text while helping
  the writer organize ideas.</p>

  <p>Ethos. Dunn uses neutral, measured language to convince the reader that she is a reliable and ethical
  expert.</p>

  <p>One of EPA’s first pollution prevention successes was with its 33/50 Program, a voluntary program
  under which companies committed to reduce their releases of 17 top priority chemicals 33 percent by
  1992 and by 50 percent by 1995. Subsequent EPA programs built on the 33/50 and P2 model and are still
  working to reduce pollution across the country today including EPA’s WaterSense (https://openstax.org/r/watersense),
  Safer Choice (https://openstax.org/r/safer_choice), Environmentally Preferable Purchasing (https://openstax.org/r/
  environmentally), Green Chemistry (https://openstax.org/r/green), and our SmartWay Transport Partnership
  Program (https://openstax.org/r/smartway). President Trump acknowledged the effectiveness of these and
  other EPA programs in a 2018 Executive Order that directed federal agencies to use EPA’s P2 resources
  to meet their statutory sustainable purchasing requirements.</p>

  <p>Hyperlinks. Hyperlinks are a functional tool and employ the visual mode to command the reader’s attention.
  Dunn uses hyperlinks to the EPA programs she names, establishing the agency as a source of pollution
  prevention efforts and, as a result, an expert on the issues covered in the blog post. In addition,
  she links to the presidential executive order, which establishes credibility.</p>

  <p>The P2 Act also serves as an authority for collecting information from reporting facilities through
  the Toxics Release Inventory (https://openstax.org/r/toxics) (TRI) about their management of certain
  toxic chemicals, including source reduction approaches. Since this reporting began in 1991, we have
  learned that over 24,000 unique facilities have taken more than 450,000 actions to prevent pollution
  and reduce the amount of toxic chemicals entering the environment, such as spill and leak prevention
  measures, using safer chemicals, modifying industrial processes, and updating operating procedures.</p>

  <p>Transition between Paragraphs. By using the word also, Dunn signals that she is shifting to another
  success the EPA has achieved in preventing pollution.</p>

  <p>Statistics as Supporting Evidence. To support the impact of the P2 Act, Dunn uses statistics as evidence
  to show that the act has facilitated the prevention of pollution and toxic chemicals.</p>

  <p>Perhaps the most impactful and collaborative program to grow out of the P2 Act is EPA’s P2 Grants
  Program. Since 1990, EPA has awarded more than 1,200 grants to state, tribal, non-profit, and university
  partners to work directly with U.S. businesses to develop and implement source reduction techniques.
  With the assistance from P2 grants, businesses have been able to save over $1.5 billion since 2011 while
  also reducing the use of hazardous materials by over 570 million pounds.</p>

  <p>Supporting Evidence. Dunn provides evidence of the success of the P2 Act by showing how one program
  has helped local governments and private businesses save money.</p>

  <p>As we celebrate the 30th anniversary of the Pollution Prevention Act today, I would like to thank
  all our state and local pollution prevention partners, as well as all the businesses that have joined
  with us to score a true win-win for the American people.</p>

  <p>Audience. Although this blog is written on a public government website, Dunn shifts focus at the
  end to directly address businesses and local governments that have partnered with her or her organization.</p>

  <p>You can access this post on the EPA blog (https://openstax.org/r/win-win).</p>

  <h3>Discussion Questions</h3>

  <p>1. Why does Dunn choose to use neutral language rather than emotional appeals in this blog post?</p>

  <p>2. Why does Dunn focus on the impact of the P2 Act on businesses, particularly on how the act is
  financially beneficial to those organizations?</p>

  <p>3. How might this blog post differ if the intended audience were different?</p>

  <p>4. What is the effect of Dunn’s shift to addressing specific partners at the end of the post?</p>

  <p>5. In your opinion, does Dunn effectively establish herself as a trusted source? Why or why not?</p>

  <p>18.5 Writing Process: Create a Multimodal Advocacy Project</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Craft textual and digital compositions using various
  genres of modes and technologies. • Match different modes of communication to various rhetorical situations.
  • Identify various genres of multimodal and online writing.</p>

  <p>Now you will experiment with using multiple modes to create an advocacy project. An advocacy project
  tells the story of an overarching problem—for example, world hunger—and uses multiple modalities to
  inform readers about that issue and to propose change. You may be familiar with similar advocacy projects;
  perhaps you have been involved with them in your everyday life. Think carefully about advocacy initiatives
  you know of or have encountered, and find out whether you can pinpoint the answers to these three questions:
  What problem is being addressed? Who is the intended audience? What mode or modes are being used, including
  what media? Then think about what works. How do the chosen media speak to the specific audience? Why
  might the initiative’s creators have made those choices? After you have chosen a cause and begun working
  through the composition, you might want to tweak the modes you are working with, including how they
  relate to one another. You may find, for example, that your primary communication to readers would be
  better achieved with a different mode or that you need stronger transitions to move your reader through
  your rhetorical appeal. Don’t be afraid to experiment, revise, and examine your project from different
  angles. Just like a literary text, a multimodal composition is a living document, one that can be improved
  over time with peer review and revision. As you work, focus your project by concentrating on addressing
  your audience, purpose, and organization.</p>

  <h3>Summary of Assignment</h3>

  <p>Create a multimodal advocacy project for a cause or an issue that you choose or that your instructor
  chooses for you. If you are free to choose your own topic, here is a short list from which you may draw
  inspiration:</p>

  <ul><li>Providing clean and safe water • Ending gun violence • Addressing nutritional needs of children
  locally or around the world • Anti-bullying • Reducing your carbon footprint • Access to health care
  • Anti-racism • Vaccination policies • Social media and free speech • Climate change • Immigration You
  may also use these brainstorming questions to narrow down your topic: • What are you passionate about?
  • Where do you notice a need in your community / the world? • What ideas do you have for addressing
  the issue? • What existing campaigns do you find compelling, and why? • What existing projects can you
  build on, and how? • What goals do you hope to achieve? Choose a need or an issue that is important
  to you, because you will develop a rhetorical appeal to inform and convince your audience. Although
  world hunger is an important issue and may not be a bad example, consider choosing problems that you
  encounter locally, even in your everyday life. The closer you are to the issue, the more easily you
  will be able to develop rhetorical appeals. As you compose your project, consider the best modes and
  methods to communicate your ideas. Consider how to add and combine different modalities to increase
  audience impact without overdoing it.</li><li>What is the purpose of the advocacy initiative? What do
  the organizers want to achieve? • Whom does the initiative address? (Knowing the target audience will
  help you analyze how effectively the organizers use a multimodal approach to reach them.) • How does
  the initiative persuade its audience? Are rhetorical appeals used, and if so, how? Why do you think
  these choices are made? • What modes of communication are being used? (These may include social media
  platforms and streams.)</li></ul>

  <p>Does the campaign rely more on textual or non-textual media to convey its message? How are modes
  combined, and how effective are these choices? After thinking about these questions, create an addition
  to this advocacy initiative. Introduce your composition by explaining what you have included and why.</p>

  <h3>Quick Launch: Defining a Primary Purpose and Goal</h3>

  <p>After you have decided on your topic, the first step is to identify the primary purpose, or reason,
  for your advocacy project. Your goal is what you want to accomplish with it. Do you intend to inform
  people about an issue they are likely to know little about, or do you want to inspire people around
  you to take action in creating a sustainable solution that addresses the issue at hand? Goals are broad
  statements and can be general and abstract, as in the case of this goal: Improve access to clean water
  for students in Flint, Michigan. Part of identifying your goal is to articulate your claim, or assertion,
  about the issue you have chosen. Your claim is equivalent to a thesis in a traditional written essay.
  Identifying your purpose and goal will help you decide how to structure your project and, ultimately,
  which media and modes to employ. Consider also your audience. You already have learned and discussed
  the importance of understanding your audience’s perspective, including social, cultural, or linguistic
  factors that could affect your communication. Understanding what your audience knows, their lived experiences,
  and what is important to them will help you shape your narrative. Complete these sentence starters to
  organize your ideas and begin the planning stages of your project. Define the situation. My project
  focuses on ________, which is a problem because ________. Define your purpose. The purpose of my project
  is to ________, which will be accomplished by ________. Write a thesis, hypothesis, or line of inquiry.</p>

  <p>The issue I’m addressing is ________.</p>

  <p>My position on the issue is ________.</p>

  <p>Write your thesis as a declarative sentence. See Writing Process: Creating a Position Argument for
  help writing a thesis. ___________________________________________________________.</p>

  <p>Define your goals and objectives.</p>

  <p>I will try to ________ by ________.</p>

  <p>Define your audience.</p>

  <p>The intended audience for my project is ________. They are ________ (familiar/unfamiliar) with the
  issue. I will reach them by ________.</p>

  <p>After you define the situation, it is time to choose the mode or modes to communicate your ideas
  to your audience. For example, will you write an op-ed, or opinion piece, in which you formally discuss
  the issue and advocate for change? Will you write and deliver a speech that relies on rhetorical devices
  to convey your passion for the issue? You might also consider advertisements and public service announcements
  (PSAs), including audio and video versions, as other effective ways to “sell” a concept, often combining
  modes for added impact. For examples, peruse The Op-Ed Project (https://openstax.org/r/op-edproject)
  or the Ad Council (https://openstax.org/r/adcouncil).</p>

  <p>Just as your choice of topic must be rhetorically sound and specific, your choice of mode should
  be based on the circumstances under which your audience will best meet and respond to your advocacy
  project. This decision may feel daunting, because composing within the multimodal genres means that
  you have many options. You might choose a video advertisement, a visual flyer, a performance, a photo
  essay, or something completely different. Consider the modes you might use to accomplish your goals,
  responding to the needs of your audience.</p>

