  <p>Teacher Resources for Read the Room! Navigating Social Contexts and Written Texts</p>

  <p>Overview and Teaching Strategies John Swales’s discourse community framework has been widely anthologized.
  It is, of course, something he has updated over time (Genre; “Concept”). It also builds on prior work
  in linguistic anthropology (Gumperz “Speech”; Language), and it is often understood as being adjacent
  or complementary to other frameworks relating to the social nature of communication (Geertz; Johns).
  We raise these points because they offer a good context for how one might teach this chapter in a way
  that makes the discourse community concept plausible for students who are new(ish) members of academic
  discourse communities. Learning to read the room is only truly helpful if one can also understand a
  broader lay of the land, so to speak.</p>

  <p>Figure 1. Disciplinary relationships as a series of nesting circles. Image is of five circles nested
  within one another. The biggest, outermost circle is labeled “Social</p>

  <p>Science,” the next one, “Anthropology,” then “Biological Anthropology,” then “Evolutionary Anthropology,”
  and finally, the smallest circle reads, “Paleoanthropology.” Image credit: Sarah Seeley.</p>

  <p>Scholars (in any discipline) develop ideas that retain varying amounts of power and authority over
  time. They do this within their discourse communities. Because this is an academic context, it means
  they do so within disciplines and sub-disciplines, which are “rooms” of differing sizes that students
  may need to learn how to “read.” For example, we could visualize disciplinary relationships as a series
  of nesting circles. The largest category in figure 1, social science, encompasses many distinct disciplines:
  anthropology, sociology, political science, etc. The diagram further maps out one tiny corner of the
  anthropological knowledge-making terrain. What’s more, we could have just as easily selected the biological
  sciences or the humanities and displayed a similarly small slice of disciplinary relationships within,
  for example, ecology or media studies.</p>

  <p>Our overarching point is this: the smallest subset of academic inquiry pictured within our diagram—paleoanthropology—is
  a discourse community. It may share features with the larger social science or anthropology discourse
  communities, but we can still expect that it will have its own unique features. Paleoanthropology is,
  in effect, its own room, and ought to be read as such. Yet, one can still learn to understand it by
  applying what they know from inhabiting other rooms: adjacent academic disciplines and subdisciplines,
  or different workplace or media communities. Similarly, the TikTok section of our chapter offers a pop
  cultural framework for illustrating how far Swales’ criteria can (and cannot) stretch as we attempt
  to read a room. We believe this social media discussion can productively set the stage for parallel
  in-class discussions about academic knowledge production and the boundaries of academic discourse communities.</p>

  <p>Tracing the history of an idea—when it appeared, where, and how it’s been used or expanded—is only
  possible when we can map out these kinds of disciplinary relationships. The powerful ideas tend to be
  cited, developed, and expanded on by other scholars within and across disciplinary discourse communities.
  The migration of Swales’ framework out of linguistics and into writing studies is a good example. In
  order to truly understand an idea, students must go outside of the content to examine the context of
  its production. These are very important skills. This is especially true for speakers and writers—like
  your students—who are in the process of becoming members of new academic discourse communities. As we
  illustrate in our chapter, this novice status is an inevitable social condition.</p>

  <p>This chapter may be assigned during a unit focused on discourse communities, but it also presents
  ideas and prompts discussion that may be productive for transitioning into a unit on conducting academic
  research and narrowing research questions. In support of these goals, we offer two class activities.
  The first is specifically focused on helping students develop their understanding of the discourse community
  concept. The second is more a method for integrating oneself into an academic discourse community— particularly
  those associated with the humanities and social sciences.</p>

  <h3>Activities</h3>

  <p>Discourse Communities and Power Struggles: Examining Cancel Culture</p>

  <p>This first activity was created for use during class time, so the podcast (audio and transcript options
  linked below) should be assigned in advance. At that point, class time could be loosely structured in
  “think, pair, share” terms.</p>

  <p>As we know, there are core members within social media “subcommunities,” but individual users also
  retain the freedom to shape genres and vocabulary in individualistic and grassroots ways. This freedom
  can be seen across social media outlets, for example: upvoting on Reddit or the general phenomenon of
  cancel culture.</p>

  <p>Today, we will examine cancel culture. The rise of this phenomenon draws attention to an important
  question on the social media discourse community landscape: How is power distributed? How are people
  scrambling to redistribute it? What are the implications of our own participation in these power structures?</p>

  <p>You listened to (or read) an episode of The Daily called “Cancel Culture, Part 1: Where It Came From”
  (Barbaro). In it, host Michael Barbaro explores what it means to be canceled and how the whole thing
  began. Take five minutes to recall the episode, review any notes you made, or skim the transcript. Once
  you’re up to speed, we will form groups and engage with the discussion questions outlined below. I’ll
  pop in to hear some of your ideas individually, but you should regard the small group discussion as
  a platform for contributing to a full class discussion when we come back together toward the end of
  class.</p>

  <h3>Discussion Questions</h3>

  <p>Please begin by reading all the questions that follow. Decide whether you’d like to focus your discussion
  on Cluster 1 or Cluster 2. Once you make that choice, you should be thinking in discourse community
  terms. In other words, how might the discourse community concept help us to wade through this messiness
  and create situational answers to these questions? For example, what can genre and vocabulary tell us
  about any of these definitions or applications of cancel culture? Are terms like “liberal” or “young
  person” narrow enough for analyzing cancel culture? Are all “young people” members of the same discourse
  communities? Recall Swales’ concept of silential relations. How does a sense that certain things can
  be left unsaid support (or thwart) the politicization or weaponization of cancel culture?</p>

  <h3>Cluster 1</h3>

  <p>Barbaro presents speech snippets where both Barack Obama and Donald Trump discuss cancel culture.
  How can cancel culture be labeled as “bad” in two ways that are so very different? Is “canceling” to
  be avoided because it’s impolite or some kind of cop-out as Obama seems to suggest? Is it to be criticized
  because the “liberals” are weaponizing it, as Trump suggests? Is it even possible to analyze this phenomenon
  apolitically?</p>

  <h3>Cluster 2</h3>

  <p>All types of people exhibit socially unacceptable behavior, whether they are relatively powerful
  or relatively powerless. Given this, how can we make a distinction between canceling a celebrity and
  canceling an “average” citizen? How should personal security and loss of income factor into this distinction?
  Should we even draw a line here? Where does it seem to be drawn currently? In whose minds? Should it
  be re-drawn?</p>

  <h3>The Synthesis Grid</h3>

  <p>The Synthesis Grid activity, as adapted from Rectenwald and Carl, may be enacted during class or
  used as a formal assignment. It can be productive to assign students to submit a synthesis grid as a
  supporting document that accompanies, for example, a discourse community analysis, a genre analysis,
  or a researched argument.</p>

  <p>What Is Synthesis?</p>

  <p>Synthesis is an important writing practice. It is an especially important rhetorical strategy for
  learning to write in academic contexts. When writers offer a synthesis, they are combining, blending,
  or weaving related ideas from different sources.</p>

  <p>What Is the Value of a Synthesis Grid?</p>

  <p>Producing a synthesis grid offers you an opportunity to take notes in a structured way so you deepen
  your understanding of a particular topic or question. In effect, a synthesis grid is a material artifact
  of your research process. It is a record of all the reading and thinking you’ve done as a part of your
  writing process. Since writing can’t proceed without reading and thinking, it can feel particularly
  satisfying to document all this “behind the scenes” work. Then, you want to apply that “behind the scenes”
  work in your writing. For example, offering a synthesis within an academic argument is a very common
  (and effective!) method for establishing credibility.</p>

  <p>How Do You Create a Synthesis Grid?</p>

  <p>1. You want to begin by settling on a particular topic or concept that will be the subject of your
  grid. For example, perhaps you want to write about cancel culture. This is a complex and controversial
  phenomenon with its own history, so starting a synthesis grid may help you to solidify your own ideas
  on the subject.</p>

  <p>2. Once you have your topic, you need to locate three or four pieces of writing that deal with the
  topic. Keeping with the cancel cultruel example, I might decide to start with a podcast transcript—Barbaro—and
  an article—Luu—then build my grid from there.</p>

  <p>3. Once you have the topic and some reading material, you want to create the “shell” of the grid.
  This involves making a series of rows that correspond to the number of readings you want to include.
  This also involves making a series of columns that correspond to the sub-topics you are interest in
  learning more about. See table 1 for an example.</p>

  <p>Table 1. Sample “Shell” for a Synthesis Grid Focused on Cancel Culture</p>

  <p>Writers</p>

  <p>Michael Barbaro Chi Luu Writer TBA</p>

  <p>Sub-topics  Redistributing Power</p>

  <p>Politicization</p>

  <p>Topic TBA</p>

  <p>4. Once you’ve created the shell, you want to continuously add your notes as you move through readings
  related to your topic. Keep in mind that you won’t know all the sub-topics when you begin this activity.
  You will fill them in as you learn more. For example, perhaps you were interested in the redistribution
  of power ot start with, theyn you noticed that writers were often discussing the politicization of cancel
  culture. That’s a good indicator that you might want to add a column for politicization. Perhaps you
  then realize many writers are discussing the history of the phenomenom or how the pandemic has shaped
  the phenomenon. Perhaps you notice many writers discussing a specific social implication—for example,
  the negativity or destructiveness that is often attributed to cancel culture. If so, you should similarly
  follow such cues to add additional columns to your grid.</p>

  <p>How Do You Use a Synthesis Grid?</p>

  <p>Recall, the value of the grid is two-fold. It allows you to document the “backstage” work of reading
  and thinking, and it assists you in pulling the ideas you developed into the “foreground.” What follows
  is a sample synthesis that could be derived from this grid (even in though it’s still a work in progress).
  We can see how the ideas presented by Barbaro and Luu might be woven together to set up a line of inquiry
  in Table 2.</p>

  <h3>A Sample Synthesis</h3>

  <p>While cancel culture may appear to be a relatively new phenomenon, people have long been mobilizing
  against perceived injustice both on and offline. Both Michael Barbaro and Chi Luu have recently discussed
  this phenomenon and how it relates to internet language and culture at large. Barbaro and Luu each present
  the perceived positives and negatives surrounding cancel culture. Barbaro’s podcast episode was released
  more than six months after Luu’s article was published, and it draws on the words and experiences of
  politicians, celebrities, and everyday racists as a method for exploring the complexities of this phenomenon.
  One major question within all of this is how to differentiate between the “cancelation” of a relatively
  powerful person versus that of a relatively powerless person.</p>

  <h3>Connecting the Synthesis Grid to the Discourse Community Concept</h3>

  <p>As we suggest in our chapter, learning to mobilize the discourse community concept is an important
  method for “reading the room.” Learning how, for example, vocabulary or genre is shaped by social expectations
  sets student-writers up to understand writing as an audience-driven act. And, learning to map the epistemological
  landscape of a social debate similarly sets student-writers up to understand academic writing in terms
  of situated social exigencies.</p>

