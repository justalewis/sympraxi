  <p>Overview and Teaching Strategies</p>

  <p>Authors have used imitation for centuries as a tool to improve their writing. This chapter focuses
  on using imitation to encourage students to look more closely at readings and learn to better explain
  how specific words, sentence structures, and sentence placement affects reading, which transfers over
  to how students write. As students practice imitation, they are gaining vital experience in flexing
  their sentence-making muscles and trying out various placements of prose that will improve their own
  writing. Through doing these, they come to realize that writing is more dynamic and allows for their
  own voice and style to come out.</p>

  <p>While this chapter could be used at any time during a first-year composition (FYC) course, the earlier
  it is used, I think, the more practical use students will take away from it. To better engage students,
  ask them to bring in a favorite book or an academic article they thought was well written. These writings
  can easily be incorporated into the discussion of this chapter. Students can use them to practice imitation,
  which can then easily lead into a meaningful discussion about the differences between plagiarism and
  imitation. Near the end of the lesson, encourage students to discuss what they learned and how imitating
  an author’s style will aid them in their own writing, while not sacrificing their own voice and style.
  The chapter also provides imitation exercises for students to do either as a class, in small groups,
  or on their own.</p>

  <h3>Discussion Questions</h3>

  <p>1. In what ways can imitation help improve your writing? 2. How is imitation different than plagiarism?
  3. Name a few authors you’ve read. Describe their style as best you can. Then, go look and see how accurate
  you were. Then, look carefully at their style. Write down some examples of how you may be able to imitate
  the writing through structural and contextual ways of imitation. 4. Compare one assignment with other
  class members, pick out similar sentence structures or ways of explaining information. Discuss the patterns
  and why they are similar. What do you think led to this similarity? How are the sentence patterns operating
  to drive the paragraph? The essay? 5. As a group, create a sentence (like Erasmus’s) and generate as
  many possible variations. How are the variations similar? Different? What are the advantages in being
  able to present a sentence or group of sentences in many different ways? 6. As a group or a class, what
  other techniques could you learn from or imitate from the baseball selection?</p>'
