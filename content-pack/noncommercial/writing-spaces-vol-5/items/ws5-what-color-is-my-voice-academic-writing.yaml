  <h3>Overview and Teaching Strategies</h3>

  <p>One thing I (Kristin) have learned through experience with doing antiracist work in writing classes—such
  as engaging students in discussions about white language supremacy—is the importance of working through
  the material and hard questions that come up before I ever introduce the concepts to students. I’ve
  also learned the importance of developing my own racial literacy beyond a basic understanding of white
  privilege and structural racism as a precursor to doing this work, because antiracism is personal and
  powerful, white fragility (DiAngelo) is real, and whiteliness (Frye) doesn’t depend on a person’s racial
  identity (though of course white people are more likely to be whitely). And I’ve learned both firsthand
  and through collaborating with colleagues how difficult this internal work is and how easy to is to
  unconsciously slip into Habits of White Language (HOWL; Inoue, Above the Well) even while we’re consciously
  trying to confront them.</p>

  <p>For these reasons, our teaching strategies begin with the recommendation that teachers do some difficult
  introspective work first. Write out your responses to the questions for writing and discussion below.
  Think about your own voice in academic writing, what you like about your voice and what you dislike
  about it, what your thoughts are on language diversity in academic writing, what unresolved questions
  linger for you and how you’re working through those questions, who some of your favorite academic writers
  and/or texts are, and so on. Reflect on the identities you bring to the classroom, how those identities
  impact your stance on language diversity and antiracism, and in what ways you will need to pay careful
  attention to those identities (i.e., worldviews and habits) as you engage students in these conversations.
  Also think about how your grading policy and assessment practices function in your class alongside these
  discussions about voice. We strongly urge you to read Asao Inoue’s Antiracist Writing Assessment Ecologies,
  ensuring that your policies and other elements of the assessment ecology that is your writing class
  will support the critical work this chapter invites students to do. Once you’ve laid that groundwork
  you can think about how this chapter will fit into your overall plans for the course.</p>

  <p>We envision this chapter as being most useful early in a course, because it introduces students to
  concepts that we hope will impact their writing throughout that course. The longer students have to
  engage with these ideas and think critically about their own voice and the value of language diversity
  in academic writing, and the more practice students get writing with these ideas in mind, the better
  equipped they will be to continue and defend this revolutionary work in future classes. In turn, the
  antiracist work you begin here will be more likely to extend beyond your class.</p>

  <p>Because race and voice are deeply connected, and because the nature of race as a social and political
  construct (and not a biological one) is often unfamiliar and/or controversial, you will likely need
  to teach students about racial literacy. You will also need to make explicit connections between racial
  literacy and writing classes, especially when those classes are gen-ed requirements meant to teach writing
  for academic purposes. We intend for this chapter to help make that connection, drawing students’ attention
  to normalized values and perspectives that inform the standards we’re taught are objective and innocuous.
  We recommend that you and students read this chapter alongside a few other open-access texts that we
  describe below. These texts will help contextualize and deepen readers’ understanding of the inescapably
  political nature of writing. They will also stimulate critical thought about how students might use
  their writing for social change.</p>

  <p>Three chapters in Writing Spaces, Vol. 4 complement this chapter. Mary Lee Grayson’s “Writing toward
  Racial Literacy” explains the relevance of race and racism to writing classes and guides readers in
  thinking through how race and racism impact their lives no matter their racial identity. We recommend
  that students read Grayson’s chapter before ours to develop a foundational understanding of the systemic
  issues underlying voice as we discuss it here. Students might also find Cristina Sánchez-Martín’s chapter,
  “Beyond Language Difference in Writing: Investigating Complex and Equitable Language Practices,” helpful
  for thinking about how multilingual writers commonly engage in “‘translingual’ practices by which writers
  move across traditional understandings of separate languages” (270). Sánchez-Martín shares multiple
  examples of translingualism in both popular and academic texts, arguing that translingual approaches
  to writing can address issues of diversity, equity, and inclusion. Translingualism and its contributions
  to academic writing are also core concepts in “Workin’ Languages: Who We Are Matters in Our Writing,”
  by Sara P. Alvarez, Amy J. Wan, and Eunjeong Lee. In this chapter, Alvarez, Wan, and Lee offer strategies
  for and approaches to integrating diverse language practices in academic writing that they have gleaned
  through personal experience.</p>

  <p>This chapter might be especially useful as a follow-up to our discussion of voice because it provides
  a theoretical lens that students can adopt as they write: that of the “language architect.” Significantly,
  these authors account for the constraints a writer’s subjectivity places on her rhetorical situation,
  clarifying that “many of us whose languages are racialized in various ways may have to work their academic
  writing contexts more so, or differently” (6). This point alone yields opportunities for discussing
  how voice and subjectivity function in tandem, which we discuss in our chapter, and how that reality
  impacts the choices available to individual writers.</p>

  <p>In addition to these Writing Spaces chapters, we recommend that teachers (and possibly students)
  familiarize themselves with the concept of whiteliness, which Marilyn Frye distinguishes from whiteness
  and defines as “a deeply ingrained way of being in the world” (qtd. in Kim and Olson 87) and Dae-Joong
  Kim and Bobbi Olson add is an “epistemological worldview, a lens of judgment” (124). This distinction
  might help to mitigate eruptions of students’ (and teachers’) white fragility by conveying that just
  as race isn’t a biological reality, so too the whitely worldview that sustains white language supremacy
  (Inoue, Antiracist Writing) isn’t intrinsic or limited to white people. In other words, some Black,
  Indigenous, and People of Color adopt whitely perspectives about language, and some white people actively
  challenge those perspectives. This clarification can help to abate tension that might otherwise stall
  important and productive conversations about linguistic racism.</p>

  <p>Following are some questions to stimulate critical thought and activity suggestions to help students
  identify standard language ideology in their everyday worlds and reflect on its impact on their own
  and others’ lives.</p>

  <h3>Questions for Writing and Discussion</h3>

  <p>The following questions would work well for writing in class or out of class and then discussing.
  They could also be seeds for projects investigating language difference and ideology, perhaps resulting
  in presentations or a gallery of multimodal or written texts about students’ findings.</p>

  <p>1. Often, we don’t notice something’s existence until we feel its absence, so you might not realize
  how important language is to your identity or your communities. It might help to think of a time when
  you felt you couldn’t write or speak in ways that felt natural to you, authentic. Or a time when you
  felt like you had to translate a concept from one of your communities (for example, a religious community,
  a scientific community, or a cultural/heritage community) to someone outside that community. It could
  be a minor moment or a more involved conversation about a concept. What was that experience like? How
  did you feel during it? What made you realize that you were a part of that community to begin with?</p>

  <p>2. Make a list or draw a mind map of four or five communities you’re part of, like a church community,
  a neighborhood, an online interest group, etc. Then, for each community listed, answer the following
  questions: What does it mean to be part of this community? In other words, what values do you share?
  What interests do you share? What specific beliefs about people, things, reality, etc. do you share?
  What are some common terms or phrases that you use—terms or phrases that someone outside your community
  might not understand but that anyone in your community would most likely understand? What do those terms
  or phrases mean to you, and why are they significant to your community? How do they reflect what is
  important to you?</p>

  <p>3. In a speech addressing college writing teachers, Asao Inoue asked, “Which bodies historically
  have had the privilege to speak and write the most in civic life and in the academy? Whose words have
  been validated as history, truth, knowledge, story, the most throughout history? Who sits in the teacher’s
  chair [...]?” (“How Do We Language” 136). Based on your experiences in K-12 and even college so far,
  how would you answer Inoue’s questions? How might sharing identity characteristics (like race, gender,
  socioeconomic class, etc.) with these teachers, writers, speakers, politicians, and so on affect students
  who share them both in school and outside school? Think broadly about potential effects on students’
  thoughts and/or emotions as well as situations they might (or might not) encounter. Make your ideas
  here as specific as you can. Then consider the alternative. What is at stake for the people who do not
  share these identity characteristics? How might their experiences in school be impacted? How might their
  thoughts and emotions be impacted, and how might those impacts affect their experiences?</p>

  <p>4. “The idea that there is one correct way of writing devalues the writing, thoughts, intelligence,
  and identities of people from lower-class backgrounds,” argues Anjali Pattanayak (85). What are some
  examples of interactions you’ve either experienced or observed where a strongly held belief in standard
  English led someone’s intelligence or identity to be stigmatized? Have you had these thoughts yourself?
  What do you make of them given what you’ve read in this chapter?</p>

  <p>5. Spend a few minutes reflecting, in writing, on these questions: Whose voice do I hear in my writing,
  and why? What does this voice reveal about my identity as a writer, and how do I feel about what I uncover?
  What might I want to do more of, or differently? What might happen if I make these changes, and how
  do I feel about those potential outcomes? What kinds of support do I need for finding my voice in academic
  writing, and where can I find that support at this school?</p>

  <p>6. In their introduction to Code-Meshing as World English, Vershawn Ashanti Young, Aja Y. Martinez,
  and Julie Naviaux pose an incisive question: “What if, during formal language instruction, native English
  speakers and English language learners were exposed to a variety of Englishes, both from regions of
  their countries and from around the globe? [...] What if all English users were not only encouraged
  to understand varieties of English but also allowed to fluidly use them in both formal and informal
  contexts?” (xx). What do you think of this proposal to resist standard language ideology in classes
  where writing is taught? How might this change affect teachers? How might it affect students? Do you
  think it might affect life outside of school? If so, what possibilities do you imagine?</p>

  <h3>Sample Activities</h3>

  <p>Following are a couple of activities or activity ideas that I (Kristin) have used to raise students’
  awareness of standard language ideology and its implications for diversity, equity, and inclusion and
  of the central role of language to being human.</p>

  <h3>Standard Language Ideology in Memes and TikToks</h3>

  <p>Have students find memes or short videos (like TikToks) about language that demonstrate standard
  language ideology. One I often bring to class is a meme with a white man in a three-piece suit holding
  a top hat and saying, “When you say ‘I seen,’ I assume you won’t finish that sentence with ‘the inside
  of a book.’ I see. I saw. I have seen.” We discuss whose languaging the meme critiques (speakers of
  Black English) and what it communicates about the people associated with that languaging (Black Americans).
  We also discuss the significance of the image and what it communicates, and we discuss the sociocultural
  significance of memes in general, connecting back to the roles that educational institutions play in
  reproducing and/or resisting harmful stereotypes.</p>

  <p>After students find their own memes or short videos, ask students to write about each one, describing
  it and answering the following questions: 1) What does this meme/video communicate or imply about “correctness”
  in language use?, 2) How does this meme/video affect, reinforce, or challenge your own perceptions of
  people?, 3) What assumptions is the creator of this text making about communication, and how do those
  assumptions connect to your own?, 4) How might these assumptions and perceptions reinforce inequality?
  You can also have students analyze the rhetorical situation of the text and where they found it and
  reflect on the significance of various parts of this rhetorical situation (like when and where it’s
  published and how it circulates).</p>

  <p>Languaging as “The Measure of Our Lives”</p>

  <p>Assign students to watch, listen to, and/or read Toni Morrison’s Nobel Lecture for the Nobel Prize
  in Literature in 1993, available as an audio file and transcript at NobelPrize.org. In this lecture,
  Toni Morrison speaks of language as a living being—a bird—held in the hands of some young people who
  visit a wise, old, blind Black woman to mock her for her blindness. The old woman considers this bird
  they bring—language—to be “partly [. . .] a system, partly [. . .] a living thing over which one has
  control, but mostly [. . .] agency—as an act with consequences.” In the story Morrison tells, the woman
  draws the young people’s attention away from the hands holding the bird, those with power over it, and
  to the bird itself—language—“the instrument through which that power is exercised.” Near the end of
  the lecture, Morrison says, “We die. That may be the meaning of life. But we do language. That may be
  the measure of our lives.” That agency, the verb-y-ness of language, and the extent to which we use
  it is our legacy.</p>

  <p>Morrison’s lecture is especially relevant to this chapter because in it, she identifies several threats
  to language-as-agency, or voice as we have used it in this chapter. For example, she directly critiques
  “the proud but calcified language of the academy” and “the commodity driven language of science” as
  “oppressive language,” which she says “does more than represent violence; it is violence; does more
  than represent the limits of knowledge; it limits knowledge.” And she explicitly connects “the policing
  languages of mastery” to discrimination, to “sexist language, racist language, theistic language.” Just
  as the story Morrison tells ends by calling attention to the young people’s agency—“[W]hat I do know
  is that [the bird] is in your hands. It is in your hands,” says the old blind woman—so Morrison concludes
  the lecture by imagining the woman’s response as a reflection on the agentive power of languaging together.
  Having read Morrison’s text and this chapter side-by-side, students could then develop a written or
  multimodal project where they create their own metaphor for their own voice and explain that metaphor
  along with its significance to them, especially in light of this chapter. I (Kristin) am purposefully
  leaving assignment possibilities vague here to encourage creative teacher responses that 1) make use
  of the wide-ranging analog and digital technologies available to students and 2) honor individual teachers’
  knowledge of/comfort with assigning and responding to multimodal projects.</p>

  <h3>Language Structure and Style in Students’ Own Communities</h3>

  <p>If you’re using this chapter with advanced undergraduates and beyond, you might want to invite students
  to think even more deeply and critically about the relationships between language and identity (specifically,
  worldview). You could, for example, ask students to find texts in their communities and analyze the
  language in those texts, looking carefully at sentence structure, style, and so on. Two texts that work
  well to set up such more advanced assignments are Lera Boroditsky’s 2018 TED Talk, “How Language Shapes
  the Way We Think,” and June Jordan’s “Nobody Mean More to Me than You and the Future Life of Willie
  Jordan.”</p>

  <p>Language isn’t just something we create, Boroditsky, a cognitive scientist, argues; it creates us,
  how we think and view the world: “research shows us that the languages we speak not only reflect or
  express our thoughts, but also shape the very thoughts we wish to express. The structures that exist
  in our languages profoundly shape how we construct reality” (“Lost” 145). For example, languages shape
  how we think about space and time as well as cause-and-effect relationships. They also reflect and shape
  our value system. Black English, for example, reveals a person-first value system, “a distinctive Black
  value system” embodied through “the presence of life, voice, and clarity” in words and sentence structures,
  explained the late writer and professor June Jordan (367). “You cannot ‘translate’ instances of Standard
  English preoccupied with abstraction or with nothing/nobody evidently alive, into Black English,” she
  continued. “That would warp the language into uses antithetical to the guiding perspective of its community
  of users. Rather you must first change those Standard English sentences, themselves, into ideas consistent
  with the person-centered assumptions of Black English” (368).</p>'
