  <p>Drafting: Varying Purposes for Integration of Media or Other Genres</p>

  <p>Once you have determined your purpose and audience and have considered the impact of including multiple
  modes and media, it is time to begin drafting your project.</p>

  <h3>Gathering Information</h3>

  <p>The first step in any project is to collect and analyze sources. You will likely need to explore
  relevant research, data, and literature that already address your topic. The following questions are
  a good place to start: What do you already know about the issue you have chosen to address? What do
  you need to learn, and where can you find that information?</p>

  <p>When considering the data and research you read and collect, it is important to address multiple
  perspectives, particularly regarding culture, language, and social issues. It is essential to have a
  clear understanding of the needs of the community you seek to advocate for, as defined by that community.</p>

  <p>Now plan for the ways in which your project will create and support the argument, the modes and media
  you will use, and how these will reach your audience. Start by completing a graphic organizer like Table
  18.2. Begin with what you already know, including the sources of that information, formal research you
  have done, and informal or anecdotal data you have. After looking carefully at what you have, ask yourself
  what you still need to learn about the topic to understand and communicate the issue to your audience.
  Finally, brainstorm for strategies to learn that information. These may include research, interviews,
  or other methods of data collection. Then carry out that information collection until you have what
  you need.</p>

  <p>What I already know</p>

  <p>Source(s) of that information</p>

  <p>Information and data that I need to collect</p>

  <p>Where I can find information</p>

  <h3>Determine Modes and Media</h3>

  <p>Once your research is complete (or, at least, once you have a good enough foundation to get started),
  determine which modes and media you will employ to address your audience. Research, like composition
  as a whole, is largely an open-ended process, one in which you may need to experiment to determine whether
  the modes, media, and genres you choose accurately and effectively communicate your purpose to the audience.
  A good way to make this decision is to create a mockup or storyboard. A mockup is a visual representation
  of compositions that are basically static. You can use a mockup for media such as websites, posters,
  or photo essays. A storyboard is a sequence of drawings that represents the progression of a piece that
  moves through time. You can use a storyboard for media such as videos or podcasts.</p>

  <p>Use graphic organizers like Figure 18.15 and Figure 18.16 for your mockup or storyboard. Remember
  to consider all modes, including linguistic, visual, audio, spatial, and gestural, and what impact they
  will make on your audience.</p>

  <ul><li>What do I want to convey? The desperate situation in Syria because of the war • Who is my audience?
  Online readers interested in current events</li><li>How do the media I’ve chosen speak to the audience?
  They tell a story more powerfully than text can by itself.</li></ul>

  <p>As you brainstorm, don’t feel obligated to include every piece of information or media you collect.
  You’ll want to choose carefully, ensuring that the information and media you use serve your audience
  and rhetorical goals. Introduce Other Genres After establishing the primary genre, it’s time to define
  the purpose for introducing other genres, including how you will introduce them smoothly with seamless
  transitions. In the example above, the student chooses a photo essay as the primary genre. A photo essay
  usually includes multiple pictures, laid out on a blog or website with or without text. If there is
  an opportunity to directly address the audience, the student might consider writing a script to incorporate
  the genre of presentation. Or they might choose to create a slideshow or video, incorporating a voice-over
  or textual quotations. All of these choices depend on their purpose as the composer, the rhetorical
  methods they believe will work best, and a knowledge of their audience, including how best to respond
  to social and cultural needs. It’s important not to incorporate more modes simply for the sake of having
  more. Each choice you make will either enhance or detract from your purpose. Compose Countless tools
  are available for creating multimodal texts. At first, this project may seem daunting as you ponder
  which tool to choose and possibly learn to use new technology. However, you will likely find you can
  use tools that are not only familiar but also readily available. Software and apps that you already
  have on your phone, tablet, or laptop, such as PowerPoint, Google Slides, and Keynote, not only are
  useful for slideshows but also allow you to create graphics and videos that you can upload to YouTube
  with a single click. You can record podcasts by using the memo feature on your phone or a free online
  recording tool and then upload them to SoundCloud.</p>

  <p>mind that the composition process, like the writing process, is recursive, not linear. You can move
  from drafting to research to revising and organizing at any point.</p>

  <h3>Peer Review: Asking Specific Questions of the Writer</h3>

  <p>Peer review is an important step in helping you determine the ways in which your multimodal composition
  works well and how it can be improved. Peer review allows you to gain an outside perspective on your
  writing and composing processes and thus makes it easier to clear up any questions related to organization,
  purpose, audience, and genre.</p>

  <p>For your review, provide your peer reviewer with your mockup or storyboard and your prototype. Seeing
  your process may help your reviewer offer feedback and suggestions. Your peer reviewer can use the following
  questions to think critically about your project, focusing on both its strengths and its areas for improvement,
  and to guide their feedback. Your response to these questions will guide your revision process.</p>

  <h3>Questions about Topic</h3>

  <ul><li>How did you choose the focus of the composition? • How did you narrow down the scope of your
  topic? Should it be broadened or narrowed further?</li></ul>

  <h3>Questions about Purpose</h3>

  <ul><li>My reaction after reading or viewing the composition is ________ because ________. Does this
  reaction match your intent for the composition?</li><li>In my opinion, the thesis of this composition
  is ________. If this is your thesis, how can you strengthen your rhetorical arguments to better support
  it? If you intended to have a different thesis, how can you restate your claims to clarify the composition’s
  purpose?</li><li>The project uses sufficient evidence to support your claim that ________. How can you
  better support the claim that ________?</li></ul>

  <h3>Questions about Audience and Culture</h3>

  <ul><li>What audience are you trying to reach? What are the characteristics of this audience? • What
  do you want your audience’s reaction to this composition to be? • How have you accounted for the similarities
  and differences between you and your audience? • Are the elements of the composition accessible and
  meaningful to the audience?</li></ul>

  <h3>Questions about Genre and Media</h3>

  <ul><li>The genre of this text is ________, including conventions common to this genre such as ________.
  Optional: You might consider including other conventions such as ________ in order to strengthen the
  content by ________. How does this genre best capture the message you want to convey?</li><li>The media
  chosen within the project’s genre (do/do not) effectively communicate the author’s intent by ________.
  How could using other media such as ________ increase the impact of the communication?</li><li>A transition
  that works well in this composition is ________. How can you create a more effective transition here:
  ________?</li></ul>

  <h3>Revising: Responding to Questions</h3>

  <p>You will next revise your project, using your discretion to incorporate your peer reviewer’s feedback.
  After considering reviewer comments, actively engage with that feedback to plan your revisions. As with
  textual compositions, revisions to multimodal compositions often involve rewording, shifting ideas,
  and rewriting to better address your audience and purpose.</p>

  <ul><li>The reason I chose this genre is ________ (relate to purpose/audience/organization). I could
  better communicate by ________.</li><li>I used rhetorical appeal through ________. This is effective
  in this way: ________ but can be strengthened further by ________.</li><li>I considered the culture
  of (myself/viewers or readers/subject of composition) by ________. Other cultural components I would
  like to consider or address are ________. My plan to do that is ________.</li></ul>

  <p>Next, answer questions about genre and media. How might the tools available serve you more effectively?
  Is your choice of media the most effective to communicate with your audience? What aspects of the primary
  genre are key to helping you convey your issue? How can you introduce other genres, or aspects of other
  genres, to strengthen the impact? In responding, be mindful of creating smooth transitions and content
  that is uncluttered and clear in meaning. Consider using these sentence frames to answer your reviewer’s
  questions.</p>

  <ul><li>The genre ________ captures the message I am trying to convey by ________. I could strengthen
  this communication by ________.</li><li>Using new media such as ________ or ________ could increase
  the impact of the communication by ________.</li><li>My plan for ________ (media/mode) and ________
  (media/mode) to work together is ________. I will revise my composition to achieve that by ________.</li><li>I
  will strengthen my transitions by ________. The student composer of the prototype above might answer
  a reviewer’s questions in the following way:</li></ul>

  <p>I chose the photo essay genre to show the effects of war in Syria in an expressive, meaningful way.
  I designed a simple layout contrasting the colors black and white to organize the narrative. I primarily
  called on pathos to invoke the emotions and values of viewers, drawing them in with powerful images,
  but I think I could strengthen the emotional appeal by rearranging the pictures and more clearly addressing
  the most powerful statement: that 80 percent of the city was left uninhabitable. I also think my headline
  could be more attention grabbing, and I plan to revise it to draw viewers in and more accurately reflect
  the subject matter. I will revise my composition to achieve a more effective presentation by editing
  my text to make it more direct and by reordering my photos to leave viewers with a more forceful statement.
  Revising In creating multimodal compositions, revising can refer to taking multiple pieces of content
  and arranging, rearranging, deleting, and adding to the greater whole. Consider the project on the war
  in Syria. If choosing to create a video of the photo essay with a voice-over, the student might rearrange
  the order of photographs or choose which photos to show during particular audio clips, depending on
  the student’s reflection on the peer reviewer’s questions. Alternatively, the student might choose to
  keep the same format, thinking that it best expresses what they hope to communicate. However, the student
  might make revisions based on the peer reviewer’s feedback and their own reflection, in which the student
  mentions revising the text, reordering photos, and changing the headline. Consider this revision of
  the sample photo essay, in Figure 18.23.</p>

  <p>Public Domain; (bottom center) Voice of America Kurdish/Wikimedia Commons, Public Domain)</p>

  <p>The author makes revisions according to peer reviewer feedback and reflection of that feedback, particularly
  as it relates to purpose, organization, and audience. To get a better sense of the revision process,
  carefully examine the student’s thought process.</p>

  <p>I revised the headline from “The Syrian War” to “Remnants of War—Syria.” This headline is more engaging
  for readers and viewers and better reflects the purpose of my project: to convey the desperate situation
  in Syria resulting from the war that has ravaged citizens’ lives.</p>

  <p>I changed the aesthetic by using a black-and-white filter on the photos. Not only does this contrast
  with the white space and white text, creating a more organized and cleaner look, it more effectively
  appeals to readers’ emotions by emphasizing the destitution left by the Syrian War.</p>

  <p>I rewrote the captions of the final three pictures to make them closer to one another in word count,
  which is visually more pleasing. But even more important, they create a more powerful narrative, building
  upon one another.</p>

  <p>I reordered the final two pictures, ending on what I consider the most powerful image and most powerful
  statement: that 80 percent of the city was uninhabitable after the war. I intend to increase viewers’
  emotional responses with these changes.</p>

  <p>Remember that you do not have to accept every suggestion a peer reviewer makes, but do give each
  question and suggestion careful thought. Pay close attention to your reviewer’s questions and their
  perception of your purpose and audience in particular, ensuring that they match yours. And again, don’t
  be afraid to experiment. One benefit of multimodal composition, particularly when created with digital
  media, is that it is relatively quick and easy to manipulate. One valuable tip is to duplicate your
  work in different workspaces as you make changes, thus saving the major elements of your project should
  something go wrong.</p>

  <p>18.6 Evaluation: Transitions</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Implement conventions from a variety of modes
  and media to address a range of audiences. • Match the capacities of different genres to various rhetorical
  situations.</p>

  <p>Ask a peer to use the rubric below to read through your draft. Pay special attention to transitions
  in your composition. Remember that although transitions in various genres may differ, logical transitions
  are an important element in helping your audience “read” your text.</p>

  <p>Linguistic text uses transitions to create relationships between sentences, between paragraphs, and
  between sections of text. Consider this sentence-to-sentence transition from “Celebrating a Win-Win:
  30 Years of Progress under the Pollution Prevention Act” by Alexandra Dapolito Dunn.</p>

  <p>The act gave the agency new tools to join with states, tribes, and communities to prevent pollution
  before it happens. It also marked a shift in the paradigm of environmental protection, which had been
  mostly focused on end-of-pipe pollution control and clean-up strategies.</p>

  <p>The phrase it also helps readers connect the ideas from each sentence: that the Prevention Pollution
  Act provides new tools and that it focuses on preventing pollution instead of the former strategy of
  addressing pollution after it occurs. The next sentence from the article begins a new paragraph.</p>

  <p>Equally important, the P2 Act strengthened EPA’s role as an ally of American businesses, helping
  them save billions of dollars and improve operations.</p>

  <p>Here, the author uses the transition phrase equally important, signaling a new idea related to the
  Prevention Pollution Act (that it saved American businesses money) and providing context for how it
  ranks in importance</p>

  <p>(it is equally important). You can refer to Editing Focus: Paragraphs and Transitions for more information
  on textual transitions. In multimodal compositions, you will have to think about transitions differently.
  First, consider how images and blank space work together when modes are mixed. Often, a margin of space
  around images helps organize a composition. Colors and other visual features can also serve as transitions,
  as seen in the following graphic. An important part of multimodal compositions is readability, particularly
  related to density of text. How might you revise this graphic to increase readability?</p>

