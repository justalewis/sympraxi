  <p>Teacher Resources</p>

  <p>Overview and Teaching Strategies</p>

  <p>There are various models for implementing a usability testing project in the classroom. Ideally,
  this project should be taught in a dedicated usability course to allow students time to develop the
  skills involved in usability testing. If, however, you must implement the usability test as one of the
  major projects as part of another class (such as technical writing), we recommend that you identify
  one project or a reliable or responsive client for all student teams (instead of trying to manage several
  projects/clients).</p>

  <p>Just as with other types of primary research, students must learn how to effectively collect user
  data and analyze it, so it is crucial for you to support them by giving them timely and useful feedback
  (e.g., on their test plans) prior to the test. Also, be sure to allow ample time for all phases of the
  project, as many may underestimate the amount of time required for various tasks (such as recruiting
  and scheduling participants) and the iterative nature of other tasks (such as analyzing data). It is
  also important to select participants for the usability test who match the user profile, but it is often
  a step that is easily skipped or underestimated. Therefore, you should allow ample time for students
  to recruit users.</p>

  <h3>Discussion Questions</h3>

  <p>Following are discussion questions that will allow your students to explore the ideas discussed in
  this chapter:</p>

  <ul><li>What kind of primary research studies have you participated in in the past?</li><li>What type
  of experience do you have creating personas? • What do you think are the major challenges involved in
  conducting a usability study? • Whatmethodsareyoumostlikelygoingtousetorecruitparticipants? • What are
  some current issues on your campus or in your field that could be investigated with this usability testing
  method? • How could usability fit into your major field of study?</li></ul>

