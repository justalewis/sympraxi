  send a letter to Creative Commons, PO Box 1866, Mountain View, CA 94042, USA. To view the Writing Spaces
  Terms of Use, visit http://writingspaces.org/terms-of-use.</p>

  <p>and produce content as a team? How should the project be handled so that the final product is cohesive
  and reflects everyone’s input? How can one make sure one group member does not end up handling most
  of the workload? And, perhaps most importantly, how can one use collaboration to their advantage to
  make the end product better than a solo-executed project? These are all questions that this chapter
  addresses. Specifically, this chapter provides strategies not only for developing content as a group
  but also for making a collaborative writing project meaningful and, yes, even fun. Really, what is the
  point of collaboration if a project is easier to complete alone?</p>

  <p>What is there to gain?</p>

  <p>The first step toward a successful collaborative writing experience is understanding WHY it matters
  and WHAT we can gain from it. The idea behind this is simple: once we understand the relevance of a
  task, we are more likely to be motivated and engage with it in a productive way.</p>

  <p>The main reasons for learning how to write collaboratively are twofold: first, it is a way to make
  the writing more authentic and reflective of what it does and is outside of the classroom; second, it
  is a way to develop tangible skills for your résumé.</p>

  <p>Reason 1: Connecting Writing to its Realities Outside of the Classroom</p>

  <p>Most writing performed in the workplace involves more than one person. As noted by scholar Kristin
  Woolever, “collaboration is the way work gets done today” (141).</p>

  <p>Whether it is developing a report, a grant proposal, content for a website, or a series of instructions,
  professional writing generally involves input from different people at different stages of the process.
  Examples of such people can be:</p>

  <ul><li>A subject matter expert (SME) whose expertise lies with a specific technical product or process
  and provides you with information for a technical report on a particular product or for instructions
  for a specific piece of software.</li><li>A team member with whom you collaborate on the research and
  development of a grant proposal.</li><li>Your boss for whom you are drafting an official email, letter,
  or any other document that will be sent within the company or go out to clients.</li></ul>

  <p>The prevalence of collaborative writing in the workplace also explains why it is used frequently
  in the technical writing classroom.</p>

  <p>For example, speaking of the technical writing/communication classroom, scholar Liz Lane describes
  it as “wildly collaborative, in that we prepare our students to collaborate and test project management
  skills for eventual implementation in their professional lives beyond the classroom” (32). In their
  2021 book chapter on “The rhetoric, science, and technology of 21st century collaboration,” scholars
  Ann Hill Duin, Jason Tham, and Isabel Pedersen describe collaboration as an imperative for today’s technical
  communicators and emphasize its importance in the classroom as means to prepare students for the workplace.
  In other words, think of collaboration not only as one of the key topics of technical writing but also
  as an activity that emulates the kind of writing you will encounter in your future professional lives.</p>

  <h3>Understanding Collaboration Types</h3>

  <p>Depending on the situation and the project, the collaboration will occur at different moments of
  the writing process and have different functions. It may also be more or less involved, ranging from
  punctual collaborative moments to projects that are entirely collaborative from the beginning to the
  end.</p>

  <p>For example, going back to our first example of working with a subject matter expert (SME), let’s
  say you are tasked with developing instructions for a specific software. The SME may work with you during
  the planning phase of your document and again during the testing and revision phase. In this case, the
  SME acts as a source for the content as well as an editor, perhaps in an unofficial capacity but editor
  nonetheless since their knowledge is what will guide the development of your document.</p>

  <p>If you write a grant in a team environment (cf. previous example 2), you probably will be working
  as a team throughout the whole process. Depending on the team members’ area of expertise, one member
  may analyze the requirements for the grant (grant analysist), another may research the grant’s target
  audience and their values (researcher and fact checker), while another one may take the lead on developing
  the content of the proposal (the grant writer and editor).</p>

  <p>Though it may be less evident to think of it as such, the writing of a correspondence document sent
  by a company to its clients also involves a form of collaboration (cf. earlier example 3). Even in this
  case, you are not writing alone and for yourself but with and for someone else. Your collaborator’s
  role may then be limited to being a gatekeeper (that is, the person approving and signing off the document
  to be sent/published) but the fact remains that they are part of the writing process. The document that
  you produce speaks for and reflects someone else’s purpose besides your own.</p>

  <h3>Making it Matter</h3>

  <p>The three previous examples are good reminders of the inherently collaborative aspect of writing
  in the workplace. In this regard, collaborating on writing projects prepares you for what writing is
  and does outside of the classroom. It makes your coursework more tangible and authentic by connecting
  it to your future professional life. Keeping in mind this bigger picture can also help you set your
  own learning goals. For instance, remembering how a project helps you to gain practice with the kind
  of communication you will encounter in your future career will make it easier to focus on what you want
  to take away from a project. This may also give you an extra source of motivation, besides earning a
  good grade.</p>

  <h3>Reason 2: Developing Tangible Skills for Your Résumé</h3>

  <p>Beyond these immediate writing-specific learning outcomes, working on a collaborative project is
  also a great practice for developing the kinds of soft skills that employers value.</p>

  <h3>Developing Soft Skills</h3>

  <p>Collaboration can be a catalyst for the development of soft skills such as being a good listener,
  showing empathy, learning to see situations from different perspectives, being able to negotiate different
  points of view, and being able to problem solve and resolve conflicts. For instance, a solo writing
  project can make it difficult to think about how a specific audience may interpret your text or react
  to your ideas. But when you develop content with a team, you must confront your ideas with others early
  in the process, and thus gain experience with editing as well as listening and negotiating. If such
  skills are sought after by employers, it is not always easy to provide evidence on your résumé for how
  and why you possess them. Listing a group project as evidence and example can do just that.</p>

  <h3>Working with Outside Audiences</h3>

  <p>Collaboration may also give you opportunities to work with communities and clients outside of the
  classroom. For example, if your technical writing course entails a service-learning component (that
  is, a project with an off-campus community partner), your team may be paired with a client such as a
  small nonprofit and be tasked with developing content for their website. Research has shown that class
  projects involving partners outside of the classroom are stronger motivation factors for collaboration
  than projects that remain inside of the classroom (Rebecca Pope-Ruark et al.). This relationship is
  yet another way of thinking about the WHY of collaboration in the technical writing classroom: besides
  giving you easy ways to get feedback on your work and to strengthen your communication and listening
  skills, it can also open up exciting possibilities for client projects that can be listed as experiences
  on your résumé.</p>

  <p>So, when you are assigned this pesky group project, make it count and connect it to your long-term
  goals. This is not much different from any other class assignment, really. One of the challenges of
  class assignments is that they may feel artificial or disconnected from our immediate lives or future
  careers. How often did you write a paper, thinking “no one will ever care about this work except my
  instructor?” or “how does this connect to what I will do later?” Of course, this can affect your motivation.
  This is where thinking of an assignment beyond the immediacy of the classroom helps. It is a way to
  remember the WHY of the assignment and to emphasize WHAT you want to gain from it in the long run, even
  if in the end your instructor is your primary audience. Most importantly, it will make the work more
  meaningful and possibly ease worries you may have about it. For a collaborative project, always keep
  in mind how it will give you important skills for your résumé and future career. If you are not convinced,
  do a quick online search on “workplace collaboration” before starting your group assignment and see
  how many results you get and check what job recruiters say about it in your own field.</p>

  <p>What is an effective team?</p>

  <p>Once the relevance of collaborative writing is clear to you, the next step is to understand HOW to
  do it successfully. In other words, the question becomes: what makes a team effective?</p>

  <p>Project Completion and Technical Skills Matter but They are Not Enough</p>

  <p>It may be easy to equate team effectiveness with project completion. While submitting a project that
  is complete and on time is part of success, it is not all there is to it. Indeed, a project with one
  team member carrying out most of the work can hardly be considered a success or a model for future collaborations.
  Research has shown that communication and team cohesion are fundamental elements in a team’s success
  (Lam; Murphy et al.). Even more so, lack of group cohesion and dealing with non-contributing members
  are the elements students mention most often as reasons for disliking group projects (Hall &amp; Buzwell;
  Lam; Williams, et al.).</p>

  <p>Depending on the class and the specifics of the project, you may be able to select your team yourself
  or you may be put in a team by your instructor. If the goal is to have everyone contribute, it may be
  tempting to think then that the most important element for a successful collaboration is a team whose
  members have the right technical skills for the project. Though important, it is (sadly) not enough
  to guarantee a successful collaboration. If it were, it would make collaboration much easier to plan
  since it would pretty much just be a matter of adding up the right technical skills. From experience,
  most of us know that it is far more complicated.</p>

  <p>Imagine a project for which a team creates a series of instructions for a specific online application.
  A skill-based approach to the team’s composition could involve questions such as:</p>

  <ul><li>Who has experience with this specific app? • Who has previous instruction writing experience?
  • Who has information and document design experience? • Who is a strong writer and editor?</li></ul>

  <p>While these questions must be discussed by the team at some point, they cannot be the only consideration.
  They should not even be the first questions asked during the planning phase. Indeed, even if a team
  is composed of members with all the appropriate technical skills, the team will not be effective if
  the members do not manage to work together as a cohesive group. Even if the end-product is completed
  and delivered, a project environment riddled with conflicts and tensions cannot be described as successful.</p>

  <p>Ultimately, what makes a team effective cannot be measured by the addition of specific technical
  skills or even by the delivery of an end product.</p>

  <p>Rather, it should be assessed by the ability of its members to collaborate and complete the project
  as a team. Differently put, what makes a team effective is the capacity to manage a project, to develop
  common goals, to get along and trust each other.</p>

  <p>If equitable work distribution and effective contributions from all team members are key factors
  in a team’s success, they are also the most difficult challenges to overcome. This also explains why
  the issue of non-contributing members, often referred to as social loafing, has become an area of research.
  For instance, scholar Chris Lam conducted a study that identified “communication quality and task cohesion”
  as key factors for reducing social loafing (454). Lam’s conclusions and his focus on communication quality
  and team cohesion are on par with what Google discovered in its study on collaboration.</p>

  <h3>Google’s Project Aristotle</h3>

  <p>Because collaboration is a crucial aspect of today’s workplace, questions related to effective teamwork
  are of interest to many companies. The tech company Google, who is well known for its reliance and promotion
  of teamwork, launched a project in 2012 named Project Aristotle with the goal of determining what makes
  a team effective. The name Aristotle is a reference to the famous Greek philosopher and specifically
  to one of his famous quotes, “the whole is greater than the sum of its parts.” The quote can be read
  as an evocation of what makes collaboration complex and the fact that a team’s success is not simply
  determined by the individual skills of its members. Differently put, understanding collaboration requires
  understanding what makes the togetherness of a team successful. And this was precisely Google’s goal
  for launching Project Aristotle.</p>

  <p>Following two years of studying over 180 teams and intense data collection, the project identified
  5 key characteristics and drivers for team effectiveness. In order of importance, the characteristics
  are as follow (Duhigg; Re:Work):</p>

  <ul><li>Psychological safety: this refers to how safe a teammate feels to take risks without being considered
  ignorant or incompetent (Edmonson).</li><li>Dependability: team effectiveness is also driven by members
  being able to rely and count on quality work from their teammates.</li><li>Structure and clarity: an
  effective team establishes a clear structure for the collaboration and sets clear goals for the project.</li><li>Meaning:
  in an effective team, each member finds a sense of purpose.</li><li>Impact: team effectiveness is also
  driven by members identifying the “impact” that the work makes (Grant). Another way of thinking about
  this is to say: team effectiveness is driven by members’ ability to identify the “so what” of the work.</li></ul>

  <p>One of the main and, perhaps surprising, findings of this study is that a team’s effectiveness depends
  greatly on how safe team members feel. That is, for group work to be effective, team members must know
  that the team is a safe space and that they will not be mocked or rejected for speaking up and sharing
  their ideas. In many ways, Project Aristotle gives us additional and measurable data that confirms not
  only our experiences with group projects but also writing studies research results and the importance
  of communication quality (Lam; Wolfe).</p>

  <p>What are the strategies for effective collaboration?</p>

  <p>Teams often go through stages to find what works best for them (Tuckman). However, understanding
  the differences between an effective vs. ineffective team as discussed in the previous section can serve
  as a guide to develop steps for planning and deploying your collaborative process.</p>

  <p>Step 1: Establishing Common Ground and Verbalizing Individual Expectations</p>

  <p>Making time to get to know everyone and establishing common goals should be the first step of your
  collaboration. Whether or not this is required by your instructor, think of this step as an opportunity
  to establish common ground with your team members. This is also the time when team members should talk
  honestly and openly about their expectations and possible worries.</p>

  <p>Setting expectations and creating a culture where everyone feels comfortable sharing ideas and setting
  their own learning goals will make your collaboration not just more enjoyable but also more effective.</p>

  <p>Scholar Joanna Wolfe describes the importance of these preliminary conversations and provides a list
  of questions teams should address before starting their work together. The general spirit of these questions
  is to help team members to establish common ground by having honest conversations about everyone’s goals
  and attitude toward the project. Here are some examples of questions based on Wolfe’s approach that
  you may consider:</p>

  <ul><li>What do you want to learn and get from this project? • What level of effort are you willing
  to commit to this project? • How interested are you in this project? • What grade are you aiming for?
  • What are specific concerns you have right now? • What are your areas of expertise? What do you feel
  most comfortable doing?</li></ul>

  <p>Ideally, this conversation is held internally among team members, and not shared with your instructor.</p>

  <h3>Step 2: Assigning Roles and Choosing Your Collaboration Method</h3>

  <p>Depending on how your instructor sets up the team, this step may be completed prior to forming the
  teams. The goal is essentially to define how you will distribute the work. The method used, of course,
  should be appropriate to the project. In this regard, this step is also the opportunity to discuss and
  analyze together the main goals and requirements of the project. In other words, think of this step
  as the first close reading of the project’s guidelines as a group.</p>

  <p>What follows are some roles you may want to consider for a writing project:</p>

  <ul><li>The project manager (sets the schedule; centralizes the communication within the team and between
  the team and the supervisor/ instructor) and, depending on the project,</li><li>The researcher • The
  content developer/writer • The editor • The designer</li></ul>

  <p>While the roles concerning the technical skills can be more or less flexible (ex. the editor can
  also be a researcher during the first phase of the project), the project manager should remain the same
  throughout the project. Assigning roles will not only allow you to use the team members’ expertise to
  your advantage, but it will also make it easier to divide and distribute the work in a way that maximizes
  everyone’s skills.</p>

  <p>Dividing the work into different tasks with specific roles for each team member is the first step
  toward:</p>

  <ul><li>Understanding the different components of the projects. Example: a technical report involves
  research; content development; design; editing.</li><li>Making the project more manageable since team
  members can focus on their own areas of expertise and rely on their team members’ contributions and
  expertise.</li><li>Keeping the project cohesive, with input from all team members throughout the process.</li></ul>

  <p>Such an approach is sometimes called “a layered approach” because it involves team members taking
  turns in working on the final deliverable, adding their expertise at different stages of the process
  (Wolfe 6–8). “Norming” is another way to think about this approach, since each component of the project
  gets reviewed and worked on by all team members at different stages of the process (Richard Johnson-Sheenan
  61–62). This is also a good reminder that the writing is never just done by one person; everyone does
  it at some point during the project. Assigning roles based on the project’s goals and individual expertise
  keeps your work also more consistent with the realities of writing in the workplace.</p>

  <h3>Step 3: Identifying the Right Tools</h3>

  <p>Sometimes the biggest hurdle for a sound collaboration is to find the right tools. Fortunately, today’s
  technology offers many options to work together without having to share physical artifacts or having
  to be physically together all the time. Regardless of whether the project involves word-based writing,
  visual design, or web development content, here are a few key questions to consider before choosing
  a specific tool:</p>

  <ul><li>What are the collaborative features?</li></ul>

  <p>Many online word-processors or content management systems have sharing options that enable team members
  to work together online, whether it is by adding content, editing, or commenting.</p>

  <ul><li>How easy/difficult is it to archive everyone’s contributions?</li></ul>

  <p>A feature “showing the document’s history” is interesting not only to document everyone’s contributions
  but it is also a nice safeguard against accidental deletion or changes during the editing process. Think
  of this feature as a way to save your work as well as to document your input throughout the process.
  Having evidence of the work that you did, even if some of it may not end up as is in the final version
  of the project, not only helps to feel a sense of accomplishment but it may also work as a motivating
  factor and deterrent against freeloading.</p>

  <ul><li>Does the tool guarantee that all team members have access to all the drafts?</li></ul>

  <p>Saving drafts only locally is generally a bad idea. You want to make sure that your team sets up
  a shared folder where all the work related to the group project gets saved. Doing so will ensure that
  team members have equal access to all the drafts. Just like for the archive feature, this helps to give
  everyone a sense of ownership over the project by allowing members to intervene and comment as the project
  develops. Think of this element as the technical support for building and sustaining sound communication
  throughout the project.</p>

  <p>When you discuss tool options with your peers, remember that the tools will not only help you to
  accomplish the tasks required by the project, but they will also allow everyone to participate and stay
  connected. In other words, consider the tools as another element for establishing common ground, building
  trust, and keeping everyone involved.</p>

  <h3>Step 4: Establishing Communication and Meeting Protocols</h3>

  <p>While it may be tempting to say, “we will decide on meetings as we go and as the project develops,”
  it is paramount to establish a clear communication and meeting schedule at the onset of your project.
  Think of this as your communication framework for deploying your actual collaboration once you selected
  a tool (cf. earlier step 3). The goal is not to create more work but to facilitate your collaboration
  with regular check-ins. Here are a few elements to consider:</p>

  <ul><li>What is the team’s preferred communication method?</li></ul>

  <p>Is it email, phone, text messages, instant messaging, social media messaging apps, or face-to-face
  meetings? You may also use a combination of methods. For instance, a team could use instant messaging
  for staying connected and reaching out when needed while also scheduling weekly face-to-face check-ins.</p>

  <ul><li>How often will you check in with each other?</li></ul>

  <p>Depending on the course and its modality, your instructor may give you time at the beginning of each
  class period to check in with your team. Regardless of whether or not you are given time in class, it
  is always a good idea to set your own check-in schedule. For example, for a month-long project, you
  probably want to have weekly check-ins. These check-ins may be time to share project updates, make sure
  everyone is (still) on the same page, and discuss next steps. They may also be time for seeking input
  from your peers on your contributions, asking questions, and solving eventual issues as a group (ex.
  The information you were supposed to gather is not available; your schedule changed, and you did not
  contribute as much as you had hoped this particular week). Check-ins not only streamline the work, but
  they also keep the stress level low since each team member will always know where the project is at.</p>

  <h3>Step 5: Writing the Actual Group Contract/Charter</h3>

  <p>This step is the outcome of steps 1–4. Think of this contract as the first collaborative content
  that your team will develop and share with your instructor. As such, it should reflect everyone’s input
  and vision. While the exact content may vary depending on the project, or how groups were formed, what
  follows are some basic elements that a contract should address:</p>

  <ul><li>A summary of the team’s main goals and the individual goals of each team member.</li><li>A list
  of everyone’s areas of expertise and their role/position. • A description of your collaboration and
  communication methods. • A list of the tools/technology you will use for the different components of
  the project (including for communicating, scheduling meetings, etc.). • A project schedule with specific
  deadlines and outcomes for each component of the project. This also includes a schedule for reviewing
  each other’s contributions and revising. (Refer here to your discussion about your communication protocols
  from step 4). • Your teamwork policies. This should include a clear description of: the basic expectations;
  your approach to conflict resolutions and breach of contract (define together what this would be).</li></ul>

  <p>Once you have a detailed team contract, you are ready to start the work. Look at your contract as
  a map for initiating, planning, and deploying your collaborative process.</p>

