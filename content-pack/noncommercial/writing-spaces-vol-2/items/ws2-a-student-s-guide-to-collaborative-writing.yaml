  <h3>Headers and Page Numbers</h3>

  <p>Headers are a user service, providing information to readers regarding their location in the text.
  The header includes the author’s last name and the page number (see Fig. 4). Because the header information
  is formatted consistently and placed in the exact location on each page, this use of repetition helps
  readers easily find and identify document information.</p>

  <h3>Document Design and Formatting in the Writing Classroom</h3>

  <p>On the initial page of a research paper, the header also includes the author’s name, the date of
  submission, course instructor’s name and course designation, usually left justified (see Fig. 4). This
  information, but not its placement, may vary depending on your course. Always check with your professor
  or refer to handouts provided in class for specifics.</p>

  <p>Subsequent pages of the paper require that the author’s last name and page number be placed in the
  upper, right-hand corner of the page, one-half inch (0.5”) from the top edge of the page and one inch
  (1”) from the right edge of the paper.</p>

  <p>See section 4.4 of the MLA Handbook for information on page numbers.</p>

  <h3>Illustrations</h3>

  <p>Illustrations, including photographs, line drawings, maps, or graphs, help your readers better understand
  the information you are communicating. Sometimes illustrations support the function of the text. For
  example, we use the illustrations in this chapter to help you better understand the concepts we are
  writing about. Understanding the importance of graphics would be much harder with no illustrations as
  support. In other instances, the illustrations themselves are the primary pieces of information. For
  instance, a simple graph can be far more dramatic and comprehensible than a long paragraph full of numbers
  and percentages.</p>

  <p>With MLA style, illustrations should be labeled Figure (usually abbreviated as Fig.), numbered consecutively,
  and given a brief caption following the label. As we have done with the illustrations in this chapter,
  the caption should readily identify the key feature of the illustration. Place the illustration as close
  as possible to the text where you first reference it to help readers understand why you included it.</p>

  <p>Writers frequently use illustrations created by others to supplement their writing. If you find an
  image on a website, you cannot use it without permission. And while some websites explicitly give permission
  to use their images, you must still cite the source in your own work.</p>

  <p>While you can use others’ properly attributed illustrations, sometimes you will create the illustrations
  yourself. For example, you may want to capture an image of your computer’s desktop to add to a document
  about computer systems. To copy a screen shot of your computer to the clipboard, press &lt;Ctrl-Shift-Command&gt;
  (Apple)-3 on Mac OS X or &lt;Print Screen&gt; on Windows. Once on the clipboard, the image</p>

  <p>Michael J. Klein and Kristi L. Shackelford will be available for you to manipulate with an image
  editing software or paste unaltered into almost any type of graphics program.</p>

  <p>While some images may already be exactly the way you need them, most of the time you will need to
  make changes to images before you can use them. Two free image editing software packages are GIMP— the
  GNU Image Manipulation Program—for Mac OS X and Windows systems (available at &lt;http://www.gimp.org/&gt;)
  and Paint.NET for use only on Windows systems (available at &lt;getpaint.net&gt;).</p>

  <h3>Other things to remember when using illustrations:</h3>

  <ul><li>Always use visuals of good quality. A bad illustration can distract your reader and lessen the
  credibility of your argument.</li><li>Don’t distort the image. Keep the image in proportion by holding
  the &lt;Shift&gt; key as you are adjusting the image in your word processor.</li><li>Make sure the image
  is of the right quality and resolution. An image that looks great on a website may not look as good
  when printed. Check the resolution of the image before enlarging it so there is no loss of quality.</li><li>Use
  the image at the appropriate size. Don’t try to force a fullpage PowerPoint slide into a one-inch square
  space.</li><li>Crop images to remove extraneous material. Keep the focus on the important part of the
  illustration, just like you do with text. For example, if including a web browser screenshot of a web
  page in a paper, readers do not need to see the browser window frame or your favorites/bookmarks menu
  in the visual used in the document.</li><li>See section 4.5 of the MLA Handbook for information on working
  with illustrations.</li></ul>

  <h3>Conclusion</h3>

  <p>While not every class, assignment or topic lends itself to the inclusion of graphics, you can still
  design your documents to be appealing to your reader. Good design choices can also make your document
  more accessible to your readers. A clean design with graphic and typographical indicators of content
  gives your readers more opportunities to engage with and understand your intention.</p>

  <p>Style guides define typographical and design rules for you as a writer and a reader. MLA is the most
  commonly used style guide in</p>

  <p>Document Design and Formatting in the Writing Classroom first year writing, but most disciplines
  have their own. All style guides answer the questions you commonly encounter as a writer—Should page
  numbers be at the top or bottom of the page? How do I cite an article from a magazine’s Web site? When
  you answer these questions, you can concentrate on the writing itself and developing your ideas. As
  a reader, you will be able to identify an established style and use it to your advantage. Finding the
  information you want (paper topics, authors cited) is easier when you know where to look (headings,
  reference pages). While the reasoning behind the rules in a style guide may not be intuitive, following
  them leads to better-designed documents.</p>

  <h3>Discussion</h3>

  <p>1. What style guides have you used in the past? How did following a style guide influence your writing?
  In what different writing situations do you think a style guide would be most effective? Least effective?</p>

  <p>2. In what ways does the appearance of a document affect your perception of the message and of the
  author?</p>

  <p>3. How can you integrate the design elements of contrast, repetition, alignment and proximity into
  class assignments? What documents would benefit most from good design principles?</p>

  <p>4. How much value does including an image add to a traditional academic paper? What types of images
  do you think are appropriate? In what ways can images detract from the impact or intent of an academic
  paper?</p>

