body: '<p>Social Contexts and Written Texts</p>

  <p>Sarah Seeley, Kelly Xu, and Matthew Chen</p>

  <p>Overview</p>

  <p>This chapter is a collaboration between a professor (Sarah Seeley) and two former students (Kelly
  Xu and Matthew Chen).* We begin with a discussion of a key concept: the discourse community. In doing
  so, we illustrate why it is necessary to examine the social side of communication. This is an invitation
  for readers to think about the fact that academic communication practices are structured in ways that
  are actually quite similar to the more familiar communication practices they use on a daily basis. We
  offer readers a framework for understanding how the social assumptions associated with familiar communicative
  contexts may be useful in understanding new or unfamiliar contexts.</p>

  <p>We use the social media platform TikTok as an extended example as we explore the various criteria
  that define a discourse community. Xu and Chen then offer examples of how people become competent communicators
  within the context of new new-to-them scientific discourse communities. They cover topics including
  learning a “hidden” lexicon, building confidence and independence, and navigating tacit power hierarchies.
  These experiences reinforce the fact that effective communication requires contextual awareness and
  that understanding social norms is essential for developing that awareness.</p>

  <p>Navigating new communicative contexts can be tricky. This is true of enrolling at a new school, starting
  a new job, or joining a new friend group. In each case, we need to start by “reading the</p>

  <p>* This work is licensed under the Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International
