  <p>Teacher Resources for Writing in Global Contexts: Composing Usable Texts for Audiences from Different
  Cultures by Kirk St.Amant</p>

  <p>Overview and Teaching Strategies</p>

  <p>Aspects of culture and composition are often addressed at one of three points in a writing course:</p>

  <ul><li>When discussing global contexts of writing • When discussing writing for specific cultural audiences
  within the student’s own nation • When discussing online composition practices and the international
  access they allow • This essay can be taught when examining any or all of these areas.</li></ul>

  <p>By focusing on rhetoric and its use in relation to culture, the article provides students with a
  mechanism for examining cultural reading and writing expectations in a variety of cross-cultural contexts.
  When teaching this overall area, instructors need to make students aware that:</p>

  <p>° genre expectations are connected to the cultures using them vs. inherent to genres; and</p>

  <p>° cultures are not monolithic entities, but are comprised of diverse groups.</p>

  <p>To this end, students need to learn the core idea that one doesn’t write for culture X, but one writes
  for audience Y in culture X.</p>

  <p>The globalized rhetoric framework described here provides students with an initial understanding
  of and a mechanism for examining the dynamics of these factors. Ideally, students will use the research
  questions and approaches noted in the entry to gain a better, broader understanding of such factors.
  The key is interacting with and collecting cultural-rhetorical information directly from the members
  of a specific cultural audience when composing for them. Instructors can use this chapter both to convey
  these ideas and have students test and apply related concepts in ways that enhance their understanding
  of such factors.</p>

  <h3>Discussion Questions</h3>

  <p>To help students explore the ideas discussed in these entries, consider having them address—as individuals,
  in small groups, or as an overall class— the following questions:</p>

  <p>1. What genres do you use on an everyday basis and for what reason do you use them? What purpose
  do you seek to achieve when writing in or reading one of these genres?</p>

  <p>2. What venues—on-site or online—do you currently use to interact with (or have the potential to
  interact with) individuals from other cultures? How might these venues be places where you might need
  to compose texts for those individuals? What kinds of texts would you compose and why?</p>

  <p>3. The chapter provides a discussion of writing in terms of usability and how writing is used by
  readers to achieve an objective. Do you agree with this usability-focused approach to writing? Why or
  why not?</p>

  <p>4. This essay discusses a particular approach to researching audiences from other cultures in order
  to create more effective texts for them. Do you think you could use this research approach when composing
  texts for readers from other cultures? Why or why not?</p>

  <p>5. Could the approach—both the overarching questions and related research process—be applied to understand
  audiences within your own culture? If yes, how? If not, why not?</p>

  <p>Examining these items can help students better reflect upon and consider how to apply the ideas presented
  in the essay within the context of their own writing processes.</p>'
