  <p>Revising:</p>

  <p>Once you have feedback from a peer, consider their suggestions. Read all comments, and think carefully
  before making changes.</p>

  <ul><li>Use your discretion. Sometimes writers do not agree with their peers’ suggestions; indeed, authors
  do not always revise everything suggested by editors. However, it is important to clarify what might
  have prompted a response from a peer, such as “This seems like more of an unsupported opinion than textbased
  evidence.” Here you might consider including a source citation either from the text or from an outside
  resource, or consider further explaining your claim. However, if you think your peer reviewer misinterpreted
  or read your claim superficially, do not revise it. At all times, though, maintain ownership. It is
  your paper; you are the ultimate judge of whether the ideas in it represent you and your views. Never
  include someone else’s idea in your paper if you do not understand it or believe it. Whether or not
