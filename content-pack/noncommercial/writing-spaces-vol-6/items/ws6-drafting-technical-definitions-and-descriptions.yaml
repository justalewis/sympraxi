  <h3>Stages of DNA replication</h3>

  <p>DNA replication can be thought of in three stages; Initiation, Elongation, Termination</p>

  <p>The author lays out the linear process that consists of three stages.</p>

  <p>Initiation</p>

  <p>Using each stage name</p>

  <p>DNA synthesis is initiated at particular points within as a heading, the author the DNA strand known
  as ‘origins’, which are specific provides details about coding regions. These origins are targeted by
  initiator the three stages.</p>

  <p>proteins, which go on to recruit more proteins that help aid the replication process, forming a replication
  complex around the DNA origin.</p>

  <p>Table 4.2. A Process Description (continued)</p>

  <p>There are multiple origin sites, and when replication of DNA begins, these sites are referred to
  as replication forks. Within the replication complex is the enzyme DNA Helicase, which unwinds the double
  helix and exposes each of the two strands, so that they can be used as a template for replication. It
  does this by hydrolysing the ATP used to form the bonds between the nucleobases, therefore breaking
  the bond holding the two strands together.</p>

  <p>DNA Primase is another enzyme that is important in DNA replication. It synthesises a small RNA primer,
  which acts as a ‘kick-starter’ for DNA Polymerase. DNA Polymerase is the enzyme that is ultimately responsible
  for the creation and expansion of the new strands of DNA.</p>

  <h3>Elongation</h3>

  <p>Once the DNA Polymerase has attached to the original, unzipped two strands of DNA (i.e. the template
  strands), it is able to start synthesising the new DNA to match the templates. It is essential to note
  that DNA polymerase is only able to extend the primer by adding free nucleotides to the 3’ end.</p>

  <p>One of the templates is read in a 3’ to 5’ direction, which means that the new strand will be formed
  in a 5’ to 3’ direction. This newly formed strand is referred to as the Leading Strand. Along this strand,
  DNA Primase only needs to synthesise an RNA primer once, at the beginning, to initiate DNA Polymerase.
  This is because DNA Polymerase is able to extend the new DNA strand by reading the template 3′ to 5′,
  synthesising in a 5′ to 3′ direction as noted previously.</p>

  <p>However, the other template strand (the lagging strand) is antiparallel, and is therefore read in
  a 5’ to 3’ direction. Continuous DNA synthesis, as in the leading strand, would need to be in the 3′
  to 5′ direction, which is impossible as we cannot add bases to the 5′ end. Instead, as the helix unwinds,
  RNA primers are added to the newly exposed bases on the lagging strand and DNA synthesis occurs in fragments,
  but still in the 5′ to 3′ direction as before. These fragments are known as Okazaki fragments.</p>

  <p>Table 4.2. A Process Descripti on (continued)</p>

  <h3>Termination</h3>

  <p>The process of expanding the new DNA strands continues until there is either no more DNA template
  left to replicate (i.e. at the end of the chromosome), or two replication forks meet and subsequently
  terminate. The meeting of two replication forks is not regulated and happens randomly along the course
  of the chromosome.</p>

  <p>Once DNA synthesis has finished, it is important that the newly synthesised strands are bound and
  stabilized. With regards to the lagging strand, two enzymes are needed to achieve this; RNAase H removes
  the RNA primer that is at the beginning of each Okazaki fragment, and DNA Ligase joins fragments together
  to create one complete strand.</p>

