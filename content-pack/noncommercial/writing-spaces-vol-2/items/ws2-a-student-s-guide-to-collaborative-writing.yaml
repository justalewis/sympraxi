  <p>Available at http://zotero.org/.</p>

  <p>Beyond Black on White: Document</p>

  <p>Design and Formatting in the</p>

  <p>Writing Classroom</p>

  <p>Michael J. Klein and Kristi L. Shackelford</p>

  <p>You’ve received your first assignment in a college writing course.* You’ve created an outline, done
  the necessary research, and written a first draft of your paper. Now it’s time for you to revise your
  work so you can submit the paper. However, writing a paper for a course involves more than simply generating
  content and turning it into your instructor. Equally important as the words you write is how the appearance
  of your document influences the way readers interpret your ideas.</p>

  <p>Most people think of design as the arrangement of images on the page. This is only half true: Graphics
  can convey concepts that you can’t express in writing. If you were writing an article about an oil spill
  and the damage it caused, one powerful photograph could make your point more persuasively than pages
  of writing. Good document design integrates the words on the page with appropriate imagery to fully
  illustrate your meaning. An image of the Deep Horizon oil spill won’t have the same impact if the image
  isn’t coupled with a sentence about the scope of the spill.</p>

  <p>* This work is licensed under the Creative Commons AttributionNoncommercial-ShareAlike 3.0 United
  States License and is subject to the Writing Spaces’ Terms of Use. To view a copy of this license, visit
  http:// creativecommons.org/licenses/by-nc-sa/3.0/us/ or send a letter to Creative Commons, 171 Second
  Street, Suite 300, San Francisco, California, 94105, USA. To view the Writing Spaces’ Terms of Use,
  visit http://writingspaces. org/terms-of-use.</p>

  <h3>Michael J. Klein and Kristi L. Shackelford</h3>

  <p>An often-overlooked element of design is the visual treatment of text itself. In this definition
  of text, text does not include your word choice or the structure of your argument. Instead, it refers
  to the look of the words on the page. Are all the fonts the same? Are key ideas written in a text larger
  than other text? Are some words in bold? All of these choices influence the way your document looks
  and is perceived by your readers. Depending on the type of paper your instructor has assigned and the
  preparation rules or style guide required, subtle variations in text might be your only design option.</p>

  <p>In a typical first year writing course, you’ll be focusing—of course—on writing. If the intent of
  writing is to communicate an idea, the way you present your writing is also important. You can greatly
  improve a standard research paper on climate change with the addition of an image showing differences
  in ice caps over a period of years. You can strengthen data supporting your position in an opinion paper
  if you present it in a graph rather than a narrative format. However, include graphics in written assignments
  with care: they should supplement, not replace, your writing. When you are creating, don’t think of
  design features as only images. Remember that visual design applies to the style of the text you use
  to convey ideas. The remainder of this chapter focuses on the use of text as a design element.</p>

  <h3>What You Should Know about Design Choices and Elements</h3>

  <p>You can talk about design in a multitude of ways. What some designers call white space, for example,
  others call negative space. In both cases, they are referring to areas of a page free from text or objects,
  such as the white space that makes up the margins around the text of this paragraph. A designer may
  talk about the use of alignment in a design, while someone else will describe how textual elements “line
  up” on a page. All theories and methods of design include the same basic ideas, just expressed in different
  terms. The names of elements on a page are much less important than their function. The definitions
  below will help you understand the way we use these terms.</p>

  <h3>Text and Type</h3>

  <p>Typeface refers to the look of your text. It typically includes the font family (e.g., Times New
  Roman), the type size (e.g., 12 point) and</p>

  <p>Document Design and Formatting in the Writing Classroom type emphasis (e.g., bold). Spacing is the
  amount of space around a line of text within a document. The amount of space between lines of text is
  called leading (pronounced led) or line spacing. Leading is typically the size of the font plus two
  points. For example, standard leading for 12-point type is 14 points, indicated as 12/14 point; this
  paragraph uses 11 point Adobe Garamond Pro with 13.2 point leading. Increasing the amount of leading,
  or size of line spacing, can increase readability. Large amounts of text are often set with a leading
  of twice the text (12/24 point), also called double-spacing.</p>

  <h3>Images</h3>

  <p>The visual elements of a design range from simple boxes to the use of color photographs. Designers
  often use the term “images” to refer to the wide range of visual elements available—photographs, line
  drawings, technical illustrations, graphs, charts, and so on. Not all images are appropriate for all
  uses. A color photo of the beach, for instance, may have more persuasive power than a black-and-white
  drawing because the photograph evokes a more complete and personal reaction. A technical illustration
  that allows a reader to see the inside of a device can demonstrate the proper assembly of equipment
  in more detail than an actual photograph. In some cases, though, images can distract from the meaning
  of your text. You should not include random clip art of a tree, for example, to supplement a paper on
  the importance of environmental sustainability. In contrast, you may strengthen your position on environmental
  sustainability with a graph showing the cumulative effects of non-recycled materials.</p>

  <h3>Design Elements</h3>

  <p>Like the combination of text and images, the integration of four key design elements—Contrast, Repetition,
  Alignment and Proximity— gives a design power. You can remember these elements by the acronym CRAP.
  Don’t let the name influence you, though—following these principles is one of the best ways to ensure
  your document looks its best. It is sometimes difficult to differentiate among these concepts because
  they influence each other.</p>

  <h3>Contrast</h3>

  <p>Contrast refers to the visual differences in elements on a page. These differences highlight the
  significance of the individual items, as well as</p>

  <p>Michael J. Klein and Kristi L. Shackelford draw the reader’s attention to different areas of a page.
  In a magazine layout, for example, the largest photograph is more noticeable because of its larger size
  in comparison to others on a spread. Color in a design can also provide noticeable contrast.</p>

  <p>In text, you see contrast through different uses of formatting options. This might include choosing
  different typefaces to visually separate headings from your main text. Contrast may also be visible
  in the differing sizes or emphasis applied to a text. If you apply bold formatting to keywords in your
  document, they stand out from others and indicate that they are significant. If every other word in
  your document is bold, however, the effect of the contrast is lost. A similar effect occurs when you
  overuse a highlighter when marking a textbook: important information gets lost rather than being easier
  to find.</p>

  <p>Look at the first page of this chapter. You can immediately see the name “Document Design” and recognize
  that it is the title of the chapter. Your eye is immediately drawn to it because it is the biggest item
  on the page. Just below the title, the authors’ names are in smaller, italicized text. The contrast
  between the size and emphasis in the two lines of text quickly illustrates that they are providing different
  information.</p>

  <h3>Repetition</h3>

  <p>Repetition involves the use of consistency to visually group multiple items that express similar
  ideas or are somehow related. You can apply this design element to graphics, including the use of shapes
  and color. For example, many of your textbooks may include a section summarizing key ideas from the
  text. By placing all summaries in a similarly shaped box or highlighted by the same color, you can tell
  that these items have something in common. Once you realize that all summaries in your political science
  textbook are in green boxes, you can find them at glance.</p>

  <p>You can apply repetition simply by formatting text in different ways. When you look at a restaurant
  menu, you’ll see that the larger categories—like “Appetizers” and “Desserts”—are presented in the same
  font and size as each other, which is different from the listing of the food items themselves. This
  repeated format shows that those categories are equivalent. It also indicates that a new section is
  beginning, as do the headings that divide sections of this chapter. In papers written for a class, you
  express repetition in text primarily through place-</p>

  <p>Document Design and Formatting in the Writing Classroom ment, such as always putting page numbers
  in the same place on the page. On a Works Cited page, the organization of citation materials (such as
  the author’s name and book title) makes information easier to locate. Repetition makes your intent more
  obvious to readers.</p>

  <p>Repetition lets you quickly glance through this book and find information, even in sections you haven’t
  already read. To find the first page of a chapter, you look for a large title with lots of white space
  above it. If you’re looking for a specific page in the book, you know to look at the outside corners
  to locate the page numbers.</p>

  <h3>Alignment</h3>

  <p>In design, alignment refers to the placement of elements on a page. While everything on a page is
  aligned in that it has been placed somewhere, some alignment strategies are better than others. You
  can think of it as asking a sick friend, “Do you have a temperature?” Of course, everyone has a temperature;
  what you’re asking is if your friend has an elevated or abnormal temperature. In the same way, when
  document designers talk about alignment, they typically mean consistent alignment. For example, text
  that is left justified or graphics that run along the edge of the page are considered properly aligned.</p>

  <p>Aligning elements creates a cleaner, more attractive design and emphasizes the consistency of information
  on a page. Alignment also helps readers access and process information in a publication. Appropriately
  aligned text clarifies for the reader where ideas begin and end. It also increases readability by allowing
  the reader’s eye to return to a consistent location on the page while reading. Breaking the alignment
  scheme is also a valuable design tool. When a block quote is indented, it is quickly apparent that the
  text has a slightly different meaning than the text above and below it.</p>

  <p>The text alignment throughout this chapter indicates when a topic is changing and how a large piece
  of text (the chapter) can be broken into smaller chunks (the sections). Main headings within the text
  are centered over justified body text. To find the idea you’re looking for, you can look for the centered
  text and know that a new idea is being introduced.</p>

  <h3>Proximity</h3>

  <p>Proximity is the grouping of elements that have something in common. Often a layout involves a single
  idea, and the designer uses the</p>

  <p>Michael J. Klein and Kristi L. Shackelford entire page to place thematically related text and graphics.
  When multiple ideas are included on a single page, the reader can tell which are related based on how
  close—or far—they are from each other. An obvious example is a box including a photo and its caption.</p>

  <p>In academic writing and formatting, the placement of text often illustrates proximity. You place
  headings that identify the content of a section directly above that section, cuing the reader to a shift.
  This proximity also allows readers to quickly find related information based on the heading of a section.</p>

  <p>Look at the image labeled as Fig. 1. As soon as you see the graphic, you can look immediately below
  it, see what it is named and why it is included. What if that label was on the next page? Placing related
  elements together is an efficient way to make sure they are properly understood.</p>

  <h3>For More Information</h3>

  <p>Design texts aren’t just for professional designers! You can find examples of the principles discussed
  here in a variety of design books. Look for a basic book that covers designing with images and text
  to learn more. A good one to start with is Robin Williams Non-Designer’s Design Book; many of the ideas
  in this chapter are based on ones presented in her book.</p>

  <h3>How You Can Apply These Design Principles</h3>

  <p>Incorporating design principles into a publication has an immediate and compelling effect. Even text-heavy
  documents, such as academic papers or resumes, become more appealing and comprehensible with even minor
  restructuring.</p>

  <p>The example in Fig. 1 shows an unformatted resume. The lack of repetition, contrast, alignment, and
  proximity make the document unattractive as well as difficult to follow. There is no way to easily distinguish
  important information, like the applicant’s name and contact information. Sections run together, and
  no key ideas are clear.</p>

  <p>Fig. 2 shows the same content using the previously discussed design elements. The document is more
  visually appealing as well as being easier to review. Each individual design principle is involved,
  and their combination leads to a stronger design.</p>

