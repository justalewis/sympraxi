  <p>Teaching Resources for An Introduction to and Strategies for Multimodal Composing by Melanie Gagich</p>

  <p>This chapter can be used by instructors who integrate various types of multimodal composing assignments
  into their curriculum because it offers students an introduction to multimodal composing and strategies
  to consider when asked to create a multimodal text. As a composition teacher who has taught multimodal
  projects since 2014, I have found that some students want to jump right in to creating their multimodal
  text while others do not know how to begin. To counteract this issue, I use a process-based strategy
  that includes discussion, practice, and production when teaching multimodal assignments. This chapter
  reflects that process in that it is split into two sections. The first section provides a conceptual
  overview of multimodality and its importance in college writing classrooms and the second half offers
  five strategies instructors can use to help students create a multimodal text.</p>

  <p>This chapter can be read as a whole or broken into sections; however, I think it is most appropriate
  to read each major section separately. I find it is easier to begin a multimodal assignment by asking
  students to read the first section of the chapter to frame discussions of key terms associated with
  multimodal composing, the modes of communication, and the importance of multimodality. This section
  also provides examples (drawn from outside sources as well as from my students’ work), which I use as
  a basis for activities that ask students to respond to the chapter examples and then find their own.
  I have provided discussion questions and inclass activities that I have used to help students understand
  the concept of multimodality.</p>

  <p>I assign the second section of the chapter after the initial introduction to key terms and multimodality.
  The second section includes three pre-drafting and two drafting strategies I have used successfully
  in my courses. The length of the project affects the way I utilize the second section of the chapter.
  For example, when I assign a semester-long multimodal project in an upper-level composition course,
  students are given a mini-project for each of the pre-drafting phases that helps them create a culminating
  multimodal text. In my first-year writing courses, I assign a four-week multimodal project, and I simply
  ask students to read the second half of the chapter and complete complementary in-class activities.</p>

  <p>However, I can envision instances where the strategies could be addressed individually and/or rearranged.
  The second half of the chapter is meant to help students begin constructing a multimodal text, and provides
  a rough template for setting up a multimodal project unit for the instructor. By no means am I suggesting
  that the considerations listed here are inclusive of all possible ways of integrating a multimodal project;
  instead, I wanted to share these best practices with interested instructors to decrease the workload
  of creating a new project curriculum from scratch.</p>

  <h3>Discussion Questions</h3>

  <p>1. What does it mean to compose multimodally? 2. The chapter lists three reasons supporting the inclusion
  of multimodal composing assignments in writing classes; what are they? Why else might learning how to
  compose a multimodal text be important? 3. How is citing and attributing work in a multimodal text similar
  to and different from citing in a traditional MLA essay?</p>

  <h3>In-Class Activities</h3>

  <p>1. The chapter discusses and provides examples for the five modes of communication; find at least
  one example of each mode, different from those described in the chapter. Write one to two sentences
  explaining how it is representative of that mode.</p>

  <p>2. What are openly licensed sources? Find at least three examples of an openly licensed source, describe
  the type of license they hold, and create an ideal attribution for each.</p>

  <p>3. Find a multimodal text that relates to your topic or a topic of interest. Practice analyzing it
  using the questions from the “Review and Analyze other Multimodal Texts” sub-section. How can you use
  this analysis to help you create your own multimodal text?</p>

  <p>4. Find a multimodal text and a traditional, written text that discusses your topic or a topic of
  interest. Does the presentation of information affect your understanding of each text? In what ways?</p>'
