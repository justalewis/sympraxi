  <p>Teacher Resources for “‘I Passed First-Year Writing—What Now?’ Adapting Strategies from First-Year
  Writing in the Disciplines</p>

  <p>Overview and Teaching Strategies</p>

  <p>Thank you for reading—and potentially teaching—this chapter! This chapter is meant to help students
  consider how they will adapt the strategies that they learned in composition when they enter discipline-specific
  courses in their major. As an administrator in a WAC program, I really hope that students are asked
  to write in meaningful ways beyond their general education writing courses. Research in writing across
  the curriculum, writing in the disciplines, and career success identify the ability to communicate effectively
  as integral for professional preparation. This chapter is meant to resist the assumption that the completion
  of their general education writing courses means students are done learning about writing. Moreover,
  it encourages students to critically think about how they can take more agency in writing transfer and
  anticipate that writing in their disciplinary courses will likely have less scaffolding and support
  than they experienced in composition courses.</p>

  <p>This chapter opens with a scenario describing a student who experienced success in composition but
  could not transfer the skills they learned to a biology scientific poster assignment. Then, it explains
  how key rhetorical concepts can be applied in a writing in the disciplines setting. After, it gives
  students some tips they can use to guide their writing in these new contexts. It ends by revisiting
  the scenario and asking students how they might advise the student featured in this story. The conclusion
  reminds readers the work of learning writing never ends.</p>

  <p>I encourage you to use this chapter alongside other WAC/WID activities, such as researching genres
  and writing situations common to students’ professional and disciplinary communities or speaking with
  experts in their future fields about writing. In my own composition course, I ask students to complete
  a genre analysis of a genre that is used often within their future professions. Then, after analyzing
  the genre and researching a topic relevant to professional conversations in their discipline, they compose
  the genre for the first time. I would ask students to read this chapter after that final project alongside
  a reflective activity that asks them to imagine their future writing tasks and articulate how their
  writing strategies can help them complete these tasks. The discussion questions below can facilitate
  this reflective process.</p>

  <h3>Discussion Questions</h3>

  <p>Please use these discussion questions to guide synchronous or asynchronous discussion. They are broken
  into two sections: one that asks about the chapter’s content and another that asks students to begin
  reflecting on their future disciplinary writing.</p>

  <h3>Reviewing the Chapter’s Content</h3>

  <p>1. Review the key rhetorical concepts that the author uses in this chapter. Which concepts are familiar
  to you and which are new? How do you see these concepts at work in the writing you’ve done for this
  course?</p>

  <p>2. In your opinion, is the scenario that opens and closes this chapter realistic to writing assignments
  in other courses? What challenges related to how you understand writing in your discipline are understated
  or missing? What do you wish the author had considered or added when creating the opening scenario?</p>

  <p>3. The author has a list of writing strategies that she encourages you to consider. In looking over
  this list, which strategies complement your writing process? Which strategies do you think would be
  more difficult to integrate into your writing habits?</p>

  <h3>Reflecting as a Writer</h3>

  <p>1. The author mentions the role that failure and frustration plays in adapting to new writing situations.
  Think about a particular time you felt frustrated by a writing situation: what did you do? How did you
  overcome the challenges? What would you have done differently? How did this past challenge prepare you
  to better respond to future writing-related challenges?</p>

  <p>2. In reflecting on your future professional community, identify some writing situations (purposes,
  audiences, genres, and forms of rhetoric) that are commonly used in that community. What do you know
  about these writing situations? If you were to engage in these situations as a writer, what questions
  would you need answered to be successful?</p>

  <p>3. Open an internet search and type in “Writing in…” completing the phrase with your future professional
  or disciplinary community. Take 10–15 minutes to review some resources that come up. Then, do some freewriting
  about what you found: what resources did you find, and do you believe they reliably represent writing
  in your future profession? What organization or individual created these resources, and are they good
  authorities of writing in your discipline? What did you learn about writing in this professional community?
  How is this approach to writing different than writing you have done? What excites you about writing
  in these new ways? What do you want the writing you do in your profession to accomplish?</p>

  <h3>Optional Activities: Read-Like-a-Writer</h3>

  <p>This activity has been developed from Mike Bunn’s chapter “How to Read Like a Writer” chapter in
  Writing Spaces, vol. 2.</p>

  <h3>For Teachers</h3>

  <p>I use this brainstorming activity to open a genre analysis assignment. I model with students how
  to engage in answering these questions. If it’s early in the semester, I model using the syllabus (which
  can actually be helpful in teaching students how to read syllabi), but if that is not a timely suggestion,
  you can use pop culture genres (like Instagram posts, memes, blogs) or other familiar genres. When I’m
  teaching online, this is a shared discussion board, Google doc, or Padlet thread that everyone contributes
  to. When I’m teaching face-to-face, we orally discuss the example while I take notes on a shared doc
  or visible whiteboard. After we discuss a shared example, I ask students to complete the read-like-a-writer
  questions for the genre they would like to focus on the for the genre analysis. Students will then build
  on their answers to these questions to create a first draft of their genre analysis assignment.</p>

  <p>Disciplinary instructors could use this activity to introduce a genre that students will be creating—like
  a scientific poster. This will help students learn about the new genre and create a conversational space
  where the instructor can emphasize assignment expectations.</p>

  <h3>For Students</h3>

  <p>Find 1–3 examples of a genre used by your professional community. If you are working with a longer
  genre, just read one part across all examples (e.g., if you are reading academic journal articles in
  your future discipline, maybe just look at a single section of each article).</p>

  <p>Take time to read through each example. Instead of worrying about the content, read these examples
  with the goal of learning how the writer put them together: the choices they made and the writing strategies
  they used. The questions below will help you by leading you to look at specific features within the
  text(s). By reflecting on how the writing is designed to achieve its rhetorical goals, we can learn
  about writing in our professional disciplinary communities and begin to consider which strategies we
  would like to bring into our own writing.</p>

  <h3>Rhetorical Considerations</h3>

  <p>1. What is the purpose of this writing? To answer this question, look for clues in the text, but
  also consider where is has been published or shared.</p>

  <p>2. Who is the audience? The answer is not everyone. Who would be interested in reading this text
  and who is it meant to reach given its purpose?</p>

  <p>3. What forms of rhetoric are used throughout this text? Is the purpose achieved through alphabetic
  writing, visual rhetoric, embodied rhetoric, oral rhetorical cues, etc. Where are key moments in this
  text where you think the rhetoric is particularly strong in achieving its purpose?</p>

  <p>4. What is the genre of this text? How does this genre relate to the text’s audience and purpose?</p>

  <p>5. What are the conventions of this genre? Put differently, what would someone expect to see because
  you are writing in this genre? Where do you see the writer pushing against the conventions and where
  do you see them following those conventions?</p>

  <h3>Text Design</h3>

  <p>1. How is the example organized? What logic guides how the text is put together?</p>

  <p>2. How long is the text overall? Does that overall length get evenly distributed across all sections
  of the text or are certain sections longer than others?</p>

  <p>3. What are the text’s main parts or components?</p>

  <p>4. How does the writer introduce or open the text? How long is the introduction? What rhetorical
  moves are made to bring the audience into the text and inform them of its purpose?</p>

  <p>5. How long are paragraphs within the text? If the text doesn’t have paragraphs, how long are sentences?</p>

  <p>6. How does the writer close or conclude the text? How long is the conclusion? What rhetorical moves
  are made to wrap up the text and reinforce the text’s purpose?</p>

  <p>7. Does the writer attribute or cite ideas and sources? If so, what does that referencing process
  look like: are there in-text citations, footnotes, end notes, hyperlinks, tags?</p>

  <p>8. What do you notice about the writer’s language and style of writing? Is it formal or informal?
  Does it use technical or generalized language? How does it fit the audience and purpose of the text?</p>

  <h3>Process of Creation</h3>

  <p>1. What do you think was the writer’s process for creating this text? Where might they have gotten
  feedback? What did the revision process perhaps take into account? How might they have known when the
  text was “done” or done enough to publish?</p>

  <p>2. What steps did the writer take to make this text accessible? Accessibility includes steps taken
  in the design process to make it readable for those using assistive technologies, like screen readers,
  but it can also include language and design considerations that make the text more approachable to readers
  with different disciplinary, professional, educational, and cultural backgrounds.</p>

  <h3>Adding to Your Writing Toolkit</h3>

  <p>1. What about this text complements how you write? These can be rhetorical strategies or design characteristics
  that appeal to you, or aspects of the process that fit your own process for writing.</p>

  <p>2. What about this text is new or different from your writing? Do you have any interest adopting
  any of these strategies?</p>

  <p>3. What challenges might you experience trying to write in this genre for the first time?</p>

  <p>4. What resources or support could help you write in this genre for this audience and purpose?</p>'
