  <p>Rhetorical Analysis: Interpreting the Art of Rhetoric</p>

  <p>9</p>

  <h3>CHAPTER OUTLINE</h3>

  <p>9.1 Breaking the Whole into Its Parts 9.2 Rhetorical Analysis Trailblazer: Jamil Smith 9.3 Glance
  at Genre: Rhetorical Strategies 9.4 Annotated Student Sample: “Rhetorical Analysis: Evicted by Matthew
  Desmond” by Eliana Evans 9.5 Writing Process: Thinking Critically about Rhetoric 9.6 Editing Focus:
  Mixed Sentence Constructions 9.7 Evaluation: Rhetorical Analysis 9.8 Spotlight on … Business and Law
  9.9 Portfolio: How Thinking Critically about Rhetoric Affects Intellectual Growth</p>

  <p>INTRODUCTION Because humans exist in social situations, communication has always been a part of what
  it means to be human. Basic forms of communication, such as smiling or adopting certain physical stances,
  may be considered instinctive. However, when language began to replace sounds and gestures, communication
  became more specific. People used language to give and seek information, to express and react to emotions,
  and to persuade others to think or act in certain ways.</p>

  <p>Beginning with the ancient Greeks, a large part of language education has focused on the ability
  to persuade. The Greeks used the word rhetoric, which originally meant “the act of speaking a language,”
  and expanded its importance to include a focus on situations in which language was used for a persuasive
  purpose: to motivate an audience to action.</p>

  <p>These ideas became central to Greek culture and patterns of behavior that characterized their way
  of life. This chapter will address persuasive techniques: how people use words to influence, lead, create
  new understanding, and rouse others to action. Your writing task will be to identify, explain, and analyze
  the strategies a particular writer uses to persuade readers. Analyzing the rhetorical strategies of
  other writers will help you develop your writing identity as you learn to incorporate some of these
  strategies into your own work while rejecting others.</p>

  <p>9.1 Breaking the Whole into Its Parts</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Identify and explain ethos, logos, pathos, and
  kairos. • Identify and analyze logical fallacies used in persuasion. • Explain how rhetorical strategies
  are used in real-life situations.</p>

  <p>Communicative situations nearly always contain rhetoric, the craft of persuading through writing
  or speaking. Think of your earliest instances of communication with parents or caregivers. Before you
  were proficient in language, you learned to navigate situations with your other senses, such as sight,
  sound, and touch. Consider people’s facial expressions and tones of voice. How did you know when they
  were pleased, displeased, or confused by your actions? The emphasis is on the word how, because the
  how is what starts you on the path of analyzing the forms, intent, and effectiveness of communication.
  The point is that even facial expressions and tones of voice serve communicative functions and contain
  a rhetoric that one can observe, process, and analyze.</p>

  <p>Now, as an adult, you have learned to use rhetoric to be persuasive and to recognize when others
  are trying to persuade you. Imagine the following situation. A basic question arises among roommates:
  Where should we go for dinner? Your roommates want to go to Emiliano’s Pizza Pavilion again, and their
  reasoning seems sound. First, having tried all pizza places in town, they know Emiliano makes the tastiest
  pizza—just the right combination of spices, vegetables, and cheese, all perfectly baked in the right
  oven at the right temperature. Furthermore, the pizza is fairly cheap and probably will provide leftovers
  for tomorrow. And they add that you don’t really want to stay home all alone by yourself.</p>

  <p>You, on the other hand, are less keen on the idea; maybe you’re tired of Emiliano’s pizza or of pizza
  in general. You seem resistant to their suggestion, so they continue their attempts at persuasion by
  trying different tactics. They tell you that “everyone” is going to Emiliano’s, not only because the
  food is good but because it’s the place to be on a Thursday evening, hoping that others’ decisions might
  convince you. Plus, Emiliano’s has “a million things on the menu,” so if you don’t want pizza, you can
  have “anything you want.” This evidence further strengthens their argument, or so they think.</p>

  <p>Your roommates continue, playing on your personal experience, adding that the last time you didn’t
  join them, you went somewhere else and then got the flu, so you shouldn’t make the same mistake twice.
  They add details and try to entice you with images of the pizza—a delicious, jeweled circle of brilliant
  color that tastes like heaven, with bubbling cheese calling out to you to devour it. Finally, they try
  an extreme last-ditch accusation. They claim you could be hostile to immigrants such as Emiliano and
  his Haitian and Dominican staff, who are trying to succeed in the competitive pizza market, so your
  unwillingness to go will hurt their chances of making a living.</p>

  <p>However, because you know something about rhetoric and how your roommates are using it to persuade,
  you can deconstruct their reasoning, some of which is flawed or even deceptive. Your decision is up
  to you, of course, and you will make it independent of (or dependent on) these rhetorical appeals and
  strategies.</p>

  <h3>Rhetorical Strategies</h3>

  <p>As part of becoming familiar with rhetorical strategies in real life, you will recognize three essential
  building blocks of rhetoric:</p>

  <ul><li>Ethos is the presentation of a believable, authoritative voice that elicits an audience’s trust.
  In the case of the pizza example, the roommates have tried all other pizzerias in town and have a certain
  expertise.</li><li>Pathos is the use of appeals to feelings and emotions shared by an audience. Emiliano’s
  pizza tastes good, so it brings pleasure. Plus, you don’t want to be all alone when others are enjoying
  themselves, nor do you want to feel responsible for the pizzeria’s economic decline.</li><li>Logos is
  the use of credible information—facts, reasons, examples—that moves toward a sensible and acceptable
  conclusion. Emiliano’s is good value for the money and provides leftovers.</li></ul>

  <p>In addition to these strategies, the roommates in the example use more subtle ones, such as personification
  and sensory language. Personification is giving an inanimate object human traits or abilities (the cheese
  is calling out). Sensory language appeals to the five senses (a delicious, jeweled circle of brilliant
  color).</p>

  <h3>Logical Fallacies</h3>

  <p>Familiar with the three main rhetorical strategies and literary language, you also recognize the
  “sneakier” uses of flawed reasoning, also known as logical fallacies. Some of the roommates’ appeals
  are based on these fallacies:</p>

  <ul><li>Bandwagon: argument that everyone is doing something, so you shouldn’t be left behind by not
  doing it too. “Everyone” goes to Emiliano’s, especially on Thursdays.</li><li>Hyperbole: exaggeration.
  Emiliano’s has “a million things on the menu,” and you can get “anything you want.”</li><li>Ad hominem:
  attacking the person, not the argument. Because you are hesitant about joining your roommates, you are
  accused of hostility toward immigrants.</li><li>Causal fallacy: claiming or implying that an event that
  follows another event is the result of it. Because you ate elsewhere, you got the flu.</li><li>Slippery
  slope: argument that a single action could lead to disastrous consequences. If Emiliano’s misses your
  business, they may go bankrupt.</li></ul>

  <p>In a matter of minutes, your roommates use all these strategies to try to persuade you to act or
  to agree with their thinking. Identifying and understanding such strategies, and others, is a key element
  of critical thinking. You can learn more about logical fallacies at the Purdue University Online Writing
  Lab (https://openstax.org/r/ Purdue_University_Online).</p>

  <h3>Kairos</h3>

  <p>As a whole, rhetoric also depends on another Greek rhetorical strategy, kairos. Kairos is the idea
  that timing is important in trying to persuade an audience. An appeal may succeed or fail depending
  on when it is made. The moment must be right, and an effective communicator needs to be aware of their
  audience in terms of kairos. Going back to the roommates and pizza example, kairos might be an influence
  in your decision; if you were tired of pizza, had to save money, or wanted to study alone, your roommates
  would have less chance of persuasion. As a more serious example, if a recent series of car accidents
  has caused serious injuries on the freeway, an audience might be more receptive to a proposal to reassess
  speed limits and road signage. Awareness of rhetorical strategies in everyday situations such as this
  will help you recognize and evaluate them in matters ultimately more significant than pizza.</p>

  <h2>Rhetorical Analysis Trailblazer: Jamil Smith</h2>

  <p>LEARNING OUTCOMES By the end of this section, you will be able to:</p>

  <ul><li>Demonstrate the ability to think critically about a text. • Identify and analyze rhetorical
  strategies.</li></ul>

  <p>“No matter what you do, you have to be able to process information and think critically.”</p>

  <p>Whose Rhetoric?</p>

  <p>Jamil Smith (b. 1975) is a well-recognized print and television journalist and commentator on politics,
  culture, and sports. He has won three Emmys for sports journalism and is best known for his articles
  in Rolling Stone and the New Republic and as a producer for MTV News, CNN, MSNBC, and The Rachel Maddow
  Show.</p>

  <p>Smith grew up in Cleveland, Ohio, where he attended Shaker Heights High School. He has often written
  about Cleveland and his work there with the Minority Achievement Committee (MAC), which pairs accomplished
  minority achievers with their younger peers to encourage greater participation in education. Smith graduated
  from the University of Pennsylvania in 1997 with a degree in English.</p>

  <p>Smith often focuses on the full range of Black life in culture, politics, sports, and media. In guest
  appearances and interviews, he emphasizes the overriding need for minority journalists to use rhetorical
  powers of persuasion and to assert their place alongside traditionally White-dominated media voices.
  When Smith became senior editor at the New Republic in 2015, he explained his task as being “to help
  usher this magazine into a different era” (Connor). He recognized his presence there as an opportunity
  for his writing to serve as a moving force for social change and even the radical transformation of
  American journalism.</p>

  <p>For the February 19, 2018, cover story of Time magazine, Smith wrote an extensive essay on the film
  Black Panther (2018) and its significance for Black American culture. The superhero film, based on a
  Marvel Comics story, grossed about $1.3 billion and was hailed as one of the outstanding films of the
  year, winning three Oscars out of a total of seven nominations. In his essay, Smith attaches great importance
  to the movie for its ability to address “what it means to be black in both America and Africa—and, more
  broadly, in the world” (Smith, “Revolutionary”).</p>

  <p>Smith used the film as a vehicle for expressing his belief in the compelling role that representation—being
  a presence, even an unexpected one—plays in communication. He has stated in an interview, “I really
  truly believe in the power of storytelling.” His fervor and commitment to creating a new understanding
  of Black life are based on his taking the personal risk to establish credibility as someone proudly
  unafraid to open himself to the audience: “My mission is to reflect the experiences of and tell the
  stories of people who have been ignored and erased” (Smith, “Cleveland”).</p>

  <p>In his writings, Smith uses ethos to portray himself as a Black Clevelander, well acquainted with
  discrimination and prejudice, who speaks personally from his experiences and seeks to reach the general
  population as a whole. Smith wishes for readers to feel, as he does, that life needs to be complex,
  with “infinite versions” of the self, from executives to garbage collectors and all positions in between.
  He says that most White people know this already and see it reflected in films that represent their
  lives, but Black Americans have not yet experienced this and consequently are emotionally “poorer” without
  the “boundless” paths that White people have open to them (Smith, “Revolutionary”).</p>

  <p>Smith’s review of Black Panther, which garnered an award from the New York chapter of the Society
  of Professional Journalists, also relies on Smith’s knowledge of culture and history. For example, he
  points out that the character King T’Challa, introduced in Marvel Comics in 1966, reappears in the film
  at a time when the United States still has not met demands for equal opportunities. Smith capsulizes
  the aims and key events of the Black Power movement of the 1960s and names its leaders. He also quotes
  the Federal Reserve statistic that in 2016, a typical Black family “had a median net worth of $17,600,”
  whereas a White family “had a median net worth of $171,000.” He uses such statistics to claim that the
  movie conceives and portrays a world in which Black people have the resources to “level the playing
  field” worldwide (Smith, “Revolutionary”).</p>

  <p>Given Smith’s position and recognition in the journalistic profession, readers find his cultural
  criticism of subjects in Black life and culture both logical and convincing. The example of Smith as
  a cultural critic—a person who writes opinion pieces about the art, music, movies, and books of a particular
  culture—is especially relevant in contemporary times. As people’s lives change continually, new influences
  on culture may emerge from the margins and come to be recognized. Language changes are a leading indicator
  of social change as well, especially in audiences that themselves are not one-dimensional and will interpret
  the language differently. In time, as with trends and fashions, diverse rhetoric may change a society
  and become widely accepted and even emulated. In this light, read Jamil Smith’s entire review (https://openstax.org/r/review1).</p>

  <p>Another important figure you may wish to explore is Ta-Nehisi Coates (https://openstax.org/r/Ta-Nehisi).
  Coates is a leading journalist and creative writer whose Black Panther graphic novels, written for Marvel
  Comics, closely parallel the film. His use of rhetorical language particular to the Black experience
  in America has won numerous awards and recognition. You can read more about Coates in Memoir Trailblazer:
  Ta-Nehisi Coates.</p>

  <h3>Discussion Questions</h3>

  <p>1. How does Jamil Smith use contemporary culture to make persuasive points?</p>

  <p>2. How has Smith established credibility with readers?</p>

  <p>3. In what ways does Smith appeal to readers’ emotions?</p>

  <p>4. How does Smith’s use of logos support his claims of racial inequality?</p>

  <p>9.3 Glance at Genre: Rhetorical Strategies</p>

  <h3>LEARNING OUTCOMES</h3>

  <p>By the end of this section, you will be able to: • Identify key rhetorical strategies that authors
  use to persuade readers. • Analyze texts to demonstrate understanding of key rhetorical concepts. •
  Identify genre conventions and explain how they are shaped by purpose, culture, and expectation.</p>

  <p>Rhetorical analysis is the genre, or type of writing, that examines the way writers and speakers
  use language to influence readers. Rather than describing or summarizing content—the what of characters
  or themes—rhetorical analysis focuses on the individual parts of a text to show how language works to
  create the effects the writer wants. In other words, in addition to content, writers use rhetorical
  strategies to deliver and strengthen their ideas and thus influence their readers. A rhetorical analysis
  should, therefore, address the rhetorical situation, or conditions of communication that surround the
  rhetoric. These consist of the author (who), message (what), readers (to whom), purpose (why), means
  (how), context (where and when), and culture (community).</p>

  <p>Culture refers to the way of life that a defined group of people establish. Their beliefs, laws,
  customs, and habits represent them as a group and may provide a signature to identify who they are and
  what they have accomplished. Rhetorical analysis must take these factors into full consideration, especially
  because cultural patterns are constantly changing and evolving with new knowledge and behaviors. Moreover,
  culture will vary greatly from group to group. Subgroups within a larger culture—for example, minorities
  within a majority population—may have distinct expressions of culture. When rhetorical analysis approaches
  language of a particular culture, questions may arise about who is best equipped to do the analysis
  and on what criteria, based on time and place.</p>

  <p>Writers of rhetorical analyses consider these elements carefully and ask questions based on them.
  What are the goals of the author of the text? What factors are at play in the author’s choice of strategies
  used to make a rhetorical impact? What may occur in the interaction between the writer and reader? Will
  readers approach the piece neutrally, with no previous opinions? Are they likely to agree because they
  are of the same opinion, or are they hostile and ready to reject the arguments? Have they heard or read
  the ideas before? Will the ideas be too radical or too familiar? Are readers likely to see the author
  as sharing the field with them or as a stranger who must win their confidence?</p>

  <h3>The Workings of Rhetorical Analysis</h3>

  <p>The aim of rhetorical analysis is not to find agreement with or praise for the writer, although either
  may be implied or stated. The essential task of analyzing requires a detachment that will convince the
  readers of the validity and effectiveness (or lack thereof) of the writing by identifying the writer’s
  tools and what they accomplish.</p>

  <p>As you formulate your rhetorical analysis, be aware of the following approaches and strategies that
  writers use to persuade an audience. Your goal will be to identify them in your analysis, explain their
  use, and evaluate their effectiveness.</p>

  <ul><li>Establishing credibility. Writers include their credentials or experience with the subject to
  ensure that readers will take them seriously as someone who knows what they’re talking about. To reinforce
  their authority, they cite reliable sources as support for their points.</li><li>Sharing personal experience.
  Sharing a personal experience related to the subject enhances credibility and may also appeal to readers’
  emotions.</li><li>Targeting emotional concerns. By specifically addressing those incidents or outcomes
  that readers may fear or desire, the author can rally them to take a particular position. Emotional
  concerns also include appeals to the five senses and to broader sentiments such as love, loyalty, anger,
  justice, or patriotism.</li><li>Using devices that draw attention to claims. These include literary
  devices such as parallelism, repetition, and rhetorical questions that writers and speakers use to emphasize
  points and unify a text.</li><li>Supporting claims with convincing evidence. Ways of supporting claims
  include quoting, summarizing, or paraphrasing expert opinions; relating anecdotes and examples; and
  citing appropriate statistics and facts.</li><li>Acknowledging the opposition. If a writer makes a point
  of explaining other groups’ positions carefully and respectfully, readers from those groups, as well
  as the target audience, are more likely to be responsive to the writer. By acknowledging the opposition,
  writers show they have considered opposing views and can then demonstrate that their position is preferable.</li><li>Questioning
  the motivation of the opposition. By exposing others’ possibly conflicting interests, the writer can
  undermine the credibility of an opponent’s character or argument.</li></ul>

  <p>In addition to these, writers may use more questionable rhetorical devices to persuade readers. While
  the techniques of each strategy differ, all lead away from the actual argument and seek to persuade
  through means other than reasonable, logical thought. Such strategies include bandwagon, ad hominem
  (name-calling), bait and switch, and more. Recall the roommates’ use of some of these in their efforts
  at persuasion in Breaking the Whole into Its Parts.</p>

  <h3>Rhetorical Strategies in Advertising and Public Policy</h3>

  <p>The strategies and other devices of rhetorical writing that are open to analysis are present in many
  types of communication, including multimodal examples such as advertisements that combine visuals with
  carefully crafted texts, dialogue, and voice-over.</p>

  <p>to be liked. Despite the humorous twist in the comment that he kicked the seat on purpose, the offending
  man nonetheless doesn’t want to be disliked. Nor do the others who commit other blunders. The sense
  of taste—sweetness—also comes into play, appealing to the senses, as does the sense of sight in the
  images of the colorful candy. Furthermore, placing the ad during the Super Bowl targets an audience
  of game watchers whose ages, interests, and habits have been studied. They may be in a snacking frame
  of mind, so the appeal of candy is timely (kairos). The ad combines sophistication, appropriate adult
  behavior, and childishly amusing animation and personification. Seeing the product makes it more memorable.
  On the other hand, note the subtle use of the bandwagon fallacy: different people in different situations
  are doing the same thing—offering M&amp;Ms. The bandwagon implication is that if you do something you’re
  sorry for or should be sorry for (or even if you don’t), giving out M&amp;Ms is the way to apologize
  and be likable. Because travelers, businesspeople, the religiously observant, and others from different
  walks of life are doing it, so should you.</p>

  <p>Because the images are emotionally accessible to children as well as adults, they appeal to widely
  shared pathos. The unspoken implication is that preventing forest fires will allow these young animals
  and forest plants to live rather than die in a carelessly started—and deadly—fire. In addition, it will
  allow human life to continue safely and pleasurably, as viewers can see, far in the background, people
  sailing and enjoying the water. If children’s wisdom and receptivity to images are present, this idealized
  picture has great appeal. Rather than a harsh rebuke for adult negligence, the lesson of Smokey relies
  on the power of rhetoric to modify behavior with specific, carefully crafted appeals. Yet the most frequently
  used slogan, “Only you can prevent forest fires,” is an example of hyperbole. Certainly “you” are not
  the sole person responsible for starting or preventing fires. Other people and other factors are at
