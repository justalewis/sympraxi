body: "<p>When writing about language, you don’t want to make the mistake of misusing language. <em>Homonyms</em>\
  \ are words that sound the same and are spelled the same but have different meanings. <em>Homographs</em>\
  \ are words that are spelled the same but may sound different and have different meanings. <em>Homophones</em>\
  \ are words that sound the same but might have a different spelling, a different meaning, or both. Because\
  \ they sound the same, they are often confused. Other words frequently confused sound slightly different\
  \ and have slightly different spellings. It’s important to recognize and correct commonly confused words\
  \ because spell checkers don’t always catch these errors.</p>\n<h2>Homonyms</h2>\n<p>Because homonyms’\
  \ spelling and pronunciation are the same but their meanings are different, you probably don’t have\
  \ to worry about misusing them, although they often belong to different parts of speech. However, some\
  \ awareness of homonyms and their multiple meanings will help ensure that your language is precise.\
  \ For more information about homonyms, see “Words and Language.”</p>\n<p>Here are some common homonyms\
  \ and their meanings:</p>\n<table><tr><td>band</td><td>Verb: to come together\n      Noun: group of\
  \ musicians</td></tr><tr><td>rock</td><td>Verb: to move back and forth\n      Noun: hard material found\
  \ in the earth</td></tr><tr><td>tire</td><td>Verb: to become sleepy or lose energy\n      Noun: ring-shaped\
  \ rubber component that fits over the wheel of a vehicle</td></tr><tr><td>current</td><td>Noun: flow\
  \ of water or electricity\n      Adjective: up to date</td></tr><tr><td>train</td><td>Verb: to teach\
  \ or learn through practice\n      Noun: group of connected railroad cars</td></tr></table>\n<h2>Homographs</h2>\n\
  <p>Homographs have the same spelling but different meanings. They are considered different from homonyms\
  \ because they may be pronounced differently. Some disagreement exists among scholars as to whether\
  \ pronunciation <em>must</em> be different for a word to be considered a homograph. Some experts insist\
  \ that origins must differ as well. However, all agree that meanings differ. For more information about\
  \ homographs, see Words and Language.</p>\n<p>Here are some common homographs and their meanings:</p>\n\
  <table><tr><td>lead</td><td>Noun: a metal (pronounced <em>led</em>)\n      Verb: to be at the front,\
  \ to guide (pronounced <em>leed</em>)</td></tr><tr><td>bow</td><td>Verb: to bend forward\n      Noun:\
  \ a position in which one bends forward\n      Noun: the front of a ship\n      Noun: a type of knot\
  \ (pronounced <em>boh</em>)</td></tr><tr><td>object</td><td>Noun: a material item; a grammatical term\
  \ (accent on first syllable)\n      Verb: to express disapproval (accent on second syllable)</td></tr><tr><td>close</td><td>Adjective:\
  \ near (<em>s</em> pronounced like <em>ss</em>)\n      Verb: to bar passage; to shut down (<em>s</em>\
  \ pronounced like <em>z</em>)</td></tr><tr><td>minute</td><td>Noun: 60 seconds (pronounced <em>minit</em>)\n\
  \      Adjective: tiny (pronounced <em>my-noot</em> or <em>my-nyoot</em>)</td></tr></table>\n<h2>Homophones</h2>\n\
  <p>Homophones are words that are spelled differently and have different meanings but sound the same.\
  \ Homophones are often the words that cause the most confusion and the most frequent errors. For more\
  \ information about homophones, see Words and Language.</p>\n<p>Here are some common homophones and\
  \ their meanings:</p>\n<table><tr><td>weather/whether</td><td><strong>Weather</strong> means the conditions\
  \ outside, such as temperature and sunshine.\n      <strong>Whether</strong> is a conjunction that joins\
  \ words or other parts of a sentence.</td></tr><tr><td>meat/meet</td><td><strong>Meat</strong> is animal-based\
  \ food.\n      When you <strong>meet</strong> someone, you encounter or get together with that person.</td></tr><tr><td>hear/here</td><td><strong>Hear</strong>\
  \ is what you do when you listen to music.\n      <strong>Here</strong> is a place nearby.</td></tr><tr><td>two/too/to</td><td><strong>Two</strong>\
  \ is a number, more than one and less than three.\n      <strong>Too</strong> may mean “also,” or it\
  \ may mean “very” or “more (adjective) than desired.”\n      <strong>To</strong> is a preposition indicating\
  \ direction or motion, as in “I wrote <strong>to</strong> the manager after I’d gone <strong>to</strong>\
  \ the office.”</td></tr></table>\n<p>The following homophones are often confused. Note that one of each\
  \ group is a <em>contraction</em>: two words shortened and joined by an apostrophe.</p>\n<table><tr><td>their</td><td>Possessive\
  \ pronoun, belonging to <em>them</em>: “The family packed <strong>their</strong> suitcases for <strong>their</strong>\
  \ vacation.” Both the suitcases and the vacation belong to the <em>family</em>.</td></tr><tr><td>they’re</td><td>Contraction\
  \ joining <em>they</em> and <em>are</em>: “<strong>They’re</strong> leaving for the airport at 10:30.”\
  \ In other words, <em>they are</em> leaving.</td></tr><tr><td>there</td><td>Referring to a location:\
  \ “‘Baggage claim is over <strong>there</strong>,’ the airport worker said while pointing to the baggage\
  \ carousels.” This form indicates a physical place.</td></tr><tr><td>your</td><td>Possessive pronoun,\
  \ belonging to <em>you</em>: “<strong>Your</strong> new phone will be mailed on November 4.” The phone\
  \ belongs to <em>you</em>.</td></tr><tr><td>you’re</td><td>Contraction joining <em>you</em> and <em>are</em>:\
  \ “<strong>You’re</strong> registered for the conference.” In other words, <em>you are</em> registered.</td></tr><tr><td>its</td><td>Possessive\
  \ pronoun, belonging to <em>it</em>: “<strong>Its</strong> positive qualities outweigh <strong>its</strong>\
  \ negative ones.” Both the positive and the negative qualities belong to <em>it</em>. <em>It</em> could\
  \ be a book, house, car, movie, phone, or any other object or idea.</td></tr><tr><td>it’s</td><td>Contraction\
  \ joining <em>it</em> and <em>is</em>: “<strong>It’s</strong> raining today.” In other words, <em>it\
  \ is</em> raining.</td></tr></table>\n<h2>What Is the <em>Effect</em>? Or Is It <em>Affect</em>?</h2>\n\
  <p>One final category of commonly confused words are words that sound and look <em>similar</em> but\
  \ have different meanings.</p>\n<table><tr><td>Affect</td><td>Verb: to influence an outcome: “Increasing\
  \ the minimum wage will <strong>affect</strong> the incomes of millions of Americans.”\n      Noun:\
  \ body language that accompanies an expression of emotion: “The crime victim showed normal reactions\
  \ and <strong>affects.”</strong></td></tr><tr><td>Effect</td><td>Noun: the outcome or result of an influence:\
  \ “The <strong>effect</strong> of the increased minimum wage will be a 10 percent decrease in the federal\
  \ poverty rate.”\n      Verb: to cause to come into existence: “Congress will <strong>effect</strong>\
  \ the new law.”</td></tr><tr><td>Insure</td><td>Verb: to protect against damage or loss: “Homeowners\
  \ must <strong>insure</strong> their property for the cost of full replacement.”</td></tr><tr><td>Ensure</td><td>Verb:\
  \ to make certain of: “This policy will <strong>ensure</strong> that the bank doesn’t incur a loss as\
  \ a result of irreparable damage to the home.”</td></tr></table>\n<h2>Practice</h2>\n<p>Choose the correct\
  \ word to complete each sentence.</p>\n<ol><li>Can you (hear/here) the phone ring from (hear/here)?</li><li>Are\
  \ you going (to/too/two) the movie theater at (to/too/two) p.m., or is that (to/too/two) early for you?</li><li>This\
  \ show always has a depressing (affect/effect) on me.</li><li>(Its/It’s) hard to find small apartments\
  \ for rent in this neighborhood.</li><li>Let’s (meet/meat) at the pizza place so that I can eat something\
  \ without (meet/meat).</li><li>Although it will need work, (its/it’s) basic structure is sound.</li><li>Check\
  \ about (ensuring/insuring) personal items in your apartment.</li><li>You can set the groceries on the\
  \ table over (their/there/they’re).</li><li>I’m going to watch the game at (their/there/they’re) house.</li><li>How\
  \ do you think the elections will (affect/effect) the neighborhood?</li><li>(Their/There/They’re) listening\
  \ to music on (their/there/they’re) headphones.</li><li>(You’re/Your) going to trip if you don’t tie\
  \ (you’re/your) shoelaces.</li><li>Bring (you’re/your) phone to the store to exchange it for a new one.</li><li>(Weather/whether)\
  \ we travel depends on the (weather/whether).</li></ol>"
