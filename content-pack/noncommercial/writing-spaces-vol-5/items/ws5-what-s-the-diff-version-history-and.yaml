  <p>Lindenman, Heather, Martin Camper, Lindsay Dunne Jacoby, and Jessica Enoch. “Revision and Reflection:
  A Study of (Dis)Connections between Writing Knowledge and Writing Practice.” College Composition and
  Communication, vol. 69, no. 4, June 2018, pp. 581-611.</p>

  <p>Sommers, Nancy. “Revision Strategies of Student Writers and Experienced Adult Writers.” College Composition
  and Communication, vol. 31, no. 4, Dec. 1980, pp. 378-88.</p>

  <p>Teacher Resources for “What’s the Diff? Version History and Revision Reflections”</p>

  <h3>Overview and Teaching Strategies</h3>

  <p>This essay is intended to support students in making conscious interventions in existing drafts,
  starting by exposing the specific textual changes from one draft to another: their “diffs.” For purposes
  of reflecting on past and current practices, the chapter may work best if read after students have already
  begun revising their compositions, as not everyone will have saved work from previous courses. On the
  other hand, it also encourages students to develop a writerly practice of recording revision intentions
  alongside each diff they recognize as significant enough to put a label on. Doing so effectively takes,
  well, practice, and so I would recommend starting relatively early.</p>

  <p>I have found that some feedback on version notes—see Supporting Exercise 2, below—can help students
  learn to write them in a way that still makes sense when read weeks later. Even stating that future-self
  as an audience, and reminding students of the goal of writing for that audience, seems to help over
  time. Early on, it can be helpful to model the process in real time (e.g. while revising something together
  in class), or in a screencast.</p>

  <p>Several pieces of comp/rhet scholarship inspired the ideas in this essay and could be similarly inspiring
  for students to read (or read excerpts from) alongside it. Nancy Sommers’ “Revision Strategies of Student
  Writers and Experienced Adult Writers” would be a natural companion, as I lean on Sommers’ analysis,
  but present only one finding from her complex article. Lindenman et al’s “Revision and Reflection: A
  Study of (Dis)Connections between Writing Knowledge and Writing Practice,” which in some ways prompted
  this piece’s deep dive into diffs for a student audience, could also work well for a Writing About Writing
  course. Finally, the Wendy Bishop chapter I mention, “Revising Out and Revising In,” from her collection
  Acts of Revision, is written with an undergraduate audience in mind and offers over 70 suggestions for
  revision moves, many with fun names. I have often asked my students to pick three of Bishop’s exercises,
  try them in their current drafts, and then discuss in the next class or their final reflections what
  happened: Would they try it again? At the same or a different point in the process? Why?</p>

  <h3>Discussion Questions</h3>

  <p>1. Which of the revision “moves” described in the essay have you tried in your own writing, and which
  might you want to try? Are there any you’re familiar with, but you think of through different names?
  How might the names you choose help you think through the move at different scales (word, sentence,
  paragraph, section, etc.)?</p>

  <p>2. This essay sometimes treats revision through a mathematical metaphor: addition, subtraction, substitution,
  reordering, and regrouping are all things we can do in algebra as well as writing. Are there any other
  operations or relationships from math that might be relevant to how you think about writing and revision?
  e.g. What would a distributive property look like in a sentence, or an essay? Are there times you might
  want to multiply, or to divide?</p>

  <p>3. Figure 1 includes a variety of version names, also known as “commit” messages: (a) “just a little
  note-to-self”; (b) “added a list of revision strategies. next: name your own! swap with friends!”; (c)
  “finished section on examples of diffs, strategies they teach”; (d) “add intro motivating new section
  (and signposting what comes next)”; (e) “August 27, 2:58 PM.” Which messages tell you the most about
  the goals or the content of the revision? Which tell you the least?</p>

  <h3>Supporting Activities</h3>

  <p>1. Look at your own diffs between drafts of a recent project. What revision operations (addition,
  subtraction, substitution, reordering, regrouping) can you see, at what scales (word/phrase, clause,
  sentence, paragraph, section)? Try to remember what your goals were in making those changes. Do your
  revision history and your goals primarily match those of the students or the experienced writers in
  Sommers’ study, at least as Miller has summarized them here?</p>

  <p>2. Trade revision histories with a partner and read through the topline version names / “commit”
  messages. Can you tell what your partner was changing, or why? At what scale (word/phrase, clause, sentence,
  paragraph, section) would you expect to see those changes? Make a note of particularly clear messages,
  where you get a sense not only of what changed, but why: i.e. what the goal of that revision was for
  your partner. Also make a note of any vague messages, i.e. messages telling you only that something
  changed, but not what. Share these new notes with your partner, and see if you can together rewrite
  any vague messages to be more like the clear ones.</p>

  <p>3. To increase your experience with large-scale structural revision (reordering and regrouping at
  the paragraph level and above), try a reverse sentence outline on index cards. The key difference between
  this and a more traditional outline is that, rather than listing broad topics (e.g. “senior year of
  high school”) or inert evidence (e.g. “questions on AP exams”), you’re listing thoughts, claims, and
  questions (e.g. “AP exam questions were open-ended, requiring me to decide on my own what information
  was relevant”). The “reverse” part means that you’re outlining a draft that already exists, rather than
  projecting into the future of a draft you have yet to write.</p>

  <p>To make a sentence outline, follow these steps: (1) Number the paragraphs in your draft. (2) Read
  through your draft, looking for your key points—moments where the thinking moves or the essay turns.
  Each time you find one, write it onto its own index card as a single full sentence. Leave out transitions
  (e.g. “for example”). If you find you need to compose a new sentence to capture the thought, do so.
  If a point takes two sentences, use two cards. (Note that instead of using index cards, you could copy
  all these sentences onto a single sheet of paper. This has the advantage of keeping everything together,
  making it easier to see the shape of your essay. But it also has the disadvantage of keeping everything
  together, making it harder to re-see the shape of your essay.) (3) As you go, on the back of each card,
  write the number of the paragraph that this idea appeared in. You may have one of these key ideas per
  paragraph, or two, or three, or none. This in itself is useful information to have; it will help you
  regroup or consolidate or expand.</p>

  <p>Congratulations! With these cards in order, you’ve produced a basic sentence outline of the thinking
  moves and turning points in your essay. But noticing the structure as it exists is only one step in
  re-seeing; to see it as it might exist, continue with the next several steps. (4) On the back of each
  card, write a letter that will help you recover this original order: that is, label the first card A,
  the second card B, the third C, etc. If you have more than 26 cards, continue with A'', B'', etc. This
  is important because of the next step, which is to (5) shuffle the cards, then flip them back to the
  front (where the sentences are). Rearrange them in such a way as to make a logical paragraph, or short
  set of paragraphs. If you need to add any new sentences to fill in gaps, do so on new cards, still with
  one card per sentence and one sentence per card. If some cards don’t fit into your new paragraph, or
  merely duplicate other cards, you can leave them out. (6) When you are done, write down the new sequence
  of letters in your notebook, so you can recover this revised order. (7) Compare the results of steps
  4 and 6. Based on any reorderings, additions, or subtractions you’ve made to the sentence outline, what
  reorderings, additions, or subtractions does that suggest for the essay as a whole? Based on your information
  from step 3, are there any paragraphs you’d like to combine and consolidate? Are there any paragraph
  breaks you might now add, to highlight your thinking moves?</p>'
